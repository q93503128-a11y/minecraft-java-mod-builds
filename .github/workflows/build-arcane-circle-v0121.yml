name: Build Arcane Circle v0.12.1 Alpha.10 World Scale

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/**'
      - '.github/workflows/build-arcane-circle-v0121.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-v0121-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/arcane-circle
  MOD_VERSION: 0.12.1-alpha.10
  EXPECTED_JAR: arcanecircle-0.12.1-alpha.10.jar
  PUBLISHED_DIR: published/arcane-circle
  CI_RESULT_DIR: ci-results/arcane-circle

jobs:
  build:
    name: Java 25 - world scale, factions, encounters and equipment
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Install alpha.10 world scale and faction expansion
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if test -f tools/apply_v0121_alpha10_world_scale_factions.py; then
            python3 tools/apply_v0121_alpha10_world_scale_factions.py 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-migration.log"
          else
            cat tools/alpha10_chunks/part* > /tmp/apply_v0121_alpha10_world_scale_factions.py
            printf '%s  %s\n' 'c82962ec1fd605e1906e6e5150edb55ca8707378a03da103ef2f759c9c8ca292' '/tmp/apply_v0121_alpha10_world_scale_factions.py' | sha256sum -c -
            cp /tmp/apply_v0121_alpha10_world_scale_factions.py tools/apply_v0121_alpha10_world_scale_factions.py
            python3 tools/apply_v0121_alpha10_world_scale_factions.py 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-migration.log"
            rm -rf tools/alpha10_chunks
          fi
          python3 tools/fix_v0121_alpha10_compile.py
          python3 tools/test_v0121_alpha10_world_scale_factions.py
          git diff --check

      - name: Build Java 25 runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-gradle.log"

      - name: Verify alpha.10 JAR contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          jar = Path('build/libs/arcanecircle-0.12.1-alpha.10.jar')
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              required = {
                  'kr/moonseungjun/arcanecircle/magic/RpgScaleService.class',
                  'kr/moonseungjun/arcanecircle/magic/SpellMetrics.class',
                  'kr/moonseungjun/arcanecircle/world/ArcaneEncounterData.class',
                  'kr/moonseungjun/arcanecircle/world/ArcaneEncounterService.class',
                  'kr/moonseungjun/arcanecircle/world/FactionProfile.class',
                  'kr/moonseungjun/arcanecircle/client/MageGearTooltip.class',
                  'assets/arcanecircle/textures/item/cinder_robe.png',
                  'assets/arcanecircle/textures/item/glacier_robe.png',
                  'assets/arcanecircle/textures/item/tempest_robe.png',
                  'assets/arcanecircle/textures/item/rift_robe.png',
                  'assets/arcanecircle/textures/item/rift_boots.png',
              }
              missing = required - names
              if missing:
                  raise SystemExit(f'missing alpha.10 runtime entries: {sorted(missing)}')

              vitality = z.read('kr/moonseungjun/arcanecircle/magic/ArcaneVitalityService.class')
              if b'RPG_POINTS_PER_VANILLA_HEALTH' not in vitality:
                  raise SystemExit('20-to-100 vitality conversion missing')

              scale = z.read('kr/moonseungjun/arcanecircle/magic/RpgScaleService.class')
              for token in (b'arcanecircle_rpg_scaled', b'MAX_HEALTH'):
                  if token not in scale:
                      raise SystemExit(f'RPG world scaling missing: {token!r}')

              encounters = z.read('kr/moonseungjun/arcanecircle/world/ArcaneEncounterService.class')
              for token in ('균열 황야', '빙결 묘역', '별먹는 심연', 'arcanecircle_boss_'):
                  if token.encode('utf-8') not in encounters:
                      raise SystemExit(f'encounter content missing: {token}')

              quests = z.read('kr/moonseungjun/arcanecircle/world/ArcaneQuestData.class')
              for token in ('견습', '전설', '재앙'):
                  if token.encode('utf-8') not in quests:
                      raise SystemExit(f'fixed quest difficulty missing: {token}')

              gear = z.read('kr/moonseungjun/arcanecircle/magic/MageGearService.class')
              for token in (b'RIFT_BOOTS', b'mayfly', b'CINDER_ROBE', b'TEMPEST_ROBE'):
                  if token not in gear:
                      raise SystemExit(f'expanded gear runtime missing: {token!r}')

              renderer = z.read('kr/moonseungjun/arcanecircle/client/WorldMagicTracker.class')
              for token in (b'effectRadius', b'waveEndRadius'):
                  if token not in renderer:
                      raise SystemExit(f'visual and hit range contract missing: {token!r}')
          print('Arcane Circle alpha.10 JAR audit: PASS')
          PY
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.12.1-alpha.10
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Arcane source and JAR only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          touch "$PROJECT_DIR/.gitignore"
          grep -qxF '.gradle/' "$PROJECT_DIR/.gitignore" || printf '%s\n' '.gradle/' >> "$PROJECT_DIR/.gitignore"
          grep -qxF 'build/' "$PROJECT_DIR/.gitignore" || printf '%s\n' 'build/' >> "$PROJECT_DIR/.gitignore"
          rm -rf /tmp/arcane-alpha10-source
          mkdir -p /tmp/arcane-alpha10-source
          rsync -a --delete --exclude '/build/' --exclude '/.gradle/' "$PROJECT_DIR/" /tmp/arcane-alpha10-source/
          published=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"
            rsync -a /tmp/arcane-alpha10-source/ "$PROJECT_DIR/"
            mkdir -p "$PUBLISHED_DIR"
            rm -f "$PUBLISHED_DIR"/arcanecircle-*.jar "$PUBLISHED_DIR"/arcanecircle-*.jar.sha256
            cp "deliverables/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
            cp "deliverables/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
            git add -A "$PROJECT_DIR" "$PUBLISHED_DIR"
            if git diff --cached --quiet; then published=1; break; fi
            git commit -m 'Publish Arcane Circle v0.12.1-alpha.10 world scale and faction expansion [skip ci]'
            if git push origin HEAD:main; then published=1; break; fi
            sleep $((attempt * 2))
          done
          test "$published" -eq 1

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arcane-result
          mkdir -p /tmp/arcane-result
          if test -f "$GITHUB_WORKSPACE/arcane-circle-gradle.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-gradle.log" /tmp/arcane-result/latest-gradle.log
          elif test -f "$GITHUB_WORKSPACE/arcane-circle-migration.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-migration.log" /tmp/arcane-result/latest-gradle.log
          else
            printf '%s\n' 'No diagnostic log.' > /tmp/arcane-result/latest-gradle.log
          fi
          cat > /tmp/arcane-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=$MOD_VERSION
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/arcane-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane Circle v0.12.1-alpha.10 CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
