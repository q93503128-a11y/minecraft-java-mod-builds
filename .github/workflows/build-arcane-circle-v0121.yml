name: Build Arcane Circle v0.12.1 Alpha.7 Progression and Quest Board

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/**'
      - '.github/workflows/build-arcane-circle-v0121.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-v0121-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/arcane-circle
  MOD_VERSION: 0.12.1-alpha.7
  EXPECTED_JAR: arcanecircle-0.12.1-alpha.7.jar
  PUBLISHED_DIR: published/arcane-circle
  CI_RESULT_DIR: ci-results/arcane-circle

jobs:
  build:
    name: Java 25 direct build - progression, quests, factions, gear and threat economy
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Preserve older hierarchy and alpha.6 gameplay contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^mod_version=0.12.1-alpha.5$' gradle.properties; then
            python3 tools/apply_v0121_alpha5_hierarchy_v2.py 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-migration.log"
            python3 tools/test_magic_contract.py
            python3 tools/test_v12_overhaul.py
            python3 tools/test_v12_1_cleanup.py
            python3 tools/test_v0121_alpha3_geometry_perf.py
            python3 tools/test_v0121_alpha4_society.py
            python3 tools/test_v0121_alpha5_hierarchy.py
          fi
          if grep -Eq '^mod_version=0.12.1-alpha.[56]$' gradle.properties; then
            python3 tools/apply_v0121_alpha6_fusion_gear.py 2>&1 | tee -a "$GITHUB_WORKSPACE/arcane-circle-migration.log"
          fi
          if grep -q '^mod_version=0.12.1-alpha.6$' gradle.properties; then
            python3 tools/test_v0121_alpha6_fusion_gear.py
          fi
          git diff --check

      - name: Install and audit alpha.7 progression and quest rules
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          if grep -q '^mod_version=0.12.1-alpha.6$' gradle.properties; then
            python3 tools/apply_v0121_alpha7_progression_quests.py 2>&1 | tee -a "$GITHUB_WORKSPACE/arcane-circle-migration.log"
          fi
          python3 tools/test_v0121_alpha7_progression_quests.py
          git diff --check

      - name: Build Java 25 runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-gradle.log"

      - name: Verify alpha.7 JAR structure and rendering safety
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          jar = Path('build/libs/arcanecircle-0.12.1-alpha.7.jar')
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              required = {
                  'kr/moonseungjun/arcanecircle/client/ArcaneClient.class',
                  'kr/moonseungjun/arcanecircle/client/GrimoireScreen.class',
                  'kr/moonseungjun/arcanecircle/client/WorldMagicTracker.class',
                  'kr/moonseungjun/arcanecircle/magic/ArcaneDamage.class',
                  'kr/moonseungjun/arcanecircle/magic/CombatGrowthService.class',
                  'kr/moonseungjun/arcanecircle/magic/CombatGrowthService$Impact.class',
                  'kr/moonseungjun/arcanecircle/magic/MageGearService.class',
                  'kr/moonseungjun/arcanecircle/magic/MageGearService$GearStats.class',
                  'kr/moonseungjun/arcanecircle/network/QuestActionPayload.class',
                  'kr/moonseungjun/arcanecircle/world/ArcaneQuestData.class',
                  'kr/moonseungjun/arcanecircle/world/MagicTradition.class',
                  'kr/moonseungjun/arcanecircle/world/ArcaneMageService.class',
              }
              for item_id in (
                  'sage_hat', 'sage_robe', 'sage_robe_hem', 'skywalker_boots',
                  'archmage_crown', 'archmage_robe', 'archmage_robe_hem', 'froststep_boots'
              ):
                  required.add(f'assets/arcanecircle/items/{item_id}.json')
                  required.add(f'assets/arcanecircle/models/item/{item_id}.json')
              missing = required - names
              if missing:
                  raise SystemExit(f'missing alpha.7 runtime entries: {sorted(missing)}')

              client = z.read('kr/moonseungjun/arcanecircle/client/ArcaneClient.class')
              for forbidden in (b'fusion_modifier', b'FUSION_MODIFIER_KEY'):
                  if forbidden in client:
                      raise SystemExit(f'obsolete X fusion input remains: {forbidden!r}')
              for token in (b'primarySlot', b'fusionChord'):
                  if token not in client:
                      raise SystemExit(f'number-key chord state missing: {token!r}')

              gear = z.read('kr/moonseungjun/arcanecircle/magic/MageGearService.class')
              for token in (b'froststep_boots', b'FROSTED_ICE', b'SLOW_FALLING'):
                  if token not in gear:
                      raise SystemExit(f'tiered gear bytecode missing: {token!r}')

              combat = z.read('kr/moonseungjun/arcanecircle/magic/CombatGrowthService.class')
              for token in (b'threatScore', b'combatValue', b'ATTACK_DAMAGE'):
                  if token not in combat:
                      raise SystemExit(f'threat economy bytecode missing: {token!r}')

              quest = z.read('kr/moonseungjun/arcanecircle/world/ArcaneQuestData.class')
              for token in (b'acceptOffer', b'rejectOffer', b'offerStatus'):
                  if token not in quest:
                      raise SystemExit(f'quest board bytecode missing: {token!r}')

              damage = z.read('kr/moonseungjun/arcanecircle/magic/ArcaneDamage.class')
              for token in (b'playerAttack', b'mobAttack', b'setTarget'):
                  if token not in damage:
                      raise SystemExit(f'attributed damage bytecode missing: {token!r}')

              offenders = []
              for name in names:
                  if name.startswith('kr/moonseungjun/arcanecircle/magic/') and name.endswith('.class'):
                      if b'sendParticles' in z.read(name):
                          offenders.append(name)
              if offenders:
                  raise SystemExit(f'particle-centered magic bytecode remains: {offenders}')
          print('Arcane Circle alpha.7 JAR audit: PASS')
          PY
          javap -classpath "build/libs/$EXPECTED_JAR" -c -p \
            kr.moonseungjun.arcanecircle.client.WorldMagicTracker \
            kr.moonseungjun.arcanecircle.client.SignatureGeometry \
            > "$GITHUB_WORKSPACE/arcane-circle-javap.txt"
          if grep -E 'Shapes\.(or|joinUnoptimized)' "$GITHUB_WORKSPACE/arcane-circle-javap.txt"; then
            echo 'Combinatorial VoxelShape boolean operation remains in renderer bytecode.' >&2
            exit 1
          fi
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.12.1-alpha.7
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish source and JAR without touching concurrent projects
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          touch "$PROJECT_DIR/.gitignore"
          grep -qxF '.gradle/' "$PROJECT_DIR/.gitignore" || printf '%s\n' '.gradle/' >> "$PROJECT_DIR/.gitignore"
          grep -qxF 'build/' "$PROJECT_DIR/.gitignore" || printf '%s\n' 'build/' >> "$PROJECT_DIR/.gitignore"
          rm -rf /tmp/arcane-v0121-source
          mkdir -p /tmp/arcane-v0121-source
          rsync -a --delete --exclude '/build/' --exclude '/.gradle/' "$PROJECT_DIR/" /tmp/arcane-v0121-source/
          published=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"
            rsync -a /tmp/arcane-v0121-source/ "$PROJECT_DIR/"
            mkdir -p "$PUBLISHED_DIR"
            rm -f "$PUBLISHED_DIR"/arcanecircle-*.jar "$PUBLISHED_DIR"/arcanecircle-*.jar.sha256
            cp "deliverables/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
            cp "deliverables/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
            git add -A "$PROJECT_DIR" "$PUBLISHED_DIR"
            if git diff --cached --quiet; then published=1; break; fi
            git commit -m 'Publish Arcane Circle v0.12.1-alpha.7 progression and quest board [skip ci]'
            if git push origin HEAD:main; then published=1; break; fi
            sleep $((attempt * 2))
          done
          test "$published" -eq 1

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arcane-result
          mkdir -p /tmp/arcane-result
          if test -f "$GITHUB_WORKSPACE/arcane-circle-gradle.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-gradle.log" /tmp/arcane-result/latest-gradle.log
          elif test -f "$GITHUB_WORKSPACE/arcane-circle-migration.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-migration.log" /tmp/arcane-result/latest-gradle.log
          else
            printf '%s\n' 'No diagnostic log.' > /tmp/arcane-result/latest-gradle.log
          fi
          if test -f "$GITHUB_WORKSPACE/arcane-circle-javap.txt"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-javap.txt" /tmp/arcane-result/latest-javap.txt
          fi
          cat > /tmp/arcane-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=$MOD_VERSION
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/arcane-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane Circle v0.12.1-alpha.7 CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
