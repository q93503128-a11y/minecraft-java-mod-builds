name: Build Arcane Circle v0.12.1 Alpha.8 Continuous Magic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/**'
      - '.github/workflows/build-arcane-circle-v0121.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-v0121-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/arcane-circle
  MOD_VERSION: 0.12.1-alpha.8
  EXPECTED_JAR: arcanecircle-0.12.1-alpha.8.jar
  PUBLISHED_DIR: published/arcane-circle
  CI_RESULT_DIR: ci-results/arcane-circle

jobs:
  build:
    name: Java 25 - continuous circles, mage gear and RPG vitality
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Install deterministic alpha.8 resources and source patches
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/fix_v0121_alpha8_mappings.py
          python3 tools/apply_v0121_alpha8_visual_vitality.py 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-migration.log"
          python3 tools/test_v0121_alpha8_visual_vitality.py
          git diff --check

      - name: Build Java 25 runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-gradle.log"

      - name: Verify alpha.8 JAR and renderer bytecode
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          jar = Path('build/libs/arcanecircle-0.12.1-alpha.8.jar')
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              required = {
                  'kr/moonseungjun/arcanecircle/client/ArcaneWorldMesh.class',
                  'kr/moonseungjun/arcanecircle/client/ArcaneWorldMesh$Builder.class',
                  'kr/moonseungjun/arcanecircle/client/ArcaneGearRenderer.class',
                  'kr/moonseungjun/arcanecircle/client/WorldMagicTracker.class',
                  'kr/moonseungjun/arcanecircle/client/SignatureGeometry.class',
                  'kr/moonseungjun/arcanecircle/magic/ArcaneVitalityService.class',
                  'kr/moonseungjun/arcanecircle/registry/ArcaneArmorMaterials.class',
                  'assets/arcanecircle/equipment/mage.json',
                  'assets/arcanecircle/equipment/sage.json',
                  'assets/arcanecircle/equipment/archmage.json',
                  'assets/arcanecircle/textures/entity/equipment/humanoid/mage/outer.png',
                  'assets/arcanecircle/textures/entity/equipment/humanoid/sage/outer.png',
                  'assets/arcanecircle/textures/entity/equipment/humanoid/archmage/outer.png',
                  'assets/arcanecircle/textures/item/mage_hat.png',
                  'assets/arcanecircle/textures/item/sage_robe.png',
                  'assets/arcanecircle/textures/item/froststep_boots.png',
              }
              missing = required - names
              if missing:
                  raise SystemExit(f'missing alpha.8 runtime entries: {sorted(missing)}')

              for class_name in (
                  'kr/moonseungjun/arcanecircle/client/WorldMagicTracker.class',
                  'kr/moonseungjun/arcanecircle/client/SignatureGeometry.class'):
                  bytecode = z.read(class_name)
                  for forbidden in (b'VoxelShape', b'submitShapeOutline', b'Shapes', b'AABB'):
                      if forbidden in bytecode:
                          raise SystemExit(f'pixel-box renderer remains in {class_name}: {forbidden!r}')

              mesh = z.read('kr/moonseungjun/arcanecircle/client/ArcaneWorldMesh.class')
              for token in (b'submitCustomGeometry', b'setLineWidth', b'submitPass'):
                  if token not in mesh:
                      raise SystemExit(f'continuous mesh bytecode missing: {token!r}')

              hud = z.read('kr/moonseungjun/arcanecircle/client/ArcaneHud.class')
              for token in (b'PLAYER_HEALTH', b'drawHealth', b'health_max'):
                  if token not in hud:
                      raise SystemExit(f'RPG health HUD bytecode missing: {token!r}')

              vitality = z.read('kr/moonseungjun/arcanecircle/magic/ArcaneVitalityService.class')
              for token in (b'effectiveMaxHealth', b'convertToVanilla', b'onIncomingDamage'):
                  if token not in vitality:
                      raise SystemExit(f'vitality bytecode missing: {token!r}')

              offenders = []
              for name in names:
                  if name.startswith('kr/moonseungjun/arcanecircle/magic/') and name.endswith('.class'):
                      if b'sendParticles' in z.read(name):
                          offenders.append(name)
              if offenders:
                  raise SystemExit(f'particle-centered magic bytecode remains: {offenders}')
          print('Arcane Circle alpha.8 JAR audit: PASS')
          PY
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.12.1-alpha.8
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Arcane source and JAR only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          touch "$PROJECT_DIR/.gitignore"
          grep -qxF '.gradle/' "$PROJECT_DIR/.gitignore" || printf '%s\n' '.gradle/' >> "$PROJECT_DIR/.gitignore"
          grep -qxF 'build/' "$PROJECT_DIR/.gitignore" || printf '%s\n' 'build/' >> "$PROJECT_DIR/.gitignore"
          rm -rf /tmp/arcane-alpha8-source
          mkdir -p /tmp/arcane-alpha8-source
          rsync -a --delete --exclude '/build/' --exclude '/.gradle/' "$PROJECT_DIR/" /tmp/arcane-alpha8-source/
          published=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"
            rsync -a /tmp/arcane-alpha8-source/ "$PROJECT_DIR/"
            mkdir -p "$PUBLISHED_DIR"
            rm -f "$PUBLISHED_DIR"/arcanecircle-*.jar "$PUBLISHED_DIR"/arcanecircle-*.jar.sha256
            cp "deliverables/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
            cp "deliverables/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
            git add -A "$PROJECT_DIR" "$PUBLISHED_DIR"
            if git diff --cached --quiet; then published=1; break; fi
            git commit -m 'Publish Arcane Circle v0.12.1-alpha.8 continuous magic [skip ci]'
            if git push origin HEAD:main; then published=1; break; fi
            sleep $((attempt * 2))
          done
          test "$published" -eq 1

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arcane-result
          mkdir -p /tmp/arcane-result
          if test -f "$GITHUB_WORKSPACE/arcane-circle-gradle.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-gradle.log" /tmp/arcane-result/latest-gradle.log
          elif test -f "$GITHUB_WORKSPACE/arcane-circle-migration.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-migration.log" /tmp/arcane-result/latest-gradle.log
          else
            printf '%s\n' 'No diagnostic log.' > /tmp/arcane-result/latest-gradle.log
          fi
          cat > /tmp/arcane-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=$MOD_VERSION
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/arcane-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane Circle v0.12.1-alpha.8 CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
