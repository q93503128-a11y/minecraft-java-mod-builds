name: Build Arcane Circle v0.12.1 Alpha.14

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/**'
      - '.github/workflows/build-arcane-circle-v0121.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-v0121-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/arcane-circle
  MOD_VERSION: 0.12.1-alpha.14
  EXPECTED_JAR: arcanecircle-0.12.1-alpha.14.jar
  PUBLISHED_DIR: published/arcane-circle
  CI_RESULT_DIR: ci-results/arcane-circle

jobs:
  build:
    name: Java 25 - reduction layers and authored spell forms
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply alpha.14 authored spell-form overhaul
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v0121_alpha14_visual_architecture.py 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-migration.log"
          python3 tools/test_v0121_alpha14_visual_architecture.py
          git diff --check

      - name: Build Java 25 runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-gradle.log"

      - name: Verify alpha.14 JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          jar tf "build/libs/$EXPECTED_JAR" >/dev/null
          sha256sum "build/libs/$EXPECTED_JAR" > "build/libs/$EXPECTED_JAR.sha256"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          jar = Path('build/libs/arcanecircle-0.12.1-alpha.14.jar')
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              required = {
                  'kr/moonseungjun/arcanecircle/magic/MagicPlayerData.class',
                  'kr/moonseungjun/arcanecircle/magic/SpellCastingService.class',
                  'kr/moonseungjun/arcanecircle/client/WorldMagicTracker.class',
                  'kr/moonseungjun/arcanecircle/client/ArcaneWorldMesh.class',
              }
              missing = required - names
              if missing:
                  raise SystemExit(f'missing alpha.14 runtime entries: {sorted(missing)}')

              renderer = z.read('kr/moonseungjun/arcanecircle/client/WorldMagicTracker.class')
              for token in (b'METEOR_FORMS', b'PORTAL_FORMS', b'PRISON_FORMS',
                            b'WALL_FORMS', b'buildMeteor', b'buildPortal', b'buildPrison',
                            b'buildWall', b'buildStorm', b'buildMissileSwarm',
                            b'buildElementalOrb', b'buildLance'):
                  if token not in renderer:
                      raise SystemExit(f'authored visual family missing: {token!r}')
          print('Arcane Circle alpha.14 JAR audit: PASS')
          PY
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.12.1-alpha.14
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified source and JAR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          touch "$PROJECT_DIR/.gitignore"
          grep -qxF '.gradle/' "$PROJECT_DIR/.gitignore" || printf '%s\n' '.gradle/' >> "$PROJECT_DIR/.gitignore"
          grep -qxF 'build/' "$PROJECT_DIR/.gitignore" || printf '%s\n' 'build/' >> "$PROJECT_DIR/.gitignore"
          rm -rf /tmp/arcane-alpha14-source
          mkdir -p /tmp/arcane-alpha14-source
          rsync -a --delete --exclude '/build/' --exclude '/.gradle/' "$PROJECT_DIR/" /tmp/arcane-alpha14-source/
          published=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"
            rsync -a /tmp/arcane-alpha14-source/ "$PROJECT_DIR/"
            mkdir -p "$PUBLISHED_DIR"
            rm -f "$PUBLISHED_DIR"/arcanecircle-*.jar "$PUBLISHED_DIR"/arcanecircle-*.jar.sha256
            cp "deliverables/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
            cp "deliverables/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
            git add -A "$PROJECT_DIR" "$PUBLISHED_DIR"
            if git diff --cached --quiet; then published=1; break; fi
            git commit -m 'Publish Arcane Circle v0.12.1-alpha.14 authored spell forms [skip ci]'
            if git push origin HEAD:main; then published=1; break; fi
            sleep $((attempt * 2))
          done
          test "$published" -eq 1

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arcane-result
          mkdir -p /tmp/arcane-result
          if test -f "$GITHUB_WORKSPACE/arcane-circle-gradle.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-gradle.log" /tmp/arcane-result/latest-gradle.log
          elif test -f "$GITHUB_WORKSPACE/arcane-circle-migration.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-migration.log" /tmp/arcane-result/latest-gradle.log
          else
            printf '%s\n' 'No diagnostic log.' > /tmp/arcane-result/latest-gradle.log
          fi
          cat > /tmp/arcane-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=$MOD_VERSION
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/arcane-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane Circle v0.12.1-alpha.14 CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
