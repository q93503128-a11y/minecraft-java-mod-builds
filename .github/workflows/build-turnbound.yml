name: Build TURNBOUND (Fabric migration)

on:
  push:
    branches:
      - turnbound-content-rebuild
    paths:
      - 'projects/turnbound/**'
      - '.github/workflows/build-turnbound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Run read-only map audit fixtures
        working-directory: projects/turnbound
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Compile and execute loader-independent combat
        working-directory: projects/turnbound
        run: |
          set -euo pipefail
          mkdir -p build/portable-combat
          javac -d build/portable-combat src/fabric/java/io/github/q93503128/turnbound/combat/*.java \
            src/fabricTest/standalone/io/github/q93503128/turnbound/combat/GenericBattleSelfTest.java
          java -cp build/portable-combat io.github.q93503128.turnbound.combat.GenericBattleSelfTest

  fabric-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Validate Fabric source and tests
        working-directory: projects/turnbound
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_*.py'
          gradle test build --no-daemon --stacktrace | tee gradle-build.log
      - name: Verify produced Fabric JAR
        working-directory: projects/turnbound
        run: |
          set -euo pipefail
          jar_file="build/libs/turnbound-$(sed -n 's/^mod_version=//p' gradle.properties).jar"
          test -s "$jar_file"
          jar tf "$jar_file" > jar-contents.txt
          grep -qx 'fabric.mod.json' jar-contents.txt
          grep -qx 'io/github/q93503128/turnbound/Turnbound.class' jar-contents.txt
          grep -qx 'io/github/q93503128/turnbound/combat/TurnScheduler.class' jar-contents.txt
          if grep -Eq 'neoforge|META-INF/neoforge.mods.toml|DrehmalAutoInstaller|AsterMarch' jar-contents.txt; then
            echo 'Legacy NeoForge/Drehmal runtime leaked into Fabric JAR'
            exit 1
          fi
          sha256sum "$jar_file" | tee "$jar_file.sha256"
      - name: Collect logs
        if: always()
        working-directory: projects/turnbound
        run: |
          mkdir -p build/release
          test -f gradle-build.log || echo 'NOT RUN' > gradle-build.log
          zip -q build/release/raw-logs.zip gradle-build.log || true
      - name: Upload migration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnbound-fabric-migration-checkpoint
          path: |
            projects/turnbound/build/libs/*.jar
            projects/turnbound/build/libs/*.jar.sha256
            projects/turnbound/build/release/raw-logs.zip
          if-no-files-found: warn
