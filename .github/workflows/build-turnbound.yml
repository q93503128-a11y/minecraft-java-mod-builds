name: Build TURNBOUND

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/turnbound/**'
      - '.github/workflows/build-turnbound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Test and build TURNBOUND
        working-directory: projects/turnbound
        run: gradle clean test build --stacktrace
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: turnbound-alpha2
          path: projects/turnbound/build/libs/*.jar
          if-no-files-found: error
