name: Build TURNBOUND

on:
  push:
    branches:
      - main
      - turnbound-alpha17-full-v04
    paths:
      - 'projects/turnbound/**'
      - '.github/workflows/build-turnbound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Test and build TURNBOUND
        working-directory: projects/turnbound
        run: gradle clean test build oneClickPack --stacktrace
      - name: Smoke-test NeoForge server load
        working-directory: projects/turnbound
        run: |
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          setsid gradle runServer --no-daemon > server-smoke.log 2>&1 &
          pid=$!
          started=0
          for i in $(seq 1 120); do
            if grep -q 'Done (' server-smoke.log; then
              started=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat server-smoke.log
          test "$started" -eq 1
          kill -TERM -- "-$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
      - name: Verify built JAR
        working-directory: projects/turnbound
        run: |
          expected_version="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          jar_file="build/libs/turnbound-${expected_version}.jar"
          test -f "$jar_file"
          echo "Verifying $jar_file"
          jar tf "$jar_file" > jar-contents.txt
          grep -qx 'META-INF/neoforge.mods.toml' jar-contents.txt
          grep -qx 'io/github/q93503128/turnbound/Turnbound.class' jar-contents.txt
          grep -qx 'data/turnbound/characters/v04.json' jar-contents.txt
          grep -qx 'data/turnbound/enemies/v04.json' jar-contents.txt
          grep -qx 'data/turnbound/equipment/v04.json' jar-contents.txt
          grep -qx 'data/turnbound/battles/v04.json' jar-contents.txt
          unzip -p "$jar_file" META-INF/neoforge.mods.toml > built-neoforge.mods.toml
          grep -Eq 'modId[[:space:]]*=[[:space:]]*"turnbound"' built-neoforge.mods.toml
          grep -Fq "version=\"${expected_version}\"" <(tr -d ' ' < built-neoforge.mods.toml)
          unzip -p "$jar_file" META-INF/MANIFEST.MF > built-manifest.mf
          grep -q '^Implementation-Title: TURNBOUND' built-manifest.mf
          grep -Fq "Implementation-Version: ${expected_version}" built-manifest.mf
          sha256sum "$jar_file"
      - name: Verify one-click Modrinth pack
        working-directory: projects/turnbound
        run: |
          expected_version="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          pack_file="build/distributions/TURNBOUND-oneclick-${expected_version}.mrpack"
          test -f "$pack_file"
          unzip -l "$pack_file" > mrpack-contents.txt
          grep -q 'modrinth.index.json' mrpack-contents.txt
          grep -q 'overrides/config/turnbound/one_click_drehmal.txt' mrpack-contents.txt
          grep -q "overrides/mods/turnbound-${expected_version}.jar" mrpack-contents.txt
          grep -Eq 'overrides/mods/.*geckolib.*\.jar' mrpack-contents.txt
          grep -q 'overrides/licenses/GeckoLib-MIT.txt' mrpack-contents.txt
          ! grep -Eq 'shard_[123]\.zip|resources\.zip' mrpack-contents.txt
          unzip -p "$pack_file" modrinth.index.json > built-modrinth.index.json
          python3 - <<'PY'
          import json
          with open('built-modrinth.index.json', encoding='utf-8') as f:
              data=json.load(f)
          assert data['formatVersion'] == 1
          assert data['dependencies']['minecraft'] == '26.2'
          assert data['dependencies']['neoforge'] == '26.2.0.62'
          assert data['files'] == []
          PY
          echo "Verifying $pack_file"
          sha256sum "$pack_file"
      - name: Upload JAR and one-click pack
        uses: actions/upload-artifact@v4
        with:
          name: turnbound-v04-workbranch
          path: |
            projects/turnbound/build/libs/*.jar
            projects/turnbound/build/distributions/*.mrpack
          if-no-files-found: error
