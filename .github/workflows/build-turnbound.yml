name: Build TURNBOUND

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/turnbound/**'
      - '.github/workflows/build-turnbound.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Test and build TURNBOUND
        working-directory: projects/turnbound
        run: gradle clean test build --stacktrace
      - name: Smoke-test NeoForge server load
        working-directory: projects/turnbound
        run: |
          mkdir -p run/server
          printf 'eula=true\n' > run/server/eula.txt
          setsid gradle runServer --no-daemon > server-smoke.log 2>&1 &
          pid=$!
          started=0
          for i in $(seq 1 120); do
            if grep -q 'Done (' server-smoke.log; then
              started=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          cat server-smoke.log
          grep -q 'TURNBOUND 0.1.0-alpha.13 loaded' server-smoke.log
          test "$started" -eq 1
          kill -TERM -- "-$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: turnbound-alpha13-canon-southgate
          path: projects/turnbound/build/libs/*.jar
          if-no-files-found: error
