name: Audit Living Kingdoms regional logistics

on:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-regional-logistics.yml'
  workflow_dispatch:

concurrency:
  group: living-kingdoms-regional-logistics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'

jobs:
  audit:
    name: Java 25 fresh regional roads and freight audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build --stacktrace --console=plain

      - name: Fresh dedicated server regional logistics audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          rm -rf run/world run/living_realm run/livingkingdoms-regional-logistics-ci-world
          printf 'level-name=livingkingdoms-regional-logistics-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt

          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/regional-logistics-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 1400); do
            if grep -Eq 'LK_REALM_DIAGNOSTIC_FAIL|Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError|Invalid Erden regional road|Invalid Erden regional logistics' ../../logs/regional-logistics-server.log; then
              cat ../../logs/regional-logistics-server.log
              exit 1
            fi

            if grep -Fq 'LK_ERDEN_REGIONAL_ROADS_PASS revision=1 corridors=8 waystations=4' ../../logs/regional-logistics-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_LOGISTICS_PASS revision=1 corridors=8 waystations=4' ../../logs/regional-logistics-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_SETTLEMENT_PASS revision=1 settlements=6 buildings=60' ../../logs/regional-logistics-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_SOCIETY_PASS revision=1 settlements=6 households=48 residents=144 workers=96 dependents=48' ../../logs/regional-logistics-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_ECONOMY_PASS revision=1 settlements=6 households=48 markets=6' ../../logs/regional-logistics-server.log \
              && grep -Fq 'LK_ERDEN_POPULATION_DIAGNOSTIC_PASS households=77 residents=231 workers=154' ../../logs/regional-logistics-server.log \
              && grep -Fq 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/regional-logistics-server.log \
              && grep -Fq 'LK_ERDEN_LIVING_ECONOMY_PASS revision=1 households=77 shops=50' ../../logs/regional-logistics-server.log \
              && grep -Fq 'LK_ERDEN_TRANSPORT_PASS revision=2 manifests=' ../../logs/regional-logistics-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_WORKFORCE_PASS revision=1 nodes=18 households=74 residents=216 workers=142 dependents=74' ../../logs/regional-logistics-server.log; then
              passed=1
              break
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/regional-logistics-server.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/regional-logistics-server.log
          test "$passed" -eq 1

          grep -F 'LK_ERDEN_REGIONAL_ROADS_PASS revision=1 corridors=8 waystations=4' ../../logs/regional-logistics-server.log \
            | grep -F 'road_metres=33519' \
            | grep -F 'network_connected=true' \
            | grep -F 'streamed=true' \
            | grep -F 'terrain_following=true' \
            | grep -F 'physical_road=true' \
            | grep -F 'physical_waystation=true' \
            | grep -F 'persistent_forced_chunks=false'

          grep -F 'LK_ERDEN_REGIONAL_LOGISTICS_PASS revision=1 corridors=8 waystations=4' ../../logs/regional-logistics-server.log \
            | grep -F 'local_route_points=273' \
            | grep -F 'capital_route=true' \
            | grep -F 'authoritative_escrow=true' \
            | grep -F 'loaded_projection=true' \
            | grep -F 'reobservation_resync=true' \
            | grep -F 'navigation_only=true' \
            | grep -F 'observed_blockage_delays_or_returns=true' \
            | grep -F 'aggregate_when_unloaded=true' \
            | grep -F 'return_accounting=true' \
            | grep -F 'persistent_forced_chunks=false'

          grep -F 'LK_ERDEN_REGIONAL_ECONOMY_PASS revision=1 settlements=6 households=48 markets=6' ../../logs/regional-logistics-server.log \
            | grep -F 'physical_barrel=true' \
            | grep -F 'worker_linked=true' \
            | grep -F 'household_consumption=true' \
            | grep -F 'local_trade_escrow=true' \
            | grep -F 'kingdom_supply_escrow=true' \
            | grep -F 'unloaded_aggregate=true' \
            | grep -F 'persistent_forced_chunks=false'

          grep -F 'LK_ERDEN_REGIONAL_SETTLEMENT_PASS revision=1 settlements=6 buildings=60' ../../logs/regional-logistics-server.log
          grep -F 'LK_ERDEN_REGIONAL_SOCIETY_PASS revision=1 settlements=6 households=48 residents=144 workers=96 dependents=48' ../../logs/regional-logistics-server.log
          grep -F 'LK_ERDEN_POPULATION_DIAGNOSTIC_PASS households=77 residents=231 workers=154' ../../logs/regional-logistics-server.log
          grep -F 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/regional-logistics-server.log
          grep -F 'LK_ERDEN_LIVING_ECONOMY_PASS revision=1 households=77 shops=50' ../../logs/regional-logistics-server.log
          grep -F 'LK_ERDEN_TRANSPORT_PASS revision=2 manifests=' ../../logs/regional-logistics-server.log
          grep -F 'LK_ERDEN_EXTERIOR_WORKFORCE_PASS revision=1 nodes=18 households=74 residents=216 workers=142 dependents=74' ../../logs/regional-logistics-server.log

      - name: JAR verification
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          unzip -t "$jar"
          entries="$(mktemp)"
          unzip -Z1 "$jar" > "$entries"
          test "$(sort "$entries" | uniq -d | wc -l)" -eq 0
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalRoadNetwork.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalRoadSavedData.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalRoadBuilder.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalRoadManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalTransportManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalShipmentClockGuard.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenTransportSavedData.class' "$entries"
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-alpha.12"'

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-regional-logistics-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
