name: Fix authored upper route supports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lk-fix-authored-support.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Patch source
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java')
          s = p.read_text(encoding='utf-8')
          floor_marker = '        Block floorBlock = floorBlock(placement.role());'
          static_lines = [
              '        Set<BlockPos> routeBody = new HashSet<>(routeFeet);',
              '        routeBody.addAll(routeHeads);',
              '        for (RouteNode node : routeNodes) {',
              '            if (stairs.containsKey(node.world())) continue;',
              '            int supportLocalY = node.local().y() - 1;',
              '            if (sourceOccupied.contains(localKey(',
              '                    node.local().x(), supportLocalY, node.local().z()))) continue;',
              '            BlockPos supportPos = new BlockPos(',
              '                    node.world().x(), node.world().y() - 1, node.world().z());',
              '            if (routeBody.contains(supportPos)) {',
              '                throw new IllegalStateException(',
              '                        "Erden required flat-route support collides with route body fragment="',
              '                                + placement.fragmentKey() + " local=" + node.local()',
              '                                + " support=" + supportPos);',
              '            }',
              '        }',
              ''
          ]
          if 'Set<BlockPos> routeBody = new HashSet<>(routeFeet);' not in s:
              if s.count(floor_marker) != 1:
                  raise SystemExit('floor marker mismatch')
              s = s.replace(floor_marker, '\n'.join(static_lines) + '\n' + floor_marker, 1)
          runtime_marker = '        Block support = supportBlock(plan.role());'
          runtime_lines = [
              '        Set<BlockPos> protectedRouteBody = new HashSet<>();',
              '        for (RouteNode routeNode : plan.routeNodes()) {',
              '            protectedRouteBody.add(routeNode.world().pos());',
              '            protectedRouteBody.add(new BlockPos(',
              '                    routeNode.world().x(), routeNode.world().y() + 1, routeNode.world().z()));',
              '        }'
          ]
          if 'Set<BlockPos> protectedRouteBody = new HashSet<>();' not in s:
              if s.count(runtime_marker) != 1:
                  raise SystemExit('runtime marker mismatch')
              s = s.replace(runtime_marker, runtime_marker + '\n' + '\n'.join(runtime_lines), 1)
          materialize_start = s.index('    private static boolean materialize(')
          support_start = s.index('            BlockPos supportPos = new BlockPos(', materialize_start)
          old_if = '            if (sourceFloorAir && level.getBlockState(supportPos).isAir()) {'
          if_start = s.index(old_if, support_start)
          if_end = s.index('            }', if_start) + len('            }')
          block_lines = [
              '            BlockPos supportPos = new BlockPos(',
              '                    node.world().x(), node.world().y() - 1, node.world().z());',
              '            boolean supportHitsRouteBody = protectedRouteBody.contains(supportPos);',
              '            if (sourceFloorAir && supportHitsRouteBody && stair == null) {',
              '                return false;',
              '            }',
              '            if (sourceFloorAir && !supportHitsRouteBody',
              '                    && level.getBlockState(supportPos).isAir()) {',
              '                level.setBlock(supportPos, support.defaultBlockState(), UPDATE_FLAGS);',
              '            }'
          ]
          s = s[:support_start] + '\n'.join(block_lines) + s[if_end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Compile Java 25
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Publish source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java
          git commit -m 'fix(living-kingdoms): prevent authored stair support self-collision'
          for n in 1 2 3 4 5 6; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
