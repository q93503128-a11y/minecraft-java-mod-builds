name: Temporary Arcane alpha.43 audit import fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-arcane-alpha43-import-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add regex import to source audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/arcane-circle/tools/test_current_source.py')
          s=p.read_text(encoding='utf-8')
          if '\nimport re\n' not in s[:100]:
              if not s.startswith('from pathlib import Path\n'):
                  raise SystemExit('unexpected audit header')
              s=s.replace('from pathlib import Path\n','from pathlib import Path\nimport re\n',1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-arcane-alpha43-import-fix.yml
          git add -A
          git commit -m 'fix(arcane): import regex for alpha.43 authored coverage audit'
          git push origin main
