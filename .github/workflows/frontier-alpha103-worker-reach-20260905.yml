name: Frontier Alpha103 Worker Reach 20260905

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/frontier-alpha103-worker-reach-20260905.yml'

permissions:
  contents: write

env:
  PROJECT: projects/frontier-settlement

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Patch Alpha103 worker reach
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('projects/frontier-settlement')
          worker_path = root / 'src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerService.java'
          worker = worker_path.read_text(encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              return text.replace(old, new, 1)

          worker = replace_once(
              worker,
              '    private static final int MINING_WORK_PERIOD_TICKS = 160;\n',
              '    private static final int MINING_WORK_PERIOD_TICKS = 160;\n'
              '    // Close-range remote work prevents a valid physical resource from becoming unusable\n'
              '    // merely because leaves, fencing, or rough terrain blocks the final standing cell.\n'
              '    // This is deliberately bounded: distant resources still require normal pathfinding.\n'
              '    private static final double LUMBER_REMOTE_WORK_REACH_SQR = 36.0D; // 6 blocks\n'
              '    private static final double QUARRY_REMOTE_WORK_REACH_SQR = 25.0D; // 5 blocks\n',
              'insert remote work constants')

          worker = replace_once(
              worker,
              '        if (worker.distanceToSqr(target.getX() + 0.5D, target.getY(), target.getZ() + 0.5D) > 8.0D) {\n'
              '            moveNear(level, worker, target, 0.92D);\n'
              '            return;\n'
              '        }\n'
              '        if (!workDue(level, camp, LUMBER_WORK_PERIOD_TICKS)) return;\n',
              '        if (!withinResourceWorkReach(worker, target, LUMBER_REMOTE_WORK_REACH_SQR)) {\n'
              '            moveNear(level, worker, target, 0.92D);\n'
              '            return;\n'
              '        }\n'
              '        // Once the worker is close enough to work, stop any stale approach path so the\n'
              '        // next target cannot inherit movement toward the already-harvested trunk.\n'
              '        worker.getNavigation().stop();\n'
              '        MOVEMENT_WATCHES.remove(worker.getUUID());\n'
              '        if (!workDue(level, camp, LUMBER_WORK_PERIOD_TICKS)) return;\n',
              'lumber work reach')

          worker = replace_once(
              worker,
              '        if (worker.distanceToSqr(target.getX() + 0.5D, target.getY(), target.getZ() + 0.5D) > 9.0D) {\n'
              '            moveNear(level, worker, target, 0.90D);\n'
              '            return;\n'
              '        }\n'
              '        if (!workDue(level, quarry, QUARRY_WORK_PERIOD_TICKS)) return;\n',
              '        if (!withinResourceWorkReach(worker, target, QUARRY_REMOTE_WORK_REACH_SQR)) {\n'
              '            moveNear(level, worker, target, 0.90D);\n'
              '            return;\n'
              '        }\n'
              '        worker.getNavigation().stop();\n'
              '        MOVEMENT_WATCHES.remove(worker.getUUID());\n'
              '        if (!workDue(level, quarry, QUARRY_WORK_PERIOD_TICKS)) return;\n',
              'quarry work reach')

          worker = replace_once(
              worker,
              '        if (!level.hasChunkAt(pos) || isTargetBlocked(level, worker, pos) || isProtected(data, pos)) return false;\n',
              '        if (!level.hasChunkAt(pos) || isProtected(data, pos)\n'
              '                || isBlockedOutsideWorkReach(level, worker, pos, LUMBER_REMOTE_WORK_REACH_SQR)) return false;\n',
              'cached tree blocked reach')

          worker = replace_once(
              worker,
              '                && isNaturalTreeBase(level, pos) && hasWalkableApproach(level, pos);\n',
              '                && isNaturalTreeBase(level, pos)\n'
              '                && canWorkOrApproach(level, worker, pos, LUMBER_REMOTE_WORK_REACH_SQR);\n',
              'cached tree approach')

          worker = replace_once(
              worker,
              '                        if (!seenBases.add(base) || isTargetBlocked(level, worker, base)\n'
              '                                || !isNaturalTreeBase(level, base) || !hasWalkableApproach(level, base)) continue;\n',
              '                        if (!seenBases.add(base)\n'
              '                                || isBlockedOutsideWorkReach(level, worker, base, LUMBER_REMOTE_WORK_REACH_SQR)\n'
              '                                || !isNaturalTreeBase(level, base)\n'
              '                                || !canWorkOrApproach(level, worker, base, LUMBER_REMOTE_WORK_REACH_SQR)) continue;\n',
              'tree candidate approach')

          worker = replace_once(
              worker,
              '        if (cached != null && cached.expiresAt() > now && level.hasChunkAt(cached.pos())\n'
              '                && !isTargetBlocked(level, worker, cached.pos()) && !isProtected(data, cached.pos())) {\n',
              '        if (cached != null && cached.expiresAt() > now && level.hasChunkAt(cached.pos())\n'
              '                && !isProtected(data, cached.pos())\n'
              '                && !isBlockedOutsideWorkReach(level, worker, cached.pos(), QUARRY_REMOTE_WORK_REACH_SQR)) {\n',
              'cached quarry blocked reach')

          worker = replace_once(
              worker,
              '                    && level.getBlockState(cached.pos().above()).isAir() && hasWalkableApproach(level, cached.pos())) {\n',
              '                    && level.getBlockState(cached.pos().above()).isAir()\n'
              '                    && canWorkOrApproach(level, worker, cached.pos(), QUARRY_REMOTE_WORK_REACH_SQR)) {\n',
              'cached quarry approach')

          worker = replace_once(
              worker,
              '                                || isProtected(data, pos) || isTargetBlocked(level, worker, pos)\n'
              '                                || !level.getBlockState(pos.above()).isAir() || !hasWalkableApproach(level, pos)) continue;\n',
              '                                || isProtected(data, pos)\n'
              '                                || isBlockedOutsideWorkReach(level, worker, pos, QUARRY_REMOTE_WORK_REACH_SQR)\n'
              '                                || !level.getBlockState(pos.above()).isAir()\n'
              '                                || !canWorkOrApproach(level, worker, pos, QUARRY_REMOTE_WORK_REACH_SQR)) continue;\n',
              'quarry candidate approach')

          helper_anchor = '''    private static boolean hasWalkableApproach(ServerLevel level, BlockPos target) {\n'''
          helpers = '''    private static boolean withinResourceWorkReach(FrontierWorkerEntity worker, BlockPos target,\n                                                   double reachSqr) {\n        return worker.distanceToSqr(target.getX() + 0.5D, target.getY() + 0.5D, target.getZ() + 0.5D) <= reachSqr;\n    }\n\n    private static boolean canWorkOrApproach(ServerLevel level, FrontierWorkerEntity worker, BlockPos target,\n                                             double reachSqr) {\n        return withinResourceWorkReach(worker, target, reachSqr) || hasWalkableApproach(level, target);\n    }\n\n    private static boolean isBlockedOutsideWorkReach(ServerLevel level, FrontierWorkerEntity worker,\n                                                     BlockPos target, double reachSqr) {\n        return isTargetBlocked(level, worker, target) && !withinResourceWorkReach(worker, target, reachSqr);\n    }\n\n'''
          worker = replace_once(worker, helper_anchor, helpers + helper_anchor, 'insert reach helpers')
          worker_path.write_text(worker, encoding='utf-8')

          gradle_path = root / 'gradle.properties'
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = replace_once(gradle, 'mod_version=0.1.0-alpha.102', 'mod_version=0.1.0-alpha.103', 'version bump')
          gradle += '\n# Alpha.103 production reach: lumber/quarry workers may perform bounded close-range remote work when the final path cell is obstructed; distant resources still require normal navigation.\n'
          gradle_path.write_text(gradle, encoding='utf-8')

          test_path = root / 'tools/test_current_source.py'
          test = test_path.read_text(encoding='utf-8')
          test = replace_once(test, 'mod_version=0.1.0-alpha.102', 'mod_version=0.1.0-alpha.103', 'verifier version')
          anchor = 'require("SettlementCivilWorkData.get(server).project().active()" in guidance, "active civil work absent from next-goal authority")\n'
          reach_checks = '''require("LUMBER_REMOTE_WORK_REACH_SQR = 36.0D" in worker, "bounded six-block lumber remote work missing")\nrequire("QUARRY_REMOTE_WORK_REACH_SQR = 25.0D" in worker, "bounded five-block quarry remote work missing")\nrequire(worker.count("withinResourceWorkReach(worker, target") >= 2, "resource workers still require point-blank target contact")\nrequire("canWorkOrApproach(level, worker, pos, LUMBER_REMOTE_WORK_REACH_SQR)" in worker, "near lumber target still requires a walkable final cell")\nrequire("isBlockedOutsideWorkReach" in worker, "blocked-target retry still suppresses already-reachable remote work")\n'''
          test = replace_once(test, anchor, anchor + reach_checks, 'insert alpha103 verifier checks')
          test = replace_once(test,
              'print("CURRENT SOURCE CHECK PASS: alpha102 production integrity and economy authority invariants")',
              'print("CURRENT SOURCE CHECK PASS: alpha103 production reach plus alpha102 authority invariants")',
              'verifier message')
          test_path.write_text(test, encoding='utf-8')

          lock_path = root / 'COMPANION_LOCK.json'
          lock = lock_path.read_text(encoding='utf-8')
          lock = replace_once(lock, '"generated_at": "2026-08-30"', '"generated_at": "2026-09-05"', 'companion lock date')
          lock = replace_once(lock, '"frontier_settlement": "0.1.0-alpha.91"', '"frontier_settlement": "0.1.0-alpha.103"', 'companion lock frontier target')
          lock_path.write_text(lock, encoding='utf-8')
          PY

      - name: Source and JSON checks
        run: |
          python projects/frontier-settlement/tools/test_current_source.py
          python - <<'PY'
          from pathlib import Path
          import json
          root=Path('projects/frontier-settlement/src/main/resources')
          count=0
          for p in root.rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
              count += 1
          json.loads(Path('projects/frontier-settlement/COMPANION_LOCK.json').read_text(encoding='utf-8'))
          print('JSON OK', count)
          PY

      - name: Java 25 clean build
        run: |
          cd "$PROJECT"
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify JAR
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile, hashlib
          jar=Path('projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.103.jar')
          assert jar.is_file(), jar
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              assert 'META-INF/neoforge.mods.toml' in names
              assert len(names)==len(set(names))
              assert any(n.endswith('SettlementWorkerService.class') for n in names)
          print('JAR', jar, jar.stat().st_size, hashlib.sha256(jar.read_bytes()).hexdigest())
          PY

      - name: Commit source and remove temporary workflow
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm .github/workflows/frontier-alpha103-worker-reach-20260905.yml
          git add projects/frontier-settlement
          git commit -m 'Frontier alpha103 allow bounded remote resource work'
          git fetch origin main
          git rebase origin/main

      - name: Reverify rebased source
        run: |
          python projects/frontier-settlement/tools/test_current_source.py
          cd "$PROJECT"
          ./gradlew clean build --no-daemon

      - name: Upload Alpha103 JAR
        uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-0.1.0-alpha.103
          path: projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.103.jar
          if-no-files-found: error

      - name: Push main and remove accidental temporary refs
        run: |
          git push origin HEAD:main
          git push origin --delete tmp-frontier-alpha103-worker-reach || true
          git push origin --delete noop-delete-later || true
