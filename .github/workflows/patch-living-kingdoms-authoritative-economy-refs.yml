name: Patch Living Kingdoms authoritative economy references

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_living_kingdoms_authoritative_economy_refs.py'
      - '.github/workflows/patch-living-kingdoms-authoritative-economy-refs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace obsolete economy references
        run: python .github/scripts/patch_living_kingdoms_authoritative_economy_refs.py
      - name: Commit cleanup
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java
          git diff --cached --quiet && exit 0
          git commit -m 'Replace obsolete economy manager references'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
