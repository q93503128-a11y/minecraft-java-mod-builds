name: Temporary Arcane alpha.41 manual visual audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-arcane-alpha41-manual-audit.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited manual visual refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 projects/arcane-circle/tmp_alpha41_manual_audit.py
          git rm -f .github/workflows/tmp-arcane-alpha41-manual-audit.yml projects/arcane-circle/tmp_alpha41_manual_audit.py
          git add projects/arcane-circle
          git diff --check
          git commit -m 'feat(arcane): refine high-circle visuals by manual audit'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
