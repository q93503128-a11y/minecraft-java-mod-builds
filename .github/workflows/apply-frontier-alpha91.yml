name: Apply Frontier Alpha.91

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha91.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply-alpha91:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Apply Alpha.91 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' 2>&1 | tee alpha91-run.log
          import base64, zlib
          payload = ''
          code = zlib.decompress(base64.b64decode(payload)).decode('utf-8')
          exec(compile(code, '<alpha91-patch>', 'exec'))
          PY

      - name: Audit Alpha.91 source
        shell: bash
        run: |
          set -euo pipefail
          cd projects/frontier-settlement
          python tools/test_alpha91_source.py 2>&1 | tee ../../alpha91-run.log
          python tools/test_alpha90_source.py 2>&1 | tee -a ../../alpha91-run.log

      - name: Java 25 clean build
        shell: bash
        run: |
          set -euo pipefail
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew clean build --no-daemon 2>&1 | tee -a ../../alpha91-run.log

      - name: Upload Alpha.91 build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha91-build
          if-no-files-found: warn
          path: |
            alpha91-run.log
            projects/frontier-settlement/build/libs/*.jar
            projects/frontier-settlement/WORKER_NAVIGATION_STORAGE_ALPHA91.md

      - name: Commit Alpha.91
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/frontier-settlement
          if git diff --cached --quiet; then
            echo "No Frontier Alpha.91 changes to commit"
            exit 0
          fi
          git commit -m "Fix Frontier alpha.91 worker navigation and storage"
          git pull --rebase origin main
          git push origin HEAD:main
