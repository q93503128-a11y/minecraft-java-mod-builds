name: Apply Frontier Alpha.91

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha91.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply-alpha91:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Repair Alpha.91 patch driver
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/frontier-settlement/tools/apply_alpha91_patch.py')
          s = p.read_text(encoding='utf-8')
          old = '''# Local work methods: jobsite barrels and rotation-safe farms.\nworker = worker.replace("deliverToTownStorage(level, data, worker, carried);", "deliverToWorksiteStorage(level, data, worker, camp, carried);", 4)\n# The blanket replacement above only touches the first four lumber occurrences in source order. Replace exact\n# farm/quarry/mine method bodies deliberately to avoid accidental changes elsewhere.\n'''
          new = '''# Local work methods: jobsite barrels and rotation-safe farms. Patch each method inside its\n# own source slice so similarly named delivery calls in another profession can never inherit the\n# wrong BuildingRecord variable.\nstart = worker.index("    private static void workLumber(")\nend = worker.index("    private static void workFarm(", start)\nlumber = worker[start:end]\nlumber = lumber.replace("deliverToTownStorage(level, data, worker, carried);", "deliverToWorksiteStorage(level, data, worker, camp, carried);")\nworker = worker[:start] + lumber + worker[end:]\n# Patch farm/quarry/mine method bodies deliberately to avoid accidental changes elsewhere.\n'''
          if old not in s:
              raise SystemExit('Alpha.91 patch-driver lumber block no longer matches expected source')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply Alpha.91 patch
        shell: bash
        run: |
          set -euo pipefail
          python projects/frontier-settlement/tools/apply_alpha91_patch.py 2>&1 | tee alpha91-run.log

      - name: Java 25 clean build
        shell: bash
        run: |
          set -o pipefail
          cd projects/frontier-settlement
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee ../../alpha91-build.log

      - name: Upload Alpha.91 build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha91-build
          path: |
            alpha91-run.log
            alpha91-build.log
            projects/frontier-settlement/build/libs/*.jar
          if-no-files-found: ignore

      - name: Commit Alpha.91
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/frontier-settlement .github/workflows/apply-frontier-alpha91.yml
          if git diff --cached --quiet; then
            echo "No Alpha.91 changes to commit"
            exit 0
          fi
          git commit -m "Frontier Settlement 0.1.0-alpha.91 navigation and storage hardening"
          git pull --rebase origin main
          git push origin HEAD:main
