name: Manual Export Survival UI Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-export-survival-ui-patch.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Build and verify current Survival Ascension
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain
          python3 tools/verify_jar.py build/libs/survivalascension-0.61.0-alpha.1.jar
      - name: Upload patch JAR
        uses: actions/upload-artifact@v4
        with:
          name: survival-061-single-mining-expedition-ui-patch
          path: projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          if-no-files-found: error
