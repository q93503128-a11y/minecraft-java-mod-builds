name: Temporary SA046 Amethyst Resonance Audit

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: github.event.issue.title == '[SA046 AMETHYST AUDIT INTERNAL]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download and verify locked Amethyst Resonance binary
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cdn.modrinth.com/data/8RyryQ7j/versions/no0B3Ssy/amethyst_resonance-26.2-neoforge-1.0.0.jar'
          JAR="$RUNNER_TEMP/amethyst_resonance-26.2-neoforge-1.0.0.jar"
          curl --fail --location --retry 4 --retry-all-errors "$URL" -o "$JAR"
          echo 'a3ac49a6202b7918d2ed22030df0b6e2906cdec8  '"$JAR" | sha1sum -c -
          echo "JAR=$JAR" >> "$GITHUB_ENV"
          stat -c 'size=%s' "$JAR"

      - name: Inspect resources, tags and class bytecode
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/amethyst-audit"
          mkdir -p "$OUT/unpacked"
          unzip -q "$JAR" -d "$OUT/unpacked"
          jar tf "$JAR" | sort > "$OUT/jar-entries.txt"

          {
            echo '=== LOCKED FILE ==='
            sha1sum "$JAR"
            sha256sum "$JAR"
            echo
            echo '=== ITEM/TAG/RECIPE/DATA RESOURCES ==='
            find "$OUT/unpacked" -type f \( -path '*/data/*' -o -path '*/META-INF/*' \) | sort
            echo
            echo '=== TEXT RESOURCE CONTENT RELEVANT TO RESONANT GEAR ==='
            grep -RInsE 'resonant|amethyst|pickaxe|sword|axe|hoe|helmet|chestplate|leggings|boots|infus|upgrade|component|custom_data' "$OUT/unpacked/data" "$OUT/unpacked/META-INF" 2>/dev/null || true
          } > "$OUT/resources.txt"

          : > "$OUT/javap.txt"
          while IFS= read -r entry; do
            case "$entry" in
              *.class)
                cls="${entry%.class}"
                cls="${cls//\//.}"
                echo "===== $cls =====" >> "$OUT/javap.txt"
                javap -classpath "$JAR" -c -p -verbose "$cls" >> "$OUT/javap.txt" 2>&1 || true
                ;;
            esac
          done < "$OUT/jar-entries.txt"

          {
            echo '=== CLASS CONSTANTS / METHODS RELEVANT TO ITEM IDENTITY OR COMPONENTS ==='
            grep -nEi 'resonant|pickaxe|sword|axe|hoe|helmet|armor|infus|upgrade|custom.?data|data.?component|component|itemstack|is\(|isSame|registry|resource.?location|interaction|break|destroy|vibration|warden|enderman' "$OUT/javap.txt" || true
          } > "$OUT/class-focus.txt"

          python3 - <<'PY' > "$OUT/summary.txt"
          from pathlib import Path
          import re
          out = Path(__import__('os').environ['RUNNER_TEMP'])/'amethyst-audit'
          entries = (out/'jar-entries.txt').read_text(errors='replace').splitlines()
          focus = (out/'class-focus.txt').read_text(errors='replace')
          resources = (out/'resources.txt').read_text(errors='replace')
          print('AMETHYST_RESONANCE_BINARY_AUDIT')
          print('class_count=', sum(x.endswith('.class') for x in entries), sep='')
          for token in ['resonant_pickaxe','resonant_sword','resonant_axe','resonant_hoe','resonance_upgrade','custom_data','DataComponents','ItemTags','PICKAXES']:
              hay=(focus+'\n'+resources).lower()
              print(f'{token}={token.lower() in hay}')
          print('standard_item_tag_files=')
          for x in entries:
              if '/tags/item/' in x or x.startswith('data/minecraft/tags/item/') or x.startswith('data/c/tags/item/'):
                  print('  '+x)
          print('relevant_class_names=')
          for x in entries:
              if x.endswith('.class') and re.search(r'(reson|pickaxe|tool|armor|vibrat|warden|enderman|infus)', x, re.I):
                  print('  '+x)
          PY

          cat "$OUT/summary.txt"
          echo '--- focused resource evidence ---'
          sed -n '1,260p' "$OUT/resources.txt"
          echo '--- focused class evidence ---'
          sed -n '1,520p' "$OUT/class-focus.txt"

      - name: Upload binary audit
        uses: actions/upload-artifact@v4
        with:
          name: sa046-amethyst-resonance-binary-audit
          path: |
            ${{ runner.temp }}/amethyst-audit/summary.txt
            ${{ runner.temp }}/amethyst-audit/resources.txt
            ${{ runner.temp }}/amethyst-audit/class-focus.txt
            ${{ runner.temp }}/amethyst-audit/javap.txt
            ${{ runner.temp }}/amethyst-audit/jar-entries.txt
          retention-days: 7

      - name: Post compact findings to trigger issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/amethyst-audit"
          {
            echo 'Amethyst Resonance locked-binary audit finished.'
            echo
            if test -f "$OUT/summary.txt"; then
              echo '```text'
              cat "$OUT/summary.txt"
              echo '```'
            fi
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/comment.md"
          gh issue comment "${{ github.event.issue.number }}" --body-file "$RUNNER_TEMP/comment.md"
