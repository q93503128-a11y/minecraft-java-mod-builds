name: Build Village Guardians v0.17.5 Gameplay UI

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger-v0175'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: village-guardians-v0175-main
  cancel-in-progress: false

env:
  PROJECT_DIR: projects/village-guardians
  EXPECTED_JAR: villageguardians-0.17.5-alpha.1.jar
  PUBLISHED_DIR: published/village-guardians
  RESULT_DIR: ci-results/village-guardians-v0175

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Assemble and apply v0.17.5 patch
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v0175_b64.part-* > "$RUNNER_TEMP/v0175-patch.b64"
          echo '561eec54cfc1bb47092097ea0ac65934934d9a93562514de2e6dd0f83c959cc0  '"$RUNNER_TEMP/v0175-patch.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/v0175-patch.b64" | gzip --decompress > tools/apply_v0175.py
          echo '34f986766402fb9a460e48d2452e0752504ec0f79c647676768bbbf01289a1e1  tools/apply_v0175.py' | sha256sum -c -
          python3 -m py_compile tools/apply_v0175.py
          python3 tools/apply_v0175.py
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('tools/test_progression_depth.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('assert "ACTION_HEIGHT = 24" in shop_ui',
                                        'assert "ACTION_HEIGHT = 20" in shop_ui')
          test_text = test_text.replace('assert "* 24 / 100" in shop_ui',
                                        'assert "contentWidth < 330" in shop_ui')
          test_path.write_text(test_text, encoding='utf-8')

          visual_path = Path('src/main/java/kr/moonseungjun/villageguardians/VillageSkillVisualSystem.java')
          visual_text = visual_path.read_text(encoding='utf-8')
          visual_text = visual_text.replace('SoundEvents.SHIELD_BLOCK, 1.15f, 0.78f',
                                            'SoundEvents.SHIELD_BLOCK.value(), 1.15f, 0.78f')
          visual_path.write_text(visual_text, encoding='utf-8')
          PY
          rm -f tools/apply_v0175.py tools/v0175_b64.part-* tools/v0175_patch.py.gz.b64

      - name: Run complete contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/test_rpg_balance.py
            python3 tools/test_village_zone.py
            python3 tools/test_progression_loop.py
            python3 tools/test_progression_depth.py
            python3 tools/test_fortress_layout.py
            python3 tools/test_runtime_safety.py
            python3 tools/test_action_layout.py
            python3 tools/test_enemy_content.py
            python3 tools/test_v0174_ui_safety.py
            python3 tools/test_v0175_gameplay_ui.py
          } 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0175-contracts.log"

      - name: Build Java 25 runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0175-gradle.log"

      - name: Verify and stage artifact
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          mkdir -p "$GITHUB_WORKSPACE/deliverables-v0175"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables-v0175/"
          cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables-v0175/"
          cp "$GITHUB_WORKSPACE/village-guardians-v0175-contracts.log" "$GITHUB_WORKSPACE/deliverables-v0175/"
          cp "$GITHUB_WORKSPACE/village-guardians-v0175-gradle.log" "$GITHUB_WORKSPACE/deliverables-v0175/"

      - uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.17.5-alpha.1
          path: deliverables-v0175/
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified source and JAR to main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PUBLISHED_DIR"
          cp "deliverables-v0175/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
          cp "deliverables-v0175/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$PROJECT_DIR/src" "$PROJECT_DIR/tools" "$PROJECT_DIR/gradle.properties" \
                  "$PUBLISHED_DIR/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Village Guardians v0.17.5 gameplay UI and verified JAR'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Record dedicated result
        if: always()
        shell: bash
        run: |
          set +e
          FINAL_STATUS='${{ job.status }}'
          TEMP_DIR="$RUNNER_TEMP/village-guardians-v0175-result"
          rm -rf "$TEMP_DIR"
          mkdir -p "$TEMP_DIR"
          cp "$GITHUB_WORKSPACE/village-guardians-v0175-contracts.log" "$TEMP_DIR/latest-contracts.log" 2>/dev/null || \
            printf '%s\n' 'Contract checks did not finish.' > "$TEMP_DIR/latest-contracts.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v0175-gradle.log" "$TEMP_DIR/latest-gradle.log" 2>/dev/null || \
            printf '%s\n' 'Gradle build did not finish.' > "$TEMP_DIR/latest-gradle.log"
          PUBLISHED_COMMIT="$(git rev-parse HEAD 2>/dev/null)"
          cat > "$TEMP_DIR/status.txt" <<EOF
          status=$FINAL_STATUS
          trigger_sha=$GITHUB_SHA
          published_commit=$PUBLISHED_COMMIT
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=0.17.5-alpha.1
          EOF

          git reset --hard HEAD
          git clean -fd
          mkdir -p "$RESULT_DIR"
          cp "$TEMP_DIR/status.txt" "$RESULT_DIR/status.txt"
          cp "$TEMP_DIR/latest-contracts.log" "$RESULT_DIR/latest-contracts.log"
          cp "$TEMP_DIR/latest-gradle.log" "$RESULT_DIR/latest-gradle.log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record Village Guardians v0.17.5 result for ${GITHUB_SHA::7}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
