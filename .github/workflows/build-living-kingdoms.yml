name: Build Living Kingdoms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/build-living-kingdoms.yml'

concurrency:
  group: living-kingdoms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  GRADLE_VERSION: '9.2.1'
  OUTPUT_JAR: livingkingdoms-0.1.0-alpha.11.jar
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '1'

jobs:
  build:
    name: Java 25 / NeoForge 26.2 external-world audit
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Record source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs deliverables
          { java -version; gradle --version; } 2>&1 | tee logs/toolchain.log
          find "$PROJECT_DIR/src/main/java" -name '*.java' -type f | sort | tee logs/java-files.txt
          find "$PROJECT_DIR/src/main/resources" -type f | sort | tee logs/resource-files.txt
          grep -F 'world/SpongeStructureTemplate.java' logs/java-files.txt
          grep -F 'world/ExternalRealmBuilder.java' logs/java-files.txt
          grep -F 'world/RegionalEcologyManager.java' logs/java-files.txt

      - name: Clean Java 25 build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace --console=plain 2>&1 | tee ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 UI asset fantasy_panel.png' ../../logs/clean-build.log
          grep -F 'Verified Schemcraft CC-BY-4.0 structure medieval_castle.schem' ../../logs/clean-build.log
          grep -F 'Verified Schemcraft CC-BY-4.0 structure woodland_mansion.schem' ../../logs/clean-build.log
          grep -F 'Verified Schemcraft CC-BY-4.0 structure deepslate_mega_base.schem' ../../logs/clean-build.log

      - name: Fresh dedicated server external-world test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-ci-world
          mkdir -p run
          printf 'level-name=livingkingdoms-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          rm -f ../../logs/server-smoke.log
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/server-smoke.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          diagnostic=0
          for attempt in $(seq 1 720); do
            grep -Eq 'Done \(|For help, type "help"' ../../logs/server-smoke.log && ready=1 || true
            grep -Fq 'LK_REALM_DIAGNOSTIC_PASS regions=3 residences=8' ../../logs/server-smoke.log && diagnostic=1 || true
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/server-smoke.log; then
              cat ../../logs/server-smoke.log
              exit 1
            fi
            if [ "$ready" -eq 1 ] && [ "$diagnostic" -eq 1 ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat ../../logs/server-smoke.log
              echo 'Dedicated server exited before diagnostics completed.' >&2
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/server-smoke.log
          test "$ready" -eq 1
          test "$diagnostic" -eq 1
          grep -F 'external_structure_templates=true' ../../logs/server-smoke.log
          grep -F 'regional_ecology=true' ../../logs/server-smoke.log
          grep -F 'debris_zero=true' ../../logs/server-smoke.log
          grep -F 'layout_revision=12' ../../logs/server-smoke.log
          test "$(grep -c 'Loaded external structure /data/livingkingdoms/structures/external/' ../../logs/server-smoke.log)" -eq 3
          test "$(grep -c 'Verified external capital template homeland=' ../../logs/server-smoke.log)" -eq 3
          if grep -Fq 'Relocated four Erden town houses' ../../logs/server-smoke.log; then
            echo 'Legacy procedural house repair still ran.' >&2
            exit 1
          fi
          if grep -Eqi 'Failed to load datapacks|Could not parse|Exception loading level|Unknown external schematic block|Unable to load external structure|watchdog' ../../logs/server-smoke.log; then
            echo 'External world or datapack error detected.' >&2
            exit 1
          fi

      - name: Graphical client UI test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri >/dev/null
          rm -f ../../logs/client-smoke.log
          set +e
          timeout 360s xvfb-run -a -s '-screen 0 1280x720x24' \
            gradle --no-daemon runClient --stacktrace --console=plain \
            > ../../logs/client-smoke.log 2>&1
          client_status=$?
          set -e
          cat ../../logs/client-smoke.log
          test "$client_status" -eq 0
          grep -F 'LK_CLIENT_DIAGNOSTIC_PASS screen=origin_selection rendered_window=true' ../../logs/client-smoke.log
          grep -F 'LK_CLIENT_LOADING_DIAGNOSTIC_PASS screen=realm_loading non_pausing=true' ../../logs/client-smoke.log
          grep -F 'LK_CLIENT_CODEX_DIAGNOSTIC_PASS screens=overview,equipment,map,skills' ../../logs/client-smoke.log
          if grep -Eqi 'Caught exception from Living Kingdoms|Error during client initialization|Exception in client tick loop|Rendering screen|Missing textures in model livingkingdoms' ../../logs/client-smoke.log; then
            exit 1
          fi

      - name: Package and inspect alpha.11 JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "deliverables/$OUTPUT_JAR"
          JAR="deliverables/$OUTPUT_JAR"
          test -s "$JAR"
          unzip -t "$JAR" | tee logs/jar-test.log
          unzip -Z1 "$JAR" | tee logs/jar-entries.txt
          test "$(sort logs/jar-entries.txt | uniq -d | wc -l)" -eq 0
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/SpongeStructureTemplate.class' logs/jar-entries.txt
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ExternalRealmBuilder.class' logs/jar-entries.txt
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/RegionalEcologyManager.class' logs/jar-entries.txt
          grep -Fx 'data/livingkingdoms/structures/external/medieval_castle.schem' logs/jar-entries.txt
          grep -Fx 'data/livingkingdoms/structures/external/woodland_mansion.schem' logs/jar-entries.txt
          grep -Fx 'data/livingkingdoms/structures/external/deepslate_mega_base.schem' logs/jar-entries.txt
          grep -Fx 'assets/livingkingdoms/licenses/EXTERNAL_STRUCTURES_CC_BY_4_0.txt' logs/jar-entries.txt
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-alpha.11"'
          unzip -p "$JAR" assets/livingkingdoms/licenses/EXTERNAL_STRUCTURES_CC_BY_4_0.txt | grep -F 'Author: BuildSchem'
          if grep -Eq '(^|/)(tools|\.github)/|\.java$' logs/jar-entries.txt; then
            echo 'Development content found in runtime JAR.' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee "deliverables/$OUTPUT_JAR.sha256" logs/jar-sha256.txt

      - name: Write verification report
        if: success()
        shell: bash
        run: |
          cat > deliverables/BUILD_AND_RUNTIME_REPORT.md <<EOF
          # Living Kingdoms 0.1.0-alpha.11 Build and Runtime Report

          - Commit: $GITHUB_SHA
          - Minecraft 26.2 / NeoForge 26.2.0.38-beta / Java 25
          - Clean build: PASS
          - Three attributed CC-BY-4.0 external capital templates: PASS
          - Sponge block-state import and palette audit: PASS
          - Legacy procedural capital repair execution: REMOVED
          - Region-owned seasonal flora layer: PASS
          - Fresh dedicated server, three capitals and eight safe residences: PASS
          - Construction debris: ZERO
          - Graphical client, loading UI, codex and atlas input: PASS
          - Runtime JAR integrity and attribution audit: PASS
          - Manual visual inspection on user hardware: PENDING

          A fresh world is required because the settlement pipeline and layout revision changed.
          EOF

      - name: Upload build logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-build-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified alpha.11 build
        id: upload_build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-0.1.0-alpha.11
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish build pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
          BUILD_ARTIFACT_ID: ${{ steps.upload_build.outputs.artifact-id }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_NUMBER_VALUE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/living-kingdoms.json <<EOF
          {
            "run_id": "$RUN_ID_VALUE",
            "run_number": "$RUN_NUMBER_VALUE",
            "commit_sha": "$SOURCE_COMMIT_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID",
            "build_artifact_id": "$BUILD_ARTIFACT_ID"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/living-kingdoms.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Living Kingdoms build $RUN_NUMBER_VALUE"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
