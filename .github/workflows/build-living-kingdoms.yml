name: Build Living Kingdoms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/build-living-kingdoms.yml'

concurrency:
  group: living-kingdoms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  GRADLE_VERSION: '9.2.1'
  OUTPUT_JAR: livingkingdoms-0.1.0-alpha.2.jar
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '1'

jobs:
  build:
    name: Java 25 / NeoForge 26.2 build
    runs-on: ubuntu-latest
    timeout-minutes: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Record toolchain and source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs deliverables
          { java -version; gradle --version; } 2>&1 | tee logs/toolchain.log
          find "$PROJECT_DIR/src/main/java" -name '*.java' -type f | sort | tee logs/java-files.txt
          find "$PROJECT_DIR/src/main/resources" -type f | sort | tee logs/resource-files.txt
          test -s logs/java-files.txt
          test -s logs/resource-files.txt

      - name: Clean build and verify external resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace --console=plain 2>&1 | tee ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 RPG UI sheet' ../../logs/clean-build.log

      - name: Dedicated server queued noise realm and capital smoke test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-ci-world
          mkdir -p run
          printf 'level-name=livingkingdoms-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          rm -f ../../logs/server-smoke.log
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/server-smoke.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          diagnostic=0
          for attempt in $(seq 1 900); do
            if grep -Eq 'Done \(|For help, type "help"' ../../logs/server-smoke.log; then ready=1; fi
            if grep -Fq 'LK_REALM_DIAGNOSTIC_PASS regions=3 residences=8' ../../logs/server-smoke.log; then diagnostic=1; fi
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/server-smoke.log; then
              cat ../../logs/server-smoke.log
              echo 'Queued realm diagnostics reported a failure.' >&2
              exit 1
            fi
            if [ "$ready" -eq 1 ] && [ "$diagnostic" -eq 1 ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat ../../logs/server-smoke.log
              echo 'Dedicated server exited before completing startup diagnostics.' >&2
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/server-smoke.log
          test "$ready" -eq 1 || { echo 'Dedicated server did not reach ready state within 900 seconds.' >&2; exit 1; }
          test "$diagnostic" -eq 1 || { echo 'Queued noise realm diagnostics did not complete within 900 seconds.' >&2; exit 1; }
          grep -F 'noise_terrain=true' ../../logs/server-smoke.log
          grep -F 'surveyed_sites=true' ../../logs/server-smoke.log
          grep -F 'erden_facilities=10' ../../logs/server-smoke.log
          grep -F 'Prepared incremental homeland plan' ../../logs/server-smoke.log
          grep -F 'Realm construction erden_kingdom progress' ../../logs/server-smoke.log
          grep -F 'Realm construction silvana_forest progress' ../../logs/server-smoke.log
          grep -F 'Realm construction kardum_league progress' ../../logs/server-smoke.log
          if grep -Eqi 'Failed to load datapacks|Errors in currently selected datapacks|Could not parse|Exception loading level|Failed to parse.*livingkingdoms|unsafe terrain read|watchdog' ../../logs/server-smoke.log; then
            echo 'Living Kingdoms datapack, dimension, world generation, or server tick error detected.' >&2
            exit 1
          fi

      - name: Graphical client origin and codex smoke test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri >/dev/null
          rm -f ../../logs/client-smoke.log
          set +e
          timeout 360s xvfb-run -a -s '-screen 0 1280x720x24' \
            gradle --no-daemon runClient --stacktrace --console=plain \
            > ../../logs/client-smoke.log 2>&1
          client_status=$?
          set -e
          cat ../../logs/client-smoke.log
          if [ "$client_status" -ne 0 ]; then
            echo "Graphical client smoke test exited with status $client_status." >&2
            exit 1
          fi
          grep -F 'LK_CLIENT_DIAGNOSTIC_SCREEN_OPENED' ../../logs/client-smoke.log
          grep -F 'LK_CLIENT_DIAGNOSTIC_PASS screen=origin_selection rendered_window=true' ../../logs/client-smoke.log
          grep -F 'LK_CLIENT_CODEX_DIAGNOSTIC_PASS screens=overview,equipment,map,skills' ../../logs/client-smoke.log
          if grep -Eqi 'Caught exception from Living Kingdoms|Error during client initialization|Exception in client tick loop|Rendering screen|Missing textures in model livingkingdoms' ../../logs/client-smoke.log; then
            echo 'Living Kingdoms client, texture, or screen rendering error detected.' >&2
            exit 1
          fi

      - name: Package and inspect test JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one runtime JAR, found %s\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]:-}" >&2
            exit 1
          fi
          cp "${jars[0]}" "deliverables/$OUTPUT_JAR"
          JAR="deliverables/$OUTPUT_JAR"
          test -s "$JAR"
          unzip -t "$JAR" | tee logs/jar-test.log
          unzip -Z1 "$JAR" | tee logs/jar-entries.txt
          test "$(unzip -Z1 "$JAR" | sort | uniq -d | wc -l)" -eq 0
          unzip -Z1 "$JAR" | grep -Fx 'META-INF/neoforge.mods.toml'
          unzip -Z1 "$JAR" | grep -Eq '^kr/moonseungjun/livingkingdoms/.+\.class$'
          unzip -Z1 "$JAR" | grep -Eq '^assets/livingkingdoms/'
          unzip -Z1 "$JAR" | grep -Eq '^data/livingkingdoms/'
          unzip -Z1 "$JAR" | grep -Fx 'data/livingkingdoms/dimension/living_realm.json'
          unzip -Z1 "$JAR" | grep -Fx 'data/livingkingdoms/dimension_type/living_realm.json'
          unzip -Z1 "$JAR" | grep -Fx 'assets/livingkingdoms/textures/gui/kenney/uipack_rpg_sheet.png'
          unzip -Z1 "$JAR" | grep -Fx 'assets/livingkingdoms/licenses/KENNEY_UI_CC0.txt'
          test "$(unzip -p "$JAR" assets/livingkingdoms/textures/gui/kenney/uipack_rpg_sheet.png | wc -c)" -gt 50000
          unzip -p "$JAR" assets/livingkingdoms/licenses/KENNEY_UI_CC0.txt | grep -F 'Creative Commons CC0 1.0 Universal'
          unzip -p "$JAR" data/livingkingdoms/dimension/living_realm.json | grep -F 'minecraft:noise'
          if unzip -Z1 "$JAR" | grep -Eq '(^|/)(tools|\.github)/|\.java$'; then
            echo 'Forbidden development content found in runtime JAR' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee "deliverables/$OUTPUT_JAR.sha256" logs/jar-sha256.txt

      - name: Write verification report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat > deliverables/BUILD_AND_RUNTIME_REPORT.md <<EOF
          # Living Kingdoms Build and Runtime Report

          - Commit: $GITHUB_SHA
          - Mod version: 0.1.0-alpha.2
          - Minecraft: 26.2
          - NeoForge: 26.2.0.38-beta
          - Java: 25
          - Gradle: 9.2.1
          - Clean build: PASS
          - Fresh dedicated server startup: PASS
          - Datapack and custom dimension load: PASS
          - Living realm noise generator: PASS
          - Asynchronous chunk preparation: PASS
          - Sequential terrain survey and persisted homeland sites: PASS
          - Tick-sliced capital construction without a blocking world-edit tick: PASS
          - Three terrain-integrated regional capitals: PASS
          - Eight dynamic residence floor and headroom checks: PASS
          - Erden citadel, administration, temple, market, inn, guild, smithy, barracks, granary, wall and canal checks: PASS
          - Graphical client startup under Xvfb: PASS
          - Origin selection screen: PASS
          - Codex V2 overview, equipment/law, dynamic atlas and skills pages: PASS
          - Server-authoritative affiliation, racial traits and skill progression compiled: PASS
          - Kenney RPG UI sheet pinned to immutable commit and Git-blob hash verified: PASS
          - CC0 license notice packaged in the runtime JAR: PASS
          - Runtime JAR ZIP integrity: PASS
          - Duplicate ZIP entries: NONE
          - Full manual gameplay and visual inspection: PENDING

          This candidate replaces the old flat staging realm with noise terrain, pregenerates chunks outside blocking gameplay work, surveys sites before construction, applies large capital plans over bounded server ticks, builds distinct regional capitals, and skins the readable codex with a verified CC0 RPG UI asset. Existing flat test worlds are not a valid visual test for the new generator; create a fresh world.
          EOF

      - name: Upload build logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-build-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified test build
        id: upload_build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-0.1.0-alpha.2
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish build pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
          BUILD_ARTIFACT_ID: ${{ steps.upload_build.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/living-kingdoms.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID",
            "build_artifact_id": "$BUILD_ARTIFACT_ID"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/living-kingdoms.json
          git commit -m "Record Living Kingdoms build $GITHUB_RUN_NUMBER" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
