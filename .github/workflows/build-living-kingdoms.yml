name: Build Living Kingdoms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/build-living-kingdoms.yml'

concurrency:
  group: living-kingdoms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  GRADLE_VERSION: '9.2.1'
  OUTPUT_JAR: livingkingdoms-0.1.0-alpha.10.jar
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '1'

jobs:
  build:
    name: Java 25 / NeoForge 26.2 full authored-world audit
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Record source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs deliverables
          { java -version; gradle --version; } 2>&1 | tee logs/toolchain.log
          find "$PROJECT_DIR/src/main/java" -name '*.java' -type f | sort | tee logs/java-files.txt
          find "$PROJECT_DIR/src/main/resources" -type f | sort | tee logs/resource-files.txt
          grep -F 'worldgen/AuthoredContinentDensity.java' logs/java-files.txt
          grep -F 'worldgen/AuthoredBiomeSource.java' logs/java-files.txt
          grep -F 'worldgen/AuthoredBiomeVerifier.java' logs/java-files.txt
          grep -F 'worldgen/noise_settings/living_continent.json' logs/resource-files.txt

      - name: Clean Java 25 build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace --console=plain 2>&1 | tee ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 UI asset fantasy_panel.png' ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 UI asset panel_background.png' ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 UI asset button_normal.png' ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 UI asset button_pressed.png' ../../logs/clean-build.log

      - name: Fresh dedicated server authored-world test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-ci-world
          mkdir -p run
          printf 'level-name=livingkingdoms-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          rm -f ../../logs/server-smoke.log
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/server-smoke.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          diagnostic=0
          for attempt in $(seq 1 600); do
            grep -Eq 'Done \(|For help, type "help"' ../../logs/server-smoke.log && ready=1 || true
            grep -Fq 'LK_REALM_DIAGNOSTIC_PASS regions=3 residences=8' ../../logs/server-smoke.log && diagnostic=1 || true
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/server-smoke.log; then
              cat ../../logs/server-smoke.log
              exit 1
            fi
            if [ "$ready" -eq 1 ] && [ "$diagnostic" -eq 1 ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat ../../logs/server-smoke.log
              echo 'Dedicated server exited before diagnostics completed.' >&2
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/server-smoke.log
          test "$ready" -eq 1
          test "$diagnostic" -eq 1
          grep -F 'authored_terrain=true' ../../logs/server-smoke.log
          grep -F 'smooth_transitions=true' ../../logs/server-smoke.log
          grep -F 'structure_shells=true' ../../logs/server-smoke.log
          grep -F 'debris_zero=true' ../../logs/server-smoke.log
          grep -F 'layout_revision=11' ../../logs/server-smoke.log
          grep -F 'Verified authored capital biome erden_kingdom biome=minecraft:plains' ../../logs/server-smoke.log
          grep -F 'Verified authored capital biome silvana_forest biome=minecraft:dark_forest' ../../logs/server-smoke.log
          grep -F 'Verified authored capital biome kardum_league biome=minecraft:stony_peaks' ../../logs/server-smoke.log
          grep -F 'Relocated four Erden town houses and verified the central avenue remains unobstructed' ../../logs/server-smoke.log
          grep -F 'Settling authored homeland erden_kingdom' ../../logs/server-smoke.log
          grep -F 'Settling authored homeland silvana_forest' ../../logs/server-smoke.log
          grep -F 'Settling authored homeland kardum_league' ../../logs/server-smoke.log
          if grep -Fq 'Starting background generator survey' ../../logs/server-smoke.log; then
            echo 'Legacy vanilla terrain survey ran.' >&2
            exit 1
          fi

          known_sculk_pattern='Detected unsafe terrain read during worldgen: .*currently generating: ResourceKey\[minecraft:worldgen/placed_feature / minecraft:sculk_patch_deep_dark\]'
          grep -Ev "$known_sculk_pattern" ../../logs/server-smoke.log > ../../logs/server-smoke-actionable.log || true
          if grep -Eqi 'Failed to load datapacks|Errors in currently selected datapacks|Could not parse|Exception loading level|Failed to parse.*livingkingdoms|Failed to get element.*livingkingdoms|Unknown registry key.*livingkingdoms|Authored capital biome mismatch|watchdog|Error reading optional pack metadata' ../../logs/server-smoke-actionable.log; then
            echo 'Authored world, biome, surface, datapack or server error detected.' >&2
            exit 1
          fi

      - name: Graphical client UI test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri >/dev/null
          rm -f ../../logs/client-smoke.log
          set +e
          timeout 360s xvfb-run -a -s '-screen 0 1280x720x24' \
            gradle --no-daemon runClient --stacktrace --console=plain \
            > ../../logs/client-smoke.log 2>&1
          client_status=$?
          set -e
          cat ../../logs/client-smoke.log
          test "$client_status" -eq 0
          grep -F 'LK_CLIENT_DIAGNOSTIC_PASS screen=origin_selection rendered_window=true' ../../logs/client-smoke.log
          grep -F 'LK_CLIENT_LOADING_DIAGNOSTIC_PASS screen=realm_loading non_pausing=true' ../../logs/client-smoke.log
          grep -F 'LK_CLIENT_CODEX_DIAGNOSTIC_PASS screens=overview,equipment,map,skills' ../../logs/client-smoke.log
          grep -F 'atlas_drag=true atlas_zoom=true' ../../logs/client-smoke.log
          if grep -Eqi 'Caught exception from Living Kingdoms|Error during client initialization|Exception in client tick loop|Rendering screen|Missing textures in model livingkingdoms|Error reading optional pack metadata' ../../logs/client-smoke.log; then
            exit 1
          fi

      - name: Package and inspect alpha.10 JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          test "${#jars[@]}" -eq 1
          cp "${jars[0]}" "deliverables/$OUTPUT_JAR"
          JAR="deliverables/$OUTPUT_JAR"
          test -s "$JAR"
          unzip -t "$JAR" | tee logs/jar-test.log
          unzip -Z1 "$JAR" | tee logs/jar-entries.txt
          test "$(sort logs/jar-entries.txt | uniq -d | wc -l)" -eq 0
          grep -Fx 'kr/moonseungjun/livingkingdoms/worldgen/AuthoredContinentDensity.class' logs/jar-entries.txt
          grep -Fx 'kr/moonseungjun/livingkingdoms/worldgen/AuthoredBiomeSource.class' logs/jar-entries.txt
          grep -Fx 'kr/moonseungjun/livingkingdoms/worldgen/AuthoredBiomeVerifier.class' logs/jar-entries.txt
          grep -Fx 'data/livingkingdoms/dimension/living_realm.json' logs/jar-entries.txt
          grep -Fx 'data/livingkingdoms/worldgen/noise_settings/living_continent.json' logs/jar-entries.txt
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-alpha.10"'
          unzip -p "$JAR" data/livingkingdoms/dimension/living_realm.json | grep -F '"type": "livingkingdoms:authored_biomes"'
          unzip -p "$JAR" data/livingkingdoms/dimension/living_realm.json | grep -F '"settings": "livingkingdoms:living_continent"'
          if unzip -p "$JAR" data/livingkingdoms/dimension/living_realm.json | grep -Eq 'minecraft:overworld|minecraft:multi_noise|"preset"'; then
            echo 'Vanilla overworld terrain or biome preset remains in the Living Realm dimension.' >&2
            exit 1
          fi
          unzip -p "$JAR" data/livingkingdoms/worldgen/noise_settings/living_continent.json | grep -F 'minecraft:red_sand'
          unzip -p "$JAR" data/livingkingdoms/worldgen/noise_settings/living_continent.json | grep -F 'minecraft:moss_block'
          unzip -p "$JAR" data/livingkingdoms/worldgen/noise_settings/living_continent.json | grep -F 'minecraft:snow_block'
          unzip -p "$JAR" data/livingkingdoms/worldgen/noise_settings/living_continent.json | grep -F 'minecraft:sandstone'
          if grep -Eq '(^|/)(tools|\.github)/|\.java$' logs/jar-entries.txt; then
            echo 'Development content found in runtime JAR.' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee "deliverables/$OUTPUT_JAR.sha256" logs/jar-sha256.txt

      - name: Write verification report
        if: success()
        shell: bash
        run: |
          cat > deliverables/BUILD_AND_RUNTIME_REPORT.md <<EOF
          # Living Kingdoms 0.1.0-alpha.10 Build and Runtime Report

          - Commit: $GITHUB_SHA
          - Minecraft 26.2 / NeoForge 26.2.0.38-beta / Java 25
          - Clean build: PASS
          - Fresh dedicated server and datapack load: PASS
          - Coordinate-authored continent, coast, mountains, rivers and caves: PASS
          - Vanilla overworld terrain settings: REMOVED
          - Vanilla overworld biome preset: REMOVED
          - Coordinate-authored biome geography: PASS
          - Region-specific surface materials: PASS
          - Erden / Silvana / Kardum capital biome checks: PASS
          - Three capital terrain, transition and structure diagnostics: PASS
          - Eight walkable residence cells: PASS
          - Delayed construction debris after settling: ZERO
          - Graphical client, loading UI, codex and atlas input: PASS
          - Runtime JAR integrity and duplicate-entry audit: PASS
          - Manual visual inspection on user hardware: PENDING

          A fresh world is required because the dimension generator, biome source and layout revision changed.
          EOF

      - name: Upload build logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-build-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified alpha.10 build
        id: upload_build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-0.1.0-alpha.10
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish build pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
          BUILD_ARTIFACT_ID: ${{ steps.upload_build.outputs.artifact-id }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_NUMBER_VALUE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/living-kingdoms.json <<EOF
          {
            "run_id": "$RUN_ID_VALUE",
            "run_number": "$RUN_NUMBER_VALUE",
            "commit_sha": "$SOURCE_COMMIT_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID",
            "build_artifact_id": "$BUILD_ARTIFACT_ID"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/living-kingdoms.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Living Kingdoms build $RUN_NUMBER_VALUE"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
