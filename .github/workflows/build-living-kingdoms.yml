name: Build Living Kingdoms

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/build-living-kingdoms.yml'

concurrency:
  group: living-kingdoms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  GRADLE_VERSION: '9.2.1'
  OUTPUT_JAR: livingkingdoms-0.1.0-alpha.9.jar
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '1'

jobs:
  build:
    name: Java 25 / NeoForge 26.2 build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Record toolchain and source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs deliverables
          { java -version; gradle --version; } 2>&1 | tee logs/toolchain.log
          find "$PROJECT_DIR/src/main/java" -name '*.java' -type f | sort | tee logs/java-files.txt
          find "$PROJECT_DIR/src/main/resources" -type f | sort | tee logs/resource-files.txt
          test -s logs/java-files.txt
          test -s logs/resource-files.txt
          grep -Fx "$PROJECT_DIR/src/main/resources/data/livingkingdoms/worldgen/noise_settings/living_continent.json" logs/resource-files.txt
          grep -Fx "$PROJECT_DIR/src/main/resources/data/livingkingdoms/worldgen/density_function/terrain/base_density.json" logs/resource-files.txt
          grep -Fx "$PROJECT_DIR/src/main/resources/data/livingkingdoms/worldgen/density_function/terrain/continent.json" logs/resource-files.txt

      - name: Clean build and verify external resources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace --console=plain 2>&1 | tee ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 UI asset fantasy_panel.png' ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 UI asset panel_background.png' ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 UI asset button_normal.png' ../../logs/clean-build.log
          grep -F 'Verified Kenney CC0 UI asset button_pressed.png' ../../logs/clean-build.log

      - name: Dedicated server authored realm and capital smoke test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-ci-world
          mkdir -p run
          printf 'level-name=livingkingdoms-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          rm -f ../../logs/server-smoke.log
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/server-smoke.log 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          diagnostic=0
          for attempt in $(seq 1 540); do
            if grep -Eq 'Done \(|For help, type "help"' ../../logs/server-smoke.log; then ready=1; fi
            if grep -Fq 'LK_REALM_DIAGNOSTIC_PASS regions=3 residences=8' ../../logs/server-smoke.log; then diagnostic=1; fi
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/server-smoke.log; then
              cat ../../logs/server-smoke.log
              echo 'Authored realm diagnostics reported a failure.' >&2
              exit 1
            fi
            if [ "$ready" -eq 1 ] && [ "$diagnostic" -eq 1 ]; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat ../../logs/server-smoke.log
              echo 'Dedicated server exited before completing startup diagnostics.' >&2
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/server-smoke.log
          test "$ready" -eq 1 || { echo 'Dedicated server did not reach ready state within 540 seconds.' >&2; exit 1; }
          test "$diagnostic" -eq 1 || { echo 'Authored realm diagnostics did not complete within 540 seconds.' >&2; exit 1; }
          grep -F 'authored_terrain=true' ../../logs/server-smoke.log
          grep -F 'smooth_transitions=true' ../../logs/server-smoke.log
          grep -F 'structure_shells=true' ../../logs/server-smoke.log
          grep -F 'debris_zero=true' ../../logs/server-smoke.log
          grep -F 'Using authored homeland anchor erden_kingdom' ../../logs/server-smoke.log
          grep -F 'Using authored homeland anchor silvana_forest' ../../logs/server-smoke.log
          grep -F 'Using authored homeland anchor kardum_league' ../../logs/server-smoke.log
          if grep -Fq 'Starting background generator survey' ../../logs/server-smoke.log; then
            echo 'Legacy vanilla terrain survey still ran.' >&2
            exit 1
          fi
          grep -F 'Prepared incremental homeland plan' ../../logs/server-smoke.log
          grep -F 'Realm construction erden_kingdom progress' ../../logs/server-smoke.log
          grep -F 'Realm construction silvana_forest progress' ../../logs/server-smoke.log
          grep -F 'Realm construction kardum_league progress' ../../logs/server-smoke.log

          known_sculk_pattern='Detected unsafe terrain read during worldgen: .*currently generating: ResourceKey\[minecraft:worldgen/placed_feature / minecraft:sculk_patch_deep_dark\]'
          known_sculk_warnings="$(grep -Ec "$known_sculk_pattern" ../../logs/server-smoke.log || true)"
          grep -Ev "$known_sculk_pattern" ../../logs/server-smoke.log > ../../logs/server-smoke-actionable.log || true
          printf 'Recorded exact built-in sculk_patch_deep_dark pre-generation diagnostics: %s\n' \
            "$known_sculk_warnings" | tee ../../logs/known-worldgen-diagnostics.log

          if grep -Eqi 'Failed to load datapacks|Errors in currently selected datapacks|Could not parse|Exception loading level|Failed to parse.*livingkingdoms|Failed to get element.*livingkingdoms|Unknown registry key.*livingkingdoms|unsafe terrain read|watchdog|Error reading optional pack metadata' ../../logs/server-smoke-actionable.log; then
            echo 'Living Kingdoms datapack, authored noise settings, dimension, world generation, or server tick error detected.' >&2
            exit 1
          fi

      - name: Graphical client origin loading HUD and codex smoke test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri >/dev/null
          rm -f ../../logs/client-smoke.log
          set +e
          timeout 360s xvfb-run -a -s '-screen 0 1280x720x24' \
            gradle --no-daemon runClient --stacktrace --console=plain \
            > ../../logs/client-smoke.log 2>&1
          client_status=$?
          set -e
          cat ../../logs/client-smoke.log
          if [ "$client_status" -ne 0 ]; then
            echo "Graphical client smoke test exited with status $client_status." >&2
            exit 1
          fi
          grep -F 'LK_CLIENT_DIAGNOSTIC_SCREEN_OPENED' ../../logs/client-smoke.log
          grep -F 'LK_CLIENT_DIAGNOSTIC_PASS screen=origin_selection rendered_window=true' ../../logs/client-smoke.log
          grep -F 'LK_CLIENT_LOADING_DIAGNOSTIC_PASS screen=realm_loading non_pausing=true' ../../logs/client-smoke.log
          grep -F 'LK_CLIENT_CODEX_DIAGNOSTIC_PASS screens=overview,equipment,map,skills' ../../logs/client-smoke.log
          grep -F 'atlas_drag=true atlas_zoom=true' ../../logs/client-smoke.log
          if grep -Eqi 'Caught exception from Living Kingdoms|Error during client initialization|Exception in client tick loop|Rendering screen|Missing textures in model livingkingdoms|Error reading optional pack metadata' ../../logs/client-smoke.log; then
            echo 'Living Kingdoms client, pack metadata, texture, or screen rendering error detected.' >&2
            exit 1
          fi

      - name: Package and inspect alpha.9 JAR
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [ "${#jars[@]}" -ne 1 ]; then
            printf 'Expected exactly one runtime JAR, found %s\n' "${#jars[@]}" >&2
            printf '%s\n' "${jars[@]:-}" >&2
            exit 1
          fi
          cp "${jars[0]}" "deliverables/$OUTPUT_JAR"
          JAR="deliverables/$OUTPUT_JAR"
          test -s "$JAR"
          unzip -t "$JAR" | tee logs/jar-test.log
          unzip -Z1 "$JAR" | tee logs/jar-entries.txt
          test "$(unzip -Z1 "$JAR" | sort | uniq -d | wc -l)" -eq 0
          unzip -Z1 "$JAR" | grep -Fx 'META-INF/neoforge.mods.toml'
          unzip -Z1 "$JAR" | grep -Eq '^kr/moonseungjun/livingkingdoms/.+\.class$'
          unzip -Z1 "$JAR" | grep -Eq '^assets/livingkingdoms/'
          unzip -Z1 "$JAR" | grep -Eq '^data/livingkingdoms/'
          unzip -Z1 "$JAR" | grep -Fx 'data/livingkingdoms/dimension/living_realm.json'
          unzip -Z1 "$JAR" | grep -Fx 'data/livingkingdoms/dimension_type/living_realm.json'
          unzip -Z1 "$JAR" | grep -Fx 'data/livingkingdoms/worldgen/noise_settings/living_continent.json'
          unzip -Z1 "$JAR" | grep -Fx 'data/livingkingdoms/worldgen/density_function/terrain/base_density.json'
          unzip -Z1 "$JAR" | grep -Fx 'data/livingkingdoms/worldgen/density_function/terrain/continent.json'
          unzip -Z1 "$JAR" | grep -Fx 'data/livingkingdoms/worldgen/density_function/terrain/erosion.json'
          unzip -Z1 "$JAR" | grep -Fx 'data/livingkingdoms/worldgen/density_function/terrain/ridges.json'
          unzip -Z1 "$JAR" | grep -Fx 'pack.mcmeta'
          unzip -p "$JAR" pack.mcmeta | grep -F '"min_format": 88'
          unzip -p "$JAR" pack.mcmeta | grep -F '"max_format": [107, 1]'
          unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-alpha.9"'
          unzip -p "$JAR" data/livingkingdoms/dimension/living_realm.json | grep -F '"settings": "livingkingdoms:living_continent"'
          if unzip -p "$JAR" data/livingkingdoms/dimension/living_realm.json | grep -Fq '"settings": "minecraft:overworld"'; then
            echo 'Runtime dimension still references vanilla overworld terrain settings.' >&2
            exit 1
          fi
          for asset in fantasy_panel panel_background button_normal button_pressed; do
            path="assets/livingkingdoms/textures/gui/kenney/${asset}.png"
            unzip -Z1 "$JAR" | grep -Fx "$path"
            test "$(unzip -p "$JAR" "$path" | wc -c)" -gt 100
          done
          unzip -Z1 "$JAR" | grep -Fx 'assets/livingkingdoms/licenses/KENNEY_UI_CC0.txt'
          unzip -p "$JAR" assets/livingkingdoms/licenses/KENNEY_UI_CC0.txt | grep -F 'Creative Commons CC0 1.0 Universal'
          if unzip -Z1 "$JAR" | grep -Eq '(^|/)(tools|\.github)/|\.java$'; then
            echo 'Forbidden development content found in runtime JAR' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee "deliverables/$OUTPUT_JAR.sha256" logs/jar-sha256.txt

      - name: Write verification report
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cat > deliverables/BUILD_AND_RUNTIME_REPORT.md <<EOF
          # Living Kingdoms 0.1.0-alpha.9 Build and Runtime Report

          - Commit: $GITHUB_SHA
          - Mod version: 0.1.0-alpha.9
          - Minecraft: 26.2
          - NeoForge: 26.2.0.38-beta
          - Java: 25
          - Gradle: 9.2.1
          - Clean build: PASS
          - Correct 26.2 pack metadata load: PASS
          - Fresh dedicated server startup: PASS
          - Dedicated living continent noise settings: PASS
          - Vanilla overworld terrain settings removed from living realm: PASS
          - Vanilla terrain candidate survey removed: PASS
          - Permanent political geography and capital anchors: PASS
          - Three authored regional capitals: PASS
          - Smooth capital-to-generated-terrain transitions: PASS
          - Legacy destructive post-build passes disabled: PASS
          - Eight verified walkable residence cells: PASS
          - Erden road, wall, canal, house floor, wall and roof checks: PASS
          - Construction debris after completion cleanup: ZERO
          - Graphical client startup under Xvfb: PASS
          - Origin and non-pausing loading screens: PASS
          - Compact codex pages remain viewport-bounded: PASS
          - Atlas drag and zoom input: PASS
          - Runtime JAR integrity and version metadata: PASS
          - Duplicate ZIP entries: NONE
          - Manual visual inspection on user hardware: PENDING

          Alpha.9 replaces the vanilla-overworld terrain reference and capital candidate search with a dedicated living-continent noise router, authored climate fields, fixed world-map anchors and regional design elevations. A fresh world is required because the dimension generator and layout revision changed.
          EOF

      - name: Upload build logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-build-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified alpha.9 build
        id: upload_build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-0.1.0-alpha.9
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish build pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
          BUILD_ARTIFACT_ID: ${{ steps.upload_build.outputs.artifact-id }}
          SOURCE_COMMIT_SHA: ${{ github.sha }}
          RUN_ID_VALUE: ${{ github.run_id }}
          RUN_NUMBER_VALUE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/living-kingdoms.json <<EOF
          {
            "run_id": "$RUN_ID_VALUE",
            "run_number": "$RUN_NUMBER_VALUE",
            "commit_sha": "$SOURCE_COMMIT_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID",
            "build_artifact_id": "$BUILD_ARTIFACT_ID"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/living-kingdoms.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Living Kingdoms build $RUN_NUMBER_VALUE"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          echo 'Unable to publish Living Kingdoms build pointer after retries.' >&2
          exit 1
