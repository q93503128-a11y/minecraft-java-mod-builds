name: Apply EARTH TO STARS alpha14 core rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ets-alpha14-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alpha.14 starter craft rescue
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p /tmp/ets-alpha14
          python3 .github/scripts/ets_alpha14_fix_runner.py
          set +e
          { python3 .github/scripts/ets_alpha14_apply.py && python3 projects/earth-to-stars/tools/validate_alpha14_acceptance.py; } 2>&1 | tee /tmp/ets-alpha14/apply.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            exit "$status"
          fi
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/earth-to-stars
          git commit -m 'earth-to-stars: rescue starter craft core alpha14'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ets-alpha14-patch-diagnostics
          path: /tmp/ets-alpha14/apply.log
          if-no-files-found: ignore
          retention-days: 1
