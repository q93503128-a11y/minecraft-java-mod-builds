          replace_once(project / 'gradle.properties', 'mod_version=0.1.0-alpha.13', 'mod_version=0.1.0-alpha.14')
          replace_once(java / 'EarthToStars.java', 'public static final String VERSION = "0.1.0-alpha.13";', 'public static final String VERSION = "0.1.0-alpha.14";')

          # JAR gate must require the adapted runtime meshes, not merely the unadapted vendor source.
          verifier = project / 'tools/verify_jar.py'
          replace_once(
              verifier,
              '''            "assets/earth_to_stars/models/kenney/space_kit/craft_speedera.obj",''',
              '''            "assets/earth_to_stars/models/runtime/starter_craft.obj",\n            "assets/earth_to_stars/models/runtime/orbital_salvage.obj",\n            "assets/earth_to_stars/models/runtime/orbital_interceptor.obj",\n            "assets/earth_to_stars/models/kenney/space_kit/craft_speedera.obj",'''
