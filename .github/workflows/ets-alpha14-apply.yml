name: Apply EARTH TO STARS alpha14 core rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ets-alpha14-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'earth-to-stars: install alpha14 patch runner'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alpha.14 starter craft rescue
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          root = Path('.')
          project = root / 'projects/earth-to-stars'
          java = project / 'src/main/java/kr/moonseungjun/earthtostars'
          res = project / 'src/main/resources/assets/earth_to_stars'

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              body = read(path)
              count = body.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              write(path, body.replace(old, new, 1))

          # Visible craft and actual ride/interaction target are now the same entity.
          write(java / 'ship/runtime/minecraft/ShipExteriorEntity.java', '''package kr.moonseungjun.earthtostars.ship.runtime.minecraft;

import kr.moonseungjun.earthtostars.content.EarthToStarsItems;
import net.minecraft.server.level.ServerPlayer;
import net.minecraft.world.InteractionHand;
import net.minecraft.world.InteractionResult;
import net.minecraft.world.entity.Display;
import net.minecraft.world.entity.Entity;
import net.minecraft.world.entity.EntityType;
import net.minecraft.world.entity.player.Player;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.level.Level;
import net.minecraft.world.phys.Vec3;

/**
 * The starter craft's visible hull, interaction target and actual passenger vehicle.
 * Persistent authority remains in ShipState/SavedData; this runtime exterior is recreated as needed.
 */
public final class ShipExteriorEntity extends Display.ItemDisplay {
    public ShipExteriorEntity(EntityType<? extends ShipExteriorEntity> type, Level level) {
        super(type, level);
        setNoGravity(true);
    }

    public void setVisualItem(Item item) {
        var slot = getSlot(0);
        if (slot == null || !slot.set(new ItemStack(item))) {
            throw new IllegalStateException("ship exterior item slot is unavailable");
        }
    }

    @Override
    public InteractionResult interact(Player player, InteractionHand hand, Vec3 location) {
        if (!(player instanceof ServerPlayer serverPlayer)) {
            return InteractionResult.SUCCESS;
        }

        ItemStack held = player.getItemInHand(hand);
        if (held.is(EarthToStarsItems.PROPELLANT_CELL.get())) {
            return ShipRuntimeManager.serviceSupply(
                    serverPlayer, this, hand, ShipSystemsManager.SupplyType.PROPELLANT);
        }
        if (held.is(EarthToStarsItems.OXYGEN_CARTRIDGE.get())) {
            return ShipRuntimeManager.serviceSupply(
                    serverPlayer, this, hand, ShipSystemsManager.SupplyType.OXYGEN);
        }
        if (player.isShiftKeyDown()) {
            return ShipRuntimeManager.retireCraft(serverPlayer, this)
                    ? InteractionResult.SUCCESS_SERVER
                    : InteractionResult.FAIL;
        }
        return ShipRuntimeManager.boardAndControl(serverPlayer, this)
                ? InteractionResult.SUCCESS_SERVER
                : InteractionResult.FAIL;
    }

    @Override
    protected boolean canAddPassenger(Entity passenger) {
        return passenger instanceof Player && getPassengers().isEmpty();
    }

    @Override
    public boolean isPickable() {
        return true;
    }

    @Override
    public boolean isPushable() {
        return false;
    }

    @Override
    public boolean canCollideWith(Entity other) {
        return false;
    }

    @Override
    public boolean canBeCollidedWith(Entity other) {
        return false;
    }
}
''')

          write(java / 'ship/client/ShipExteriorEntityRenderer.java', '''package kr.moonseungjun.earthtostars.ship.client;

import net.minecraft.client.renderer.entity.DisplayRenderer;
import net.minecraft.client.renderer.entity.EntityRendererProvider;

/** Renders the same ItemDisplay entity that owns the pilot seat and interaction hitbox. */
public final class ShipExteriorEntityRenderer extends DisplayRenderer.ItemDisplayRenderer {
    public ShipExteriorEntityRenderer(EntityRendererProvider.Context context) {
        super(context);
    }
}
''')

          entities = java / 'content/EarthToStarsEntities.java'
          replace_once(
              entities,
              '''                    .sized(2.4F, 1.35F)\n                    .eyeHeight(0.85F)\n                    .attach(EntityAttachment.PASSENGER, 0.0F, -0.50F, 0.12F)''',
              '''                    .sized(5.4F, 2.3F)\n                    .eyeHeight(1.25F)\n                    .attach(EntityAttachment.PASSENGER, 0.0F, 1.20F, 0.35F)'''
          )

          # Deployment accepts harmless vegetation, clears it, uses a footprint matching the craft,
          # and auto-boards the newly assembled craft without requiring commands or an extra click.
          write(java / 'content/LaunchCraftKitItem.java', '''package kr.moonseungjun.earthtostars.content;

import kr.moonseungjun.earthtostars.ship.runtime.minecraft.ShipRuntimeManager;
import net.minecraft.core.BlockPos;
import net.minecraft.network.chat.Component;
import net.minecraft.server.level.ServerLevel;
import net.minecraft.server.level.ServerPlayer;
import net.minecraft.world.InteractionResult;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.context.UseOnContext;
import net.minecraft.world.level.Level;
import net.minecraft.world.level.block.state.BlockState;
import net.minecraft.world.phys.Vec3;

public final class LaunchCraftKitItem extends Item {
    private static final int DEPLOY_RADIUS = 2;
    private static final int DEPLOY_HEIGHT = 3;

    public LaunchCraftKitItem(Properties properties) {
        super(properties);
    }

    @Override
    public InteractionResult useOn(UseOnContext context) {
        if (!(context.getPlayer() instanceof ServerPlayer player)) {
            return InteractionResult.SUCCESS;
        }
        if (!(context.getLevel() instanceof ServerLevel level)) {
            return InteractionResult.FAIL;
        }
        if (!level.dimension().equals(Level.OVERWORLD)) {
            player.sendSystemMessage(Component.translatable("message.earth_to_stars.launch.earth_only"));
            return InteractionResult.FAIL;
        }

        BlockPos base = context.getClickedPos().relative(context.getClickedFace());
        if (!prepareDeploymentSite(level, base)) {
            player.sendSystemMessage(Component.translatable("message.earth_to_stars.launch.blocked"), true);
            return InteractionResult.FAIL;
        }

        Vec3 spawn = Vec3.atBottomCenterOf(base).add(0.0D, 0.05D, 0.0D);
        ShipRuntimeManager.LaunchDeploymentResult result = ShipRuntimeManager.deployLaunchCraft(
                player,
                level,
                spawn,
                level.getGameTime()
        );

        return switch (result) {
            case DEPLOYED -> {
                if (!player.getAbilities().instabuild) {
                    context.getItemInHand().shrink(1);
                }
                player.sendSystemMessage(Component.translatable("message.earth_to_stars.launch.deployed"), true);
                yield InteractionResult.SUCCESS_SERVER;
            }
            case ALREADY_OWNS_CRAFT -> {
                player.sendSystemMessage(Component.translatable("message.earth_to_stars.launch.existing"), true);
                yield InteractionResult.FAIL;
            }
            case CONTROL_UNAVAILABLE -> {
                player.sendSystemMessage(Component.translatable("message.earth_to_stars.launch.control_unavailable"), true);
                yield InteractionResult.FAIL;
            }
            case DEPLOYMENT_FAILED -> {
                player.sendSystemMessage(Component.translatable("message.earth_to_stars.launch.failed"), true);
                yield InteractionResult.FAIL;
            }
        };
    }

    private static boolean prepareDeploymentSite(ServerLevel level, BlockPos base) {
        for (int y = 0; y < DEPLOY_HEIGHT; y++) {
            for (int x = -DEPLOY_RADIUS; x <= DEPLOY_RADIUS; x++) {
                for (int z = -DEPLOY_RADIUS; z <= DEPLOY_RADIUS; z++) {
                    BlockState state = level.getBlockState(base.offset(x, y, z));
                    if (!state.isAir() && (!state.canBeReplaced() || !state.getFluidState().isEmpty())) {
                        return false;
                    }
                }
            }
        }
        for (int y = 0; y < DEPLOY_HEIGHT; y++) {
            for (int x = -DEPLOY_RADIUS; x <= DEPLOY_RADIUS; x++) {
                for (int z = -DEPLOY_RADIUS; z <= DEPLOY_RADIUS; z++) {
                    BlockPos pos = base.offset(x, y, z);
                    BlockState state = level.getBlockState(pos);
                    if (!state.isAir() && state.canBeReplaced() && state.getFluidState().isEmpty()) {
                        level.removeBlock(pos, false);
                    }
                }
            }
        }
        return true;
    }
}
''')

          # Supply items no longer magically service whichever ship happens to be nearby.
          write(java / 'content/ShipSupplyItem.java', '''package kr.moonseungjun.earthtostars.content;

import kr.moonseungjun.earthtostars.ship.runtime.minecraft.ShipSystemsManager;
import net.minecraft.network.chat.Component;
import net.minecraft.server.level.ServerPlayer;
import net.minecraft.world.InteractionResult;
import net.minecraft.world.item.Item;
import net.minecraft.world.item.context.UseOnContext;

public final class ShipSupplyItem extends Item {
    private final ShipSystemsManager.SupplyType supplyType;

    public ShipSupplyItem(Properties properties, ShipSystemsManager.SupplyType supplyType) {
        super(properties);
        this.supplyType = supplyType;
    }

    public ShipSystemsManager.SupplyType supplyType() {
        return supplyType;
    }

    @Override
    public InteractionResult useOn(UseOnContext context) {
        if (context.getPlayer() instanceof ServerPlayer player) {
            player.sendSystemMessage(Component.translatable("message.earth_to_stars.supply.use_on_ship"), true);
        }
        return InteractionResult.FAIL;
    }
}
''')

          systems = java / 'ship/runtime/minecraft/ShipSystemsManager.java'
          replace_once(
              systems,
              '''    public static SupplyLoadResult loadSupply(ServerPlayer player, SupplyType type) {\n        ShipState ship = ShipRuntimeManager.accessibleShip(player, ShipPermission.INTERIOR_ACCESS).orElse(null);\n        if (ship == null) return SupplyLoadResult.NO_ACCESSIBLE_SHIP;\n        ShipSystemsRuntime systems = systems(ship);\n        double accepted = switch (type) {\n            case PROPELLANT -> systems.loadPropellantCell();\n            case OXYGEN -> systems.loadOxygenCartridge();\n        };\n        if (accepted <= 1.0E-9D) return SupplyLoadResult.TANK_FULL;\n        ShipSystemsSavedData.get(player.level().getServer()).put(systems.snapshot());\n        return SupplyLoadResult.LOADED;\n    }''',
              '''    public static SupplyLoadResult loadSupply(ServerPlayer player, SupplyType type) {\n        ShipState ship = ShipRuntimeManager.accessibleShip(player, ShipPermission.INTERIOR_ACCESS).orElse(null);\n        if (ship == null) return SupplyLoadResult.NO_ACCESSIBLE_SHIP;\n        return loadSupply(ship, type, player.level().getServer());\n    }\n\n    static SupplyLoadResult loadSupply(ShipState ship, SupplyType type, MinecraftServer server) {\n        ShipSystemsRuntime systems = systems(ship);\n        double accepted = switch (type) {\n            case PROPELLANT -> systems.loadPropellantCell();\n            case OXYGEN -> systems.loadOxygenCartridge();\n        };\n        if (accepted <= 1.0E-9D) return SupplyLoadResult.TANK_FULL;\n        ShipSystemsSavedData.get(server).put(systems.snapshot());\n        return SupplyLoadResult.LOADED;\n    }'''
          )

          runtime = java / 'ship/runtime/minecraft/ShipRuntimeManager.java'
          replace_once(runtime,
              'import net.minecraft.server.level.ServerPlayer;\nimport net.minecraft.world.entity.Display;',
              'import net.minecraft.server.level.ServerPlayer;\nimport net.minecraft.world.InteractionHand;\nimport net.minecraft.world.InteractionResult;\nimport net.minecraft.world.entity.Display;')

          replace_once(
              runtime,
              '''    public static LaunchDeploymentResult deployLaunchCraft(ServerPlayer player, ServerLevel level, Vec3 spawn, long tick) {\n        if (REPOSITORY.findOwnedBy(player.getUUID()).isPresent()) {\n            return LaunchDeploymentResult.ALREADY_OWNS_CRAFT;\n        }\n        return createStarterCraft(player, level, spawn) == null\n                ? LaunchDeploymentResult.DEPLOYMENT_FAILED\n                : LaunchDeploymentResult.DEPLOYED;\n    }''',
              '''    public static LaunchDeploymentResult deployLaunchCraft(ServerPlayer player, ServerLevel level, Vec3 spawn, long tick) {\n        if (REPOSITORY.findOwnedBy(player.getUUID()).isPresent()) {\n            return LaunchDeploymentResult.ALREADY_OWNS_CRAFT;\n        }\n        Entry entry = createStarterCraft(player, level, spawn);\n        if (entry == null) {\n            return LaunchDeploymentResult.DEPLOYMENT_FAILED;\n        }\n        // First-use friction stays low: assembling the craft also puts the owner in the real pilot seat.\n        boardAndControl(player, entry.exterior(), tick);\n        return LaunchDeploymentResult.DEPLOYED;\n    }'''
          )

          marker = '''    public static boolean controlNearest(ServerPlayer player, long tick) {'''
          service = '''    public static InteractionResult serviceSupply(\n            ServerPlayer player,\n            ShipExteriorEntity exterior,\n            InteractionHand hand,\n            ShipSystemsManager.SupplyType type\n    ) {\n        Entry entry = ENTRIES.get(exterior.getId());\n        if (entry == null || entry.exterior() != exterior || exterior.isRemoved() || exterior.level() != player.level()) {\n            player.sendSystemMessage(Component.translatable("message.earth_to_stars.supply.no_ship"), true);\n            return InteractionResult.FAIL;\n        }\n        ShipState ship = entry.runtime().ship();\n        if (!ship.can(player.getUUID(), ShipPermission.INTERIOR_ACCESS)) {\n            player.sendSystemMessage(Component.translatable("message.earth_to_stars.supply.no_ship"), true);\n            return InteractionResult.FAIL;\n        }\n\n        ShipSystemsManager.SupplyLoadResult result = ShipSystemsManager.loadSupply(\n                ship, type, player.level().getServer());\n        return switch (result) {\n            case LOADED -> {\n                if (!player.getAbilities().instabuild) {\n                    player.getItemInHand(hand).shrink(1);\n                }\n                player.sendSystemMessage(Component.translatable(\n                        type == ShipSystemsManager.SupplyType.PROPELLANT\n                                ? "message.earth_to_stars.supply.propellant_loaded"\n                                : "message.earth_to_stars.supply.oxygen_loaded"\n                ), true);\n                yield InteractionResult.SUCCESS_SERVER;\n            }\n            case TANK_FULL -> {\n                player.sendSystemMessage(Component.translatable(\n                        type == ShipSystemsManager.SupplyType.PROPELLANT\n                                ? "message.earth_to_stars.supply.propellant_full"\n                                : "message.earth_to_stars.supply.oxygen_full"\n                ), true);\n                yield InteractionResult.SUCCESS_SERVER;\n            }\n            case NO_ACCESSIBLE_SHIP -> {\n                player.sendSystemMessage(Component.translatable("message.earth_to_stars.supply.no_ship"), true);\n                yield InteractionResult.FAIL;\n            }\n        };\n    }\n\n'''
          replace_once(runtime, marker, service + marker)

          old_vehicle = '''    private static VehiclePair createVehiclePair(ServerLevel level, Vec3 position, float yaw, float pitch) {\n        ShipExteriorEntity exterior = new ShipExteriorEntity(EarthToStarsEntities.SHIP_EXTERIOR.get(), level);\n        exterior.setPos(position.x, position.y, position.z);\n        exterior.setYRot(yaw);\n        exterior.setXRot(pitch);\n        if (!level.addFreshEntity(exterior)) {\n            return null;\n        }\n\n        Display.ItemDisplay visual = SpaceVisualFactory.create(\n                level,\n                EarthToStarsItems.STARTER_CRAFT_VISUAL.get(),\n                new ShipVec3(position.x, position.y, position.z),\n                yaw,\n                pitch\n        );\n        if (!level.addFreshEntity(visual)) {\n            exterior.discard();\n            return null;\n        }\n        return new VehiclePair(exterior, visual);\n    }'''
          new_vehicle = '''    private static VehiclePair createVehiclePair(ServerLevel level, Vec3 position, float yaw, float pitch) {\n        ShipExteriorEntity exterior = new ShipExteriorEntity(EarthToStarsEntities.SHIP_EXTERIOR.get(), level);\n        exterior.setVisualItem(EarthToStarsItems.STARTER_CRAFT_VISUAL.get());\n        exterior.setPos(position.x, position.y, position.z);\n        exterior.setYRot(yaw);\n        exterior.setXRot(pitch);\n        if (!level.addFreshEntity(exterior)) {\n            return null;\n        }\n        // The rendered hull and authoritative passenger vehicle are literally the same entity.\n        return new VehiclePair(exterior, exterior);\n    }'''
          replace_once(runtime, old_vehicle, new_vehicle)

          # Produce Minecraft-safe runtime variants: preserve Kenney geometry/material groups,
          # normalize UVs to the center of the white adapter texture, and scale the starter craft to vehicle size.
          vendor = res / 'models/kenney/space_kit'
          runtime_models = res / 'models/runtime'
          runtime_models.mkdir(parents=True, exist_ok=True)
          specs = {
              'craft_speedera.obj': ('starter_craft.obj', 2.60),
              'craft_miner.obj': ('orbital_salvage.obj', 1.35),
              'craft_racer.obj': ('orbital_interceptor.obj', 1.50),
          }
          for source_name, (output_name, scale) in specs.items():
              source = read(vendor / source_name).splitlines()
              out = ['# Minecraft-safe runtime adaptation of Kenney Space Kit (CC0).', f'# source={source_name} scale={scale:.2f} uv=center-sampled']
              for line in source:
                  stripped = line.strip()
                  if stripped.startswith('mtllib '):
                      continue
                  if stripped.startswith('v '):
                      parts = stripped.split()
                      if len(parts) < 4:
                          raise SystemExit(f'invalid vertex in {source_name}: {line}')
                      x, y, z = (float(parts[1]), float(parts[2]), float(parts[3]))
                      out.append(f'v {x * scale:.7f} {y * scale:.7f} {z * scale:.7f}')
                  elif stripped.startswith('vt '):
                      out.append('vt 0.5000000 0.5000000')
                  else:
                      out.append(line)
              write(runtime_models / output_name, '\n'.join(out) + '\n')

          model_mapping = {
              'starter_craft_visual.json': ('earth_to_stars:models/runtime/starter_craft.obj', 'earth_to_stars:models/kenney/space_kit/craft_speedera.mtl'),
              'orbital_salvage_visual.json': ('earth_to_stars:models/runtime/orbital_salvage.obj', 'earth_to_stars:models/kenney/space_kit/craft_miner.mtl'),
              'orbital_interceptor_visual.json': ('earth_to_stars:models/runtime/orbital_interceptor.obj', 'earth_to_stars:models/kenney/space_kit/craft_racer.mtl'),
              'launch_craft_kit.json': ('earth_to_stars:models/runtime/starter_craft.obj', 'earth_to_stars:models/kenney/space_kit/craft_speedera.mtl'),
          }
          for name, (model_path, mtl_path) in model_mapping.items():
              path = res / 'models/item' / name
              data = json.loads(read(path))
              data['model'] = model_path
              data['mtl_override'] = mtl_path
              if name == 'launch_craft_kit.json':
                  data['display'] = {
                      'gui': {'rotation': [25, 225, 0], 'scale': [0.22, 0.22, 0.22]},
                      'ground': {'scale': [0.14, 0.14, 0.14]},
                      'fixed': {'scale': [0.22, 0.22, 0.22]},
                      'firstperson_righthand': {'rotation': [0, 225, 0], 'scale': [0.18, 0.18, 0.18]},
                      'firstperson_lefthand': {'rotation': [0, 135, 0], 'scale': [0.18, 0.18, 0.18]},
                      'thirdperson_righthand': {'rotation': [0, 225, 0], 'scale': [0.16, 0.16, 0.16]},
                      'thirdperson_lefthand': {'rotation': [0, 135, 0], 'scale': [0.16, 0.16, 0.16]},
                  }
              write(path, json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          # Player-facing language: no 3x3 debug-style clearance instruction, and service is hull-directed.
          for locale in ('ko_kr', 'en_us'):
              path = res / 'lang' / f'{locale}.json'
              data = json.loads(read(path))
              if locale == 'ko_kr':
                  data['message.earth_to_stars.launch.blocked'] = '개척선을 펼칠 공간이 부족합니다. 주변의 단단한 장애물을 치워 주세요.'
                  data['message.earth_to_stars.supply.use_on_ship'] = '보급품을 들고 개척선 본체에 사용하세요.'
                  data['message.earth_to_stars.launch.deployed'] = '개척선이 전개되고 조종석이 온라인 상태로 전환됩니다.'
              else:
