name: Patch Living Kingdoms fantasy items

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/wire_living_kingdoms_fantasy_items.py'
      - '.github/workflows/patch-living-kingdoms-fantasy-items.yml'

permissions:
  contents: write

concurrency:
  group: living-kingdoms-fantasy-items-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Wire fantasy item registry
        run: python .github/scripts/wire_living_kingdoms_fantasy_items.py
      - name: Clean compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Verify fantasy material invariants
        shell: bash
        run: |
          set -euo pipefail
          items='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/item/FantasyItems.java'
          main='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java'
          grep -Fq 'DeferredRegister.createItems' "$items"
          grep -Fq 'silver_antler' "$items"
          grep -Fq 'ash_fang' "$items"
          grep -Fq 'river_essence' "$items"
          grep -Fq 'FantasyItems.register(modEventBus)' "$main"
          for species in silver_hart ash_hound river_wisp; do
            test -f "projects/living-kingdoms/src/main/resources/data/livingkingdoms/loot_table/entities/${species}.json"
          done
          grep -Fq 'livingkingdoms:silver_antler' projects/living-kingdoms/src/main/resources/data/livingkingdoms/loot_table/entities/silver_hart.json
          grep -Fq 'livingkingdoms:ash_fang' projects/living-kingdoms/src/main/resources/data/livingkingdoms/loot_table/entities/ash_hound.json
          grep -Fq 'livingkingdoms:river_essence' projects/living-kingdoms/src/main/resources/data/livingkingdoms/loot_table/entities/river_wisp.json
          for item in silver_antler ash_fang river_essence; do
            test -f "projects/living-kingdoms/src/main/resources/assets/livingkingdoms/items/${item}.json"
          done
      - name: Commit compiled item wiring directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java
          git diff --cached --quiet && exit 0
          git commit -m 'feat(living-kingdoms): wire fantasy ecology materials'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
