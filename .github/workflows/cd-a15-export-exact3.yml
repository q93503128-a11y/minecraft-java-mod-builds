name: RPG6 Player Locator Plus probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-export-exact3.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Player Locator Plus
        shell: bash
        run: |
          set -euo pipefail
          f=$(mktemp --suffix=.jar)
          url='https://cdn.modrinth.com/data/e0Yt2i7Q/versions/qmk5gUzE/player-locator-plus-2.4.0.jar'
          curl --fail --location --retry 3 "$url" -o "$f"
          echo "PLP_META $(sha1sum "$f"|awk '{print $1}') $(sha512sum "$f"|awk '{print $1}') $(stat -c%s "$f")"
          unzip -p "$f" fabric.mod.json
