name: RPG6 locator compatibility probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-export-exact3.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe LocatorBar releases
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r ver url; do
            f=$(mktemp --suffix=.jar)
            curl --fail --location --retry 3 "$url" -o "$f"
            echo "LOCATOR $ver $(sha1sum "$f"|awk '{print $1}') $(sha512sum "$f"|awk '{print $1}') $(stat -c%s "$f")"
            unzip -p "$f" fabric.mod.json
            rm -f "$f"
          done <<'EOF'
          1.2.1	https://cdn.modrinth.com/data/BD7N7OcY/versions/uV1wuVPV/LocatorBar-fabric-1.2.1%2B1.21.1.jar
          1.1.2	https://cdn.modrinth.com/data/BD7N7OcY/versions/AelByFS6/LocatorBar-fabric-1.1.2%2B1.21.1.jar
          1.1.1	https://cdn.modrinth.com/data/BD7N7OcY/versions/mtLlD9e5/LocatorBar-fabric-1.1.1%2B1.21.1.jar
          1.1.0	https://cdn.modrinth.com/data/BD7N7OcY/versions/Tk7JNGyd/LocatorBar-fabric-1.1.0%2B1.21.1.jar
          EOF
