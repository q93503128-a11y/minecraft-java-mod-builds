          mods/fabric-language-kotlin-1.13.8+kotlin.2.3.0.jar	https://cdn.modrinth.com/data/Ha28R6CL/versions/N6D3uiZF/fabric-language-kotlin-1.13.8%2Bkotlin.2.3.0.jar
          mods/Essential_1-5-0-1_fabric_1-21-1.jar	https://cdn.modrinth.com/data/k2ZPuTBm/versions/Z9lbcWp2/Essential_1-5-0-1_fabric_1-21-1.jar
          EOF
          while IFS=$'\t' read -r path url; do
            [ -z "$path" ] && continue
            tmp=$(mktemp)
            curl --fail --location --retry 4 --retry-delay 2 "$url" -o "$tmp"
            sha1=$(sha1sum "$tmp" | awk '{print $1}')
            sha512=$(sha512sum "$tmp" | awk '{print $1}')
            size=$(stat -c%s "$tmp")
            printf 'RPGMETA\t%s\t%s\t%s\t%s\n' "$path" "$sha1" "$sha512" "$size"
            rm -f "$tmp"
          done < /tmp/rpg5_urls.tsv
