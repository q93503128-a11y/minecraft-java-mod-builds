name: RPG5 metadata audit
# trigger-2
on:
  push:
    paths:
      - .github/workflows/cd-a15-export-exact3.yml
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and hash Modrinth files
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/rpg5_urls.tsv <<'EOF'
