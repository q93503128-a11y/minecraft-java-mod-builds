name: RPG6 metadata probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-export-exact3.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe two mods
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r path url; do
            f=$(mktemp --suffix=.jar)
            curl --fail --location --retry 4 "$url" -o "$f"
            printf 'RPG6META\t%s\t%s\t%s\t%s\n' "$path" "$(sha1sum "$f"|awk '{print $1}')" "$(sha512sum "$f"|awk '{print $1}')" "$(stat -c%s "$f")"
            echo "RPG6FABRICMOD $path"
            unzip -p "$f" fabric.mod.json 2>/dev/null || true
            rm -f "$f"
          done <<'EOF'
          mods/LocatorBar-fabric-1.2.2+1.21.1.jar	https://cdn.modrinth.com/data/BD7N7OcY/versions/zlyrzjUG/LocatorBar-fabric-1.2.2%2B1.21.1.jar
          mods/NoChatRestrictions-Fabric-MC1.21.11-v1.0.2.jar	https://cdn.modrinth.com/data/z440MEwJ/versions/Wmvqt0wm/NoChatRestrictions-Fabric-MC1.21.11-v1.0.2.jar
          EOF
