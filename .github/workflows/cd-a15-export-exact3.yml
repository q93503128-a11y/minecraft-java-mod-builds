name: RPG6 Player Locator Plus version probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-export-exact3.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe PLP releases
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r ver vid file; do
            f=$(mktemp --suffix=.jar)
            url="https://cdn.modrinth.com/data/e0Yt2i7Q/versions/$vid/$file"
            curl --fail --location --retry 3 "$url" -o "$f"
            echo "PLP $ver $(sha1sum "$f"|awk '{print $1}') $(sha512sum "$f"|awk '{print $1}') $(stat -c%s "$f")"
            unzip -p "$f" fabric.mod.json
            rm -f "$f"
          done <<'EOF'
          2.2.0	hAFRkZV8	player-locator-plus-2.2.0.jar
          2.1.3	nsyf6Qls	player-locator-plus-2.1.3.jar
          1.2.0	mtm8tGZh	player-locator-plus-1.2.0.jar
          EOF
