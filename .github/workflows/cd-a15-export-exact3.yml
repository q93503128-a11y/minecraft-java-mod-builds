name: Build Countryside Days alpha.15 exact v3

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-export-exact3.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT: projects/countryside-days
  JAR_NAME: countrysidedays-0.1.0-alpha.15.jar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore exact alpha.15 source
        id: restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, zipfile

          root = Path('.').resolve()
          tools = root / 'projects/countryside-days/tools'
          specs = [
              ('alpha15v2_00.part', 8000, '05764a738c93db7933e60f6db85fea2d6cf168297536e79146ef28dc1eb96349'),
              ('alpha15v2_01.part', 8000, 'f62307daf23ace1c04c1c4b09fdf75e3ba2a24018c550a90558753f00fc6f8b6'),
              ('alpha15v2_02.part', 8000, '647cf040b1669045f8e57f2a0eb67968e81c1753621095be6d3f4be046e00beb'),
              ('alpha15exact_03.part', 8000, '785f1b3d3b25d4482cbac7a7e11eb98436b76882d22935ce0071cfcb369dbcaf'),
              ('alpha15exact_04.part', 8000, 'aa843460fb86c04dfff90515fae28237f213dce4dc43fcf6ceb7a5c7480e5a44'),
              ('alpha15v2_05_06.part', 16000, 'ba4d245f3e29c0710e903a25c7fc2ada8cd306675bf373b8e001c22d88f931e9'),
              ('alpha15v2_07_08.part', 16000, '17528aa349b2a47a0192ddf71506d270487439261742b3212e8b3407e6846c3d'),
              ('alpha15v2_09_10.part', 16000, 'a975b3c098d730d4077d8729118537ebd9c7f96aebd4455c8cb1f8dc1ed270c2'),
              ('alpha15exact_11.part', 8000, '8991340273b26d6601fc54df80adfb83e54b88d58a93bc02b017a3f0d104d5a1'),
              ('alpha15exact_12.part', 8000, 'bf10be8d174e92ff42def406331ae70837c1a6f85901bdd4a1a6386f0d386bc1'),
              ('alpha15v2_13_14.part', 16000, 'a1dd5c64d5d0524d691a228af3d07c35195a1ec76046947d647d9f080b256f05'),
              ('alpha15v2_15_16.part', 16000, '0b84bdbbb7d5a93b360911a75c608961515cea999960e8027746ef296619418f'),
              ('alpha15v2_17_18.part', 9648, '870c0a5b8faed07c9597402175e58b7659ed41ead761cb3a82f45f9bab6477d6'),
          ]
          chunks = []
          for name, length, expected_sha in specs:
              text = ''.join((tools / name).read_text('ascii').split())
              actual_sha = hashlib.sha256(text.encode('ascii')).hexdigest()
              if len(text) != length or actual_sha != expected_sha:
                  raise SystemExit(f'bad payload part {name}: len={len(text)} sha={actual_sha}')
              chunks.append(text)

          encoded = ''.join(chunks)
          if len(encoded) != 145648:
              raise SystemExit(f'bad payload length: {len(encoded)}')
          if hashlib.sha256(encoded.encode('ascii')).hexdigest() != '2215f32a4fda34d490241a811051e9164eb39a4f31831894e9ce3df3361ec4ca':
              raise SystemExit('bad payload text sha')
          archive = base64.b64decode(encoded, validate=True)
          if len(archive) != 109234 or hashlib.sha256(archive).hexdigest() != '5499bb9fe956c9bf11a6f311105e03bcc694bc2adeed74080431cd882d80b835':
              raise SystemExit('bad source archive')
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              if zf.testzip() is not None:
                  raise SystemExit('bad ZIP member')
              zf.extractall(root)
          props = (root / 'projects/countryside-days/gradle.properties').read_text('utf-8')
          if 'mod_version=0.1.0-alpha.15' not in props:
              raise SystemExit('wrong restored version')
          print('exact alpha.15 source restored')
          PY

      - name: Apply NeoForge 26.2 compile fixes
        id: patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, struct

          root = Path('projects/countryside-days')

          # FarmlandTrampleEvent is nested in BlockEvent in NeoForge 26.2.
          p = root / 'src/main/java/kr/countrysidedays/world/CountrysidePropertyManager.java'
          s = p.read_text('utf-8')
          s = s.replace(
              'import net.neoforged.neoforge.event.level.block.FarmlandTrampleEvent;',
              'import net.neoforged.neoforge.event.level.BlockEvent.FarmlandTrampleEvent;'
          )
          if 'BlockEvent.FarmlandTrampleEvent' not in s:
              raise SystemExit('farmland event import patch failed')
          p.write_text(s, 'utf-8')

          # AABB no longer accepts two BlockPos values.
          p = root / 'src/main/java/kr/countrysidedays/gametest/ModGameTests.java'
          s = p.read_text('utf-8')
          old = '''        AABB ranch = new AABB(
                absoluteOrigin.offset(PlayerEstateLayout.RANCH_MIN_X, 0, PlayerEstateLayout.RANCH_MIN_Z),
                absoluteOrigin.offset(PlayerEstateLayout.RANCH_MAX_X + 1, 5, PlayerEstateLayout.RANCH_MAX_Z + 1)
        );'''
          new = '''        BlockPos ranchMin = absoluteOrigin.offset(PlayerEstateLayout.RANCH_MIN_X, 0, PlayerEstateLayout.RANCH_MIN_Z);
        BlockPos ranchMax = absoluteOrigin.offset(PlayerEstateLayout.RANCH_MAX_X + 1, 5, PlayerEstateLayout.RANCH_MAX_Z + 1);
        AABB ranch = new AABB(
                ranchMin.getX(), ranchMin.getY(), ranchMin.getZ(),
                ranchMax.getX(), ranchMax.getY(), ranchMax.getZ()
        );'''
          if old not in s:
              raise SystemExit('GameTest AABB patch target missing')
          p.write_text(s.replace(old, new), 'utf-8')

          p = root / 'src/main/java/kr/countrysidedays/world/PublicVillageExpansionBuilder.java'
          s = p.read_text('utf-8')
          old = '''        AABB bounds = new AABB(
                origin.offset(-58, -2, -48),
                origin.offset(58, 14, 59)
        );'''
          new = '''        BlockPos debrisMin = origin.offset(-58, -2, -48);
        BlockPos debrisMax = origin.offset(58, 14, 59);
        AABB bounds = new AABB(
                debrisMin.getX(), debrisMin.getY(), debrisMin.getZ(),
                debrisMax.getX(), debrisMax.getY(), debrisMax.getZ()
        );'''
          if old not in s:
              raise SystemExit('village AABB patch target missing')
          p.write_text(s.replace(old, new), 'utf-8')

          # ArmorStand#setSmall is private in the 26.2 mappings.
          p = root / 'src/main/java/kr/countrysidedays/gameplay/RestaurantTableManager.java'
          s = p.read_text('utf-8')
          if '        display.setSmall(true);\n' not in s:
              raise SystemExit('armor stand patch target missing')
          p.write_text(s.replace('        display.setSmall(true);\n', ''), 'utf-8')

          # Valid vanilla configured feature id.
          p = root / 'src/main/resources/data/countrysidedays/worldgen/biome/rural_plains.json'
          p.write_text(p.read_text('utf-8').replace(
              'minecraft:trees_birch_and_oak_leaf_litter',
              'minecraft:trees_birch_and_oak'
          ), 'utf-8')

          # Minimal deterministic GameTest templates.
          def u16(value):
              raw = value.encode('utf-8')
              return struct.pack('>H', len(raw)) + raw
          def tag(kind, name, payload):
              return bytes([kind]) + u16(name) + payload
          def list_tag(kind, items):
              return bytes([kind]) + struct.pack('>i', len(items)) + b''.join(items)
          def compound(items):
              return b''.join(items) + b'\x00'

          palette = compound([tag(8, 'Name', u16('minecraft:air'))])
          body = compound([
              tag(3, 'DataVersion', struct.pack('>i', 0)),
              tag(9, 'size', list_tag(3, [struct.pack('>i', 1)] * 3)),
              tag(9, 'palette', list_tag(10, [palette])),
              tag(9, 'blocks', list_tag(10, [])),
              tag(9, 'entities', list_tag(10, [])),
          ])
          nbt = bytes([10]) + u16('') + body
          out = root / 'src/main/resources/data/countrysidedays/structure'
          out.mkdir(parents=True, exist_ok=True)
          for name in ('homestead_layout.nbt', 'world_data_round_trip.nbt'):
              with (out / name).open('wb') as target:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=target, mtime=0) as gz:
                      gz.write(nbt)
          print('NeoForge 26.2 compile fixes applied')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Clean build and verify JAR
        id: compile
        working-directory: ${{ env.PROJECT }}
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 9.2.1 --distribution-type bin
            chmod +x gradlew
          fi
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee /tmp/cd-a15-v3-build.log
          JAR="build/libs/${JAR_NAME}"
          test -s "$JAR"
          python3 tools/verify_jar.py "$JAR"
          unzip -t "$JAR"
          sha256sum "$JAR"

      - name: Upload verified JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.15-jar
          path: ${{ env.PROJECT }}/build/libs/${{ env.JAR_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish encoded JAR transfer
        id: export
        run: |
          JAR="${PROJECT}/build/libs/${JAR_NAME}"
          DEST=release-transfer/countryside-days-alpha15
          rm -rf "$DEST"
          mkdir -p "$DEST"
          base64 -w0 "$JAR" > /tmp/cd-a15-v3.jar.b64
          split -b 40000 -d -a 2 /tmp/cd-a15-v3.jar.b64 "$DEST/part-"
          {
            echo "filename=${JAR_NAME}"
            echo "size=$(stat -c%s "$JAR")"
            echo "sha256=$(sha256sum "$JAR" | cut -d' ' -f1)"
            echo "base64_size=$(stat -c%s /tmp/cd-a15-v3.jar.b64)"
            echo "parts=$(find "$DEST" -name 'part-*' | wc -l)"
            echo "run=${GITHUB_RUN_ID}"
          } > "$DEST/MANIFEST.txt"

          git restore --source=HEAD --staged --worktree "$PROJECT"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$DEST"
          git commit -m 'Publish verified Countryside Days alpha.15 JAR transfer v3'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record build status
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          EXPORT_OUTCOME: ${{ steps.export.outcome }}
        run: |
          git restore --source=HEAD --staged --worktree "$PROJECT" || true
          DEST=release-transfer/countryside-days-alpha15-status
          mkdir -p "$DEST"
          FILE="$DEST/v3-${GITHUB_RUN_ID}.txt"
          {
            echo "run=${GITHUB_RUN_ID}"
            echo "restore=${RESTORE_OUTCOME}"
            echo "patch=${PATCH_OUTCOME}"
            echo "compile=${COMPILE_OUTCOME}"
            echo "export=${EXPORT_OUTCOME}"
            if [ -f /tmp/cd-a15-v3-build.log ]; then
              echo '--- build tail ---'
              tail -n 140 /tmp/cd-a15-v3-build.log
            fi
          } > "$FILE"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$FILE"
          git commit -m "Record Countryside Days alpha.15 exact v3 ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
