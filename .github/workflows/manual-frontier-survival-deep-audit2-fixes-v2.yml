name: Manual Frontier Survival Deep Audit 2 Fixes V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-frontier-survival-deep-audit2-fixes-v2.yml'

permissions:
  contents: write

jobs:
  fix-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply deep audit fixes
        run: python3 .github/scripts/frontier_survival_deep_audit2_fix.py
      - name: Source contract audit
        shell: bash
        run: |
          set -euo pipefail
          F=projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement
          S=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension
          grep -q 'SettlementWorkerService::onServerStopping' "$F/FrontierSettlement.java"
          grep -q 'RESOURCE_TARGETS.clear()' "$F/settlement/SettlementWorkerService.java"
          grep -q 'ExpeditionIncidentSystem::onServerStopping' "$S/SurvivalAscension.java"
          grep -q 'ApexHuntSystem::onServerStopping' "$S/SurvivalAscension.java"
          grep -q 'AscensionTrialSystem::onServerStopping' "$S/SurvivalAscension.java"
          grep -q 'OutpostSiegeSystem::onServerStopping' "$S/SurvivalAscension.java"
          grep -q 'cleanupMobs(trial)' "$S/endgame/AscensionTrialSystem.java"
          grep -q 'BooleanSupplier localSupplyCommit' "$S/production/OutpostSiegeSystem.java"
          grep -q 'BooleanSupplier localSupplyCommit' "$S/expedition/ExpeditionOperationSystem.java"
          grep -q 'startBastionOrStatus(player, () -> consumeLocalOutpostSupply' "$S/production/ProductionService.java"
          grep -q 'startOrStatus(player, () -> consumeLocalOutpostSupply' "$S/production/ProductionService.java"
          ! grep -q '시작 직후 전초 재고가 바뀌어 시작을 취소했습니다' "$S/production/ProductionService.java"
          grep -q 'mod_version=0.1.0-alpha.92' projects/frontier-settlement/gradle.properties
          grep -q 'mod_version=0.61.1-alpha.1' projects/survival-ascension/gradle.properties
          git diff --check
      - name: Resource JSON audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          for project in ('projects/frontier-settlement', 'projects/survival-ascension'):
              files = list((Path(project) / 'src/main/resources').rglob('*.json'))
              for p in files:
                  json.loads(p.read_text(encoding='utf-8'))
              print(project, 'JSON_OK', len(files))
          PY
      - name: Frontier Java 25 clean build
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build
      - name: Survival Java 25 clean build
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon clean build
      - name: JAR audit
        shell: bash
        run: |
          set -euo pipefail
          for jarfile in \
            projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.92.jar \
            projects/survival-ascension/build/libs/survivalascension-0.61.1-alpha.1.jar; do
            test -s "$jarfile"
            test -z "$(jar tf "$jarfile" | sort | uniq -d | head -n1 || true)"
            echo "JAR_OK $jarfile $(stat -c%s "$jarfile") bytes"
          done
      - name: Package replacement JARs
        uses: actions/upload-artifact@v4
        with:
          name: frontier-survival-deep-audit2-replacements
          if-no-files-found: error
          retention-days: 7
          path: |
            projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.92.jar
            projects/survival-ascension/build/libs/survivalascension-0.61.1-alpha.1.jar
      - name: Commit validated fixes and remove temporary audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-frontier-survival-deep-audit2.yml
          rm -f .github/workflows/manual-frontier-survival-deep-audit2-fixes.yml
          rm -f .github/workflows/manual-frontier-survival-deep-audit2-fixes-v2.yml
          rm -f .github/scripts/frontier_survival_deep_audit2_fix.py
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/frontier-settlement projects/survival-ascension .github/workflows .github/scripts
          git commit -m "Harden runtime lifecycle and local supply transactions"
          git pull --rebase origin main
          git push origin HEAD:main
