name: Probe Village Guardians Entity API

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.probe-entity-api-v0182'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'
      - name: Resolve compile classpath
        working-directory: projects/village-guardians
        run: gradle --no-daemon dependencies --configuration compileClasspath --console=plain > "$GITHUB_WORKSPACE/dependencies.txt"
      - name: Inspect mapped Entity API
        shell: bash
        run: |
          set -euo pipefail
          : > "$GITHUB_WORKSPACE/entity-api.txt"
          while IFS= read -r -d '' jar; do
            if unzip -l "$jar" 2>/dev/null | grep -q 'net/minecraft/world/entity/Entity.class'; then
              echo "=== $jar ===" >> "$GITHUB_WORKSPACE/entity-api.txt"
              javap -classpath "$jar" -p net.minecraft.world.entity.Entity >> "$GITHUB_WORKSPACE/entity-api.txt" 2>&1 || true
            fi
          done < <(find "$HOME/.gradle/caches" -type f -name '*.jar' -print0)
          grep -iE 'tag|score|persistent|custom' "$GITHUB_WORKSPACE/entity-api.txt" > "$GITHUB_WORKSPACE/entity-api-filtered.txt" || true
          cat "$GITHUB_WORKSPACE/entity-api-filtered.txt"
          test -s "$GITHUB_WORKSPACE/entity-api.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villageguardians-v0182-entity-api
          path: |
            entity-api.txt
            entity-api-filtered.txt
            dependencies.txt
          retention-days: 7
