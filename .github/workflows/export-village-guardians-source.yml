name: Export Village Guardians Source Parts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-village-guardians-source.yml'

permissions:
  contents: read
  statuses: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Record status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f context='village-guardians/source-export' \
            -f description='Exporting source parts for byte comparison' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Upload exact source parts
        uses: actions/upload-artifact@v4
        with:
          name: village-guardians-source-parts
          path: projects/village-guardians/source/source.tar.xz.b64.part*
          if-no-files-found: error
          retention-days: 1
      - name: Report success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='success' \
            -f context='village-guardians/source-export' \
            -f description='Source parts exported' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
