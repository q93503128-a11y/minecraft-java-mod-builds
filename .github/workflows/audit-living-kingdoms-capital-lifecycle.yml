name: Audit Living Kingdoms capital lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-capital-lifecycle.yml'

concurrency:
  group: living-kingdoms-capital-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CAPITAL_LIFECYCLE_TEST: '1'

jobs:
  audit:
    name: Fresh-world Erden capital lifecycle audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Clean compile lifecycle integration
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Exercise capital lifecycle projection in a fresh world
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          rm -rf run/world run/living_realm run/livingkingdoms-capital-lifecycle-ci-world
          printf 'level-name=livingkingdoms-capital-lifecycle-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/capital-lifecycle.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 900); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/capital-lifecycle.log; then
              cat ../../logs/capital-lifecycle.log
              exit 1
            fi
            if grep -Eq 'Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError' ../../logs/capital-lifecycle.log; then
              cat ../../logs/capital-lifecycle.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_CAPITAL_LIFECYCLE_PASS revision=1' ../../logs/capital-lifecycle.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/capital-lifecycle.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/capital-lifecycle.log
          test "$passed" -eq 1
          grep -F 'Prepared Erden capital lifecycle revision=1 founders=231 households=77' ../../logs/capital-lifecycle.log
          grep -Eq 'LK_ERDEN_CAPITAL_LIFECYCLE_PASS revision=1 founders=231 households=77 projection_years=60 projected_births=[1-9][0-9]* projected_successions=[1-9][0-9]* projected_replacement_workers=[1-9][0-9]* projected_living=[1-9][0-9]*' ../../logs/capital-lifecycle.log
          grep -F 'fixed_homes=77 fixed_worksites=156 base_population_unchanged=true economy_workers_linkable=true save_overlay=true source_blocks_cut=0' ../../logs/capital-lifecycle.log
      - name: Upload capital lifecycle audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-capital-lifecycle-${{ github.run_number }}
          path: logs/capital-lifecycle.log
          if-no-files-found: warn
          retention-days: 30
