name: Patch Living Kingdoms river port CI isolation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/isolate_living_kingdoms_river_port_ci.py'
      - '.github/workflows/patch-living-kingdoms-river-port-ci-isolation.yml'

concurrency:
  group: living-kingdoms-river-port-ci-isolation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Isolate river-port fixture and remove temporary watchdog tooling
        run: python .github/scripts/isolate_living_kingdoms_river_port_ci.py

      - name: Clean compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Verify patch invariants
        shell: bash
        run: |
          set -euo pipefail
          manager='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenRiverPortManager.java'
          workflow='.github/workflows/audit-living-kingdoms-river-port.yml'
          grep -Fq 'LIVING_KINGDOMS_CI_RIVER_PORT_TEST' "$manager"
          ! grep -Fq 'LIVING_KINGDOMS_CI_REALM_TEST' "$manager"
          grep -Fq "LIVING_KINGDOMS_CI_RIVER_PORT_TEST: '1'" "$workflow"
          ! grep -Fq -- '- 화재 시 소방 인력과 저수조를 사용하는 대응 동선' projects/living-kingdoms/docs/ERDEN_IMPLEMENTATION_STATUS.md
          ! test -e .github/workflows/diagnose-living-kingdoms-exterior-watchdog-stack.yml
          ! test -e .github/workflows/add-living-kingdoms-exterior-ci-chunk-trace.yml

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'fix(living-kingdoms): isolate river port CI fixture'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
