name: Arcane Circle alpha.24 completion migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-circle-alpha24-migration.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-alpha24-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and compile alpha.24 completed presentation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Apply deterministic Arcane source payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          fetch_blob() {
            local sha="$1" out="$2"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$REPO/git/blobs/$sha" \
              | python3 -c 'import sys,json,base64; sys.stdout.write(base64.b64decode(json.load(sys.stdin)["content"]).decode())' > "$out"
          }
          fetch_blob 521fefdea20001ea8e29ad3a700a9a2ae3568365 /tmp/migrate.z64
          fetch_blob d677eb2f53e089f5b4c6402cb32f37c7b8b6ce6e /tmp/sixth.z64
          fetch_blob 6340511cc5a89ba10061ff8dff202c6accbe4d15 /tmp/arch.z64
          fetch_blob e46585dd57e3438e008c3ff41bdd0c6fa26e6fbc /tmp/cast.z64
          fetch_blob 3f45fcfb617bdf9ed4efa6ad9a1b4c650de0a4c4 /tmp/audit.z64
          python3 - <<'PY'
          import base64,zlib
          from pathlib import Path
          Path('/tmp/arcane24-migrate.py').write_bytes(zlib.decompress(base64.b64decode(Path('/tmp/migrate.z64').read_text())))
          PY
          export SIXTH_Z64="$(cat /tmp/sixth.z64)"
          export ARCH_Z64="$(cat /tmp/arch.z64)"
          export CAST_Z64="$(cat /tmp/cast.z64)"
          export AUDIT_Z64="$(cat /tmp/audit.z64)"
          python3 /tmp/arcane24-migrate.py
          python3 projects/arcane-circle/tools/test_v0121_alpha24_presentation_complete.py
          git diff --check
          git status --short
      - name: Compile migrated Java 25 source before commit
        working-directory: projects/arcane-circle
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean compileJava --stacktrace --console=plain
      - name: Commit Arcane project only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/arcane-circle
          git diff --cached --check
          git commit -m 'Arcane Circle alpha.24 complete 6C-9C presentation and caster silhouettes [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then git rebase origin/main; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
