name: TEMP HiddenRubric Lane04 Drive Translation Archive Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-drive-archive-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and inspect translation archive
        shell: bash
        run: |
          python -m pip install -q gdown
          gdown 'https://drive.google.com/uc?id=1nbJ0D0EEU1dqHccQpv5Tw2NHtDz5ewNf' -O /tmp/lmarena-translation-batches.zip
          python - <<'PY'
          import zipfile,json,hashlib,re
          from pathlib import Path
          p=Path('/tmp/lmarena-translation-batches.zip')
          h=hashlib.sha256(p.read_bytes()).hexdigest()
          expect='9213255177a7fd1823d1c53b951fd3303095fe695d703dd6638413c5d002a07a'
          if h!=expect: raise SystemExit(f'hash mismatch {h}')
          targets=['8c02f215-e1db-48e2-8de8-543ed61bb5b7','0ca2c701-71cf-4afd-9cb0-feb2ec032743','a9970066-e698-49b7-acbd-fa532f4a4c6a','98fd3aa1-9dbb-45b2-8423-f2d14c2cbb97']
          out={'sha256':h,'entries':[],'targetHits':{t:[] for t in targets}}
          with zipfile.ZipFile(p) as z:
            out['entries']=z.namelist()[:500]
            for n in z.namelist():
              if n.endswith('/') or not n.lower().endswith(('.json','.jsonl','.txt','.csv','.md')): continue
              try: data=z.read(n).decode('utf-8','ignore')
              except: continue
              for t in targets:
                if t in data:
                  # only commit short surrounding snippets to identify schema, not full archive.
                  pos=data.find(t); out['targetHits'][t].append({'file':n,'snippet':data[max(0,pos-300):pos+1200]})
          d=Path('temp-hiddenrubric/lane04/archive-probe');d.mkdir(parents=True,exist_ok=True)
          (d/'probe.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'sha256':h,'entryCount':len(out['entries']),'hits':{k:len(v) for k,v in out['targetHits'].items()}},ensure_ascii=False))
          PY
      - name: Commit probe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/archive-probe/probe.json
          git commit -m 'chore: materialize Lane04 translation archive probe'
          git push origin HEAD:main
