name: Audit Living Kingdoms regional settlements

on:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
  workflow_dispatch:

concurrency:
  group: living-kingdoms-regional-settlements-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_REGIONAL_SETTLEMENT_TEST: '1'

jobs:
  audit:
    name: Fresh-world Erden regional settlement audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile regional settlement implementation
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon classes --stacktrace --console=plain
      - name: Exercise 17 regional hubs in a fresh world
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          rm -rf run/world run/living_realm run/livingkingdoms-regional-settlements-ci-world
          printf 'level-name=livingkingdoms-regional-settlements-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/regional-settlements.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          passed=0
          for attempt in $(seq 1 1500); do
            if grep -Eq 'LK_REALM_DIAGNOSTIC_FAIL|Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError' ../../logs/regional-settlements.log; then
              cat ../../logs/regional-settlements.log
              exit 1
            fi
            if grep -Fq 'Requested Erden exterior CI anchors' ../../logs/regional-settlements.log; then
              echo 'Generic 178-chunk exterior sweep contaminated regional audit.' >&2
              cat ../../logs/regional-settlements.log
              exit 1
            fi
            if grep -Fq 'Prepared Erden river-port CI' ../../logs/regional-settlements.log \
              || grep -Fq 'Prepared Erden fire-response CI' ../../logs/regional-settlements.log; then
              echo 'Another focused fixture contaminated regional audit.' >&2
              cat ../../logs/regional-settlements.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_REGIONAL_SETTLEMENT_PASS revision=1 hubs=17' ../../logs/regional-settlements.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/regional-settlements.log
              exit 1
            fi
            sleep 1
          done
          cat ../../logs/regional-settlements.log
          test "$passed" -eq 1
          grep -F 'Prepared Erden regional-settlement CI hubs=17' ../../logs/regional-settlements.log
          grep -F 'market_villages=4 drovers_waystations=3 mining_villages=5 mill_villages=3 river_trade_posts=2' ../../logs/regional-settlements.log
          grep -F 'existing_housing_reused=true focused_ci=true generic_exterior_sweep=false' ../../logs/regional-settlements.log
          grep -F 'Completed Erden regional settlement node=' ../../logs/regional-settlements.log
          grep -F 'reused_housing=true public_square=true local_lanes=true role_services=true regional_revision=1' ../../logs/regional-settlements.log
          grep -F 'LK_ERDEN_REGIONAL_SETTLEMENT_PASS revision=1 hubs=17 market_villages=4 drovers_waystations=3 mining_villages=5 mill_villages=3 river_trade_posts=2 core_bells=17 attached_homes=17 spine_connections=17 sample_cross_street=true existing_housing_reused=true no_new_households=true streamed=true forced_citywide=false' ../../logs/regional-settlements.log
      - name: Upload regional settlement audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-regional-settlements-${{ github.run_number }}
          path: logs/regional-settlements.log
          if-no-files-found: warn
          retention-days: 30
