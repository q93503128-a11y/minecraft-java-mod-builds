name: Check Living Kingdoms Fast

on:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/check-living-kingdoms-fast.yml'

concurrency:
  group: living-kingdoms-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Guard nonblocking construction and resident invariants
        shell: bash
        run: |
          set -euo pipefail
          edits="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/IncrementalWorldEditPlan.java"
          capital="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalStreamingBuilder.java"
          workforce="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorWorkforceManager.java"
          lifecycle="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleManager.java"
          lifecycle_saved="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleSavedData.java"
          marriage="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorMarriageManager.java"
          marriage_saved="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorMarriageSavedData.java"
          justice="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/crime/ErdenJusticeManager.java"
          crime="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/crime/CrimeManager.java"
          fire="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenFireResponseManager.java"
          port="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenRiverPortManager.java"

          grep -F 'if (!chunkBounded) retainConstructionChunk(level, chunkX, chunkZ);' "$edits"
          grep -F 'addTicketAndLoadWithRadius(' "$edits"
          grep -F 'removeTicketWithRadius(' "$edits"
          grep -F 'releaseRetainedConstructionChunks(level)' "$edits"
          grep -F 'Block.UPDATE_KNOWN_SHAPE' "$edits"
          ! grep -F 'setChunkForced' "$edits"

          grep -F 'new IncrementalWorldEditPlan(chunk)' "$capital"
          grep -F 'addTicketAndLoadWithRadius(TicketType.PORTAL, chunk, 0)' "$capital"
          grep -F 'removeTicketWithRadius(' "$capital"
          ! grep -F 'setChunkForced' "$capital"
          ! grep -E '(^|[^A-Za-z])level\.getChunk\(' "$capital"

          grep -F 'NAVIGATION_BUDGET = 6' "$workforce"
          grep -F 'BlockPos physicalHome = ErdenExteriorResidenceBuilder.residentSpawnPosition(' "$workforce"
          grep -F '!level.hasChunk(physicalHome.getX() >> 4, physicalHome.getZ() >> 4)' "$workforce"
          grep -F 'routeLoaded(level, villager.blockPosition(), targetPos)' "$workforce"
          ! grep -F 'level.hasChunk(household.homeX() >> 4, household.homeZ() >> 4)' "$workforce"

          grep -F 'NAVIGATION_BUDGET = 4' "$lifecycle"
          grep -F 'BlockPos physicalHome = household == null' "$lifecycle"
          grep -F '!level.hasChunk(physicalHome.getX() >> 4, physicalHome.getZ() >> 4)' "$lifecycle"
          grep -F 'if (!person.founder() || person.retiredOn(day))' "$lifecycle"
          grep -F 'routeLoaded(level, villager.blockPosition(), targetPos)' "$lifecycle"
          ! grep -F 'level.hasChunk(household.homeX() >> 4, household.homeZ() >> 4)' "$lifecycle"

          # Exterior family formation is persistent and residence-aware. Product births must use an
          # active married pair, while founder employment stays anchored to its original workplace.
          grep -F 'movePersonHousehold(String personId, String newHouseholdId)' "$lifecycle_saved"
          grep -F 'ErdenExteriorMarriageManager.parentPair(' "$lifecycle"
          grep -F 'parents.size() != 2' "$lifecycle"
          grep -F 'public static final int MARRIAGE_REVISION = 1' "$marriage"
          grep -F 'if (mover.founder()) continue;' "$marriage"
          grep -F 'REMARRIAGE_WAIT_YEARS = 1' "$marriage"
          grep -F 'founder_workplaces_preserved=true' "$marriage"
          grep -F 'spouse_based_births=true' "$marriage"
          grep -F 'activeUnionForHousehold' "$marriage_saved"

          # Erden justice must be evidence-driven: only a resident present at the event can witness,
          # the report must reach a real guard-post worker, and generic synthetic pursuit stays off.
          grep -F 'event_time_witness=true' "$justice"
          grep -F 'retroactive_witness=false' "$justice"
          grep -F 'actual_guard_worker=true' "$justice"
          grep -F 'proximity_arrest=true synthetic_guard=false' "$justice"
          grep -F 'actual_citizen_court=true' "$justice"
          grep -F 'sentence_executed=true' "$justice"
          grep -F 'crime.reduceWanted(suspect.getUUID(), 100);' "$justice"
          grep -F 'warrant_cleared=true' "$justice"
          grep -F 'ErdenJusticeManager.JURISDICTION.equals(record.jurisdiction())' "$crime"
          grep -F 'ErdenJusticeManager.observeCrime(' "$crime"
          ! grep -F 'StarterRealmManager.server()' "$justice"

          # Deterministic subsystem fixtures must never piggyback on the generic realm-test flag.
          grep -F 'LIVING_KINGDOMS_CI_FIRE_RESPONSE_TEST' "$fire"
          ! grep -F 'LIVING_KINGDOMS_CI_REALM_TEST' "$fire"
          grep -F 'LIVING_KINGDOMS_CI_RIVER_PORT_TEST' "$port"
          ! grep -F 'LIVING_KINGDOMS_CI_REALM_TEST' "$port"
      - name: Compile current Living Kingdoms sources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../logs
          gradle --no-daemon clean compileJava --stacktrace --console=plain 2>&1 | tee ../../logs/living-kingdoms-fast-compile.log
      - name: Upload fast compile log
        id: upload_log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-fast-${{ github.run_number }}
          path: logs/living-kingdoms-fast-compile.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish fast compile pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_log.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/living-kingdoms-fast.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/living-kingdoms-fast.json
          git commit -m "Record Living Kingdoms fast check $GITHUB_RUN_NUMBER" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1