name: Check Living Kingdoms Fast

on:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/check-living-kingdoms-fast.yml'

concurrency:
  group: living-kingdoms-fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Integrate Erden living economy once
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'ErdenLivingEconomyManager.onServerTick(event);' \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java; then
            exit 0
          fi
          python .github/scripts/patch_erden_living_economy_v2.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java \
                  projects/living-kingdoms/docs/ERDEN_IMPLEMENTATION_STATUS.md \
                  .github/workflows/build-living-kingdoms.yml
          git commit -m 'Connect Erden shop schedules prices and errands'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
      - name: Compile current Living Kingdoms sources
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../logs
          gradle --no-daemon clean compileJava --stacktrace --console=plain 2>&1 | tee ../../logs/living-kingdoms-fast-compile.log
      - name: Upload fast compile log
        id: upload_log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-fast-${{ github.run_number }}
          path: logs/living-kingdoms-fast-compile.log
          if-no-files-found: warn
          retention-days: 14
      - name: Publish fast compile pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_log.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/living-kingdoms-fast.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/living-kingdoms-fast.json
          git commit -m "Record Living Kingdoms fast check $GITHUB_RUN_NUMBER" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
