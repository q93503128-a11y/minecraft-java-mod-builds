name: Manual Frontier Survival Audit Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-frontier-survival-audit-fixes.yml'

permissions:
  contents: write

jobs:
  patch-audit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply audited runtime fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension')

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          mobility = ROOT / 'mobility/MobilityProgression.java'
          replace_once(mobility,
              '''        if (player.onGround()) AIR_DASH_COUNT.put(uuid, 0);\n        trackTraversal(player);\n    }\n\n    public static void onPlayerLoggedOut(PlayerEvent.PlayerLoggedOutEvent event) {\n''',
              '''        if (player.onGround()) AIR_DASH_COUNT.put(uuid, 0);\n        trackTraversal(player);\n        syncDashCooldown(player);\n    }\n\n    public static void onPlayerLoggedIn(PlayerEvent.PlayerLoggedInEvent event) {\n        if (event.getEntity() instanceof ServerPlayer player) {\n            // Client state can survive an integrated-server/world switch; explicitly clear it on join.\n            SkillNetwork.sendMobilityCooldown(player, new MobilityCooldownPayload(0));\n        }\n    }\n\n    public static void onPlayerLoggedOut(PlayerEvent.PlayerLoggedOutEvent event) {\n''',
              'mobility join/sync hook')
          replace_once(mobility,
              '''    private static int maxAirDashes(ServerPlayer player, int level) {\n''',
              '''    private static void syncDashCooldown(ServerPlayer player) {\n        UUID uuid = player.getUUID();\n        Long ready = DASH_READY_TICK.get(uuid);\n        if (ready == null) return;\n        long rawRemaining = Math.max(0L, ready - player.level().getGameTime());\n        int remaining = (int)Math.min(Integer.MAX_VALUE, rawRemaining);\n        // The HUD follows authoritative server game ticks instead of wall-clock time. This keeps it\n        // correct through low TPS, pause, and short server stalls. Packets exist only while cooling down.\n        SkillNetwork.sendMobilityCooldown(player, new MobilityCooldownPayload(remaining));\n        if (remaining <= 0) DASH_READY_TICK.remove(uuid);\n    }\n\n    private static int maxAirDashes(ServerPlayer player, int level) {\n''',
              'authoritative dash sync helper')

          client_mobility = ROOT / 'client/ClientMobilityState.java'
          client_mobility.write_text('''package kr.moonseungjun.survivalascension.client;\n\nimport kr.moonseungjun.survivalascension.network.MobilityCooldownPayload;\n\npublic final class ClientMobilityState {\n    private static volatile int totalCooldownTicks;\n    private static volatile int remainingCooldownTicks;\n\n    private ClientMobilityState() {}\n\n    public static void onCooldown(MobilityCooldownPayload payload) {\n        int incoming = Math.max(0, payload.cooldownTicks());\n        if (incoming <= 0) {\n            totalCooldownTicks = 0;\n            remainingCooldownTicks = 0;\n            return;\n        }\n        // A successful dash arrives as a fresh full-duration value. Follow-up packets are the\n        // authoritative remaining server ticks; never run a separate real-time clock on the client.\n        if (remainingCooldownTicks <= 0 || incoming > remainingCooldownTicks + 1) {\n            totalCooldownTicks = incoming;\n        } else {\n            totalCooldownTicks = Math.max(totalCooldownTicks, incoming);\n        }\n        remainingCooldownTicks = incoming;\n    }\n\n    public static int remainingTicks() { return Math.max(0, remainingCooldownTicks); }\n\n    public static float readyProgress() {\n        int total = totalCooldownTicks;\n        if (total <= 0) return 1.0F;\n        return Math.max(0.0F, Math.min(1.0F, 1.0F - remainingTicks() / (float)total));\n    }\n}\n''', encoding='utf-8')

          entry = ROOT / 'SurvivalAscension.java'
          replace_once(entry,
              '''        NeoForge.EVENT_BUS.addListener(MobilityProgression::onPlayerTick);\n        NeoForge.EVENT_BUS.addListener(MobilityProgression::onPlayerLoggedOut);\n''',
              '''        NeoForge.EVENT_BUS.addListener(MobilityProgression::onPlayerTick);\n        NeoForge.EVENT_BUS.addListener(MobilityProgression::onPlayerLoggedIn);\n        NeoForge.EVENT_BUS.addListener(MobilityProgression::onPlayerLoggedOut);\n''',
              'mobility login listener')

          construction = ROOT / 'construction/ConstructionProgression.java'
          replace_once(construction,
              '''        if (denied) return PlaceResult.SKIPPED;\n        if (clearVegetation && !existing.isAir()) level.destroyBlock(target, false, player);\n        if (!level.setBlockAndUpdate(target, state)) return PlaceResult.SKIPPED;\n        if (!player.isCreative() && !FieldDepotService.consumeOne(player, item)) {\n            level.removeBlock(target, false);\n            return PlaceResult.OUT_OF_MATERIAL;\n        }\n''',
              '''        if (denied) return PlaceResult.SKIPPED;\n        // Replace soft vegetation directly. Destroying it first made a failed placement permanently\n        // erase the plant even though no construction block or material transaction committed.\n        if (!level.setBlockAndUpdate(target, state)) return PlaceResult.SKIPPED;\n        if (!player.isCreative() && !FieldDepotService.consumeOne(player, item)) {\n            level.setBlockAndUpdate(target, existing);\n            return PlaceResult.OUT_OF_MATERIAL;\n        }\n''',
              'transactional vegetation overwrite')

          incident = ROOT / 'expedition/ExpeditionIncidentSystem.java'
          replace_once(incident,
              '''        if (isActive(player)) return;\n\n        if (player.tickCount % CHECK_INTERVAL_TICKS != 0 || player.isCreative() || player.isSpectator() || !player.isAlive()) return;\n''',
              '''        if (isActive(player)) return;\n        // Auto incidents must respect the same one-major-encounter rule as manual activities.\n        if (FinalAscensionSystem.hasOtherMajorActivity(player)) return;\n\n        if (player.tickCount % CHECK_INTERVAL_TICKS != 0 || player.isCreative() || player.isSpectator() || !player.isAlive()) return;\n''',
              'incident encounter exclusion')

          operation = ROOT / 'expedition/ExpeditionOperationSystem.java'
          replace_once(operation,
              '''        if (FinalAscensionSystem.isFinalSequenceActive(player)) { player.sendSystemMessage(Component.literal("§6[원정 작전] §f최후의 승천 진행 중에는 새 원정 작전을 시작할 수 없습니다.")); return; }\n        if (ApexHuntSystem.isActive(player) || AscensionTrialSystem.isActive(player)) { player.sendSystemMessage(Component.literal("§6[원정 작전] §f정점 사냥이나 승천 시련 진행 중에는 새 작전을 시작할 수 없습니다.")); return; }\n''',
              '''        if (FinalAscensionSystem.isFinalSequenceActive(player)) { player.sendSystemMessage(Component.literal("§6[원정 작전] §f최후의 승천 진행 중에는 새 원정 작전을 시작할 수 없습니다.")); return; }\n        if (FinalAscensionSystem.hasOtherMajorActivity(player)) { player.sendSystemMessage(Component.literal("§6[원정 작전] §f진행 중인 현장 사건·방어전·정점 사냥·승천 시련을 먼저 끝내세요.")); return; }\n''',
              'operation encounter exclusion')
          replace_once(operation,
              '''        ProductionData production = ProductionData.get(player);\n        if (!production.consumeSupplyCharge(player)) { player.sendSystemMessage(Component.literal("§6[원정 작전] §f출발 준비에는 §e현장 보급권 1개§f가 필요합니다.")); return; }\n\n        ExpeditionOperation operation = ExpeditionOperation.forRegion(region);\n        ExpeditionComplication complication = chooseComplication(player, level, data);\n        long deadline = level.getGameTime() + operation.durationTicks();\n        if (!data.start(player, operation, outpost.dimension(), outpost.pos(), deadline, complication)) { player.sendSystemMessage(Component.literal("§c[원정 작전] §f작전 상태가 바뀌어 출발하지 못했습니다.")); return; }\n''',
              '''        ProductionData production = ProductionData.get(player);\n        if (production.supplyCharges(player) < SUPPLY_CHARGE_COST) { player.sendSystemMessage(Component.literal("§6[원정 작전] §f출발 준비에는 §e현장 보급권 1개§f가 필요합니다.")); return; }\n\n        ExpeditionOperation operation = ExpeditionOperation.forRegion(region);\n        ExpeditionComplication complication = chooseComplication(player, level, data);\n        long deadline = level.getGameTime() + operation.durationTicks();\n        if (!data.start(player, operation, outpost.dimension(), outpost.pos(), deadline, complication)) { player.sendSystemMessage(Component.literal("§c[원정 작전] §f작전 상태가 바뀌어 출발하지 못했습니다.")); return; }\n        if (!production.consumeSupplyCharge(player)) {\n            data.fail(player);\n            player.sendSystemMessage(Component.literal("§c[원정 작전] §f보급권 상태가 바뀌어 출발을 취소했습니다. 보급권은 소비되지 않았습니다."));\n            return;\n        }\n''',
              'operation charge commit ordering')

          apex = ROOT / 'apex/ApexHuntSystem.java'
          replace_once(apex,
              '''import kr.moonseungjun.survivalascension.expedition.ExpeditionIncidentSystem;\n''',
              '',
              'remove redundant apex incident import')
          replace_once(apex,
              '''        if (ExpeditionIncidentSystem.isActive(player)) {\n            player.sendSystemMessage(Component.literal("§4[정점 사냥] §f진행 중인 현장 사건을 먼저 끝내세요."));\n            return;\n        }\n''',
              '''        if (FinalAscensionSystem.hasOtherMajorActivity(player)) {\n            player.sendSystemMessage(Component.literal("§4[정점 사냥] §f진행 중인 현장 사건·원정 작전·방어전·승천 시련·다른 정점 사냥을 먼저 끝내세요."));\n            return;\n        }\n''',
              'apex encounter exclusion')

          trial = ROOT / 'endgame/AscensionTrialSystem.java'
          replace_once(trial,
              '''        if (ACTIVE.containsKey(player.getUUID())) {\n            player.sendSystemMessage(Component.literal("§5[승천 시련] §f이미 진행 중인 시련이 있습니다."));\n            return;\n        }\n        if (FinalAscensionSystem.isFinalSequenceActive(player)) {\n''',
              '''        if (ACTIVE.containsKey(player.getUUID())) {\n            player.sendSystemMessage(Component.literal("§5[승천 시련] §f이미 진행 중인 시련이 있습니다."));\n            return;\n        }\n        if (FinalAscensionSystem.hasOtherMajorActivity(player)) {\n            player.sendSystemMessage(Component.literal("§5[승천 시련] §f진행 중인 현장 사건·원정 작전·정점 사냥·방어전·다른 승천 시련을 먼저 끝내세요."));\n            return;\n        }\n        if (FinalAscensionSystem.isFinalSequenceActive(player)) {\n''',
              'trial encounter exclusion')

          compat = ROOT / 'compat/ContentPackCompatibility.java'
          replace_once(compat,
              '''    private static boolean isStandardAffixGear(ItemStack stack) {\n''',
              '''    /** Equipment must never be consumed as a physical economy resource even if an external datapack mis-tags it. */\n    public static boolean isProtectedEquipment(ItemStack stack) { return isStandardAffixGear(stack); }\n\n    private static boolean isStandardAffixGear(ItemStack stack) {\n''',
              'protected equipment helper')

          economy = ROOT / 'compat/SharedEconomyCompat.java'
          replace_once(economy,
              '''        if (stack.isEmpty() || stack.is(EXPEDITION_RELICS)) return false;\n''',
              '''        if (stack.isEmpty() || stack.is(EXPEDITION_RELICS) || ContentPackCompatibility.isProtectedEquipment(stack)) return false;\n''',
              'economy equipment exclusion')

          print('audited runtime fixes applied')
          PY
      - name: Targeted source contract audit
        shell: bash
        run: |
          set -euo pipefail
          ROOT=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension
          ! grep -q 'System.currentTimeMillis' "$ROOT/client/ClientMobilityState.java"
          grep -q 'syncDashCooldown(player)' "$ROOT/mobility/MobilityProgression.java"
          grep -q 'MobilityProgression::onPlayerLoggedIn' "$ROOT/SurvivalAscension.java"
          ! grep -q 'destroyBlock(target, false, player)' "$ROOT/construction/ConstructionProgression.java"
          grep -q 'level.setBlockAndUpdate(target, existing)' "$ROOT/construction/ConstructionProgression.java"
          grep -q 'FinalAscensionSystem.hasOtherMajorActivity(player)' "$ROOT/expedition/ExpeditionIncidentSystem.java"
          grep -q 'FinalAscensionSystem.hasOtherMajorActivity(player)' "$ROOT/expedition/ExpeditionOperationSystem.java"
          grep -q 'FinalAscensionSystem.hasOtherMajorActivity(player)' "$ROOT/apex/ApexHuntSystem.java"
          grep -q 'FinalAscensionSystem.hasOtherMajorActivity(player)' "$ROOT/endgame/AscensionTrialSystem.java"
          grep -q 'production.supplyCharges(player) < SUPPLY_CHARGE_COST' "$ROOT/expedition/ExpeditionOperationSystem.java"
          grep -q 'data.fail(player)' "$ROOT/expedition/ExpeditionOperationSystem.java"
          grep -q 'isProtectedEquipment' "$ROOT/compat/SharedEconomyCompat.java"
      - name: Resource JSON audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          for project in ('projects/frontier-settlement', 'projects/survival-ascension'):
              files = list((Path(project)/'src/main/resources').rglob('*.json'))
              for p in files:
                  json.loads(p.read_text(encoding='utf-8'))
              print(project, 'JSON_OK', len(files))
          PY
      - name: Frontier Java 25 clean build
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build
      - name: Survival Java 25 clean build
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon clean build
      - name: JAR and diff audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for project in frontier-settlement survival-ascension; do
            jarfile=$(find "projects/$project/build/libs" -maxdepth 1 -name '*.jar' ! -name '*sources*' ! -name '*javadoc*' | head -n1)
            test -n "$jarfile"
            test -s "$jarfile"
            dup=$(jar tf "$jarfile" | sort | uniq -d | head -n1 || true)
            test -z "$dup"
            echo "JAR_OK $jarfile $(stat -c%s "$jarfile") bytes"
          done
      - name: Commit validated fixes and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-frontier-survival-full-audit.yml
          rm -f .github/workflows/manual-frontier-survival-audit-fixes.yml
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/survival-ascension .github/workflows/manual-frontier-survival-full-audit.yml .github/workflows/manual-frontier-survival-audit-fixes.yml
          git commit -m "Fix audited Survival runtime consistency issues"
          git pull --rebase origin main
          git push origin HEAD:main
