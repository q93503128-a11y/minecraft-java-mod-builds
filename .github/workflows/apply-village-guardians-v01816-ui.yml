name: Finalize Village Guardians v0.18.16 Defense UI

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.apply-v01816'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure and rebase
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
      - name: Verify permanent v0.18.16 contract
        run: python3 projects/village-guardians/tools/test_v01816_mobile_defense_ui.py
      - name: Update canonical docs and remove temporary tooling
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/village-guardians')
          readme = root / 'README.md'
          text = readme.read_text(encoding='utf-8')
          text = text.replace('현재 소스 버전 `0.18.15-alpha.1`', '현재 소스 버전 `0.18.16-alpha.1`', 1)
          text = text.replace('목표 JAR `villageguardians-0.18.15-alpha.1.jar`', '목표 JAR `villageguardians-0.18.16-alpha.1.jar`', 1)
          marker = '## 0.18.15 보스 Identity·고정 Cast State\n'
          section = '''## 0.18.16 Defense HUD·Presentation Pass\n\n모바일 디펜스 게임의 정보 우선순위를 참고하되 특정 게임의 UI를 복제하지 않고, 전투 중 필요한 정보가 한눈에 읽히도록 HUD와 방어 자산 피드백을 통합했다.\n\n- 기존 좌상단 텍스트 박스를 `VillageDefenseHudFrame` 기반 21필드 authoritative 전투 프레임으로 교체했다. 날짜·페이즈·레벨·직업·주화·보급·웨이브·남은 적·다음 웨이브 시간·전장 특성을 사람이 읽는 문자열에서 다시 파싱하지 않는다.\n- 상단 command ribbon은 날짜/페이즈, 현재 웨이브·남은 적, 주화·보급을 우선순위대로 분리하고 좁은 GUI에서는 compact 2열 배치로 전환한다.\n- 실제 `ACTIVE_ENEMIES`와 전선 할당을 집계해 북문/서측/동측/후방 4개 압박도를 즉시 표시한다. 색과 길이는 적 수에 따라 단계적으로 변한다.\n- 7개 성벽 Segment와 성벽을 제외한 실제 시설 HP를 직접 비교해 가장 약한 방어선을 상시 표시한다. 25% 이하에서는 별도 위험 경보가 뜬다.\n- 시설 BossBar는 2.5초 순환 목록을 폐기하고 실제 피격 직후만 `피격/주의/긴급` 상태로 잠깐 나타나는 emergency alert로 축소했다. 전체 방어 비교는 상시 HUD가 담당한다.\n- 스킬 HUD는 텍스트 두 줄 대신 두 개 ability card로 바꿔 `READY`, 남은 초, 준비 진행 상태가 핫바 위에서 바로 읽힌다. 기존보다 위로 올려 바닐라 핫바와의 충돌 여유도 늘렸다.\n- 회관/지휘 화면은 `VillageDefenseUiTheme`의 저채도 패널, semantic cyan/gold/amber/red/green 팔레트를 공유해 서로 다른 메뉴가 하나의 게임 UI처럼 보이도록 통일했다.\n- 포탑 유효 배치 미리보기, 설치 완료, 수리, 강화에 각각 synchronized procedural mesh 피드백을 추가했다. 성벽 Segment가 실제 돌파될 때도 붉은 확장 링과 지면 균열형 breach alarm이 발생한다.\n- 낡은 runtime safety 테스트가 스킬 HUD의 정확한 `guiHeight()-98` 숫자를 성공 조건으로 고정하던 부분을 제거하고, 더 안전한 `-112` ability-card baseline과 카드 렌더 경로를 검증하도록 이관했다.\n- 최종 acceptance run `32094533863` / built head `c41c8cde89bc1dea524156e61480e1f302a406a6`에서 전체 deterministic/UI/interaction/0.18.8~0.18.16 회귀, Java 25 + NeoForge clean build, JAR verifier, artifact upload가 모두 성공했다. 최종 JAR SHA-256은 `62c1e69fba813828a7b59761bb3320daaca8097e7ce5bcff47b092cc8c918b2b`, 크기는 `955045` bytes다.\n\n'''
          if '## 0.18.16 Defense HUD·Presentation Pass' not in text:
              if marker not in text:
                  raise SystemExit('README insertion marker missing')
              text = text.replace(marker, section + marker, 1)
          readme.write_text(text, encoding='utf-8')

          report = root / 'BUILD_AND_RUNTIME_REPORT.md'
          text = report.read_text(encoding='utf-8')
          replacements = {
              '- Current source version: `0.18.15-alpha.1`': '- Current source version: `0.18.16-alpha.1`',
              '- Target JAR: `villageguardians-0.18.15-alpha.1.jar`': '- Target JAR: `villageguardians-0.18.16-alpha.1.jar`',
              '- Final acceptance Actions run: `32089737176`': '- Final acceptance Actions run: `32094533863`',
              '- Final acceptance head: `b52f8cd63f643db2b759c5db48985f0bab03b710`': '- Final acceptance head: `c41c8cde89bc1dea524156e61480e1f302a406a6`',
              '- Final JAR SHA-256: `6a37f758510ba5ee20ec20d607dd9696a60e15f160961587a43b4042632497e4`': '- Final JAR SHA-256: `62c1e69fba813828a7b59761bb3320daaca8097e7ce5bcff47b092cc8c918b2b`',
              '- Final JAR size: `940741` bytes': '- Final JAR size: `955045` bytes',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'BUILD report metadata marker missing: {old}')
              text = text.replace(old, new, 1)
          marker = '## 0.18.15 보스 Presentation·Cast 정합 감사\n'
          section = '''## 0.18.16 Defense HUD·Presentation 감사\n\n- `VillageDefenseHudFrame`을 추가해 기존 styled status string 대신 21개 고정 필드로 메인 HUD 데이터를 전달한다. server state가 단일 정본이며 클라이언트는 표시만 담당한다.\n- `VillageRaidSystem.RaidHudSnapshot`이 현재 wave/max wave, active enemy count, next-wave seconds, trait와 북/서/동/후방 압박 수를 실제 `ACTIVE_ENEMIES`에서 계산한다.\n- `VillageMainHudOverlay`를 responsive command ribbon + weakest-defense integrity card + four-front pressure pips 구조로 재작성했다.\n- `VillageSkillHudOverlay`는 두 개 ability card와 READY/cooldown state, active-effect chip을 사용하고 바닐라 hotbar 위 안전 여백을 확대했다.\n- `VillageStructureHud`의 순환식 BossBar를 제거하고 실제 시설 피해 직후만 보이는 emergency alert로 바꿨다.\n- `VillageDefenseUiTheme`을 추가해 command center와 town hall을 같은 저채도 surface/semantic accent 체계로 통일했다.\n- 포탑 배치/설치/수리/강화와 실제 성벽 돌파에 `VillageDefenseEffectSystem` → `VillageSkillEffectEntity` → `VillageSkillMeshLibrary` synchronized procedural mesh feedback을 연결했다.\n- 첫 apply run에서 오래된 runtime test의 `guiHeight()-98` 고정 좌표 계약이 새 ability-card HUD를 실패시켰고, 실제 안전성이 더 높은 `-112` baseline + card renderer 계약으로 이관했다.\n- apply/회귀 run `32094444642`에서 core runtime/UI/interaction 계약과 0.18.8~0.18.16 회귀가 모두 PASS했다.\n- 최종 Actions run `32094533863`: Java 25 setup PASS, deterministic contracts PASS, NeoForge clean build PASS, runtime JAR verify PASS, artifact upload PASS.\n- Actions artifact를 별도 다운로드해 ZIP/JAR CRC, `neoforge.mods.toml`, manifest, `VillageDefenseHudFrame`, `VillageDefenseUiTheme`, `VillageMainHudOverlay`, `VillageSkillHudOverlay`, `VillageStructureHud`, `VillageDefenseEffectSystem`, `VillageRaidSystem$RaidHudSnapshot`, `VillageSkillMeshLibrary`, `VillageCommandCenterScreen`, `VillageTownHallGridScreen` 포함을 재검증했다.\n- 최종 JAR SHA-256 `62c1e69fba813828a7b59761bb3320daaca8097e7ce5bcff47b092cc8c918b2b`, 크기 `955045` bytes.\n\n'''
          if '## 0.18.16 Defense HUD·Presentation 감사' not in text:
              if marker not in text:
                  raise SystemExit('BUILD report insertion marker missing')
              text = text.replace(marker, section + marker, 1)
          report.write_text(text, encoding='utf-8')
          PY

          rm -f \
            projects/village-guardians/.apply-v01816 \
            projects/village-guardians/.build-trigger-v01816 \
            projects/village-guardians/tools/apply_v01816_mobile_defense_ui.py \
            projects/village-guardians/tools/prepare_v01816_ui_contracts.py \
            projects/village-guardians/.ci/v01816-apply-report.txt \
            projects/village-guardians/.ci/v01816-build-report.txt \
            .github/workflows/apply-village-guardians-v01816-ui.yml

          git add -A projects/village-guardians .github/workflows/apply-village-guardians-v01816-ui.yml
          git commit -m 'docs(village): finalize v0.18.16 defense HUD and presentation'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
