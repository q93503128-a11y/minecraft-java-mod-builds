name: Arcane alpha76 verifier label fix

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    if: github.event.issue.title == 'arcane-alpha76-fix-verifier-label'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Fix stale verifier heading and self-clean
        shell: bash
        run: |
          set -euo pipefail
          file='projects/arcane-circle/tools/verify_jar.py'
          test "$(grep -Fxc "print('Arcane Circle alpha.75 JAR verification: PASS')" "$file")" -eq 1
          sed -i "s/Arcane Circle alpha\.75 JAR verification: PASS/Arcane Circle alpha.76 JAR verification: PASS/" "$file"
          rm .github/workflows/arcane-alpha76-verifier-label-fix.yml
          python3 projects/arcane-circle/tools/test_current_source.py
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -iname '*arcane*.yml' | wc -l)" -eq 1
          test "$(find projects/arcane-circle/tools -maxdepth 1 -type f | wc -l)" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/arcane-circle/tools/verify_jar.py .github/workflows/arcane-alpha76-verifier-label-fix.yml
          git commit -m 'Fix Arcane alpha.76 verifier heading [skip ci]'
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
      - name: Dispatch canonical Arcane build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build-arcane-circle.yml/dispatches" \
            -d '{"ref":"main"}'
