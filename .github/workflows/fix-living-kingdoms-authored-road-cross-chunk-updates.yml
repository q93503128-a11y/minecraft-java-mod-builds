name: Fix Living Kingdoms authored road cross-chunk updates

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_authored_road_cross_chunk_updates.py'
      - '.github/workflows/fix-living-kingdoms-authored-road-cross-chunk-updates.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Suppress cross-chunk neighbor shape loads
        run: python .github/scripts/fix_living_kingdoms_authored_road_cross_chunk_updates.py
      - name: Commit Java repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoredRoadNormalizer.java
          git diff --cached --quiet && exit 0
          git commit -m 'Prevent authored road writes from loading neighbor chunks'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot repair; remove after Java changes land.
