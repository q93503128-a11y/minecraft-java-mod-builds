name: Patch Erden living economy after fast check

on:
  workflow_run:
    workflows: ['Check Living Kingdoms Fast']
    types: [completed]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip after integration
        id: state
        shell: bash
        run: |
          if grep -Fq 'ErdenLivingEconomyManager.onServerTick(event);' \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Apply living economy integration
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_erden_living_economy_v2.py
          git diff --check

      - name: Commit integration
        if: steps.state.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java \
                  projects/living-kingdoms/docs/ERDEN_IMPLEMENTATION_STATUS.md \
                  .github/workflows/build-living-kingdoms.yml
          git commit -m 'Connect Erden shop schedules prices and errands'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
