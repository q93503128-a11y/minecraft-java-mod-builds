name: Manual Survival Audit 5 Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-audit5-fix.yml'

permissions:
  contents: write

jobs:
  audit-fix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply shutdown interruption compensation fix
        run: python3 .github/scripts/survival_audit5_fix.py

      - name: Encounter interruption contract audit
        shell: bash
        run: |
          set -euo pipefail
          P=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/production/EncounterInterruptionData.java
          S=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/SurvivalAscension.java
          A=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/apex/ApexHuntSystem.java
          T=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/endgame/AscensionTrialSystem.java
          O=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/production/OutpostSiegeSystem.java
          D=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/production/ProductionData.java
          test -s "$P"
          grep -q 'encounter_interruption_v1' "$P"
          grep -q 'queueApex' "$A"
          grep -q 'queueTrial' "$T"
          grep -q 'queueSiege' "$O"
          grep -q '!siege.level.getServer().isRunning()' "$O"
          grep -q 'restoreSupplyCharges' "$D"
          grep -q 'retrySupplyRefund' "$D"
          grep -q 'EncounterInterruptionData::onPlayerLoggedIn' "$S"
          grep -q 'mod_version=0.61.4-alpha.1' projects/survival-ascension/gradle.properties
          grep -q 'VERSION = "0.61.4-alpha.1"' "$S"
          grep -q 'state.echoShards = add(state.echoShards, 8)' "$P"
          grep -q 'state.amethystShards = add(state.amethystShards, 64)' "$P"
          grep -q 'state.supplyCharges = add(state.supplyCharges, 2)' "$P"
          grep -q 'state.stoneBricks = add(state.stoneBricks, 32)' "$P"
          git diff --check
          echo ENCOUNTER_INTERRUPTION_CONTRACT_OK

      - name: Resource JSON audit
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" >/dev/null
            count=$((count+1))
          done < <(find projects/frontier-settlement/src/main/resources projects/survival-ascension/src/main/resources -type f -name '*.json' -print0)
          echo "JSON_OK $count files"

      - name: Frontier Java 25 regression build
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build

      - name: Survival Java 25 clean build
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon clean build

      - name: JAR audit
        shell: bash
        run: |
          set -euo pipefail
          F=projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.92.jar
          S=projects/survival-ascension/build/libs/survivalascension-0.61.4-alpha.1.jar
          for jarfile in "$F" "$S"; do
            test -s "$jarfile"
            test -z "$(jar tf "$jarfile" | sort | uniq -d | head -n1 || true)"
            echo "JAR_OK $jarfile $(stat -c%s "$jarfile") bytes"
          done
          jar tf "$S" | grep -q 'kr/moonseungjun/survivalascension/production/EncounterInterruptionData.class'

      - name: Upload Survival replacement
        uses: actions/upload-artifact@v4
        with:
          name: survival-audit5-replacement
          path: projects/survival-ascension/build/libs/survivalascension-0.61.4-alpha.1.jar
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated fix and cleanup audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-survival-audit5-fix.yml
          rm -f .github/scripts/survival_audit5_fix.py
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/survival-ascension .github/workflows/manual-survival-audit5-fix.yml .github/scripts/survival_audit5_fix.py
          git commit -m "Compensate paid encounters interrupted by server shutdown"
          git pull --rebase origin main
          git push origin HEAD:main
