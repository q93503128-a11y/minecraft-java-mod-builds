name: Finalize Village Guardians v0.18.20 Docs

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Village Guardians v0.18.20 docs finalize'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize canonical docs and clean temporary CI
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/village-guardians/tools/finalize_v01820_docs.py
          rm -f projects/village-guardians/tools/finalize_v01820_docs.py
          rm -f projects/village-guardians/.build-trigger-v01820
          rm -f projects/village-guardians/.ci/v01820-integration-running.txt projects/village-guardians/.ci/v01820-integration-failure.txt
          rm -f .github/workflows/apply-village-guardians-v01820.yml
          rm -f .github/workflows/apply-village-guardians-v01820-ui-audit.yml
          rm -f .github/workflows/finalize-village-guardians-v01820.yml
          git diff --check
          grep -q '현재 소스 버전 `0.18.20-alpha.1`' projects/village-guardians/README.md
          grep -q 'Final acceptance Actions run: `32330475890`' projects/village-guardians/BUILD_AND_RUNTIME_REPORT.md
          test -f projects/village-guardians/.ci/v01820-final.txt
          test -f .github/workflows/build-village-guardians-v01820.yml
          test -f projects/village-guardians/tools/test_v01820_mercenary_roster.py
          test -f projects/village-guardians/tools/test_v01820_roster_ui_consistency.py
      - name: Commit canonical finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/village-guardians .github/workflows
          git diff --cached --check
          git commit -m 'docs(village): finalize v0.18.20 mercenary roster'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
