name: Patch Living Kingdoms residence modes
on:
  push:
    paths:
      - '.github/scripts/patch_living_kingdoms_residence_modes.py'
      - '.github/workflows/patch-living-kingdoms-residence-modes.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - name: Apply migration
        run: python3 .github/scripts/patch_living_kingdoms_residence_modes.py
      - name: Source audit
        run: |
          set -euo pipefail
          grep -F 'EXPECTED_GROUND_ONLY_BUILDINGS = 77' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanResidenceResolver.java
          grep -F 'fresh_synthetic_upper_created=0' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanLifeManager.java
          grep -F 'residence_mode=verified_upper_or_ground' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPopulationManager.java
          git diff --check
      - name: Java 25 clean compile
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Commit to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanResidenceResolver.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPopulationManager.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanLifeManager.java
          git commit -m 'fix(living-kingdoms): separate upper and ground residences'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*2))
          done
          exit 1
