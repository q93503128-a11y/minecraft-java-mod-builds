name: Build Arcane Circle alpha.12

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/arcane-alpha12.patch.b64.part00'
      - '.github/scripts/arcane-alpha12.patch.b64.part01'
      - '.github/scripts/arcane-alpha12.patch.b64.part02'
      - '.github/scripts/arcane-alpha12.patch.b64.part03'
      - '.github/scripts/arcane-alpha12.patch.b64.part04'
      - '.github/workflows/build-arcane-alpha12.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcane-alpha12-download
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Reconstruct and verify alpha.12 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/scripts/arcane-alpha12.patch.b64.part00 \
              .github/scripts/arcane-alpha12.patch.b64.part01 \
              .github/scripts/arcane-alpha12.patch.b64.part02 \
              .github/scripts/arcane-alpha12.patch.b64.part03 \
              .github/scripts/arcane-alpha12.patch.b64.part04 \
            | base64 --decode > /tmp/arcane-alpha12.diff.gz
          echo '2c6074192914cbbe9229b66194c3f02bc3df14bb72deca603187609da14976a5  /tmp/arcane-alpha12.diff.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/arcane-alpha12.diff.gz > /tmp/arcane-alpha12.diff
          echo '4b43d3620259678795089ae263d874ecc435dd8e3188420bcb591529df551e65  /tmp/arcane-alpha12.diff' | sha256sum --check

      - name: Apply alpha.12 mechanics overhaul
        shell: bash
        run: |
          set -euo pipefail
          patch --dry-run -p0 < /tmp/arcane-alpha12.diff
          patch -p0 < /tmp/arcane-alpha12.diff

      - name: Apply NeoForge 26.2 compatibility repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/world/ArcaneEncounterService.java')
          text = source.read_text(encoding='utf-8')
          old = '    private static boolean hasTag(Mob entity,String tag){return entity.getTags().contains(tag);}'
          new = '    private static boolean hasTag(Mob entity,String tag){boolean added=entity.addTag(tag);if(added)entity.removeTag(tag);return !added;}'
          if old not in text:
              raise SystemExit('ArcaneEncounterService tag repair marker missing')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          audit = Path('projects/arcane-circle/tools/test_v0121_alpha12_runtime.py')
          text = audit.read_text(encoding='utf-8')
          old = 'require("getTags().contains(tag)" in encounters, "mutating tag-probe hack remains")'
          new = 'require("boolean added=entity.addTag(tag);if(added)entity.removeTag(tag);return !added" in encounters, "26.2-compatible encounter marker probe missing")'
          if old not in text:
              raise SystemExit('Runtime audit tag marker missing')
          audit.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run alpha.12 runtime audit
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/arcane-circle/tools/test_v0121_alpha12_runtime.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path('projects/arcane-circle')
          text_suffixes = {'.java', '.py', '.json', '.toml', '.properties', '.gradle', '.md', '.txt', '.mcmeta', '.yml', '.yaml'}
          text_names = {'gradlew'}
          for path in root.rglob('*'):
              if not path.is_file() or (path.suffix.lower() not in text_suffixes and path.name not in text_names):
                  continue
              data = path.read_bytes()
              bad = [b for b in data if b < 9 or (13 < b < 32)]
              if bad:
                  raise SystemExit(f'Unexpected control bytes in {path}: {sorted(set(bad))}')
          print('Text control-byte audit: PASS')
          PY

      - name: Build with Java 25
        shell: bash
        working-directory: projects/arcane-circle
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'arcanecircle-0.12.1-alpha.12.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" >/dev/null
          sha256sum "$jar_file" > "$jar_file.sha256"

      - name: Upload alpha.12 JAR
        uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.12.1-alpha.12
          path: |
            projects/arcane-circle/build/libs/arcanecircle-0.12.1-alpha.12.jar
            projects/arcane-circle/build/libs/arcanecircle-0.12.1-alpha.12.jar.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified alpha.12 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/arcane-circle
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish Arcane Circle v0.12.1-alpha.12 audited mechanics [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Record run status
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arcane-alpha12-status
          cat > /tmp/arcane-alpha12-status/status.txt <<STATUS
          status=$RESULT
          run_id=$GITHUB_RUN_ID
          source_sha=$GITHUB_SHA
          artifact=arcanecircle-0.12.1-alpha.12
          STATUS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ci-results/arcane-circle-alpha12
            cp /tmp/arcane-alpha12-status/status.txt ci-results/arcane-circle-alpha12/status.txt
            git add ci-results/arcane-circle-alpha12/status.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane Circle alpha.12 run $GITHUB_RUN_ID [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
