name: Dispatch Current Frontier Survival Full Pack

on:
  push:
    paths:
      - '.github/workflows/dispatch-current-full-pack.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch full KO JEI new-world pack from current main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/frontier-survival-full-new-world.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'FULL PACK DISPATCHED: starter depot + one-way legacy migration gate'
