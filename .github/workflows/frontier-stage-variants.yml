name: Stage Frontier Variants and Ventures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-stage-variants.yml'

permissions:
  contents: write

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Apply promotion patch
        run: |
          set -euo pipefail
          python3 projects/frontier-settlement/tools/stage_variants_temp.py
          python3 projects/frontier-settlement/tools/test_companion_testpack.py || true
          git diff --check

      - name: Commit promotion and remove temporary files
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/frontier-stage-variants.yml projects/frontier-settlement/tools/stage_variants_temp.py
          git add \
            projects/frontier-settlement/COMPANION_LOCK.json \
            projects/frontier-settlement/companion-testpack/runtime-status.json \
            projects/frontier-settlement/companion-testpack/README.md \
            projects/frontier-settlement/tools/test_companion_testpack.py \
            .github/workflows/frontier-companion-resolve.yml \
            .github/workflows/frontier-companion-server-preflight.yml
          git commit -m 'Promote Variants and Ventures into Frontier candidate stack'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
