name: TEMP HiddenRubric Lane04 Current Output Mine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-current-output-mine.yml'
permissions:
  contents: write
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Mine current-output evaluator relations
        shell: bash
        run: |
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          REPO='lmarena-ai/arena-human-preference-140k'; REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]
          ACT=r'(?:senior management|management|manager|boss|supervisor|teacher|professor(?:s)?|evaluating committee|selection committee|committee|executive board|board|client|customer|potential investors?|investors?|stakeholders?|judges?|reviewers?|hiring manager|HR manager|human resources manager|sponsor)'
          VERB=r'(?:review|approve|evaluate|grade|assess|judge|provide feedback|give feedback|sign off)'
          OBJ=r'(?:this|it|the\s+(?:output|document|report|presentation|proposal|essay|application|email|plan|analysis|work|deliverable|draft|letter|resume|cover letter|project|assignment|thesis|business case|request))'
          patterns=[
            ('actor_modal_verb_obj',re.compile(rf'(?is)\b(?P<actor>{ACT})\b.{{0,45}}?\b(?:will|would|can|should|must|needs?\s+to|is\s+going\s+to)\s+(?P<verb>{VERB})\b.{{0,80}}?\b(?P<object>{OBJ})\b')),
            ('obj_modal_passive_actor',re.compile(rf'(?is)\b(?P<object>{OBJ})\b.{{0,60}}?\b(?:will|would|should|must|needs?\s+to|is\s+going\s+to|is|be)\s+(?P<verb>reviewed|approved|evaluated|graded|assessed|judged)\s+by\s+(?P<actor>{ACT})\b')),
            ('send_to_actor_for_relation',re.compile(rf'(?is)\b(?:submit|send|present|share|deliver)\b.{{0,100}}?\bto\s+(?P<actor>{ACT})\b.{{0,80}}?\bfor\s+(?P<verb>review|approval|feedback|evaluation|grading|assessment)\b')),
            ('for_actor_relation',re.compile(rf'(?is)\b(?:for|before)\s+(?P<actor>{ACT})\s+(?P<verb>review|approval|evaluation|feedback|grading|assessment)\b')),
            ('actor_to_verb',re.compile(rf'(?is)\b(?P<actor>{ACT})\b\s+(?:to\s+)?(?P<verb>review|approve|evaluate|grade|assess|judge)\b')),
            ('approval_from_actor',re.compile(rf'(?is)\b(?:approval|sign[- ]?off)\s+(?:from|by)\s+(?P<actor>{ACT})\b')),
          ]
          def ctext(msg):
            if not isinstance(msg,dict): return ''
            if isinstance(msg.get('text'),str): return msg['text']
            c=msg.get('content')
            if isinstance(c,str): return c
            if isinstance(c,list): return '\n'.join(i if isinstance(i,str) else i.get('text','') if isinstance(i,dict) else '' for i in c).strip()
            return ''
          def turns(row):
            out=[]
            for e in row.get('full_conversation') or []:
              if not isinstance(e,dict): continue
              u=e.get('user')
              if isinstance(u,dict):
                t=ctext(u).strip()
                if t: out.append(t)
              elif str(e.get('role') or '')=='user':
                t=ctext(e).strip()
                if t: out.append(t)
            return out
          higher=re.compile(r'(?is)\b(?:i prefer|my preference|remove|delete|forget|ignore previous|instead of|change my mind|cross[- ]domain|combine .* with .* domain)\b')
          privacy=re.compile(r'(?i)\b(?:ssn|social security number|credit card number|password|api key|private key)\b')
          seen=set(); found=[]; raw=0
          for sh in SHARDS:
            p=hf_hub_download(REPO,filename=sh,repo_type='dataset',revision=REV)
            pf=pq.ParquetFile(p); cols=['id','evaluation_session_id','evaluation_order','language','is_code','full_conversation']; use=[c for c in cols if c in pf.schema_arrow.names]
            for b in pf.iter_batches(batch_size=512,columns=use):
              for row in b.to_pylist():
                raw+=1
                if row.get('language')!='en' or bool(row.get('is_code')): continue
                for ti,text in enumerate(turns(row)):
                  if not 24<=len(text)<=6000 or privacy.search(text): continue
                  for rank,(name,rx) in enumerate(patterns):
                    m=rx.search(text)
                    if not m: continue
                    key=(str(row.get('id') or ''),ti)
                    if key in seen: break
                    seen.add(key)
                    actor=(m.groupdict().get('actor') or '').strip()
                    verb=(m.groupdict().get('verb') or '').strip()
                    s=max(0,m.start()-220); e=min(len(text),m.end()+220)
                    found.append({'sourceRowId':key[0],'sourceEvaluationSessionId':str(row.get('evaluation_session_id') or ''),'evaluationOrder':int(row.get('evaluation_order') or 0),'turnIndex':ti,'sourceLength':len(text),'pattern':name,'patternRank':rank,'actor':actor,'verb':verb,'match':m.group(0),'context':text[s:e],'higherLaneRisk':bool(higher.search(text)),'sourceText':text,'assistantOutputsIncluded':False})
                    break
          assert raw==135634, raw
          found.sort(key=lambda x:(x['higherLaneRisk'],x['patternRank'],x['sourceLength'],x['sourceRowId'],x['turnIndex']))
          out=Path('temp-hiddenrubric/lane04/current-output'); out.mkdir(parents=True,exist_ok=True)
          (out/'current-output-candidates.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in found[:400]),encoding='utf-8')
          compact=[{k:x[k] for k in ('sourceRowId','sourceEvaluationSessionId','turnIndex','sourceLength','pattern','actor','verb','match','context','higherLaneRisk')} for x in found[:400]]
          (out/'current-output-compact.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in compact),encoding='utf-8')
          manifest={'rawRows':raw,'matchedUniqueTurns':len(found),'materializedRows':min(400,len(found)),'assistantOutputsIncluded':False,'sourceRevision':REV}
          (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest))
          PY
      - name: Commit current-output queue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/current-output/
          git commit -m 'chore: materialize temporary Lane04 current-output queue'
          git push origin HEAD:main
