name: Build Wildbound CI v2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-wildbound-ci-v2.yml'
      - 'projects/wildbound/source/compile-min-v2.tar.xz.b64.part*'
      - 'projects/wildbound/patches/**'

permissions:
  contents: write

concurrency:
  group: wildbound-ci-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TRANSPORT_DIR: projects/wildbound/source
      WORK_ROOT: _work/wildbound
      SOURCE_DIR: _work/wildbound/Wildbound_Java_26.2_v1.8.1_Source
      OUTPUT_DIR: projects/wildbound/ci-output
      LOG_DIR: projects/wildbound/ci-output/raw-logs
      SOURCE_SHA256: d93b79dc3a8e5255c1775f6ba471f861e0c7d5d41fefe5dfa1824b4923bc4369
      EXPECTED_JAR: wildbound-1.8.1.jar

    steps:
      - name: Publish run locator
        uses: actions/github-script@v7
        with:
          script: |
            const path = 'ci-state/wildbound-latest-run.txt';
            const text = `run_id=${context.runId}\nhead_sha=${context.sha}\nworkflow=${context.workflow}\n`;
            for (let attempt = 1; attempt <= 4; attempt++) {
              try {
                let sha;
                try {
                  const r = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path, ref: 'main'});
                  sha = r.data.sha;
                } catch (e) {
                  if (e.status !== 404) throw e;
                }
                await github.rest.repos.createOrUpdateFileContents({
                  owner: context.repo.owner, repo: context.repo.repo, path,
                  message: `Record Wildbound CI run ${context.runId}`,
                  content: Buffer.from(text).toString('base64'), branch: 'main', sha
                });
                break;
              } catch (e) {
                if (attempt === 4) throw e;
                await new Promise(r => setTimeout(r, 1500 * attempt));
              }
            }

      - name: Check out triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Reconstruct verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$WORK_ROOT" "$OUTPUT_DIR"
          mkdir -p "$WORK_ROOT" "$LOG_DIR"
          shopt -s nullglob
          parts=("$TRANSPORT_DIR"/compile-min-v2.tar.xz.b64.part*)
          printf '%s\n' "${parts[@]}" | tee "$LOG_DIR/source-parts.txt"
          test "${#parts[@]}" -ge 10
          cat "${parts[@]}" | base64 --decode > "$WORK_ROOT/source.tar.xz"
          printf '%s  %s\n' "$SOURCE_SHA256" "$WORK_ROOT/source.tar.xz" | sha256sum -c - | tee "$LOG_DIR/source-sha256.log"
          tar -xJf "$WORK_ROOT/source.tar.xz" -C "$WORK_ROOT"
          test -f "$SOURCE_DIR/build.gradle"
          java_count=$(find "$SOURCE_DIR/src/main/java" -name '*.java' -type f | wc -l)
          echo "java_source_count=$java_count" | tee "$LOG_DIR/source-preflight.log"
          test "$java_count" -ge 50

      - name: Restore NeoForge metadata template
        shell: bash
        run: |
          mkdir -p "$SOURCE_DIR/src/main/templates/META-INF"
          cat > "$SOURCE_DIR/src/main/templates/META-INF/neoforge.mods.toml" <<'EOF'
          license="${mod_license}"
          [[mods]]
          modId="${mod_id}"
          version="${mod_version}"
          displayName="${mod_name}"
          authors="문승준"
          description='''고유 몬스터를 포획하고 육성하며 진화시키는 Minecraft Java 몬스터 수집 RPG.'''
          [[dependencies.${mod_id}]]
          modId="neoforge"
          type="required"
          versionRange="[${neo_version},)"
          ordering="NONE"
          side="BOTH"
          [[dependencies.${mod_id}]]
          modId="minecraft"
          type="required"
          versionRange="${minecraft_version_range}"
          ordering="NONE"
          side="BOTH"
          [[dependencies.${mod_id}]]
          modId="geckolib"
          type="required"
          versionRange="[${geckolib_version},)"
          ordering="AFTER"
          side="BOTH"
          EOF

      - name: Verify toolchain and dependency boundary
        shell: bash
        working-directory: _work/wildbound/Wildbound_Java_26.2_v1.8.1_Source
        run: |
          set -euo pipefail
          { java -version; gradle --version; } 2>&1 | tee "${GITHUB_WORKSPACE}/${LOG_DIR}/toolchain.log"
          java -version 2>&1 | grep -Eq 'version "25([."]|$)'
          gradle --version | grep -F 'Gradle 9.2.1'
          ! grep -RniE 'maven\.modrinth|qANg5Jrr|e4mc' build.gradle settings.gradle gradle.properties
          grep -F 'com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}' build.gradle

      - name: Resolve dependencies
        shell: bash
        working-directory: _work/wildbound/Wildbound_Java_26.2_v1.8.1_Source
        run: |
          set -o pipefail
          gradle --no-daemon dependencies --configuration compileClasspath --stacktrace 2>&1 | tee "${GITHUB_WORKSPACE}/${LOG_DIR}/dependencies.log"

      - name: Clean build
        id: build
        shell: bash
        working-directory: _work/wildbound/Wildbound_Java_26.2_v1.8.1_Source
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon clean build --stacktrace --warning-mode all 2>&1 | tee "${GITHUB_WORKSPACE}/${LOG_DIR}/clean-build.log"
          status=${PIPESTATUS[0]}
          echo "$status" > "${GITHUB_WORKSPACE}/${OUTPUT_DIR}/build-exit-code.txt"
          echo "success=$([[ $status -eq 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and stage compiled JAR
        if: steps.build.outputs.success == 'true'
        shell: bash
        working-directory: _work/wildbound/Wildbound_Java_26.2_v1.8.1_Source
        run: |
          set -euo pipefail
          jar_path="build/libs/$EXPECTED_JAR"
          test -s "$jar_path"
          python3 - "$jar_path" "${GITHUB_WORKSPACE}/${LOG_DIR}/jar-validation.log" <<'PY'
          import sys, zipfile
          from collections import Counter
          from pathlib import Path
          p=Path(sys.argv[1]); errors=[]
          with zipfile.ZipFile(p) as z:
              n=z.namelist(); c=Counter(n)
              if any(v>1 for v in c.values()): errors.append('duplicate entries')
              if not any(x.startswith('dev/moonseungjun/wildbound/') and x.endswith('.class') for x in n): errors.append('compiled classes missing')
              if not ({'META-INF/neoforge.mods.toml','META-INF/mods.toml'} & set(n)): errors.append('NeoForge metadata missing')
              if any(x.endswith('.java') for x in n): errors.append('Java source bundled')
              if any('e4mc' in x.lower() for x in n): errors.append('e4mc bundled')
              if any(x.startswith('software/bernie/geckolib/') or x.startswith('com/geckolib/') for x in n): errors.append('GeckoLib shaded')
          text=f'jar={p}\nsize={p.stat().st_size}\nentries={len(n)}\nerrors={errors}\n'
          Path(sys.argv[2]).write_text(text); print(text)
          if errors: raise SystemExit(1)
          PY
          cp "$jar_path" "${GITHUB_WORKSPACE}/${OUTPUT_DIR}/$EXPECTED_JAR"
          sha256sum "$jar_path" | awk '{print $1}' > "${GITHUB_WORKSPACE}/${OUTPUT_DIR}/$EXPECTED_JAR.sha256"

      - name: Write report and pack logs
        if: always()
        shell: bash
        run: |
          exit_code='NOT RUN'; [[ -f "$OUTPUT_DIR/build-exit-code.txt" ]] && exit_code=$(cat "$OUTPUT_DIR/build-exit-code.txt")
          cat > "$OUTPUT_DIR/BUILD_AND_RUNTIME_REPORT.md" <<EOF
          # Wildbound 1.8.1 CI compile report
          - Run: ${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Java: 25
          - Gradle: 9.2.1
          - Minecraft: 26.2
          - NeoForge: 26.2.0.38-beta
          - GeckoLib: 5.5.3 external
          - e4mc: excluded
          - Clean-build exit code: ${exit_code}
          - Full resources and in-game validation: NOT RUN in compile-only CI
          EOF
          (cd "$OUTPUT_DIR" && zip -qr raw-logs.zip raw-logs)

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wildbound-1.8.1-logs
          path: |
            projects/wildbound/ci-output/raw-logs.zip
            projects/wildbound/ci-output/BUILD_AND_RUNTIME_REPORT.md
            projects/wildbound/ci-output/build-exit-code.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload deliverables
        if: steps.build.outputs.success == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wildbound-1.8.1-deliverables
          path: |
            projects/wildbound/ci-output/wildbound-1.8.1.jar
            projects/wildbound/ci-output/wildbound-1.8.1.jar.sha256
            projects/wildbound/ci-output/BUILD_AND_RUNTIME_REPORT.md
            projects/wildbound/ci-output/raw-logs.zip
          if-no-files-found: error
          retention-days: 14

      - name: Enforce successful result
        if: always()
        shell: bash
        run: |
          test "$(cat "$OUTPUT_DIR/build-exit-code.txt")" = 0
          test -s "$OUTPUT_DIR/$EXPECTED_JAR"
