name: Temporary Arcane alpha48 integration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-arcane-alpha48.yml'
      - '.github/scripts/tmp_arcane_alpha48.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and push alpha.48 without overwriting concurrent main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          applied=0
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            test -f .github/scripts/tmp_arcane_alpha48.py
            python3 .github/scripts/tmp_arcane_alpha48.py
            rm -f .github/scripts/tmp_arcane_alpha48.py
            git add projects/arcane-circle .github/scripts/tmp_arcane_alpha48.py
            git diff --cached --check
            git commit -m 'feat(arcane-circle): implement alpha.48 high utility identity'
            if git push origin HEAD:main; then
              applied=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$applied" -eq 1

# concurrency-safe alpha48 trigger
