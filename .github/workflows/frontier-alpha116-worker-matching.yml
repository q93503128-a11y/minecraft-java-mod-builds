name: Frontier Alpha116 Worker Matching

on:
  push:
    paths:
      - 'projects/frontier-settlement/.alpha116-worker-matching-trigger'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-24.04
    env:
      PROJECT_DIR: projects/frontier-settlement

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Apply Alpha116 worker matching hardening
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/apply_alpha116_worker_matching.py"
          git diff --check

      - name: Current source regression audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tools/test_current_source.py

      - name: Java 25 clean build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain

      - name: Verify built JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort | tail -n 1)"
          test -n "$JAR"
          unzip -t "$JAR" >/dev/null
          jar tf "$JAR" | grep -q 'kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerService.class'
          echo "Verified $JAR"

      - name: Commit validated Alpha116 to main and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$PROJECT_DIR/.alpha116-worker-matching-trigger"
          rm -f "$PROJECT_DIR/tools/apply_alpha116_worker_matching.py"
          rm -f .github/workflows/frontier-alpha116-worker-matching.yml
          git add "$PROJECT_DIR" .github/workflows/frontier-alpha116-worker-matching.yml
          git commit -m "Stabilize Frontier worker workplace matching"
          git pull --rebase origin main
          cd "$PROJECT_DIR"
          python3 tools/test_current_source.py
          cd ../..
          git push origin HEAD:main
