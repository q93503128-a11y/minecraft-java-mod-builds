name: Temporary Arcane alpha.43 audit fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-arcane-alpha43-audit-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update alpha.43 audit expectations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/arcane-circle/tools/test_current_source.py')
          s=p.read_text(encoding='utf-8')
          if "'MAX_FRAME = 12000','MAX_ENTRY = 3400'" not in s:
              raise SystemExit('old budget audit marker missing')
          s=s.replace("'MAX_FRAME = 12000','MAX_ENTRY = 3400'","'MAX_FRAME = 14500','MAX_ENTRY = 4000'",1)
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-arcane-alpha43-audit-fix.yml
          git add -A
          git commit -m 'fix(arcane): align alpha.43 source audit with render budget'
          git push origin main
