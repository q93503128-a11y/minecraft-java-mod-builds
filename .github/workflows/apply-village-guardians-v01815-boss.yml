name: Finalize Village Guardians v0.18.15 Canonical State

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.apply-v01815'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Rebase
        run: git pull --rebase origin main
      - name: Finalize canonical docs and contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/village-guardians/tools/finalize_v01815_docs.py
          python3 projects/village-guardians/tools/test_v01815_boss_identity.py
          test -f projects/village-guardians/.ci/v01815-final.txt
          grep -q '^version=0.18.15-alpha.1$' projects/village-guardians/.ci/v01815-final.txt
          grep -q '^run_id=32089737176$' projects/village-guardians/.ci/v01815-final.txt
      - name: Remove temporary v0.18.15 tooling
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-village-guardians-v01815-boss.yml \
            projects/village-guardians/.apply-v01815 \
            projects/village-guardians/.build-trigger-v01815 \
            projects/village-guardians/tools/apply_v01815_boss_identity.py \
            projects/village-guardians/tools/prepare_v01815_contracts.py \
            projects/village-guardians/tools/apply_v01815_doctrine_math_fix.py \
            projects/village-guardians/tools/prepare_v01815_doctrine_math_contract.py \
            projects/village-guardians/tools/finalize_v01815_docs.py \
            projects/village-guardians/.ci/v01815-apply-report.txt \
            projects/village-guardians/.ci/v01815-doctrine-report.txt \
            projects/village-guardians/.ci/v01815-build-report.txt
      - name: Commit canonical state
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'docs(village): finalize v0.18.15 boss identity'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
