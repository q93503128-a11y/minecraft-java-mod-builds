name: Trigger Survival Ascension 0.50

on:
  issues:
    types: [opened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  trigger:
    if: github.event.issue.title == '[internal] trigger survival 050'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch applicator
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apply-survival-050.yml --ref main
      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --reason completed
