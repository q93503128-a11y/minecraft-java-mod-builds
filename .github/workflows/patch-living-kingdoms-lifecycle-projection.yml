name: Patch Living Kingdoms lifecycle projection

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_living_kingdoms_lifecycle_projection.py'
      - '.github/workflows/patch-living-kingdoms-lifecycle-projection.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply future lifecycle projection
        run: python .github/scripts/patch_living_kingdoms_lifecycle_projection.py
      - name: Commit projection Java and documentation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git restore .github/workflows/audit-living-kingdoms-exterior-lifecycle.yml
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleManager.java \
            projects/living-kingdoms/docs/ERDEN_EXTERIOR_LIFECYCLE_VALIDATION.md
          git diff --cached --quiet && exit 0
          git commit -m 'Add non-persistent lifecycle future projection proof'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot projection integration; remove after the Java patch lands.
