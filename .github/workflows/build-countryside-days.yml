name: Build Countryside Days

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/countryside-days/**'
      - '.github/workflows/build-countryside-days.yml'

permissions:
  contents: write

env:
  PROJECT_DIR: projects/countryside-days
  WORK_DIR: work/countryside-days
  GRADLE_VERSION: '9.2.1'
  EXPECTED_PAYLOAD_SHA256: '656d74fab5ed88c1102c6e1c0c5ec376e9ef5487a191245a9127ebc57760d701'
  RELEASE_TAG: countryside-days-v0.20.1

jobs:
  build:
    name: Java 25 / NeoForge 26.2 build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Reconstruct exact source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR" logs
          cat "$PROJECT_DIR"/source-payload/part*.b64 > source.tar.xz.b64
          wc -c source.tar.xz.b64 | tee logs/payload-base64-size.txt
          base64 --decode source.tar.xz.b64 > source.tar.xz
          sha256sum source.tar.xz | tee logs/payload-sha256.txt
          echo "$EXPECTED_PAYLOAD_SHA256  source.tar.xz" | sha256sum --check --strict
          xz -t source.tar.xz
          tar -xJf source.tar.xz -C "$WORK_DIR"
          if [ -d "$PROJECT_DIR/overlay" ]; then
            cp -a "$PROJECT_DIR/overlay/." "$WORK_DIR/"
          fi
          test -f "$WORK_DIR/build.gradle"
          test -f "$WORK_DIR/gradle.properties"
          test -d "$WORK_DIR/src/main/java/kr/countrysidedays"
          find "$WORK_DIR/src/main/java" -name '*.java' | sort > logs/java-files.txt
          find "$WORK_DIR/src/main/resources" -type f | sort > logs/resource-files.txt
          echo "Java files: $(wc -l < logs/java-files.txt)"
          echo "Resource files: $(wc -l < logs/resource-files.txt)"

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            java -version
            gradle --version
          } 2>&1 | tee logs/toolchain.log

      - name: Collect mapped Minecraft and NeoForge API signatures
        working-directory: ${{ env.WORK_DIR }}
        shell: bash
        run: |
          set -u
          cat > /tmp/countryside-diagnostics.init.gradle <<'EOF'
          gradle.projectsEvaluated {
              def root = gradle.rootProject
              if (root.configurations.findByName('compileClasspath') != null && root.tasks.findByName('printCompileClasspathForDiagnostics') == null) {
                  root.tasks.register('printCompileClasspathForDiagnostics') {
                      doLast {
                          root.configurations.getByName('compileClasspath').files.each {
                              println('CPFILE=' + it.absolutePath)
                          }
                      }
                  }
              }
          }
          EOF
          gradle --no-daemon -I /tmp/countryside-diagnostics.init.gradle printCompileClasspathForDiagnostics --console=plain > ../../logs/compile-classpath.txt 2>&1 || true
          grep '^CPFILE=' ../../logs/compile-classpath.txt | sed 's/^CPFILE=//' > /tmp/countryside-cp-files.txt || true
          paste -sd: /tmp/countryside-cp-files.txt > /tmp/countryside-classpath.txt || true
          CP="$(cat /tmp/countryside-classpath.txt 2>/dev/null || true)"
          : > ../../logs/api-matching-classes.txt
          while IFS= read -r archive; do
            [ -f "$archive" ] || continue
            case "$archive" in
              *.jar)
                jar tf "$archive" 2>/dev/null | grep -E '(^net/minecraft/world/entity/npc/.*(Villager|Trader).*\.class$)|(^net/minecraft/world/entity/decoration/ArmorStand\.class$)|EventBusSubscriber\.class$' >> ../../logs/api-matching-classes.txt || true
                ;;
            esac
          done < /tmp/countryside-cp-files.txt
          sort -u -o ../../logs/api-matching-classes.txt ../../logs/api-matching-classes.txt
          {
            echo '=== COMPILE CLASSPATH ==='
            cat /tmp/countryside-cp-files.txt
            echo '=== MATCHING CLASSES ==='
            cat ../../logs/api-matching-classes.txt
            for cls in \
              net.minecraft.server.level.ServerPlayer \
              net.minecraft.server.level.ServerLevel \
              net.minecraft.world.level.Level \
              net.minecraft.world.entity.player.Player \
              net.minecraft.world.entity.Entity \
              net.minecraft.world.entity.decoration.ArmorStand \
              net.minecraft.core.BlockPos \
              net.minecraft.sounds.SoundEvents \
              net.minecraft.sounds.SoundEvent \
              net.neoforged.fml.common.EventBusSubscriber \
              net.neoforged.neoforge.network.registration.PayloadRegistrar \
              net.neoforged.neoforge.network.event.RegisterPayloadHandlersEvent \
              net.neoforged.neoforge.client.event.RegisterKeyMappingsEvent \
              net.neoforged.neoforge.data.event.GatherDataEvent; do
                echo "=== JAVAP $cls ==="
                javap -public -classpath "$CP" "$cls" 2>&1 || true
            done
            while IFS= read -r classfile; do
              case "$classfile" in
                *'$'*) continue ;;
              esac
              cls="${classfile%.class}"
              cls="${cls//\//.}"
              echo "=== JAVAP DISCOVERED $cls ==="
              javap -public -classpath "$CP" "$cls" 2>&1 || true
            done < ../../logs/api-matching-classes.txt
          } > ../../logs/api-diagnostics.txt 2>&1
          exit 0

      - name: Generate resources with runData
        working-directory: ${{ env.WORK_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon runData --stacktrace --console=plain 2>&1 | tee ../../logs/run-data.log
          test -f src/generated/resources/data/countryside_days/countryside_catalog/runtime.json

      - name: Clean build
        working-directory: ${{ env.WORK_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace --console=plain 2>&1 | tee ../../logs/clean-build.log

      - name: Verify and package release files
        working-directory: ${{ env.WORK_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon verifyReleaseJar releaseChecksum localMrpack verifyLocalMrpack --stacktrace --console=plain 2>&1 | tee ../../logs/release-package.log
          mkdir -p ../../deliverables
          cp build/libs/countryside_days-0.20.1.jar ../../deliverables/
          cp build/release/countryside_days-0.20.1.jar.sha256 ../../deliverables/
          cp build/release/Countryside_Days_NeoForge_26.2_v0.20.1.mrpack ../../deliverables/

      - name: Inspect final JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=deliverables/countryside_days-0.20.1.jar
          unzip -Z1 "$JAR" | tee logs/jar-entries.txt
          test "$(unzip -Z1 "$JAR" | sort | uniq -d | wc -l)" -eq 0
          unzip -Z1 "$JAR" | grep -Fx 'META-INF/neoforge.mods.toml'
          unzip -Z1 "$JAR" | grep -Eq '^kr/countrysidedays/.+\.class$'
          unzip -Z1 "$JAR" | grep -Eq '^assets/countryside_days/'
          unzip -Z1 "$JAR" | grep -Eq '^data/countryside_days/'
          if unzip -Z1 "$JAR" | grep -Eq '(^|/)(tools|\.github)/|\.java$|_REPORT\.md$'; then
            echo 'Forbidden development content found in release JAR' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee logs/jar-sha256.txt

      - name: Publish verified release assets
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" deliverables/* --clobber
          else
            gh release create "$RELEASE_TAG" deliverables/* \
              --title 'Countryside Days v0.20.1 verified build' \
              --notes 'Java 25 / Minecraft 26.2 / NeoForge 26.2.0.38-beta. Built and structurally verified by GitHub Actions.'
          fi

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-build-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.20.1
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Commit latest status and logs
        if: always()
        shell: bash
        env:
          BUILD_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          rm -rf /tmp/countryside-build-result
          mkdir -p /tmp/countryside-build-result/logs
          if [ -d logs ]; then cp -a logs/. /tmp/countryside-build-result/logs/; fi
          if [ -d deliverables ]; then cp -a deliverables /tmp/countryside-build-result/; fi
          cat > /tmp/countryside-build-result/LATEST_STATUS.md <<EOF
          # Countryside Days latest GitHub build

          - Status: **${BUILD_STATUS}**
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Source commit: \`${GITHUB_SHA}\`
          - Run number: \`${GITHUB_RUN_NUMBER}\`
          - Java: \`25\`
          - Minecraft: \`26.2\`
          - NeoForge: \`26.2.0.38-beta\`
          - Gradle: \`9.2.1\`
          - Release tag: \`${RELEASE_TAG}\`
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          mkdir -p build-results/countryside-days
          cp -a /tmp/countryside-build-result/. build-results/countryside-days/
          git add build-results/countryside-days
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Countryside Days build ${GITHUB_RUN_NUMBER}: ${BUILD_STATUS}"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 3))
          done
          echo 'Failed to publish build status after three attempts' >&2
          exit 1
