name: Build Countryside Days

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/countryside-days/**'
      - '.github/workflows/build-countryside-days.yml'

permissions:
  contents: read

env:
  PROJECT_DIR: projects/countryside-days
  WORK_DIR: work/countryside-days
  GRADLE_VERSION: '9.2.1'
  EXPECTED_PAYLOAD_SHA256: '656d74fab5ed88c1102c6e1c0c5ec376e9ef5487a191245a9127ebc57760d701'

jobs:
  build:
    name: Java 25 / NeoForge 26.2 build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Reconstruct exact source payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK_DIR" logs
          cat "$PROJECT_DIR"/source-payload/part*.b64 > source.tar.xz.b64
          base64 --decode source.tar.xz.b64 > source.tar.xz
          echo "$EXPECTED_PAYLOAD_SHA256  source.tar.xz" | sha256sum --check --strict
          tar -xJf source.tar.xz -C "$WORK_DIR"
          test -f "$WORK_DIR/build.gradle"
          test -f "$WORK_DIR/gradle.properties"
          test -d "$WORK_DIR/src/main/java/kr/countrysidedays"
          find "$WORK_DIR/src/main/java" -name '*.java' | sort > logs/java-files.txt
          find "$WORK_DIR/src/main/resources" -type f | sort > logs/resource-files.txt
          echo "Java files: $(wc -l < logs/java-files.txt)"
          echo "Resource files: $(wc -l < logs/resource-files.txt)"

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            java -version
            gradle --version
          } 2>&1 | tee logs/toolchain.log

      - name: Clean build
        working-directory: ${{ env.WORK_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace --console=plain 2>&1 | tee ../../logs/clean-build.log

      - name: Verify and package release files
        working-directory: ${{ env.WORK_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon verifyReleaseJar releaseChecksum localMrpack verifyLocalMrpack --stacktrace --console=plain 2>&1 | tee ../../logs/release-package.log
          mkdir -p ../../deliverables
          cp build/libs/countryside_days-0.20.1.jar ../../deliverables/
          cp build/release/countryside_days-0.20.1.jar.sha256 ../../deliverables/
          cp build/release/Countryside_Days_NeoForge_26.2_v0.20.1.mrpack ../../deliverables/

      - name: Inspect final JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=deliverables/countryside_days-0.20.1.jar
          unzip -Z1 "$JAR" | tee logs/jar-entries.txt
          test "$(unzip -Z1 "$JAR" | sort | uniq -d | wc -l)" -eq 0
          unzip -Z1 "$JAR" | grep -Fx 'META-INF/neoforge.mods.toml'
          unzip -Z1 "$JAR" | grep -Eq '^kr/countrysidedays/.+\.class$'
          unzip -Z1 "$JAR" | grep -Eq '^assets/countryside_days/'
          unzip -Z1 "$JAR" | grep -Eq '^data/countryside_days/'
          if unzip -Z1 "$JAR" | grep -Eq '(^|/)(tools|\.github)/|\.java$|_REPORT\.md$'; then
            echo 'Forbidden development content found in release JAR' >&2
            exit 1
          fi
          sha256sum "$JAR" | tee logs/jar-sha256.txt

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-build-logs-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.20.1
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
