name: Build Countryside Days

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/countryside-days/**'
      - '!projects/countryside-days/BUILD_AND_RUNTIME_REPORT.md'
      - '.github/workflows/build-countryside-days.yml'

permissions:
  contents: write

concurrency:
  group: countryside-days-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/countryside-days

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Generate official Gradle wrapper
        id: wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1 --distribution-type bin
          chmod +x gradlew

      - name: Verify toolchain
        id: toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Clean build
        id: build
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ci-logs/clean-build.log

      - name: Run data generation
        id: datagen
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon runData --stacktrace 2>&1 | tee ci-logs/datagen.log

      - name: Run required GameTests
        id: gametest
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew --no-daemon runGameTestServer --stacktrace 2>&1 | tee ci-logs/gametest.log

      - name: Reject runtime data reload errors
        id: dataload
        run: |
          if grep -n -E "Couldn't parse data file|Failed to parse recipe|Parsing error loading recipe|Failed to parse.*configured_feature|Failed to parse.*placed_feature|Failed to parse.*world_preset|Failed to parse.*flat_level_generator_preset|Failed to parse.*worldgen/biome|biome_modifier" ci-logs/gametest.log ci-logs/datagen.log; then
            echo "Runtime data failed to load cleanly."
            exit 1
          fi
          echo "No recipe, biome, or worldgen data parse errors found."

      - name: Run superflat countryside server smoke test
        id: server
        timeout-minutes: 8
        run: |
          rm -rf run/world run/logs
          mkdir -p run ci-logs
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          level-name=world
          level-type=minecraft:flat
          generate-structures=true
          online-mode=false
          spawn-protection=0
          view-distance=10
          simulation-distance=8
          PROPERTIES

          setsid ./gradlew --no-daemon runServer --stacktrace > ci-logs/server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for SECOND in $(seq 1 180); do
            if grep -q "Done (" ci-logs/server.log; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill -TERM -- "-$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          tail -n 280 ci-logs/server.log

          if [ "$READY" -ne 1 ]; then
            echo "Superflat server never reached the ready state."
            exit 1
          fi
          if grep -n -E "Failed to start the minecraft server|Exception in server tick loop|ModLoadingException|Feature placement|Countryside worldgen audit failed" ci-logs/server.log; then
            echo "Superflat countryside server reported a fatal startup or worldgen error."
            exit 1
          fi
          if ! grep -q "Countryside worldgen audit passed" ci-logs/server.log; then
            echo "Countryside generation did not produce the deterministic spawn marker."
            exit 1
          fi
          echo "Superflat server generated and audited the dry settlement reserve successfully."

      - name: Run client boot smoke test
        id: client
        timeout-minutes: 6
        run: |
          rm -rf run/logs
          mkdir -p run ci-logs

          setsid env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x720x24' \
            ./gradlew --no-daemon runClient --stacktrace > ci-logs/client.log 2>&1 &
          CLIENT_PID=$!
          READY=0
          for SECOND in $(seq 1 150); do
            if grep -q "Backend library: LWJGL" ci-logs/client.log \
              && grep -Eq "Sound engine started|Created:.*minecraft:textures/atlas" ci-logs/client.log; then
              READY=1
              break
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill -TERM -- "-$CLIENT_PID" 2>/dev/null || true
          wait "$CLIENT_PID" 2>/dev/null || true
          tail -n 280 ci-logs/client.log

          if [ "$READY" -ne 1 ]; then
            echo "Minecraft client never reached rendered resource readiness."
            exit 1
          fi
          if ! grep -q "Countryside Days 0.1.0-alpha.9 core content registered" ci-logs/client.log; then
            echo "Countryside Days alpha.9 did not register in the client process."
            exit 1
          fi
          if ! grep -q "Countryside Days compact navigation HUD registered" ci-logs/client.log; then
            echo "Countryside Days compact HUD did not register."
            exit 1
          fi
          if grep -n -E "Failed to create window|ModLoadingException|Caught previously unhandled exception|ReportedException" ci-logs/client.log; then
            echo "Client reported a fatal boot or rendering error."
            exit 1
          fi
          if grep -n -E "Missing item model for location countrysidedays:|Unable to load model.*countrysidedays:|Missing textures in model countrysidedays:" ci-logs/client.log; then
            echo "Countryside Days has a missing item model or texture."
            exit 1
          fi
          echo "Client reached rendered resource readiness with the compact progression HUD registered."

      - name: Verify JAR and create deliverables
        id: jarcheck
        run: |
          JAR="build/libs/countrysidedays-0.1.0-alpha.9.jar"
          python3 tools/verify_jar.py "$JAR" | tee ci-logs/jar-verification.log
          mkdir -p build/deliverables
          cp "$JAR" build/deliverables/
          sha256sum "$JAR" | sed 's#build/libs/##' > "build/deliverables/countrysidedays-0.1.0-alpha.9.jar.sha256"

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.9-deliverables
          path: projects/countryside-days/build/deliverables/
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.9-logs
          path: projects/countryside-days/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Record CI result
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          WRAPPER_OUTCOME: ${{ steps.wrapper.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DATAGEN_OUTCOME: ${{ steps.datagen.outcome }}
          GAMETEST_OUTCOME: ${{ steps.gametest.outcome }}
          DATALOAD_OUTCOME: ${{ steps.dataload.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
          JAR_OUTCOME: ${{ steps.jarcheck.outcome }}
        run: |
          cat > BUILD_AND_RUNTIME_REPORT.md <<REPORT
          # Countryside Days Build and Runtime Report

          - Workflow run: ${RUN_ID}
          - Source commit: ${SOURCE_SHA}
          - Mod version: 0.1.0-alpha.9
          - Minecraft: 26.2
          - Java: 25
          - Gradle: 9.2.1
          - NeoForge: 26.2.0.38-beta
          - Wrapper generation: ${WRAPPER_OUTCOME}
          - Toolchain verification: ${TOOLCHAIN_OUTCOME}
          - Clean build: ${BUILD_OUTCOME}
          - Datagen: ${DATAGEN_OUTCOME}
          - Required GameTest server: ${GAMETEST_OUTCOME}
          - Runtime data reload validation: ${DATALOAD_OUTCOME}
          - Superflat countryside server smoke test and generation audit: ${SERVER_OUTCOME}
          - Client smoke test: ${CLIENT_OUTCOME}
          - JAR structure verification: ${JAR_OUTCOME}

          This report is generated by GitHub Actions. GameTests verify per-player restaurant opening, three independent daily customer slots, duplicate-payment prevention, persistent ranch production and one-time collection, protected signs, directed furniture, beds, gates, livestock resources, and multiplayer estate isolation. Server and virtual-display client smoke tests remain mandatory. A human visual play test is still required before release.
          REPORT

          for LOG in clean-build datagen gametest server client; do
            if [ -f "ci-logs/${LOG}.log" ]; then
              {
                echo
                echo "## ${LOG} log tail"
                echo '```text'
                tail -n 280 "ci-logs/${LOG}.log"
                echo '```'
              } >> BUILD_AND_RUNTIME_REPORT.md
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_AND_RUNTIME_REPORT.md
          if [ "${BUILD_OUTCOME}" = "success" ] && [ "${JAR_OUTCOME}" = "success" ]; then
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          fi
          if git diff --cached --quiet; then
            echo "No CI records changed."
            exit 0
          fi
          git commit -m "Record Countryside Days CI result for ${SOURCE_SHA:0:7}"
          git pull --rebase origin main
          git push origin HEAD:main
