# Countryside Days alpha.12 paid-workers, public-fishing and restaurant-layout validation.
name: Build Countryside Days

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/countryside-days/**'
      - '!projects/countryside-days/BUILD_AND_RUNTIME_REPORT.md'
      - '.github/workflows/build-countryside-days.yml'

permissions:
  contents: write

concurrency:
  group: countryside-days-${{ github.ref }}-${{ github.actor }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/countryside-days

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Generate official Gradle wrapper
        id: wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1 --distribution-type bin
          chmod +x gradlew

      - name: Verify toolchain
        id: toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Validate UTF-8 localization sources
        id: localization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('src/main/resources/assets/countrysidedays/lang')
          parsed = {}
          for name in ('ko_kr.json', 'en_us.json'):
              path = root / name
              raw = path.read_bytes()
              text = raw.decode('utf-8', errors='strict')
              data = json.loads(text)
              if not isinstance(data, dict):
                  raise SystemExit(f'{name}: localization root is not an object')
              parsed[name] = data

          ko = parsed['ko_kr.json']
          en = parsed['en_us.json']
          if set(ko) != set(en):
              raise SystemExit(
                  f'localization key mismatch: missing ko={sorted(set(en)-set(ko))}, '
                  f'missing en={sorted(set(ko)-set(en))}'
              )
          required = (
              'hud.countrysidedays.shift_open',
              'hud.countrysidedays.shift_closed',
              'hud.countrysidedays.goal_open_first_shift',
              'item.countrysidedays.recipe_notebook',
              'item.countrysidedays.life_guide',
              'item.countrysidedays.grilled_river_fish',
              'item.countrysidedays.potato_pancake',
              'item.countrysidedays.honey_carrot_salad',
              'message.countrysidedays.starter_hoe',
              'message.countrysidedays.fishing_public_only',
              'message.countrysidedays.worker_hired',
              'message.countrysidedays.worker_status',
              'message.countrysidedays.restaurant_role_owner',
              'message.countrysidedays.restaurant_role_staff',
              'message.countrysidedays.public_livestock_protected',
              'message.countrysidedays.market_holiday',
          )
          for key in required:
              if not isinstance(ko.get(key), str) or not ko[key].strip():
                  raise SystemExit(f'missing Korean localization for {key}')
          if ko['hud.countrysidedays.shift_closed'].startswith('CLOSED'):
              raise SystemExit('Korean HUD text still falls back to English')
          for key in ('message.countrysidedays.personal_estate_ready', 'message.countrysidedays.property_deed'):
              if '%s' in ko[key]:
                  raise SystemExit(f'raw coordinate placeholder leaked into Korean guidance: {key}')
          print(f'Validated {len(ko)} matching UTF-8 localization keys.')
          PY

      - name: Validate countryside gameplay contracts
        id: contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          gameplay = Path('src/main/java/kr/countrysidedays/gameplay/RuralGameplayHandler.java').read_text('utf-8')
          village = Path('src/main/java/kr/countrysidedays/gameplay/VillageLifeManager.java').read_text('utf-8')
          workers = Path('src/main/java/kr/countrysidedays/gameplay/EstateWorkerManager.java').read_text('utf-8')
          fishing = Path('src/main/java/kr/countrysidedays/gameplay/CountrysideFishingManager.java').read_text('utf-8')
          npc = Path('src/main/java/kr/countrysidedays/gameplay/RuralNpcManager.java').read_text('utf-8')
          layout = Path('src/main/java/kr/countrysidedays/world/PlayerEstateLayout.java').read_text('utf-8')
          restaurant = Path('src/main/java/kr/countrysidedays/world/SharedRestaurantBuilder.java').read_text('utf-8')
          notebook = Path('src/main/java/kr/countrysidedays/item/RecipeNotebookItem.java').read_text('utf-8')
          items = Path('src/main/java/kr/countrysidedays/registry/ModItems.java').read_text('utf-8')

          required_sources = (
              'src/main/java/kr/countrysidedays/gameplay/SharedRestaurantAccess.java',
              'src/main/java/kr/countrysidedays/gameplay/EstateWorkerManager.java',
              'src/main/java/kr/countrysidedays/gameplay/CountrysideFishingManager.java',
              'src/main/java/kr/countrysidedays/world/SharedRestaurantBuilder.java',
              'src/main/java/kr/countrysidedays/world/PublicVillageExpansionBuilder.java',
          )
          for source in required_sources:
              if not Path(source).is_file():
                  raise SystemExit(f'missing alpha.12 source: {source}')

          for exact in (
              'new ItemStack(Items.WHEAT_SEEDS, 32)',
              'new ItemStack(Items.CARROT, 8)',
              'new ItemStack(Items.POTATO, 8)',
              'Items.STONE_HOE.getDefaultInstance()',
              'CountrysideFishingManager.isAllowed',
          ):
              if exact not in gameplay:
                  raise SystemExit(f'starter or fishing contract missing: {exact}')

          if 'ensureEstateWorker(' in village:
              raise SystemExit('legacy free automatic worker spawning returned')
          for exact in (
              'EstateWorkerManager.maintain',
              'EstateWorkerManager.isActive',
          ):
              if exact not in village:
                  raise SystemExit(f'paid worker integration missing: {exact}')
          for exact in (
              'HIRING_FEE = 12',
              'DAILY_WAGE = 2',
              'MAX_MISSED_WAGES = 3',
              'consumeDailyWage',
          ):
              if exact not in workers:
                  raise SystemExit(f'worker contract missing: {exact}')

          for exact in (
              'dx >= -50 && dx <= -34',
              'dz >= 30 && dz <= 44',
              'PlayerEstateLayout.contains',
          ):
              if exact not in fishing:
                  raise SystemExit(f'public fishing boundary contract missing: {exact}')

          for exact in (
              'restaurantOwnerNeedsAccess',
              'customerSeatYaw',
              'Pose.SITTING',
              'Math.floorMod(Long.hashCode(seed), 6)',
          ):
              if exact not in npc:
                  raise SystemExit(f'restaurant guest or owner-access contract missing: {exact}')
          for exact in (
              'restaurantRevisionMarker',
              'customerSeatFacing',
              'isRestaurantOwnerAccessZone',
          ):
              if exact not in layout:
                  raise SystemExit(f'restaurant layout contract missing: {exact}')
          for exact in (
              'REVISION_MARKER',
              'buildDiningRoom',
              'centre aisle',
          ):
              if exact not in restaurant:
                  raise SystemExit(f'clean restaurant rebuild contract missing: {exact}')

          for forbidden in ('손님 주문', '손님 보상', '조리 기록', '일꾼 고용', '월급'):
              if forbidden in notebook:
                  raise SystemExit(f'recipe notebook contains non-recipe management content: {forbidden}')
          for required_recipe in ('민물고기 구이', '감자전', '꿀당근 샐러드'):
              if required_recipe not in notebook:
                  raise SystemExit(f'new recipe missing from notebook: {required_recipe}')
          for field in ('GRILLED_RIVER_FISH', 'POTATO_PANCAKE', 'HONEY_CARROT_SALAD'):
              if field not in items:
                  raise SystemExit(f'new menu item not registered: {field}')

          print('Paid workers, public fishing, owner access, six dishes, and clean seating contracts passed.')
          PY

      - name: Clean build
        id: build
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ci-logs/clean-build.log

      - name: Run data generation
        id: datagen
        run: |
          set -o pipefail
          ./gradlew --no-daemon runData --stacktrace 2>&1 | tee ci-logs/datagen.log

      - name: Run required GameTests
        id: gametest
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew --no-daemon runGameTestServer --stacktrace 2>&1 | tee ci-logs/gametest.log

      - name: Reject runtime data reload errors
        id: dataload
        run: |
          if grep -n -E "Couldn't parse data file|Failed to parse recipe|Parsing error loading recipe|Failed to parse.*configured_feature|Failed to parse.*placed_feature|Failed to parse.*world_preset|Failed to parse.*flat_level_generator_preset|Failed to parse.*worldgen/biome|biome_modifier" ci-logs/gametest.log ci-logs/datagen.log; then
            echo "Runtime data failed to load cleanly."
            exit 1
          fi
          echo "No recipe, biome, or worldgen data parse errors found."

      - name: Run superflat countryside server smoke test
        id: server
        timeout-minutes: 8
        run: |
          rm -rf run/world run/logs
          mkdir -p run ci-logs
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          level-name=world
          level-type=minecraft:flat
          generate-structures=true
          online-mode=false
          spawn-protection=0
          view-distance=10
          simulation-distance=8
          PROPERTIES

          setsid ./gradlew --no-daemon runServer --stacktrace > ci-logs/server.log 2>&1 &
          SERVER_PID=$!
          READY=0
          for SECOND in $(seq 1 180); do
            if grep -q "Done (" ci-logs/server.log; then
              READY=1
              break
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill -TERM -- "-$SERVER_PID" 2>/dev/null || true
          wait "$SERVER_PID" 2>/dev/null || true
          tail -n 280 ci-logs/server.log

          if [ "$READY" -ne 1 ]; then
            echo "Superflat server never reached the ready state."
            exit 1
          fi
          if grep -n -E "Failed to start the minecraft server|Exception in server tick loop|ModLoadingException|Feature placement|Countryside worldgen audit failed" ci-logs/server.log; then
            echo "Superflat countryside server reported a fatal startup or worldgen error."
            exit 1
          fi
          if ! grep -q "Countryside worldgen audit passed" ci-logs/server.log; then
            echo "Countryside generation did not produce the deterministic spawn marker."
            exit 1
          fi
          echo "Superflat server generated and audited the protected countryside successfully."

      - name: Run client boot smoke test
        id: client
        timeout-minutes: 6
        run: |
          rm -rf run/logs
          mkdir -p run ci-logs

          setsid env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x720x24' \
            ./gradlew --no-daemon runClient --stacktrace > ci-logs/client.log 2>&1 &
          CLIENT_PID=$!
          READY=0
          for SECOND in $(seq 1 150); do
            if grep -q "Backend library: LWJGL" ci-logs/client.log \
              && grep -Eq "Sound engine started|Created:.*minecraft:textures/atlas" ci-logs/client.log; then
              READY=1
              break
            fi
            if ! kill -0 "$CLIENT_PID" 2>/dev/null; then
              break
            fi
            sleep 1
          done

          kill -TERM -- "-$CLIENT_PID" 2>/dev/null || true
          wait "$CLIENT_PID" 2>/dev/null || true
          tail -n 280 ci-logs/client.log

          if [ "$READY" -ne 1 ]; then
            echo "Minecraft client never reached rendered resource readiness."
            exit 1
          fi
          if ! grep -q "Countryside Days 0.1.0-alpha.12 core content registered" ci-logs/client.log; then
            echo "Countryside Days alpha.12 did not register in the client process."
            exit 1
          fi
          if ! grep -q "Countryside Days compact navigation HUD registered" ci-logs/client.log; then
            echo "Countryside Days compact HUD did not register."
            exit 1
          fi
          if grep -n -E "Failed to create window|ModLoadingException|Caught previously unhandled exception|ReportedException" ci-logs/client.log; then
            echo "Client reported a fatal boot or rendering error."
            exit 1
          fi
          if grep -n -E "Missing item model for location countrysidedays:|Unable to load model.*countrysidedays:|Missing textures in model countrysidedays:" ci-logs/client.log; then
            echo "Countryside Days has a missing item model or texture."
            exit 1
          fi
          echo "Client reached rendered resource readiness with the compact navigation HUD registered."

      - name: Verify JAR and create deliverables
        id: jarcheck
        run: |
          JAR="build/libs/countrysidedays-0.1.0-alpha.12.jar"
          python3 tools/verify_jar.py "$JAR" | tee ci-logs/jar-verification.log
          mkdir -p build/deliverables
          cp "$JAR" build/deliverables/
          sha256sum "$JAR" | sed 's#build/libs/##' > "build/deliverables/countrysidedays-0.1.0-alpha.12.jar.sha256"

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.12-deliverables
          path: projects/countryside-days/build/deliverables/
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.12-logs
          path: projects/countryside-days/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Record CI result
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          WRAPPER_OUTCOME: ${{ steps.wrapper.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          LOCALIZATION_OUTCOME: ${{ steps.localization.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DATAGEN_OUTCOME: ${{ steps.datagen.outcome }}
          GAMETEST_OUTCOME: ${{ steps.gametest.outcome }}
          DATALOAD_OUTCOME: ${{ steps.dataload.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
          JAR_OUTCOME: ${{ steps.jarcheck.outcome }}
        run: |
          cat > BUILD_AND_RUNTIME_REPORT.md <<REPORT
          # Countryside Days Build and Runtime Report

          - Workflow run: ${RUN_ID}
          - Source commit: ${SOURCE_SHA}
          - Mod version: 0.1.0-alpha.12
          - Minecraft: 26.2
          - Java: 25
          - Gradle: 9.2.1
          - NeoForge: 26.2.0.38-beta
          - Wrapper generation: ${WRAPPER_OUTCOME}
          - Toolchain verification: ${TOOLCHAIN_OUTCOME}
          - UTF-8 localization validation: ${LOCALIZATION_OUTCOME}
          - Countryside gameplay contract validation: ${CONTRACTS_OUTCOME}
          - Clean build: ${BUILD_OUTCOME}
          - Datagen: ${DATAGEN_OUTCOME}
          - Required GameTest server: ${GAMETEST_OUTCOME}
          - Runtime data reload validation: ${DATALOAD_OUTCOME}
          - Superflat countryside server smoke test and generation audit: ${SERVER_OUTCOME}
          - Client smoke test: ${CLIENT_OUTCOME}
          - JAR structure verification: ${JAR_OUTCOME}

          This report is generated by GitHub Actions. GameTests verify the rebuilt shared restaurant, correctly directed guest chairs, a clear centre aisle, owner access before opening, no free starter workers, paid worker constants, public-only fishing boundaries, six menu dishes, independent private ranch production, deterministic safe market prices, protected buildings, and multiplayer estate isolation. Source and built-JAR validation require matching UTF-8 Korean and English localization keys and every new worker, fishing, recipe, item, model, and class asset. Server and virtual-display client smoke tests remain mandatory. A human visual play test is still recommended before a stable release.
          REPORT

          for LOG in clean-build datagen gametest server client; do
            if [ -f "ci-logs/${LOG}.log" ]; then
              {
                echo
                echo "## ${LOG} log tail"
                echo '```text'
                tail -n 280 "ci-logs/${LOG}.log"
                echo '```'
              } >> BUILD_AND_RUNTIME_REPORT.md
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_AND_RUNTIME_REPORT.md
          if [ "${BUILD_OUTCOME}" = "success" ] && [ "${JAR_OUTCOME}" = "success" ]; then
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          fi
          if git diff --cached --quiet; then
            echo "No CI records changed."
            exit 0
          fi
          git commit -m "Record Countryside Days CI result for ${SOURCE_SHA:0:7}"
          git pull --rebase origin main
          git push origin HEAD:main
