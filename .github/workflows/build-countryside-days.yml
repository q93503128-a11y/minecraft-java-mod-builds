name: Build Countryside Days

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/countryside-days/**'
      - '!projects/countryside-days/BUILD_AND_RUNTIME_REPORT.md'
      - '.github/workflows/build-countryside-days.yml'

permissions:
  contents: write

concurrency:
  group: countryside-days-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: projects/countryside-days

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Materialize staged alpha.14 source
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, io, zipfile
          root = Path('.')
          project = root / 'projects/countryside-days'
          payload = project / 'tools/alpha14_payload.b64'
          archive = base64.b64decode(payload.read_text('ascii'))
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              source.extractall(root)
          payload.unlink()

          patch = project / 'tools/alpha14_patch.b64'
          archive = base64.b64decode(patch.read_text('ascii'))
          with zipfile.ZipFile(io.BytesIO(archive)) as source:
              source.extractall(project)
          patch.unlink()
          PY

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Generate official Gradle wrapper
        id: wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1 --distribution-type bin
          chmod +x gradlew

      - name: Verify toolchain
        id: toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Validate UTF-8 localization
        id: localization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          root = Path('src/main/resources/assets/countrysidedays/lang')
          parsed = {}
          for name in ('ko_kr.json', 'en_us.json'):
              raw = (root / name).read_bytes()
              parsed[name] = json.loads(raw.decode('utf-8', errors='strict'))
          ko, en = parsed['ko_kr.json'], parsed['en_us.json']
          if set(ko) != set(en):
              raise SystemExit(f'localization mismatch: ko-only={sorted(set(ko)-set(en))}, en-only={sorted(set(en)-set(ko))}')
          required = (
              'hud.countrysidedays.shift_open',
              'hud.countrysidedays.shift_closed',
              'hud.countrysidedays.river_direction',
              'message.countrysidedays.starter_coins',
              'message.countrysidedays.resident_chat',
              'message.countrysidedays.adoption_success',
              'item.countrysidedays.cow_adoption_ticket',
              'item.countrysidedays.sheep_adoption_ticket',
              'item.countrysidedays.chicken_adoption_ticket',
          )
          for key in required:
              if not isinstance(ko.get(key), str) or not ko[key].strip():
                  raise SystemExit(f'missing Korean localization: {key}')
          for key, value in ko.items():
              if key.startswith('hud.countrysidedays.') and not re.search(r'[가-힣]', re.sub(r'§.', '', value)):
                  raise SystemExit(f'Korean HUD lacks Korean text: {key}={value!r}')
          print(f'Validated {len(ko)} matching UTF-8 localization keys.')
          PY

      - name: Validate alpha.14 gameplay contracts
        id: contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def read(path): return Path(path).read_text('utf-8')
          root = 'src/main/java/kr/countrysidedays/'
          mod = read(root + 'CountrysideDays.java')
          npc = read(root + 'gameplay/RuralNpcManager.java')
          village = read(root + 'gameplay/VillageLifeManager.java')
          worker = read(root + 'gameplay/EstateWorkerManager.java')
          ranch = read(root + 'gameplay/RanchLifeManager.java')
          seat = read(root + 'gameplay/CountrysideSeatManager.java')
          residents = read(root + 'gameplay/VillageResidentCatalog.java')
          gameplay = read(root + 'gameplay/RuralGameplayHandler.java')
          fishing = read(root + 'gameplay/CountrysideFishingManager.java')
          access = read(root + 'gameplay/SharedRestaurantAccess.java')
          data = read(root + 'world/CountrysideWorldData.java')
          estate = read(root + 'world/StarterHomesteadGenerator.java')
          public = read(root + 'world/PublicVillageExpansionBuilder.java')
          restaurant = read(root + 'world/SharedRestaurantBuilder.java')
          layout = read(root + 'world/PlayerEstateLayout.java')
          payload = read(root + 'network/EstateHudPayload.java')

          if '0.1.0-alpha.14' not in mod:
              raise SystemExit('alpha.14 version missing')
          if mod.index('VillageLifeManager::onEntityInteract') > mod.index('RuralNpcManager::handleInteraction'):
              raise SystemExit('worker hiring interaction must run before general resident dialogue')
          if 'if (event.isCanceled()) return;' not in npc:
              raise SystemExit('resident handler can consume an already handled interaction')

          for forbidden in ('CUSTOMER_NAMES', 'ensureSharedCustomers', 'spawnSpeciesIfMissing'):
              if forbidden in npc:
                  raise SystemExit(f'fixed customer/private animal legacy returned: {forbidden}')
          for required in ('ACTIVE_GUEST_TAG', 'maybeInviteResident', 'nextInt(6)', 'isActiveGuest'):
              if required not in npc:
                  raise SystemExit(f'rotating real-resident guest contract missing: {required}')
          if 'DAILY_CUSTOMER_CAP' in npc:
              raise SystemExit('guest arrivals still use the old daily cap')
          for required in ('recordGuestService', 'withGuestService'):
              if required not in access + data:
                  raise SystemExit(f'unlimited resident visit accounting missing: {required}')
          if 'RESTAURANT_SEAT_COUNT = 8' not in layout:
              raise SystemExit('restaurant seat capacity is not eight')

          for required in ('COW_ADOPTION_TICKET', 'SHEEP_ADOPTION_TICKET', 'CHICKEN_ADOPTION_TICKET'):
              if required not in ranch:
                  raise SystemExit(f'explicit ranch adoption missing: {required}')
          for required in ('purgeLegacyEstateAnimals', 'PRIVATE_LIVESTOCK_V14_TAG'):
              if required not in ranch:
                  raise SystemExit(f'legacy private animal migration missing: {required}')
          for required in ('HIRED_V14_TAG', '!villager.entityTags().contains(HIRED_V14_TAG)', 'villager.discard()'):
              if required not in worker:
                  raise SystemExit(f'legacy automatic worker migration missing: {required}')
          if 'ensureEstateWorker(' in village:
              raise SystemExit('free automatic worker spawning returned')

          for required in ('clearFormerBarn', 'estatePaths', 'clearPathDrops', 'safeWorldPathDot'):
              if required not in estate:
                  raise SystemExit(f'private estate cleanup/path contract missing: {required}')
          for required in ('PUBLIC_RESIDENT_TAG', 'household', 'shopCategory'):
              if required not in residents:
                  raise SystemExit(f'resident identity/household contract missing: {required}')
          if residents.count('new Profile(') < 20:
              raise SystemExit('resident roster is not large enough')
          for required in ('cottage(', 'workshop(', 'publicRiver(', 'clearLegacyHallLamp'):
              if required not in public:
                  raise SystemExit(f'public village rebuild contract missing: {required}')
          if 'resident_progress' in npc:
              raise SystemExit('Boksun still reports restaurant progress')

          for required in ('SEAT_TAG', 'startRiding', 'isSeatOccupied'):
              if required not in seat:
                  raise SystemExit(f'player sitting contract missing: {required}')
          if 'getOpposite()' not in seat:
              raise SystemExit('player seated facing is not derived toward the table')
          for required in ('customerSeatFacing(slot).getOpposite()', 'RESTAURANT_SEAT_COUNT'):
              if required not in restaurant:
                  raise SystemExit(f'chair/table orientation contract missing: {required}')

          for required in ('isPublicRiver', 'riverX', 'riverZ'):
              if required not in fishing + payload:
                  raise SystemExit(f'nearby river/HUD contract missing: {required}')
          if 'STARTER_COINS = 20' not in gameplay or 'new ItemStack(ModItems.VILLAGE_COIN.get(), STARTER_COINS)' not in gameplay:
              raise SystemExit('starter support money missing')
          if 'StreamCodec.composite(' in payload:
              raise SystemExit('oversized HUD payload still relies on an unsupported composite overload')
          if 'new StreamCodec<>()' not in payload:
              raise SystemExit('manual HUD payload codec missing')

          print('Alpha.14 guest, seating, starter, ranch, worker, village, river, path and household contracts passed.')
          PY

      - name: Clean build
        id: build
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ci-logs/clean-build.log

      - name: Run data generation
        id: datagen
        run: |
          set -o pipefail
          ./gradlew --no-daemon runData --stacktrace 2>&1 | tee ci-logs/datagen.log

      - name: Run required GameTests
        id: gametest
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew --no-daemon runGameTestServer --stacktrace 2>&1 | tee ci-logs/gametest.log

      - name: Reject runtime data errors
        id: dataload
        run: |
          if grep -n -E "Couldn't parse data file|Failed to parse recipe|Parsing error loading recipe|Failed to parse.*worldgen|biome_modifier" ci-logs/gametest.log ci-logs/datagen.log; then
            exit 1
          fi

      - name: Run explicit countryside flat server
        id: server
        timeout-minutes: 8
        run: |
          rm -rf run/world run/logs
          mkdir -p run ci-logs
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          level-name=world
          level-type=minecraft:flat
          generator-settings={"biome":"countrysidedays:rural_plains","features":true,"lakes":false,"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":8},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}
          generate-structures=true
          online-mode=false
          spawn-protection=0
          view-distance=10
          simulation-distance=8
          PROPERTIES
          setsid ./gradlew --no-daemon runServer --stacktrace > ci-logs/server.log 2>&1 &
          PID=$!
          READY=0
          for SECOND in $(seq 1 180); do
            if grep -q "Done (" ci-logs/server.log && grep -q "Countryside worldgen audit passed" ci-logs/server.log; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM -- "-$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          tail -n 300 ci-logs/server.log
          [ "$READY" -eq 1 ] || { echo 'Server did not reach audited ready state'; exit 1; }
          if grep -n -E "Failed to start the minecraft server|Exception in server tick loop|ModLoadingException|Countryside worldgen audit failed|No key layers in MapLike" ci-logs/server.log; then exit 1; fi

      - name: Run client boot smoke test
        id: client
        timeout-minutes: 6
        run: |
          rm -rf run/logs
          setsid env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --no-daemon runClient --stacktrace > ci-logs/client.log 2>&1 &
          PID=$!
          READY=0
          for SECOND in $(seq 1 150); do
            if grep -q "Backend library: LWJGL" ci-logs/client.log && grep -Eq "Sound engine started|Created:.*minecraft:textures/atlas" ci-logs/client.log; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM -- "-$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          tail -n 300 ci-logs/client.log
          [ "$READY" -eq 1 ] || { echo 'Client did not reach rendered readiness'; exit 1; }
          grep -q "Countryside Days 0.1.0-alpha.14 core content registered" ci-logs/client.log
          grep -q "Countryside Days compact navigation HUD registered" ci-logs/client.log
          if grep -n -E "Failed to create window|ModLoadingException|Caught previously unhandled exception|ReportedException|Missing item model for location countrysidedays:|Unable to load model.*countrysidedays:" ci-logs/client.log; then exit 1; fi

      - name: Verify executable JAR
        id: jarcheck
        run: |
          JAR='build/libs/countrysidedays-0.1.0-alpha.14.jar'
          python3 tools/verify_jar.py "$JAR" | tee ci-logs/jar-verification.log
          mkdir -p build/deliverables
          cp "$JAR" build/deliverables/

      - name: Upload executable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.14-jar
          path: projects/countryside-days/build/deliverables/countrysidedays-0.1.0-alpha.14.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.14-logs
          path: projects/countryside-days/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Record CI result
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          LOCALIZATION: ${{ steps.localization.outcome }}
          CONTRACTS: ${{ steps.contracts.outcome }}
          BUILD: ${{ steps.build.outcome }}
          DATAGEN: ${{ steps.datagen.outcome }}
          GAMETEST: ${{ steps.gametest.outcome }}
          DATALOAD: ${{ steps.dataload.outcome }}
          SERVER: ${{ steps.server.outcome }}
          CLIENT: ${{ steps.client.outcome }}
          JARCHECK: ${{ steps.jarcheck.outcome }}
        run: |
          cat > BUILD_AND_RUNTIME_REPORT.md <<REPORT
          # Countryside Days Build and Runtime Report

          - Workflow run: ${RUN_ID}
          - Source commit: ${SOURCE_SHA}
          - Mod version: 0.1.0-alpha.14
          - UTF-8 localization: ${LOCALIZATION}
          - Alpha.14 gameplay contracts: ${CONTRACTS}
          - Clean Java 25 build: ${BUILD}
          - Datagen: ${DATAGEN}
          - Required GameTests: ${GAMETEST}
          - Runtime data validation: ${DATALOAD}
          - Explicit countryside flat server: ${SERVER}
          - Virtual-display client: ${CLIENT}
          - Executable JAR inspection: ${JARCHECK}
          REPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize and record Countryside Days alpha.14 for ${SOURCE_SHA:0:7}"
          git pull --rebase origin main
          git push origin HEAD:main
