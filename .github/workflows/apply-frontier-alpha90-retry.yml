name: Retry Frontier Alpha90 Maintenance Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha90-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Reuse validated Alpha.90 patch payload
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, re, zlib
          from pathlib import Path
          workflow = Path('.github/workflows/apply-frontier-alpha90.yml').read_text(encoding='utf-8')
          match = re.search(r'PATCH_ZLIB_B64:\s*>-\s*\n\s+([^\n]+)', workflow)
          if not match:
              raise SystemExit('Alpha.90 patch payload not found')
          payload = zlib.decompress(base64.b64decode(match.group(1).strip()))
          target = Path('projects/frontier-settlement/tools/apply_alpha90_tmp.py')
          target.write_bytes(payload)
          compile(payload, str(target), 'exec')
          print('Alpha.90 patch payload recovered and syntax-checked')
          PY

      - name: Apply Alpha.90 patch
        shell: bash
        run: |
          python3 projects/frontier-settlement/tools/apply_alpha90_tmp.py
          rm projects/frontier-settlement/tools/apply_alpha90_tmp.py

      - name: Cumulative source audit
        run: python3 projects/frontier-settlement/tools/test_alpha90_source.py

      - name: Canonical docs audit
        run: python3 projects/frontier-settlement/tools/test_alpha90_docs.py

      - name: Java 25 clean build
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain

      - name: Runtime JAR verify
        working-directory: projects/frontier-settlement
        run: |
          test -f build/libs/frontier_settlement-0.1.0-alpha.90.jar
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.90.jar

      - name: Diff sanity
        run: git diff --check

      - name: Commit verified Alpha.90
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/frontier-settlement
          git commit -m 'Fix Frontier alpha.90 worker and construction recovery'
          git pull --rebase origin main
          git push origin HEAD:main
