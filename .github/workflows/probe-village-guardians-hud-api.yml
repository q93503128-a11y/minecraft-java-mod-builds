name: Probe Village Guardians HUD API

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.probe-hud-api'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Probe mapped GUI APIs
        working-directory: projects/village-guardians
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/cp.gradle" <<'EOF'
          allprojects {
            afterEvaluate { p ->
              if (p.plugins.hasPlugin('java')) {
                p.tasks.register('printCompileJavaClasspath') {
                  dependsOn p.tasks.named('createMinecraftArtifacts')
                  doLast { println p.tasks.named('compileJava').get().classpath.asPath }
                }
              }
            }
          }
          EOF
          CP="$(gradle --no-daemon --no-configuration-cache -q -I "$RUNNER_TEMP/cp.gradle" printCompileJavaClasspath | tail -n 1)"
          OUT="$GITHUB_WORKSPACE/ci-results/village-guardians-hud-api"
          rm -rf "$OUT" && mkdir -p "$OUT"
          : > "$OUT/relevant-classes.txt"
          IFS=':' read -ra JARS <<< "$CP"
          for jar in "${JARS[@]}"; do
            if [ -f "$jar" ]; then
              jar tf "$jar" | grep -E 'RegisterGuiLayersEvent|RenderGuiLayerEvent|GuiLayer|VanillaGuiLayers|GuiGraphicsExtractor|GuiRenderState|GuiTextRenderState' >> "$OUT/relevant-classes.txt" || true
            fi
          done
          sort -u "$OUT/relevant-classes.txt" -o "$OUT/relevant-classes.txt"
          javap -classpath "$CP" -p net.neoforged.neoforge.client.event.RegisterGuiLayersEvent > "$OUT/register-gui-layers.txt" 2>&1 || true
          javap -classpath "$CP" -p net.neoforged.neoforge.client.event.RenderGuiLayerEvent net.neoforged.neoforge.client.event.RenderGuiLayerEvent\$Pre net.neoforged.neoforge.client.event.RenderGuiLayerEvent\$Post > "$OUT/render-gui-layer.txt" 2>&1 || true
          javap -classpath "$CP" -p net.neoforged.neoforge.client.gui.GuiLayer net.neoforged.neoforge.client.gui.VanillaGuiLayers > "$OUT/gui-layer.txt" 2>&1 || true
          javap -classpath "$CP" -p net.minecraft.client.gui.GuiGraphicsExtractor net.neoforged.neoforge.client.extensions.GuiGraphicsExtractorExtension > "$OUT/gui-extractor.txt" 2>&1 || true
          javap -classpath "$CP" -p net.minecraft.client.gui.render.state.GuiRenderState net.minecraft.client.gui.render.state.GuiTextRenderState > "$OUT/gui-render-state.txt" 2>&1 || true
          javap -classpath "$CP" -p net.minecraft.client.gui.Font net.minecraft.client.Minecraft net.minecraft.client.Window > "$OUT/font-client.txt" 2>&1 || true
      - name: Commit probe output
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/village-guardians-hud-api
          git commit -m 'Record expanded Village Guardians HUD API probe' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
