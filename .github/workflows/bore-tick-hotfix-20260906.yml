name: Bore tick latency hotfix

on:
  push:
    paths:
      - 'tools/apply_bore_tick_hotfix_tmp.py'
      - '.github/workflows/bore-tick-hotfix-20260906.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Rebase onto latest main
        run: |
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git pull --rebase origin main

      - name: Apply adaptive bore and Frontier event patch
        run: python tools/apply_bore_tick_hotfix_tmp.py

      - name: Verify source contracts
        run: |
          python projects/survival-ascension/tools/test_current_source.py
          python projects/frontier-settlement/tools/test_current_source.py
          python - <<'PY'
          from pathlib import Path
          bore = Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/mining/BoreMiningService.java').read_text()
          auto = Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/progress/AutomatedToolBreak.java').read_text()
          assert 'GLOBAL_SOFT_TIME_BUDGET_NANOS = 6_000_000L' in bore
          assert 'LOCAL_SOFT_TIME_BUDGET_NANOS = 4_000_000L' in bore
          assert 'LOCAL_HARD_BLOCK_CAP_PER_TICK = 12' in bore
          assert 'gameMode.destroyBlock(target)' in auto
          assert 'setChunkForced' not in bore and 'addRegionTicket' not in bore
          print('BORE PERFORMANCE CONTRACT PASS')
          PY

      - name: Clean build Survival Ascension with Java 25
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon clean build

      - name: Clean build Frontier Settlement with Java 25
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build

      - name: Verify runtime JARs
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          checks = [
              (Path('projects/survival-ascension/build/libs'), 'survivalascension', '0.61.17-alpha.1'),
              (Path('projects/frontier-settlement/build/libs'), 'frontier_settlement', '0.1.0-alpha.113'),
          ]
          for root, marker, version in checks:
              jars = [p for p in root.glob('*.jar') if '-sources' not in p.name and '-javadoc' not in p.name]
              assert jars, f'no runtime jar in {root}'
              jar = max(jars, key=lambda p: p.stat().st_size)
              assert jar.stat().st_size > 100_000, jar
              with zipfile.ZipFile(jar) as z:
                  names = set(z.namelist())
                  assert 'META-INF/neoforge.mods.toml' in names
                  classes = [n for n in names if n.endswith('.class')]
                  assert classes, jar
              print(jar, jar.stat().st_size, version)
          PY

      - name: Commit canonical changes and retire temporary mutators
        run: |
          rm tools/apply_bore_tick_hotfix_tmp.py
          rm .github/workflows/bore-tick-hotfix-20260906.yml
          git add -A
          git commit -m "Optimize bulk tunnel server tick latency"

      - name: Rebase and reverify exact push candidate
        run: |
          git pull --rebase origin main
          python projects/survival-ascension/tools/test_current_source.py
          python projects/frontier-settlement/tools/test_current_source.py
          (cd projects/survival-ascension && ./gradlew --no-daemon clean build)
          (cd projects/frontier-settlement && ./gradlew --no-daemon clean build)

      - name: Push verified main
        run: git push origin HEAD:main

      - name: Stage test JARs
        run: |
          mkdir -p artifact
          cp projects/survival-ascension/build/libs/survivalascension-0.61.17-alpha.1.jar artifact/
          cp projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.113.jar artifact/
          cp projects/survival-ascension/TUNNEL_PERFORMANCE.md artifact/

      - name: Upload test JARs and performance notes
        uses: actions/upload-artifact@v4
        with:
          name: bore-tick-hotfix-sa06117-frontier-alpha113-tested
          path: artifact/
          if-no-files-found: error
