name: Fix Living Kingdoms ground plan compile typo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-living-kingdoms-ground-plan-typo.yml'
  workflow_dispatch:

permissions:
  contents: write

# Retriggered after canonical validation exposed the source typo still present on main.
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Correct type name
        shell: bash
        run: |
          set -euo pipefail
          file='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanGroundOnlyFunctionalPlanCatalog.java'
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanGroundOnlyFunctionalPlanCatalog.java')
          s=p.read_text(encoding='utf-8')
          old='ExternalUrbanFabricBuilder.UranFragmentSnapshot'
          new='ExternalUrbanFabricBuilder.UrbanFragmentSnapshot'
          if s.count(old)!=1:
              raise SystemExit(f'expected one typo, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git diff --check
          ! grep -Fq 'UranFragmentSnapshot' "$file"
      - name: Java 25 clean compile
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanGroundOnlyFunctionalPlanCatalog.java
          git rm .github/workflows/fix-living-kingdoms-ground-plan-typo.yml
          git commit -m 'fix(living-kingdoms): correct ground-only plan source type'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
