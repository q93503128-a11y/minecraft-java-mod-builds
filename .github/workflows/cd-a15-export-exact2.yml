name: Build Countryside Days alpha.15 exact v2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-export-exact2.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Restore exact source
        id: restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          r=Path('.').resolve();t=r/'projects/countryside-days/tools';a=[]
          specs=[('alpha15v2_00.part',8000,'05764a738c93db7933e60f6db85fea2d6cf168297536e79146ef28dc1eb96349'),('alpha15v2_01.part',8000,'f62307daf23ace1c04c1c4b09fdf75e3ba2a24018c550a90558753f00fc6f8b6'),('alpha15v2_02.part',8000,'647cf040b1669045f8e57f2a0eb67968e81c1753621095be6d3f4be046e00beb'),('alpha15exact_03.part',8000,'785f1b3d3b25d4482cbac7a7e11eb98436b76882d22935ce0071cfcb369dbcaf'),('alpha15exact_04.part',8000,'aa843460fb86c04dfff90515fae28237f213dce4dc43fcf6ceb7a5c7480e5a44'),('alpha15v2_05_06.part',16000,'ba4d245f3e29c0710e903a25c7fc2ada8cd306675bf373b8e001c22d88f931e9'),('alpha15v2_07_08.part',16000,'17528aa349b2a47a0192ddf71506d270487439261742b3212e8b3407e6846c3d'),('alpha15v2_09_10.part',16000,'a975b3c098d730d4077d8729118537ebd9c7f96aebd4455c8cb1f8dc1ed270c2'),('alpha15exact_11.part',8000,'8991340273b26d6601fc54df80adfb83e54b88d58a93bc02b017a3f0d104d5a1'),('alpha15exact_12.part',8000,'bf10be8d174e92ff42def406331ae70837c1a6f85901bdd4a1a6386f0d386bc1'),('alpha15v2_13_14.part',16000,'a1dd5c64d5d0524d691a228af3d07c35195a1ec76046947d647d9f080b256f05'),('alpha15v2_15_16.part',16000,'0b84bdbbb7d5a93b360911a75c608961515cea999960e8027746ef296619418f'),('alpha15v2_17_18.part',9648,'870c0a5b8faed07c9597402175e58b7659ed41ead761cb3a82f45f9bab6477d6')]
          for n,l,h in specs:
            s=''.join((t/n).read_text().split());x=hashlib.sha256(s.encode()).hexdigest()
            if len(s)!=l or x!=h:raise SystemExit(f'bad {n} {len(s)} {x}')
            a.append(s)
          s=''.join(a);b=base64.b64decode(s,validate=True)
          if len(s)!=145648 or hashlib.sha256(s.encode()).hexdigest()!='2215f32a4fda34d490241a811051e9164eb39a4f31831894e9ce3df3361ec4ca' or hashlib.sha256(b).hexdigest()!='5499bb9fe956c9bf11a6f311105e03bcc694bc2adeed74080431cd882d80b835':raise SystemExit('payload mismatch')
          with zipfile.ZipFile(io.BytesIO(b)) as z:z.extractall(r)
          PY
      - name: Apply compatible fixes
        id: patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip,struct
          root=Path('projects/countryside-days')
          old='        for (ItemEntity item : new ArrayList<>(level.getEntities().getAll().stream()\n                .filter(ItemEntity.class::isInstance)\n                .map(ItemEntity.class::cast)\n                .toList())) {\n'
          for rel,lo,hi in [('src/main/java/kr/countrysidedays/world/StarterHomesteadGenerator.java','origin.offset(PlayerEstateLayout.MIN_X - 4, -2, PlayerEstateLayout.MIN_Z - 4)','origin.offset(PlayerEstateLayout.MAX_X + 5, 12, PlayerEstateLayout.MAX_Z + 5)'),('src/main/java/kr/countrysidedays/world/PublicVillageExpansionBuilder.java','origin.offset(-MAP_HALF_WIDTH - 4, -2, -MAP_HALF_DEPTH - 4)','origin.offset(MAP_HALF_WIDTH + 5, 14, MAP_HALF_DEPTH + 5)')]:
            p=root/rel;s=p.read_text()
            if 'import net.minecraft.world.phys.AABB;' not in s:
              q=s.splitlines(True);i=max(i for i,x in enumerate(q) if x.startswith('import net.minecraft.world.level.block.state'));q.insert(i+1,'import net.minecraft.world.phys.AABB;\n');s=''.join(q)
            new=f'        AABB bounds = new AABB(\n                {lo},\n                {hi}\n        );\n        for (ItemEntity item : new ArrayList<>(level.getEntitiesOfClass(ItemEntity.class, bounds))) {{\n'
            if old in s:s=s.replace(old,new)
            p.write_text(s)
          p=root/'src/main/resources/data/countrysidedays/worldgen/biome/rural_plains.json';p.write_text(p.read_text().replace('minecraft:trees_birch_and_oak_leaf_litter','minecraft:trees_birch_and_oak'))
          def u(v):b=v.encode();return struct.pack('>H',len(b))+b
          def t(k,n,x):return bytes([k])+u(n)+x
          def l(k,x):return bytes([k])+struct.pack('>i',len(x))+b''.join(x)
          def c(x):return b''.join(x)+b'\0'
          pal=c([t(8,'Name',u('minecraft:air'))]);raw=bytes([10])+u('')+c([t(3,'DataVersion',struct.pack('>i',0)),t(9,'size',l(3,[struct.pack('>i',1)]*3)),t(9,'palette',l(10,[pal])),t(9,'blocks',l(10,[])),t(9,'entities',l(10,[]))])
          out=root/'src/main/resources/data/countrysidedays/structure';out.mkdir(parents=True,exist_ok=True)
          for n in ['homestead_layout.nbt','world_data_round_trip.nbt']:
            with (out/n).open('wb') as f:
              with gzip.GzipFile(filename='',mode='wb',fileobj=f,mtime=0) as g:g.write(raw)
          PY
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.2.1'}
      - name: Compile
        id: compile
        working-directory: projects/countryside-days
        run: |
          if [ ! -x gradlew ];then gradle wrapper --gradle-version 9.2.1 --distribution-type bin;chmod +x gradlew;fi
          ./gradlew --no-daemon clean build --stacktrace 2>&1|tee /tmp/build.log
          J=build/libs/countrysidedays-0.1.0-alpha.15.jar;test -s "$J";python3 tools/verify_jar.py "$J";unzip -t "$J"
      - name: Export
        id: export
        run: |
          J=projects/countryside-days/build/libs/countrysidedays-0.1.0-alpha.15.jar;D=release-transfer/countryside-days-alpha15;rm -rf "$D";mkdir -p "$D";base64 -w0 "$J">/tmp/j.b64;split -b 40000 -d -a 2 /tmp/j.b64 "$D/part-";printf 'filename=countrysidedays-0.1.0-alpha.15.jar\nsize=%s\nsha256=%s\nbase64_size=%s\nparts=%s\nrun=%s\n' "$(stat -c%s "$J")" "$(sha256sum "$J"|cut -d' ' -f1)" "$(stat -c%s /tmp/j.b64)" "$(find "$D" -name 'part-*'|wc -l)" "$GITHUB_RUN_ID">"$D/MANIFEST.txt";git restore --source=HEAD --staged --worktree projects/countryside-days;git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add "$D";git commit -m 'Publish verified Countryside Days alpha.15 JAR transfer v2';git pull --rebase origin main;git push origin HEAD:main
      - name: Status
        if: always()
        env: {R: '${{ steps.restore.outcome }}', P: '${{ steps.patch.outcome }}', C: '${{ steps.compile.outcome }}', E: '${{ steps.export.outcome }}'}
        run: |
          git restore --source=HEAD --staged --worktree projects/countryside-days||true;D=release-transfer/countryside-days-alpha15-status;mkdir -p "$D";F="$D/v2-${GITHUB_RUN_ID}.txt";printf 'run=%s\nrestore=%s\npatch=%s\ncompile=%s\nexport=%s\n' "$GITHUB_RUN_ID" "$R" "$P" "$C" "$E">"$F";[ ! -f /tmp/build.log ]||{ echo ---build-tail--- >>"$F";tail -n 100 /tmp/build.log>>"$F";};git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com;git add "$F";git commit -m "Record Countryside Days alpha.15 exact v2 ${GITHUB_RUN_ID}";git pull --rebase origin main;git push origin HEAD:main
