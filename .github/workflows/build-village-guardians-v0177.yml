name: Build Village Guardians v0.17.7 Systems Expansion

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger-v0177'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: village-guardians-v0177-main
  cancel-in-progress: false

env:
  PROJECT_DIR: projects/village-guardians
  EXPECTED_JAR: villageguardians-0.17.7-alpha.1.jar
  PUBLISHED_DIR: published/village-guardians
  RESULT_DIR: ci-results/village-guardians-v0177

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply v0.17.7 source patch
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          cat tools/v0177_seg_* > "$RUNNER_TEMP/v0177-patch.b64"
          echo 'a9b067fc5e530530053f6aab1d598b4d903159130b03541cc8f3a9856d694589  '"$RUNNER_TEMP/v0177-patch.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/v0177-patch.b64" | gzip --decompress > tools/apply_v0177.py
          echo '52556c663d5e38b3ffa01e99d021a12b478d01178eb29931111c58c82a588286  tools/apply_v0177.py' | sha256sum -c -
          python3 -m py_compile tools/apply_v0177.py
          python3 tools/apply_v0177.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/test_progression_depth.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "assert common.count('(\"power_') == 7": "assert common.count('(\"power_') == 8",
              "assert common.count('(\"guard_') == 7": "assert common.count('(\"guard_') == 8",
              "assert common.count('(\"support_') == 7": "assert common.count('(\"support_') == 8",
              "assert common.count('(\"ranged_') == 7": "assert common.count('(\"ranged_') == 8",
              'assert "(level - 1) / 2" in common': 'assert "Math.max(0, level - 1)" in common\n    assert common.count(\'(\"mobility_\') == 8\n    assert "pointCost()" in common',
              'assert "Integer.SIZE - 1" in common_data': 'assert "Codec.LONG" in common_data and "Long.SIZE - 1" in common_data',
              'print("[PASS] Common tactical tree has 28 nodes with functional capstones")': 'print("[PASS] Common tactical tree has 40 nodes, five branches and tier-scaled point costs")',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f tools/apply_v0177.py tools/v0177_seg_*

      - name: Run complete contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/test_rpg_balance.py
            python3 tools/test_village_zone.py
            python3 tools/test_progression_loop.py
            python3 tools/test_progression_depth.py
            python3 tools/test_fortress_layout.py
            python3 tools/test_runtime_safety.py
            python3 tools/test_action_layout.py
            python3 tools/test_enemy_content.py
            python3 tools/test_v0174_ui_safety.py
            python3 tools/test_v0175_gameplay_ui.py
            python3 tools/test_v0176_gameplay.py
            python3 tools/test_v0177_gameplay.py
          } 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0177-contracts.log"

      - name: Build Java 25 JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0177-gradle.log"

      - name: Verify artifact
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          mkdir -p "$GITHUB_WORKSPACE/deliverables-v0177"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables-v0177/"
          cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables-v0177/"
          cp "$GITHUB_WORKSPACE/village-guardians-v0177-contracts.log" "$GITHUB_WORKSPACE/deliverables-v0177/"
          cp "$GITHUB_WORKSPACE/village-guardians-v0177-gradle.log" "$GITHUB_WORKSPACE/deliverables-v0177/"

      - uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.17.7-alpha.1
          path: deliverables-v0177/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified source and JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$PUBLISHED_DIR"
          cp "deliverables-v0177/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
          cp "deliverables-v0177/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$PROJECT_DIR/src" "$PROJECT_DIR/tools" "$PROJECT_DIR/gradle.properties" \
                     "$PUBLISHED_DIR/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Village Guardians v0.17.7 progression, retry and testing systems'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Record result
        if: always()
        shell: bash
        run: |
          set +e
          FINAL_STATUS='${{ job.status }}'
          TEMP_DIR="$RUNNER_TEMP/village-guardians-v0177-result"
          rm -rf "$TEMP_DIR" && mkdir -p "$TEMP_DIR"
          cp "$GITHUB_WORKSPACE/village-guardians-v0177-contracts.log" "$TEMP_DIR/latest-contracts.log" 2>/dev/null || printf '%s\n' 'Contracts did not finish.' > "$TEMP_DIR/latest-contracts.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v0177-gradle.log" "$TEMP_DIR/latest-gradle.log" 2>/dev/null || printf '%s\n' 'Gradle did not finish.' > "$TEMP_DIR/latest-gradle.log"
          cat > "$TEMP_DIR/status.txt" <<EOF
          status=$FINAL_STATUS
          trigger_sha=$GITHUB_SHA
          published_commit=$(git rev-parse HEAD 2>/dev/null)
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=0.17.7-alpha.1
          EOF
          git reset --hard HEAD
          git clean -fd
          mkdir -p "$RESULT_DIR"
          cp "$TEMP_DIR"/* "$RESULT_DIR/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record Village Guardians v0.17.7 result for ${GITHUB_SHA::7}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi