name: Diagnose Living Kingdoms authored new floors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lk-authored-new-floor-diagnostic.yml'

permissions:
  contents: read

env:
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Stop at first authored-floor blocker
        working-directory: projects/living-kingdoms
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-authored-new-floor-diag
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-authored-new-floor-diag\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/authored-new-floor-diag-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          found=0
          for attempt in $(seq 1 180); do
            if grep -Eq 'LK_ERDEN_AUTHORED_NEW_FLOOR_(WAIT|STAGE|PASS)' ../../logs/authored-new-floor-diag-server.log; then
              found=1
              break
            fi
            if grep -Eq 'LK_REALM_DIAGNOSTIC_FAIL|Exception loading level|Unable to complete Erden' ../../logs/authored-new-floor-diag-server.log; then
              found=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          echo '=== BLOCKER SUMMARY ==='
          grep -E 'Retained Erden authored-new-floor CI sample|LK_ERDEN_AUTHORED_NEW_FLOOR_(WAIT|STAGE|PASS)|LK_ERDEN_NEW_FLOOR_APPROVAL_PASS|Prepared Erden authored new floors|Prepared Erden upper-floor conversions|LK_REALM_DIAGNOSTIC_FAIL|Exception|ERROR|Unable to complete Erden' ../../logs/authored-new-floor-diag-server.log | tail -200 || true
          test "$found" -eq 1
      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-authored-new-floor-diagnostic-${{ github.run_number }}
          path: logs/authored-new-floor-diag-server.log
          retention-days: 7
