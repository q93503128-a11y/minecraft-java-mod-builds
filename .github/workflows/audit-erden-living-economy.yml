name: Audit Erden Living Economy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java'
      - 'projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java'
      - 'projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenLivingEconomyManager.java'
      - 'projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenLivingEconomySavedData.java'
      - 'projects/living-kingdoms/ci/trigger-living-economy-full-audit.txt'
      - '.github/workflows/audit-erden-living-economy.yml'

concurrency:
  group: erden-living-economy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'

jobs:
  audit:
    name: Household shopping and shop schedule audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile Living Kingdoms
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs
          gradle --no-daemon compileJava --stacktrace --console=plain \
            2>&1 | tee ../../logs/erden-living-economy-compile.log

      - name: Run fresh-world living economy audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-living-economy-audit-world
          mkdir -p run
          printf 'level-name=livingkingdoms-living-economy-audit-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/erden-living-economy-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 900); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/erden-living-economy-server.log; then
              cat ../../logs/erden-living-economy-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_LIVING_ECONOMY_PASS' ../../logs/erden-living-economy-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/erden-living-economy-server.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/erden-living-economy-server.log
          test "$passed" -eq 1
          grep -F 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/erden-living-economy-server.log
          grep -F 'purchase_outcomes=77' ../../logs/erden-living-economy-server.log
          grep -F 'purchase_failures=' ../../logs/erden-living-economy-server.log
          grep -F 'LK_ERDEN_LIVING_ECONOMY_PASS revision=1 households=77 shops=50' ../../logs/erden-living-economy-server.log
          grep -F 'purchase_successes=' ../../logs/erden-living-economy-server.log
          grep -F 'schedules=true' ../../logs/erden-living-economy-server.log
          grep -F 'holidays=7' ../../logs/erden-living-economy-server.log
          grep -F 'dynamic_prices=true' ../../logs/erden-living-economy-server.log
          grep -F 'stockouts_persist=true' ../../logs/erden-living-economy-server.log
          grep -F 'shopping_routines=true' ../../logs/erden-living-economy-server.log
          grep -F 'success_path=true' ../../logs/erden-living-economy-server.log
          grep -F 'closed_path=true' ../../logs/erden-living-economy-server.log
          grep -F 'stockout_path=true' ../../logs/erden-living-economy-server.log
          grep -F 'unaffordable_path=true' ../../logs/erden-living-economy-server.log
          if grep -Eqi 'Invalid Erden physical economy|living economy.*failed|Exception loading level|watchdog' ../../logs/erden-living-economy-server.log; then
            exit 1
          fi

      - name: Upload audit logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erden-living-economy-audit-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Publish audit pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ID: ${{ steps.upload_logs.outputs.artifact-id }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-pointers
          printf '{\n  "run_id": "%s",\n  "run_number": "%s",\n  "commit_sha": "%s",\n  "job_status": "%s",\n  "log_artifact_id": "%s"\n}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$JOB_STATUS" "$LOG_ID" \
            > .github/build-pointers/erden-living-economy.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/erden-living-economy.json
          git commit -m "Record Erden living economy audit $GITHUB_RUN_NUMBER" || exit 0
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
