name: Frontier Alpha.118 Target Cache Finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-outpost-target-cache-patch.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Promote cached-target hardening to Alpha.118
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('projects/frontier-settlement')

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          props = root / 'gradle.properties'
          replace_once(props, 'mod_version=0.1.0-alpha.117', 'mod_version=0.1.0-alpha.118', 'gradle version')
          p = props.read_text(encoding='utf-8')
          note = ('\n# Alpha.118 specialized-outpost target caching: lumber/quarry workers reuse a still-valid physical work target, '
                  'back off empty full-area rescans to five seconds, and invalidate immediately on world/protection changes without changing work radius or physical production authority.\n')
          if 'Alpha.118 specialized-outpost target caching' not in p:
              props.write_text(p.rstrip() + note, encoding='utf-8')

          audit = root / 'tools/test_current_source.py'
          replace_once(audit,
                       'require("mod_version=0.1.0-alpha.117" in gradle, "current verifier/version drift")',
                       'require("mod_version=0.1.0-alpha.118" in gradle, "current verifier/version drift")',
                       'source audit version')

          readme = root / 'README.md'
          replace_once(readme, '## Current version: 0.1.0-alpha.117', '## Current version: 0.1.0-alpha.118', 'README version')
          r = readme.read_text(encoding='utf-8')
          anchor = '## Functional building families\n'
          section = '''## Alpha.118 specialized outpost scan budget\n\nAlpha.118 reduces repeated physical-world search cost without reducing authored work range or production throughput:\n\n- lumber and quarry outposts cache the selected physical block coordinate while it remains a valid loaded target;\n- ordinary 10-tick worker updates validate that one cached coordinate instead of rescanning the full work radius;\n- a destroyed, replaced, protected or unloaded target invalidates immediately and may be reacquired on the next work update;\n- a full search that finds no eligible resource backs off for 100 ticks (five seconds) rather than repeating every half-second;\n- natural-leaf evidence for a cached lumber target is reconfirmed only when the 100-tick harvest cadence is actually due;\n- quarry overburden may continue to clear layer-by-layer against the same cached stone face;\n- tree radius 18, quarry radius 16, work periods, harvest batch limits, real ItemStack cargo, protection checks and no-force-load rules are unchanged.\n\n'''
          if '## Alpha.118 specialized outpost scan budget' not in r:
              if r.count(anchor) != 1:
                  raise SystemExit(f'README section anchor drift: {r.count(anchor)}')
              readme.write_text(r.replace(anchor, section + anchor, 1), encoding='utf-8')

          lock = root / 'COMPANION_LOCK.json'
          data = json.loads(lock.read_text(encoding='utf-8'))
          if data.get('target', {}).get('frontier_settlement') != '0.1.0-alpha.117':
              raise SystemExit('canonical companion lock target drift')
          data['target']['frontier_settlement'] = '0.1.0-alpha.118'
          notes = []
          for note_text in data.get('notes', []):
              note_text = note_text.replace('Alpha.117', 'Alpha.118')
              if 'Alpha.118 changes Frontier-owned UI/runtime behavior only' in note_text:
                  note_text = ('Alpha.118 adds physical lumber/quarry target caching and five-second empty-scan backoff on top of the '
                               'Alpha.117 UI/runtime hardening; companion binary pins remain unchanged.')
              notes.append(note_text)
          data['notes'] = notes
          lock.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for name in ('resolved-lock.client.json', 'resolved-lock.server.json'):
              path = root / 'companion-testpack' / name
              resolved = json.loads(path.read_text(encoding='utf-8'))
              if resolved.get('target', {}).get('frontier_settlement') != '0.1.0-alpha.117':
                  raise SystemExit(f'{name}: resolved target drift')
              resolved['target']['frontier_settlement'] = '0.1.0-alpha.118'
              path.write_text(json.dumps(resolved, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 projects/frontier-settlement/tools/test_current_source.py
          python3 projects/frontier-settlement/tools/test_current_docs.py
          python3 projects/frontier-settlement/tools/test_companion_testpack.py
          (cd projects/frontier-settlement && chmod +x gradlew && ./gradlew --no-daemon --no-configuration-cache clean build --console=plain)
          python3 projects/frontier-settlement/tools/verify_jar.py projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.118.jar
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement/gradle.properties \
                  projects/frontier-settlement/README.md \
                  projects/frontier-settlement/tools/test_current_source.py \
                  projects/frontier-settlement/COMPANION_LOCK.json \
                  projects/frontier-settlement/companion-testpack/resolved-lock.client.json \
                  projects/frontier-settlement/companion-testpack/resolved-lock.server.json
          git commit -m 'frontier: release 0.1.0-alpha.118 target-cache hardening'
          git pull --rebase origin main
          git push origin HEAD:main
