name: Manual Frontier Alpha93 Ground Builder Fix

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/manual-frontier-alpha93-ground-builder-fix.yml'

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply ground-builder and safe-spawn fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          gp = root/'projects/frontier-settlement/gradle.properties'
          g = gp.read_text(encoding='utf-8')
          if 'mod_version=0.1.0-alpha.92' not in g:
              raise SystemExit('unexpected Frontier version')
          g = g.replace('mod_version=0.1.0-alpha.92', 'mod_version=0.1.0-alpha.93', 1)
          g += '\n# Alpha.93 builder recovery: all building heights are constructed from safe ground-perimeter work cells; legacy stair scaffolds retire safely and builder spawn/home positions are surface-safe.\n'
          gp.write_text(g, encoding='utf-8')

          p = root/'projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java'
          s = p.read_text(encoding='utf-8')

          s = s.replace('private static final double WORK_POSITION_REACHED_SQR = 110.25D;',
                        'private static final double WORK_POSITION_REACHED_SQR = 9.0D;', 1)

          old = '''        if (!hasFreshScaffoldCoverage(level, type, site.origin(), rotation)) {\n            return invalidPlacement("고층 시공용 작업 발판을 확보할 공간이 부족합니다. 건물 바깥 3~4블록의 나무·바위·기존 구조물을 비우거나 위치를 옮겨 주세요.");\n        }\n'''
          if old not in s:
              raise SystemExit('missing scaffold placement gate')
          s = s.replace(old, '', 1)

          old = '''        Container crate = ensureSupplyCrate(level, supply);\n        if (crate == null) return false;\n        ensureConstructionScaffolds(level, data, type, supply);\n        if (!stageRemainingMaterials(server, data, type, plan.size(), builder, crate, supply)) return false;'''
          new = '''        Container crate = ensureSupplyCrate(level, supply);\n        if (crate == null) return false;\n        retireLegacyConstructionScaffolds(level, data, type, builder, supply);\n        if (!stageRemainingMaterials(server, data, type, plan.size(), builder, crate, supply)) return false;'''
          if old not in s:
              raise SystemExit('missing scaffold runtime call')
          s = s.replace(old, new, 1)

          old = '''            // Completion itself never depends on scaffold cleanup. But if an already-paid blueprint\n            // block has drifted/missing at height, the repair pass needs the same physical scaffold\n            // authority as ordinary construction. Rebuild only in that exceptional repair path.\n            if (placement.pos().getY() - data.construction().originY() > 3) {\n                ensureConstructionScaffolds(level, data, type, supply);\n            }\n'''
          new = '''            // Already-paid blueprint drift uses the same safe ground-perimeter authority as ordinary construction.\n            // High repairs never recreate the retired stair scaffold system.\n'''
          if old not in s:
              raise SystemExit('missing high repair scaffold block')
          s = s.replace(old, new, 1)

          start = s.index('    private static boolean moveBuilderToWorkPosition(')
          end = s.index('    private static Path createReachablePath(', start)
          replacement = '''    private static boolean moveBuilderToWorkPosition(ServerLevel level, ConstructionState construction, BuildingType type,\n                                                     BuildingBlueprints.Placement placement, FrontierWorkerEntity builder, BlockPos supply) {\n        // Construction height is presentation only: the worker stays on safe ground around the footprint.\n        // This avoids fragile stair/scaffold navigation while still requiring the physical worker to reach the site.\n        for (BlockPos work : workPositionsFor(level, construction, type, placement, builder, supply)) {\n            double workDistance = builder.distanceToSqr(work.getX() + 0.5D, work.getY(), work.getZ() + 0.5D);\n            if (workDistance <= WORK_POSITION_REACHED_SQR) {\n                builder.getNavigation().stop();\n                return true;\n            }\n            if (moveToReachable(builder, work, 1.05D)) return false;\n        }\n        builder.getNavigation().stop();\n        return false;\n    }\n\n    private static List<BlockPos> workPositionsFor(ServerLevel level, ConstructionState construction, BuildingType type,\n                                                   BuildingBlueprints.Placement placement, FrontierWorkerEntity builder, BlockPos supply) {\n        BlockPos target = placement.pos();\n        BuildingRotation rotation = construction.buildingRotation();\n        int width = rotation.rotatedWidth(type);\n        int depth = rotation.rotatedDepth(type);\n        int minX = construction.originX() - 1;\n        int maxX = construction.originX() + width;\n        int minZ = construction.originZ() - 1;\n        int maxZ = construction.originZ() + depth;\n        int alignedX = Math.max(construction.originX(), Math.min(construction.originX() + width - 1, target.getX()));\n        int alignedZ = Math.max(construction.originZ(), Math.min(construction.originZ() + depth - 1, target.getZ()));\n\n        Set<BlockPos> unique = new HashSet<>();\n        addGroundWorkCandidate(level, unique, minX, alignedZ);\n        addGroundWorkCandidate(level, unique, maxX, alignedZ);\n        addGroundWorkCandidate(level, unique, alignedX, minZ);\n        addGroundWorkCandidate(level, unique, alignedX, maxZ);\n\n        // Fallback across the complete one-block grading ring. A tree, crate, doorway, or already-built wall\n        // on one side must not make a tall blueprint step depend on climbing a temporary staircase.\n        for (int x = minX; x <= maxX; x++) {\n            addGroundWorkCandidate(level, unique, x, minZ);\n            addGroundWorkCandidate(level, unique, x, maxZ);\n        }\n        for (int z = minZ + 1; z < maxZ; z++) {\n            addGroundWorkCandidate(level, unique, minX, z);\n            addGroundWorkCandidate(level, unique, maxX, z);\n        }\n\n        List<BlockPos> result = new ArrayList<>(unique);\n        result.sort(Comparator.comparingDouble(pos -> {\n            double tx = (double) pos.getX() - target.getX();\n            double tz = (double) pos.getZ() - target.getZ();\n            double targetHorizontal = tx * tx + tz * tz;\n            return targetHorizontal * 4.0D + builder.distanceToSqr(\n                    pos.getX() + 0.5D, pos.getY(), pos.getZ() + 0.5D);\n        }));\n        return List.copyOf(result);\n    }\n\n    private static void addGroundWorkCandidate(ServerLevel level, Set<BlockPos> result, int x, int z) {\n        BlockPos candidate = safeSurfaceCell(level, x, z);\n        if (candidate != null) result.add(candidate);\n    }\n\n    private static void retireLegacyConstructionScaffolds(ServerLevel level, SettlementData data, BuildingType type,\n                                                           FrontierWorkerEntity builder, BlockPos supply) {\n        ConstructionState construction = data.construction();\n        if (construction.scaffoldMask() == 0) return;\n        BlockPos safe = findSafeBuilderHome(level, data);\n        if (safe == null) return;\n        builder.getNavigation().stop();\n        builder.setPos(safe.getX() + 0.5D, safe.getY(), safe.getZ() + 0.5D);\n        removeConstructionScaffoldsBestEffort(level, construction, type, supply);\n        data.setConstructionScaffoldMask(0);\n    }\n\n'''
          s = s[:start] + replacement + s[end:]

          start = s.index('    public static FrontierWorkerEntity ensureBuilder(')
          end = s.index('    /**\n     * Reclaims historical duplicate shared builders', start)
          replacement = '''    public static FrontierWorkerEntity ensureBuilder(ServerLevel level, SettlementData data) {\n        reconcileBuilderDuplicates(level, data);\n        List<FrontierWorkerEntity> existing = findBuilders(level, data);\n        if (!existing.isEmpty()) {\n            FrontierWorkerEntity active = existing.getFirst();\n            if (!active.entityTags().contains(BUILDER_TAG)) active.addTag(BUILDER_TAG);\n            active.setNoAi(false);\n            active.setInvulnerable(false);\n            recoverBuilderFromBlockedCell(level, data, active);\n            return active;\n        }\n        if (!builderAssignmentEvidenceLoaded(level, data)) return null;\n        BlockPos spawn = findSafeBuilderHome(level, data);\n        if (spawn == null) return null;\n        FrontierWorkerEntity builder = new FrontierWorkerEntity(FrontierContent.FRONTIER_WORKER.get(), level);\n        builder.setPos(spawn.getX() + 0.5D, spawn.getY(), spawn.getZ() + 0.5D);\n        builder.setYRot(0.0F);\n        builder.setXRot(0.0F);\n        builder.setCustomName(Component.literal(BUILDER_NAME));\n        builder.setCustomNameVisible(true);\n        builder.setPersistenceRequired();\n        builder.setNoAi(false);\n        builder.addTag(BUILDER_TAG);\n        return level.addFreshEntity(builder) ? builder : null;\n    }\n\n    private static void recoverBuilderFromBlockedCell(ServerLevel level, SettlementData data, FrontierWorkerEntity builder) {\n        BlockPos feet = builder.blockPosition();\n        BlockPos head = feet.above();\n        if (!level.hasChunkAt(feet) || !level.hasChunkAt(head)) return;\n        if (!blocksCurrentPathCell(level, feet, level.getBlockState(feet))\n                && !blocksCurrentPathCell(level, head, level.getBlockState(head))) return;\n        BlockPos safe = findSafeBuilderHome(level, data);\n        if (safe == null) return;\n        builder.getNavigation().stop();\n        builder.setPos(safe.getX() + 0.5D, safe.getY(), safe.getZ() + 0.5D);\n    }\n\n    private static BlockPos findSafeBuilderHome(ServerLevel level, SettlementData data) {\n        BlockPos center = data.centerPos();\n        BlockPos preferred = safeSurfaceCell(level, center.getX() + 1, center.getZ() + 1);\n        if (preferred != null) return preferred;\n        for (int radius = 1; radius <= 8; radius++) {\n            for (int dx = -radius; dx <= radius; dx++) {\n                for (int dz = -radius; dz <= radius; dz++) {\n                    if (Math.max(Math.abs(dx), Math.abs(dz)) != radius) continue;\n                    BlockPos candidate = safeSurfaceCell(level, center.getX() + dx, center.getZ() + dz);\n                    if (candidate != null) return candidate;\n                }\n            }\n        }\n        return safeSurfaceCell(level, center.getX(), center.getZ());\n    }\n\n    private static BlockPos safeSurfaceCell(ServerLevel level, int x, int z) {\n        if (!level.hasChunkAt(new BlockPos(x, 0, z))) return null;\n        int y = level.getHeight(Heightmap.Types.MOTION_BLOCKING_NO_LEAVES, x, z);\n        BlockPos candidate = new BlockPos(x, y, z);\n        return isWalkableApproachCell(level, candidate) ? candidate : null;\n    }\n\n'''
          s = s[:start] + replacement + s[end:]

          start = s.index('    static boolean returnBuilderHome(')
          end = s.index('    static FrontierWorkerEntity findBuilder(', start)
          replacement = '''    static boolean returnBuilderHome(ServerLevel level, SettlementData data, FrontierWorkerEntity builder) {\n        BlockPos home = findSafeBuilderHome(level, data);\n        if (home == null) {\n            builder.getNavigation().stop();\n            return false;\n        }\n        double distance = builder.distanceToSqr(home.getX() + 0.5D, home.getY(), home.getZ() + 0.5D);\n        if (distance <= 4.0D) {\n            builder.getNavigation().stop();\n            return true;\n        }\n        if (!moveToReachable(builder, home, 1.10D)) builder.getNavigation().stop();\n        return false;\n    }\n\n'''
          s = s[:start] + replacement + s[end:]

          if s.count('ensureConstructionScaffolds(') != 1:
              raise SystemExit('active scaffold call still remains')
          if s.count('hasFreshScaffoldCoverage(') != 1:
              raise SystemExit('active scaffold placement gate still remains')
          if 'retireLegacyConstructionScaffolds(level, data, type, builder, supply);' not in s:
              raise SystemExit('legacy scaffold retirement missing')
          if 'BlockPos spawn = findSafeBuilderHome(level, data);' not in s:
              raise SystemExit('safe spawn missing')
          p.write_text(s, encoding='utf-8')
          print('ALPHA93_GROUND_BUILDER_FIX_APPLIED')
          PY
          git diff --check

      - name: Ground-builder contract audit
        shell: bash
        run: |
          set -euo pipefail
          P=projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java
          grep -Fq 'mod_version=0.1.0-alpha.93' projects/frontier-settlement/gradle.properties
          grep -Fq 'Construction height is presentation only' "$P"
          grep -Fq 'retireLegacyConstructionScaffolds(level, data, type, builder, supply);' "$P"
          grep -Fq 'data.setConstructionScaffoldMask(0);' "$P"
          grep -Fq 'BlockPos spawn = findSafeBuilderHome(level, data);' "$P"
          grep -Fq 'recoverBuilderFromBlockedCell(level, data, active);' "$P"
          grep -Fq 'private static BlockPos safeSurfaceCell' "$P"
          python3 - <<'PY'
          from pathlib import Path
          s=Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java').read_text(encoding='utf-8')
          assert s.count('ensureConstructionScaffolds(') == 1
          assert s.count('hasFreshScaffoldCoverage(') == 1
          print('GROUND_BUILDER_CONTRACT_OK')
          PY

      - name: Resource JSON audit
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" >/dev/null
            count=$((count+1))
          done < <(find projects/frontier-settlement/src/main/resources -type f -name '*.json' -print0)
          echo "FRONTIER_JSON_OK $count files"

      - name: Frontier Java 25 clean build
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build

      - name: Frontier dedicated server boot smoke
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          set +e
          timeout --signal=INT --kill-after=15s 120s ./gradlew --no-daemon runServer > /tmp/frontier-alpha93-server.log 2>&1
          code=$?
          set -e
          tail -n 160 /tmp/frontier-alpha93-server.log
          grep -Eq 'Done \([0-9.]+s\)!|For help, type "help"' /tmp/frontier-alpha93-server.log || { echo "server boot failed exit=$code"; exit 1; }
          echo FRONTIER_ALPHA93_SERVER_BOOT_OK

      - name: JAR audit
        shell: bash
        run: |
          set -euo pipefail
          J=projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.93.jar
          test -s "$J"
          test -z "$(jar tf "$J" | sort | uniq -d | head -n1 || true)"
          jar tf "$J" | grep -Fq 'kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.class'
          echo "FRONTIER_ALPHA93_JAR_OK $(stat -c%s "$J") bytes"
          sha256sum "$J"

      - uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha93-ground-builder
          path: projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.93.jar
          retention-days: 7

      - name: Commit validated fix and cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-frontier-alpha93-ground-builder-fix.yml
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/frontier-settlement .github/workflows/manual-frontier-alpha93-ground-builder-fix.yml
          git commit -m 'Keep settlement builders on safe ground'
          git pull --rebase origin main
          git push origin HEAD:main
