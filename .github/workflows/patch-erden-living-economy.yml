name: Patch Erden living economy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-erden-living-economy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply living economy integration
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_erden_living_economy.py
          git diff --check

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java \
                  projects/living-kingdoms/docs/ERDEN_IMPLEMENTATION_STATUS.md \
                  .github/workflows/build-living-kingdoms.yml
          git commit -m 'Connect Erden shop schedules prices and errands'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
