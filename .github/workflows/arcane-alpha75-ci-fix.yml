name: Arcane alpha75 final CI repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-alpha75-ci-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair audit metadata and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          p = root / 'projects/arcane-circle'
          magic = p / 'src/main/java/kr/moonseungjun/arcanecircle/magic'

          growth = magic / 'CombatGrowthService.java'
          s = growth.read_text(encoding='utf-8')
          if 'Passive livestock cannot feed insight/economy' not in s:
              s = s.replace('* livestock cannot feed insight/economy; progress stays logarithmic and tightly capped so one',
                            '* Passive livestock cannot feed insight/economy; progress stays logarithmic and tightly capped so one')
          growth.write_text(s, encoding='utf-8')

          index_path = p / 'src/main/resources/data/arcanecircle/spell_catalog/index.json'
          index = json.loads(index_path.read_text(encoding='utf-8'))
          deferred = index['deferred_damage_attribution']
          tracked = deferred['tracked_spells']
          if 'control_weather' not in tracked:
              tracked.insert(tracked.index('prismatic_wall'), 'control_weather')
          deferred['growth_snapshot'] = 'range_scaled_player_center_envelope_covering_authoritative_high_circle_footprint'
          deferred['meteor_cityfall_snapshot'] = 'cast_range_plus_full_range_scaled_cityfall_radius_covered'
          deferred['control_weather_credit'] = '45s_automatic_and_g_key_lightning_server_attributed'
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = p / 'tools/test_current_source.py'
          t = test_path.read_text(encoding='utf-8')
          t = t.replace("assert len(index['deferred_damage_attribution']['tracked_spells']) == 20",
                        "assert len(index['deferred_damage_attribution']['tracked_spells']) == 21")
          marker = "assert index['deferred_damage_attribution']['per_cast_insight_cap'] == 8\n"
          extra = (
              "assert index['deferred_damage_attribution']['growth_snapshot'] == 'range_scaled_player_center_envelope_covering_authoritative_high_circle_footprint'\n"
              "assert index['deferred_damage_attribution']['meteor_cityfall_snapshot'] == 'cast_range_plus_full_range_scaled_cityfall_radius_covered'\n"
              "assert index['deferred_damage_attribution']['control_weather_credit'] == '45s_automatic_and_g_key_lightning_server_attributed'\n"
          )
          if "range_scaled_player_center_envelope_covering_authoritative_high_circle_footprint" not in t:
              t = t.replace(marker, marker + extra)
          growth_check = "need(growth, 'public static DeferredSettlement takeDeferred(', 'public static void startDeferred(',"
          if "range * 2.65 + 10.0" not in t:
              anchor = "need(text(magic / 'NinthCircleSpellService.java'), 'hurtAttributed(level, owner, target', '\"prismatic_wall\"', '\"weird\"')\n"
              t = t.replace(anchor, anchor + "need(growth, '\"control_weather\"', 'case \"control_weather\" -> 900;', 'range * 2.65 + 10.0')\nneed(text(magic / 'SpellGameplayService.java'), 'state.power() * .16), \"control_weather\"', 'barrage.power() * .44), \"control_weather\"')\n")
          test_path.write_text(t, encoding='utf-8')

          verify_path = p / 'tools/verify_jar.py'
          v = verify_path.read_text(encoding='utf-8')
          v = v.replace("if len(deferred.get('tracked_spells', [])) != 20:",
                        "if len(deferred.get('tracked_spells', [])) != 21:")
          if "range_scaled_player_center_envelope_covering_authoritative_high_circle_footprint" not in v:
              anchor = "    if len(deferred.get('tracked_spells', [])) != 21:\n        raise SystemExit('alpha.75 deferred spell coverage drift')\n"
              checks = (
                  "    if deferred.get('growth_snapshot') != 'range_scaled_player_center_envelope_covering_authoritative_high_circle_footprint':\n        raise SystemExit('alpha.75 wide growth snapshot contract missing')\n"
                  "    if deferred.get('meteor_cityfall_snapshot') != 'cast_range_plus_full_range_scaled_cityfall_radius_covered':\n        raise SystemExit('alpha.75 meteor cityfall growth coverage missing')\n"
                  "    if deferred.get('control_weather_credit') != '45s_automatic_and_g_key_lightning_server_attributed':\n        raise SystemExit('alpha.75 Control Weather deferred credit missing')\n"
              )
              v = v.replace(anchor, anchor + checks)
          verify_path.write_text(v, encoding='utf-8')

          Path('.github/workflows/arcane-alpha75-ci-fix.yml').unlink()
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish Arcane alpha.75 audit metadata and verifier sync [skip ci]'
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1

      - name: Dispatch canonical Arcane build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build-arcane-circle.yml/dispatches" \
            -d '{"ref":"main"}'
