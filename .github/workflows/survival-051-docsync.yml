name: Survival Ascension 0.51 Doc Sync

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  sync:
    if: github.event.issue.title == '[internal] survival 051 doc sync'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize 0.51 current-state docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/survival-ascension')

          def read(name):
              return (root / name).read_text(encoding='utf-8')

          def write(name, text):
              (root / name).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing docs contract: {label}')
              return text.replace(old, new, 1)

          project = read('PROJECT.md')
          project = replace_once(project, '- Mod version: `0.50.0-alpha.1`', '- Mod version: `0.51.0-alpha.1`', 'PROJECT version')
          old_compat = '- Existing-world compatibility: no new SavedData ID or migration. Existing skill XP totals, `infrastructure_v1`, `field_depots_v1`, `outpost_v1`, `production_v1` and older data stay unchanged. 0.50 raises only the persisted safety capacity of the existing depot/outpost lists to nine and derives the live 3/6/9 admission limit from already-existing Industrial Works / Civil Works / Ascension Nexus progression. Existing 0.49 cart-local frontline manifest NBT, 0.48 exact-outpost local supply, 0.47 optional EntityType-tag integration, physical freight railheads and item CustomData boundaries remain unchanged.'
          new_compat = '- Existing-world compatibility: no new SavedData ID or migration. Existing skill XP totals, `infrastructure_v1`, `field_depots_v1`, `outpost_v1`, `production_v1`, existing affix CustomData and older data stay unchanged. 0.51 adds the existing affix category `armor` to standard humanoid armor and reads effects only from currently equipped pieces; 0.50 regional 3/6/9 admission, 0.49 cart-local frontline manifest NBT, 0.48 exact-outpost local supply, optional integrations, physical freight railheads and item-data boundaries remain unchanged.'
          project = replace_once(project, old_compat, new_compat, 'PROJECT compatibility')
          section = '''## 0.51 Armor Ascension / 방어구 승천 성장
- Standard humanoid armor tags (`HEAD_ARMOR`, `CHEST_ARMOR`, `LEG_ARMOR`, `FOOT_ARMOR`) now join the existing Ascension Imprint / reforge / Mythic-awakening path without optional-mod Java dependencies.
- Elite affix loot can now roll helmet, chestplate, leggings or boots on the same iron -> diamond -> netherite rarity ladder as existing weapon/tool drops.
- Armor reuses the existing five affix slots with worn-only roles: `수호` always reduces incoming damage, `불굴` adds reduction at <=50% health, `숙련` increases Combat mastery XP, `완강` adds reduction against hits of 8+ damage, and `보호` adds reduction when the damage source has no attacking entity.
- All armor-affix damage reduction is summed across equipped pieces and hard-capped at 35%. Armor `숙련` is summed separately and hard-capped at +32% Combat XP. Holding armor in the hand gives neither effect.
- Imprint keeps the source armor ItemStack and unrelated DataComponents; Survival Ascension still writes only its nested affix CustomData and display name.
- Existing imprint/reforge/awakening/salvage material costs and physical-logistics-first consumption are unchanged.
- No armor attribute rewriting, max-health inflation, new potion effect, SavedData, packet/protocol change, custom armor item, force-load or background simulation.

'''
          project = replace_once(project, '## 0.50 Regional Logistics Scale / 지역 물류망 확장\n', section + '## 0.50 Regional Logistics Scale / 지역 물류망 확장\n', 'PROJECT 0.51 section')
          write('PROJECT.md', project)

          readme = read('README.md')
          readme_section = '''## 0.51.0-alpha.1 — Armor Ascension / 방어구 승천 성장
Armor is now part of the same ascension equipment loop as weapons and tools. Standard helmet/chestplate/leggings/boots tags can be used with `M -> 장비 -> 승천 각인`, then use the existing reforge, Mythic awakening and salvage path without replacing the original item or clearing unrelated components. Elite affix drops can also roll iron/diamond/netherite armor pieces.

Armor affixes only work while the piece is equipped: `수호` is general incoming-damage reduction, `불굴` strengthens defense below half health, `숙련` increases Combat mastery XP, `완강` helps against 8+ damage hits, and `보호` helps against damage with no attacking entity. The combined armor-affix damage reduction is capped at 35%, and armor mastery XP is capped at +32%, so four high-tier pieces cannot create an uncapped defensive multiplier.

This reuses the existing affix CustomData, material sinks and equipment action payload. No new SavedData, protocol bump, custom armor, attribute-rewrite system, force-load or optional-mod Java dependency is introduced.

'''
          readme = replace_once(readme, '## 0.50.0-alpha.1 — Regional Logistics Scale / 지역 물류망 확장\n', readme_section + '## 0.50.0-alpha.1 — Regional Logistics Scale / 지역 물류망 확장\n', 'README 0.51 section')
          write('README.md', readme)

          changelog = read('CHANGELOG.md')
          change_section = '''## 0.51.0-alpha.1
- Added `Armor Ascension / 방어구 승천 성장`: standard head/chest/leg/foot armor tags now join the existing affix imprint, reforge, Mythic-awakening and salvage flow.
- Elite affix loot can now roll iron/diamond/netherite armor across all four equipment slots.
- Added worn-only armor affix roles: 수호 general reduction, 불굴 low-health reduction, 숙련 Combat XP, 완강 heavy-hit reduction, 보호 no-attacker/environmental reduction.
- Hard-capped total armor-affix incoming-damage reduction at 35% and armor mastery XP at +32% across all equipped pieces.
- Preserved original armor ItemStack identity and unrelated components; Survival Ascension still writes only its nested affix CustomData/display name.
- Kept existing physical-logistics-first imprint/reforge/awakening costs, network protocol 8, and all 0.49/0.50 freight/regional-logistics contracts.
- Added no new SavedData, custom armor item, attribute rewrite, potion-effect layer, force-load or optional-mod Java dependency.

'''
          changelog = replace_once(changelog, '## 0.50.0-alpha.1\n', change_section + '## 0.50.0-alpha.1\n', 'CHANGELOG 0.51 section')
          write('CHANGELOG.md', changelog)

          guide_path = root / 'src/main/java/kr/moonseungjun/survivalascension/client/GuideScreen.java'
          guide = guide_path.read_text(encoding='utf-8')
          old_guide = 'h("외부 장비와 승천 각인"), p("콘텐츠 팩이나 다른 모드의 장비가 표준 검/곡괭이/도끼/삽/괭이 아이템 태그를 사용하면 장비 메뉴의 승천 각인으로 Survival Ascension affix 체계에 편입할 수 있습니다. 각성 단계는 정예, 전설 단계는 승천, 종말 단계는 신화 등급으로 각인합니다."),'
          new_guide = 'h("외부 장비와 승천 각인"), p("콘텐츠 팩이나 다른 모드의 장비가 표준 검/곡괭이/도끼/삽/괭이 또는 머리/가슴/다리/발 방어구 태그를 사용하면 장비 메뉴의 승천 각인으로 Survival Ascension affix 체계에 편입할 수 있습니다. 각성 단계는 정예, 전설 단계는 승천, 종말 단계는 신화 등급으로 각인합니다."),\n                h("방어구 affix"), p("각인 방어구는 착용 중에만 작동합니다. 수호=상시 피해 감소, 불굴=체력 절반 이하 추가 감소, 숙련=전투 숙련 XP 증가, 완강=8 이상 큰 피해 추가 감소, 보호=공격 주체가 없는 피해 추가 감소입니다. 네 부위 합산 affix 피해 감소는 최대35%, 방어구 숙련 XP는 최대32% 추가입니다."),'
          if old_guide not in guide:
              raise SystemExit('missing docs contract: Guide armor insertion')
          guide_path.write_text(guide.replace(old_guide, new_guide, 1), encoding='utf-8')
          PY
          git rm .github/workflows/survival-051-docsync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/survival-ascension
          git commit -m 'Synchronize Survival Ascension 0.51 docs [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
