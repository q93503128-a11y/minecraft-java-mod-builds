name: Patch Living Kingdoms capital marriage

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/wire_erden_capital_marriage.py'
      - '.github/workflows/patch-living-kingdoms-capital-marriage.yml'

concurrency:
  group: living-kingdoms-capital-marriage-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Wire capital marriage into lifecycle runtime
        run: python .github/scripts/wire_erden_capital_marriage.py
      - name: Clean compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Verify capital marriage invariants
        shell: bash
        run: |
          set -euo pipefail
          life='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleManager.java'
          saved='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleSavedData.java'
          marriage='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalMarriageManager.java'
          marriage_saved='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalMarriageSavedData.java'
          mod='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java'
          grep -Fq 'ErdenCapitalMarriageManager.parentPair' "$life"
          grep -Fq 'projectForAudit' "$life"
          grep -Fq 'movePersonHousehold' "$saved"
          grep -Fq 'LK_ERDEN_CAPITAL_MARRIAGE_PASS' "$marriage"
          grep -Fq 'wallet_follows_household=true' "$marriage"
          grep -Fq 'work_assignment_preserved=true' "$marriage"
          grep -Fq 'SCHEMA_VERSION = 1' "$marriage_saved"
          grep -Fq 'ErdenCapitalMarriageManager.onServerTick(event)' "$mod"
      - name: Commit compiled integration directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleSavedData.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'feat(living-kingdoms): wire capital marriages into generations'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
