name: Finalize Living Kingdoms CI residency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-living-kingdoms-ci-residency.yml'
      - '.github/living-kingdoms-ci-residency-final-trigger'
  workflow_dispatch:

concurrency:
  group: living-kingdoms-ci-residency-final
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record live final residency run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/living-kingdoms-ci-residency-final.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "in_progress",
            "log_artifact_id": ""
          }
          EOF
          git add .github/build-pointers/living-kingdoms-ci-residency-final.json
          git commit -m "Record Living Kingdoms final CI residency $GITHUB_RUN_NUMBER start [skip ci]" || true
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Apply all bounded diagnostic residency repairs
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_living_kingdoms_ci_residency.py
          python .github/scripts/patch_living_kingdoms_landmark_ci_residency.py
          python .github/scripts/patch_living_kingdoms_population_ci_retainer.py
          ! grep -Fq 'setChunkForced' "$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPopulationCiChunkRetainer.java"
          grep -Fq 'retainDiagnosticChunk' "$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPopulationCiChunkRetainer.java"

      - name: Java 25 clean compile
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Fresh-world complete residency proof
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-ci-residency-final-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-ci-residency-final-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/living-kingdoms-ci-residency-final-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 1500); do
            log=../../logs/living-kingdoms-ci-residency-final-server.log
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' "$log" \
              || grep -Eqi 'watchdog|A single server tick took|IllegalStateException|Exception loading level' "$log"; then
              cat "$log"
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_AUTHORED_GROUND_FUNCTIONAL_PLAN_PASS placements=233' "$log" \
              && grep -Fq 'Prepared Erden residence modes buildings=233 authored_ground_candidates=233 authored_upper_candidates=233 ground_only_candidates=0 synthetic_upper_created=0' "$log" \
              && grep -Fq 'LK_ERDEN_AUTHORED_UPPER_ROUTE_PASS' "$log" \
              && grep -Fq 'LK_ERDEN_LANDMARK_INTERIOR_PASS role=' "$log" \
              && grep -Fq 'LK_ERDEN_POPULATION_DIAGNOSTIC_PASS households=77 residents=231 workers=154' "$log" \
              && grep -Fq 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' "$log" \
              && grep -Fq 'LK_ERDEN_CITADEL_INTERIOR_PASS zones=6' "$log"; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done

          tail -n 900 ../../logs/living-kingdoms-ci-residency-final-server.log
          test "$passed" -eq 1
          grep -F 'Requested Erden physical-economy authored interior CI samples sites=3' ../../logs/living-kingdoms-ci-residency-final-server.log | grep -F 'loaded_lease=true' | grep -F 'persistent_forced_chunks=false'
          grep -F 'Requested Erden authored upper-route CI sample' ../../logs/living-kingdoms-ci-residency-final-server.log | grep -F 'authored_ground_plan=true' | grep -F 'loaded_lease=true' | grep -F 'persistent_forced_chunks=false'
          grep -F 'Retained Erden landmark CI sample' ../../logs/living-kingdoms-ci-residency-final-server.log | grep -F 'refreshed_until_verification=true' | grep -F 'loaded_lease=true' | grep -F 'persistent_forced_chunks=false'
          grep -F 'LK_ERDEN_AUTHORED_UPPER_ROUTE_PASS' ../../logs/living-kingdoms-ci-residency-final-server.log | grep -F 'source_blocks_cut=0' | grep -F 'source_air_only=true'
          grep -F 'LK_ERDEN_LANDMARK_INTERIOR_PASS role=' ../../logs/living-kingdoms-ci-residency-final-server.log | grep -F 'facade_replaced=false' | grep -F 'loaded_only=true'
          grep -F 'LK_ERDEN_POPULATION_DIAGNOSTIC_PASS households=77 residents=231 workers=154' ../../logs/living-kingdoms-ci-residency-final-server.log | grep -F 'spawned_sample=3' | grep -F 'shortages=0'
          grep -F 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/living-kingdoms-ci-residency-final-server.log | grep -F 'purchase_outcomes=77' | grep -F 'containers=3'
          grep -F 'LK_ERDEN_CITADEL_INTERIOR_PASS zones=6' ../../logs/living-kingdoms-ci-residency-final-server.log
          ! grep -Fq 'ground_only_candidates=77' ../../logs/living-kingdoms-ci-residency-final-server.log

      - name: Commit verified residency source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalStreamingBuilder.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanInteriorBuilder.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCitadelInteriorManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredUpperRouteManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenLandmarkInteriorManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPopulationCiChunkRetainer.java
          git commit -m 'fix(living-kingdoms): bound all authored CI residency through verification'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload final residency log
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-ci-residency-final-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Record final residency pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            mkdir -p .github/build-pointers
            cat > .github/build-pointers/living-kingdoms-ci-residency-final.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID"
          }
          EOF
            git add .github/build-pointers/living-kingdoms-ci-residency-final.json
            git commit -m "Record Living Kingdoms final CI residency $GITHUB_RUN_NUMBER [skip ci]" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
