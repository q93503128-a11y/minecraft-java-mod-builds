name: Build Village Guardians v0.17.14 Custom Mesh Skills

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger-v01714'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: village-guardians-v01714-main
  cancel-in-progress: false

env:
  PROJECT_DIR: projects/village-guardians
  EXPECTED_JAR: villageguardians-0.17.14-alpha.1.jar
  PUBLISHED_DIR: published/village-guardians
  RESULT_DIR: ci-results/village-guardians-v01714

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply custom entity and mesh overhaul
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/v01714/apply.py
          python3 tools/v01714/apply.py
          python3 tools/generate_skill_mesh_texture.py src/main/resources
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/test_runtime_safety_v0173.py')
          text = path.read_text(encoding='utf-8')
          old = 'H 상태 · J 성장 · K 직업 성장 · U 호출기 · B 빠른 통신 · Z/X 기술'
          new = '기본키 Z 기술1 · X 기술2 · B 빠른 통신 · H 상태 · J 성장 · K 직업 성장 · U 빠른 통신'
          if old in text:
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Run complete contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          {
            status=0
            while IFS= read -r test; do
              echo "=== $test ==="
              python3 "$test" || status=1
            done < <(find tools -maxdepth 1 -type f -name 'test_*.py' | sort)
            exit "$status"
          } 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v01714-contracts.log"

      - name: Build Java 25 JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v01714-gradle.log"

      - name: Verify custom renderer artifact
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          unzip -t "build/libs/$EXPECTED_JAR" > "$GITHUB_WORKSPACE/village-guardians-v01714-unzip.log"
          for class in \
            VillageSkillEffectEntity \
            VillageSkillEffectEntities \
            VillageSkillEffectRenderer \
            VillageSkillEffectRenderState \
            VillageSkillEffectClient \
            VillageSkillMeshLibrary; do
            unzip -l "build/libs/$EXPECTED_JAR" | grep -q "kr/moonseungjun/villageguardians/${class}.class"
          done
          unzip -l "build/libs/$EXPECTED_JAR" | grep -q 'assets/villageguardians/textures/effect/skill_mesh.png'
          if unzip -l "build/libs/$EXPECTED_JAR" | grep -q 'VillageSkillEffectSystem\$DisplayAccess.class'; then
            echo 'Obsolete display reflection adapter remains in JAR' >&2
            exit 1
          fi
          javap -classpath "build/libs/$EXPECTED_JAR" -c -p \
            kr.moonseungjun.villageguardians.VillageSkillEffectSystem \
            kr.moonseungjun.villageguardians.VillageSkillEffectRenderer \
            kr.moonseungjun.villageguardians.VillageSkillMeshLibrary \
            kr.moonseungjun.villageguardians.VillageSkillEffectClient \
            > "$GITHUB_WORKSPACE/village-guardians-v01714-effect-bytecode.log"
          if grep -E 'world/entity/Display|world/item/Items|world/level/block/Blocks|DisplayAccess|ParticleTypes|sendParticles|addParticle' \
              "$GITHUB_WORKSPACE/village-guardians-v01714-effect-bytecode.log"; then
            echo 'Vanilla display/item/block/particle effect path remains' >&2
            exit 1
          fi
          grep -q 'submitCustomGeometry' "$GITHUB_WORKSPACE/village-guardians-v01714-effect-bytecode.log"
          grep -q 'rotateY' "$GITHUB_WORKSPACE/village-guardians-v01714-effect-bytecode.log"
          javap -classpath "build/libs/$EXPECTED_JAR" -verbose \
            kr.moonseungjun.villageguardians.VillageSkillMeshLibrary \
            | grep -q 'major version: 69'
          mkdir -p "$GITHUB_WORKSPACE/deliverables-v01714"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables-v01714/"
          cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables-v01714/"
          cp "$GITHUB_WORKSPACE/village-guardians-v01714-contracts.log" "$GITHUB_WORKSPACE/deliverables-v01714/"
          cp "$GITHUB_WORKSPACE/village-guardians-v01714-gradle.log" "$GITHUB_WORKSPACE/deliverables-v01714/"
          cp "$GITHUB_WORKSPACE/village-guardians-v01714-effect-bytecode.log" "$GITHUB_WORKSPACE/deliverables-v01714/"
          cp "$GITHUB_WORKSPACE/village-guardians-v01714-unzip.log" "$GITHUB_WORKSPACE/deliverables-v01714/"

      - uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.17.14-alpha.1
          path: deliverables-v01714/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified source and JAR directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/tools/v01714"
          rm -f .github/workflows/probe-village-guardians-custom-mesh-api.yml
          rm -f "$PROJECT_DIR/.probe-custom-mesh-api"
          rm -rf ci-results/village-guardians-custom-mesh-api
          mkdir -p "$PUBLISHED_DIR"
          cp "deliverables-v01714/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
          cp "deliverables-v01714/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$PROJECT_DIR" "$PUBLISHED_DIR" .github/workflows ci-results
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Village Guardians v0.17.14 custom mesh skill overhaul'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Record result
        if: always()
        shell: bash
        run: |
          set +e
          FINAL_STATUS='${{ job.status }}'
          TEMP_DIR="$RUNNER_TEMP/village-guardians-v01714-result"
          rm -rf "$TEMP_DIR" && mkdir -p "$TEMP_DIR"
          cp "$GITHUB_WORKSPACE/village-guardians-v01714-contracts.log" "$TEMP_DIR/latest-contracts.log" 2>/dev/null || printf '%s\n' 'Contracts did not finish.' > "$TEMP_DIR/latest-contracts.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v01714-gradle.log" "$TEMP_DIR/latest-gradle.log" 2>/dev/null || printf '%s\n' 'Gradle did not finish.' > "$TEMP_DIR/latest-gradle.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v01714-effect-bytecode.log" "$TEMP_DIR/effect-bytecode.log" 2>/dev/null || true
          cat > "$TEMP_DIR/status.txt" <<EOF
          status=$FINAL_STATUS
          trigger_sha=$GITHUB_SHA
          published_commit=$(git rev-parse HEAD 2>/dev/null)
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=0.17.14-alpha.1
          EOF
          git reset --hard HEAD
          git clean -fd
          mkdir -p "$RESULT_DIR"
          cp "$TEMP_DIR"/* "$RESULT_DIR/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record Village Guardians v0.17.14 result for ${GITHUB_SHA::7}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
