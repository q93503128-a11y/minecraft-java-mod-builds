name: Frontier Alpha.123 Lock Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha123-lock-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Sync Alpha.123 companion locks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('projects/frontier-settlement')
          target_version = '0.1.0-alpha.123'

          for rel in ('COMPANION_LOCK.json', 'companion-testpack/resolved-lock.client.json', 'companion-testpack/resolved-lock.server.json'):
              p = root / rel
              data = json.loads(p.read_text(encoding='utf-8'))
              old = data['target'].get('frontier_settlement')
              if old not in ('0.1.0-alpha.122', target_version):
                  raise SystemExit(f'unexpected {rel} target: {old}')
              data['target']['frontier_settlement'] = target_version
              if rel == 'COMPANION_LOCK.json':
                  notes = data.setdefault('notes', [])
                  note = ('Frontier Alpha.123 changes only the project-owned Frontier runtime JAR: '
                          'central warehouse/cart-station logistics investment, physical storage expansion, '
                          'and bounded productive-freight throughput. Third-party companion pins/hashes remain unchanged.')
                  if note not in notes:
                      notes.append(note)
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          (cd projects/frontier-settlement && python3 tools/test_companion_testpack.py)
          rm -f .github/workflows/frontier-alpha123-lock-sync.yml
          git diff --check
      - name: Commit synced lock state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement/COMPANION_LOCK.json \
                  projects/frontier-settlement/companion-testpack/resolved-lock.client.json \
                  projects/frontier-settlement/companion-testpack/resolved-lock.server.json \
                  .github/workflows/frontier-alpha123-lock-sync.yml
          git commit -m 'frontier: sync Alpha.123 companion runtime locks'
          git push origin HEAD:main
