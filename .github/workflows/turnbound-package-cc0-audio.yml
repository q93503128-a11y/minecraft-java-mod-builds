name: Turnbound package CC0 production audio

on:
  push:
    branches:
      - turnbound-alpha17-full-v04
    paths:
      - '.github/workflows/turnbound-package-cc0-audio.yml'
      - 'projects/turnbound/AUDIO_ASSETS.md'
      - 'projects/turnbound/src/main/java/io/github/q93503128/turnbound/TurnboundSounds.java'
      - 'projects/turnbound/src/main/java/io/github/q93503128/turnbound/client/ClientAudioDirector.java'
      - 'projects/turnbound/src/main/java/io/github/q93503128/turnbound/client/ClientAudioPlayback.java'
      - 'projects/turnbound/src/main/java/io/github/q93503128/turnbound/presentation/HeroSkillAudioStyle.java'
      - 'projects/turnbound/src/main/resources/assets/turnbound/sounds.json'
      - 'projects/turnbound/src/main/resources/assets/turnbound/sounds/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Turnbound production branch
        uses: actions/checkout@v4
        with:
          ref: turnbound-alpha17-full-v04
          fetch-depth: 0

      - name: Ensure ffprobe is available
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Package verified CC0 music and SFX
        shell: bash
        run: |
          set -euo pipefail
          ROOT='projects/turnbound/src/main/resources/assets/turnbound/sounds'
          MUSIC="$ROOT/music"
          SFX="$ROOT/sfx"
          HERO="$SFX/heroes"
          mkdir -p "$MUSIC" "$SFX" "$HERO"

          fetch() {
            local url="$1"
            local out="$2"
            echo "Fetching $out"
            curl --fail --location --retry 4 --retry-delay 2 --silent --show-error "$url" --output "$out"
            test -s "$out"
          }

          W='https://raw.githubusercontent.com/GabrielGLevine/wandering-inn-rpg/main/wandering_inn_game/assets/audio/music'
          J='https://raw.githubusercontent.com/jarlah/dungeon-haskell/master/assets/music'
          S='https://raw.githubusercontent.com/lavenderdotpet/CC0-Public-Domain-Sounds/main/80-CC0-RPG-SFX'

          fetch "$W/junkala_home_town.ogg" "$MUSIC/hub.ogg"
          fetch "$W/junkala_sunshine_coast.ogg" "$MUSIC/region_explore.ogg"
          fetch "$W/junkala_preparing_battle.ogg" "$MUSIC/battle_normal.ogg"
          fetch "$W/junkala_encounter_witches.ogg" "$MUSIC/battle_elite.ogg"
          fetch "$W/junkala_army_approaching.ogg" "$MUSIC/battle_boss.ogg"
          fetch "$J/boss.ogg" "$MUSIC/battle_final.ogg"

          fetch "$S/spell_01.ogg" "$SFX/skill.ogg"
          fetch "$S/blade_01.ogg" "$SFX/hit_light.ogg"
          fetch "$S/metal_01.ogg" "$SFX/hit_heavy.ogg"
          fetch "$S/creature_hurt_01.ogg" "$SFX/reaction_hit.ogg"
          fetch "$S/spell_fire_07.ogg" "$SFX/dot_tick.ogg"
          fetch "$S/item_gem_01.ogg" "$SFX/heal.ogg"
          fetch "$S/item_gem_04.ogg" "$SFX/barrier.ogg"
          fetch "$S/spell_02.ogg" "$SFX/revive.ogg"
          fetch "$S/creature_die_01.ogg" "$SFX/down.ogg"
          fetch "$S/creature_roar_02.ogg" "$SFX/boss_phase.ogg"
          fetch "$S/spell_fire_03.ogg" "$SFX/spawn.ogg"

          fetch "$S/blade_02.ogg" "$HERO/kyren.ogg"
          fetch "$S/item_gem_03.ogg" "$HERO/lumea.ogg"
          fetch "$S/metal_02.ogg" "$HERO/bram.ogg"
          fetch "$S/item_gem_02.ogg" "$HERO/elysia.ogg"
          fetch "$S/lock_03.ogg" "$HERO/lynette.ogg"
          fetch "$S/book_03.ogg" "$HERO/morwen.ogg"
          fetch "$S/item_wood_03.ogg" "$HERO/marion.ogg"
          fetch "$S/metal_03.ogg" "$HERO/raze.ogg"

      - name: Validate all 25 audio files
        shell: bash
        run: |
          set -euo pipefail
          ROOT='projects/turnbound/src/main/resources/assets/turnbound/sounds'
          expected=(
            music/hub.ogg
            music/region_explore.ogg
            music/battle_normal.ogg
            music/battle_elite.ogg
            music/battle_boss.ogg
            music/battle_final.ogg
            sfx/skill.ogg
            sfx/hit_light.ogg
            sfx/hit_heavy.ogg
            sfx/reaction_hit.ogg
            sfx/dot_tick.ogg
            sfx/heal.ogg
            sfx/barrier.ogg
            sfx/revive.ogg
            sfx/down.ogg
            sfx/boss_phase.ogg
            sfx/spawn.ogg
            sfx/heroes/kyren.ogg
            sfx/heroes/lumea.ogg
            sfx/heroes/bram.ogg
            sfx/heroes/elysia.ogg
            sfx/heroes/lynette.ogg
            sfx/heroes/morwen.ogg
            sfx/heroes/marion.ogg
            sfx/heroes/raze.ogg
          )

          test "${#expected[@]}" -eq 25
          for rel in "${expected[@]}"; do
            path="$ROOT/$rel"
            test -s "$path"
            test "$(head -c 4 "$path")" = 'OggS'
            codec="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of default=noprint_wrappers=1:nokey=1 "$path")"
            test "$codec" = 'vorbis'
            duration="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$path")"
            python3 -c 'import sys; d=float(sys.argv[1]); assert d > 0.02, d' "$duration"
            printf '%-32s codec=%s duration=%ss size=%s\n' "$rel" "$codec" "$duration" "$(stat -c%s "$path")"
          done

          count="$(find "$ROOT/music" "$ROOT/sfx" -type f -name '*.ogg' | wc -l)"
          test "$count" -eq 25

      - name: Validate sounds.json contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('projects/turnbound/src/main/resources/assets/turnbound')
          data = json.loads((root / 'sounds.json').read_text(encoding='utf-8'))
          expected = {
              'music.hub': 'music/hub',
              'music.region_explore': 'music/region_explore',
              'music.battle_normal': 'music/battle_normal',
              'music.battle_elite': 'music/battle_elite',
              'music.battle_boss': 'music/battle_boss',
              'music.battle_final': 'music/battle_final',
              'sfx.skill': 'sfx/skill',
              'sfx.hit_light': 'sfx/hit_light',
              'sfx.hit_heavy': 'sfx/hit_heavy',
              'sfx.reaction_hit': 'sfx/reaction_hit',
              'sfx.dot_tick': 'sfx/dot_tick',
              'sfx.heal': 'sfx/heal',
              'sfx.barrier': 'sfx/barrier',
              'sfx.revive': 'sfx/revive',
              'sfx.down': 'sfx/down',
              'sfx.boss_phase': 'sfx/boss_phase',
              'sfx.spawn': 'sfx/spawn',
              'sfx.hero.kyren': 'sfx/heroes/kyren',
              'sfx.hero.lumea': 'sfx/heroes/lumea',
              'sfx.hero.bram': 'sfx/heroes/bram',
              'sfx.hero.elysia': 'sfx/heroes/elysia',
              'sfx.hero.lynette': 'sfx/heroes/lynette',
              'sfx.hero.morwen': 'sfx/heroes/morwen',
              'sfx.hero.marion': 'sfx/heroes/marion',
              'sfx.hero.raze': 'sfx/heroes/raze',
          }
          assert len(expected) == 25
          for event, suffix in expected.items():
              assert event in data, f'missing event: {event}'
              sounds = data[event]['sounds']
              entry = sounds[0]
              name = entry['name'] if isinstance(entry, dict) else entry
              assert name == f'turnbound:{suffix}', (event, name)
              assert (root / 'sounds' / f'{suffix}.ogg').is_file(), suffix
          print('sounds.json contract: OK (25/25)')
          PY

      - name: Diff sanity
        run: git diff --check

      - name: Commit verified production audio
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/turnbound/src/main/resources/assets/turnbound/sounds/music \
                  projects/turnbound/src/main/resources/assets/turnbound/sounds/sfx
          if git diff --cached --quiet; then
            echo 'Audio files already match the verified source set.'
            exit 0
          fi
          git commit -m 'assets(turnbound): package verified CC0 production audio [skip ci]'
          git pull --rebase origin turnbound-alpha17-full-v04
          git push origin HEAD:turnbound-alpha17-full-v04
