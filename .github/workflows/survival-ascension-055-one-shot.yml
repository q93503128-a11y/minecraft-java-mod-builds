name: Survival Ascension 0.55 One Shot

on:
  push:
    branches: [main]
    paths:
      - 'projects/survival-ascension/.alpha55-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply 0.55 native 26.2 integration patch
        shell: bash
        run: |
          set -euo pipefail
          cd projects/survival-ascension
          python3 - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('.')
          def read(p): return (ROOT / p).read_text(encoding='utf-8')
          def write(p, s): (ROOT / p).write_text(s, encoding='utf-8')
          def rep(p, old, new, count=1):
              s = read(p)
              if old not in s:
                  raise SystemExit(f'patch anchor missing in {p}: {old[:120]!r}')
              s2 = s.replace(old, new, count)
              write(p, s2)
          def rep_all(p, old, new):
              s = read(p)
              if old not in s:
                  raise SystemExit(f'patch anchor missing in {p}: {old[:120]!r}')
              write(p, s.replace(old, new))

          rep('gradle.properties', 'mod_version=0.54.0-alpha.1', 'mod_version=0.55.0-alpha.1')

          lock_path = ROOT / 'modpack/content-lock.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          if lock.get('version') != '0.54.0-alpha.1-content-preview.1':
              raise SystemExit(f'unexpected lock version {lock.get("version")!r}')
          lock['version'] = '0.55.0-alpha.1-content-preview.1'
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          deep_path = ROOT / 'src/main/resources/data/survivalascension/tags/worldgen/biome/expedition/deep.json'
          deep = json.loads(deep_path.read_text(encoding='utf-8'))
          values = deep.setdefault('values', [])
          if 'minecraft:sulfur_caves' not in values:
              values.insert(0, 'minecraft:sulfur_caves')
          deep_path.write_text(json.dumps(deep, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          affix = 'src/main/java/kr/moonseungjun/survivalascension/equipment/AscensionAffixes.java'
          rep(affix,
              'Content-pack bridge: any single-stack sword/mace/bow/crossbow/pickaxe/axe/shovel/hoe/shield or humanoid armor item that',
              'Content-pack bridge: any single-stack sword/spear/mace/bow/crossbow/pickaxe/axe/shovel/hoe/shield or humanoid armor item that')
          rep(affix, '            case WEAPON -> "무기";\n            case RANGED -> "원거리";',
                     '            case WEAPON -> "무기";\n            case SPEAR -> "스피어";\n            case RANGED -> "원거리";')
          rep(affix,
              'if (rarity <= 0 || category == Category.WEAPON || category == Category.RANGED || category == Category.MACE || category == Category.SHIELD || category == Category.ARMOR || category == Category.NONE) return 1.0D;',
              'if (rarity <= 0 || category == Category.WEAPON || category == Category.SPEAR || category == Category.RANGED || category == Category.MACE || category == Category.SHIELD || category == Category.ARMOR || category == Category.NONE) return 1.0D;')
          rep(affix,
              '''    public static double damageMultiplier(ItemStack stack) {
        int rarity = rarity(stack);
        if (rarity <= 0 || category(stack) != Category.WEAPON || !has(stack, PRIMARY)) return 1.0D;
        return switch (rarity) { case 1 -> 1.08D; case 2 -> 1.15D; default -> 1.25D; };
    }
''',
              '''    public static double damageMultiplier(ItemStack stack) {
        int rarity = rarity(stack);
        Category category = category(stack);
        if (rarity <= 0 || !has(stack, PRIMARY)) return 1.0D;
        if (category == Category.WEAPON) return switch (rarity) { case 1 -> 1.08D; case 2 -> 1.15D; default -> 1.25D; };
        if (category == Category.SPEAR) return switch (rarity) { case 1 -> 1.06D; case 2 -> 1.12D; default -> 1.20D; };
        return 1.0D;
    }
''')
          rep(affix,
              '''    public static boolean isMace(ItemStack stack) {
        return categoryForItem(stack) == Category.MACE;
    }
''',
              '''    public static boolean isSpear(ItemStack stack) {
        return categoryForItem(stack) == Category.SPEAR;
    }

    public static double spearLineReachBonus(ItemStack stack) {
        if (category(stack) != Category.SPEAR || !has(stack, SCALE)) return 0.0D;
        return switch (rarity(stack)) { case 1 -> 0.5D; case 2 -> 1.0D; case 3 -> 1.5D; default -> 0.0D; };
    }

    public static int spearLineTargetBonus(ItemStack stack) {
        if (category(stack) != Category.SPEAR || !has(stack, SECONDARY)) return 0;
        return switch (rarity(stack)) { case 1 -> 1; case 2 -> 2; case 3 -> 3; default -> 0; };
    }

    public static double spearLineKnockbackBonus(ItemStack stack) {
        if (category(stack) != Category.SPEAR || !has(stack, UTILITY)) return 0.0D;
        return switch (rarity(stack)) { case 1 -> 0.08D; case 2 -> 0.16D; case 3 -> 0.24D; default -> 0.0D; };
    }

    public static boolean isMace(ItemStack stack) {
        return categoryForItem(stack) == Category.MACE;
    }
''')
          rep(affix,
              '        if (stack.is(ItemTags.SWORDS)) return Category.WEAPON;',
              '        if (stack.is(ItemTags.SPEARS)) return Category.SPEAR;\n        if (stack.is(ItemTags.SWORDS)) return Category.WEAPON;')
          rep(affix,
              'if (PRIMARY.equals(key)) return category == Category.WEAPON ? "파괴" : category == Category.RANGED ? "강궁" : category == Category.MACE ? "충각" : category == Category.SHIELD ? "압력" : category == Category.ARMOR ? "수호" : "가속";',
              'if (PRIMARY.equals(key)) return category == Category.WEAPON ? "파괴" : category == Category.SPEAR ? "관통" : category == Category.RANGED ? "강궁" : category == Category.MACE ? "충각" : category == Category.SHIELD ? "압력" : category == Category.ARMOR ? "수호" : "가속";')
          rep(affix,
              '            case WEAPON -> "파급"; case RANGED -> "산개";',
              '            case WEAPON -> "파급"; case SPEAR -> "돌파"; case RANGED -> "산개";')
          rep(affix,
              '            case WEAPON -> "사냥"; case RANGED -> "연쇄";',
              '            case WEAPON -> "사냥"; case SPEAR -> "대열"; case RANGED -> "연쇄";')
          rep(affix,
              '            case WEAPON -> "충격"; case RANGED -> "충격";',
              '            case WEAPON -> "충격"; case SPEAR -> "충압"; case RANGED -> "충격";')
          rep(affix,
              'WEAPON("weapon"), RANGED("ranged"), PICKAXE("pickaxe")',
              'WEAPON("weapon"), SPEAR("spear"), RANGED("ranged"), PICKAXE("pickaxe")')

          combat = 'src/main/java/kr/moonseungjun/survivalascension/combat/CombatProgression.java'
          rep(combat,
              '''        if (event.getSource().is(DamageTypeTags.IS_MACE_SMASH) && AscensionAffixes.isMace(weapon)) {
            tryMaceImpact(player, serverLevel, primary, weapon, level);
            return;
        }

        if (tryShockwave(player, serverLevel, primary, event, scaledDamage, level)) return;
''',
              '''        if (event.getSource().is(DamageTypeTags.IS_MACE_SMASH) && AscensionAffixes.isMace(weapon)) {
            tryMaceImpact(player, serverLevel, primary, weapon, level);
            return;
        }

        if (AscensionAffixes.isSpear(weapon)) {
            trySpearDrive(player, serverLevel, primary, weapon, level);
            return;
        }

        if (tryShockwave(player, serverLevel, primary, event, scaledDamage, level)) return;
''')
          rep(combat,
              '    private static void tryMaceImpact(ServerPlayer player, ServerLevel level, LivingEntity primary,',
              '''    private static void trySpearDrive(ServerPlayer player, ServerLevel level, LivingEntity primary,
                                      ItemStack spear, int combatLevel) {
        if (combatLevel < 30 || player.isShiftKeyDown()) return;

        Vec3 direction = player.getLookAngle().multiply(1.0D, 0.0D, 1.0D);
        if (direction.lengthSqr() <= 1.0E-5D) return;
        direction = direction.normalize();
        Entity carrier = player.getVehicle() != null ? player.getVehicle() : player;
        Vec3 motion = carrier.getDeltaMovement().multiply(1.0D, 0.0D, 1.0D);
        double forwardSpeed = motion.x * direction.x + motion.z * direction.z;
        if (forwardSpeed < 0.08D) return;

        boolean fieldMastery = combatLevel >= 100 && ExpeditionProgression.hasFieldMastery(player);
        double reach = fieldMastery ? 7.5D : combatLevel >= 100 ? 6.5D : combatLevel >= 90 ? 5.5D : combatLevel >= 60 ? 4.5D : 3.5D;
        int targetLimit = fieldMastery ? 5 : combatLevel >= 100 ? 4 : combatLevel >= 90 ? 3 : combatLevel >= 60 ? 2 : 1;
        double basePush = fieldMastery ? 0.55D : combatLevel >= 100 ? 0.48D : combatLevel >= 90 ? 0.40D : combatLevel >= 60 ? 0.32D : 0.25D;
        reach = Math.min(9.0D, reach + AscensionAffixes.spearLineReachBonus(spear));
        targetLimit = Math.min(8, targetLimit + AscensionAffixes.spearLineTargetBonus(spear));
        double pushStrength = Math.min(1.10D, basePush + Math.min(0.35D, forwardSpeed * 0.85D)
                + AscensionAffixes.spearLineKnockbackBonus(spear));
        final Vec3 lineDirection = direction;
        final double lineReach = reach;
        final double halfWidthSqr = 1.35D * 1.35D;

        List<LivingEntity> nearby = level.getEntitiesOfClass(
                LivingEntity.class,
                primary.getBoundingBox().inflate(lineReach, 1.5D, lineReach),
                candidate -> {
                    if (candidate == primary || candidate == player || !candidate.isAlive()
                            || !ContentPackCompatibility.isCombatTarget(candidate) || player.isAlliedTo(candidate)) return false;
                    Vec3 delta = candidate.position().subtract(primary.position());
                    double forward = delta.x * lineDirection.x + delta.z * lineDirection.z;
                    if (forward <= 0.0D || forward > lineReach) return false;
                    double lateralX = delta.x - lineDirection.x * forward;
                    double lateralZ = delta.z - lineDirection.z * forward;
                    return lateralX * lateralX + lateralZ * lateralZ <= halfWidthSqr;
                });
        nearby.sort(Comparator.comparingDouble(candidate -> {
            Vec3 delta = candidate.position().subtract(primary.position());
            return delta.x * lineDirection.x + delta.z * lineDirection.z;
        }));

        int pushed = 0;
        for (LivingEntity candidate : nearby) {
            if (pushed >= targetLimit) break;
            double resistance = Math.max(0.0D, Math.min(1.0D, candidate.getAttributeValue(Attributes.KNOCKBACK_RESISTANCE)));
            double strength = pushStrength * (1.0D - resistance);
            if (strength <= 0.0D) continue;
            candidate.setDeltaMovement(candidate.getDeltaMovement().add(
                    lineDirection.x * strength, 0.06D * (1.0D - resistance), lineDirection.z * strength));
            candidate.hurtMarked = true;
            pushed++;
        }
    }

    private static void tryMaceImpact(ServerPlayer player, ServerLevel level, LivingEntity primary,''')

