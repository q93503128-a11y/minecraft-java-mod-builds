          changelog = 'CHANGELOG.md'
          rep(changelog, '## 0.54.0-alpha.1', '''## 0.55.0-alpha.1
- Added Minecraft 26.2 `minecraft:sulfur_caves` to the existing Deep expedition integration tag.
