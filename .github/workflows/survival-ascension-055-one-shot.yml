name: Survival Ascension 0.55 One Shot

on:
  push:
    branches: [main]
    paths:
      - 'projects/survival-ascension/.alpha55-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch, audit, build, verify and publish 0.55
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/survival_ascension_055_patch.py
          cd projects/survival-ascension
          python3 tools/test_release_source.py
          python3 tools/test_release_content_pack.py
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain
          test -f build/libs/survivalascension-0.55.0-alpha.1.jar
          python3 tools/verify_release_jar.py build/libs/survivalascension-0.55.0-alpha.1.jar
          python3 tools/build_mrpack.py --survival-jar build/libs/survivalascension-0.55.0-alpha.1.jar --output /tmp/Survival-Ascension-0.55.0-alpha.1-content-preview.mrpack
          git diff --check
          cd ../..
          rm -f projects/survival-ascension/.alpha55-trigger
          rm -f .github/workflows/survival-ascension-055-one-shot.yml
          rm -f .github/scripts/survival_ascension_055_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/survival-ascension .github/workflows/survival-ascension-055-one-shot.yml .github/scripts/survival_ascension_055_patch.py
          git commit -m 'Release Survival Ascension 0.55 native spear and sulfur integration'
          for attempt in 1 2 3 4 5 6; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
