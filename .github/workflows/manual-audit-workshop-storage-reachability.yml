name: Manual Audit Workshop Storage Reachability

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/manual-audit-workshop-storage-reachability.yml'
      - 'projects/frontier-settlement/tools/patch_workshop_storage_reachability.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply workshop storage reachability hardening
        run: python3 projects/frontier-settlement/tools/patch_workshop_storage_reachability.py

      - name: Frontier source audit
        working-directory: projects/frontier-settlement
        run: python3 tools/test_alpha91_source.py

      - name: Build Frontier Settlement
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Build Survival Ascension regression
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Commit validated workshop reachability fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerStorageNavigation.java \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkshopService.java \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementAdvancedWorkshopService.java \
            projects/frontier-settlement/tools/test_alpha91_source.py
          if git diff --cached --quiet; then
            echo 'No workshop storage reachability source changes to commit.'
            exit 0
          fi
          git commit -m 'Harden workshop storage reachability'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
