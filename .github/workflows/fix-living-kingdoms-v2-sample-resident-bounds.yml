name: Fix Living Kingdoms v2 sample resident bounds

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_v2_sample_resident_bounds.py'
      - '.github/workflows/fix-living-kingdoms-v2-sample-resident-bounds.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Repair sample resident observation bounds
        run: python .github/scripts/fix_living_kingdoms_v2_sample_resident_bounds.py
      - name: Compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Commit Java repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorTicketReaper.java
          git diff --cached --quiet && exit 0
          git commit -m 'Observe exterior resident samples at physical homes'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot repair; remove after the Java commit lands. Triggered explicitly.
