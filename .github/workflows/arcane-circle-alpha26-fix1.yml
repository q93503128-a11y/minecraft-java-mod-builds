name: Arcane Circle alpha.26 rewrite fix 1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-circle-alpha26-fix1.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Fix classification collisions and compact layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/SpellCinematicDirector.java')
          s=p.read_text()
          s=s.replace('case "fireball","chromatic_orb","freezing_sphere","delayed_blast_fireball","solar_guard" ->', 'case "fireball","chromatic_orb","freezing_sphere" ->')
          s=s.replace('case "power_word_kill","eyebite","phantasmal_killer","feeblemind","dominate_person","dominate_monster","mass_suggestion","hold_person","hold_monster","vampiric_touch" ->', 'case "power_word_kill","eyebite","phantasmal_killer","feeblemind","dominate_person","dominate_monster","mass_suggestion","vampiric_touch" ->')
          p.write_text(s)

          p=Path('projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/GrimoireScreen.java')
          s=p.read_text()
          old='Rect browserViewport(){Rect b=body();int detail=isWide()?210:0;return new Rect(b.x()+38,b.y()+31,b.w()-42-detail,b.h()-68);}Rect detail(){Rect b=body();if(!isWide())return new Rect(b.right()-1,b.y()+31,1,b.h()-68);return new Rect(b.right()-205,b.y()+31,205,b.h()-68);}'
          new='Rect browserViewport(){Rect b=body();int detail=Math.max(125,Math.min(205,b.w()/3));return new Rect(b.x()+38,b.y()+31,Math.max(72,b.w()-42-detail),b.h()-68);}Rect detail(){Rect b=body();int w=Math.max(125,Math.min(205,b.w()/3));return new Rect(b.right()-w,b.y()+31,w,b.h()-68);}'
          if old not in s: raise SystemExit('compact layout anchor missing')
          p.write_text(s.replace(old,new))
          PY
      - name: Compile Java 25
        working-directory: projects/arcane-circle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean compileJava --stacktrace --console=plain
      - name: Commit verified fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/SpellCinematicDirector.java projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/GrimoireScreen.java
          git commit -m 'Fix Arcane Circle alpha.26 cinematic classification and compact codex'
          git pull --rebase origin main
          git push origin HEAD:main
