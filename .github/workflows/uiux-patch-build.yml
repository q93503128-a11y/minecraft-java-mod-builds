name: UIUX patch build

on:
  push:
    paths:
      - '.github/workflows/uiux-patch-build.yml'

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Allow soft vegetation on Frontier building sites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java')
          text = path.read_text(encoding='utf-8')

          old_clearance = '            if (state.isAir() || state.canBeReplaced() || state.is(BlockTags.LEAVES)) continue;'
          new_clearance = '            if (isSoftVegetation(state)) continue;'
          if old_clearance not in text:
              raise SystemExit('grade clearance target not found')
          text = text.replace(old_clearance, new_clearance, 1)

          old_method = (
              '    private static boolean isSafeAboveGround(BlockState state, int relativeY) {\n'
              '        if (state.isAir() || state.canBeReplaced() || state.is(BlockTags.LEAVES)) return true;\n'
              '        return relativeY <= MAX_TERRAIN_CUT_HEIGHT && isNaturalGround(state);\n'
              '    }\n'
          )
          new_method = (
              '    private static boolean isSafeAboveGround(BlockState state, int relativeY) {\n'
              '        if (isSoftVegetation(state)) return true;\n'
              '        return relativeY <= MAX_TERRAIN_CUT_HEIGHT && isNaturalGround(state);\n'
              '    }\n\n'
              '    private static boolean isSoftVegetation(BlockState state) {\n'
              '        if (state.isAir()) return true;\n'
              '        if (!state.getFluidState().isEmpty()) return false;\n'
              '        return state.canBeReplaced()\n'
              '                || state.is(BlockTags.LEAVES)\n'
              '                || state.is(BlockTags.REPLACEABLE_BY_TREES)\n'
              '                || state.getBlock() instanceof net.minecraft.world.level.block.BushBlock\n'
              '                || state.getBlock() instanceof net.minecraft.world.level.block.SnowLayerBlock;\n'
              '    }\n'
          )
          if old_method not in text:
              raise SystemExit('site clearance method target not found')
          text = text.replace(old_method, new_method, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit construction placement fix
        shell: bash
        run: |
          git config user.name 'frontier-uiux-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java
          if ! git diff --cached --quiet; then
            git commit -m 'Allow soft vegetation on building sites [skip ci]'
            git push origin HEAD:main
          fi

      - name: Build Frontier Settlement
        shell: bash
        run: |
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Build Survival Ascension
        shell: bash
        run: |
          cd projects/survival-ascension
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Upload Frontier Settlement
        uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-uiux
          path: projects/frontier-settlement/build/libs/*.jar
          if-no-files-found: error

      - name: Upload Survival Ascension
        uses: actions/upload-artifact@v4
        with:
          name: survival-ascension-uiux
          path: projects/survival-ascension/build/libs/*.jar
          if-no-files-found: error
