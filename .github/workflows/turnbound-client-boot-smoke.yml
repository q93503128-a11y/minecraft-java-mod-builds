name: TURNBOUND Fabric Client Boot Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - turnbound-content-rebuild
    paths:
      - '.github/workflows/turnbound-client-boot-smoke.yml'

permissions:
  contents: read

jobs:
  client-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Prepare virtual display
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb x11-utils libgl1-mesa-dri libgl1 libxrandr2 libxi6 \
            libxcursor1 libxinerama1 libasound2t64 imagemagick
      - name: Launch Fabric 1.20.1 client and detect a stable window
        working-directory: projects/turnbound
        shell: bash
        timeout-minutes: 11
        run: |
          set -uo pipefail
          export DISPLAY=:98
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          Xvfb "$DISPLAY" -screen 0 1280x720x24 +extension GLX +render -noreset -nolisten tcp > xvfb.log 2>&1 &
          xvfb_pid=$!
          sleep 3
          timeout -s TERM -k 10s 420s gradle runClient --no-daemon > client-boot.log 2>&1 &
          launch_pid=$!
          success=0
          for i in $(seq 1 330); do
            if xwininfo -root -tree 2>/dev/null | grep -Eiq 'Minecraft'; then
              sleep 5
              proc_state="$(ps -o stat= -p "$launch_pid" 2>/dev/null | tr -d ' ' || true)"
              if [ -n "$proc_state" ] && [[ "$proc_state" != Z* ]]; then
                success=1
                echo 'CLIENT BOOT SMOKE PASS: Minecraft window detected and remained alive'
              fi
              break
            fi
            proc_state="$(ps -o stat= -p "$launch_pid" 2>/dev/null | tr -d ' ' || true)"
            if [ -z "$proc_state" ] || [[ "$proc_state" == Z* ]]; then
              echo 'Client exited before successful boot detection'
              break
            fi
            sleep 1
          done
          xwininfo -root -tree > client-window-tree.txt 2>&1 || true
          import -window root client-boot.png 2>/dev/null || true
          kill "$launch_pid" 2>/dev/null || true
          kill "$xvfb_pid" 2>/dev/null || true
          test "$success" -eq 1 || { tail -120 client-boot.log; exit 1; }
      - name: Upload logs and window capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: turnbound-fabric-client-boot
          path: |
            projects/turnbound/client-boot.log
            projects/turnbound/client-window-tree.txt
            projects/turnbound/client-boot.png
            projects/turnbound/xvfb.log
            projects/turnbound/run/client/logs/latest.log
          if-no-files-found: warn
