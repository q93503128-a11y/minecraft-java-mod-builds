name: Arcane alpha72 self patch v2

on:
  push:
    branches: [main]
    paths:
      - '.github/arcane-alpha72-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alpha72 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/arcane-alpha72-patch.py
          rm -f .github/arcane-alpha72-patch.py .github/arcane-alpha72-trigger.txt .github/workflows/arcane-alpha72-selfpatch-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/arcane-circle .github
          git diff --cached --check
          git commit -m 'Arcane alpha.72 third-circle authority audit [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
