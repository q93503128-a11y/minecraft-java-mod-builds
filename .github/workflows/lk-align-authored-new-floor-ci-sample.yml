name: Fix Living Kingdoms authored stair support self-collision

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lk-align-authored-new-floor-ci-sample.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Make authored route supports body-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java')
          s = p.read_text(encoding='utf-8')

          anchor = '''        for (RouteNode node : routeNodes) {
              routeFeet.add(node.world().pos());
              routeHeads.add(new BlockPos(node.world().x(), node.world().y() + 1, node.world().z()));
          }

          Block floorBlock = floorBlock(placement.role());'''
          replacement = '''        for (RouteNode node : routeNodes) {
              routeFeet.add(node.world().pos());
              routeHeads.add(new BlockPos(node.world().x(), node.world().y() + 1, node.world().z()));
          }
          Set<BlockPos> routeBody = new HashSet<>(routeFeet);
          routeBody.addAll(routeHeads);
          for (RouteNode node : routeNodes) {
              if (stairs.containsKey(node.world())) continue;
              int supportLocalY = node.local().y() - 1;
              if (sourceOccupied.contains(localKey(
                      node.local().x(), supportLocalY, node.local().z()))) continue;
              BlockPos supportPos = new BlockPos(
                      node.world().x(), node.world().y() - 1, node.world().z());
              if (routeBody.contains(supportPos)) {
                  throw new IllegalStateException(
                          "Erden required flat-route support collides with route body fragment="
                                  + placement.fragmentKey() + " local=" + node.local()
                                  + " support=" + supportPos);
              }
          }

          Block floorBlock = floorBlock(placement.role());'''
          if s.count(anchor) != 1:
              raise SystemExit(f'static support-safety anchor count={s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)

          anchor = '''        Block support = supportBlock(plan.role());
          for (RouteNode node : plan.routeNodes()) {'''
          replacement = '''        Block support = supportBlock(plan.role());
          Set<BlockPos> protectedRouteBody = new HashSet<>();
          for (RouteNode routeNode : plan.routeNodes()) {
              protectedRouteBody.add(routeNode.world().pos());
              protectedRouteBody.add(new BlockPos(
                      routeNode.world().x(), routeNode.world().y() + 1, routeNode.world().z()));
          }
          for (RouteNode node : plan.routeNodes()) {'''
          if s.count(anchor) != 1:
              raise SystemExit(f'runtime route-body anchor count={s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)

          anchor = '''            BlockPos supportPos = new BlockPos(
                      node.world().x(), node.world().y() - 1, node.world().z());
              if (sourceFloorAir && level.getBlockState(supportPos).isAir()) {
                  level.setBlock(supportPos, support.defaultBlockState(), UPDATE_FLAGS);
              }'''
          replacement = '''            BlockPos supportPos = new BlockPos(
                      node.world().x(), node.world().y() - 1, node.world().z());
              boolean supportHitsRouteBody = protectedRouteBody.contains(supportPos);
              if (sourceFloorAir && supportHitsRouteBody && stair == null) {
                  return false;
              }
              if (sourceFloorAir && !supportHitsRouteBody
                      && level.getBlockState(supportPos).isAir()) {
                  level.setBlock(supportPos, support.defaultBlockState(), UPDATE_FLAGS);
              }'''
          if s.count(anchor) != 1:
              raise SystemExit(f'support placement anchor count={s.count(anchor)}')
          s = s.replace(anchor, replacement, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Java 25 compile
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Publish support collision fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java
          git commit -m 'fix(living-kingdoms): prevent authored stair support self-collision'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
