name: Diagnose Living Kingdoms authored new-floor blocker stage safely

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lk-align-authored-new-floor-ci-sample.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Add four-stage CI diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java')
          s = p.read_text(encoding='utf-8')

          replacements = [
              (
                  '            if (!ground.isComplete(key, ErdenUrbanInteriorBuilder.INTERIOR_REVISION)) continue;',
                  '''            if (!ground.isComplete(key, ErdenUrbanInteriorBuilder.INTERIOR_REVISION)) {
                      logCiStage(level, plan, "ground_not_complete");
                      continue;
                  }'''
              ),
              (
                  '            if (!chunksReady(level, plan.bounds())) continue;',
                  '''            if (!chunksReady(level, plan.bounds())) {
                      logCiStage(level, plan, "chunks_not_ready");
                      continue;
                  }'''
              ),
              (
                  '                if (!materialize(level, plan, true)) continue;',
                  '''                if (!materialize(level, plan, true)) {
                      logCiStage(level, plan, "materialize_rejected");
                      continue;
                  }'''
              ),
              (
                  '                data.markPrepared(key, FLOOR_REVISION);',
                  '''                data.markPrepared(key, FLOOR_REVISION);
                  if (plan.entranceKey() == ciPlanKey) {
                      LivingKingdoms.LOGGER.info(
                              "LK_ERDEN_AUTHORED_NEW_FLOOR_STAGE role={} entrance={},{} stage=materialized floor_cells={} route_nodes={} stairs={}",
                              plan.role(), plan.entranceX(), plan.entranceZ(),
                              plan.floorBlocks().size(), plan.routeNodes().size(), plan.stairs().size());
                  }'''
              ),
              (
                  '''            if (verify(level, plan)) {
                      data.markCompleted(key, FLOOR_REVISION);
                  }''',
                  '''            if (verify(level, plan)) {
                      data.markCompleted(key, FLOOR_REVISION);
                  } else {
                      logCiStage(level, plan, "verify_rejected");
                  }'''
              )
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'stage patch anchor count={count}: {old[:90]!r}')
              s = s.replace(old, new, 1)

          anchor = '    private static boolean chunksReady(ServerLevel level, Bounds bounds) {'
          helper = '''    private static void logCiStage(
                  ServerLevel level, PlacementPlan plan, String stage) {
              if (plan.entranceKey() != ciPlanKey || level.getGameTime() % 40L != 0L) return;
              LivingKingdoms.LOGGER.info(
                      "LK_ERDEN_AUTHORED_NEW_FLOOR_WAIT role={} entrance={},{} stage={}",
                      plan.role(), plan.entranceX(), plan.entranceZ(), stage);
          }

          ''' + anchor
          if s.count(anchor) != 1:
              raise SystemExit(f'helper anchor count={s.count(anchor)}')
          s = s.replace(anchor, helper, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Java 25 compile
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Publish stage diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java
          git commit -m 'test(living-kingdoms): diagnose authored upper-floor blocker stage'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
