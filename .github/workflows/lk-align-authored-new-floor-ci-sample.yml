name: Retain Living Kingdoms authored new-floor CI chunks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lk-align-authored-new-floor-ci-sample.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Retain exact CI sample footprint through materialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java')
          s = p.read_text(encoding='utf-8')

          old = '''                ErdenCapitalStreamingBuilder.requestChunk(level, chunkX, chunkZ);
                      }
                  }
                  ciPlanKey = sample.entranceKey();
          '''
          new = '''                ErdenCapitalStreamingBuilder.requestChunk(level, chunkX, chunkZ);
                          // Capital streaming releases its construction ticket as soon as this cell is
                          // built. The authored-floor sample spans several cells, so retain only this
                          // deliberate CI footprint until every cell can be verified together.
                          level.setChunkForced(chunkX, chunkZ, true);
                      }
                  }
                  ciPlanKey = sample.entranceKey();
          '''
          if s.count(old) != 1:
              raise SystemExit(f'CI retain patch anchor count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''        ciPassed = true;
                  LivingKingdoms.LOGGER.info(
                          "LK_ERDEN_AUTHORED_NEW_FLOOR_PASS candidates={} sample_role={} sample_floor_cells={} sample_route_nodes={} sample_stairs={} stairwell_openings={} target_y={} source_blocks_cut=0 source_air_floor=true structural_approval=true zero_cut_route=true synthetic_floor_required=false revision={}",
          '''
          new = '''        ciPassed = true;
                  for (int chunkX = Math.floorDiv(sample.bounds().minX(), 16);
                       chunkX <= Math.floorDiv(sample.bounds().maxX(), 16); chunkX++) {
                      for (int chunkZ = Math.floorDiv(sample.bounds().minZ(), 16);
                           chunkZ <= Math.floorDiv(sample.bounds().maxZ(), 16); chunkZ++) {
                          level.setChunkForced(chunkX, chunkZ, false);
                      }
                  }
                  LivingKingdoms.LOGGER.info(
                          "LK_ERDEN_AUTHORED_NEW_FLOOR_PASS candidates={} sample_role={} sample_floor_cells={} sample_route_nodes={} sample_stairs={} stairwell_openings={} target_y={} source_blocks_cut=0 source_air_floor=true structural_approval=true zero_cut_route=true synthetic_floor_required=false ci_chunks_released=true revision={}",
          '''
          if s.count(old) != 1:
              raise SystemExit(f'CI release patch anchor count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Java 25 compile
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Publish source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java
          git commit -m 'test(living-kingdoms): retain authored upper-floor CI chunks'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
