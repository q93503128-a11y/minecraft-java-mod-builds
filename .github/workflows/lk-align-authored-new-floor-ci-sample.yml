name: Align Living Kingdoms authored new-floor CI sample

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lk-align-authored-new-floor-ci-sample.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Align CI sample with ground-floor diagnostic entrance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java')
          s = p.read_text(encoding='utf-8')
          old = '''    private static void requestCiSampleChunks(ServerLevel level) {
                  if (ciChunksRequested
                          || !"1".equals(System.getenv("LIVING_KINGDOMS_CI_REALM_TEST"))) return;
                  PlacementPlan sample = PLANS.values().stream().findFirst().orElse(null);
                  if (sample == null) return;
                  for (int chunkX = Math.floorDiv(sample.bounds().minX(), 16);
                       chunkX <= Math.floorDiv(sample.bounds().maxX(), 16); chunkX++) {
                      for (int chunkZ = Math.floorDiv(sample.bounds().minZ(), 16);
                           chunkZ <= Math.floorDiv(sample.bounds().maxZ(), 16); chunkZ++) {
                          ErdenCapitalStreamingBuilder.requestChunk(level, chunkX, chunkZ);
                      }
                  }
                  ciPlanKey = sample.entranceKey();
                  ciChunksRequested = true;
              }
          '''
          new = '''    private static void requestCiSampleChunks(ServerLevel level) {
                  if (ciChunksRequested
                          || !"1".equals(System.getenv("LIVING_KINGDOMS_CI_REALM_TEST"))) return;
                  ExternalUrbanFabricBuilder.UrbanEntrance diagnostic =
                          ExternalUrbanFabricBuilder.diagnosticEntrance();
                  PlacementPlan sample = diagnostic == null ? null
                          : PLANS.get(entranceKey(diagnostic.x(), diagnostic.z()));
                  if (sample == null) {
                      sample = PLANS.values().stream().findFirst().orElse(null);
                  }
                  if (sample == null) return;
                  for (int chunkX = Math.floorDiv(sample.bounds().minX(), 16);
                       chunkX <= Math.floorDiv(sample.bounds().maxX(), 16); chunkX++) {
                      for (int chunkZ = Math.floorDiv(sample.bounds().minZ(), 16);
                           chunkZ <= Math.floorDiv(sample.bounds().maxZ(), 16); chunkZ++) {
                          ErdenCapitalStreamingBuilder.requestChunk(level, chunkX, chunkZ);
                      }
                  }
                  ciPlanKey = sample.entranceKey();
                  ciChunksRequested = true;
                  LivingKingdoms.LOGGER.info(
                          "Retained Erden authored-new-floor CI sample role={} entrance={},{} bounds={}..{} x {}..{} floor_cells={} route_nodes={}",
                          sample.role(), sample.entranceX(), sample.entranceZ(),
                          sample.bounds().minX(), sample.bounds().maxX(),
                          sample.bounds().minZ(), sample.bounds().maxZ(),
                          sample.floorBlocks().size(), sample.routeNodes().size());
              }
          '''
          if s.count(old) != 1:
              raise SystemExit(f'CI sample patch anchor count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Java 25 compile
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Publish source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java
          git commit -m 'test(living-kingdoms): align authored upper-floor CI sample'
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
