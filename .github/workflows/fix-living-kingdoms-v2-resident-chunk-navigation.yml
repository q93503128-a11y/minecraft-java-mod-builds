name: Fix Living Kingdoms v2 resident chunk navigation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_v2_resident_chunk_navigation.py'
      - '.github/workflows/fix-living-kingdoms-v2-resident-chunk-navigation.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Repair v2 resident chunk ownership and pathfinding bounds
        run: python .github/scripts/fix_living_kingdoms_v2_resident_chunk_navigation.py
      - name: Compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Commit Java repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorWorkforceManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'Gate exterior residents on physical home chunks'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot repair; remove after the Java commit lands.
