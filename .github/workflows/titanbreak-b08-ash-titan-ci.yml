name: TITANBREAK B08 Ash Titan CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/titanbreak/**'
      - '.github/workflows/titanbreak-b08-ash-titan-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ash-titan-b08:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify canonical B08 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          project = Path('projects/titanbreak')
          root = project / 'src/main'
          java = root / 'java/kr/moonseungjun/titanbreak'
          assets = root / 'resources/assets/titanbreak'

          entity = (java / 'entity/AshTitanEntity.java').read_text(encoding='utf-8')
          registry = (java / 'registry/ModBossEntities.java').read_text(encoding='utf-8')
          reward = (java / 'combat/AshTitanRewardService.java').read_text(encoding='utf-8')
          encounter = (java / 'world/AshTitanEncounterService.java').read_text(encoding='utf-8')
          storm_encounter = (java / 'world/StormLeviathanEncounterService.java').read_text(encoding='utf-8')
          renderers = (java / 'client/TitanEntityRenderers.java').read_text(encoding='utf-8')
          renderer = (java / 'client/AshTitanRenderer.java').read_text(encoding='utf-8')
          catalog = (java / 'augmentation/AugmentationCatalog.java').read_text(encoding='utf-8')
          gradle = (project / 'gradle.properties').read_text(encoding='utf-8')
          asset_registry = (project / 'ASSET_REGISTRY.md').read_text(encoding='utf-8')

          version = re.search(r'mod_version=0\.1\.0-alpha\.(\d+)', gradle)
          assert version and int(version.group(1)) >= 49, 'B08 requires alpha.49 or newer'
          assert 'CANONICAL_VISIBLE_MAX_HEALTH = 20_000.0D' in entity
          assert 'return 20;' in entity
          for token in (
              'COOLING_PLATE_0','COOLING_PLATE_1','COOLING_PLATE_2',
              'COOLING_PLATE_3','COOLING_PLATE_4','COOLING_PLATE_5',
              'RADIATION_ARM_LEFT','RADIATION_ARM_RIGHT','RADIANT_HEART','HEAD_SENSOR',
              'brokenCoolingPlateCount() >= 4','radiantHeartExposed()',
              'overheatMultiplier()','passiveHeatField(','heatShockwave(','meltGround(',
              'startBeamSweep(','launchMoltenProjectile(','overheatZone('
          ):
              assert token in entity, token
          assert 'tickRateManager().setTickRate' not in entity

          assert 'ASH_TITAN' in registry
          assert 'CombatScale.toInternal(AshTitanEntity.CANONICAL_VISIBLE_MAX_HEALTH)' in registry
          assert 'ASH_RADIANT_HEART.get(), 1' in reward
          assert 'RADIATION_CORE.get(), 2' in reward
          assert 'HEAT_SINK.get(), 4 + victim.getRandom().nextInt(3)' in reward
          assert 'recordBossFirstKill(player, "ash_titan", FIRST_KILL_RD, 7)' in reward
          assert 'hasBossFirstKill("storm_leviathan")' in encounter
          assert 'hasBossFirstKill("ash_titan")' in encounter
          assert 'ModBossEntities.ASH_TITAN.get()' in encounter
          assert 'AshTitanEncounterService.tick(player, progression)' in storm_encounter
          assert 'ModBossEntities.ASH_TITAN.get(), AshTitanRenderer::new' in renderers
          assert 'withScale(30.0F)' in renderer

          assert 'recipe("radiation_core", 2, "heat_sink", 2, "ash_radiant_heart", 1)' in catalog

          geo = assets / 'geckolib/models/entity/ash_titan.geo.json'
          anim = assets / 'geckolib/animations/entity/ash_titan.animation.json'
          texture = assets / 'textures/entity/ash_titan.png'
          for path in (geo, anim, texture):
              assert path.is_file(), path
          geo_data = json.loads(geo.read_text(encoding='utf-8'))
          bone_names = {bone['name'] for bone in geo_data['minecraft:geometry'][0]['bones']}
          for bone in (
              'cooling_plate_0','cooling_plate_1','cooling_plate_2','cooling_plate_3',
              'cooling_plate_4','cooling_plate_5','radiation_arm_left','radiation_arm_right',
              'heart_shell','radiant_heart','head_sensor','overheat_ring','radiant_crown'
          ):
              assert bone in bone_names, bone
          animations = json.loads(anim.read_text(encoding='utf-8')).get('animations', {})
          for key in ('misc.idle','move.walk','attack.swing'):
              assert key in animations, key

          overlay = root / 'resources/assets/titanbreak_boss/lang'
          for lang in ('en_us','ko_kr'):
              data = json.loads((overlay / f'{lang}.json').read_text(encoding='utf-8'))
              for key in (
                  'entity.titanbreak.ash_titan',
                  'message.titanbreak.ash_titan_warning',
                  'message.titanbreak.ash_titan_arrival',
                  'message.titanbreak.ash_titan_defeated'
              ):
                  assert key in data, (lang, key)

          assert '| Ash Titan model / animation / texture |' in asset_registry
          PY

      - name: Build TITANBREAK
        working-directory: projects/titanbreak
        run: ./gradlew --no-daemon clean build

      - name: Verify built JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          jars = [p for p in Path('projects/titanbreak/build/libs').glob('*.jar')
                  if '-sources' not in p.name and '-javadoc' not in p.name]
          assert jars, 'runtime JAR missing'
          assert any('alpha.49' in p.name for p in jars), [p.name for p in jars]
          print('\n'.join(str(p) for p in jars))
          PY

      - name: Upload alpha.49 test JAR
        uses: actions/upload-artifact@v4
        with:
          name: titanbreak-alpha49-test
          path: projects/titanbreak/build/libs/*.jar
          if-no-files-found: error
