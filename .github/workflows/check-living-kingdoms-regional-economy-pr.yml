name: Check Living Kingdoms regional economy PR

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/check-living-kingdoms-regional-economy-pr.yml'

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms

jobs:
  compile:
    name: Java 25 clean compile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build --stacktrace --console=plain
