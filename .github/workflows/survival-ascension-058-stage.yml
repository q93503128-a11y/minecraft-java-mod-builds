name: Stage Survival Ascension 0.58

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/survival-ascension-058-stage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: survival-ascension-058-stage
  cancel-in-progress: true

jobs:
  stage:
    name: Patch, audit, build and publish 0.58 source
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply deterministic 0.58 patch
        shell: bash
        run: |
          set -euo pipefail
          echo patch > "$GITHUB_WORKSPACE/survival-ascension-058-stage-phase.txt"
          python3 -m py_compile .github/scripts/survival_ascension_058_patch_hotfix.py
          python3 .github/scripts/survival_ascension_058_patch_hotfix.py
          python3 -m py_compile .github/scripts/survival_ascension_058_patch.py
          python3 .github/scripts/survival_ascension_058_patch.py
          git diff --check

      - name: Source and content-pack audits
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          echo audits > "$GITHUB_WORKSPACE/survival-ascension-058-stage-phase.txt"
          python3 tools/test_release_source.py 2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-058-stage-audit.log"
          python3 tools/test_release_content_pack.py 2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-058-stage-content-pack.log"

      - name: Java 25 clean build
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          echo build > "$GITHUB_WORKSPACE/survival-ascension-058-stage-phase.txt"
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-058-stage-gradle.log"

      - name: Dedicated server ready-state smoke
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          echo server-smoke > "$GITHUB_WORKSPACE/survival-ascension-058-stage-phase.txt"
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          log="$GITHUB_WORKSPACE/survival-ascension-058-stage-server.log"
          rm -f "$log"
          setsid ./gradlew --no-daemon --no-configuration-cache runServer --console=plain > "$log" 2>&1 &
          pid=$!
          ready=0
          for _ in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$log" 2>/dev/null; then ready=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -INT -- "-$pid" 2>/dev/null || true
            for _ in $(seq 1 15); do kill -0 "$pid" 2>/dev/null || break; sleep 1; done
            kill -KILL -- "-$pid" 2>/dev/null || true
          fi
          wait "$pid" 2>/dev/null || true
          cat "$log"
          test "$ready" -eq 1
          ! grep -Eiq '(NoClassDefFoundError|ClassNotFoundException|Exception in server tick loop|Failed to start the minecraft server|Mod loading error has occurred)' "$log"

      - name: Publish verified project source to main
        shell: bash
        run: |
          set -euo pipefail
          echo publish > "$GITHUB_WORKSPACE/survival-ascension-058-stage-phase.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/survival-ascension
          git diff --cached --quiet && { echo 'No project changes produced'; exit 1; }
          git commit -m 'Release Survival Ascension 0.58 field control'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo published > "$GITHUB_WORKSPACE/survival-ascension-058-stage-phase.txt"

      - name: Record 0.58 staging result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=/tmp/survival-ascension-058-stage-result
          rm -rf "$result"
          mkdir -p "$result"
          phase="$(cat "$GITHUB_WORKSPACE/survival-ascension-058-stage-phase.txt" 2>/dev/null || echo setup)"
          cat > "$result/status.txt" <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          phase=$phase
          STATUS
          for name in audit content-pack gradle server; do
            source="$GITHUB_WORKSPACE/survival-ascension-058-stage-$name.log"
            test ! -f "$source" || cp "$source" "$result/$name.log"
          done

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf ci-results/survival-ascension-stage058
            mkdir -p ci-results/survival-ascension-stage058
            cp -a "$result/." ci-results/survival-ascension-stage058/
            git add -A ci-results/survival-ascension-stage058
            if git diff --cached --quiet; then recorded=1; break; fi
            git commit -m "Record Survival Ascension 0.58 staging result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then recorded=1; break; fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1
