name: Finalize Village Guardians v0.18.10 Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.docs-finalize-trigger-v01810'

permissions:
  contents: write

jobs:
  finalize:
    name: Finalize v0.18.10 canonical docs on main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch canonical docs
        working-directory: projects/village-guardians
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/finalize_v01810_docs.py
          grep -q '0.18.10-alpha.1' README.md
          grep -q '31564184543' BUILD_AND_RUNTIME_REPORT.md
          grep -q '6e24aa279b5f2fb29c91224ed404a8b084acfa843796a68c5099fd46f0e45209' BUILD_AND_RUNTIME_REPORT.md

      - name: Commit docs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/village-guardians/README.md projects/village-guardians/BUILD_AND_RUNTIME_REPORT.md
          git diff --cached --check
          git commit -m "docs(village): finalize 0.18.10 tracking ricochet build"

      - name: Fast-forward main without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "Failed to fast-forward main after retries" >&2
          exit 1
