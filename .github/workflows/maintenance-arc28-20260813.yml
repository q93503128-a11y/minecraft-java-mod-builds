name: Project maintenance 20260813

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-arc28-20260813.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 .github/scripts/maintenance_20260813.py
          python3 projects/arcane-circle/tools/test_current_source.py
          git diff --check
          git add -A projects/arcane-circle
          git commit -m 'Arcane Circle alpha.28: authored sigils, real robes, staff casting'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
