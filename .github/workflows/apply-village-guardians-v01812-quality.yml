name: Apply Village Guardians v0.18.12 Quality Audit

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.apply-trigger-v01812'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Rebase onto current main
        run: git pull --rebase origin main
      - name: Apply manual-audit fixes
        run: |
          set -euo pipefail
          python3 projects/village-guardians/tools/apply_v01812_quality_audit.py
          python3 projects/village-guardians/tools/test_v01812_quality_audit.py
          python3 projects/village-guardians/tools/test_v01811_defense_polish.py
          python3 projects/village-guardians/tools/test_v01810_ranger_ricochet.py
          python3 projects/village-guardians/tools/test_v0189_siege_phase2.py
          python3 projects/village-guardians/tools/test_v0188_risk_ui_cleanup.py
      - name: Commit and push main
        run: |
          set -euo pipefail
          git add projects/village-guardians
          git commit -m 'fix(village): harden siege combat presentation and AI'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
