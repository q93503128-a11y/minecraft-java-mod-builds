name: Patch Living Kingdoms role-aware interior preservation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-living-kingdoms-urban-life.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Patch role-aware source restoration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorPreserver.java')
          text = path.read_text(encoding='utf-8')

          def rep(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          rep('    private static int rollbackCount;\n    private static boolean completionLogged;\n',
              '    private static int rollbackCount;\n    private static boolean completionLogged;\n    private static boolean ciRestoreSampleLogged;\n', 'field')
          rep('        rollbackCount = 0;\n        completionLogged = false;\n',
              '        rollbackCount = 0;\n        completionLogged = false;\n        ciRestoreSampleLogged = false;\n', 'reset')
          rep('''    private static String restorationSafetyFailure(ServerLevel level, Snapshot snapshot) {\n        if (!groundAisleWalkable(level, snapshot)) return "ground_aisle_blocked";\n        if (!usableCoreConnected(level, snapshot)) return "usable_core_disconnected";\n        return null;\n    }\n''',
              '''    private static String restorationSafetyFailure(ServerLevel level, Snapshot snapshot) {\n        // Role fixtures may intentionally occupy the rear/center (for example a bathhouse pool).\n        // A rigid empty centerline therefore rejects valid functional interiors. Preserve imported\n        // detail only when the real entrance still reaches the deepest available walkable core.\n        if (!usableCoreConnected(level, snapshot)) return "usable_core_disconnected";\n        return null;\n    }\n''', 'safety')
          rep('        for (int depth = 2; depth <= 8; depth++) {\n',
              '        for (int depth = 8; depth >= 3; depth--) {\n', 'deepest core')
          rep('''            int restored = restore(level, snapshot);\n            RESTORED.add(key);\n            SNAPSHOTS.remove(key);\n            restoredThisTick++;\n            if (diagnosticMode()) {\n''',
              '''            int restored = restore(level, snapshot);\n            if (!ciRestoreSampleLogged && diagnosticMode()) {\n                ciRestoreSampleLogged = true;\n                LivingKingdoms.LOGGER.info(\n                        "LK_ERDEN_AUTHORED_INTERIOR_RESTORE_SAMPLE_PASS role={} entrance={},{} restored_cells={} role_aware_navigation=true deepest_walkable_core=true source_snapshot=true rollback_count={}",\n                        entrance.role(), entrance.x(), entrance.z(), restored, rollbackCount);\n            }\n            RESTORED.add(key);\n            SNAPSHOTS.remove(key);\n            restoredThisTick++;\n            if (diagnosticMode()) {\n''', 'sample marker')
          path.write_text(text, encoding='utf-8')
          PY
          printf 'role-aware-preservation-v1\n' > projects/living-kingdoms/.residence-audit-trigger
          git diff --check
          grep -F 'deepest_walkable_core=true' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorPreserver.java
          grep -F 'for (int depth = 8; depth >= 3; depth--)' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorPreserver.java
      - name: Java 25 clean compile
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Commit product fix and trigger audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorPreserver.java \
                  projects/living-kingdoms/.residence-audit-trigger
          git rm -f .github/workflows/patch-living-kingdoms-urban-life.yml
          git commit -m 'fix(living-kingdoms): make authored interior restoration role-aware'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
