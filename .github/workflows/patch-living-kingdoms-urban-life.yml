name: Patch Living Kingdoms urban life mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-living-kingdoms-urban-life.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct smithing workstation mapping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanLifeManager.java')
          text = path.read_text(encoding='utf-8')
          old = 'Blocks.WEAPONSMITH_TABLE'
          new = 'Blocks.SMITHING_TABLE'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one workstation mapping target, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit correction and remove patch workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/patch-living-kingdoms-urban-life.yml
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanLifeManager.java
          git commit -m 'Correct Erden guard post smithing workstation'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

# registered trigger
