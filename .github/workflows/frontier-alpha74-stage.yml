name: Frontier Alpha74 Stage Verify

on:
  push:
    branches: [main]
    paths:
      - 'projects/frontier-settlement/tools/apply_alpha74_temp.py'
      - 'projects/frontier-settlement/tools/fix_alpha74_audit_temp.py'
      - '.github/workflows/frontier-alpha74-stage.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-alpha74-stage-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/frontier-settlement

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Alpha.74 product patch
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/apply_alpha74_temp.py
      - name: Repair Alpha.74 historical audit view
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/fix_alpha74_audit_temp.py
      - name: Repair Alpha.74 generated docs audit
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/test_alpha74_docs.py')
          s = p.read_text(encoding='utf-8')
          bad = "notes='" + chr(10) + "'.join(lock.get('notes',[]));"
          good = "notes='" + chr(92) + "n'.join(lock.get('notes',[]));"
          if s.count(bad) != 1:
              raise SystemExit(f'expected one malformed docs-audit newline, got {s.count(bad)}')
          p.write_text(s.replace(bad, good, 1), encoding='utf-8')
          print('Alpha.74 generated docs audit repaired')
          PY
      - name: Repair Alpha.74 JAR verifier version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/verify_jar.py')
          s = p.read_text(encoding='utf-8')
          old = 'version="0.1.0-alpha.73"'
          new = 'version="0.1.0-alpha.74"'
          if s.count(old) != 1:
              raise SystemExit(f'expected one Alpha.73 verifier invariant, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Alpha.74 JAR verifier version repaired')
          PY
      - name: Alpha.74 cumulative source audit
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/test_alpha74_source.py
      - name: Alpha.74 canonical docs audit
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/test_alpha74_docs.py
      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
      - name: Verify runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$version" = '0.1.0-alpha.74'
          python3 tools/verify_jar.py "build/libs/frontier_settlement-$version.jar"
          test -f "build/libs/frontier_settlement-$version.jar.sha256"
      - name: Commit verified Alpha.74 product
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$PROJECT_DIR/tools/apply_alpha74_temp.py" "$PROJECT_DIR/tools/fix_alpha74_audit_temp.py"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$PROJECT_DIR"
          git commit -m 'Frontier Settlement 0.1.0-alpha.74 — external threat field knowledge'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
