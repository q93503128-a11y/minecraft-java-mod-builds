name: Fix Living Kingdoms lifecycle edge cases

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_lifecycle_edge_cases.py'
      - '.github/workflows/fix-living-kingdoms-lifecycle-edge-cases.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix lifecycle edge cases
        run: python .github/scripts/fix_living_kingdoms_lifecycle_edge_cases.py
      - name: Commit Java fixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleSavedData.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorWorkforceManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'Fix exterior lifecycle birth and death edge cases'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot Java repair; removed after the source commit lands.
