name: TITANBREAK P0 CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/titanbreak/**'
      - '.github/workflows/titanbreak-p0-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare shared Gradle wrapper
        run: chmod +x projects/senbonzakura-showcase/gradlew

      - name: Clean build
        run: projects/senbonzakura-showcase/gradlew -p projects/titanbreak clean build --no-daemon --stacktrace

      - name: Player-facing text audit
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE '산데비스탄|sandevistan|DESIGN_TARGET|\bP0\b|prototype|\bdebug\b|TODO' \
            projects/titanbreak/src/main/resources projects/titanbreak/src/main/templates; then
            echo 'Forbidden player-facing/development wording detected.' >&2
            exit 1
          fi

      - name: JAR verify
        shell: bash
        run: |
          set -euo pipefail
          JAR=$(find projects/titanbreak/build/libs -maxdepth 1 -name 'titanbreak-*.jar' | head -n 1)
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'kr/moonseungjun/titanbreak/Titanbreak.class'
          jar tf "$JAR" | grep -q 'META-INF/neoforge.mods.toml'
          echo "jar=$JAR"
          sha256sum "$JAR"

      - name: Upload test JAR
        uses: actions/upload-artifact@v4
        with:
          name: titanbreak-p0-test-jar
          path: projects/titanbreak/build/libs/titanbreak-*.jar
          if-no-files-found: error
