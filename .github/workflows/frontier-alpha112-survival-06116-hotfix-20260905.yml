name: Frontier Alpha112 + Survival 0.61.16 hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha112-survival-06116-hotfix-20260905.yml'
      - 'tools/apply_frontier_alpha112_survival_06116_tmp.py'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Rebase onto latest main
        run: |
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git pull --rebase origin main

      - name: Apply placement and TBOS locator patch
        run: python tools/apply_frontier_alpha112_survival_06116_tmp.py

      - name: Verify canonical source contracts
        run: |
          python projects/frontier-settlement/tools/test_current_source.py
          python -m json.tool projects/frontier-settlement/COMPANION_LOCK.json >/dev/null
          python projects/survival-ascension/tools/test_current_source.py

      - name: Clean build Frontier with Java 25
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Clean build Survival Ascension with Java 25
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Verify runtime JARs
        run: |
          FRONTIER_JAR="projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.112.jar"
          SURVIVAL_JAR="projects/survival-ascension/build/libs/survivalascension-0.61.16-alpha.1.jar"
          test -f "$FRONTIER_JAR"
          test -f "$SURVIVAL_JAR"
          jar tf "$FRONTIER_JAR" | grep -q 'kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.class'
          jar tf "$SURVIVAL_JAR" | grep -q 'kr/moonseungjun/survivalascension/compat/TbosFractureShrineLocator.class'
          jar tf "$SURVIVAL_JAR" | grep -q 'kr/moonseungjun/survivalascension/network/FractureShrineTargetPayload.class'
          jar tf "$SURVIVAL_JAR" | grep -q 'kr/moonseungjun/survivalascension/client/ClientFractureShrineState.class'

      - name: Commit canonical changes and retire temporary mutators
        run: |
          rm -f tools/apply_frontier_alpha112_survival_06116_tmp.py
          rm -f .github/workflows/frontier-alpha112-survival-06116-hotfix-20260905.yml
          git add -A
          git status --short
          git commit -m "Fix Frontier placement and add TBOS shrine locator"

      - name: Rebase and reverify exact push candidate
        run: |
          git pull --rebase origin main
          python projects/frontier-settlement/tools/test_current_source.py
          python -m json.tool projects/frontier-settlement/COMPANION_LOCK.json >/dev/null
          python projects/survival-ascension/tools/test_current_source.py
          (cd projects/frontier-settlement && ./gradlew --no-daemon clean build)
          (cd projects/survival-ascension && ./gradlew --no-daemon clean build)
          FRONTIER_JAR="projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.112.jar"
          SURVIVAL_JAR="projects/survival-ascension/build/libs/survivalascension-0.61.16-alpha.1.jar"
          test -f "$FRONTIER_JAR" && test -f "$SURVIVAL_JAR"
          jar tf "$SURVIVAL_JAR" | grep -q 'TbosFractureShrineLocator.class'
          mkdir -p release
          cp "$FRONTIER_JAR" release/
          cp "$SURVIVAL_JAR" release/

      - name: Push verified main
        run: git push origin HEAD:main

      - name: Upload test JARs
        uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha112-survival-06116-tested
          path: release/*.jar
          if-no-files-found: error
          retention-days: 7
