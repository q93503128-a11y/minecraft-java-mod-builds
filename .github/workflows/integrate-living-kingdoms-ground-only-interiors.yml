name: Integrate Living Kingdoms source-only ground interiors

on:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalUrbanFabricBuilder.java'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Require corrected castle-house semantics
        shell: bash
        run: |
          set -euo pipefail
          source='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalUrbanFabricBuilder.java'
          grep -F 'fragmentInteriorSide(fragment, nx, nz)' "$source"
          grep -F 'withExteriorSide(' "$source"

      - name: Add zero-cut ground-only runtime materializer
        shell: bash
        run: |
          set -euo pipefail
          cat > projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanGroundOnlyInteriorMaterializer.java <<'JAVA'
          package kr.moonseungjun.livingkingdoms.world;

          import kr.moonseungjun.livingkingdoms.LivingKingdoms;
          import net.minecraft.core.BlockPos;
          import net.minecraft.core.Direction;
          import net.minecraft.server.level.ServerLevel;
          import net.minecraft.world.level.block.BedBlock;
          import net.minecraft.world.level.block.Block;
          import net.minecraft.world.level.block.Blocks;
          import net.minecraft.world.level.block.HorizontalDirectionalBlock;
          import net.minecraft.world.level.block.state.BlockState;
          import net.minecraft.world.level.block.state.properties.BedPart;

          import java.util.List;

          /**
           * Materializes furniture into immutable source-air cells selected by the source-only plan.
           * It never clears, replaces, raises or lowers imported source geometry.
           */
          public final class ErdenUrbanGroundOnlyInteriorMaterializer {
              public static final int MATERIALIZER_REVISION = 1;
              private static boolean ciPassed;

              private ErdenUrbanGroundOnlyInteriorMaterializer() {}

              public static boolean tryMaterialize(
                      ServerLevel level,
                      ExternalUrbanFabricBuilder.UrbanEntrance entrance) {
                  ErdenUrbanGroundOnlyFunctionalPlanCatalog.PlacementPlan plan =
                          ErdenUrbanGroundOnlyFunctionalPlanCatalog.plan(entrance);
                  if (plan == null) {
                      throw new IllegalStateException(
                              "Missing source-only ground interior plan role=" + entrance.role()
                                      + " entrance=" + entrance.x() + "," + entrance.z());
                  }
                  if (!chunksReady(level, plan)) return false;

                  for (ErdenUrbanGroundOnlyFunctionalPlanCatalog.BedPlan bed : plan.beds()) {
                      placeBed(level, plan.role(), bed);
                  }
                  for (ErdenUrbanGroundOnlyFunctionalPlanCatalog.FixturePlan fixture : plan.fixtures()) {
                      placeFixture(level, fixture);
                  }
                  verifyRuntime(level, plan);

                  if (!ciPassed && "1".equals(System.getenv("LIVING_KINGDOMS_CI_REALM_TEST"))) {
                      ciPassed = true;
                      LivingKingdoms.LOGGER.info(
                              "LK_ERDEN_GROUND_ONLY_MATERIALIZER_PASS role={} entrance={},{} planning_cells={} audited_reachable={} beds={} fixtures={} resident_targets={} work_target=true source_floor_reused=true source_air_fixtures=true source_blocks_cut=0 synthetic_room=false revision={}",
                              plan.role(), entrance.x(), entrance.z(), plan.planningCells(),
                              plan.auditedReachableCells(), plan.beds().size(), plan.fixtures().size(),
                              plan.residentTargets().size(), MATERIALIZER_REVISION);
                  }
                  return true;
              }

              private static boolean chunksReady(
                      ServerLevel level,
                      ErdenUrbanGroundOnlyFunctionalPlanCatalog.PlacementPlan plan) {
                  for (BlockPos pos : allPositions(plan)) {
                      int chunkX = pos.getX() >> 4;
                      int chunkZ = pos.getZ() >> 4;
                      if (!level.hasChunk(chunkX, chunkZ)
                              || !ErdenCapitalStreamingBuilder.isChunkBuilt(level, chunkX, chunkZ)) {
                          return false;
                      }
                  }
                  return true;
              }

              private static List<BlockPos> allPositions(
                      ErdenUrbanGroundOnlyFunctionalPlanCatalog.PlacementPlan plan) {
                  java.util.ArrayList<BlockPos> result = new java.util.ArrayList<>();
                  result.addAll(plan.residentTargets());
                  result.add(plan.workTarget());
                  if (plan.primaryContainer() != null) result.add(plan.primaryContainer());
                  for (ErdenUrbanGroundOnlyFunctionalPlanCatalog.BedPlan bed : plan.beds()) {
                      result.add(bed.foot());
                      result.add(bed.head());
                  }
                  for (ErdenUrbanGroundOnlyFunctionalPlanCatalog.FixturePlan fixture : plan.fixtures()) {
                      result.add(fixture.pos());
                  }
                  return List.copyOf(result);
              }

              private static void placeBed(
                      ServerLevel level,
                      String role,
                      ErdenUrbanGroundOnlyFunctionalPlanCatalog.BedPlan bed) {
                  Direction facing = direction(bed.foot(), bed.head());
                  Block bedBlock = switch (role) {
                      case "inn" -> Blocks.RED_BED;
                      case "guard_post" -> Blocks.GRAY_BED;
                      default -> Blocks.WHITE_BED;
                  };
                  requirePlacementAir(level, bed.foot(), bedBlock);
                  requirePlacementAir(level, bed.head(), bedBlock);
                  requireSupport(level, bed.foot(), "bed-foot");
                  requireSupport(level, bed.head(), "bed-head");
                  BlockState foot = bedBlock.defaultBlockState()
                          .setValue(BedBlock.PART, BedPart.FOOT)
                          .setValue(HorizontalDirectionalBlock.FACING, facing);
                  BlockState head = bedBlock.defaultBlockState()
                          .setValue(BedBlock.PART, BedPart.HEAD)
                          .setValue(HorizontalDirectionalBlock.FACING, facing);
                  level.setBlockAndUpdate(bed.foot(), foot);
                  level.setBlockAndUpdate(bed.head(), head);
              }

              private static void placeFixture(
                      ServerLevel level,
                      ErdenUrbanGroundOnlyFunctionalPlanCatalog.FixturePlan fixture) {
                  Block block = switch (fixture.kind()) {
                      case PRIMARY_BARREL, BARREL -> Blocks.BARREL;
                      case CHEST -> Blocks.CHEST;
                      case CRAFTING_TABLE -> Blocks.CRAFTING_TABLE;
                      case HAY -> Blocks.HAY_BLOCK;
                      case WATER_CAULDRON -> Blocks.WATER_CAULDRON;
                      case ANVIL -> Blocks.ANVIL;
                      case TARGET -> Blocks.TARGET;
                  };
                  requirePlacementAir(level, fixture.pos(), block);
                  requireSupport(level, fixture.pos(), fixture.kind().name());
                  level.setBlockAndUpdate(fixture.pos(), block.defaultBlockState());
              }

              private static void requirePlacementAir(ServerLevel level, BlockPos pos, Block desired) {
                  BlockState current = level.getBlockState(pos);
                  if (current.getBlock() == desired) return;
                  if (!current.isAir()) {
                      throw new IllegalStateException(
                              "Ground-only materializer refused to cut source block at " + pos
                                      + " existing=" + current + " requested=" + desired);
                  }
                  if (!level.getBlockState(pos.above()).isAir()) {
                      throw new IllegalStateException(
                              "Ground-only materializer lacks source-air headroom at " + pos);
                  }
              }

              private static void requireSupport(ServerLevel level, BlockPos pos, String label) {
                  BlockState floor = level.getBlockState(pos.below());
                  if (floor.isAir() || !floor.getFluidState().isEmpty()) {
                      throw new IllegalStateException(
                              "Ground-only materializer lacks source floor label=" + label + " pos=" + pos);
                  }
              }

              private static void verifyRuntime(
                      ServerLevel level,
                      ErdenUrbanGroundOnlyFunctionalPlanCatalog.PlacementPlan plan) {
                  if (plan.residentTargets().size() != 3 || plan.workTarget() == null) {
                      throw new IllegalStateException("Ground-only runtime plan lost movement targets");
                  }
                  for (BlockPos target : plan.residentTargets()) verifyWalkable(level, target, "resident");
                  verifyWalkable(level, plan.workTarget(), "work");
                  for (ErdenUrbanGroundOnlyFunctionalPlanCatalog.BedPlan bed : plan.beds()) {
                      if (!(level.getBlockState(bed.foot()).getBlock() instanceof BedBlock)
                              || !(level.getBlockState(bed.head()).getBlock() instanceof BedBlock)) {
                          throw new IllegalStateException("Ground-only bed failed materialization role=" + plan.role());
                      }
                  }
              }

              private static void verifyWalkable(ServerLevel level, BlockPos target, String label) {
                  BlockState floor = level.getBlockState(target.below());
                  if (floor.isAir() || !floor.getFluidState().isEmpty()
                          || !level.getBlockState(target).isAir()
                          || !level.getBlockState(target.above()).isAir()) {
                      throw new IllegalStateException(
                              "Ground-only movement target is not source-walkable label=" + label
                                      + " target=" + target);
                  }
              }

              private static Direction direction(BlockPos foot, BlockPos head) {
                  int dx = head.getX() - foot.getX();
                  int dz = head.getZ() - foot.getZ();
                  if (dx == 1 && dz == 0) return Direction.EAST;
                  if (dx == -1 && dz == 0) return Direction.WEST;
                  if (dx == 0 && dz == 1) return Direction.SOUTH;
                  if (dx == 0 && dz == -1) return Direction.NORTH;
                  throw new IllegalStateException("Ground-only bed cells are not adjacent foot=" + foot + " head=" + head);
              }
          }
          JAVA

      - name: Route ground-only buildings away from synthetic carving
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanInteriorBuilder.java')
          s=p.read_text(encoding='utf-8')
          s=s.replace('public static final int INTERIOR_REVISION = 1;', 'public static final int INTERIOR_REVISION = 2;', 1)
          old='''    private static boolean tryComplete(\n            ServerLevel level,\n            ExternalUrbanFabricBuilder.UrbanEntrance entrance) {\n        Room geometry = room(entrance, 0);\n'''
          new='''    private static boolean tryComplete(\n            ServerLevel level,\n            ExternalUrbanFabricBuilder.UrbanEntrance entrance) {\n        if (ErdenUrbanResidenceResolver.isGroundOnly(entrance)) {\n            return ErdenUrbanGroundOnlyInteriorMaterializer.tryMaterialize(level, entrance);\n        }\n        Room geometry = room(entrance, 0);\n'''
          if s.count(old)!=1: raise SystemExit(f'interior tryComplete anchor count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''                    "Completed Erden functional urban interiors plots={} fixture_families={} clear_aisles=true revision={}",\n                    complete, SUPPORTED_ROLES.size(), INTERIOR_REVISION);\n'''
          new='''                    "Completed Erden functional urban interiors plots={} fixture_families={} clear_aisles=true source_only_ground_buildings=77 synthetic_ground_carving_excluded=77 revision={}",\n                    complete, SUPPORTED_ROLES.size(), INTERIOR_REVISION);\n'''
          if s.count(old)!=1: raise SystemExit(f'interior completion log count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanResidenceResolver.java')
          s=p.read_text(encoding='utf-8')
          old='''        long key = key(entrance.x(), entrance.z());\n        return level.getDataStorage().computeIfAbsent(ErdenUrbanInteriorSavedData.TYPE)\n                .isComplete(key, ErdenUrbanInteriorBuilder.INTERIOR_REVISION);\n'''
          new='''        long key = key(entrance.x(), entrance.z());\n        return ErdenUrbanGroundOnlyFunctionalPlanCatalog.plan(entrance) != null\n                && level.getDataStorage().computeIfAbsent(ErdenUrbanInteriorSavedData.TYPE)\n                .isComplete(key, ErdenUrbanInteriorBuilder.INTERIOR_REVISION);\n'''
          if s.count(old)!=1: raise SystemExit(f'residence ready block count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''        if (ErdenUrbanAuthoredUpperRouteManager.isEligible(entrance)) return null;\n        if (!isResidenceReady(level, entrance)) return null;\n        return groundTarget(level, entrance, 4 + Math.floorMod(bedSlot, 3));\n'''
          new='''        if (ErdenUrbanAuthoredUpperRouteManager.isEligible(entrance)) return null;\n        if (!isResidenceReady(level, entrance)) return null;\n        BlockPos planned = ErdenUrbanGroundOnlyFunctionalPlanCatalog.homeTarget(entrance, bedSlot);\n        return planned != null && walkable(level, planned) ? planned : null;\n'''
          if s.count(old)!=1: raise SystemExit(f'home target block count={s.count(old)}')
          s=s.replace(old,new,1)
          old='''    public static BlockPos resolveWorkTarget(ServerLevel level, ExternalUrbanFabricBuilder.UrbanEntrance entrance) {\n        long key = key(entrance.x(), entrance.z());\n        if (!level.getDataStorage().computeIfAbsent(ErdenUrbanInteriorSavedData.TYPE)\n                .isComplete(key, ErdenUrbanInteriorBuilder.INTERIOR_REVISION)) return null;\n        return groundTarget(level, entrance, 3);\n    }\n'''
          new='''    public static BlockPos resolveWorkTarget(ServerLevel level, ExternalUrbanFabricBuilder.UrbanEntrance entrance) {\n        long key = key(entrance.x(), entrance.z());\n        if (!level.getDataStorage().computeIfAbsent(ErdenUrbanInteriorSavedData.TYPE)\n                .isComplete(key, ErdenUrbanInteriorBuilder.INTERIOR_REVISION)) return null;\n        if (isGroundOnly(entrance)) {\n            BlockPos planned = ErdenUrbanGroundOnlyFunctionalPlanCatalog.workTarget(entrance);\n            return planned != null && walkable(level, planned) ? planned : null;\n        }\n        return groundTarget(level, entrance, 3);\n    }\n'''
          if s.count(old)!=1: raise SystemExit(f'work target block count={s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java')
          s=p.read_text(encoding='utf-8')
          imp='import kr.moonseungjun.livingkingdoms.world.ErdenUrbanGroundVoidOpportunityCatalog;\n'
          if imp not in s: raise SystemExit('ground void import missing')
          s=s.replace(imp, imp + 'import kr.moonseungjun.livingkingdoms.world.ErdenUrbanGroundOnlyFunctionalPlanCatalog;\n',1)
          anchor='        ErdenUrbanGroundVoidOpportunityCatalog.bootstrap();\n'
          if s.count(anchor)!=1: raise SystemExit(f'ground void bootstrap count={s.count(anchor)}')
          s=s.replace(anchor, anchor + '        ErdenUrbanGroundOnlyFunctionalPlanCatalog.bootstrap();\n',1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          grep -F 'public static final int INTERIOR_REVISION = 2;' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanInteriorBuilder.java
          grep -F 'ErdenUrbanGroundOnlyInteriorMaterializer.tryMaterialize' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanInteriorBuilder.java
          grep -F 'ErdenUrbanGroundOnlyFunctionalPlanCatalog.bootstrap();' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java

      - name: Java 25 clean compile
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Fresh-world source-only ground interior verification
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-ground-only-interior-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-ground-only-interior-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/ground-only-interior.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          pass=0
          for attempt in $(seq 1 900); do
            if grep -Eqi 'Ground-only materializer refused to cut|LK_REALM_DIAGNOSTIC_FAIL|Unable to complete Erden urban interior' ../../logs/ground-only-interior.log; then
              cat ../../logs/ground-only-interior.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_GROUND_ONLY_FUNCTIONAL_PLAN_PASS placements=77' ../../logs/ground-only-interior.log \
              && grep -Fq 'LK_ERDEN_GROUND_ONLY_MATERIALIZER_PASS' ../../logs/ground-only-interior.log; then
              pass=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/ground-only-interior.log
              exit 1
            fi
            sleep 1
          done
          cat ../../logs/ground-only-interior.log
          test "$pass" -eq 1
          grep -F 'LK_ERDEN_GROUND_ONLY_FUNCTIONAL_PLAN_PASS placements=77' ../../logs/ground-only-interior.log | grep -F 'source_blocks_cut=0'
          grep -F 'LK_ERDEN_GROUND_ONLY_MATERIALIZER_PASS' ../../logs/ground-only-interior.log | grep -F 'source_blocks_cut=0' | grep -F 'synthetic_room=false'
          ! grep -Fq 'Ground-only materializer refused to cut' ../../logs/ground-only-interior.log

      - name: Commit verified source-only interiors
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanInteriorBuilder.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanResidenceResolver.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanGroundOnlyInteriorMaterializer.java
          git rm .github/workflows/integrate-living-kingdoms-ground-only-interiors.yml
          git commit -m 'feat(living-kingdoms): activate source-only ground interiors'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
