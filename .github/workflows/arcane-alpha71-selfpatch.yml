name: Arcane alpha71 self patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-alpha71-selfpatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alpha71 fourth-circle authority audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('projects/arcane-circle')
          magic = root / 'src/main/java/kr/moonseungjun/arcanecircle/magic'
          client = root / 'src/main/java/kr/moonseungjun/arcanecircle/client'

          def patch(path, old, new):
              body = path.read_text(encoding='utf-8')
              count = body.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, got {count}: {old[:100]!r}')
              path.write_text(body.replace(old, new, 1), encoding='utf-8')

          fourth = magic / 'FourthCircleSpellService.java'
          patch(fourth,
                '    public static final int ICE_STORM_PULSES = 5;\n',
                '    public static final int ICE_STORM_TICKS = 120;\n'
                '    public static final int ICE_STORM_PULSE_TICKS = 10;\n'
                '    public static final int ICE_STORM_PULSES = ICE_STORM_TICKS / ICE_STORM_PULSE_TICKS;\n')
          patch(fourth,
                '    public static final int PHANTASM_TICKS = 220;\n',
                '    public static final int PHANTASM_TICKS = 280;\n')
          patch(fourth,
                '        LivingEntity hostile = hostileAttacker(target, event);\n',
                '        if (!event.getSource().is(DamageTypeTags.BYPASSES_INVULNERABILITY)) {\n'
                '            Entity terrorSource = event.getSource().getEntity();\n'
                '            if (terrorSource instanceof LivingEntity attacker) {\n'
                '                FearState terror = FEAR.get(attacker.getUUID());\n'
                '                if (terror != null && terror.level == target.level() && terror.expiresAt > now\n'
                '                        && terror.ownerId.equals(target.getUUID())) {\n'
                '                    event.setCanceled(true);\n'
                '                    terror.level.playSound(null, target.blockPosition(), SoundEvents.SOUL_ESCAPE,\n'
                '                            target instanceof ServerPlayer ? SoundSource.PLAYERS : SoundSource.HOSTILE, .62F, .74F);\n'
                '                    return;\n'
                '                }\n'
                '            }\n'
                '        }\n\n'
                '        LivingEntity hostile = hostileAttacker(target, event);\n')
          patch(fourth,
                '    private static boolean iceStorm(ServerLevel level, LivingEntity caster, double range, double power, Vec3 center) {\n'
                '        double radius = Math.max(6.0, Math.min(10.0, SpellMetrics.effectRadius("ice_storm", range, 4)));\n',
                '    public static double iceStormRadius(double range) {\n'
                '        return Math.max(6.0, Math.min(10.0, SpellMetrics.effectRadius("ice_storm", range, 4)));\n'
                '    }\n\n'
                '    private static boolean iceStorm(ServerLevel level, LivingEntity caster, double range, double power, Vec3 center) {\n'
                '        double radius = iceStormRadius(range);\n')
          patch(fourth,
                '        level.playSound(null, BlockPos.containing(center), SoundEvents.GLASS_BREAK,\n'
                '                caster instanceof ServerPlayer ? SoundSource.PLAYERS : SoundSource.HOSTILE, .85F, .72F);\n'
                '        return true;\n',
                '        level.playSound(null, BlockPos.containing(center), SoundEvents.GLASS_BREAK,\n'
                '                caster instanceof ServerPlayer ? SoundSource.PLAYERS : SoundSource.HOSTILE, .85F, .72F);\n'
                '        if (caster instanceof ServerPlayer player) {\n'
                '            ArcaneNoticeService.push(player, Component.literal("§b[아이스 스톰] §f6초 · 0.5초마다 우박 충격 · 동결/둔화 + 반복 강제 하강으로 공중 이동을 억제합니다."), 82);\n'
                '        }\n'
                '        return true;\n')
          patch(fourth,
                '                ArcaneDamage.hurt(level, owner, target, (float) Math.max(.6, state.power * .24));\n'
                '                target.setTicksFrozen(Math.max(target.getTicksFrozen(), target.getTicksRequiredToFreeze() + 45));\n'
                '                target.addEffect(new MobEffectInstance(MobEffects.SLOWNESS, 30, 2, true, false));\n'
                '                target.push(0.0, -.12, 0.0);\n',
                '                ArcaneDamage.hurt(level, owner, target, (float) Math.max(.45, state.power * .10));\n'
                '                target.setTicksFrozen(Math.max(target.getTicksFrozen(), target.getTicksRequiredToFreeze() + 45));\n'
                '                target.addEffect(new MobEffectInstance(MobEffects.SLOWNESS, 30, 2, true, false));\n'
                '                target.removeEffect(MobEffects.LEVITATION);\n'
                '                target.push(0.0, -.30, 0.0);\n')
          patch(fourth,
                '            state.nextPulse = now + 8L;\n',
                '            state.nextPulse = now + ICE_STORM_PULSE_TICKS;\n')
          patch(fourth,
                '        target.addEffect(new MobEffectInstance(MobEffects.DARKNESS, PHANTASM_TICKS, 0, true, false));\n'
                '        return true;\n',
                '        target.addEffect(new MobEffectInstance(MobEffects.DARKNESS, PHANTASM_TICKS, 0, true, false));\n'
                '        if (caster instanceof ServerPlayer player) {\n'
                '            ArcaneNoticeService.push(player, Component.literal("§5[환영 살해자] §f14초 · 대상은 강제로 도주하며 시전자에게 직접 피해를 줄 수 없고 2초마다 정신 피해를 받습니다."), 88);\n'
                '        }\n'
                '        return true;\n')

          spell_def = magic / 'SpellDefinition.java'
          patch(spell_def,
                '        String fifthCircle = FifthCircleSpellSummary.summary(id);\n',
                '        String fourthCircle = FourthCircleSpellSummary.summary(id);\n'
                '        if (!fourthCircle.isBlank()) return fourthCircle;\n'
                '        String fifthCircle = FifthCircleSpellSummary.summary(id);\n')

          world_magic = magic / 'WorldMagicService.java'
          patch(world_magic,
                '        duration = fifthCircleVisualDuration(spell.id(), duration);\n',
                '        duration = fourthCircleVisualDuration(spell.id(), duration);\n'
                '        duration = fifthCircleVisualDuration(spell.id(), duration);\n')
          patch(world_magic,
                '        duration = fifthCircleVisualDuration(spell.id(), duration);\n',
                '        duration = fourthCircleVisualDuration(spell.id(), duration);\n'
                '        duration = fifthCircleVisualDuration(spell.id(), duration);\n')
          patch(world_magic,
                '    private static int fifthCircleVisualDuration(String spellId, int baseDuration) {\n',
                '    private static int fourthCircleVisualDuration(String spellId, int baseDuration) {\n'
                '        return switch (spellId) {\n'
                '            case "wall_of_fire" -> Math.max(baseDuration, FourthCircleSpellService.WALL_TICKS);\n'
                '            case "ice_storm" -> Math.max(baseDuration, FourthCircleSpellService.ICE_STORM_TICKS);\n'
                '            case "greater_invisibility" -> Math.max(baseDuration, FourthCircleSpellService.GREATER_INVISIBILITY_TICKS);\n'
                '            case "resilient_sphere" -> Math.max(baseDuration, FourthCircleSpellService.SPHERE_TICKS);\n'
                '            case "stoneskin" -> Math.max(baseDuration, FourthCircleSpellService.STONESKIN_TICKS);\n'
                '            case "confusion" -> Math.max(baseDuration, FourthCircleSpellService.CONFUSION_TICKS);\n'
                '            case "blight" -> Math.max(baseDuration, FourthCircleSpellService.BLIGHT_TICKS);\n'
                '            case "freedom_of_movement" -> Math.max(baseDuration, FourthCircleSpellService.FREEDOM_TICKS);\n'
                '            case "phantasmal_killer" -> Math.max(baseDuration, FourthCircleSpellService.PHANTASM_TICKS);\n'
                '            default -> baseDuration;\n'
                '        };\n'
                '    }\n\n'
                '    private static int fifthCircleVisualDuration(String spellId, int baseDuration) {\n')

          tracker = client / 'WorldMagicTracker.java'
          patch(tracker,
                '                if(v.spell.circle()==5){\n',
                '                if(v.spell.circle()==4){\n'
                '                    ArcaneWorldMesh fourthAuthority=FourthCircleAuthorityOverlay.release(v.spell,v.direction,targetOffset(v),\n'
                '                            v.range,elapsedSeconds,durationSeconds);\n'
                '                    if(fourthAuthority.size()>0)entries.add(new RenderEntry(center,fourthAuthority,color,90,opacity));\n'
                '                }\n\n'
                '                if(v.spell.circle()==5){\n')

          arcane = root / 'src/main/java/kr/moonseungjun/arcanecircle/ArcaneCircle.java'
          patch(arcane, '    public static final String VERSION = "0.12.1-alpha.70";\n',
                '    public static final String VERSION = "0.12.1-alpha.71";\n')

          gradle = root / 'gradle.properties'
          patch(gradle, 'mod_version=0.12.1-alpha.70\n', 'mod_version=0.12.1-alpha.71\n')
          body = gradle.read_text(encoding='utf-8')
          body = body.replace('# alpha.70 fifth-circle value pass I: 4s vertical Flame Strike column, 30s person-scale domination, exact visual footprint',
                              '# alpha.71 fourth-circle authority audit: 6s anti-air Ice Storm, 14s Phantasmal terror bond, lifetime sync')
          gradle.write_text(body, encoding='utf-8')

          index_path = root / 'src/main/resources/data/arcanecircle/spell_catalog/index.json'
          index = json.loads(index_path.read_text(encoding='utf-8'))
          index['version'] = '0.12.1-alpha.71'
          index['fourth_circle_deep_audit'] = [
              'persistent_fire_wall',
              'six_second_anti_air_hail_suppression',
              'combat_greater_invisibility',
              'two_way_resilient_sphere',
              'companion_dimension_door',
              'physical_only_stoneskin',
              'decision_scramble_confusion',
              'anti_heal_blight',
              'movement_control_freedom',
              'fourteen_second_terror_bond_damage_denial',
          ]
          index['fourth_circle_value_pass_1'] = {
              'ice_storm': '6s_fixed_anti_air_hail_suppression_with_0.5s_pulses',
              'phantasmal_killer': '14s_single_target_terror_bond_forced_retreat_and_owner_damage_denial',
          }
          index['fourth_circle_role_audit'] = {
              'wall_of_fire': 'fixed_crossing_burn_barrier',
              'ice_storm': 'fixed_vertical_anti_air_hail_suppression',
              'greater_invisibility': 'combat_concealment_and_direct_attack_evasion',
              'resilient_sphere': 'two_way_damage_and_casting_isolation',
              'dimension_door': 'same_dimension_duo_safe_redeployment',
              'stoneskin': 'attacker_caused_physical_damage_ward',
              'confusion': 'area_decision_scramble_and_intermittent_cast_disruption',
              'blight': 'single_target_anti_heal_attrition',
              'freedom_of_movement': 'continuous_movement_control_immunity',
              'phantasmal_killer': 'single_target_owner_damage_denial_terror_bond',
          }
          index['fourth_circle_preserved_authority'] = [
              'wall_of_fire','greater_invisibility','resilient_sphere','dimension_door',
              'stoneskin','confusion','blight','freedom_of_movement'
          ]
          index['fourth_circle_npc_parity'] = True
          index_path.write_text(json.dumps(index, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test_path = root / 'tools/test_current_source.py'
          test = test_path.read_text(encoding='utf-8')
          test = test.replace('mod_version=0.12.1-alpha.70', 'mod_version=0.12.1-alpha.71')
          test = test.replace('VERSION = "0.12.1-alpha.70"', 'VERSION = "0.12.1-alpha.71"')
          test = test.replace("assert index['version'] == '0.12.1-alpha.70'", "assert index['version'] == '0.12.1-alpha.71'")
          test = test.replace("need(text(magic / 'SpellDefinition.java'), 'FifthCircleSpellSummary.summary(id)', 'NinthCircleSpellSummary.summary(id)')",
                              "need(text(magic / 'SpellDefinition.java'), 'FourthCircleSpellSummary.summary(id)', 'FifthCircleSpellSummary.summary(id)', 'NinthCircleSpellSummary.summary(id)')")
          marker = '# Alpha.70 fifth-circle battlefield-command value pass.\n'
          alpha71 = '''# Alpha.71 fourth-circle battlefield-authority value pass.\nfourth = text(magic / 'FourthCircleSpellService.java')\nfourth_summary = text(magic / 'FourthCircleSpellSummary.java')\nfourth_authority = text(client / 'FourthCircleAuthorityOverlay.java')\nworld_magic_4 = text(magic / 'WorldMagicService.java')\ntracker_4 = text(client / 'WorldMagicTracker.java')\nneed(fourth,\n     'ICE_STORM_TICKS = 120', 'ICE_STORM_PULSE_TICKS = 10',\n     'ICE_STORM_PULSES = ICE_STORM_TICKS / ICE_STORM_PULSE_TICKS', 'PHANTASM_TICKS = 280',\n     'public static double iceStormRadius(double range)', 'state.power * .10',\n     'target.removeEffect(MobEffects.LEVITATION);', 'target.push(0.0, -.30, 0.0);',\n     'FearState terror = FEAR.get(attacker.getUUID());', 'terror.ownerId.equals(target.getUUID())',\n     '시전자에게 직접 피해를 줄 수 없고 2초마다 정신 피해')\nneed(fourth_summary,\n     '6초 고정 우박 제압구역', '반복 강제 하강으로 공중 이동을 억제',\n     '14초 단일 공포 결속', '시전자에게 직접 피해를 줄 수 없으며')\nneed(world_magic_4,\n     'duration = fourthCircleVisualDuration(spell.id(), duration);',\n     'case "ice_storm" -> Math.max(baseDuration, FourthCircleSpellService.ICE_STORM_TICKS);',\n     'case "phantasmal_killer" -> Math.max(baseDuration, FourthCircleSpellService.PHANTASM_TICKS);')\nneed(fourth_authority,\n     '"ice_storm".equals(spell.id())', 'FourthCircleSpellService.iceStormRadius(range)',\n     'double pulse = 1.0 - ((t % .50) / .50);')\nneed(tracker_4, 'if(v.spell.circle()==4){', 'FourthCircleAuthorityOverlay.release(')\nexpected4 = {\n    'ice_storm': '6s_fixed_anti_air_hail_suppression_with_0.5s_pulses',\n    'phantasmal_killer': '14s_single_target_terror_bond_forced_retreat_and_owner_damage_denial',\n}\nassert index['fourth_circle_value_pass_1'] == expected4\nroles4 = index['fourth_circle_role_audit']\nassert set(roles4) == {'wall_of_fire','ice_storm','greater_invisibility','resilient_sphere','dimension_door','stoneskin','confusion','blight','freedom_of_movement','phantasmal_killer'}\nassert len(set(roles4.values())) == 10\nassert index['fourth_circle_npc_parity'] is True\n\n'''
          if marker not in test:
              raise SystemExit('test marker missing')
          test = test.replace(marker, alpha71 + marker, 1)
          test = test.replace("'0.12.1-alpha.70', 'FifthCircleSpellSummary.class', 'FifthCircleAuthorityOverlay.class',",
                              "'0.12.1-alpha.71', 'FourthCircleSpellSummary.class', 'FourthCircleAuthorityOverlay.class', 'FifthCircleSpellSummary.class', 'FifthCircleAuthorityOverlay.class',")
          test = test.replace("print('all_109_explicit_effect_summaries=PASS')\n",
                              "print('all_109_explicit_effect_summaries=PASS')\nprint('alpha71_ice_storm_6s_anti_air_suppression=PASS')\nprint('alpha71_phantasmal_killer_14s_terror_bond=PASS')\nprint('alpha71_fourth_circle_visual_hitbox_lifetime_sync=PASS')\nprint('alpha71_fourth_circle_role_audit=PASS')\nprint('alpha71_fourth_circle_value_pass_1=PASS')\n")
          test_path.write_text(test, encoding='utf-8')

          verify_path = root / 'tools/verify_jar.py'
          verify = verify_path.read_text(encoding='utf-8')
          verify = verify.replace("'kr/moonseungjun/arcanecircle/magic/FourthCircleSpellService.class',\n",
                                  "'kr/moonseungjun/arcanecircle/magic/FourthCircleSpellService.class',\n    'kr/moonseungjun/arcanecircle/magic/FourthCircleSpellSummary.class',\n    'kr/moonseungjun/arcanecircle/client/FourthCircleAuthorityOverlay.class',\n", 1)
          verify = verify.replace("if version != '0.12.1-alpha.70':\n        raise SystemExit(f'unexpected alpha.70 package version: {version}')",
                                  "if version != '0.12.1-alpha.71':\n        raise SystemExit(f'unexpected alpha.71 package version: {version}')")
          marker_v = '    expected5 = {\n'
          alpha71_v = '''    expected4 = {\n        'ice_storm': '6s_fixed_anti_air_hail_suppression_with_0.5s_pulses',\n        'phantasmal_killer': '14s_single_target_terror_bond_forced_retreat_and_owner_damage_denial',\n    }\n    if index.get('fourth_circle_value_pass_1') != expected4:\n        raise SystemExit(f'alpha.71 fourth-circle value metadata mismatch: {index.get("fourth_circle_value_pass_1")}')\n    roles4 = index.get('fourth_circle_role_audit', {})\n    expected_roles4 = {'wall_of_fire','ice_storm','greater_invisibility','resilient_sphere','dimension_door','stoneskin','confusion','blight','freedom_of_movement','phantasmal_killer'}\n    if set(roles4) != expected_roles4 or len(set(roles4.values())) != 10:\n        raise SystemExit('alpha.71 fourth-circle role separation contract missing')\n\n'''
          if marker_v not in verify:
              raise SystemExit('verify marker missing')
          verify = verify.replace(marker_v, alpha71_v + marker_v, 1)
          verify = verify.replace("print('Arcane Circle alpha.70 JAR verification: PASS')",
                                  "print('Arcane Circle alpha.71 JAR verification: PASS')")
          verify = verify.replace("print('alpha70_fifth_circle_value_pass_1=PASS')\n",
                                  "print('alpha71_fourth_circle_value_pass_1=PASS')\nprint('alpha71_ice_storm_6s_anti_air_suppression=PASS')\nprint('alpha71_phantasmal_killer_14s_terror_bond=PASS')\nprint('alpha71_fourth_circle_role_separation=PASS')\nprint('alpha71_fourth_circle_npc_parity=PASS')\nprint('alpha70_fifth_circle_value_pass_1=PASS')\n")
          verify_path.write_text(verify, encoding='utf-8')
          PY

          rm -f .github/workflows/arcane-alpha71-selfpatch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/arcane-circle .github/workflows/arcane-alpha71-selfpatch.yml
          git diff --cached --check
          git commit -m 'Implement Arcane alpha.71 fourth-circle authority audit [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
