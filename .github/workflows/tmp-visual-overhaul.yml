name: Temporary visual overhaul migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-visual-overhaul.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply visual overhaul
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp_visual_overhaul.py
          git rm .github/workflows/tmp-visual-overhaul.yml
          git rm .github/scripts/tmp_visual_overhaul.py
          git rm .github/scripts/tmp_visual_helper.txt
          git diff --check
      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(arcane-circle): overhaul spell presentation and rising gates'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
