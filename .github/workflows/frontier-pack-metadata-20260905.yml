name: Frontier Pack Metadata 20260905

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/frontier-pack-metadata-20260905.yml'

permissions:
  contents: write

jobs:
  export-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Modrinth index metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, urllib.request

          root = Path('.')
          frontier = json.loads((root/'projects/frontier-settlement/COMPANION_LOCK.json').read_text(encoding='utf-8'))
          records = []
          for value in frontier.values():
              if isinstance(value, list) and value and all(isinstance(x, dict) for x in value):
                  if any('source' in x and 'id' in x for x in value):
                      records.extend(value)
          versions = []
          manual = []
          for rec in records:
              if rec.get('source') == 'modrinth' and rec.get('version_id'):
                  versions.append((rec['version_id'], rec.get('side','client_server')))
              elif rec.get('source') == 'curseforge':
                  manual.append(rec)

          build = (root/'projects/survival-ascension/build.gradle').read_text(encoding='utf-8')
          for project, version in re.findall(r"runtimeOnly 'maven\.modrinth:([^:']+):([^']+)'", build):
              versions.append((version, 'client_server'))

          seen=set(); unique=[]
          for vid,side in versions:
              if vid in seen: continue
              seen.add(vid); unique.append((vid,side))

          files=[]
          for vid,side in unique:
              req=urllib.request.Request(f'https://api.modrinth.com/v2/version/{vid}', headers={'User-Agent':'MoonStudio-PackExport/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r: meta=json.load(r)
              choices=meta.get('files') or []
              f=next((x for x in choices if x.get('primary')), choices[0] if choices else None)
              if not f: raise SystemExit(f'No file for {vid}')
              h=f.get('hashes') or {}
              if not h.get('sha1') or not h.get('sha512'): raise SystemExit(f'Missing hashes for {vid}')
              env={'client':'required','server':'required'}
              if side == 'client_preferred': env={'client':'required','server':'unsupported'}
              files.append({'path':'mods/'+f['filename'],'hashes':{'sha1':h['sha1'],'sha512':h['sha512']},'env':env,'downloads':[f['url']],'fileSize':f['size']})

          out=Path('pack-metadata'); out.mkdir()
          index={'formatVersion':1,'game':'minecraft','versionId':'frontier-a102-survival-0.61.9-20260905','name':'Frontier Settlement + Survival Ascension','summary':'Minecraft 26.2 / NeoForge 26.2.0.38-beta canonical locked pack','files':files,'dependencies':{'minecraft':'26.2','neoforge':'26.2.0.38-beta'}}
          (out/'modrinth.index.json').write_text(json.dumps(index,ensure_ascii=False,indent=2),encoding='utf-8')
          (out/'manual-external.json').write_text(json.dumps(manual,ensure_ascii=False,indent=2),encoding='utf-8')
          print('indexed Modrinth files:',len(files),'manual external:',len(manual))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-pack-metadata-20260905
          path: pack-metadata/*
          if-no-files-found: error
      - name: Remove temporary workflow
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm .github/workflows/frontier-pack-metadata-20260905.yml
          git commit -m 'Remove temporary pack metadata export workflow'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
