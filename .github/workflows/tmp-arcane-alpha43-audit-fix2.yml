name: Temporary Arcane alpha.43 audit fix 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-arcane-alpha43-audit-fix2.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove remaining old render-budget assertions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/arcane-circle/tools/test_current_source.py')
          s=p.read_text(encoding='utf-8')
          old="'MAX_FRAME = 12000','MAX_ENTRY = 3400'"
          count=s.count(old)
          if count < 1:
              raise SystemExit('remaining old budget assertion missing')
          s=s.replace(old,"'MAX_FRAME = 14500','MAX_ENTRY = 4000'")
          if 'MAX_FRAME = 12000' in s or 'MAX_ENTRY = 3400' in s:
              raise SystemExit('stale budget literal remains')
          p.write_text(s,encoding='utf-8')
          PY
          rm -f .github/workflows/tmp-arcane-alpha43-audit-fix2.yml
          git add -A
          git commit -m 'fix(arcane): remove stale alpha.42 render-budget assertions'
          git push origin main
