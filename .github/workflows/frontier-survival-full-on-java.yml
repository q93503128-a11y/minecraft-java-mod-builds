name: Run Frontier Survival FULL Pack After Java Changes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-survival-full-on-java.yml'
      - 'projects/frontier-settlement/src/main/java/**'
      - 'projects/survival-ascension/src/main/java/**'

permissions:
  actions: write
  contents: read

concurrency:
  group: frontier-survival-full-pack-dispatch
  cancel-in-progress: true

jobs:
  dispatch-full-pack:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical FULL KO JEI new-world workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run frontier-survival-full-new-world.yml --repo "${{ github.repository }}" --ref main
