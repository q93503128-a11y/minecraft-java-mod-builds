name: Apply Shared Supply Economy

on:
  push:
    paths:
      - '.github/workflows/apply-shared-supply-economy.yml'
      - 'tools/apply_shared_supply_economy.py'

permissions:
  contents: write

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply shared economy patch
        run: python3 tools/apply_shared_supply_economy.py
      - name: Validate resource JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for root in [Path('projects/frontier-settlement/src/main/resources'), Path('projects/survival-ascension/src/main/resources')]:
              for p in root.rglob('*.json'):
                  json.loads(p.read_text(encoding='utf-8'))
          print('RESOURCE JSON PASS')
          PY
      - name: Build Frontier Settlement
        working-directory: projects/frontier-settlement
        run: ./gradlew clean build --no-daemon
      - name: Build Survival Ascension
        working-directory: projects/survival-ascension
        run: ./gradlew clean build --no-daemon
      - name: Commit validated implementation to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement projects/survival-ascension
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Unify Frontier and Survival shared supply economy'
          git pull --rebase origin main
          git push origin HEAD:main
