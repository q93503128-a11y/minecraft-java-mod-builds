name: Frontier Alpha73 Gameplay Apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha73-gameplay-apply.yml'
      - '.github/frontier-alpha73-apply.py'
      - '.github/frontier-alpha73-audit-fix.py'

permissions:
  contents: write

jobs:
  apply-build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply Alpha.73 gameplay/content pass v5
        run: |
          set -euo pipefail
          python3 .github/frontier-alpha73-apply.py
          python3 .github/frontier-alpha73-audit-fix.py
      - name: Alpha.73 audits
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          python3 tools/test_alpha73_source.py
          python3 tools/test_alpha73_docs.py
      - name: Java 25 clean build and JAR verify
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.73.jar
      - name: Commit verified Alpha.73 product
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement
          git diff --cached --check
          git commit -m 'Frontier Settlement 0.1.0-alpha.73 expedition feedback gameplay pass [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
