name: Diagnose Living Kingdoms exterior watchdog stack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-living-kingdoms-exterior-watchdog-stack.yml'

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Reproduce watchdog and preserve crash report
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -u
          rm -rf run/world run/living_realm run/livingkingdoms-watchdog-stack-ci-world run/crash-reports
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-watchdog-stack-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/exterior-watchdog-server.log 2>&1 &
          pid=$!
          for attempt in $(seq 1 420); do
            if grep -Fq 'A single server tick took' ../../logs/exterior-watchdog-server.log; then
              sleep 8
              break
            fi
            if grep -Fq 'LK_ERDEN_KINGDOM_EXTERIOR_PASS revision=2' ../../logs/exterior-watchdog-server.log; then
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo '--- server watchdog tail ---'
          tail -n 250 ../../logs/exterior-watchdog-server.log || true
          echo '--- crash report files ---'
          find run/crash-reports -maxdepth 1 -type f -print 2>/dev/null || true
          if compgen -G 'run/crash-reports/*.txt' > /dev/null; then
            cat run/crash-reports/*.txt
          fi
      - name: Upload watchdog diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-exterior-watchdog-stack-${{ github.run_number }}
          path: |
            logs/exterior-watchdog-server.log
            projects/living-kingdoms/run/crash-reports/**
          if-no-files-found: warn
          retention-days: 7

# Re-run after bounding CI writes to 4,000/tick, plan slices to 12 ms and in-flight chunks to two.
