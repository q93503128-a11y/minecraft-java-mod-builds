name: Patch Living Kingdoms physical residence integration

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_living_kingdoms_physical_residence_integration.py'
      - '.github/workflows/patch-living-kingdoms-physical-residence-integration.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate physical residences
        run: python .github/scripts/patch_living_kingdoms_physical_residence_integration.py
      - name: Commit residence integration
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenKingdomExteriorBuilder.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorWorkforceManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate physical exterior residences with residents'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot integration; remove after Java changes land.
