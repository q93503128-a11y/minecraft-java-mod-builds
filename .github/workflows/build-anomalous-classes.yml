name: Build anomalous-classes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/anomalous-classes/**'
      - '.github/workflows/build-anomalous-classes.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/anomalous-classes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Verify toolchain
        run: |
          java -version
          bash ./gradlew --version
      - name: Clean build
        shell: bash
        run: |
          set -o pipefail
          bash ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee build.log
      - name: Verify packaged JAR
        if: success()
        run: python tools/verify_jar.py build/libs/anomalous-classes-0.1.0-alpha.1.jar
      - name: Write SHA-256
        if: success()
        run: sha256sum build/libs/anomalous-classes-0.1.0-alpha.1.jar > build/libs/anomalous-classes-0.1.0-alpha.1.jar.sha256
      - name: Archive raw build log
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          log = Path('build.log')
          bundle = Path('artifacts/raw-logs.zip')
          if log.exists():
              old_entries = {}
              if bundle.exists():
                  with ZipFile(bundle) as old_archive:
                      old_entries = {name: old_archive.read(name) for name in old_archive.namelist()}
              with ZipFile(bundle, 'w', ZIP_DEFLATED) as archive:
                  for name, contents in old_entries.items():
                      archive.writestr(name, contents)
                  archive.write(log, 'github-actions-gradle-clean-build.log')
          PY
      - name: Upload deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: anomalous-classes-0.1.0-alpha.1-deliverables
          path: |
            projects/anomalous-classes/build/libs/*.jar
            projects/anomalous-classes/build/libs/*.sha256
            projects/anomalous-classes/BUILD_AND_RUNTIME_REPORT.md
            projects/anomalous-classes/artifacts/raw-logs.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anomalous-classes-0.1.0-alpha.1-logs
          path: |
            projects/anomalous-classes/build.log
            projects/anomalous-classes/artifacts/raw-logs.zip
          if-no-files-found: warn
          retention-days: 7
