name: Debug Village Guardians v0.18.2 Contracts

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger-v0182-debug'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Apply runtime stability patch with bootstrap
        working-directory: projects/village-guardians
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/v0182/apply.py
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import runpy
          path = Path('tools/v0182/apply.py')
          runpy.run_path(str(path), init_globals={'dedent': dedent}, run_name='__main__')
          PY
      - name: Run contracts and preserve every result
        working-directory: projects/village-guardians
        shell: bash
        run: |
          set +e
          : > "$GITHUB_WORKSPACE/village-guardians-v0182-contracts-debug.log"
          failures=0
          while IFS= read -r test; do
            echo "=== $test ===" | tee -a "$GITHUB_WORKSPACE/village-guardians-v0182-contracts-debug.log"
            python3 "$test" >> "$GITHUB_WORKSPACE/village-guardians-v0182-contracts-debug.log" 2>&1
            rc=$?
            echo "EXIT=$rc" | tee -a "$GITHUB_WORKSPACE/village-guardians-v0182-contracts-debug.log"
            if [ "$rc" -ne 0 ]; then failures=$((failures + 1)); fi
          done < <(find tools -maxdepth 1 -type f -name 'test_*.py' | sort)
          echo "FAILURES=$failures" | tee -a "$GITHUB_WORKSPACE/village-guardians-v0182-contracts-debug.log"
          exit "$failures"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: villageguardians-v0182-contract-debug
          path: village-guardians-v0182-contracts-debug.log
          if-no-files-found: error
          retention-days: 7
