name: Build Arcane Circle

on:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/**'
      - '.github/scripts/tmp_arcane_alpha46.py'
      - '.github/workflows/build-arcane-circle.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-main
  cancel-in-progress: true

jobs:
  migrate:
    name: One-shot alpha.46 regalia and authority migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed alpha.46 source migration
        shell: bash
        run: |
          set -o pipefail
          python3 .github/scripts/tmp_arcane_alpha46.py 2>&1 | tee /tmp/arcane-alpha46-migration.log
      - name: Record migration failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ci-results/arcane-circle
            cp /tmp/arcane-alpha46-migration.log ci-results/arcane-circle/latest-gradle.log
            cat > ci-results/arcane-circle/status.txt <<STATUS
          status=migration_failure
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=not_run
          gradle=not_run
          version=0.12.1-alpha.45
          source_mutation=not_committed
          presentation_phase=alpha46-regalia-authority-migration
          retired_visual_stack=absent
          legacy_arcane_tooling=absent
          repository_cleanup=pending
          STATUS
            git add ci-results/arcane-circle
            git commit -m "Record Arcane alpha.46 migration failure for ${GITHUB_SHA::7} [skip ci]" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
