name: Build Arcane Circle

on:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/**'
      - '.github/scripts/tmp_arcane_alpha46.py'
      - '.github/workflows/build-arcane-circle.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-main
  cancel-in-progress: true

jobs:
  migrate:
    name: One-shot alpha.46 regalia and authority migration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed alpha.46 source migration
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/tmp_arcane_alpha46.py
          python3 .github/scripts/tmp_arcane_alpha46.py
