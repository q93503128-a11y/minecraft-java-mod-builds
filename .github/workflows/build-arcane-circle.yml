name: Build Arcane Circle

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: projects/arcane-circle
  MOD_VERSION: 0.10.0-alpha.1
  EXPECTED_JAR: arcanecircle-0.10.0-alpha.1.jar
  PUBLISHED_DIR: published/arcane-circle
  CI_RESULT_DIR: ci-results/arcane-circle

jobs:
  build:
    name: Java 25 / NeoForge 26.2 dense UI and single-pass casting
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Apply v0.10 overhaul
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/apply_v10_overhaul.py
      - name: Audit
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/test_magic_contract.py
          python3 tools/test_v10_overhaul.py
      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain
