name: Build Arcane Circle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/**'
      - '.github/workflows/build-arcane-circle.yml'

permissions:
  contents: write

env:
  PROJECT_DIR: projects/arcane-circle
  MOD_VERSION: 0.8.0-alpha.1
  EXPECTED_JAR: arcanecircle-0.8.0-alpha.1.jar
  PUBLISHED_DIR: published/arcane-circle
  CI_RESULT_DIR: ci-results/arcane-circle

jobs:
  build:
    name: Java 25 / NeoForge 26.2 Ninefold Magic World build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply Ninefold Magic World migration
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/apply_v08_magic_world.py
          git diff --check

      - name: Audit 1-9 circles academy economy and sigils
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/test_magic_contract.py

      - name: Clean NeoForge build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-gradle.log"

      - name: Verify magic-world runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.8.0-alpha.1
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish generated source and verified JAR
        shell: bash
        run: |
          mkdir -p "$PUBLISHED_DIR"
          rm -f "$PUBLISHED_DIR"/arcanecircle-*.jar "$PUBLISHED_DIR"/arcanecircle-*.jar.sha256
          cp "deliverables/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
          cp "deliverables/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$PROJECT_DIR" "$PUBLISHED_DIR"
          if git diff --cached --quiet; then
            echo 'Published v0.8 source and JAR already match.'
          else
            git commit -m 'Publish Arcane Circle v0.8 Ninefold Magic World'
            git pull --rebase origin main
            git push
          fi

      - name: Record CI result
        if: always()
        shell: bash
        run: |
          mkdir -p "$CI_RESULT_DIR"
          if test -f "$GITHUB_WORKSPACE/arcane-circle-gradle.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-gradle.log" "$CI_RESULT_DIR/latest-gradle.log"
          else
            printf '%s\n' 'Gradle step did not start or produced no log.' > "$CI_RESULT_DIR/latest-gradle.log"
          fi
          cat > "$CI_RESULT_DIR/status.txt" <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$CI_RESULT_DIR/status.txt" "$CI_RESULT_DIR/latest-gradle.log"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Arcane Circle CI result for ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
