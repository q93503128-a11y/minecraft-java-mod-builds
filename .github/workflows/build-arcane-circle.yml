name: Build Village Guardians v0.17.3 Active Slot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arcane-circle.yml'
      - 'projects/village-guardians/.active-slot-trigger-v0173'

permissions:
  contents: write

env:
  PROJECT_DIR: projects/village-guardians
  EXPECTED_JAR: villageguardians-0.17.3-alpha.1.jar
  PUBLISHED_DIR: published/village-guardians
  RESULT_DIR: ci-results/village-guardians-v0173

jobs:
  build:
    name: Java 25 / NeoForge 26.2 compact growth UI
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply v0.17.3 source cleanup
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/apply_v0173_ui_cleanup.py 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0173-patch.log"
          git diff --check

      - name: Run complete contracts
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/test_rpg_balance.py
          python3 tools/test_village_zone.py
          python3 tools/test_progression_loop.py
          python3 tools/test_progression_depth.py
          python3 tools/test_fortress_layout.py
          python3 tools/test_runtime_safety.py
          python3 tools/test_action_layout.py
          python3 tools/test_enemy_content.py

      - name: Build Java 25 runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0173-gradle.log"

      - name: Verify and stage artifact
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          mkdir -p ../../deliverables-v0173
          cp "build/libs/$EXPECTED_JAR" ../../deliverables-v0173/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables-v0173/

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.17.3-alpha.1
          path: deliverables-v0173/
          if-no-files-found: error
          retention-days: 30

      - name: Publish source and verified JAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/village-v0173-source
          mkdir -p /tmp/village-v0173-source
          rsync -a --delete --exclude '/build/' --exclude '/.gradle/' "$PROJECT_DIR/" /tmp/village-v0173-source/
          published=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"
            rsync -a /tmp/village-v0173-source/ "$PROJECT_DIR/"
            rm -rf "$PROJECT_DIR/build" "$PROJECT_DIR/.gradle"
            mkdir -p "$PUBLISHED_DIR"
            cp "deliverables-v0173/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
            cp "deliverables-v0173/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
            git add -A "$PROJECT_DIR" "$PUBLISHED_DIR"
            if git diff --cached --quiet; then published=1; break; fi
            git commit -m 'Apply Village Guardians v0.17.3 compact UI and verified JAR'
            if git push origin HEAD:main; then published=1; break; fi
            sleep $((attempt * 2))
          done
          test "$published" -eq 1

      - name: Record CI result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/village-v0173-result
          mkdir -p /tmp/village-v0173-result
          if test -f "$GITHUB_WORKSPACE/village-guardians-v0173-gradle.log"; then
            cp "$GITHUB_WORKSPACE/village-guardians-v0173-gradle.log" /tmp/village-v0173-result/latest-gradle.log
          elif test -f "$GITHUB_WORKSPACE/village-guardians-v0173-patch.log"; then
            cp "$GITHUB_WORKSPACE/village-guardians-v0173-patch.log" /tmp/village-v0173-result/latest-gradle.log
          else
            printf '%s\n' 'Pipeline did not produce a diagnostic log.' > /tmp/village-v0173-result/latest-gradle.log
          fi
          cat > /tmp/village-v0173-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=0.17.3-alpha.1
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$RESULT_DIR"
            mkdir -p "$RESULT_DIR"
            cp -a /tmp/village-v0173-result/. "$RESULT_DIR/"
            git add -A "$RESULT_DIR"
            if git diff --cached --quiet; then recorded=1; break; fi
            git commit -m "Record Village Guardians v0.17.3 CI result for ${GITHUB_SHA::7}"
            if git push origin HEAD:main; then recorded=1; break; fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1
