name: Build Arcane Circle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/**'
      - '.github/workflows/build-arcane-circle.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/arcane-circle
  PUBLISHED_DIR: published/arcane-circle
  CI_RESULT_DIR: ci-results/arcane-circle

jobs:
  build:
    name: Java 25 - current Arcane Circle
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Resolve current version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' "$PROJECT_DIR/gradle.properties")"
          test -n "$version"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPECTED_JAR=arcanecircle-$version.jar" >> "$GITHUB_ENV"

      - name: One-shot alpha.45 manual-audit migration
        if: ${{ hashFiles('.github/scripts/manual-vfx45.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/manual-vfx45.py')
          s=p.read_text(encoding='utf-8')
          old="""canonical = subprocess.check_output(\n    ['git', 'show', 'HEAD^:.github/workflows/build-arcane-circle.yml'], text=True\n)\nwrite(WORKFLOW, canonical)\n"""
          new="""canonical = None\nfor depth in range(1, 20):\n    ref = 'HEAD' + '^' * depth + ':.github/workflows/build-arcane-circle.yml'\n    probe = subprocess.run(['git', 'show', ref], text=True, capture_output=True)\n    if probe.returncode == 0 and 'Java 25 - current Arcane Circle' in probe.stdout and 'One-shot alpha.45 manual-audit migration' not in probe.stdout:\n        canonical = probe.stdout\n        break\nif canonical is None:\n    raise SystemExit('canonical Arcane workflow not found in recent parents')\nwrite(WORKFLOW, canonical)\n"""
          if old not in s:
              raise SystemExit('manual-vfx45 canonical restore anchor missing')
          s=s.replace(old,new,1)
          old_search="'            WorldMagicService.stop(player);\\n'"
          new_search="'WorldMagicService.stop(player);'"
          old_repl="'''            WorldMagicService.stop(player);\\n            WorldMagicService.clearVisuals(player);\\n'''"
          new_repl="'''WorldMagicService.stop(player);\\n            WorldMagicService.clearVisuals(player);'''"
          if old_search not in s or old_repl not in s:
              raise SystemExit('manual-vfx45 lifecycle-clear patch anchor missing')
          s=s.replace(old_search,new_search,1).replace(old_repl,new_repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 .github/scripts/manual-vfx45.py
          echo 'alpha.45 source migration committed; stop this old-SHA run before audit/build/publish'
          exit 1

      - name: Audit committed current source without mutation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_current_source.py 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-audit.log"
          test "$(find ../../.github/workflows -maxdepth 1 -type f -iname '*arcane*.yml' | wc -l)" -eq 1
          test -f ../../.github/workflows/build-arcane-circle.yml
          test "$(find tools -maxdepth 1 -type f | wc -l)" -eq 2
          test -f tools/test_current_source.py
          test -f tools/verify_jar.py
          git diff --check
          git diff --exit-code

      - name: Build Java 25 runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-gradle.log"

      - name: Verify current JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          test -f "build/libs/$EXPECTED_JAR.sha256"
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-${{ env.MOD_VERSION }}
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified JAR only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p "$PUBLISHED_DIR"
            rm -f "$PUBLISHED_DIR"/arcanecircle-*.jar "$PUBLISHED_DIR"/arcanecircle-*.jar.sha256
            cp "deliverables/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
            cp "deliverables/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
            git add -A "$PUBLISHED_DIR"
            if git diff --cached --quiet; then published=1; break; fi
            git commit -m "Publish Arcane Circle $MOD_VERSION verified JAR [skip ci]"
            if git push origin HEAD:main; then published=1; break; fi
            sleep $((attempt * 2))
          done
          test "$published" -eq 1

      - name: Record current CI result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arcane-result
          mkdir -p /tmp/arcane-result
          if test -f "$GITHUB_WORKSPACE/arcane-circle-gradle.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-gradle.log" /tmp/arcane-result/latest-gradle.log
          elif test -f "$GITHUB_WORKSPACE/arcane-circle-audit.log"; then
            cp "$GITHUB_WORKSPACE/arcane-circle-audit.log" /tmp/arcane-result/latest-gradle.log
          else
            printf '%s\n' 'Migration-only run; canonical build intentionally skipped.' > /tmp/arcane-result/latest-gradle.log
          fi
          cat > /tmp/arcane-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=$MOD_VERSION
          source_mutation=disabled
          presentation_phase=current-cinematic-ui-vfx-regalia
          retired_visual_stack=absent
          legacy_arcane_tooling=absent
          repository_cleanup=complete
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/arcane-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then recorded=1; break; fi
            git commit -m "Record Arcane Circle $MOD_VERSION CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then recorded=1; break; fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1

# Canonical Arcane workflow: temporary migration step self-removes with the alpha.45 source commit.
