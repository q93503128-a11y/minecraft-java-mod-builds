name: Build Arcane Circle

on:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/**'
      - '.github/workflows/build-arcane-circle.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-main
  cancel-in-progress: true

jobs:
  migrate:
    name: Deterministic alpha.45 manual-audit migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply alpha.45 source fixes and restore canonical workflow
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/scripts/manual-vfx45.py
          test -f projects/arcane-circle/.canonical-vfx45-workflow.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/manual-vfx45.py')
          s=p.read_text(encoding='utf-8')

          old="""canonical = subprocess.check_output(\n    ['git', 'show', 'HEAD^:.github/workflows/build-arcane-circle.yml'], text=True\n)\nwrite(WORKFLOW, canonical)\n"""
          new="""backup = ROOT / '.canonical-vfx45-workflow.txt'\ncanonical = backup.read_text(encoding='utf-8')\nwrite(WORKFLOW, canonical)\nbackup.unlink()\n"""
          if old not in s:
              raise SystemExit('canonical restore anchor missing')
          s=s.replace(old,new,1)

          old_search="'            WorldMagicService.stop(player);\\n'"
          new_search="'WorldMagicService.stop(player);'"
          old_repl="'''            WorldMagicService.stop(player);\\n            WorldMagicService.clearVisuals(player);\\n'''"
          new_repl="'''WorldMagicService.stop(player);\\n            WorldMagicService.clearVisuals(player);'''"
          if old_search not in s or old_repl not in s:
              raise SystemExit('lifecycle-clear patch anchor missing')
          s=s.replace(old_search,new_search,1).replace(old_repl,new_repl,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 .github/scripts/manual-vfx45.py

      - name: Record migration failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ci-results/arcane-circle
            cat > ci-results/arcane-circle/status.txt <<STATUS
          status=migration_failure
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=not_run
          gradle=not_run
          version=0.12.1-alpha.44
          source_mutation=not_committed
          presentation_phase=manual-audit-alpha45-migration
          retired_visual_stack=absent
          legacy_arcane_tooling=absent
          repository_cleanup=pending
          STATUS
            git add ci-results/arcane-circle/status.txt
            git commit -m "Record Arcane alpha.45 migration failure for ${GITHUB_SHA::7} [skip ci]" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
