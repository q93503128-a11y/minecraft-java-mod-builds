name: Build Arcane Circle

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/tmp_arcane_alpha46_audit_fix.py'
      - '.github/workflows/build-arcane-circle.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-main
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/tmp_arcane_alpha46_audit_fix.py
