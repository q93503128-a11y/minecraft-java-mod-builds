name: Build Village Guardians v0.18.2 Runtime Stability

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger-v0182'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: village-guardians-v0182-main
  cancel-in-progress: false

env:
  PROJECT_DIR: projects/village-guardians
  EXPECTED_JAR: villageguardians-0.18.2-alpha.1.jar
  PUBLISHED_DIR: published/village-guardians
  RESULT_DIR: ci-results/village-guardians-v0182

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply runtime stability patch
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/v0182/apply.py
          python3 tools/v0182/apply.py

      - name: Run complete contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          {
            status=0
            while IFS= read -r test; do
              echo "=== $test ==="
              python3 "$test" || status=1
            done < <(find tools -maxdepth 1 -type f -name 'test_*.py' | sort)
            exit "$status"
          } 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0182-contracts.log"

      - name: Build Java 25 JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0182-gradle.log"

      - name: Verify artifact and bytecode
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          test -f "build/libs/$EXPECTED_JAR.sha256"
          unzip -t "build/libs/$EXPECTED_JAR" > "$GITHUB_WORKSPACE/village-guardians-v0182-unzip.log"
          unzip -l "build/libs/$EXPECTED_JAR" | grep -q 'VillageEquipmentIdentity.class'
          unzip -l "build/libs/$EXPECTED_JAR" | grep -q 'VillageMercenarySnapshotData.class'
          javap -classpath "build/libs/$EXPECTED_JAR" -c -p \
            kr.moonseungjun.villageguardians.VillageEquipmentShop \
            kr.moonseungjun.villageguardians.VillageTradingSystem \
            kr.moonseungjun.villageguardians.VillageRelicSystem \
            kr.moonseungjun.villageguardians.VillageRaidSystem \
            kr.moonseungjun.villageguardians.VillageRespawnSystem \
            kr.moonseungjun.villageguardians.VillageRoleSkillSystem \
            kr.moonseungjun.villageguardians.VillageEquipmentIdentity \
            kr.moonseungjun.villageguardians.VillageMercenarySnapshotData \
            > "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'saleValue' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'hasPendingChoice' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'shouldDiscardStaleRaidEnemy' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'handleFinalDamage' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'stampRarity' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          mkdir -p "$GITHUB_WORKSPACE/deliverables-v0182"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables-v0182/"
          cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables-v0182/"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-contracts.log" "$GITHUB_WORKSPACE/deliverables-v0182/"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-gradle.log" "$GITHUB_WORKSPACE/deliverables-v0182/"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log" "$GITHUB_WORKSPACE/deliverables-v0182/"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-unzip.log" "$GITHUB_WORKSPACE/deliverables-v0182/"

      - uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.18.2-alpha.1
          path: deliverables-v0182/
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified source and JAR directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$PROJECT_DIR/tools/v0182"
          rm -f .github/workflows/build-village-guardians-v0182.yml
          rm -f "$PROJECT_DIR/.build-trigger-v0182"

          # Confirmed obsolete Village Guardians source-patch infrastructure.
          rm -f .github/workflows/apply-village-guardians-v0173-source.yml
          rm -f "$PROJECT_DIR"/.apply-trigger-v0173 "$PROJECT_DIR"/.inspect-trigger-v0173 \
                "$PROJECT_DIR"/.active-slot-trigger-v0173
          find "$PROJECT_DIR" -maxdepth 1 -type f -name '.build-trigger-v017*' -delete
          rm -f "$PROJECT_DIR/tools/apply_v0172_compat_prepatch.py" \
                "$PROJECT_DIR/tools/apply_v0172_progression_audit.py" \
                "$PROJECT_DIR/tools/apply_v0173_ui_cleanup.py" \
                "$PROJECT_DIR/tools/apply_v0174_ui_safety.py"
          find "$PROJECT_DIR/tools" -type d -name '__pycache__' -prune -exec rm -rf {} +

          mkdir -p "$PUBLISHED_DIR"
          rm -f "$PUBLISHED_DIR"/villageguardians-0.18.1-alpha.1.jar \
                "$PUBLISHED_DIR"/villageguardians-0.18.1-alpha.1.jar.sha256
          cp "deliverables-v0182/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
          cp "deliverables-v0182/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$PROJECT_DIR" "$PUBLISHED_DIR" .github/workflows ci-results
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Village Guardians v0.18.2 runtime stability overhaul'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi

      - name: Record result
        if: always()
        shell: bash
        run: |
          set +e
          FINAL_STATUS='${{ job.status }}'
          TEMP_DIR="$RUNNER_TEMP/village-guardians-v0182-result"
          rm -rf "$TEMP_DIR" && mkdir -p "$TEMP_DIR"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-contracts.log" "$TEMP_DIR/latest-contracts.log" 2>/dev/null || \
            printf '%s\n' 'Contracts did not finish.' > "$TEMP_DIR/latest-contracts.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-gradle.log" "$TEMP_DIR/latest-gradle.log" 2>/dev/null || \
            printf '%s\n' 'Gradle did not finish.' > "$TEMP_DIR/latest-gradle.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log" "$TEMP_DIR/bytecode.log" 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-unzip.log" "$TEMP_DIR/unzip.log" 2>/dev/null || true
          cat > "$TEMP_DIR/status.txt" <<EOF
          status=$FINAL_STATUS
          trigger_sha=$GITHUB_SHA
          published_commit=$(git rev-parse HEAD 2>/dev/null)
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=0.18.2-alpha.1
          EOF
          git reset --hard HEAD
          git clean -fd
          mkdir -p "$RESULT_DIR"
          cp "$TEMP_DIR"/* "$RESULT_DIR/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record Village Guardians v0.18.2 result for ${GITHUB_SHA::7}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
