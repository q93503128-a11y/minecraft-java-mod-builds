name: Patch Living Kingdoms river port propulsion

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_river_port_propulsion.py'
      - '.github/workflows/patch-living-kingdoms-river-port-propulsion.yml'

concurrency:
  group: living-kingdoms-river-port-propulsion
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Patch collision-resolved Silver River barge propulsion
        run: python .github/scripts/fix_living_kingdoms_river_port_propulsion.py
      - name: Clean compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Verify propulsion invariants
        shell: bash
        run: |
          set -euo pipefail
          file='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenRiverPortManager.java'
          grep -Fq 'MoverType.SELF' "$file"
          grep -Fq 'new Vec3(moveX, 0.0D, moveZ)' "$file"
          grep -Fq 'collision_move=true' "$file"
          grep -Fq 'LK_ERDEN_RIVER_PORT_STALL' "$file"
          grep -Fq 'VESSEL_SPEED * VESSEL_INTERVAL' "$file"
      - name: Commit compiled source directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenRiverPortManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'fix(living-kingdoms): make Silver River barge physically progress'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
