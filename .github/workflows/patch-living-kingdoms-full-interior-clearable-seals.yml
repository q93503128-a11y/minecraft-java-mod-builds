name: Patch Living Kingdoms full interior clearable seals

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-living-kingdoms-full-interior-clearable-seals.yml'
      - '.github/scripts/patch_living_kingdoms_full_interior_clearable_seals.py'

concurrency:
  group: patch-living-kingdoms-full-interior-clearable-seals
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch-compile-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Apply clearable source-air seal planning
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_living_kingdoms_full_interior_clearable_seals.py
          git diff --check
          plan=projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanFullInteriorPlanCatalog.java
          grep -F 'CATALOG_REVISION = 3' "$plan"
          grep -F 'isClearableSourceAirSeal' "$plan"
          grep -F 'sourceAir(snapshot, blocks, x, feetY - 1, z)' "$plan"

      - name: Java 25 clean compile
        working-directory: projects/living-kingdoms
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Commit verified product source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanFullInteriorPlanCatalog.java
          git commit -m 'fix(living-kingdoms): honor proven source-air crop seals'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
