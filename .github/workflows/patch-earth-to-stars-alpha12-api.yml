name: Patch EARTH TO STARS alpha.12 26.2 APIs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-earth-to-stars-alpha12-api.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply narrow 26.2 API corrections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/earth-to-stars')

          def replace(path: Path, old: str, new: str, expected: int | None = None):
              body = path.read_text(encoding='utf-8')
              count = body.count(old)
              if count == 0:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              if expected is not None and count != expected:
                  raise SystemExit(f'unexpected replacement count in {path}: {count} != {expected}')
              path.write_text(body.replace(old, new), encoding='utf-8')

          exterior = root / 'src/main/java/kr/moonseungjun/earthtostars/ship/runtime/minecraft/ShipExteriorEntity.java'
          replace(exterior, 'player.displayClientMessage(', 'player.sendSystemMessage(', expected=1)
          replace(exterior, 'public boolean canBeCollidedWith() {', 'public boolean canBeCollidedWith(Entity other) {', expected=1)

          runtime = root / 'src/main/java/kr/moonseungjun/earthtostars/ship/runtime/minecraft/ShipRuntimeManager.java'
          replace(runtime, 'displayClientMessage(', 'sendSystemMessage(', expected=10)

          supply = root / 'src/main/java/kr/moonseungjun/earthtostars/content/ShipSupplyItem.java'
          replace(supply, 'displayClientMessage(', 'sendSystemMessage(', expected=3)

          visual = root / 'src/main/java/kr/moonseungjun/earthtostars/ship/runtime/minecraft/SpaceVisualFactory.java'
          body = visual.read_text(encoding='utf-8')
          old_import = 'import net.minecraft.server.level.ServerLevel;\nimport net.minecraft.world.entity.Display;\nimport net.minecraft.world.entity.EntityType;'
          new_import = 'import net.minecraft.core.registries.BuiltInRegistries;\nimport net.minecraft.resources.Identifier;\nimport net.minecraft.server.level.ServerLevel;\nimport net.minecraft.world.entity.Display;\nimport net.minecraft.world.entity.EntityType;'
          if old_import not in body:
              raise SystemExit('SpaceVisualFactory import anchor changed')
          body = body.replace(old_import, new_import, 1)
          old_ctor = 'Display.ItemDisplay display = new Display.ItemDisplay(EntityType.ITEM_DISPLAY, level);'
          new_ctor = '''EntityType<?> itemDisplayType = BuiltInRegistries.ENTITY_TYPE.getValue(Identifier.withDefaultNamespace("item_display"));\n        if (itemDisplayType == null) {\n            throw new IllegalStateException("minecraft:item_display is not registered");\n        }\n        Display.ItemDisplay display = new Display.ItemDisplay(itemDisplayType, level);'''
          if old_ctor not in body:
              raise SystemExit('SpaceVisualFactory ItemDisplay constructor anchor changed')
          visual.write_text(body.replace(old_ctor, new_ctor, 1), encoding='utf-8')

          validator = root / 'tools/validate_alpha12_acceptance.py'
          body = validator.read_text(encoding='utf-8')
          old = '''    if "sendSystemMessage" in source:\n        fail("supply feedback still writes repeatable lines into chat")\n    if source.count("displayClientMessage") < 3:\n        fail("supply success/full/no-ship feedback is not consistently actionbar based")'''
          new = '''    if "displayClientMessage" in source:\n        fail("obsolete pre-26.2 player feedback API remains in supply UX")\n    if source.count("sendSystemMessage") < 3 or source.count(", true);") < 3:\n        fail("supply success/full/no-ship feedback is not consistently actionbar based")'''
          if old not in body:
              raise SystemExit('alpha12 validator supply anchor changed')
          validator.write_text(body.replace(old, new, 1), encoding='utf-8')
          PY

          git diff --check
      - name: Commit corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/earth-to-stars
          if git diff --cached --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git commit -m 'fix(earth-to-stars): align alpha12 runtime with 26.2 APIs'
          git push origin HEAD:main
