name: Audit Living Kingdoms exterior estates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-exterior-estates.yml'

concurrency:
  group: living-kingdoms-exterior-estates-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Prove estate authority and integration
        shell: bash
        run: |
          set -euo pipefail
          main="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java"
          estate="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorEstateManager.java"
          saved="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorEstateSavedData.java"
          lifecycle="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleManager.java"

          grep -F 'import kr.moonseungjun.livingkingdoms.world.ErdenExteriorEstateManager;' "$main"
          grep -F 'ErdenExteriorEstateManager.onServerTick(event);' "$main"
          workforce_line=$(grep -n 'ErdenExteriorWorkforceManager.onServerTick(event);' "$main" | cut -d: -f1)
          estate_line=$(grep -n 'ErdenExteriorEstateManager.onServerTick(event);' "$main" | cut -d: -f1)
          test "$estate_line" -gt "$workforce_line"

          grep -F 'erden_exterior_estates' "$saved"
          grep -F 'public static final int ESTATE_REVISION = 1;' "$estate"
          grep -F 'EXPECTED_ESTATES = ErdenExteriorWorkforceManager.EXPECTED_HOUSEHOLDS' "$estate"
          grep -F 'ownership_persistent=true' "$estate"
          grep -F 'inheritance_preserves_home=true' "$estate"
          grep -F 'inheritance_preserves_reserve=true' "$estate"
          grep -F 'public static boolean birthAllowed(' "$estate"
          grep -F 'public static String describeHousehold(' "$estate"
          grep -F 'ErdenExteriorEstateManager.birthAllowed(level, household.id())' "$lifecycle"
          grep -F 'ErdenExteriorEstateManager.describeHousehold(level, person.householdId())' "$lifecycle"
          grep -F 'return processBirths(null, people, lines, workforce, day, year, nextSequence);' "$lifecycle"
          grep -F 'ci_projection_non_persistent=true' "$lifecycle"

          ! grep -R 'patch_living_kingdoms_exterior_estates_integration' .github/scripts .github/workflows \
            --exclude='audit-living-kingdoms-exterior-estates.yml' 2>/dev/null

      - name: Java 25 compile
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p ../../logs
          gradle --no-daemon clean classes --stacktrace --console=plain \
            2>&1 | tee ../../logs/exterior-estates-compile.log

      - name: Fresh world estate, lifecycle, workforce and supply audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-exterior-estates-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-exterior-estates-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/exterior-estates-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 2400); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/exterior-estates-server.log; then
              cat ../../logs/exterior-estates-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_EXTERIOR_ESTATES_PASS revision=1 estates=74' ../../logs/exterior-estates-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_LIFECYCLE_PASS revision=1 founders=216 households=74' ../../logs/exterior-estates-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_WORKFORCE_PASS revision=1 nodes=18 households=74 residents=216 workers=142' ../../logs/exterior-estates-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_TICKETS_PASS revision=1 anchors=104 released=104 explicit_release=true persistent_forced_chunks=false' ../../logs/exterior-estates-server.log \
              && grep -Fq 'LK_ERDEN_KINGDOM_EXTERIOR_PASS revision=1 nodes=18 producers=15 wharves=3' ../../logs/exterior-estates-server.log \
              && grep -Fq 'LK_ERDEN_KINGDOM_SUPPLY_PASS revision=1 nodes=18 producers=15 wharves=3 resources=6 opening_convoys=18' ../../logs/exterior-estates-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/exterior-estates-server.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/exterior-estates-server.log
          test "$passed" -eq 1
          grep -F 'Prepared Erden exterior estates revision=1 estates=74 capacity=5 ownership_persistent=true succession_linked=true maintenance_reserves=true vacancy_tracking=true overcrowding_tracking=true' ../../logs/exterior-estates-server.log
          grep -E 'LK_ERDEN_EXTERIOR_ESTATES_PASS revision=1 estates=74 occupied=[1-9][0-9]* vacant=[0-9]+ overcrowded=[0-9]+ linked_stewards=74 linked_homes=74 maintenance_reserve=[1-9][0-9]* minimum_condition=[1-9][0-9]*' ../../logs/exterior-estates-server.log
          grep -F 'ownership_persistent=true inheritance_preserves_home=true inheritance_preserves_reserve=true succession_linked=true vacancy_tracking=true overcrowding_tracking=true' ../../logs/exterior-estates-server.log
          grep -E 'projected_births=[1-9][0-9]* projected_successions=[1-9][0-9]* projected_replacement_workers=[1-9][0-9]* projected_years=20 ci_projection_non_persistent=true' ../../logs/exterior-estates-server.log
          grep -F 'storage_yards_observed=18 resident_sample_observed=true validation_revision=2' ../../logs/exterior-estates-server.log
          grep -F 'workforce_linked=true staffed_production=true wharf_labor=true' ../../logs/exterior-estates-server.log
          grep -F 'fixed_daily_imports=false' ../../logs/exterior-estates-server.log
          grep -F 'shipment_escrow=true' ../../logs/exterior-estates-server.log

          if grep -Eqi 'watchdog|A single server tick took|Invalid block entity|Failed to create block entity|Invalid Erden exterior estate|Invalid Erden exterior lifecycle|Duplicate Erden lifecycle|Missing Erden lifecycle projection person|Exception loading level|EventBusSubscriber.*failed' ../../logs/exterior-estates-server.log; then
            exit 1
          fi

      - name: Upload estate audit logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-exterior-estates-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Record estate audit pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            mkdir -p .github/build-pointers
            cat > .github/build-pointers/living-kingdoms-exterior-estates.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID"
          }
          EOF
            git add .github/build-pointers/living-kingdoms-exterior-estates.json
            git commit -m "Record Living Kingdoms exterior estate audit $GITHUB_RUN_NUMBER" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
