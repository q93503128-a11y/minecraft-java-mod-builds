name: Frontier + Survival full regression audit 20260906

on:
  push:
    branches:
      - audit/frontier-survival-salvage-20260906
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Normalize remaining freight guide authority
        run: python3 tools/normalize_survival_guide_authority_20260906.py

      - name: Validate project resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          for project in ('frontier-settlement', 'survival-ascension'):
              root = Path('projects') / project / 'src' / 'main' / 'resources'
              count = 0
              for path in root.rglob('*.json'):
                  with path.open('r', encoding='utf-8') as f:
                      json.load(f)
                  count += 1
              print(project, 'json_ok', count)
          PY

      - name: Frontier canonical source audit
        run: python3 projects/frontier-settlement/tools/test_current_source.py

      - name: Survival Ascension canonical source audit
        run: python3 projects/survival-ascension/tools/test_current_source.py

      - name: Build Frontier Settlement
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Build Survival Ascension
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon --stacktrace

      - name: Inspect built jars
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          checks = [
              (Path('projects/frontier-settlement/build/libs'), 'frontier_settlement'),
              (Path('projects/survival-ascension/build/libs'), 'survivalascension'),
          ]
          for directory, token in checks:
              jars = [p for p in directory.glob('*.jar') if '-sources' not in p.name and '-javadoc' not in p.name]
              if not jars:
                  raise SystemExit(f'no runtime jar in {directory}')
              jar = max(jars, key=lambda p: p.stat().st_mtime_ns)
              with zipfile.ZipFile(jar) as z:
                  names = set(z.namelist())
                  if 'META-INF/MANIFEST.MF' not in names:
                      raise SystemExit(f'{jar}: missing manifest')
                  if not any(token in n.lower() for n in names):
                      raise SystemExit(f'{jar}: expected class/resource token {token!r} missing')
              print(jar, jar.stat().st_size)
          PY

      - name: Commit verified source fixes
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/frontier-settlement projects/survival-ascension
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'Canonicalize frontline guide authority'
            git push origin HEAD:audit/frontier-survival-salvage-20260906
          fi
