name: TITANBREAK B03 Bastion CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/titanbreak/**'
      - '.github/workflows/titanbreak-b03-bastion-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bastion-b03:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical B03 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          project = Path('projects/titanbreak')
          root = project / 'src/main'
          java = root / 'java/kr/moonseungjun/titanbreak'
          assets = root / 'resources/assets/titanbreak'

          entity = (java / 'entity/BastionWalkerEntity.java').read_text(encoding='utf-8')
          registry = (java / 'registry/ModBossEntities.java').read_text(encoding='utf-8')
          reward = (java / 'combat/BastionRewardService.java').read_text(encoding='utf-8')
          encounter = (java / 'world/BastionEncounterService.java').read_text(encoding='utf-8')
          traversal = (java / 'world/BastionTraversalService.java').read_text(encoding='utf-8')
          renderer = (java / 'client/BastionWalkerRenderer.java').read_text(encoding='utf-8')
          renderers = (java / 'client/TitanEntityRenderers.java').read_text(encoding='utf-8')
          main = (java / 'Titanbreak.java').read_text(encoding='utf-8')
          asset_registry = (project / 'ASSET_REGISTRY.md').read_text(encoding='utf-8')
          gradle = (project / 'gradle.properties').read_text(encoding='utf-8')

          version = re.search(r'mod_version=0\.1\.0-alpha\.(\d+)', gradle)
          assert version and int(version.group(1)) >= 44, 'B03 requires alpha.44 or newer'
          assert 'CANONICAL_VISIBLE_MAX_HEALTH = 26_000.0D' in entity
          assert re.search(r'int temporalRating\(\)\s*\{\s*return 8;', entity), 'TR8 missing'

          part_tokens = (
              'PART_LEG_NW','PART_LEG_NE','PART_LEG_SW','PART_LEG_SE',
              'PART_PLATE_NORTH_LOWER','PART_PLATE_NORTH_UPPER',
              'PART_PLATE_EAST_LOWER','PART_PLATE_EAST_UPPER',
              'PART_PLATE_SOUTH_LOWER','PART_PLATE_SOUTH_UPPER',
              'PART_PLATE_WEST_LOWER','PART_PLATE_WEST_UPPER',
              'PART_UPPER_NODE','PART_POWER_CORE'
          )
          for token in part_tokens:
              assert token in entity, token
          assert 'brokenArmorPlateCount() >= 6' in entity
          assert 'isPartBroken(PART_UPPER_NODE)' in entity
          for token in ('scheduleTurretShot(', 'legSweep(', 'shakeHull(', 'releaseParasites(', 'startArmorClosure('):
              assert token in entity, token
          assert 'routeGateOpen(' in entity
          assert 'wire_hook_arm' in traversal and 'wall_run_spurs' in traversal and 'propulsion_legs' in traversal

          assert 'BASTION_WALKER' in registry
          assert 'CombatScale.toInternal(BastionWalkerEntity.CANONICAL_VISIBLE_MAX_HEALTH)' in registry
          assert 'BASTION_ARMOR_CORE.get(), 1' in reward
          assert 'COMPOSITE_ARMOR_PLATE.get(), 6 + victim.getRandom().nextInt(5)' in reward
          assert 'DENSE_BONE_LATTICE.get(), 4 + victim.getRandom().nextInt(3)' in reward
          assert 'recordBossFirstKill(player, "bastion_walker", FIRST_KILL_RD, 4)' in reward
          assert 'hasBossFirstKill("gravemarch_colossus")' in encounter
          assert 'hasBossFirstKill("bastion_walker")' in encounter
          assert 'ModBossEntities.BASTION_WALKER.get()' in encounter
          assert 'BastionEncounterService.tick(player, state)' in main
          assert 'BastionTraversalService.tick(player, state)' in main
          assert 'BastionRewardService::onLivingDeath' in main
          assert 'ModBossEntities.BASTION_WALKER.get(), BastionWalkerRenderer::new' in renderers
          assert 'withScale(60.0F)' in renderer

          geo = assets / 'geckolib/models/entity/bastion_walker.geo.json'
          anim = assets / 'geckolib/animations/entity/bastion_walker.animation.json'
          texture = assets / 'textures/entity/bastion_walker.png'
          for path in (geo, anim, texture):
              assert path.is_file(), path
          geometry = json.loads(geo.read_text(encoding='utf-8'))
          assert 'minecraft:geometry' in geometry
          animations = json.loads(anim.read_text(encoding='utf-8')).get('animations', {})
          for key in ('misc.idle','move.walk','attack.swing'):
              assert key in animations, key

          overlay = root / 'resources/assets/titanbreak_boss/lang'
          for lang in ('en_us','ko_kr'):
              data = json.loads((overlay / f'{lang}.json').read_text(encoding='utf-8'))
              for key in ('entity.titanbreak.bastion_walker','message.titanbreak.bastion_warning',
                          'message.titanbreak.bastion_arrival','message.titanbreak.bastion_defeated'):
                  assert key in data, (lang,key)

          assert '| Bastion Walker model / animation / texture |' in asset_registry
          PY
