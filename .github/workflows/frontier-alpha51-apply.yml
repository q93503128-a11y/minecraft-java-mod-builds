name: Apply Frontier Settlement Alpha 51

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha51-apply.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha51-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Alpha.51 source docs and audits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('.')
          P = ROOT / 'projects/frontier-settlement'
          JAVA = P / 'src/main/java/kr/moonseungjun/frontiersettlement'

          def read(path):
              return path.read_text(encoding='utf-8')

          def write(path, text):
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old[:120]!r}')
              write(path, text.replace(old, new, 1))

          # ------------------------------------------------------------------
          # Civil state: preserve Alpha.50 numeric phases; add PHASE_RETAIN=3.
          # ------------------------------------------------------------------
          write(JAVA / 'settlement/CivilWorkState.java', '''package kr.moonseungjun.frontiersettlement.settlement;

import com.mojang.serialization.Codec;
import com.mojang.serialization.codecs.RecordCodecBuilder;
import net.minecraft.core.BlockPos;

/** Persisted bounded selected-area earthwork state. Project-local earth balance is never a settlement resource. */
public record CivilWorkState(boolean active,
                             int minX, int maxX, int minZ, int maxZ,
                             int gradeY,
                             int phase,
                             int earthBank,
                             int completedSteps,
                             int initialCutBlocks,
                             int initialFillBlocks,
                             int initialRetainingBlocks) {
    public static final int PHASE_CUT = 0;
    public static final int PHASE_FILL = 1;
    public static final int PHASE_RETURN = 2;
    public static final int PHASE_RETAIN = 3;
    public static final CivilWorkState EMPTY = new CivilWorkState(false, 0, 0, 0, 0, 0, PHASE_CUT, 0, 0, 0, 0, 0);

    public static final Codec<CivilWorkState> CODEC = RecordCodecBuilder.create(instance -> instance.group(
            Codec.BOOL.optionalFieldOf("active", false).forGetter(CivilWorkState::active),
            Codec.INT.optionalFieldOf("min_x", 0).forGetter(CivilWorkState::minX),
            Codec.INT.optionalFieldOf("max_x", 0).forGetter(CivilWorkState::maxX),
            Codec.INT.optionalFieldOf("min_z", 0).forGetter(CivilWorkState::minZ),
            Codec.INT.optionalFieldOf("max_z", 0).forGetter(CivilWorkState::maxZ),
            Codec.INT.optionalFieldOf("grade_y", 0).forGetter(CivilWorkState::gradeY),
            Codec.INT.optionalFieldOf("phase", PHASE_CUT).forGetter(CivilWorkState::phase),
            Codec.INT.optionalFieldOf("earth_bank", 0).forGetter(CivilWorkState::earthBank),
            Codec.INT.optionalFieldOf("completed_steps", 0).forGetter(CivilWorkState::completedSteps),
            Codec.INT.optionalFieldOf("initial_cut_blocks", 0).forGetter(CivilWorkState::initialCutBlocks),
            Codec.INT.optionalFieldOf("initial_fill_blocks", 0).forGetter(CivilWorkState::initialFillBlocks),
            Codec.INT.optionalFieldOf("initial_retaining_blocks", 0).forGetter(CivilWorkState::initialRetainingBlocks)
    ).apply(instance, CivilWorkState::new));

    public CivilWorkState {
        if (!active) {
            minX = maxX = minZ = maxZ = gradeY = earthBank = completedSteps = initialCutBlocks = initialFillBlocks = initialRetainingBlocks = 0;
            phase = PHASE_CUT;
        } else {
            if (minX > maxX) { int swap = minX; minX = maxX; maxX = swap; }
            if (minZ > maxZ) { int swap = minZ; minZ = maxZ; maxZ = swap; }
            phase = phase == PHASE_FILL || phase == PHASE_RETURN || phase == PHASE_RETAIN ? phase : PHASE_CUT;
            earthBank = Math.max(0, earthBank);
            completedSteps = Math.max(0, completedSteps);
            initialCutBlocks = Math.max(0, initialCutBlocks);
            initialFillBlocks = Math.max(0, initialFillBlocks);
            initialRetainingBlocks = Math.max(0, initialRetainingBlocks);
        }
    }

    public int width() { return active ? maxX - minX + 1 : 0; }
    public int depth() { return active ? maxZ - minZ + 1 : 0; }
    public int area() { return width() * depth(); }
    public int totalSteps() { return initialCutBlocks + initialRetainingBlocks + initialFillBlocks; }
    public int completedRetainingBlocks() {
        if (phase == PHASE_CUT) return 0;
        if (phase == PHASE_RETAIN) {
            return Math.min(initialRetainingBlocks, Math.max(0, completedSteps - initialCutBlocks));
        }
        return initialRetainingBlocks;
    }
    public int remainingRetainingBlocks() {
        return Math.max(0, initialRetainingBlocks - completedRetainingBlocks());
    }
    public int progressPercent() {
        if (phase == PHASE_RETURN) return 100;
        return totalSteps() <= 0 ? 0 : Math.min(100, completedSteps * 100 / totalSteps());
    }
    public BlockPos center() { return new BlockPos((minX + maxX) / 2, gradeY, (minZ + maxZ) / 2); }

    public CivilWorkState afterCut() {
        return new CivilWorkState(true, minX, maxX, minZ, maxZ, gradeY, PHASE_CUT,
                earthBank + 1, completedSteps + 1, initialCutBlocks, initialFillBlocks, initialRetainingBlocks);
    }

    public CivilWorkState beginRetaining() {
        return new CivilWorkState(true, minX, maxX, minZ, maxZ, gradeY, PHASE_RETAIN,
                earthBank, completedSteps, initialCutBlocks, initialFillBlocks, initialRetainingBlocks);
    }

    public CivilWorkState afterRetaining() {
        return new CivilWorkState(true, minX, maxX, minZ, maxZ, gradeY, PHASE_RETAIN,
                earthBank, completedSteps + 1, initialCutBlocks, initialFillBlocks, initialRetainingBlocks);
    }

    public CivilWorkState beginFill() {
        return new CivilWorkState(true, minX, maxX, minZ, maxZ, gradeY, PHASE_FILL,
                earthBank, completedSteps, initialCutBlocks, initialFillBlocks, initialRetainingBlocks);
    }

    public CivilWorkState afterFill() {
        return new CivilWorkState(true, minX, maxX, minZ, maxZ, gradeY, PHASE_FILL,
                Math.max(0, earthBank - 1), completedSteps + 1, initialCutBlocks, initialFillBlocks, initialRetainingBlocks);
    }

    public CivilWorkState beginReturn() {
        return new CivilWorkState(true, minX, maxX, minZ, maxZ, gradeY, PHASE_RETURN,
                earthBank, completedSteps, initialCutBlocks, initialFillBlocks, initialRetainingBlocks);
    }
}
''')

          # ------------------------------------------------------------------
          # Retaining supplier/planner. Exact COBBLESTONE authority only.
          # ------------------------------------------------------------------
          write(JAVA / 'settlement/SettlementCivilRetainingService.java', '''package kr.moonseungjun.frontiersettlement.settlement;

import net.minecraft.core.BlockPos;
import net.minecraft.server.level.ServerLevel;
import net.minecraft.world.Container;
import net.minecraft.world.entity.EquipmentSlot;
import net.minecraft.world.entity.npc.villager.Villager;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.item.Items;
import net.minecraft.world.level.block.Blocks;
import net.minecraft.world.level.block.state.BlockState;
import net.minecraft.world.level.levelgen.Heightmap;

import java.util.ArrayList;
import java.util.List;

/** Alpha.51 physical retaining-wall planner and exact cobblestone hauling support. */
public final class SettlementCivilRetainingService {
    public static final int MIN_RETAINING_HEIGHT = 3;
    public static final int MAX_RETAINING_HEIGHT = 7;
    public static final int HAUL_BATCH = 16;
    private static final double STORAGE_REACHED_SQR = 9.0D;

    private SettlementCivilRetainingService() {}

    public record Plan(boolean valid, List<BlockPos> positions, String message) {
        public static Plan invalid(String message) { return new Plan(false, List.of(), message); }
        public int requiredBlocks() { return positions.size(); }
        public BlockPos nextMissing(ServerLevel level) {
            for (BlockPos pos : positions) if (!level.getBlockState(pos).is(Blocks.COBBLESTONE)) return pos;
            return null;
        }
    }

    private record BaseCheck(boolean valid, int baseY, String message) {
        static BaseCheck invalid(String message) { return new BaseCheck(false, 0, message); }
    }

    public static Plan checkPlan(ServerLevel level, int minX, int maxX, int minZ, int maxZ, int gradeY) {
        return buildPlan(level, minX, maxX, minZ, maxZ, gradeY, false);
    }

    public static Plan plan(ServerLevel level, CivilWorkState project) {
        if (project == null || !project.active()) return new Plan(true, List.of(), "");
        return buildPlan(level, project.minX(), project.maxX(), project.minZ(), project.maxZ(), project.gradeY(), true);
    }

    private static Plan buildPlan(ServerLevel level, int minX, int maxX, int minZ, int maxZ,
                                  int gradeY, boolean allowPlacedCobblestone) {
        List<BlockPos> positions = new ArrayList<>();
        for (int x = minX - 1; x <= maxX + 1; x++) {
            for (int z = minZ - 1; z <= maxZ + 1; z++) {
                if (x >= minX && x <= maxX && z >= minZ && z <= maxZ) continue;
                BlockPos outerTop = new BlockPos(x, gradeY, z);
                int interiorX = Math.max(minX, Math.min(maxX, x));
                int interiorZ = Math.max(minZ, Math.min(maxZ, z));
                BlockPos interiorTop = new BlockPos(interiorX, gradeY, interiorZ);
                if (!level.hasChunkAt(outerTop) || !level.hasChunkAt(interiorTop)) {
                    return Plan.invalid("테라스 외곽 1칸까지 모두 로드된 상태에서 토목을 시작해 주세요.");
                }

                int interiorSurface = level.getHeight(Heightmap.Types.MOTION_BLOCKING_NO_LEAVES, interiorX, interiorZ) - 1;
                if (interiorSurface >= gradeY) continue;

                BaseCheck base = findBase(level, x, z, gradeY, allowPlacedCobblestone);
                if (!base.valid()) return Plan.invalid(base.message());
                int height = gradeY - base.baseY();
                if (height < MIN_RETAINING_HEIGHT) continue;
                if (height > MAX_RETAINING_HEIGHT) {
                    return Plan.invalid("테라스 외곽 옹벽 높이는 최대 " + MAX_RETAINING_HEIGHT + "블록입니다. 더 큰 협곡 공사는 아직 지원하지 않습니다.");
                }
                for (int y = base.baseY() + 1; y <= gradeY; y++) {
                    BlockPos pos = new BlockPos(x, y, z);
                    BlockState state = level.getBlockState(pos);
                    if (level.getBlockEntity(pos) != null || !state.getFluidState().isEmpty()) {
                        return Plan.invalid("옹벽 예정 위치에 컨테이너나 유체가 있어 토목할 수 없습니다.");
                    }
                    if (state.is(Blocks.COBBLESTONE) && allowPlacedCobblestone) {
                        positions.add(pos);
                    } else if (state.isAir() || state.canBeReplaced()) {
                        positions.add(pos);
                    } else {
                        return Plan.invalid("옹벽 예정 위치에 플레이어 블록·구조물이 있어 토목할 수 없습니다.");
                    }
                }
            }
        }
        return new Plan(true, List.copyOf(positions), "");
    }

    private static BaseCheck findBase(ServerLevel level, int x, int z, int gradeY, boolean allowPlacedCobblestone) {
        for (int y = gradeY; y >= gradeY - MAX_RETAINING_HEIGHT; y--) {
            BlockPos pos = new BlockPos(x, y, z);
            BlockState state = level.getBlockState(pos);
            if (level.getBlockEntity(pos) != null || !state.getFluidState().isEmpty()) {
                return BaseCheck.invalid("테라스 외곽에 컨테이너나 유체가 있어 옹벽을 만들 수 없습니다.");
            }
            if (allowPlacedCobblestone && state.is(Blocks.COBBLESTONE)) continue;
            if (state.isAir() || state.canBeReplaced()) continue;
            if (SettlementCivilWorkService.isNaturalGround(state)) return new BaseCheck(true, y, "");
            return BaseCheck.invalid("테라스 외곽에 플레이어 블록·구조물·비자연 지형이 있어 옹벽을 만들 수 없습니다.");
        }
        return BaseCheck.invalid("테라스 외곽 지지 지면이 너무 낮습니다. 옹벽 높이는 최대 " + MAX_RETAINING_HEIGHT + "블록입니다.");
    }

    public static int availableRetaining(ServerLevel level, SettlementData data) {
        if (!SettlementStorageService.storageAvailable(level, data)) return -1;
        int total = 0;
        for (BlockPos pos : SettlementStorageService.storagePositions(data)) {
            if (!(level.getBlockEntity(pos) instanceof Container container)) continue;
            for (int slot = 0; slot < container.getContainerSize(); slot++) {
                ItemStack stack = container.getItem(slot);
                if (isRetainingStack(stack)) total += stack.getCount();
            }
        }
        return total;
    }

    public static int remainingRetaining(ServerLevel level, CivilWorkState project) {
        Plan plan = plan(level, project);
        if (!plan.valid()) return -1;
        int remaining = 0;
        for (BlockPos pos : plan.positions()) if (!level.getBlockState(pos).is(Blocks.COBBLESTONE)) remaining++;
        return remaining;
    }

    public static boolean ensureCarriedRetaining(ServerLevel level, SettlementData data, Villager builder,
                                                 CivilWorkState project) {
        ItemStack carried = builder.getMainHandItem();
        if (isRetainingStack(carried)) return true;
        if (!carried.isEmpty()) return false;
        int remaining = remainingRetaining(level, project);
        if (remaining <= 0) return false;
        BlockPos source = SettlementStorageService.findExtractionTarget(level, data,
                SettlementCivilRetainingService::isRetainingStack);
        if (source == null) return false;
        if (builder.distanceToSqr(source.getX() + 0.5D, source.getY() + 0.5D, source.getZ() + 0.5D)
                > STORAGE_REACHED_SQR) {
            builder.getNavigation().moveTo(source.getX() + 0.5D, source.getY(), source.getZ() + 0.5D, 0.86D);
            return false;
        }
        ItemStack picked = SettlementStorageService.extract(level, source,
                SettlementCivilRetainingService::isRetainingStack, Math.min(HAUL_BATCH, remaining));
        if (picked.isEmpty()) return false;
        builder.setItemSlot(EquipmentSlot.MAINHAND, picked);
        return true;
    }

    public static void consumeOne(Villager builder) {
        ItemStack carried = builder.getMainHandItem();
        if (!isRetainingStack(carried)) return;
        carried.shrink(1);
        if (carried.isEmpty()) builder.setItemSlot(EquipmentSlot.MAINHAND, ItemStack.EMPTY);
    }

    public static boolean isRetainingStack(ItemStack stack) {
        return stack.is(Items.COBBLESTONE);
    }
}
''')

