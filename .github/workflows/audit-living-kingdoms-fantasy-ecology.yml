name: Audit Living Kingdoms fantasy ecology

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-fantasy-ecology.yml'

concurrency:
  group: living-kingdoms-fantasy-ecology-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_FANTASY_ECOLOGY_TEST: '1'

jobs:
  audit:
    name: Fresh-world Erden fantasy ecology audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Clean compile fantasy ecology
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Verify ecology source guards
        shell: bash
        run: |
          set -euo pipefail
          registry='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/entity/FantasyEntityTypes.java'
          ecology='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenFantasyEcologyManager.java'
          renderers='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/client/FantasyEntityRenderers.java'
          main='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java'
          grep -Fq 'DeferredRegister.createEntities' "$registry"
          grep -Fq 'MobCategory.CREATURE' "$registry"
          grep -Fq 'MobCategory.MONSTER' "$registry"
          grep -Fq 'MobCategory.AMBIENT' "$registry"
          grep -Fq 'EntityAttributeCreationEvent' "$registry"
          grep -Fq 'FantasyEntityTypes.SILVER_HART.get(), GoatRenderer::new' "$renderers"
          grep -Fq 'FantasyEntityTypes.ASH_HOUND.get(), WolfRenderer::new' "$renderers"
          grep -Fq 'FantasyEntityTypes.RIVER_WISP.get(), AllayRenderer::new' "$renderers"
          grep -Fq 'insideCapital(x, z)' "$ecology"
          grep -Fq '!level.hasChunk(x >> 4, z >> 4)' "$ecology"
          grep -Fq 'LOCAL_SPECIES_CAP = 5' "$ecology"
          grep -Fq 'actual_custom_entity_types=true' "$ecology"
          grep -Fq 'FantasyEntityTypes.register(modEventBus)' "$main"
          grep -Fq 'ErdenFantasyEcologyManager.onServerTick(event)' "$main"
      - name: Exercise actual custom species in a fresh world
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          rm -rf run/world run/living_realm run/livingkingdoms-fantasy-ecology-ci-world
          printf 'level-name=livingkingdoms-fantasy-ecology-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/fantasy-ecology.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 1200); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/fantasy-ecology.log; then
              cat ../../logs/fantasy-ecology.log
              exit 1
            fi
            if grep -Eq 'Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError|Duplicate id' ../../logs/fantasy-ecology.log; then
              cat ../../logs/fantasy-ecology.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_FANTASY_ECOLOGY_PASS revision=1' ../../logs/fantasy-ecology.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/fantasy-ecology.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/fantasy-ecology.log
          test "$passed" -eq 1
          grep -F 'Prepared Erden fantasy ecology CI samples=3' ../../logs/fantasy-ecology.log
          grep -F 'actual_custom_entity_types=true actual_entity_instances=true' ../../logs/fantasy-ecology.log
          grep -F 'northern_forest_spawn=true western_hill_spawn=true silver_river_spawn=true capital_spawn=false' ../../logs/fantasy-ecology.log
          grep -F 'player_loaded_runtime=true local_species_cap=5 forced_citywide=false ci_sample_chunks=3 ci_tickets_released=true' ../../logs/fantasy-ecology.log
      - name: Upload fantasy ecology audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-fantasy-ecology-${{ github.run_number }}
          path: logs/fantasy-ecology.log
          if-no-files-found: warn
          retention-days: 30
