name: Build Village Guardians

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger'

permissions:
  contents: write

env:
  PROJECT_DIR: projects/village-guardians
  MOD_VERSION: 0.17.1-alpha.1
  EXPECTED_JAR: villageguardians-0.17.1-alpha.1.jar
  RELEASE_TAG: village-guardians-v0.17.1-alpha.1
  PUBLISHED_DIR: published/village-guardians
  CI_RESULT_DIR: ci-results/village-guardians

jobs:
  build:
    name: Java 25 / NeoForge 26.2 build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Run deterministic contract tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/test_rpg_balance.py
          python3 tools/test_village_zone.py
          python3 tools/test_progression_loop.py
          python3 tools/test_fortress_layout.py
          python3 tools/test_runtime_safety.py
          python3 tools/test_action_layout.py
          python3 tools/test_enemy_content.py

      - name: Clean NeoForge build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-gradle.log"

      - name: Verify runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - name: Upload verified JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.17.1-alpha.1
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified JAR to published directory
        run: |
          mkdir -p "$PUBLISHED_DIR"
          cp "deliverables/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
          cp "deliverables/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PUBLISHED_DIR/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          if git diff --cached --quiet; then
            echo 'Published JAR already matches this build.'
          else
            git commit -m 'Publish verified Village Guardians v0.17.1-alpha.1 JAR'
            git pull --rebase origin main
            git push
          fi

      - name: Publish or replace release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" deliverables/* --clobber
          else
            gh release create "$RELEASE_TAG" deliverables/* \
              --title 'Village Guardians v0.17.1-alpha.1' \
              --notes 'Java 25 / Minecraft 26.2 / NeoForge 26.2 beta. Rebuilds the town hall, facility, funding and status interfaces around compact selectors, wide descriptions and bounded action buttons. Legacy formatting is stripped so status text remains dark and readable on the parchment background. Facility management now displays current effects, exact next-stage changes, repair costs and upgrade costs before confirmation. Removes the physical caller item while preserving inventory and shortcut access, restores smithy equipment strengthening alongside free rarity fusion, and repairs the facade migration that carved large holes around entrance crests.'
          fi

      - name: Record CI result in repository
        if: always()
        shell: bash
        run: |
          mkdir -p "$CI_RESULT_DIR"
          if test -f "$GITHUB_WORKSPACE/village-guardians-gradle.log"; then
            cp "$GITHUB_WORKSPACE/village-guardians-gradle.log" "$CI_RESULT_DIR/latest-gradle.log"
          else
            printf '%s\n' 'Gradle step did not start or produced no log.' > "$CI_RESULT_DIR/latest-gradle.log"
          fi
          cat > "$CI_RESULT_DIR/status.txt" <<EOF
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898266+github-actions[bot]@users.noreply.github.com'
          git add "$CI_RESULT_DIR/status.txt" "$CI_RESULT_DIR/latest-gradle.log"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record Village Guardians CI result for ${GITHUB_SHA::7}"
          git pull --rebase origin main
          git push
