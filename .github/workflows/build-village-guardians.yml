name: Build Village Guardians

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/**'
      - '.github/workflows/build-village-guardians.yml'

permissions:
  contents: read
  statuses: write

env:
  PROJECT_SLUG: village-guardians
  MOD_ID: villageguardians
  MOD_VERSION: 0.9.4-alpha.1
  EXPECTED_JAR: villageguardians-0.9.4-alpha.1.jar
  GRADLE_VERSION: '9.2.1'
  DOCUMENTED_SOURCE_SHA256: 4fc0c1f550daae0f2e618e7119ef1a02c698b34bf0c2bb57ade6ef6481aaeb6f

jobs:
  build:
    name: Java 25 / NeoForge 26.2 verified build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report build pending
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='village-guardians/verified-build' \
            -f description='Java 25 / NeoForge build in progress' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Reconstruct and inspect source payload
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/projects/$PROJECT_SLUG/source"
          WORK_ROOT="$GITHUB_WORKSPACE/work/$PROJECT_SLUG"
          LOG_DIR="$GITHUB_WORKSPACE/logs/$PROJECT_SLUG"
          mkdir -p "$WORK_ROOT/extracted" "$LOG_DIR" "$GITHUB_WORKSPACE/deliverables"

          mapfile -t PARTS < <(find "$SOURCE_DIR" -maxdepth 1 -type f -name 'source.tar.xz.b64.part[0-9][0-9]' | sort)
          printf '%s\n' "${PARTS[@]}" | tee "$LOG_DIR/source-parts.txt"
          test "${#PARTS[@]}" -eq 14

          cat "${PARTS[@]}" > "$WORK_ROOT/source.tar.xz.b64"
          BASE64_SIZE="$(wc -c < "$WORK_ROOT/source.tar.xz.b64")"
          echo "$BASE64_SIZE" | tee "$LOG_DIR/source-base64-size.txt"
          test "$BASE64_SIZE" -eq 151624

          base64 --decode "$WORK_ROOT/source.tar.xz.b64" > "$WORK_ROOT/source.tar.xz"
          ACTUAL_SOURCE_SHA256="$(sha256sum "$WORK_ROOT/source.tar.xz" | awk '{print $1}')"
          {
            echo "documented=$DOCUMENTED_SOURCE_SHA256"
            echo "actual=$ACTUAL_SOURCE_SHA256"
          } | tee "$LOG_DIR/source-sha256.txt"
          echo "ACTUAL_SOURCE_SHA256=$ACTUAL_SOURCE_SHA256" >> "$GITHUB_ENV"
          if [ "$ACTUAL_SOURCE_SHA256" != "$DOCUMENTED_SOURCE_SHA256" ]; then
            echo '::warning::Documented source SHA differs from the reconstructed payload; continuing only after XZ and project-structure validation.'
          fi

          xz -t "$WORK_ROOT/source.tar.xz"
          tar -xJf "$WORK_ROOT/source.tar.xz" -C "$WORK_ROOT/extracted"
          PROJECT_DIR="$(find "$WORK_ROOT/extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -d "$PROJECT_DIR/src/main/java/kr/moonseungjun/villageguardians"
          test -f "$PROJECT_DIR/src/main/templates/META-INF/neoforge.mods.toml"
          test -f "$PROJECT_DIR/src/main/resources/assets/villageguardians/lang/en_us.json"
          test -f "$PROJECT_DIR/src/main/resources/assets/villageguardians/lang/ko_kr.json"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          find "$PROJECT_DIR/src/main/java" -type f -name '*.java' | sort | tee "$LOG_DIR/java-files.txt"
          find "$PROJECT_DIR/src/main/resources" "$PROJECT_DIR/src/main/templates" -type f | sort | tee "$LOG_DIR/resource-files.txt"

      - name: Record toolchain
        run: |
          set -euo pipefail
          { java -version; gradle --version; } 2>&1 | tee "$GITHUB_WORKSPACE/logs/$PROJECT_SLUG/toolchain.log"

      - name: Run pure Java smoke tests
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$GITHUB_WORKSPACE/logs/$PROJECT_SLUG"
          mkdir -p "$PROJECT_DIR/build/pure-smoke"
          mapfile -t TESTS < <(find "$PROJECT_DIR/tools" -maxdepth 1 -type f -name '*SmokeTest.java' | sort)
          test "${#TESTS[@]}" -ge 21
          javac -encoding UTF-8 -d "$PROJECT_DIR/build/pure-smoke" "${TESTS[@]}" \
            2>&1 | tee "$LOG_DIR/pure-smoke-compile.log"
          for src in "${TESTS[@]}"; do
            cls="$(basename "$src" .java)"
            java -cp "$PROJECT_DIR/build/pure-smoke" "$cls" \
              2>&1 | tee -a "$LOG_DIR/pure-smoke-run.log"
          done

      - name: Clean NeoForge build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/$PROJECT_SLUG/gradle-build.log"

      - name: Select and validate runtime JAR
        shell: bash
        run: |
          set -euo pipefail
          LOG_DIR="$GITHUB_WORKSPACE/logs/$PROJECT_SLUG"
          EXPECTED_PATH="$PROJECT_DIR/build/libs/$EXPECTED_JAR"
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -printf '%f\n' | sort | tee "$LOG_DIR/build-libs.txt"
          test -f "$EXPECTED_PATH"
          cp "$EXPECTED_PATH" "$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR"
          JAR="$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR"
          export JAR
          python3 - <<'PY' | tee "$LOG_DIR/jar-validation.log"
          import os, zipfile
          jar = os.environ['JAR']
          required = {
              'META-INF/neoforge.mods.toml',
              'kr/moonseungjun/villageguardians/VillageGuardians.class',
              'assets/villageguardians/lang/en_us.json',
              'assets/villageguardians/lang/ko_kr.json',
          }
          if not zipfile.is_zipfile(jar):
              raise SystemExit('Runtime output is not a valid ZIP/JAR')
          with zipfile.ZipFile(jar) as zf:
              names = zf.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate JAR entries found')
              missing = sorted(required.difference(names))
              if missing:
                  raise SystemExit(f'Missing required entries: {missing}')
              if not any(n.startswith('kr/moonseungjun/villageguardians/') and n.endswith('.class') for n in names):
                  raise SystemExit('No compiled Village Guardians classes found')
              forbidden = [n for n in names if n.endswith(('.java', '.bbmodel')) or n.startswith(('tools/', '.github/')) or n.endswith('_REPORT.md')]
              if forbidden:
                  raise SystemExit(f'Forbidden development content: {forbidden[:20]}')
              metadata = zf.read('META-INF/neoforge.mods.toml').decode('utf-8')
              if 'modId="villageguardians"' not in metadata or 'version="0.9.4-alpha.1"' not in metadata:
                  raise SystemExit('Generated NeoForge metadata identity/version mismatch')
          print(f'Validated {jar} with {len(names)} entries')
          PY
          unzip -Z1 "$JAR" | sort > "$LOG_DIR/jar-entries.txt"
          sha256sum "$JAR" | tee "$LOG_DIR/jar-sha256.txt"
          sha256sum "$JAR" > "$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR.sha256"

      - name: Write build report
        run: |
          set -euo pipefail
          JAR_SHA="$(sha256sum "$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR" | awk '{print $1}')"
          cat > "$GITHUB_WORKSPACE/deliverables/BUILD_REPORT.md" <<EOF
          # Village Guardians verified build

          - Build status: **PASS**
          - Source commit: \`${GITHUB_SHA}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Java: \`25\`
          - Gradle: \`${GRADLE_VERSION}\`
          - Minecraft: \`26.2\`
          - NeoForge: \`26.2.0.38-beta\`
          - Mod version: \`${MOD_VERSION}\`
          - Reconstructed source SHA-256: \`${ACTUAL_SOURCE_SHA256}\`
          - Runtime JAR: \`${EXPECTED_JAR}\`
          - Runtime JAR SHA-256: \`${JAR_SHA}\`

          ## Executed
          - Source reconstruction, size, XZ and structure checks: **PASS**
          - Pure Java smoke tests: **PASS**
          - Clean NeoForge Gradle build: **PASS**
          - Runtime JAR structure and metadata validation: **PASS**

          ## Not run
          - Datagen: **NOT RUN**
          - GameTest: **NOT RUN**
          - Dedicated server launch: **NOT RUN**
          - Client/gameplay test: **NOT RUN** per project instruction
          EOF

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-guardians-0.9.4-alpha.1-logs-${{ github.run_number }}
          path: logs/village-guardians/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: village-guardians-0.9.4-alpha.1-deliverables
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Report final build status
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then
            STATE=success; DESCRIPTION='Verified runtime JAR build passed'
          else
            STATE=failure; DESCRIPTION='Build failed; inspect uploaded logs'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='village-guardians/verified-build' \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
