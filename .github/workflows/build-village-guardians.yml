name: Build Village Guardians

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/**'
      - '.github/workflows/build-village-guardians.yml'

permissions:
  contents: read
  statuses: write

env:
  PROJECT_SLUG: village-guardians
  MOD_ID: villageguardians
  MOD_VERSION: 0.9.4-alpha.1
  EXPECTED_JAR: villageguardians-0.9.4-alpha.1.jar
  GRADLE_VERSION: '9.2.1'
  SOURCE_SHA256: 4fc0c1f550daae0f2e618e7119ef1a02c698b34bf0c2bb57ade6ef6481aaeb6f

jobs:
  build:
    name: Java 25 / NeoForge 26.2 verified build
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Report build pending
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state='pending' \
            -f context='village-guardians/verified-build' \
            -f description='Java 25 / NeoForge build in progress' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-read-only: false

      - name: Reconstruct and verify source payload
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$GITHUB_WORKSPACE/projects/$PROJECT_SLUG/source"
          WORK_ROOT="$GITHUB_WORKSPACE/work/$PROJECT_SLUG"
          LOG_DIR="$GITHUB_WORKSPACE/logs/$PROJECT_SLUG"
          mkdir -p "$WORK_ROOT/extracted" "$LOG_DIR" "$GITHUB_WORKSPACE/deliverables"

          mapfile -t PARTS < <(find "$SOURCE_DIR" -maxdepth 1 -type f -name 'source.tar.xz.b64.part[0-9][0-9]' | sort)
          printf '%s\n' "${PARTS[@]}" | tee "$LOG_DIR/source-parts.txt"
          test "${#PARTS[@]}" -eq 14

          cat "${PARTS[@]}" > "$WORK_ROOT/source.tar.xz.b64"
          wc -c "$WORK_ROOT/source.tar.xz.b64" | tee "$LOG_DIR/source-base64-size.txt"
          test "$(wc -c < "$WORK_ROOT/source.tar.xz.b64")" -eq 151624

          base64 --decode "$WORK_ROOT/source.tar.xz.b64" > "$WORK_ROOT/source.tar.xz"
          echo "$SOURCE_SHA256  $WORK_ROOT/source.tar.xz" | sha256sum -c - | tee "$LOG_DIR/source-sha256-check.txt"
          xz -t "$WORK_ROOT/source.tar.xz"
          tar -xJf "$WORK_ROOT/source.tar.xz" -C "$WORK_ROOT/extracted"

          PROJECT_DIR="$(find "$WORK_ROOT/extracted" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$PROJECT_DIR"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/gradle.properties"
          test -d "$PROJECT_DIR/src/main/java/kr/moonseungjun/villageguardians"
          test -f "$PROJECT_DIR/src/main/templates/META-INF/neoforge.mods.toml"
          test -f "$PROJECT_DIR/src/main/resources/assets/villageguardians/lang/en_us.json"
          test -f "$PROJECT_DIR/src/main/resources/assets/villageguardians/lang/ko_kr.json"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          find "$PROJECT_DIR/src/main/java" -type f -name '*.java' | sort | tee "$LOG_DIR/java-files.txt"
          find "$PROJECT_DIR/src/main/resources" "$PROJECT_DIR/src/main/templates" -type f | sort | tee "$LOG_DIR/resource-files.txt"
          echo "Java files: $(wc -l < "$LOG_DIR/java-files.txt")" | tee "$LOG_DIR/source-summary.txt"
          echo "Resource/template files: $(wc -l < "$LOG_DIR/resource-files.txt")" | tee -a "$LOG_DIR/source-summary.txt"

      - name: Record toolchain
        shell: bash
        run: |
          set -euo pipefail
          {
            java -version
            gradle --version
          } 2>&1 | tee "$GITHUB_WORKSPACE/logs/$PROJECT_SLUG/toolchain.log"

      - name: Clean NeoForge build
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon clean build --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/logs/$PROJECT_SLUG/gradle-build.log"

      - name: Select runtime JAR
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PATH="$PROJECT_DIR/build/libs/$EXPECTED_JAR"
          find "$PROJECT_DIR/build/libs" -maxdepth 1 -type f -printf '%f\n' | sort \
            | tee "$GITHUB_WORKSPACE/logs/$PROJECT_SLUG/build-libs.txt"
          test -f "$EXPECTED_PATH"
          cp "$EXPECTED_PATH" "$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR"

      - name: Validate runtime JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR"
          export JAR
          python3 - <<'PY' | tee "$GITHUB_WORKSPACE/logs/village-guardians/jar-validation.log"
          import os
          import zipfile

          jar = os.environ['JAR']
          expected_exact = {
              'META-INF/neoforge.mods.toml',
              'kr/moonseungjun/villageguardians/VillageGuardians.class',
              'assets/villageguardians/lang/en_us.json',
              'assets/villageguardians/lang/ko_kr.json',
          }
          forbidden_prefixes = ('tools/', '.github/')
          forbidden_suffixes = ('.java', '.bbmodel')

          if not zipfile.is_zipfile(jar):
              raise SystemExit('Runtime output is not a valid ZIP/JAR')

          with zipfile.ZipFile(jar) as zf:
              names = zf.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('Duplicate JAR entries found')

              missing = sorted(expected_exact.difference(names))
              if missing:
                  raise SystemExit(f'Missing required JAR entries: {missing}')

              if not any(name.startswith('kr/moonseungjun/villageguardians/') and name.endswith('.class') for name in names):
                  raise SystemExit('No compiled Village Guardians classes found')

              forbidden = [
                  name for name in names
                  if name.startswith(forbidden_prefixes)
                  or name.endswith(forbidden_suffixes)
                  or name.endswith('_REPORT.md')
                  or '/build/' in name
              ]
              if forbidden:
                  raise SystemExit(f'Forbidden development content in runtime JAR: {forbidden[:20]}')

              metadata = zf.read('META-INF/neoforge.mods.toml').decode('utf-8')
              if 'modId="villageguardians"' not in metadata:
                  raise SystemExit('Generated metadata does not contain the expected mod ID')
              if 'version="0.9.4-alpha.1"' not in metadata:
                  raise SystemExit('Generated metadata does not contain the expected mod version')

          print(f'Validated: {jar}')
          print(f'Entry count: {len(names)}')
          print('Mod ID: villageguardians')
          print('Version: 0.9.4-alpha.1')
          PY

          unzip -Z1 "$JAR" | sort > "$GITHUB_WORKSPACE/logs/$PROJECT_SLUG/jar-entries.txt"
          sha256sum "$JAR" | tee "$GITHUB_WORKSPACE/logs/$PROJECT_SLUG/jar-sha256.txt"
          sha256sum "$JAR" > "$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR.sha256"

      - name: Write build report
        shell: bash
        run: |
          set -euo pipefail
          JAR_SHA="$(sha256sum "$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR" | awk '{print $1}')"
          cat > "$GITHUB_WORKSPACE/deliverables/BUILD_REPORT.md" <<EOF
          # Village Guardians verified build

          - Build status: **PASS**
          - Source commit: \`${GITHUB_SHA}\`
          - Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - Runner: \`${RUNNER_OS}\`
          - Java: \`25\`
          - Gradle: \`${GRADLE_VERSION}\`
          - Minecraft: \`26.2\`
          - NeoForge: \`26.2.0.38-beta\`
          - Mod ID: \`${MOD_ID}\`
          - Mod version: \`${MOD_VERSION}\`
          - Source archive SHA-256: \`${SOURCE_SHA256}\`
          - Runtime JAR: \`${EXPECTED_JAR}\`
          - Runtime JAR SHA-256: \`${JAR_SHA}\`

          ## Executed validation

          - Source-part count and ordering: **RUN / PASS**
          - Source SHA-256 and XZ integrity: **RUN / PASS**
          - Clean Java 25 / NeoForge Gradle build: **RUN / PASS**
          - Runtime JAR structure and metadata validation: **RUN / PASS**

          ## Intentionally not run

          - Datagen: **NOT RUN**
          - GameTest: **NOT RUN**
          - Dedicated server launch: **NOT RUN**
          - Client launch and gameplay testing: **NOT RUN** per project instruction
          EOF
          cp "$GITHUB_WORKSPACE/deliverables/BUILD_REPORT.md" "$GITHUB_WORKSPACE/logs/$PROJECT_SLUG/BUILD_REPORT.md"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: village-guardians-0.9.4-alpha.1-logs
          path: logs/village-guardians/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload verified deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: village-guardians-0.9.4-alpha.1-deliverables
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Report final build status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            STATE='success'
            DESCRIPTION='Verified runtime JAR build passed'
          else
            STATE='failure'
            DESCRIPTION='Build failed; inspect uploaded logs'
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" \
            -f context='village-guardians/verified-build' \
            -f description="$DESCRIPTION" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
