name: Sync EARTH TO STARS alpha15 canonical docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ets-alpha15-docs-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update project docs only
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ets_alpha15_docs.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/earth-to-stars/PROJECT.md projects/earth-to-stars/README.md projects/earth-to-stars/CHANGELOG.md
          git commit -m 'earth-to-stars: document alpha15 boarding rescue [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
