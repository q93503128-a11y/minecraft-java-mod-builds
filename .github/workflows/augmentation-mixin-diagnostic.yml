name: Augmentation Mixin Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/augmentation-mixin-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/augmentation-survival

jobs:
  export-transformed-classes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Export transformed GameTest classes
        shell: bash
        env:
          JAVA_TOOL_OPTIONS: -Dmixin.debug.export=true
        run: |
          # Diagnostic revision 2: verify the LivingEntity#hurtServer caller bridge.
          set +e
          chmod +x gradlew
          ./gradlew --no-daemon runGameTest -PaugmentationPackRuntime=true --stacktrace \
            > build-mixin-diagnostic.log 2>&1
          status=$?
          set -e
          mkdir -p build/mixin-export
          find . -type f -path '*/.mixin.out/*' -print | sort > build/mixin-export/exported-files.txt
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            cp --parents "$file" build/mixin-export/
          done < build/mixin-export/exported-files.txt
          cp build-mixin-diagnostic.log build/mixin-export/gametest.log
          echo "GAME_TEST_EXIT=$status" > build/mixin-export/status.txt
          test -s build/mixin-export/exported-files.txt

      - name: Upload transformed classes
        uses: actions/upload-artifact@v4
        with:
          name: augmentation-mixin-diagnostic-${{ github.run_number }}
          path: projects/augmentation-survival/build/mixin-export/**
          include-hidden-files: true
          retention-days: 2
