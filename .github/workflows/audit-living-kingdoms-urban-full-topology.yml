name: Audit Living Kingdoms full authored urban topology

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-urban-full-topology.yml'

concurrency:
  group: living-kingdoms-urban-full-topology-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Source guards for full-height authored planning
        shell: bash
        run: |
          set -euo pipefail
          placed="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanPlacedTopologyCatalog.java"
          opportunity="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanUpperRoomOpportunityCatalog.java"
          survey="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorSurvey.java"
          plan="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanFullInteriorPlanCatalog.java"
          mod="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java"

          grep -F 'CATALOG_REVISION = 2' "$placed"
          grep -F 'maximumAuthoredFeetY = snapshot.height() - 2' "$placed"
          ! grep -Fq 'MAX_AUTHORED_UPPER_RISE' "$placed"
          grep -F 'int maximumY = snapshot.height() - 2;' "$opportunity"
          grep -F 'MAX_NEW_AUTHORED_UPPER_RISE = 16' "$opportunity"
          grep -F 'SURVEY_REVISION = 3' "$survey"
          grep -F 'sourceAuthoredBlockCount(placement.fragmentKey())' "$survey"
          ! grep -Fq 'VERTICAL_SCAN' "$survey"
          ! grep -Fq 'HALF_WIDTH' "$survey"

          grep -F 'public static final int CATALOG_REVISION = 3;' "$plan"
          grep -F 'MIN_VERTICAL_OVERLAP_CELLS = 20' "$plan"
          grep -F 'MIN_VERTICAL_OVERLAP_RATIO = 0.35D' "$plan"
          grep -F 'MAX_VERTICAL_LEVEL_GAP = 9' "$plan"
          grep -F 'Recommendation.AUTHOR_NEW_FLOOR_IN_VOID' "$plan"
          grep -F 'selectVerticallyContinuousLevels' "$plan"
          grep -F 'overlapCells(candidate, lower)' "$plan"
          grep -F 'sourceAir(snapshot, blocks, x, feetY - 1, z)' "$plan"
          grep -F 'isClearableSourceAirSeal' "$plan"
          grep -F 'retainedRoofAbove' "$plan"
          ! grep -Fq 'MIN_SHELL_ANCHORS' "$plan"
          grep -F 'source_blocks_cut=0 source_only=true world_reads=false mutations=0' "$plan"
          grep -F 'ErdenUrbanFullInteriorPlanCatalog.bootstrap();' "$mod"

      - name: Java 25 clean compile
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs
          gradle --no-daemon clean classes --stacktrace --console=plain \
            2>&1 | tee ../../logs/urban-full-topology-compile.log

      - name: Fresh world full interior source-plan audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-urban-full-topology-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-urban-full-topology-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/urban-full-topology-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 900); do
            if grep -Fq 'Prepared Erden full interior source plans fragments=3 buildings=233' ../../logs/urban-full-topology-server.log; then
              ready=1
              break
            fi
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/urban-full-topology-server.log \
              || grep -Eqi 'watchdog|A single server tick took|Exception caught during firing event|Failed incremental homeland construction' ../../logs/urban-full-topology-server.log; then
              cat ../../logs/urban-full-topology-server.log
              exit 1
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/urban-full-topology-server.log
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1

          python - <<'PY'
          from pathlib import Path
          import re

          log = Path('../../logs/urban-full-topology-server.log').read_text(errors='replace')
          fragment_lines = [line for line in log.splitlines() if 'LK_ERDEN_FULL_INTERIOR_PLAN ' in line]
          if len(fragment_lines) != 3:
              raise SystemExit(f'expected 3 full-interior fragment plans, got {len(fragment_lines)}')
          if any('source_blocks_cut=0' not in line or 'world_reads=false' not in line for line in fragment_lines):
              raise SystemExit('full-interior fragment plan lost source-only/no-cut invariant')

          all_in_one = next((line for line in fragment_lines if 'all_in_one_house.schem#0' in line), None)
          manor = next((line for line in fragment_lines if 'medieval_manor.schem#0' in line), None)
          if all_in_one is None or manor is None:
              raise SystemExit('representative source plans missing')
          if not re.search(r'selected_authored_levels=\[[^]]*18[^]]*\]', all_in_one):
              raise SystemExit(f'proven all_in_one Y18 authored floor was lost: {all_in_one}')
          if 'existing_levels=[15]' not in manor:
              raise SystemExit(f'proven manor Y15 source floor was lost: {manor}')

          summary = next((line for line in log.splitlines()
                          if 'Prepared Erden full interior source plans fragments=3 buildings=233' in line), None)
          if summary is None:
              raise SystemExit('full interior source-plan summary missing')
          def number(name):
              match = re.search(rf'{name}=(\d+)', summary)
              if not match:
                  raise SystemExit(f'missing {name} in summary: {summary}')
              return int(match.group(1))

          with_upper = number('buildings_with_upper')
          with_multi = number('buildings_with_two_or_more_upper')
          upper_levels = number('planned_upper_levels')
          rooms = number('planned_rooms')
          if with_upper < 156:
              raise SystemExit(f'expected the 116 proven authored-new plus 40 existing-upper buildings: {summary}')
          if upper_levels < with_upper or rooms < with_upper:
              raise SystemExit(f'upper level/room accounting drift: {summary}')
          if with_multi <= 0:
              raise SystemExit(f'no vertically continuous multi-upper building was recovered: {summary}')

          existing_multilevel = sum('classification=AUTHORED_MULTILEVEL' in line
                                    for line in log.splitlines()
                                    if 'LK_ERDEN_FRAGMENT_TOPOLOGY ' in line)
          print(
              'LK_ERDEN_FULL_INTERIOR_SOURCE_PLAN_PASS '
              f'buildings=233 buildings_with_upper={with_upper} '
              f'buildings_with_two_or_more_upper={with_multi} '
              f'planned_upper_levels={upper_levels} planned_rooms={rooms} '
              f'existing_source_multilevel_fragments={existing_multilevel} '
              'proven_all_in_one_y18=true proven_manor_y15=true '
              'vertical_continuity=true clearable_source_air_seals=true '
              'decorative_shell_completion_required=true '
              'source_blocks_cut=0 source_only=true world_reads=false mutations=0 '
              'plots=233 housing=77 work=156'
          )
          PY

          cat ../../logs/urban-full-topology-server.log
          grep -F 'Prepared exact Erden placed-fragment topology catalog buildings=233' ../../logs/urban-full-topology-server.log
          grep -F 'Prepared Erden full interior source plans fragments=3 buildings=233' ../../logs/urban-full-topology-server.log

      - name: Upload full topology logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-urban-full-topology-${{ github.run_number }}
          path: logs/
          retention-days: 30
