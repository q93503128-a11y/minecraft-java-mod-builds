name: Audit Living Kingdoms full authored urban topology

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-urban-full-topology.yml'

concurrency:
  group: living-kingdoms-urban-full-topology-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Source guards for uncapped authored topology
        shell: bash
        run: |
          set -euo pipefail
          placed="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanPlacedTopologyCatalog.java"
          opportunity="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanUpperRoomOpportunityCatalog.java"
          survey="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorSurvey.java"
          builder="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalUrbanFabricBuilder.java"

          grep -F 'CATALOG_REVISION = 2' "$placed"
          grep -F 'maximumAuthoredFeetY = snapshot.height() - 2' "$placed"
          ! grep -Fq 'MAX_AUTHORED_UPPER_RISE' "$placed"

          grep -F 'CATALOG_REVISION = 4' "$opportunity"
          grep -F 'int maximumY = snapshot.height() - 2;' "$opportunity"
          grep -F 'MAX_NEW_AUTHORED_UPPER_RISE = 16' "$opportunity"

          grep -F 'SURVEY_REVISION = 2' "$survey"
          grep -F 'placement.minX(), placement.maxX(), placement.minZ(), placement.maxZ()' "$survey"
          grep -F 'placement.baseY() + placement.height() - 1' "$survey"
          ! grep -Fq 'VERTICAL_SCAN' "$survey"
          ! grep -Fq 'HALF_WIDTH' "$survey"

          grep -F 'private static FacadeFragment cropFragment(' "$builder"
          grep -F 'fragmentWidth, height, fragmentLength' "$builder"

      - name: Java 25 clean compile
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs
          gradle --no-daemon clean classes --stacktrace --console=plain \
            2>&1 | tee ../../logs/urban-full-topology-compile.log

      - name: Fresh world source topology recovery audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-urban-full-topology-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-urban-full-topology-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/urban-full-topology-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 900); do
            if grep -Fq 'Prepared exact Erden placed-fragment topology catalog buildings=233' ../../logs/urban-full-topology-server.log; then
              ready=1
              break
            fi
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/urban-full-topology-server.log \
              || grep -Eqi 'watchdog|A single server tick took|Exception caught during firing event|Failed incremental homeland construction' ../../logs/urban-full-topology-server.log; then
              cat ../../logs/urban-full-topology-server.log
              exit 1
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/urban-full-topology-server.log
              exit 1
            fi
            sleep 1
          done
          test "$ready" -eq 1

          python - <<'PY'
          from pathlib import Path
          import re

          log = Path('../../logs/urban-full-topology-server.log').read_text(errors='replace')
          lines = [line for line in log.splitlines() if 'LK_ERDEN_FRAGMENT_TOPOLOGY ' in line]
          if not lines:
              raise SystemExit('No fragment topology diagnostics were emitted')

          entries = []
          band_re = re.compile(r'FloorBand\[feetY=(-?\d+), reachableCells=(\d+)\]')
          for line in lines:
              dim = re.search(r'dimensions=(\d+)x(\d+)x(\d+)', line)
              span = re.search(r'vertical_span=(\d+)', line)
              transitions = re.search(r'vertical_transitions=(\d+)', line)
              stairs = re.search(r'stairs=(\d+)', line)
              classification = re.search(r'classification=([A-Z_]+)', line)
              fragment = re.search(r'fragment=([^ ]+)', line)
              if not all((dim, span, transitions, stairs, classification, fragment)):
                  raise SystemExit(f'Unable to parse topology line: {line}')
              bands = [(int(y), int(cells)) for y, cells in band_re.findall(line)]
              entries.append({
                  'fragment': fragment.group(1),
                  'height': int(dim.group(2)),
                  'span': int(span.group(1)),
                  'transitions': int(transitions.group(1)),
                  'stairs': int(stairs.group(1)),
                  'classification': classification.group(1),
                  'bands': bands,
              })

          multilevel = [e for e in entries if e['classification'] == 'AUTHORED_MULTILEVEL']
          high_connected = [e for e in multilevel if e['span'] > 12 and e['transitions'] > 0 and e['stairs'] > 0]
          high_band = []
          for e in multilevel:
              ys = [y for y, cells in e['bands'] if cells >= 12]
              if ys and max(ys) - min(ys) > 12:
                  high_band.append(e)

          if not multilevel:
              raise SystemExit('No authored multilevel source fragment remains detectable')
          if not high_connected:
              raise SystemExit('No connected authored fragment extends beyond the removed 12-block cap')
          if not high_band:
              raise SystemExit('No meaningful reachable floor band extends beyond the removed 12-block cap')

          max_span = max(e['span'] for e in entries)
          max_height = max(e['height'] for e in entries)
          examples = ','.join(e['fragment'] for e in high_band[:5])
          print(
              'LK_ERDEN_FULL_AUTHORED_TOPOLOGY_PASS '
              f'fragments={len(entries)} authored_multilevel_fragments={len(multilevel)} '
              f'beyond_old_cap={len(high_band)} max_reachable_vertical_span={max_span} '
              f'max_retained_fragment_height={max_height} representative={examples} '
              'full_source_height=true exact_placed_footprint=true '
              'new_authored_floor_cap_preserved=true source_only=true world_reads=false '
              'source_blocks_cut=0 plots=233'
          )
          PY

          cat ../../logs/urban-full-topology-server.log
          grep -F 'Prepared exact Erden placed-fragment topology catalog buildings=233' ../../logs/urban-full-topology-server.log

      - name: Upload full topology logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-urban-full-topology-${{ github.run_number }}
          path: logs/
          retention-days: 30
