name: Final Arcane Circle v0.12.1 Alpha.11

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arcane-circle-alpha11-final.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-alpha11-final
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/arcane-circle
  MOD_VERSION: 0.12.1-alpha.11
  EXPECTED_JAR: arcanecircle-0.12.1-alpha.11.jar

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply alpha.11 migration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f tools/apply_v0121_alpha11_visual_combat_balance.py; then
            cat tools/alpha11_chunks/part* > tools/apply_v0121_alpha11_visual_combat_balance.py
            printf '%s  %s\n' '67bb700c7314da32d0cd5c3f96de74e0e286258e48cc4ccb9219a36e11e57ea0' 'tools/apply_v0121_alpha11_visual_combat_balance.py' | sha256sum -c -
          fi
          python3 tools/apply_v0121_alpha11_visual_combat_balance.py
          rm -rf tools/alpha11_chunks
          python3 tools/test_v0121_alpha11_visual_combat_balance.py
          git diff --check

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/alpha11-final-gradle.log"

      - name: Audit JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          jar=Path('build/libs/arcanecircle-0.12.1-alpha.11.jar')
          required={
            'kr/moonseungjun/arcanecircle/magic/MageGearService.class':(b'maxManaPercent',b'maxHealthBonus',b'maxHealthPercent'),
            'kr/moonseungjun/arcanecircle/magic/CombatGrowthService.class':(b'killMastery',b'hitMastery'),
            'kr/moonseungjun/arcanecircle/world/ArcaneMageService.class':(b'RETALIATION_TARGET',b'castResidentSpell'),
            'kr/moonseungjun/arcanecircle/client/WorldMagicTracker.class':(b'renderRibbonBeam',b'renderVolumeCloud'),
            'kr/moonseungjun/arcanecircle/client/ArcaneGearRenderer.class':(b'robeMotion',),
            'kr/moonseungjun/arcanecircle/client/SpellHudOverlay.class':(),
            'kr/moonseungjun/arcanecircle/magic/SpellVisualService.class':(),
            'kr/moonseungjun/arcanecircle/magic/SpellMetrics.class':(b'effectHeight',),
          }
          with zipfile.ZipFile(jar) as z:
            names=set(z.namelist())
            missing=set(required)-names
            if missing: raise SystemExit(f'missing entries: {sorted(missing)}')
            for path,tokens in required.items():
              raw=z.read(path)
              for token in tokens:
                if token not in raw: raise SystemExit(f'{path} missing {token!r}')
          print('Arcane Circle alpha.11 final JAR audit: PASS')
          PY
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.12.1-alpha.11-final
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish source and JAR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/arcane-source
          mkdir -p /tmp/arcane-source
          rsync -a --delete --exclude '/build/' --exclude '/.gradle/' "$PROJECT_DIR/" /tmp/arcane-source/
          ok=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"
            rsync -a /tmp/arcane-source/ "$PROJECT_DIR/"
            mkdir -p published/arcane-circle
            rm -f published/arcane-circle/arcanecircle-*.jar published/arcane-circle/arcanecircle-*.jar.sha256
            cp "deliverables/$EXPECTED_JAR" published/arcane-circle/
            cp "deliverables/$EXPECTED_JAR.sha256" published/arcane-circle/
            git add -A "$PROJECT_DIR" published/arcane-circle
            if git diff --cached --quiet; then ok=1; break; fi
            git commit -m 'Publish Arcane Circle v0.12.1-alpha.11 final visual combat balance [skip ci]'
            if git push origin HEAD:main; then ok=1; break; fi
            sleep $((attempt*2))
          done
          test "$ok" -eq 1

      - name: Record status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/result
          mkdir -p /tmp/result
          test -f "$GITHUB_WORKSPACE/alpha11-final-gradle.log" && cp "$GITHUB_WORKSPACE/alpha11-final-gradle.log" /tmp/result/latest-gradle.log || printf '%s\n' 'No Gradle log.' > /tmp/result/latest-gradle.log
          cat > /tmp/result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=$MOD_VERSION
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf ci-results/arcane-circle
            mkdir -p ci-results/arcane-circle
            cp -a /tmp/result/. ci-results/arcane-circle/
            git add -A ci-results/arcane-circle
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane Circle v0.12.1-alpha.11 final result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
