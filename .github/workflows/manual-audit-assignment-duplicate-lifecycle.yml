name: Manual Audit Assignment Duplicate Lifecycle

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/manual-audit-assignment-duplicate-lifecycle.yml'
      - 'projects/frontier-settlement/tools/patch_assignment_duplicate_lifecycle.py'
      - 'projects/frontier-settlement/tools/patch_assignment_survivor_state.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply assignment duplicate lifecycle hardening
        run: python3 projects/frontier-settlement/tools/patch_assignment_duplicate_lifecycle.py

      - name: Apply assigned survivor runtime hardening
        run: python3 projects/frontier-settlement/tools/patch_assignment_survivor_state.py

      - name: Frontier source audit
        working-directory: projects/frontier-settlement
        run: python3 tools/test_alpha91_source.py

      - name: Build Frontier Settlement
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Build Survival Ascension regression
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Commit validated assignment lifecycle fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerService.java \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementOutpostLogisticsService.java \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkshopService.java \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementAdvancedWorkshopService.java \
            projects/frontier-settlement/tools/test_alpha91_source.py
          if git diff --cached --quiet; then
            echo 'No assignment lifecycle source changes to commit.'
            exit 0
          fi
          git commit -m 'Normalize assigned worker runtime state'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

# Registered workflow trigger.
