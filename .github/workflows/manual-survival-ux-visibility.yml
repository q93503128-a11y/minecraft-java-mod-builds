name: Manual Survival Visibility UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-ux-visibility.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply visibility and tooltip UX patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/survival-ascension')
          src = root / 'src/main/java/kr/moonseungjun/survivalascension'

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {text.count(old)}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Dedicated S2C mythic tracker payload and client state.
          payload = src / 'network/MythicTargetPayload.java'
          if payload.exists():
              raise SystemExit('MythicTargetPayload already exists')
          payload.write_text('''package kr.moonseungjun.survivalascension.network;\n\nimport kr.moonseungjun.survivalascension.SurvivalAscension;\nimport net.minecraft.network.RegistryFriendlyByteBuf;\nimport net.minecraft.network.codec.StreamCodec;\nimport net.minecraft.network.protocol.common.custom.CustomPacketPayload;\nimport net.minecraft.resources.Identifier;\n\npublic record MythicTargetPayload(double x, double z) implements CustomPacketPayload {\n    public static final Type<MythicTargetPayload> TYPE = new Type<>(\n            Identifier.fromNamespaceAndPath(SurvivalAscension.MOD_ID, "mythic_target"));\n\n    public static final StreamCodec<RegistryFriendlyByteBuf, MythicTargetPayload> CODEC = StreamCodec.of(\n            (buf, payload) -> {\n                buf.writeDouble(payload.x());\n                buf.writeDouble(payload.z());\n            },\n            buf -> new MythicTargetPayload(buf.readDouble(), buf.readDouble()));\n\n    @Override\n    public Type<? extends CustomPacketPayload> type() { return TYPE; }\n}\n''', encoding='utf-8')

          state = src / 'client/ClientMythicState.java'
          if state.exists():
              raise SystemExit('ClientMythicState already exists')
          state.write_text('''package kr.moonseungjun.survivalascension.client;\n\nimport kr.moonseungjun.survivalascension.network.MythicTargetPayload;\n\npublic final class ClientMythicState {\n    private static final long STALE_MILLIS = 1_600L;\n    private static volatile Target target;\n\n    private ClientMythicState() {}\n\n    public static void onTarget(MythicTargetPayload payload) {\n        target = new Target(payload.x(), payload.z(), System.currentTimeMillis());\n    }\n\n    public static Target current() {\n        Target value = target;\n        if (value == null) return null;\n        if (System.currentTimeMillis() - value.updatedAtMillis() > STALE_MILLIS) {\n            target = null;\n            return null;\n        }\n        return value;\n    }\n\n    public record Target(double x, double z, long updatedAtMillis) {}\n}\n''', encoding='utf-8')

          network = src / 'network/SkillNetwork.java'
          replace_once(network, 'private static final String PROTOCOL = "10";', 'private static final String PROTOCOL = "11";', 'protocol bump')
          replace_once(network,
              '    private static volatile Consumer<ExpeditionSnapshotPayload> expeditionSink = payload -> {};\n',
              '    private static volatile Consumer<ExpeditionSnapshotPayload> expeditionSink = payload -> {};\n    private static volatile Consumer<MythicTargetPayload> mythicSink = payload -> {};\n',
              'mythic sink')
          replace_once(network,
              '        registrar.playToClient(ExpeditionSnapshotPayload.TYPE, ExpeditionSnapshotPayload.CODEC, (payload, context) -> expeditionSink.accept(payload));\n',
              '        registrar.playToClient(ExpeditionSnapshotPayload.TYPE, ExpeditionSnapshotPayload.CODEC, (payload, context) -> expeditionSink.accept(payload));\n        registrar.playToClient(MythicTargetPayload.TYPE, MythicTargetPayload.CODEC, (payload, context) -> mythicSink.accept(payload));\n',
              'mythic payload registration')
          replace_once(network,
              '    public static void installExpeditionReceiver(Consumer<ExpeditionSnapshotPayload> snapshots) {\n        expeditionSink = Objects.requireNonNull(snapshots);\n    }\n',
              '    public static void installExpeditionReceiver(Consumer<ExpeditionSnapshotPayload> snapshots) {\n        expeditionSink = Objects.requireNonNull(snapshots);\n    }\n\n    public static void installMythicReceiver(Consumer<MythicTargetPayload> targets) {\n        mythicSink = Objects.requireNonNull(targets);\n    }\n',
              'mythic receiver install')
          replace_once(network,
              '    public static void sendSnapshot(ServerPlayer player, SkillSnapshotPayload payload) { PacketDistributor.sendToPlayer(player, payload); }\n',
              '    public static void sendSnapshot(ServerPlayer player, SkillSnapshotPayload payload) { PacketDistributor.sendToPlayer(player, payload); }\n    public static void sendMythicTarget(ServerPlayer player, MythicTargetPayload payload) { PacketDistributor.sendToPlayer(player, payload); }\n',
              'mythic target sender')

          # 2) Client tooltip expansion and mythic receiver.
          client = src / 'client/SurvivalAscensionClient.java'
          replace_once(client,
              'import kr.moonseungjun.survivalascension.SurvivalAscension;\n',
              'import kr.moonseungjun.survivalascension.SurvivalAscension;\nimport kr.moonseungjun.survivalascension.equipment.AscensionAffixes;\n',
              'affix import')
          replace_once(client,
              'import net.neoforged.neoforge.event.AddPackFindersEvent;\n',
              'import net.neoforged.neoforge.event.AddPackFindersEvent;\nimport net.neoforged.neoforge.event.entity.player.ItemTooltipEvent;\n',
              'tooltip event import')
          replace_once(client,
              '        SkillNetwork.installExpeditionReceiver(ClientExpeditionState::onSnapshot);\n',
              '        SkillNetwork.installExpeditionReceiver(ClientExpeditionState::onSnapshot);\n        SkillNetwork.installMythicReceiver(ClientMythicState::onTarget);\n',
              'mythic client receiver')
          replace_once(client,
              '        NeoForge.EVENT_BUS.addListener(ClientTickEvent.Pre.class, SurvivalAscensionClient::onClientTick);\n',
              '        NeoForge.EVENT_BUS.addListener(ClientTickEvent.Pre.class, SurvivalAscensionClient::onClientTick);\n        NeoForge.EVENT_BUS.addListener(SurvivalAscensionClient::onItemTooltip);\n',
              'tooltip listener')
          replace_once(client,
              '    private static void onAddPackFinders(AddPackFindersEvent event) {\n',
              '''    private static void onItemTooltip(ItemTooltipEvent event) {\n        String summary = AscensionAffixes.effectSummary(event.getItemStack());\n        if ("승천 옵션 없음".equals(summary)) return;\n        int index = Math.min(1, event.getToolTip().size());\n        event.getToolTip().add(index++, Component.literal("§8──────── §6승천 효과 §8────────"));\n        for (String effect : summary.split(" · ")) {\n            event.getToolTip().add(index++, Component.literal("§6◆ §f" + effect));\n        }\n        if (AscensionAffixes.isShield(event.getItemStack())) {\n            event.getToolTip().add(index, Component.literal("§7방패 파동: 전투 숙련 Lv.30+ · 피해 차단 시 발동 · 웅크리기 시 미발동"));\n        }\n    }\n\n    private static void onAddPackFinders(AddPackFindersEvent event) {\n''',
              'expanded affix tooltip')

          # 3) Mythic server target sync and coordinate-free initial alert.
          elite = src / 'elite/EliteMobSystem.java'
          replace_once(elite,
              'import kr.moonseungjun.survivalascension.equipment.AscensionAffixes;\n',
              'import kr.moonseungjun.survivalascension.equipment.AscensionAffixes;\nimport kr.moonseungjun.survivalascension.network.MythicTargetPayload;\nimport kr.moonseungjun.survivalascension.network.SkillNetwork;\n',
              'mythic network imports')
          replace_once(elite,
              '''                viewer.sendSystemMessage(Component.literal("§6§l[신화 III 출현] §r§f" + mob.getName().getString()\n                        + " §7· §e" + directionLabel(viewer, mob) + " " + (int)Math.round(Math.sqrt(viewer.distanceToSqr(mob))) + "m"\n                        + " §7· §fX " + mob.blockPosition().getX() + " Z " + mob.blockPosition().getZ()));\n''',
              '''                viewer.sendSystemMessage(Component.literal("§6§l[신화 III 출현] §r§f" + mob.getName().getString()\n                        + " §7· §e" + directionLabel(viewer, mob) + " " + (int)Math.round(Math.sqrt(viewer.distanceToSqr(mob))) + "m"\n                        + " §7· §6상단 방향 화살표로 추적됩니다."));\n''',
              'coordinate-free mythic alert')
          replace_once(elite,
              '            syncMythicBossBar(runtime, mob);\n',
              '            syncMythicBossBar(runtime, mob);\n            if (runtime.level.getGameTime() % 20L == 0L) syncMythicTracker(runtime, mob);\n',
              'mythic tracker sync call')
          replace_once(elite,
              '    private static String directionLabel(ServerPlayer player, Entity target) {\n',
              '''    private static void syncMythicTracker(MythicRuntime runtime, Mob mob) {\n        MythicTargetPayload payload = new MythicTargetPayload(mob.getX(), mob.getZ());\n        for (ServerPlayer player : playersNear(runtime.level, mob, MYTHIC_ALERT_RADIUS)) {\n            SkillNetwork.sendMythicTarget(player, payload);\n        }\n    }\n\n    private static String directionLabel(ServerPlayer player, Entity target) {\n''',
              'mythic tracker sender')

          # 4) Render a persistent view-relative tracker without stealing the action bar.
          hud = src / 'client/SkillHudOverlay.java'
          replace_once(hud,
              'import net.minecraft.client.gui.GuiGraphicsExtractor;\n',
              'import net.minecraft.client.gui.GuiGraphicsExtractor;\nimport net.minecraft.util.Mth;\n',
              'Mth import')
          replace_once(hud,
              '        if (minecraft.player == null) return;\n\n        List<ClientSkillState.RecentSkillUpdate> updates = ClientSkillState.recentUpdates();\n        if (updates.isEmpty()) return;\n',
              '        if (minecraft.player == null) return;\n\n        renderMythicTracker(graphics, minecraft);\n        List<ClientSkillState.RecentSkillUpdate> updates = ClientSkillState.recentUpdates();\n        if (updates.isEmpty()) return;\n',
              'HUD tracker invocation')
          replace_once(hud,
              '    private static int priority(ClientSkillState.RecentSkillUpdate recent) {\n',
              '''    private static void renderMythicTracker(GuiGraphicsExtractor graphics, Minecraft minecraft) {\n        ClientMythicState.Target target = ClientMythicState.current();\n        if (target == null || minecraft.player == null) return;\n        double dx = target.x() - minecraft.player.getX();\n        double dz = target.z() - minecraft.player.getZ();\n        int distance = (int)Math.round(Math.sqrt(dx * dx + dz * dz));\n        double targetYaw = Math.toDegrees(Math.atan2(-dx, dz));\n        double relative = Mth.wrapDegrees(targetYaw - minecraft.player.getYRot());\n        String arrow = relativeArrow(relative);\n        String label = "신화 III   " + arrow + "   " + distance + "m";\n        int width = Math.max(118, minecraft.font.width(label) + 16);\n        int left = (graphics.guiWidth() - width) / 2;\n        int top = 28;\n        int border = distance <= 48 ? 0xFFE6A23C : 0xC0906A28;\n        graphics.fill(left - 1, top - 1, left + width + 1, top + 14, border);\n        graphics.fill(left, top, left + width, top + 13, 0xD4141110);\n        int textX = left + (width - minecraft.font.width(label)) / 2;\n        graphics.text(minecraft.font, label, textX, top + 2, 0xFFFFD166, true);\n    }\n\n    private static String relativeArrow(double degrees) {\n        if (degrees >= -22.5D && degrees < 22.5D) return "↑";\n        if (degrees >= 22.5D && degrees < 67.5D) return "↗";\n        if (degrees >= 67.5D && degrees < 112.5D) return "→";\n        if (degrees >= 112.5D && degrees < 157.5D) return "↘";\n        if (degrees >= 157.5D || degrees < -157.5D) return "↓";\n        if (degrees >= -157.5D && degrees < -112.5D) return "↙";\n        if (degrees >= -112.5D && degrees < -67.5D) return "←";\n        return "↖";\n    }\n\n    private static int priority(ClientSkillState.RecentSkillUpdate recent) {\n''',
              'view-relative mythic HUD')

          # 5) Pin source audit to these UX guarantees.
          audit = root / 'tools/test_gameplay_qol_061.py'
          text = audit.read_text(encoding='utf-8')
          anchor = 'client = read("src/main/java/kr/moonseungjun/survivalascension/client/SurvivalAscensionClient.java")\n'
          if text.count(anchor) != 1:
              raise SystemExit('audit client anchor mismatch')
          text = text.replace(anchor, anchor + 'hud = read("src/main/java/kr/moonseungjun/survivalascension/client/SkillHudOverlay.java")\nnetwork = read("src/main/java/kr/moonseungjun/survivalascension/network/SkillNetwork.java")\nmythic_payload = read("src/main/java/kr/moonseungjun/survivalascension/network/MythicTargetPayload.java")\n', 1)
          anchor2 = 'need(client, ["InputConstants.KEY_K", "InputConstants.KEY_J", "InputConstants.KEY_V"], "canonical client keys")\n'
          if text.count(anchor2) != 1:
              raise SystemExit('audit key anchor mismatch')
          additions = '''need(client, ["ItemTooltipEvent", "AscensionAffixes.effectSummary", "방패 파동: 전투 숙련 Lv.30+", "installMythicReceiver"], "affix tooltip/mythic receiver")\nneed(hud, ["renderMythicTracker", "relativeArrow", "신화 III", "↑", "↗", "→"], "view-relative mythic HUD")\nneed(network, ['PROTOCOL = "11"', "MythicTargetPayload.TYPE", "sendMythicTarget"], "mythic tracker network")\nneed(mythic_payload, ["record MythicTargetPayload", "writeDouble", "readDouble"], "mythic target payload")\nneed(elite, ["syncMythicTracker", "상단 방향 화살표로 추적됩니다."], "coordinate-free mythic tracking")\nif '§fX " + mob.blockPosition().getX()' in elite:\n    errors.append("mythic spawn alert still exposes raw X/Z coordinates")\n'''
          text = text.replace(anchor2, anchor2 + additions, 1)
          audit.write_text(text, encoding='utf-8')

          print('SURVIVAL VISIBILITY UX PATCH APPLIED')
          PY
          python3 projects/survival-ascension/tools/test_gameplay_qol_061.py
          git diff --check
      - name: Java 25 clean build
        working-directory: projects/survival-ascension
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain
      - name: Verify JAR
        run: python3 projects/survival-ascension/tools/verify_jar.py projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
      - name: Commit validated UX patch and cleanup workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm .github/workflows/manual-survival-ux-visibility.yml
          git add projects/survival-ascension
          git commit -m 'Improve mythic tracking and ascension item tooltips'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: survival-061-visibility-ux
          path: projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          if-no-files-found: error
