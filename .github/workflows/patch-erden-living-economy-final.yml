name: Finalize Erden living economy integration

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-erden-living-economy-final.txt'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply market outcome audit correction
        id: integrate
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_erden_market_audit.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenLivingEconomyManager.java \
                  projects/living-kingdoms/docs/ERDEN_IMPLEMENTATION_STATUS.md
          git commit -m 'Audit realistic Erden purchase outcomes'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            if [ "$attempt" -eq 8 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Publish result pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          INTEGRATION_OUTCOME: ${{ steps.integrate.outcome }}
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/erden-living-economy-final.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "integration_outcome": "$INTEGRATION_OUTCOME"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/erden-living-economy-final.json
          git commit -m "Record final Erden living economy integration $GITHUB_RUN_NUMBER" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
