name: TITANBREAK alpha.52 Visual Contract CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/titanbreak/**'
      - '.github/workflows/titanbreak-alpha52-visual-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Verify alpha.52 geometry and design contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          project = Path('projects/titanbreak')
          assets = project / 'src/main/resources/assets/titanbreak'
          models = assets / 'geckolib/models/entity'
          animations = assets / 'geckolib/animations/entity'

          gradle = (project / 'gradle.properties').read_text(encoding='utf-8')
          assert 'mod_version=0.1.0-alpha.52' in gradle, 'alpha.52 version required'

          docs = (
              project / 'VISUAL_BIBLE.md',
              project / 'CHARACTER_DESIGN_PIPELINE.md',
              project / 'DEVELOPMENT_STATUS.md',
              project / 'ALPHA52_IMPLEMENTATION_NOTES.md',
          )
          for doc in docs:
              assert doc.is_file() and doc.stat().st_size > 700, doc

          contracts = {
              'the_pursuer': {
                  'required': [
                      'left_eye','right_eye','left_fore_upper','left_fore_lower',
                      'right_fore_upper','right_fore_lower','spine_reactor','chest_core',
                      'left_leg','right_leg','left_arm','right_arm','torso','head'
                  ],
                  'signature': ['pursuit_keel','dorsal_vane_left','dorsal_vane_right',
                                'heel_talon_left','heel_talon_right'],
              },
              'regnant_flesh': {
                  'required': [
                      'body','circ_0','circ_1','left_arm','right_arm','left_leg','right_leg',
                      'regen_core_0','regen_core_1','regen_core_2','regen_core_3',
                      'core_glow_0','core_glow_1','core_glow_2','core_glow_3',
                      'brain','brain_shell','tissue_wall'
                  ],
                  'signature': ['tumor_mass_left','tumor_mass_right','flesh_rib_left',
                                'flesh_rib_right','brain_stalk'],
              },
              'hundred_eyed_watcher': {
                  'required': [
                      *[f'eye_{i}' for i in range(24)],
                      'brain_0','brain_1','brain_2','central_core','core_shell',
                      'prediction_field','false_core_0','false_core_1','false_core_2','body'
                  ],
                  'signature': ['ocular_ring_inner','ocular_ring_mid','ocular_ring_outer',
                                'brain_cradle','sensor_spines'],
              },
              'chronophage': {
                  'required': [
                      'time_organ_0','time_organ_1','time_organ_2',
                      'phase_joint_0','phase_joint_1','phase_joint_2','phase_joint_3',
                      'central_ring','ring_shell','temporal_field','override_ring',
                      'left_leg','right_leg','left_arm','right_arm','torso'
                  ],
                  'signature': ['chronal_carapace','mandible_left','mandible_right','temporal_keel'],
              },
              'null_seraph': {
                  'required': [
                      'suppression_wing_0','suppression_wing_1','suppression_wing_2','suppression_wing_3',
                      'null_core_left','null_core_right','head_resonator',
                      'suppression_halo','lance_crown',
                      'left_leg','right_leg','left_arm','right_arm','torso'
                  ],
                  'signature': ['void_coffin','wing_spine_0','wing_spine_1',
                                'wing_spine_2','wing_spine_3','stabilizer_left','stabilizer_right'],
              },
              'worldbreaker': {
                  'required': [
                      'leg_axis_0','leg_axis_1','leg_axis_2','leg_axis_3',
                      'arm_left_weapon','arm_right_weapon',
                      *[f'outer_core_{i}' for i in range(6)],
                      'temporal_aux','energy_aux','central_core','central_core_shell','frenzy_crown',
                      'leg_front_left','leg_front_right','leg_rear_left','leg_rear_right',
                      'left_arm','right_arm','torso_upper'
                  ],
                  'signature': ['siege_hull','citadel','dorsal_rampart_left',
                                'dorsal_rampart_right','belly_keel'],
              },
          }

          for name, contract in contracts.items():
              geo_path = models / f'{name}.geo.json'
              anim_path = animations / f'{name}.animation.json'
              assert geo_path.is_file(), geo_path
              assert anim_path.is_file(), anim_path
              geo = json.loads(geo_path.read_text(encoding='utf-8'))
              bones = geo['minecraft:geometry'][0]['bones']
              names = [bone['name'] for bone in bones]
              assert len(names) == len(set(names)), f'duplicate bone in {name}'
              name_set = set(names)

              for bone in bones:
                  parent = bone.get('parent')
                  assert parent is None or parent in name_set, (name, bone['name'], parent)

              for required in contract['required'] + contract['signature']:
                  assert required in name_set, (name, required)

              anim = json.loads(anim_path.read_text(encoding='utf-8'))
              for animation_name, animation in anim.get('animations', {}).items():
                  for animation_bone in animation.get('bones', {}):
                      assert animation_bone in name_set, (name, animation_name, animation_bone)

              cube_count = sum(len(bone.get('cubes', [])) for bone in bones)
              assert cube_count >= 30, (name, cube_count)

          registry = (project / 'ASSET_REGISTRY.md').read_text(encoding='utf-8')
          for label in (
              'The Pursuer model / animation / texture',
              'The Regnant Flesh model / animation / texture',
              'Hundred-Eyed Watcher model / animation / texture',
              'Chronophage model / animation / texture',
              'Null Seraph model / animation / texture',
              'Worldbreaker model / animation / texture',
          ):
              assert label in registry, label
          PY

      - name: Build TITANBREAK
        run: gradle --no-daemon --project-dir projects/titanbreak clean build

      - name: Verify runtime JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          project = Path('projects/titanbreak')
          gradle = (project / 'gradle.properties').read_text(encoding='utf-8')
          match = re.search(r'^mod_version=(\S+)$', gradle, re.MULTILINE)
          assert match, 'mod_version missing'
          expected = f'titanbreak-{match.group(1)}.jar'
          jars = [p for p in (project / 'build/libs').glob('*.jar')
                  if '-sources' not in p.name and '-javadoc' not in p.name]
          assert any(p.name == expected for p in jars), (expected, [p.name for p in jars])
          print('\n'.join(str(p) for p in jars))
          PY

      - name: Upload alpha.52 visual remaster JAR
        uses: actions/upload-artifact@v4
        with:
          name: titanbreak-alpha52-visual-remaster
          path: projects/titanbreak/build/libs/*.jar
          if-no-files-found: error
