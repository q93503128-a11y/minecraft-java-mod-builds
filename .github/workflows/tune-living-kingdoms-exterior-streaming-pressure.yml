name: Tune Living Kingdoms exterior streaming pressure

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/tune_living_kingdoms_exterior_streaming_pressure.py'
      - '.github/workflows/tune-living-kingdoms-exterior-streaming-pressure.yml'

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Apply bounded streaming pressure
        run: python .github/scripts/tune_living_kingdoms_exterior_streaming_pressure.py
      - name: Compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Commit tuning
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenKingdomExteriorBuilder.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/IncrementalWorldEditPlan.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorWorkforceManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'Bound exterior construction and resident streaming pressure'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot tuning runner; remove after the Java commit lands. Triggered explicitly.
