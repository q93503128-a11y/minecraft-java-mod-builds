name: Finalize Living Kingdoms full interior milestone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-living-kingdoms-full-interiors.yml'
  workflow_dispatch:

concurrency:
  group: finalize-living-kingdoms-full-interiors
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  clean-build-jar-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Remove milestone-only patch machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/patch_living_kingdoms_full_urban_topology.py \
            .github/workflows/patch-living-kingdoms-full-urban-topology.yml \
            .github/workflows/patch-living-kingdoms-full-interior-plan.yml \
            .github/scripts/patch_living_kingdoms_interior_survey_budget.py \
            .github/workflows/patch-living-kingdoms-interior-survey-budget.yml \
            .github/scripts/patch_living_kingdoms_full_interior_continuity.py \
            .github/workflows/patch-living-kingdoms-full-interior-continuity.yml \
            .github/scripts/patch_living_kingdoms_full_interior_clearable_seals.py \
            .github/workflows/patch-living-kingdoms-full-interior-clearable-seals.yml \
            .github/staging/living-kingdoms/ErdenUrbanFullInteriorRouteCatalog.java \
            .github/staging/living-kingdoms/ErdenUrbanFullInteriorExpansionSavedData.java \
            .github/staging/living-kingdoms/ErdenUrbanFullInteriorExpansionManager.java \
            .github/workflows/patch-living-kingdoms-physical-full-interiors.yml \
            .github/scripts/patch_living_kingdoms_shared_stair_network.py \
            .github/workflows/patch-living-kingdoms-shared-stair-network.yml \
            .github/workflows/finalize-living-kingdoms-full-interiors.yml
          git diff --check
          test -f .github/workflows/audit-living-kingdoms-urban-full-topology.yml
          test -f .github/workflows/audit-living-kingdoms-physical-full-interiors.yml

      - name: Final source audit
        shell: bash
        run: |
          set -euo pipefail
          root=projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms
          grep -F 'ErdenUrbanFullInteriorPlanCatalog.bootstrap();' "$root/LivingKingdoms.java"
          grep -F 'ErdenUrbanFullInteriorRouteCatalog.bootstrap();' "$root/LivingKingdoms.java"
          grep -F 'ErdenUrbanFullInteriorExpansionManager.bootstrap();' "$root/LivingKingdoms.java"
          grep -F 'ErdenUrbanFullInteriorExpansionManager.onServerTick(event);' "$root/LivingKingdoms.java"
          grep -F 'public static final int CATALOG_REVISION = 3;' "$root/world/ErdenUrbanFullInteriorPlanCatalog.java"
          grep -F 'public static final int CATALOG_REVISION = 2;' "$root/world/ErdenUrbanFullInteriorRouteCatalog.java"
          grep -F 'EXPECTED_BUILDINGS = 40' "$root/world/ErdenUrbanFullInteriorExpansionManager.java"
          grep -F 'EXPECTED_ADDITIONAL_LEVELS = 40' "$root/world/ErdenUrbanFullInteriorExpansionManager.java"
          grep -F 'EXPECTED_ADDITIONAL_ROOMS = 80' "$root/world/ErdenUrbanFullInteriorExpansionManager.java"
          grep -F 'source_blocks_cut=0 source_air_only=true' "$root/world/ErdenUrbanFullInteriorExpansionManager.java"
          grep -F 'mod_version=0.1.0-alpha.12' projects/living-kingdoms/gradle.properties
          grep -F 'manor 계열 40채' projects/living-kingdoms/docs/ERDEN_IMPLEMENTATION_STATUS.md
          grep -F '77개 시가지 배치' projects/living-kingdoms/docs/ERDEN_IMPLEMENTATION_STATUS.md

      - name: Java 25 clean build
        working-directory: projects/living-kingdoms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs
          java -version 2>&1 | tee ../../logs/final-java-version.log
          gradle --no-daemon clean build --stacktrace --console=plain \
            2>&1 | tee ../../logs/final-clean-build.log

      - name: Verify distributable JAR
        shell: bash
        run: |
          set -euo pipefail
          jar=projects/living-kingdoms/build/libs/livingkingdoms-0.1.0-alpha.12.jar
          test -s "$jar"
          mkdir -p logs
          sha256sum "$jar" | tee logs/final-jar-sha256.txt
          jar tf "$jar" > logs/final-jar-entries.txt
          grep -Fx 'kr/moonseungjun/livingkingdoms/LivingKingdoms.class' logs/final-jar-entries.txt
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenUrbanFullInteriorPlanCatalog.class' logs/final-jar-entries.txt
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenUrbanFullInteriorRouteCatalog.class' logs/final-jar-entries.txt
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenUrbanFullInteriorExpansionManager.class' logs/final-jar-entries.txt
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenUrbanFullInteriorExpansionSavedData.class' logs/final-jar-entries.txt
          grep -Fx 'data/livingkingdoms/loot_table/entities/silver_hart.json' logs/final-jar-entries.txt
          grep -Fx 'data/livingkingdoms/loot_table/entities/ash_hound.json' logs/final-jar-entries.txt
          grep -Fx 'data/livingkingdoms/loot_table/entities/river_wisp.json' logs/final-jar-entries.txt
          unzip -p "$jar" META-INF/MANIFEST.MF | tee logs/final-manifest.txt
          grep -F 'Implementation-Version: 0.1.0-alpha.12' logs/final-manifest.txt
          printf 'LK_LIVING_KINGDOMS_FINAL_JAR_PASS jar=%s bytes=%s sha256=%s java=25 full_interiors=true source_blocks_cut=0 plots=233 housing=77 work=156\n' \
            "$(basename "$jar")" "$(stat -c%s "$jar")" "$(sha256sum "$jar" | cut -d' ' -f1)" \
            | tee logs/final-jar-pass.txt

      - name: Upload verified JAR and audit logs
        uses: actions/upload-artifact@v4
        with:
          name: livingkingdoms-0.1.0-alpha.12-full-interiors
          path: |
            projects/living-kingdoms/build/libs/livingkingdoms-0.1.0-alpha.12.jar
            logs/final-*.txt
            logs/final-clean-build.log
          retention-days: 30

      - name: Commit cleanup to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github
          if git diff --cached --quiet; then
            echo 'No temporary milestone files remained to clean.'
            exit 0
          fi
          git commit -m 'chore(living-kingdoms): clean full interior patch machinery'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
