name: Validate Survival Ascension Solo Balance

on:
  push:
    paths:
      - 'projects/survival-ascension/.solo-balance-trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PROJECT_DIR: projects/survival-ascension

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Apply solo balance and logistics QOL patch
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/apply_061_solo_balance.py"
          python3 "$PROJECT_DIR/tools/apply_061_logistics_qol.py"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/equipment/AscensionAffixes.java')
          s = p.read_text(encoding='utf-8')
          old = 'if (category == Category.SPEAR) return switch (rarity) { case 1 -> 1.25D; case 2 -> 1.45D; default -> 1.75D; };'
          new = 'if (category == Category.SPEAR) return switch (rarity) { case 1 -> 1.35D; case 2 -> 1.65D; default -> 2.00D; };'
          if old not in s:
              raise SystemExit('spear direct-damage migration token missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Adapt historical audit expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/survival-ascension')
          source = root / 'tools/test_release_source.py'
          s = source.read_text(encoding='utf-8')
          marker = 'namespace = {"__file__": str(legacy_path), "__name__": "__main__"}'
          additions = '''# 0.61 solo/QOL expectation translation; historical contracts stay immutable.\nfor old, new in [\n    ('Math.min(8', 'Math.min(20'),\n    ('Math.min(13, base + bonus)', 'Math.min(21, base + bonus)'),\n    ('최대35%', '상한은 70%'),\n    ('최대32%', '최대 2배'),\n    ('new MaterialCost(Items.AMETHYST_SHARD, 48', 'new MaterialCost(Items.AMETHYST_SHARD, 12'),\n    ('new MaterialCost(Items.AMETHYST_SHARD, 96', 'new MaterialCost(Items.AMETHYST_SHARD, 24'),\n    ('재료 소비: 모드 제작·건축·인프라 비용은 가까운 사용 가능 물류 통부터', '재료 소비: 같은 차원에서 현재 로딩된 등록 창고 전체를 공용 재고로 사용하고'),\n    ('new LocalRequirement("연료", 8', 'new LocalRequirement("연료(석탄 또는 숯)", 3'),\n    ('new LocalRequirement("식량", 32', 'new LocalRequirement("식량(밀/당근/감자/비트)", 12'),\n    ('new LocalRequirement("철 주괴", 8', 'new LocalRequirement("철 주괴", 3'),\n    ('new LocalRequirement("식량", 48', 'new LocalRequirement("식량(밀/당근/감자/비트)", 16'),\n    ('new LocalRequirement("철 주괴", 16', 'new LocalRequirement("철 주괴", 5'),\n    ('new LocalRequirement("통나무", 32', 'new LocalRequirement("아무 종류의 통나무", 12'),\n    ('new LocalRequirement("식량", 96', 'new LocalRequirement("식량(밀/당근/감자/비트)", 32'),\n    ('new LocalRequirement("철 주괴", 32', 'new LocalRequirement("철 주괴", 8'),\n    ('new LocalRequirement("석재 벽돌", 128', 'new LocalRequirement("석재 벽돌", 32'),\n    ('전초재고(식량48/철16/통나무32)', '전초 재고(식량 16 · 철 주괴 5 · 아무 종류의 통나무 12)'),\n    ('전초재고(식량96/철32/석재벽돌128)', '전초 재고(식량 32 · 철 주괴 8 · 석재 벽돌 32)'),\n    ('전초재고(식량32/철8/연료8)', '전초 재고(식량 12 · 철 주괴 3 · 연료: 석탄 또는 숯 3)'),\n    ('한도3→토목6→중추9', '산업 가공소 완공 → 통 4블록 이내'),\n    ('화물 → 전초 현지재고 → 방어/원정', '등록 물류 통은 같은 차원 로딩 중이면 원격 사용'),\n    ('new Requirement(Items.STONE_BRICKS, "석재 벽돌", 2048)', 'new Requirement(Items.STONE_BRICKS, "석재 벽돌", 384)'),\n    ('new Requirement(Items.COBBLESTONE, "조약돌", 1536)', 'new Requirement(Items.COBBLESTONE, "조약돌", 256)'),\n    ('new Requirement(Items.GRAVEL, "자갈", 1536)', 'new Requirement(Items.GRAVEL, "자갈", 256)'),\n]:\n    legacy = legacy.replace(old, new)\n'''
          if marker not in s:
              raise SystemExit('source audit namespace marker missing')
          if '0.61 solo/QOL expectation translation' not in s:
              s = s.replace(marker, additions + marker, 1)
          source.write_text(s, encoding='utf-8')

          content = root / 'tools/test_release_content_pack.py'
          s = content.read_text(encoding='utf-8')
          marker = 'namespace = {"__file__": str(legacy_path), "__name__": "__main__"}'
          inject = '''# 0.61 solo/QOL content expectation translation.\n_translation = """\nbaseline = baseline.replace('new LocalRequirement(\\"연료\\", 8', 'new LocalRequirement(\\"연료(석탄 또는 숯)\\", 3')\nbaseline = baseline.replace('new LocalRequirement(\\"식량\\", 32', 'new LocalRequirement(\\"식량(밀/당근/감자/비트)\\", 12')\nbaseline = baseline.replace('new LocalRequirement(\\"철 주괴\\", 8', 'new LocalRequirement(\\"철 주괴\\", 3')\nbaseline = baseline.replace('new LocalRequirement(\\"식량\\", 48', 'new LocalRequirement(\\"식량(밀/당근/감자/비트)\\", 16')\nbaseline = baseline.replace('new LocalRequirement(\\"철 주괴\\", 16', 'new LocalRequirement(\\"철 주괴\\", 5')\nbaseline = baseline.replace('new LocalRequirement(\\"통나무\\", 32', 'new LocalRequirement(\\"아무 종류의 통나무\\", 12')\nbaseline = baseline.replace('new LocalRequirement(\\"식량\\", 96', 'new LocalRequirement(\\"식량(밀/당근/감자/비트)\\", 32')\nbaseline = baseline.replace('new LocalRequirement(\\"철 주괴\\", 32', 'new LocalRequirement(\\"철 주괴\\", 8')\nbaseline = baseline.replace('new LocalRequirement(\\"석재 벽돌\\", 128', 'new LocalRequirement(\\"석재 벽돌\\", 32')\nbaseline = baseline.replace('전초재고(식량48/철16/통나무32)', '전초 재고(식량 16 · 철 주괴 5 · 아무 종류의 통나무 12)')\nbaseline = baseline.replace('전초재고(식량96/철32/석재벽돌128)', '전초 재고(식량 32 · 철 주괴 8 · 석재 벽돌 32)')\nbaseline = baseline.replace('전초재고(식량32/철8/연료8)', '전초 재고(식량 12 · 철 주괴 3 · 연료: 석탄 또는 숯 3)')\nbaseline = baseline.replace('한도3→토목6→중추9', '산업 가공소 완공 → 통 4블록 이내')\n"""\nlegacy = legacy.replace(\n    'baseline = baseline.replace(BASELINE_LOCK_VERSION, REQUIRED_LOCK_VERSION)',\n    'baseline = baseline.replace(BASELINE_LOCK_VERSION, REQUIRED_LOCK_VERSION)\\n' + _translation\n)\n'''
          if marker not in s:
              raise SystemExit('content audit namespace marker missing')
          if '0.61 solo/QOL content expectation translation' not in s:
              s = s.replace(marker, inject + marker, 1)
          content.write_text(s, encoding='utf-8')
          PY

      - name: Diff safety
        run: git diff --check

      - name: Source and content regression audits
        id: audits
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          : > /tmp/sa-solo-audit.log
          python3 tools/test_release_source.py 2>&1 | tee -a /tmp/sa-solo-audit.log
          S1=${PIPESTATUS[0]}
          python3 tools/test_release_content_pack.py 2>&1 | tee -a /tmp/sa-solo-audit.log
          S2=${PIPESTATUS[0]}
          echo "source_status=$S1" | tee -a /tmp/sa-solo-audit.log
          echo "content_status=$S2" | tee -a /tmp/sa-solo-audit.log
          if [ "$S1" -ne 0 ] || [ "$S2" -ne 0 ]; then exit 1; fi

      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survival-ascension-solo-audit-diagnostics
          path: /tmp/sa-solo-audit.log
          if-no-files-found: warn
          retention-days: 7

      - name: Clean Java 25 build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain

      - name: Commit validated solo and logistics pass to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$PROJECT_DIR/.solo-balance-trigger"
          rm -f "$PROJECT_DIR/tools/apply_061_solo_balance.py"
          rm -f "$PROJECT_DIR/tools/apply_061_logistics_qol.py"
          rm -f .github/workflows/validate-survival-ascension-solo-balance.yml
          git add "$PROJECT_DIR" .github/workflows/validate-survival-ascension-solo-balance.yml
          git commit -m "Retune Survival Ascension solo progression and portable logistics"
          git pull --rebase origin main
          git push origin HEAD:main
