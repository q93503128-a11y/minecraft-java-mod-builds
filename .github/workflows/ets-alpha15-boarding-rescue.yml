name: EARTH TO STARS alpha15 boarding rescue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ets-alpha15-boarding-rescue.yml'

permissions:
  contents: write

defaults:
  run:
    working-directory: projects/earth-to-stars

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Apply alpha.15 boarding root-cause fix
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 .github/scripts/ets_alpha15_apply.py
      - name: Validate alpha.15 contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/logs
          python3 tools/test_progression_validator.py 2>&1 | tee build/logs/p0h-validator-tests.log
          python3 tools/validate_progression.py 2>&1 | tee build/logs/p0h-progression.log
          python3 tools/validate_m1_launch.py 2>&1 | tee build/logs/m1-launch-progression.log
          python3 tools/validate_alpha15_acceptance.py 2>&1 | tee build/logs/alpha15-acceptance.log
      - name: Clean test and build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean test build --stacktrace 2>&1 | tee build/logs/build.log
      - name: Verify production JAR
        run: python3 tools/verify_jar.py
      - name: Dedicated boarding entity contract probe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p run build/logs
          printf 'eula=true\n' > run/eula.txt
          EARTH_TO_STARS_LIFECYCLE_PROBE=boarding_contract timeout --kill-after=15s 180s ./gradlew --no-daemon runServer --stacktrace 2>&1 | tee build/logs/alpha15-boarding-server.log
          grep -q 'EARTH_TO_STARS_ALPHA15_BOARDING_ENTITY_CONTRACT_PASS serializable=true instanceSaved=false' build/logs/alpha15-boarding-server.log
      - name: Commit verified source only
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/ets-alpha15
          cp projects/earth-to-stars/build/libs/earth_to_stars-0.1.0-alpha.15.jar /tmp/ets-alpha15/
          cp projects/earth-to-stars/build/libs/earth_to_stars-0.1.0-alpha.15.jar.sha256 /tmp/ets-alpha15/
          cp projects/earth-to-stars/build/logs/alpha15-boarding-server.log /tmp/ets-alpha15/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            projects/earth-to-stars/gradle.properties \
            projects/earth-to-stars/tools/validate_alpha15_acceptance.py \
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/EarthToStars.java \
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/content/EarthToStarsEntities.java \
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/ship/runtime/minecraft/ShipExteriorEntity.java \
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/ship/runtime/minecraft/ShipRuntimeManager.java \
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/ship/runtime/minecraft/ShipLifecycleProbe.java
          git commit -m 'earth-to-stars: fix impossible ship boarding alpha15'

          git reset --hard HEAD
          git clean -fdx \
            projects/earth-to-stars/.gradle \
            projects/earth-to-stars/build \
            projects/earth-to-stars/run \
            projects/earth-to-stars/tools/__pycache__
          git pull --rebase origin main
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/ets-alpha15/source-sha.txt
      - name: Write verification report
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          SHA=$(cat /tmp/ets-alpha15/earth_to_stars-0.1.0-alpha.15.jar.sha256)
          SOURCE_SHA=$(cat /tmp/ets-alpha15/source-sha.txt)
          cat > /tmp/ets-alpha15/ALPHA15_BOARDING_RESCUE_REPORT.md <<EOF
          # EARTH TO STARS alpha.15 Boarding Root-Cause Rescue

          - Source commit: $SOURCE_SHA
          - Minecraft: 26.2
          - NeoForge: 26.2.0.76
          - Java: 25
          - alpha.15 static acceptance: PASS
          - clean test build: PASS
          - production JAR verify: PASS
          - dedicated boarding EntityType contract: PASS (serializable=true, runtime instance saved=false)
          - root cause: alpha.14 used EntityType.noSave(), while Minecraft 26.2 Entity.startRiding rejects non-serializable vehicle types before force/canRide checks
          - live client boarding: NOT PLAYTESTED
          - multiplayer: NOT TESTED
          - JAR SHA-256: $SHA
          EOF
      - name: Upload alpha.15 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-0.1.0-alpha.15-boarding-rescue
          path: /tmp/ets-alpha15/
          retention-days: 7
