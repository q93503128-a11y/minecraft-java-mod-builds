name: Apply Village Guardians v0.18.18 Growth

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Village Guardians v0.18.18 apply growth'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Apply canonical patch
        run: python3 projects/village-guardians/tools/apply_v01818_growth.py
      - name: Source audit
        working-directory: projects/village-guardians
        run: |
          set -euo pipefail
          git diff --check
          python3 tools/test_v01818_growth_consumables.py
          python3 tools/test_progression_depth.py
          python3 tools/test_runtime_safety.py
          python3 tools/test_interaction_contract.py
      - name: Java 25 clean build
        working-directory: projects/village-guardians
        run: gradle --no-daemon --no-configuration-cache -Pmod_version=0.18.18-alpha.1 clean build --stacktrace --console=plain
      - name: Verify JAR
        working-directory: projects/village-guardians
        run: |
          set -euo pipefail
          test -f build/libs/villageguardians-0.18.18-alpha.1.jar
          python3 tools/verify_jar.py build/libs/villageguardians-0.18.18-alpha.1.jar
      - name: Commit implementation to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/village-guardians
          git commit -m 'feat(village): deepen late-game growth and defense economy'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Record apply failure
        if: failure()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p projects/village-guardians/.ci
          printf 'status=FAIL\nrun_id=%s\nhead_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > projects/village-guardians/.ci/v01818-apply-failure.txt
          git add projects/village-guardians/.ci/v01818-apply-failure.txt
          git commit -m 'ci(village): record v0.18.18 apply failure [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
