name: Arcane alpha76 issue runner v2

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write

jobs:
  patch:
    if: github.event.issue.title == 'arcane-alpha76-run-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Execute corrected alpha.76 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/arcane-alpha76-liveplay-fix.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          raw = workflow[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in raw.splitlines()]
          body = '\n'.join(lines) + '\n'
          old = "'''        int branches = 6;\n"
          new = "'''        // six bounded zig-zag radial faults bridge core to authoritative edge\n        int branches = 6;\n"
          if body.count(old) != 1:
              raise SystemExit('alpha76 Earthquake replacement anchor mismatch')
          body = body.replace(old, new, 1)
          Path('/tmp/arcane-alpha76-patch.py').write_text(body, encoding='utf-8')
          PY
          python3 /tmp/arcane-alpha76-patch.py
          rm -f .github/workflows/arcane-alpha76-issue-runner.yml
          rm .github/workflows/arcane-alpha76-issue-runner-v2.yml

          python3 projects/arcane-circle/tools/test_current_source.py
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -iname '*arcane*.yml' | wc -l)" -eq 1
          test "$(find projects/arcane-circle/tools -maxdepth 1 -type f | wc -l)" -eq 2

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/arcane-circle .github/workflows/arcane-alpha76-liveplay-fix.yml .github/workflows/arcane-alpha76-issue-runner.yml .github/workflows/arcane-alpha76-issue-runner-v2.yml .github/arcane-alpha76-trigger.txt
          git commit -m 'Arcane alpha.76 live-play UI and Earthquake fix [skip ci]'

          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1

      - name: Dispatch canonical Arcane Java 25 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build-arcane-circle.yml/dispatches" \
            -d '{"ref":"main"}'
