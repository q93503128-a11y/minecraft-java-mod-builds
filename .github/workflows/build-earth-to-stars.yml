name: Build earth-to-stars

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/earth-to-stars/src/**'
      - 'projects/earth-to-stars/build.gradle'
      - 'projects/earth-to-stars/gradle.properties'
      - 'projects/earth-to-stars/settings.gradle'
      - 'projects/earth-to-stars/gradle/**'
      - 'projects/earth-to-stars/gradlew'
      - 'projects/earth-to-stars/gradlew.bat'
      - 'projects/earth-to-stars/tools/**'
      - '.github/workflows/build-earth-to-stars.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/earth-to-stars

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Resolve mod version
        id: version
        shell: bash
        run: |
          VERSION=$(awk -F= '$1=="mod_version" { print $2 }' gradle.properties)
          test -n "$VERSION"
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify toolchain
        run: |
          java -version
          chmod +x gradlew
          ./gradlew --version
      - name: Validate progression contracts
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          python3 tools/test_progression_validator.py 2>&1 | tee build/logs/p0h-validator-tests.log
          python3 tools/validate_progression.py 2>&1 | tee build/logs/p0h-progression.log
          python3 tools/validate_m1_launch.py 2>&1 | tee build/logs/m1-launch-progression.log
          python3 tools/validate_alpha15_acceptance.py 2>&1 | tee build/logs/alpha15-acceptance.log
      - name: Clean test and build
        shell: bash
        run: |
          mkdir -p build/logs
          set -o pipefail
          ./gradlew --no-daemon clean test build --stacktrace 2>&1 | tee build/logs/build.log
      - name: Verify production JAR
        run: python3 tools/verify_jar.py
      - name: Dedicated server save restart lifecycle
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          rm -rf run
          mkdir -p run build/logs
          printf 'eula=true\n' > run/eula.txt

          set -o pipefail
          EARTH_TO_STARS_LIFECYCLE_PROBE=seed timeout --kill-after=15s 180s ./gradlew --no-daemon runServer --stacktrace 2>&1 | tee build/logs/p0g-server-seed.log
          grep -q 'EARTH_TO_STARS_P0G_SEED_PASS' build/logs/p0g-server-seed.log

          EARTH_TO_STARS_LIFECYCLE_PROBE=verify timeout --kill-after=15s 180s ./gradlew --no-daemon runServer --stacktrace 2>&1 | tee build/logs/p0g-server-verify.log
          grep -q 'EARTH_TO_STARS_P0G_VERIFY_PASS' build/logs/p0g-server-verify.log
          grep -q 'propellant=51.25' build/logs/p0g-server-verify.log
          grep -q 'oxygen=66.5' build/logs/p0g-server-verify.log

          rm -rf run
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          EARTH_TO_STARS_LIFECYCLE_PROBE=boarding_contract timeout --kill-after=15s 180s ./gradlew --no-daemon runServer --stacktrace 2>&1 | tee build/logs/alpha15-boarding-server.log
          grep -q 'EARTH_TO_STARS_ALPHA15_BOARDING_ENTITY_CONTRACT_PASS serializable=true instanceSaved=false' build/logs/alpha15-boarding-server.log
      - name: Write build report
        shell: bash
        run: |
          JAR=$(ls build/libs/earth_to_stars-*.jar | head -n1)
          SHA=$(cat "$JAR.sha256")
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            LIFECYCLE_STATUS="PASS (this run, including alpha.15 boarding EntityType contract)"
          else
            LIFECYCLE_STATUS="NOT RERUN; save/restore run 34197931566 remains valid, boarding EntityType probe last passed run 34731266964"
          fi
          cat > build/BUILD_AND_RUNTIME_REPORT.md <<EOF
          # EARTH TO STARS — alpha.15 Boarding Root-Cause Rescue Build Report

          - Commit: $GITHUB_SHA
          - Mod version: $MOD_VERSION
          - Java: 25
          - Gradle: 9.2.1 wrapper
          - Minecraft: 26.2
          - NeoForge: 26.2.0.76
          - P0-H progression validator: PASS
          - M1 launch recipe dependency closure: PASS
          - M1 launch recipe Nether/End independence: PASS
          - alpha.15 acceptance static gate: PASS
          - rideable serializable EntityType + non-persisted runtime exterior contract: PASS
          - authorized forced mounting + failed-deployment rollback contract: PASS
          - visible hull / interaction / passenger vehicle single-entity contract: PASS
          - enlarged 5-block-class starter hull and matching hitbox contract: PASS
          - replaceable vegetation-tolerant deployment contract: PASS
          - exact-hull propellant/oxygen servicing contract: PASS
          - atlas-safe runtime OBJ UV adaptation contract: PASS
          - starter/salvage/interceptor distinct adapted runtime meshes: PASS
          - M1-D starter empty weapon/sensor slots JUnit: PASS
          - M1-D recovered autocannon/scanner capability progression JUnit: PASS
          - ShipState schema 1 -> 2 sensor-slot migration JUnit: PASS
          - clean/test/build: PASS
          - production JAR verify: PASS
          - dedicated lifecycle status: $LIFECYCLE_STATUS
          - SHA-256: $SHA
          - client model/resource smoke: alpha.14 visual resources passed run 34424914782; alpha.15 changes no visual resources
          - live starter-craft boarding/handling quality: NOT PLAYTESTED
          - live Earth→orbit→salvage→combat→return cycle: NOT PLAYTESTED
          - live multiplayer: NOT TESTED
          EOF
      - name: Upload deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-${{ env.MOD_VERSION }}-deliverables
          path: |
            projects/earth-to-stars/build/libs/earth_to_stars-*.jar
            projects/earth-to-stars/build/libs/earth_to_stars-*.jar.sha256
            projects/earth-to-stars/build/BUILD_AND_RUNTIME_REPORT.md
          retention-days: 7
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-${{ env.MOD_VERSION }}-logs
          path: projects/earth-to-stars/build/logs/
          if-no-files-found: ignore
          retention-days: 7
