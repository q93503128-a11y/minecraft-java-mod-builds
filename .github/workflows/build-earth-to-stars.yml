name: Build earth-to-stars Fabric 26.2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/earth-to-stars/src/fabric/**'
      - 'projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/ship/**'
      - 'projects/earth-to-stars/src/test/**'
      - 'projects/earth-to-stars/build.gradle'
      - 'projects/earth-to-stars/gradle.properties'
      - 'projects/earth-to-stars/settings.gradle'
      - 'projects/earth-to-stars/gradle/**'
      - 'projects/earth-to-stars/tools/validate_fabric_standalone.py'
      - 'projects/earth-to-stars/tools/verify_fabric_jar.py'
      - '.github/workflows/build-earth-to-stars.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/earth-to-stars

jobs:
  fabric-standalone:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify Fabric standalone contract
        run: |
          chmod +x gradlew
          python3 tools/validate_fabric_standalone.py
          java -version
          ./gradlew --version

      - name: Test and build
        shell: bash
        run: |
          rm -rf build/logs
          mkdir -p build/logs
          set -o pipefail
          ./gradlew --no-daemon clean test build --stacktrace 2>&1 | tee build/logs/build.log

      - name: Verify production JAR
        run: python3 tools/verify_fabric_jar.py

      - name: Boot Fabric dedicated server
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p run build/logs
          printf 'eula=true\n' > run/eula.txt

          set +e
          timeout --kill-after=15s 150s ./gradlew --no-daemon runServer --stacktrace 2>&1 | tee build/logs/fabric-server.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 && $status -ne 137 ]]; then
            echo "runServer exited unexpectedly with status $status"
            exit "$status"
          fi

          grep -q 'Fabric 26.2 standalone kernel loaded' build/logs/fabric-server.log
          if grep -Eqi 'Could not execute entrypoint|ModResolutionException|NoClassDefFoundError.*earthtostars|ClassNotFoundException.*earthtostars' build/logs/fabric-server.log; then
            echo 'EARTH TO STARS Fabric server integration error detected.'
            exit 1
          fi

          echo 'EARTH_TO_STARS_FABRIC_SERVER_BOOT_PASS'

      - name: Write build report
        shell: bash
        run: |
          prop() { awk -F= -v key="$1" '$1==key { print $2 }' gradle.properties; }
          VERSION=$(prop mod_version)
          MINECRAFT=$(prop minecraft_version)
          LOADER=$(prop loader_version)
          API=$(prop fabric_api_version)
          JAR=$(ls build/libs/earth_to_stars-*.jar | grep -v sources | head -n1)
          SHA=$(cat "$JAR.sha256")
          cat > build/BUILD_AND_RUNTIME_REPORT.md <<EOF
          # EARTH TO STARS — Fabric 26.2 Standalone Rebase

          - Commit: $GITHUB_SHA
          - Mod version: $VERSION
          - Minecraft: $MINECRAFT
          - Fabric Loader: $LOADER
          - Fabric API: $API
          - Java: 25
          - loader-neutral ship kernel tests: PASS
          - clean build: PASS
          - production JAR verify: PASS
          - dedicated Fabric boot: PASS
          - whole external ship/space mods required at runtime: NO
          - player-facing Fabric ship runtime: NOT RUN / migration not complete
          - live flight feel: NOT RUN
          - Earth-to-space continuity: NOT RUN
          - multiplayer playtest: NOT RUN
          - SHA-256: $SHA
          EOF

      - name: Upload deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-fabric-${{ github.sha }}
          path: |
            projects/earth-to-stars/build/libs/earth_to_stars-*.jar
            projects/earth-to-stars/build/libs/earth_to_stars-*.jar.sha256
            projects/earth-to-stars/build/BUILD_AND_RUNTIME_REPORT.md
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-fabric-logs-${{ github.sha }}
          path: projects/earth-to-stars/build/logs/
          if-no-files-found: ignore
          retention-days: 7
