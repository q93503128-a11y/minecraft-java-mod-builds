name: Build earth-to-stars reboot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/earth-to-stars/src/reboot/**'
      - 'projects/earth-to-stars/src/rebootTest/**'
      - 'projects/earth-to-stars/build.gradle'
      - 'projects/earth-to-stars/gradle.properties'
      - 'projects/earth-to-stars/settings.gradle'
      - 'projects/earth-to-stars/gradle/**'
      - 'projects/earth-to-stars/tools/validate_reboot_stack.py'
      - 'projects/earth-to-stars/tools/verify_reboot_jar.py'
      - '.github/workflows/build-earth-to-stars.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/earth-to-stars

jobs:
  reboot-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify reboot contract
        run: |
          chmod +x gradlew
          python3 tools/validate_reboot_stack.py
          java -version
          ./gradlew --version

      - name: Clean test and build
        shell: bash
        run: |
          rm -rf /tmp/earth-to-stars-reboot-logs
          mkdir -p /tmp/earth-to-stars-reboot-logs
          set -o pipefail
          ./gradlew --no-daemon clean test build --stacktrace 2>&1 | tee /tmp/earth-to-stars-reboot-logs/build.log
          mkdir -p build/logs
          cp /tmp/earth-to-stars-reboot-logs/build.log build/logs/build.log

      - name: Verify production JAR excludes legacy vehicle stack
        run: python3 tools/verify_reboot_jar.py

      - name: Boot dedicated server with external space stack
        shell: bash
        run: |
          rm -rf run
          mkdir -p run build/logs
          printf 'eula=true\n' > run/eula.txt
          set -o pipefail
          EARTH_TO_STARS_STACK_PROBE=1 timeout --kill-after=15s 240s ./gradlew --no-daemon runServer --stacktrace 2>&1 | tee build/logs/reboot-server.log
          grep -q 'EARTH_TO_STARS_REBOOT_STACK_BOOT_PASS' build/logs/reboot-server.log
          grep -q 'valkyrienskies=true genesis=true vlib=true zps=true zpl=true' build/logs/reboot-server.log

      - name: Write reboot report
        shell: bash
        run: |
          VERSION=$(awk -F= '$1=="mod_version" { print $2 }' gradle.properties)
          JAR=$(ls build/libs/earth_to_stars-*.jar | grep -v sources | head -n1)
          SHA=$(cat "$JAR.sha256")
          cat > build/BUILD_AND_RUNTIME_REPORT.md <<EOF
          # EARTH TO STARS — VS/Genesis Reboot Baseline

          - Commit: $GITHUB_SHA
          - Mod version: $VERSION
          - Minecraft: 1.20.1
          - Forge: 47.4.0
          - Java: 17
          - Gradle: 8.14
          - Valkyrien Skies: 2.4.10
          - Genesis: 1.20.1-0.7.3
          - Zero Point Systems: 1.20.1-2.4.0
          - Zero Point Labs: 1.20.1-1.5.0
          - reboot source-set isolation: PASS
          - legacy 26.2 custom ship classes packaged: NO
          - clean/test/build: PASS
          - production JAR verify: PASS
          - dedicated external-stack boot: PASS
          - real VS starter craft integration: NOT IMPLEMENTED YET
          - client graphical smoke: NOT RUN IN THIS BASELINE
          - live playtest: NOT RUN
          - multiplayer playtest: NOT RUN
          - SHA-256: $SHA
          EOF

      - name: Upload deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-reboot-${{ github.sha }}
          path: |
            projects/earth-to-stars/build/libs/earth_to_stars-*.jar
            projects/earth-to-stars/build/libs/earth_to_stars-*.jar.sha256
            projects/earth-to-stars/build/BUILD_AND_RUNTIME_REPORT.md
          retention-days: 7

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-reboot-logs-${{ github.sha }}
          path: projects/earth-to-stars/build/logs/
          if-no-files-found: ignore
          retention-days: 7
