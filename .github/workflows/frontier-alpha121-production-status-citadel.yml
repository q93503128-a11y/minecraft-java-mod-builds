name: Frontier Alpha.121 Production Status and Citadel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha121-production-status-citadel.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha121-production-status-citadel
  cancel-in-progress: false

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Patch Alpha.121
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          root = Path('projects/frontier-settlement')
          sett = root / 'src/main/java/kr/moonseungjun/frontiersettlement/settlement'

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Version + current docs.
          replace_once(root/'gradle.properties', 'mod_version=0.1.0-alpha.120', 'mod_version=0.1.0-alpha.121', 'gradle version')
          replace_once(root/'gradle.properties', '# Alpha.120 canonical validation trigger (2026-09-07).', '# Alpha.120 canonical validation trigger (2026-09-07).\n# Alpha.121 live production-state HUD/context and citadel garrison-response hardening.\n# Alpha.121 canonical validation trigger (2026-09-07).', 'gradle alpha121 note')
          replace_once(root/'README.md', '## Current version: 0.1.0-alpha.120', '## Current version: 0.1.0-alpha.121', 'readme version')
          readme = (root/'README.md').read_text(encoding='utf-8')
          if '## Alpha.121 production state and citadel response' not in readme:
              readme += '''\n\n## Alpha.121 production state and citadel response\n\n- Production workers publish their already-known runtime state into a presentation-only cache; UI/Jade consumers never launch a new worker/entity/resource scan.\n- Production buildings expose staffed/unstaffed, travel, resource-exhaustion and full-storage states when their chunks are loaded.\n- Unloaded production buildings report `청크 미로드` instead of pretending that an old runtime state is current.\n- The citadel expands barracks patrol leash from 24 to 32 blocks and adds 12 blocks to loaded garrison threat detection.\n- Barracks threat acquisition is computed once per barracks patrol pass and shared by its three soldiers instead of scanning the same AABB three times.\n- Physical soldiers, real weapons, recruitment costs, no-force-load rules and ordinary barracks capacity remain unchanged.\n'''
              (root/'README.md').write_text(readme, encoding='utf-8')

          # Companion target sync only; external pins/hashes remain byte-identical.
          for rel in ['COMPANION_LOCK.json', 'companion-testpack/resolved-lock.client.json', 'companion-testpack/resolved-lock.server.json']:
              path = root/rel
              data = json.loads(path.read_text(encoding='utf-8'))
              target = data.setdefault('target', {})
              if target.get('frontier_settlement') != '0.1.0-alpha.120':
                  raise SystemExit(f'{rel}: unexpected Frontier target {target.get("frontier_settlement")}')
              target['frontier_settlement'] = '0.1.0-alpha.121'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Presentation-only production runtime state cache.
          (sett/'SettlementProductionStatusService.java').write_text('''package kr.moonseungjun.frontiersettlement.settlement;\n\nimport net.minecraft.server.level.ServerLevel;\n\nimport java.util.HashMap;\nimport java.util.Map;\n\n/**\n * Presentation-only status cache fed by the existing production AI hot path.\n * It never becomes worker, resource, cargo, spawn or persistence authority.\n */\npublic final class SettlementProductionStatusService {\n    private static final long STALE_AFTER_TICKS = 200L;\n    private static final Map<BuildingKey, StatusEntry> STATUS = new HashMap<>();\n\n    private SettlementProductionStatusService() {}\n\n    private record BuildingKey(String type, int x, int y, int z, int rotation) {}\n    private record StatusEntry(String text, long tick) {}\n\n    public static void mark(ServerLevel level, BuildingRecord building, String text) {\n        if (level == null || building == null || text == null || text.isBlank()) return;\n        STATUS.put(key(building), new StatusEntry(text, level.getGameTime()));\n    }\n\n    public static String statusFor(ServerLevel level, BuildingRecord building) {\n        if (level == null || building == null) return "상태 확인 중";\n        if (!level.hasChunkAt(building.workCenter())) return "청크 미로드";\n        StatusEntry entry = STATUS.get(key(building));\n        if (entry == null || level.getGameTime() - entry.tick() > STALE_AFTER_TICKS) return "상태 확인 중";\n        return entry.text();\n    }\n\n    public static void clear() {\n        STATUS.clear();\n    }\n\n    private static BuildingKey key(BuildingRecord building) {\n        return new BuildingKey(building.type(), building.originX(), building.originY(), building.originZ(), building.rotation());\n    }\n}\n''', encoding='utf-8')

          worker = sett/'SettlementWorkerService.java'
          replace_once(worker,
              '        RESOURCE_TARGETS.clear();\n        RESOURCE_SEARCH_RETRY_AFTER.clear();',
              '        SettlementProductionStatusService.clear();\n        RESOURCE_TARGETS.clear();\n        RESOURCE_SEARCH_RETRY_AFTER.clear();',
              'worker cache clear')
          replace_once(worker,
              '        List<FrontierWorkerEntity> workers = workersByName(level, data, type, workerName);\n        for (WorkerBuildingAssignment assignment : matchWorkersToBuildings(loadedBuildings, workers)) {',
              '        for (BuildingRecord building : loadedBuildings) {\n            SettlementProductionStatusService.mark(level, building, "주민 없음");\n        }\n        List<FrontierWorkerEntity> workers = workersByName(level, data, type, workerName);\n        for (WorkerBuildingAssignment assignment : matchWorkersToBuildings(loadedBuildings, workers)) {',
              'worker unstaffed state')
          replace_once(worker,
              '            worker.setNoAi(false);\n            worker.setInvulnerable(false);',
              '            worker.setNoAi(false);\n            worker.setInvulnerable(false);\n            SettlementProductionStatusService.mark(level, building, "정상 작업 중");',
              'worker staffed state')

          # Lumber status points.
          replace_once(worker,
              '        if (target == null) {\n            if (!carried.isEmpty()) deliverToWorksiteStorage(level, data, worker, camp, carried);\n            else moveNear(level, worker, camp.workCenter(), 0.82D);',
              '        if (target == null) {\n            if (!carried.isEmpty()) {\n                SettlementProductionStatusService.mark(level, camp, "생산물 보관 중");\n                deliverToWorksiteStorage(level, data, worker, camp, carried);\n            } else {\n                SettlementProductionStatusService.mark(level, camp, "주변 벌목 대상 없음");\n                moveNear(level, worker, camp.workCenter(), 0.82D);\n            }',
              'lumber no target')
          replace_once(worker,
              '        if (!withinResourceWorkReach(worker, target, LUMBER_REMOTE_WORK_REACH_SQR)) {\n            moveNear(level, worker, target, 0.92D);',
              '        if (!withinResourceWorkReach(worker, target, LUMBER_REMOTE_WORK_REACH_SQR)) {\n            SettlementProductionStatusService.mark(level, camp, "벌목지 이동 중");\n            moveNear(level, worker, target, 0.92D);',
              'lumber travel')

          # Farm status points.
          replace_once(worker,
              '        if (worker.distanceToSqr(farm.workCenter().getX() + 0.5D, farm.workCenter().getY(), farm.workCenter().getZ() + 0.5D) > 64.0D) {\n            moveNear(level, worker, farm.workCenter(), 0.88D);',
              '        if (worker.distanceToSqr(farm.workCenter().getX() + 0.5D, farm.workCenter().getY(), farm.workCenter().getZ() + 0.5D) > 64.0D) {\n            SettlementProductionStatusService.mark(level, farm, "농장 복귀 중");\n            moveNear(level, worker, farm.workCenter(), 0.88D);',
              'farm travel')
          replace_once(worker,
              '        if (grown > 0) worker.swing(InteractionHand.MAIN_HAND);\n        if (!worker.getMainHandItem().isEmpty() && replanted == 0) {',
              '        if (grown > 0) worker.swing(InteractionHand.MAIN_HAND);\n        if (harvested == 0 && grown == 0 && replanted == 0) {\n            SettlementProductionStatusService.mark(level, farm, "작물 성장 대기");\n        }\n        if (!worker.getMainHandItem().isEmpty() && replanted == 0) {',
              'farm waiting')

          # Quarry status points.
          replace_once(worker,
              '        if (target == null) {\n            if (!carried.isEmpty()) deliverToWorksiteStorage(level, data, worker, quarry, carried);\n            else moveNear(level, worker, quarry.workCenter(), 0.82D);',
              '        if (target == null) {\n            if (!carried.isEmpty()) {\n                SettlementProductionStatusService.mark(level, quarry, "생산물 보관 중");\n                deliverToWorksiteStorage(level, data, worker, quarry, carried);\n            } else {\n                SettlementProductionStatusService.mark(level, quarry, "접근 가능한 채석면 없음");\n                moveNear(level, worker, quarry.workCenter(), 0.82D);\n            }',
              'quarry no target')
          replace_once(worker,
              '        if (approach == null) {\n            clearResourceTarget(worker);',
              '        if (approach == null) {\n            SettlementProductionStatusService.mark(level, quarry, "이동 경로 재탐색 중");\n            clearResourceTarget(worker);',
              'quarry no approach')
          replace_once(worker,
              '        if (!withinResourceWorkReach(worker, approach, QUARRY_REMOTE_WORK_REACH_SQR)) {\n            moveNear(level, worker, approach, 0.90D);',
              '        if (!withinResourceWorkReach(worker, approach, QUARRY_REMOTE_WORK_REACH_SQR)) {\n            SettlementProductionStatusService.mark(level, quarry, "채석면 이동 중");\n            moveNear(level, worker, approach, 0.90D);',
              'quarry travel')
          replace_once(worker,
              '        if (!level.getBlockState(target.above()).isAir()) {\n            if (clearTopQuarryOverburden(level, data, target)) worker.swing(InteractionHand.MAIN_HAND);',
              '        if (!level.getBlockState(target.above()).isAir()) {\n            SettlementProductionStatusService.mark(level, quarry, "채석면 정리 중");\n            if (clearTopQuarryOverburden(level, data, target)) worker.swing(InteractionHand.MAIN_HAND);',
              'quarry overburden')

          # Mine status points.
          replace_once(worker,
              '        if (worker.distanceToSqr(work.getX() + 0.5D, work.getY(), work.getZ() + 0.5D) > 16.0D) {\n            moveNear(level, worker, work, 0.86D);',
              '        if (worker.distanceToSqr(work.getX() + 0.5D, work.getY(), work.getZ() + 0.5D) > 16.0D) {\n            SettlementProductionStatusService.mark(level, mine, "광산 복귀 중");\n            moveNear(level, worker, work, 0.86D);',
              'mine travel')
          replace_once(worker,
              '        if (ore == null) {\n            if (!carried.isEmpty()) deliverToWorksiteStorage(level, data, worker, mine, carried);',
              '        if (ore == null) {\n            SettlementProductionStatusService.mark(level, mine, "광맥 고갈");\n            if (!carried.isEmpty()) deliverToWorksiteStorage(level, data, worker, mine, carried);',
              'mine exhausted')

          # Storage delivery state, including full central/shared fallback.
          replace_once(worker,
              '                worker.getNavigation().stop();\n                ItemStack remaining = SettlementStorageService.insertAt(level, local, carried);',
              '                worker.getNavigation().stop();\n                SettlementProductionStatusService.mark(level, building, "현장 저장고 적재 중");\n                ItemStack remaining = SettlementStorageService.insertAt(level, local, carried);',
              'local deposit')
          replace_once(worker,
              '            if (!isTargetBlocked(level, worker, local) && moveNear(level, worker, local, 0.86D)) return;\n        }\n        deliverToTownStorage(level, data, worker, carried);',
              '            if (!isTargetBlocked(level, worker, local) && moveNear(level, worker, local, 0.86D)) {\n                SettlementProductionStatusService.mark(level, building, "현장 저장고 운반 중");\n                return;\n            }\n        }\n        deliverToTownStorage(level, data, worker, building, carried);',
              'local transport')
          replace_once(worker,
              '    private static void deliverToTownStorage(ServerLevel level, SettlementData data,\n                                             FrontierWorkerEntity worker, ItemStack carried) {',
              '    private static void deliverToTownStorage(ServerLevel level, SettlementData data,\n                                             FrontierWorkerEntity worker, BuildingRecord building, ItemStack carried) {',
              'town storage signature')
          replace_once(worker,
              '        if (target == null || !level.hasChunkAt(target) || !SettlementStorageService.hasRoomAt(level, target, carried)) {\n            worker.getNavigation().stop();',
              '        if (target == null || !level.hasChunkAt(target) || !SettlementStorageService.hasRoomAt(level, target, carried)) {\n            SettlementProductionStatusService.mark(level, building, "현장·공동 저장고 가득 참");\n            worker.getNavigation().stop();',
              'storage full')
          replace_once(worker,
              '        if (worker.distanceToSqr(target.getX() + 0.5D, target.getY(), target.getZ() + 0.5D) > 9.0D) {\n            moveNear(level, worker, target, 0.85D);',
              '        if (worker.distanceToSqr(target.getX() + 0.5D, target.getY(), target.getZ() + 0.5D) > 9.0D) {\n            SettlementProductionStatusService.mark(level, building, "공동 창고 운반 중");\n            moveNear(level, worker, target, 0.85D);',
              'town storage travel')

          # Context display uses only the presentation cache.
          context = sett/'SettlementContextService.java'
          replace_once(context, 'type.displayName(), buildingDetail(type, data), -1));', 'type.displayName(), buildingDetail(level, building, type, data), -1));', 'context building detail call')
          replace_once(context,
              '    private static String buildingDetail(BuildingType type, SettlementData data) {',
              '    private static String buildingDetail(ServerLevel level, BuildingRecord building, BuildingType type, SettlementData data) {',
              'context detail signature')
          replace_once(context,
              '            case LUMBER_CAMP, FARM, QUARRY, MINE -> "완공 · " + SettlementProductionEfficiencyService.detail(type, data);',
              '            case LUMBER_CAMP, FARM, QUARRY, MINE -> "완공 · " + SettlementProductionEfficiencyService.detail(type, data)\n                    + " · 상태: " + SettlementProductionStatusService.statusFor(level, building);',
              'context production status')
          replace_once(context,
              '            case CITADEL -> "완공 · 감시망 반경 56 · 주거 +" + type.housingGain();',
              '            case CITADEL -> "완공 · 감시망 반경 56 · 병영 감지 +12 · 순찰 반경 32 · 주거 +" + type.housingGain();',
              'context citadel detail')

          # Citadel response bonus + remove repeated same-barracks threat scans.
          barracks = sett/'SettlementBarracksService.java'
          replace_once(barracks,
              '    private static final int PATROL_RADIUS = 24;\n    public static final double BASE_THREAT_RADIUS = 28.0D;',
              '    private static final int BASE_PATROL_RADIUS = 24;\n    private static final int CITADEL_PATROL_RADIUS = 32;\n    private static final double CITADEL_THREAT_RADIUS_BONUS = 12.0D;\n    public static final double BASE_THREAT_RADIUS = 28.0D;',
              'barracks citadel constants')
          replace_once(barracks,
              '    private static final double PATROL_LEASH_RADIUS_SQR = PATROL_RADIUS * PATROL_RADIUS;\n',
              '',
              'remove static leash')
          replace_once(barracks,
              '        for (BuildingRecord barracks : barracks(data)) {\n            if (!patrolAreaLoaded(level, barracks)) continue;\n            for (int slot = 0; slot < SOLDIERS_PER_BARRACKS; slot++) {\n                FrontierSoldierEntity soldier = findSoldier(level, data, barracks, slot);\n                if (soldier != null) patrol(level, data, barracks, slot, soldier);\n            }\n        }',
              '        for (BuildingRecord barracks : barracks(data)) {\n            if (!patrolAreaLoaded(level, barracks)) continue;\n            Monster threat = nearestThreat(level, data, barracks.workCenter());\n            for (int slot = 0; slot < SOLDIERS_PER_BARRACKS; slot++) {\n                FrontierSoldierEntity soldier = findSoldier(level, data, barracks, slot);\n                if (soldier != null) patrol(level, data, barracks, slot, soldier, threat);\n            }\n        }',
              'barracks one threat scan')
          replace_once(barracks,
              '    private static void patrol(ServerLevel level, SettlementData data, BuildingRecord barracks, int slot, FrontierSoldierEntity soldier) {\n        BlockPos home = soldierHome(barracks, slot);\n        Monster threat = nearestThreat(level, barracks.workCenter());',
              '    private static void patrol(ServerLevel level, SettlementData data, BuildingRecord barracks, int slot, FrontierSoldierEntity soldier, Monster threat) {\n        BlockPos home = soldierHome(barracks, slot);',
              'barracks patrol threat arg')
          replace_once(barracks,
              '        if (homeDistance > PATROL_LEASH_RADIUS_SQR) {',
              '        int patrolRadius = data.buildingCount(BuildingType.CITADEL) > 0 ? CITADEL_PATROL_RADIUS : BASE_PATROL_RADIUS;\n        if (homeDistance > (double) patrolRadius * patrolRadius) {',
              'barracks dynamic leash')
          replace_once(barracks,
              '    private static Monster nearestThreat(ServerLevel level, BlockPos center) {\n        double threatRadius = SettlementExplorationBenefitService.barracksThreatRadius(level.getServer());',
              '    private static Monster nearestThreat(ServerLevel level, SettlementData data, BlockPos center) {\n        double threatRadius = SettlementExplorationBenefitService.barracksThreatRadius(level.getServer())\n                + (data.buildingCount(BuildingType.CITADEL) > 0 ? CITADEL_THREAT_RADIUS_BONUS : 0.0D);',
              'barracks citadel threat radius')

          # Cumulative source verifier.
          test = root/'tools/test_current_source.py'
          replace_once(test, 'require("mod_version=0.1.0-alpha.120" in gradle, "current verifier/version drift")', 'require("mod_version=0.1.0-alpha.121" in gradle, "current verifier/version drift")', 'source verifier version')
          t = test.read_text(encoding='utf-8')
          anchor = 'require("SettlementProductionEfficiencyService.farmWorkPeriod" in worker, "farm still uses fixed work cadence")\n'
          if anchor not in t:
              raise SystemExit('production status audit anchor missing')
          extra = '''production_status = text(SETTLEMENT / "SettlementProductionStatusService.java")\nrequire("presentation-only status cache" in production_status.lower()\n        and "STALE_AFTER_TICKS = 200L" in production_status\n        and "statusFor" in production_status,\n        "production presentation-state cache missing")\nrequire("주민 없음" in worker and "주변 벌목 대상 없음" in worker\n        and "접근 가능한 채석면 없음" in worker and "광맥 고갈" in worker\n        and "현장·공동 저장고 가득 참" in worker,\n        "production runtime status coverage missing")\ncontext = text(SETTLEMENT / "SettlementContextService.java")\nrequire("SettlementProductionStatusService.statusFor(level, building)" in context,\n        "M/Jade building context does not consume the production status cache")\n'''
          t = t.replace(anchor, extra + anchor, 1)
          barracks_audit_anchor = 'require("militaryStateLoaded" in barracks, "barracks loaded-state authority missing")' if 'require("militaryStateLoaded" in barracks, "barracks loaded-state authority missing")' in t else None
          citadel_checks = '''\nbarracks = text(SETTLEMENT / "SettlementBarracksService.java")\nrequire("CITADEL_PATROL_RADIUS = 32" in barracks and "CITADEL_THREAT_RADIUS_BONUS = 12.0D" in barracks,\n        "citadel garrison response bonus missing")\nrequire("Monster threat = nearestThreat(level, data, barracks.workCenter());" in barracks\n        and "patrol(level, data, barracks, slot, soldier, threat)" in barracks,\n        "barracks returned to repeated per-soldier threat AABB scans")\n'''
          t += citadel_checks
          test.write_text(t, encoding='utf-8')
          PY
      - name: Audit and build
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          python3 tools/test_companion_testpack.py
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.121.jar
      - name: Commit Alpha.121
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement
          git diff --cached --check
          git commit -m 'frontier: release 0.1.0-alpha.121 production status and citadel response'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
