name: TEMP HiddenRubric Lane04 Decision Evaluator Mine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-decision-evaluator-mine.yml'
permissions:
  contents: write
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Mine
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          REPO='lmarena-ai/arena-human-preference-140k'; REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]
          ACT=r'(?:senior management|management|executives?|executive board|board|manager|boss|supervisor|teacher|professor(?:s)?|instructor|faculty|evaluating committee|evaluation committee|selection committee|admissions committee|committee|panel|client|customer|potential investors?|investors?|stakeholders?|judges?|jury|reviewers?|hiring manager|HR manager|human resources manager|recruiter|sponsor|funding committee|grant committee|admissions officers?)'
          OBJ=r'(?:presentation|proposal|pitch|application|submission|assignment|thesis|dissertation|report|document|essay|project|plan|analysis|deliverable|work|draft|letter|cover letter|resume|résumé|business case|portfolio|prototype|design|recommendation|request)'
          ACTION=r'(?:review|evaluate|assess|judge|grade|mark|score|approve|reject|accept|select|shortlist|choose|fund|award|rank|rate|recommend|sign[- ]?off|decide)'
          PURPOSE=r'(?:review|evaluation|assessment|judging|grading|marking|scoring|approval|selection|decision|feedback|sign[- ]?off|funding|acceptance)'
          pats=[
            ('object_for_actor_purpose',re.compile(rf'(?is)\b(?P<object>{OBJ})\b.{{0,100}}?\b(?:for|before)\s+(?P<actor>{ACT})\b.{{0,30}}?\b(?P<action>{PURPOSE})\b')),
            ('object_to_actor_for_purpose',re.compile(rf'(?is)\b(?P<object>{OBJ})\b.{{0,80}}?\b(?:submit(?:ted)?|send|sent|present(?:ed)?|share(?:d)?|deliver(?:ed)?)\b.{{0,70}}?\bto\s+(?P<actor>{ACT})\b.{{0,60}}?\b(?:for\s+)?(?P<action>{PURPOSE})\b')),
            ('actor_action_object',re.compile(rf'(?is)\b(?P<actor>{ACT})\b.{{0,55}}?\b(?:will|would|can|could|should|must|may|to)?\s*(?P<action>{ACTION})\b.{{0,100}}?\b(?:the|this|your|our|my|a|an)?\s*(?P<object>{OBJ})\b')),
            ('object_action_by_actor',re.compile(rf'(?is)\b(?P<object>{OBJ})\b.{{0,80}}?\b(?P<action>reviewed|evaluated|assessed|judged|graded|marked|scored|approved|rejected|accepted|selected|shortlisted|ranked|rated)\s+by\s+(?P<actor>{ACT})\b')),
            ('impress_actor',re.compile(rf'(?is)\b(?P<object>{OBJ})\b.{{0,180}}?\b(?:impress|convince|persuade|win\s+over|appeal\s+to)\s+(?P<actor>{ACT})\b')),
            ('actor_decision_on_object',re.compile(rf'(?is)\b(?P<actor>{ACT})\b.{{0,100}}?\b(?P<action>decide|select|choose|accept|reject|approve|fund|award|shortlist|score|mark|grade|rank|rate|recommend)\b.{{0,120}}?\b(?:the|this|your|our|my|a|an)?\s*(?P<object>{OBJ})\b')),
            ('submit_object_to_eval_actor',re.compile(rf'(?is)\b(?:submit|send|present|deliver)\s+(?:the|this|your|our|my|a|an)?\s*(?P<object>{OBJ})\b.{{0,100}}?\bto\s+(?P<actor>(?:judges?|jury|reviewers?|(?:selection|evaluation|evaluating|admissions|funding|grant) committee|panel|teacher|professor|instructor|senior management|executive board|hiring manager|recruiter|potential investors?|investors?))\b')),
          ]
          def ctext(m):
            if not isinstance(m,dict): return ''
            if isinstance(m.get('text'),str): return m['text']
            c=m.get('content')
            if isinstance(c,str): return c
            if isinstance(c,list): return '\n'.join(i if isinstance(i,str) else i.get('text','') if isinstance(i,dict) else '' for i in c).strip()
            return ''
          def uts(row):
            out=[]
            for e in row.get('full_conversation') or []:
              if not isinstance(e,dict): continue
              u=e.get('user')
              if isinstance(u,dict):
                t=ctext(u).strip()
                if t: out.append(t)
              elif str(e.get('role') or '')=='user':
                t=ctext(e).strip()
                if t: out.append(t)
            return out
          privacy=re.compile(r'(?i)\b(?:ssn|social security number|credit card number|password|api key|private key)\b')
          found=[]; seen=set(); raw=0
          for sh in SHARDS:
            p=hf_hub_download(REPO,filename=sh,repo_type='dataset',revision=REV)
            pf=pq.ParquetFile(p); cols=['id','evaluation_session_id','evaluation_order','language','is_code','full_conversation']; use=[c for c in cols if c in pf.schema_arrow.names]
            for b in pf.iter_batches(batch_size=512,columns=use):
              for row in b.to_pylist():
                raw+=1
                if row.get('language')!='en' or bool(row.get('is_code')): continue
                for ti,text in enumerate(uts(row)):
                  if not 24<=len(text)<=8000 or privacy.search(text): continue
                  for pi,(name,rx) in enumerate(pats):
                    m=rx.search(text)
                    if not m: continue
                    key=(str(row.get('id') or ''),ti)
                    if key in seen: break
                    seen.add(key); gd=m.groupdict(); s=max(0,m.start()-240); e=min(len(text),m.end()+240)
                    found.append({'sourceRowId':key[0],'sourceEvaluationSessionId':str(row.get('evaluation_session_id') or ''),'evaluationOrder':int(row.get('evaluation_order') or 0),'turnIndex':ti,'sourceLength':len(text),'pattern':name,'patternRank':pi,'actor':(gd.get('actor') or '').strip(),'action':(gd.get('action') or '').strip(),'object':(gd.get('object') or '').strip(),'match':m.group(0),'context':text[s:e],'sourceText':text,'assistantOutputsIncluded':False})
                    break
          assert raw==135634,raw
          found.sort(key=lambda x:(x['patternRank'],x['sourceLength'],x['sourceRowId'],x['turnIndex']))
          out=Path('temp-hiddenrubric/lane04/decision-evaluator'); out.mkdir(parents=True,exist_ok=True)
          (out/'candidates.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in found[:500]),encoding='utf-8')
          compact=[{k:x[k] for k in ('sourceRowId','sourceEvaluationSessionId','turnIndex','sourceLength','pattern','actor','action','object','match','context')} for x in found[:500]]
          (out/'compact.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in compact),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps({'rawRows':raw,'matchedUniqueTurns':len(found),'materializedRows':min(500,len(found)),'sourceRevision':REV,'assistantOutputsIncluded':False},indent=2)+'\n',encoding='utf-8')
          print('matched',len(found))
          PY
      - name: Commit queue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/decision-evaluator/
          git commit -m 'chore: materialize temporary Lane04 decision evaluator queue'
          git push origin HEAD:main
