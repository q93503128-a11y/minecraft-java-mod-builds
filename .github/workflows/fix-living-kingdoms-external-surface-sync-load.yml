name: Fix Living Kingdoms external surface sync load

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_external_surface_sync_load.py'
      - '.github/workflows/fix-living-kingdoms-external-surface-sync-load.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove synchronous surface chunk loads
        run: python .github/scripts/fix_living_kingdoms_external_surface_sync_load.py
      - name: Commit Java repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalDistrictBuildingBuilder.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/RealmSitePlanner.java
          git diff --cached --quiet && exit 0
          git commit -m 'Remove synchronous chunk loads from external building planning'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot repair; remove after Java changes land.
