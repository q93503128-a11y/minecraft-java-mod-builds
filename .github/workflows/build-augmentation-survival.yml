name: Build Augmentation Survival Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/augmentation-survival/**'
      - '.github/workflows/build-augmentation-survival.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/augmentation-survival

jobs:
  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify toolchain
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build and inspect pinned pack
        run: |
          ./gradlew --no-daemon clean build inspectPackDependencies verifyPackRuntimeClasspath \
            -PaugmentationPackRuntime=true --stacktrace

      - name: Dedicated server smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-pack-server build/reports/modpack
          printf 'eula=true\n' > run-pack-server/eula.txt
          console='build/reports/modpack/pack-server-console.log'
          latest='run-pack-server/logs/latest.log'
          rm -f "$console" "$latest"

          # Start in its own process group so a successful smoke can stop immediately
          # instead of paying the old fixed 180-second timeout on every commit.
          setsid ./gradlew --no-daemon runPackServer \
            -PaugmentationPackRuntime=true --stacktrace \
            >"$console" 2>&1 &
          server_pid=$!
          ready=0
          deadline=$((SECONDS + 180))

          while (( SECONDS < deadline )); do
            if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Exception in server tick loop|Failed to start the minecraft server|Encountered an unexpected exception' \
                "$console" "$latest" 2>/dev/null; then
              break
            fi
            if grep -Eqi 'Done \(|For help, type' "$console" "$latest" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          # Keep a short post-ready soak so startup-success is not mistaken for
          # immediate post-start failure, then terminate the entire Gradle/game group.
          if [[ $ready -eq 1 ]]; then
            sleep 5
          fi
          kill -TERM -- -"$server_pid" 2>/dev/null || true
          for _ in {1..10}; do
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          kill -KILL -- -"$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true

          if [[ ! -f "$latest" ]]; then
            echo 'Dedicated server produced no latest.log'
            tail -n 250 "$console" || true
            exit 1
          fi

          cp "$latest" build/reports/modpack/pack-server-latest.log

          if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Exception in server tick loop|Failed to start the minecraft server|Encountered an unexpected exception' \
              "$latest" "$console"; then
            echo 'Fatal pack-load signature found in server log'
            tail -n 250 "$latest"
            exit 1
          fi

          if [[ $ready -ne 1 ]] || ! grep -Eqi 'Done \(|For help, type' "$latest" "$console"; then
            echo 'Server never reached ready state before the 180-second startup deadline'
            tail -n 250 "$latest"
            exit 1
          fi

          echo 'AUGMENT_PACK_SERVER_SMOKE_PASS'

      - name: Install virtual display for client smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Client boot smoke test
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-pack-client build/reports/modpack
          console='build/reports/modpack/pack-client-console.log'
          latest='run-pack-client/logs/latest.log'
          rm -f "$console" "$latest"

          # The old smoke always waited the full 120 seconds. Detect a real client
          # initialization marker, soak briefly, then stop the isolated process group.
          setsid xvfb-run -a -s '-screen 0 1280x720x24' \
            ./gradlew --no-daemon runPackClient \
              -PaugmentationPackRuntime=true --stacktrace \
            >"$console" 2>&1 &
          client_pid=$!
          initialized=0
          deadline=$((SECONDS + 120))

          while (( SECONDS < deadline )); do
            if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Mixin transformation of .* failed|Minecraft has crashed|Exception in thread "Render thread"|Uncaught exception in thread "Render thread"' \
                "$console" "$latest" 2>/dev/null; then
              break
            fi
            if grep -Eqi 'Backend library: LWJGL|Reloading ResourceManager|OpenAL initialized|Created: .*atlas' \
                "$console" "$latest" 2>/dev/null; then
              initialized=1
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [[ $initialized -eq 1 ]]; then
            sleep 10
          fi
          kill -TERM -- -"$client_pid" 2>/dev/null || true
          for _ in {1..10}; do
            kill -0 "$client_pid" 2>/dev/null || break
            sleep 1
          done
          kill -KILL -- -"$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true

          if [[ ! -f "$latest" ]]; then
            echo 'Client produced no latest.log'
            tail -n 300 "$console" || true
            exit 1
          fi

          cp "$latest" build/reports/modpack/pack-client-latest.log

          if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Mixin transformation of .* failed|Minecraft has crashed|Exception in thread "Render thread"|Uncaught exception in thread "Render thread"' \
              "$latest" "$console"; then
            echo 'Fatal pack-load signature found in client log'
            tail -n 300 "$latest"
            exit 1
          fi

          if [[ $initialized -ne 1 ]] || ! grep -Eqi 'Backend library: LWJGL|Reloading ResourceManager|OpenAL initialized|Created: .*atlas' \
              "$latest" "$console"; then
            echo 'Client never reached an initialization marker before the 120-second startup deadline'
            tail -n 300 "$latest"
            exit 1
          fi

          echo 'AUGMENT_PACK_CLIENT_SMOKE_PASS'

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: augmentation-survival-pack-smoke-${{ github.run_number }}
          path: |
            projects/augmentation-survival/build/reports/modpack/**
            projects/augmentation-survival/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
