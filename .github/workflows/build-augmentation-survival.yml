name: Build Augmentation Survival Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/augmentation-survival/**'
      - '.github/workflows/build-augmentation-survival.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/augmentation-survival

jobs:
  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify toolchain
        id: toolchain
        run: |
          set -o pipefail
          chmod +x gradlew
          java -version 2>&1 | tee "$RUNNER_TEMP/augmentation-survival-toolchain.log"
          ./gradlew --version 2>&1 | tee -a "$RUNNER_TEMP/augmentation-survival-toolchain.log"

      - name: Build and inspect pinned pack
        id: build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean build inspectPackDependencies verifyPackRuntimeClasspath \
            -PaugmentationPackRuntime=true --stacktrace 2>&1 | tee "$RUNNER_TEMP/augmentation-survival-build.log"

      - name: Capture World Bosses localization contract
        id: worldbosses_localization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/modpack
          python3 - <<'PY'
          import json
          import pathlib
          import zipfile

          cache = pathlib.Path.home() / '.gradle' / 'caches'
          output = pathlib.Path('build/reports/modpack/worldbosses-en_us.json')
          source_report = pathlib.Path('build/reports/modpack/worldbosses-localization-source.txt')
          matched = []
          for jar in cache.rglob('*.jar'):
              try:
                  with zipfile.ZipFile(jar) as archive:
                      names = set(archive.namelist())
                      if 'fabric.mod.json' not in names:
                          continue
                      metadata = json.loads(archive.read('fabric.mod.json'))
                      if metadata.get('id') != 'worldbosses':
                          continue
                      lang_path = 'assets/worldbosses/lang/en_us.json'
                      if lang_path not in names:
                          raise SystemExit(f'World Bosses jar lacks {lang_path}: {jar}')
                      output.write_bytes(archive.read(lang_path))
                      languages = sorted(
                          name for name in names
                          if name.startswith('assets/worldbosses/lang/') and name.endswith('.json')
                      )
                      source_report.write_text(
                          'jar=' + str(jar) + '\n'
                          + 'version=' + str(metadata.get('version')) + '\n'
                          + '\n'.join(languages) + '\n',
                          encoding='utf-8',
                      )
                      matched.append(jar)
                      break
              except (zipfile.BadZipFile, UnicodeDecodeError, json.JSONDecodeError, KeyError):
                  continue
          if not matched:
              raise SystemExit('Unable to locate pinned World Bosses jar in Gradle cache')
          parsed = json.loads(output.read_text(encoding='utf-8'))
          if not isinstance(parsed, dict) or not parsed:
              raise SystemExit('World Bosses en_us localization is empty or invalid')
          print(f'WORLD_BOSSES_LOCALIZATION_CAPTURE_PASS keys={len(parsed)} file={output}')
          PY

      - name: Audit external Korean localization
        id: external_localization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/modpack
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import zipfile

          cache = pathlib.Path.home() / '.gradle' / 'caches'
          report_dir = pathlib.Path('build/reports/modpack')
          project_assets = pathlib.Path('build/resources/main/assets')
          inventory_path = report_dir / 'pack-artifact-inventory.txt'
          if not inventory_path.exists():
              raise SystemExit('pack-artifact-inventory.txt is missing')

          expected_files = []
          for line in inventory_path.read_text(encoding='utf-8').splitlines():
              if line.startswith('file='):
                  expected_files.append(line.split('\t', 1)[0][5:])
          if not expected_files:
              raise SystemExit('No pinned artifact names found in pack inventory')

          cache_by_name = {}
          for jar in cache.rglob('*.jar'):
              if jar.name in expected_files and jar.name not in cache_by_name:
                  cache_by_name[jar.name] = jar
          missing_jars = sorted(set(expected_files) - set(cache_by_name))
          if missing_jars:
              raise SystemExit(f'Pinned jars not found in Gradle cache: {missing_jars}')

          def read_json_bytes(raw, origin):
              try:
                  value = json.loads(raw.decode('utf-8'))
              except Exception as exc:
                  raise SystemExit(f'Invalid lang JSON {origin}: {exc}') from exc
              if not isinstance(value, dict):
                  raise SystemExit(f'Lang JSON is not an object: {origin}')
              return {str(k): str(v) for k, v in value.items()}

          def project_override(namespace):
              path = project_assets / namespace / 'lang' / 'ko_kr.json'
              if not path.exists():
                  return {}
              return read_json_bytes(path.read_bytes(), path)

          rows = []
          missing_payload = {}
          hardcoded = []
          printable = re.compile(rb'[ -~]{8,}')
          user_words = re.compile(
              r'(?i)(tooltip|press |right.?click|left.?click|page |details|ability|abilities|offering|shrine|boss|'
              r'quest|guide|journal|codex|inventory|config|setting|warning|requires?|cannot|cooldown|damage|health|'
              r'attack|defen[cs]e|biome|structure|spawn|item|block|entity)'
          )

          for file_name in expected_files:
              jar = cache_by_name[file_name]
              with zipfile.ZipFile(jar) as archive:
                  names = set(archive.namelist())
                  mod_id = '(unknown)'
                  version = '(unknown)'
                  if 'fabric.mod.json' in names:
                      try:
                          metadata = json.loads(archive.read('fabric.mod.json'))
                          mod_id = str(metadata.get('id', mod_id))
                          version = str(metadata.get('version', version))
                      except Exception:
                          pass

                  english_paths = sorted(
                      name for name in names
                      if re.fullmatch(r'assets/[^/]+/lang/en_us\.json', name)
                  )
                  if not english_paths:
                      rows.append({
                          'file': file_name,
                          'mod_id': mod_id,
                          'version': version,
                          'namespace': '',
                          'english': 0,
                          'jar_korean': 0,
                          'override_korean': 0,
                          'effective_missing': 0,
                          'classification': 'NO_EN_US',
                      })
                  for en_path in english_paths:
                      namespace = en_path.split('/')[1]
                      ko_path = f'assets/{namespace}/lang/ko_kr.json'
                      english = read_json_bytes(archive.read(en_path), f'{file_name}!/{en_path}')
                      jar_korean = read_json_bytes(archive.read(ko_path), f'{file_name}!/{ko_path}') if ko_path in names else {}
                      override = project_override(namespace)
                      effective = dict(jar_korean)
                      effective.update(override)
                      missing_keys = sorted(key for key in english if key not in effective)
                      if not missing_keys:
                          classification = 'A_COMPLETE'
                      elif jar_korean or override:
                          classification = 'B_PARTIAL'
                      else:
                          classification = 'C_NO_KOREAN'
                      rows.append({
                          'file': file_name,
                          'mod_id': mod_id,
                          'version': version,
                          'namespace': namespace,
                          'english': len(english),
                          'jar_korean': len(jar_korean),
                          'override_korean': len(override),
                          'effective_missing': len(missing_keys),
                          'classification': classification,
                      })
                      if missing_keys:
                          missing_payload[f'{mod_id}:{namespace}'] = {
                              'file': file_name,
                              'version': version,
                              'namespace': namespace,
                              'missing': {key: english[key] for key in missing_keys},
                          }

                  # Constant-pool heuristic for strings that bypass lang files. This is a candidate list,
                  # not proof that the text is rendered to players.
                  for class_name in sorted(name for name in names if name.endswith('.class')):
                      raw = archive.read(class_name)
                      candidates = []
                      for match in printable.findall(raw):
                          try:
                              text = match.decode('ascii')
                          except UnicodeDecodeError:
                              continue
                          if len(text) > 180 or '/' in text or '$' in text or '.' in text:
                              continue
                          if user_words.search(text) and re.search(r'[A-Za-z]{3}', text):
                              candidates.append(text)
                      for text in sorted(set(candidates))[:30]:
                          hardcoded.append({
                              'mod_id': mod_id,
                              'file': file_name,
                              'class': class_name,
                              'text': text,
                          })

          rows.sort(key=lambda row: (row['mod_id'], row['namespace'], row['file']))
          summary = report_dir / 'external-localization-summary.tsv'
          header = ['file', 'mod_id', 'version', 'namespace', 'english', 'jar_korean', 'override_korean', 'effective_missing', 'classification']
          summary.write_text(
              '\t'.join(header) + '\n' + '\n'.join('\t'.join(str(row[col]) for col in header) for row in rows) + '\n',
              encoding='utf-8',
          )
          (report_dir / 'external-localization-missing.json').write_text(
              json.dumps(missing_payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          (report_dir / 'external-hardcoded-string-candidates.json').write_text(
              json.dumps(hardcoded, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          total_english = sum(row['english'] for row in rows)
          total_missing = sum(row['effective_missing'] for row in rows)
          print(f'EXTERNAL_LOCALIZATION_AUDIT_PASS namespaces={len(rows)} english={total_english} missing={total_missing} hardcoded_candidates={len(hardcoded)}')
          PY

      - name: Dedicated server smoke test
        id: server
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-pack-server build/reports/modpack
          printf 'eula=true\n' > run-pack-server/eula.txt
          console='build/reports/modpack/pack-server-console.log'
          latest='run-pack-server/logs/latest.log'
          rm -f "$console" "$latest"

          setsid ./gradlew --no-daemon runPackServer \
            -PaugmentationPackRuntime=true --stacktrace \
            >"$console" 2>&1 &
          server_pid=$!
          ready=0
          deadline=$((SECONDS + 180))

          while (( SECONDS < deadline )); do
            if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Exception in server tick loop|Failed to start the minecraft server|Encountered an unexpected exception' \
                "$console" "$latest" 2>/dev/null; then
              break
            fi
            if grep -Eqi 'Done \(|For help, type' "$console" "$latest" 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [[ $ready -eq 1 ]]; then
            sleep 5
          fi
          kill -TERM -- -"$server_pid" 2>/dev/null || true
          for _ in {1..10}; do
            kill -0 "$server_pid" 2>/dev/null || break
            sleep 1
          done
          kill -KILL -- -"$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true

          if [[ ! -f "$latest" ]]; then
            echo 'Dedicated server produced no latest.log'
            tail -n 250 "$console" || true
            exit 1
          fi

          cp "$latest" build/reports/modpack/pack-server-latest.log

          if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Exception in server tick loop|Failed to start the minecraft server|Encountered an unexpected exception' \
              "$latest" "$console"; then
            echo 'Fatal pack-load signature found in server log'
            tail -n 250 "$latest"
            exit 1
          fi

          if [[ $ready -ne 1 ]] || ! grep -Eqi 'Done \(|For help, type' "$latest" "$console"; then
            echo 'Server never reached ready state before the 180-second startup deadline'
            tail -n 250 "$latest"
            exit 1
          fi

          echo 'AUGMENT_PACK_SERVER_SMOKE_PASS'

      - name: Install virtual display for client smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Client boot smoke test
        id: client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-pack-client build/reports/modpack
          console='build/reports/modpack/pack-client-console.log'
          latest='run-pack-client/logs/latest.log'
          rm -f "$console" "$latest"

          setsid xvfb-run -a -s '-screen 0 1280x720x24' \
            ./gradlew --no-daemon runPackClient \
              -PaugmentationPackRuntime=true --stacktrace \
            >"$console" 2>&1 &
          client_pid=$!
          initialized=0
          deadline=$((SECONDS + 120))

          while (( SECONDS < deadline )); do
            if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Mixin transformation of .* failed|Minecraft has crashed|Exception in thread "Render thread"|Uncaught exception in thread "Render thread"' \
                "$console" "$latest" 2>/dev/null; then
              break
            fi
            if grep -Eqi 'Backend library: LWJGL|Reloading ResourceManager|OpenAL initialized|Created: .*atlas' \
                "$console" "$latest" 2>/dev/null; then
              initialized=1
              break
            fi
            if ! kill -0 "$client_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [[ $initialized -eq 1 ]]; then
            sleep 10
          fi
          kill -TERM -- -"$client_pid" 2>/dev/null || true
          for _ in {1..10}; do
            kill -0 "$client_pid" 2>/dev/null || break
            sleep 1
          done
          kill -KILL -- -"$client_pid" 2>/dev/null || true
          wait "$client_pid" 2>/dev/null || true

          if [[ ! -f "$latest" ]]; then
            echo 'Client produced no latest.log'
            tail -n 300 "$console" || true
            exit 1
          fi

          cp "$latest" build/reports/modpack/pack-client-latest.log

          if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Mixin transformation of .* failed|Minecraft has crashed|Exception in thread "Render thread"|Uncaught exception in thread "Render thread"' \
              "$latest" "$console"; then
            echo 'Fatal pack-load signature found in client log'
            tail -n 300 "$latest"
            exit 1
          fi

          if [[ $initialized -ne 1 ]] || ! grep -Eqi 'Backend library: LWJGL|Reloading ResourceManager|OpenAL initialized|Created: .*atlas' \
              "$latest" "$console"; then
            echo 'Client never reached an initialization marker before the 120-second startup deadline'
            tail -n 300 "$latest"
            exit 1
          fi

          echo 'AUGMENT_PACK_CLIENT_SMOKE_PASS'

      - name: Build verified Modrinth pack
        id: mrpack
        run: |
          python3 tools/build_verified_mrpack.py

      - name: Verify production JAR and write SHA-256
        id: jar
        if: success()
        run: |
          python3 tools/verify_production_jar.py

      - name: Archive raw logs and write build report
        if: always()
        shell: bash
        env:
          RUN_SHA: ${{ github.sha }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          WORLDBOSSES_OUTCOME: ${{ steps.worldbosses_localization.outcome }}
          LOCALIZATION_OUTCOME: ${{ steps.external_localization.outcome }}
          SERVER_OUTCOME: ${{ steps.server.outcome }}
          CLIENT_OUTCOME: ${{ steps.client.outcome }}
          MRPACK_OUTCOME: ${{ steps.mrpack.outcome }}
          JAR_OUTCOME: ${{ steps.jar.outcome }}
        run: |
          set -euo pipefail
          report_dir=build/reports/modpack
          mkdir -p "$report_dir/raw-log-staging"
          [[ ! -f "$RUNNER_TEMP/augmentation-survival-toolchain.log" ]] || cp "$RUNNER_TEMP/augmentation-survival-toolchain.log" "$report_dir/raw-log-staging/toolchain.log"
          [[ ! -f "$RUNNER_TEMP/augmentation-survival-build.log" ]] || cp "$RUNNER_TEMP/augmentation-survival-build.log" "$report_dir/raw-log-staging/build.log"
          if [[ -d "$report_dir" ]]; then
            find "$report_dir" -maxdepth 1 -type f \( -name '*.log' -o -name '*.txt' \) -exec cp -f {} "$report_dir/raw-log-staging/" \;
          fi
          if ! find "$report_dir/raw-log-staging" -maxdepth 1 -type f -print -quit | grep -q .; then
            echo 'No raw logs were produced before the workflow stopped.' > "$report_dir/raw-log-staging/NO_LOGS.txt"
          fi
          rm -f "$report_dir/raw-logs.zip"
          (cd "$report_dir/raw-log-staging" && zip -q -j ../raw-logs.zip ./*)
          rm -rf "$report_dir/raw-log-staging"
          python3 - <<'PY'
          import hashlib
          import os
          import re
          from pathlib import Path

          report_dir = Path('build/reports/modpack')
          logs = Path(os.environ['RUNNER_TEMP'])
          jar_line = 'NOT RUN'
          jar_files = sorted(Path('build/libs').glob('augmentation-survival-*.jar'))
          production = [path for path in jar_files if not path.name.endswith('-sources.jar')]
          if production:
              jar = production[-1]
              digest = hashlib.sha256(jar.read_bytes()).hexdigest()
              jar_line = f'{jar.name} — {jar.stat().st_size} bytes — SHA-256 `{digest}`'
          pack_line = 'NOT RUN'
          pack_sums = sorted(Path('build/distributions').glob('*.mrpack.sha256'))
          if pack_sums:
              pack_line = pack_sums[-1].read_text(encoding='utf-8').strip()

          build_log = logs / 'augmentation-survival-build.log'
          game_tests = 'not recorded'
          if build_log.exists():
              match = re.search(r'All (\d+) required tests passed', build_log.read_text(encoding='utf-8', errors='replace'))
              if match:
                  game_tests = f"{match.group(1)} required tests passed"

          def result(name):
              value = os.environ.get(name, 'skipped')
              return 'PASS' if value == 'success' else ('NOT RUN' if value in ('skipped', '') else f'FAIL ({value})')

          lines = [
              '# Build and Runtime Report',
              '',
              '- Project: Augmentation Survival',
              f"- Commit: `{os.environ['RUN_SHA']}`",
              '- Toolchain: Temurin Java 25; Gradle 9.5.1 (wrapper)',
              f"- Production JAR: {jar_line}",
              f"- Modrinth pack SHA-256: `{pack_line}`",
              '',
              '## Verification',
              '',
              f"- Toolchain check: {result('TOOLCHAIN_OUTCOME')}",
              f"- `clean build`, pack dependency checks, and GameTests: {result('BUILD_OUTCOME')} ({game_tests})",
              f"- World Bosses localization capture: {result('WORLDBOSSES_OUTCOME')}",
              f"- External Korean localization audit: {result('LOCALIZATION_OUTCOME')}",
              f"- Dedicated server boot smoke: {result('SERVER_OUTCOME')}",
              f"- Client boot smoke: {result('CLIENT_OUTCOME')}",
              f"- Modrinth pack generation and verification: {result('MRPACK_OUTCOME')}",
              f"- Production JAR structure and checksum: {result('JAR_OUTCOME')}",
              '- Datagen: NOT RUN (no project datagen task is configured).',
              '- Manual in-game UI/play testing, multiplayer testing, and profiling: NOT RUN.',
              '',
              'Raw toolchain, build, server, and client logs are included in `raw-logs.zip`; additional verification reports are alongside this file.',
              '',
          ]
          (report_dir / 'BUILD_AND_RUNTIME_REPORT.md').write_text('\n'.join(lines), encoding='utf-8')
          print('BUILD_RUNTIME_REPORT_WRITTEN')
          PY

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: augmentation-survival-pack-smoke-${{ github.run_number }}
          path: |
            projects/augmentation-survival/build/reports/modpack/**
            projects/augmentation-survival/build/libs/*.jar
            projects/augmentation-survival/build/libs/*.sha256
            projects/augmentation-survival/build/distributions/**
          if-no-files-found: warn
          retention-days: 14
