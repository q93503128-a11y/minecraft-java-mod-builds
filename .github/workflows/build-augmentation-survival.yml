name: Build Augmentation Survival Pack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/augmentation-survival/**'
      - '.github/workflows/build-augmentation-survival.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/augmentation-survival

jobs:
  pack-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify toolchain
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build and inspect pinned pack
        run: |
          ./gradlew --no-daemon clean build inspectPackDependencies verifyPackRuntimeClasspath \
            -PaugmentationPackRuntime=true --stacktrace

      - name: Dedicated server smoke test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p run-pack-server build/reports/modpack
          printf 'eula=true\n' > run-pack-server/eula.txt

          set +e
          timeout 180s ./gradlew --no-daemon runPackServer \
            -PaugmentationPackRuntime=true --stacktrace \
            2>&1 | tee build/reports/modpack/pack-server-console.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 ]]; then
            echo "Pack server process failed with status $status"
            exit $status
          fi

          if [[ ! -f run-pack-server/logs/latest.log ]]; then
            echo 'Dedicated server produced no latest.log'
            exit 1
          fi

          cp run-pack-server/logs/latest.log build/reports/modpack/pack-server-latest.log

          if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Exception in server tick loop|Failed to start the minecraft server|Encountered an unexpected exception' run-pack-server/logs/latest.log; then
            echo 'Fatal pack-load signature found in server log'
            tail -n 250 run-pack-server/logs/latest.log
            exit 1
          fi

          if ! grep -Eqi 'Done \(|For help, type' run-pack-server/logs/latest.log; then
            echo 'Server never reached ready state before timeout'
            tail -n 250 run-pack-server/logs/latest.log
            exit 1
          fi

          echo 'AUGMENT_PACK_SERVER_SMOKE_PASS'

      - name: Install virtual display for client smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Client boot smoke test
        shell: bash
        run: |
          set -o pipefail
          mkdir -p run-pack-client build/reports/modpack

          set +e
          timeout --signal=TERM --kill-after=20s 120s \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            ./gradlew --no-daemon runPackClient \
              -PaugmentationPackRuntime=true --stacktrace \
            2>&1 | tee build/reports/modpack/pack-client-console.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 124 ]]; then
            echo "Pack client did not remain healthy until smoke timeout (status $status)"
            exit 1
          fi

          if [[ ! -f run-pack-client/logs/latest.log ]]; then
            echo 'Client produced no latest.log'
            exit 1
          fi

          cp run-pack-client/logs/latest.log build/reports/modpack/pack-client-latest.log

          if grep -Eqi 'Mod resolution encountered an incompatible mod set|Could not execute entrypoint|Mixin transformation of .* failed|Minecraft has crashed|Exception in thread "Render thread"|Uncaught exception in thread "Render thread"' run-pack-client/logs/latest.log; then
            echo 'Fatal pack-load signature found in client log'
            tail -n 300 run-pack-client/logs/latest.log
            exit 1
          fi

          if ! grep -Eqi 'Backend library: LWJGL|Reloading ResourceManager|OpenAL initialized|Created: .*atlas' run-pack-client/logs/latest.log; then
            echo 'Client never reached a client-initialization marker before timeout'
            tail -n 300 run-pack-client/logs/latest.log
            exit 1
          fi

          echo 'AUGMENT_PACK_CLIENT_SMOKE_PASS'

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: augmentation-survival-pack-smoke-${{ github.run_number }}
          path: |
            projects/augmentation-survival/build/reports/modpack/**
            projects/augmentation-survival/build/libs/*.jar
          if-no-files-found: warn
          retention-days: 14
