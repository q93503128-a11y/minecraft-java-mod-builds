name: Generate Full Pack Korean Overlays V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-fullpack-korean-overlays-v2.yml'
      - 'projects/frontier-settlement/tools/generate_fullpack_korean_overlays.py'
      - 'projects/frontier-settlement/tools/postprocess_fullpack_korean_overlays.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-fullpack-korean-overlays-v2
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install translation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'transformers<5' sentencepiece
          python3 -m pip install --disable-pip-version-check --no-input torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate, postprocess and validate Korean overlays
        shell: bash
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          set -euo pipefail
          set +e
          python3 projects/frontier-settlement/tools/generate_fullpack_korean_overlays.py 2>&1 | tee /tmp/fullpack-ko-generator.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            # The NLLB generator is allowed to stop only at its quality gate after producing files.
            # Any download/model/runtime failure must still fail the workflow.
            grep -q 'empty translations for non-empty English strings:' /tmp/fullpack-ko-generator.log || exit "$status"
          fi
          python3 projects/frontier-settlement/tools/postprocess_fullpack_korean_overlays.py

      - name: Preserve generated overlays for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fullpack-korean-overlays-nllb
          path: |
            projects/frontier-settlement/src/main/resources/assets/*/lang/ko_kr.json
            projects/survival-ascension/src/main/resources/assets/*/lang/ko_kr.json
          if-no-files-found: warn

      - name: Commit overlays safely on latest main
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/frontier-settlement/src/main/resources/assets projects/survival-ascension/src/main/resources/assets
          if git diff --cached --quiet; then
            echo 'No localization changes to commit.'
            exit 0
          fi
          git diff --cached --stat
          git commit -m 'Regenerate and polish Korean localization overlays'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
