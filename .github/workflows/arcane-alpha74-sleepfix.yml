name: Arcane alpha74 sleep ownership cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/arcane-alpha74-sleepfix-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply sleep ownership cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 .github/arcane-alpha74-sleepfix.py
          rm -f .github/arcane-alpha74-sleepfix.py .github/arcane-alpha74-sleepfix-trigger.txt .github/workflows/arcane-alpha74-sleepfix.yml
          git add -A
          git diff --check
          git commit -m 'Fix alpha.74 Sleep ownership release cleanup [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1