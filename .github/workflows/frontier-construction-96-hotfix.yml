name: Frontier Construction 96 Hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-construction-96-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply reach hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/frontier-settlement/tools/apply_construction96_hotfix.py

      - name: Clean build
        shell: bash
        run: |
          set -o pipefail
          cd projects/frontier-settlement
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee ../../frontier-construction96-build.log

      - name: Upload hotfix JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-construction96-hotfix
          path: |
            frontier-construction96-build.log
            projects/frontier-settlement/build/libs/*.jar
          if-no-files-found: error

      - name: Commit hotfix
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java projects/frontier-settlement/tools/apply_construction96_hotfix.py
          if git diff --cached --quiet; then
            echo "No construction hotfix changes to commit"
            exit 0
          fi
          git commit -m "Fix Frontier roof construction reach deadlock"
          git pull --rebase origin main
          git push origin HEAD:main
