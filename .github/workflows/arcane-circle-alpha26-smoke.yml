name: Arcane Circle alpha.26 rewrite smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-circle-alpha26-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile alpha.26 rewrite
        working-directory: projects/arcane-circle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean compileJava --stacktrace --console=plain
