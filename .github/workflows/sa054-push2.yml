name: Survival Ascension 0.54 verifier-fix runner

on:
  push:
    paths:
      - '.sa054-run2'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply and validate corrected 0.54
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/sa054-apply.yml').read_text(encoding='utf-8')
          sm = "          python3 - <<'PY'\n"
          em = "\n          PY\n"
          s = src.index(sm) + len(sm)
          e = src.index(em, s)
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in src[s:e].splitlines()) + '\n'
          compile(code, '/tmp/sa054_apply.py', 'exec')
          Path('/tmp/sa054_apply.py').write_text(code, encoding='utf-8')
          PY
          python3 /tmp/sa054_apply.py

          # Rebuild only the newly-added 0.54 JAR-verifier tail with an explicit fresh ZipFile scope.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/survival-ascension/tools/verify_release_jar.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('    for token in [b"TOOLS_MACE"')
          end = text.index('\nprint("frontline_freight_manifest_runtime=present")', start)
          block = '''with zipfile.ZipFile(jar) as zf:
    affix = zf.read("kr/moonseungjun/survivalascension/equipment/AscensionAffixes.class")
    combat = zf.read("kr/moonseungjun/survivalascension/combat/CombatProgression.class")
    main_class = zf.read("kr/moonseungjun/survivalascension/SurvivalAscension.class")
    for token in [b"TOOLS_MACE", b"maceImpactRadiusBonus", b"maceImpactTargetBonus", b"maceImpactKnockbackBonus", b"maceImpactLiftBonus"]:
        if token not in affix:
            raise SystemExit(f"0.54 compiled mace-affix token missing: {token!r}")
    for token in [b"IS_MACE_SMASH", b"tryMaceImpact", b"KNOCKBACK_RESISTANCE", b"setDeltaMovement"]:
        if token not in combat:
            raise SystemExit(f"0.54 compiled mace-impact token missing: {token!r}")
    if b"mace outer impact rings" not in main_class:
        raise SystemExit("0.54 runtime banner missing mace outer impact rings")

'''
          p.write_text(text[:start] + block + text[end:], encoding='utf-8')
          compile(p.read_text(encoding='utf-8'), str(p), 'exec')
          PY

          rm -f .github/workflows/sa054-apply.yml .github/workflows/sa054-push.yml .github/workflows/sa054-push2.yml .sa054-run .sa054-run2
          cd projects/survival-ascension
          chmod +x gradlew
          python3 tools/test_release_source.py | tee /tmp/sa054-source.log
          python3 tools/test_release_content_pack.py | tee /tmp/sa054-content.log
          python3 -m py_compile tools/build_mrpack.py tools/test_current_source.py tools/test_content_pack_source.py tools/test_release_source.py tools/test_release_content_pack.py tools/verify_jar.py tools/verify_release_jar.py
          git diff --check
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain | tee /tmp/sa054-gradle.log
          python3 tools/verify_release_jar.py build/libs/survivalascension-0.54.0-alpha.1.jar | tee /tmp/sa054-jar.log
          python3 tools/build_mrpack.py --survival-jar build/libs/survivalascension-0.54.0-alpha.1.jar --output /tmp/Survival-Ascension-0.54.0-alpha.1-content-preview.mrpack | tee /tmp/sa054-pack.log
          echo "SA054_JAR_SHA=$(sha256sum build/libs/survivalascension-0.54.0-alpha.1.jar | awk '{print $1}')"
          echo "SA054_MRPACK_SHA=$(sha256sum /tmp/Survival-Ascension-0.54.0-alpha.1-content-preview.mrpack | awk '{print $1}')"
          cd ../..

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/survival-ascension .github/workflows/sa054-apply.yml .github/workflows/sa054-push.yml .github/workflows/sa054-push2.yml .sa054-run .sa054-run2
          git commit -m 'Survival Ascension 0.54 mace impact ascension'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
