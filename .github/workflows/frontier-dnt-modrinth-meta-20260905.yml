name: Frontier DnT Modrinth Metadata 20260905

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/frontier-dnt-modrinth-meta-20260905.yml'

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve locked Dungeons and Taverns 5.3.0 NeoForge metadata
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from pathlib import Path

          params = urllib.parse.urlencode({
              'game_versions': json.dumps(['26.2']),
              'loaders': json.dumps(['neoforge']),
              'include_changelog': 'false',
          })
          url = 'https://api.modrinth.com/v2/project/tpehi7ww/version?' + params
          req = urllib.request.Request(url, headers={'User-Agent':'MoonStudio-FrontierPack/1.0'})
          with urllib.request.urlopen(req, timeout=30) as r:
              versions = json.load(r)

          candidates = [v for v in versions if v.get('version_number') == '5.3.0+mod']
          if not candidates:
              candidates = [v for v in versions if str(v.get('version_number','')).startswith('5.3.0')]
          if len(candidates) != 1:
              raise SystemExit(f'Expected exactly one DnT 5.3.0 NeoForge version, got {len(candidates)}: ' + ', '.join(v.get('id','?') for v in candidates))
          v = candidates[0]
          files = v.get('files') or []
          f = next((x for x in files if x.get('primary')), files[0] if files else None)
          if not f:
              raise SystemExit('DnT version has no file')
          hashes = f.get('hashes') or {}
          if not hashes.get('sha1') or not hashes.get('sha512'):
              raise SystemExit('DnT file missing sha1/sha512')
          if not str(f.get('url','')).startswith('https://cdn.modrinth.com/'):
              raise SystemExit('DnT file is not on Modrinth CDN: ' + str(f.get('url')))

          out = {
              'project_id': v.get('project_id'),
              'version_id': v.get('id'),
              'version_number': v.get('version_number'),
              'name': v.get('name'),
              'loaders': v.get('loaders'),
              'game_versions': v.get('game_versions'),
              'file': f,
          }
          Path('dnt-meta').mkdir()
          Path('dnt-meta/dnt-5.3.0-neoforge.json').write_text(json.dumps(out, indent=2), encoding='utf-8')
          print(json.dumps(out, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-dnt-5.3.0-neoforge-meta
          path: dnt-meta/dnt-5.3.0-neoforge.json
          if-no-files-found: error
      - name: Remove temporary workflow
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm .github/workflows/frontier-dnt-modrinth-meta-20260905.yml
          git commit -m 'Remove temporary DnT metadata workflow'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
