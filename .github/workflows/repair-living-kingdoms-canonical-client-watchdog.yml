name: Repair Living Kingdoms canonical client watchdog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage patched canonical workflow as ordinary blob
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_living_kingdoms_canonical_client_watchdog.py
          grep -Fq 'CLIENT_AUDIT_OUTCOME=$outcome' .github/workflows/build-living-kingdoms.yml
          grep -Fq 'need_graphics=0' .github/workflows/build-living-kingdoms.yml
          grep -Fq 'client_pgid=' .github/workflows/build-living-kingdoms.yml

          mkdir -p .github/staged
          cp .github/workflows/build-living-kingdoms.yml .github/staged/living-kingdoms-build-workflow.yml.txt
          git restore .github/workflows/build-living-kingdoms.yml

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/staged/living-kingdoms-build-workflow.yml.txt
          git commit -m 'ci(living-kingdoms): stage bounded canonical workflow blob'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
