name: Repair Living Kingdoms canonical client watchdog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-living-kingdoms-canonical-client-watchdog.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch canonical graphical client watchdog
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/patch_living_kingdoms_canonical_client_watchdog.py
          grep -Fq 'CLIENT_AUDIT_OUTCOME=$outcome' .github/workflows/build-living-kingdoms.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/build-living-kingdoms.yml
          git commit -m 'ci(living-kingdoms): bound graphical client smoke process group'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done

      - name: Dispatch canonical build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-living-kingdoms.yml --ref main
