name: TITANBREAK B06 Chronophage CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/titanbreak/**'
      - '.github/workflows/titanbreak-b06-chronophage-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chronophage-b06:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical B06 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          project = Path('projects/titanbreak')
          root = project / 'src/main'
          java = root / 'java/kr/moonseungjun/titanbreak'
          assets = root / 'resources/assets/titanbreak'
          entity = (java / 'entity/ChronophageEntity.java').read_text(encoding='utf-8')
          registry = (java / 'registry/ModBossEntities.java').read_text(encoding='utf-8')
          reward = (java / 'combat/ChronophageRewardService.java').read_text(encoding='utf-8')
          encounter = (java / 'world/ChronophageEncounterService.java').read_text(encoding='utf-8')
          watcher_encounter = (java / 'world/WatcherEncounterService.java').read_text(encoding='utf-8')
          renderers = (java / 'client/TitanEntityRenderers.java').read_text(encoding='utf-8')
          renderer = (java / 'client/ChronophageRenderer.java').read_text(encoding='utf-8')
          field = (java / 'combat/ReflexFieldService.java').read_text(encoding='utf-8')
          drive = (java / 'combat/ReflexDriveService.java').read_text(encoding='utf-8')
          asset_registry = (project / 'ASSET_REGISTRY.md').read_text(encoding='utf-8')
          gradle = (project / 'gradle.properties').read_text(encoding='utf-8')

          version = re.search(r'mod_version=0\.1\.0-alpha\.(\d+)', gradle)
          assert version and int(version.group(1)) >= 47, 'B06 requires alpha.47 or newer'
          assert 'CANONICAL_VISIBLE_MAX_HEALTH = 15_000.0D' in entity
          for token in (
              'TIME_ORGAN_0','TIME_ORGAN_1','TIME_ORGAN_2',
              'PHASE_JOINT_0','PHASE_JOINT_1','PHASE_JOINT_2','PHASE_JOINT_3','CENTRAL_RING',
              'return getEntityData().get(EFFECTIVE_TR)','nextPhase == 1 ? 75','requestedRating >= 100 ? 110 : 95',
              'baseRating - brokenOrgans * 15','96) - brokenOrgans * 18','centralRingExposed()',
              'timeCutSlash(','scheduleDelayedExplosion(','phaseMove(','temporalOverwrite(','schedulePastEchoes(',
              'ReflexFieldService.clear(player.getUUID())','ReflexDriveService.setActive(player, false)'
          ):
              assert token in entity, token
          assert 'tickRateManager().setTickRate' not in entity

          assert 'CHRONOPHAGE' in registry
          assert 'CombatScale.toInternal(ChronophageEntity.CANONICAL_VISIBLE_MAX_HEALTH)' in registry
          assert 'CHRONOPHAGE_TEMPORAL_ORGAN.get(), 1' in reward
          assert 'TEMPORAL_ORGAN.get(), 1' in reward
          assert 'PHASE_COIL.get(), 2 + victim.getRandom().nextInt(3)' in reward
          assert 'recordBossFirstKill(player, "chronophage", FIRST_KILL_RD, 5)' in reward
          assert 'hasBossFirstKill("hundred_eyed_watcher")' in encounter
          assert 'hasBossFirstKill("chronophage")' in encounter
          assert 'ModBossEntities.CHRONOPHAGE.get()' in encounter
          assert 'ChronophageEncounterService.tick(player, progression)' in watcher_encounter
          assert 'ModBossEntities.CHRONOPHAGE.get(), ChronophageRenderer::new' in renderers
          assert 'withScale(30.0F)' in renderer

          assert 'NORMAL_TICK_RATE = 20.0F' in drive
          assert 'tickRateManager().setTickRate' not in drive + field
          assert 'EntityTickEvent' not in field

          geo = assets / 'geckolib/models/entity/chronophage.geo.json'
          anim = assets / 'geckolib/animations/entity/chronophage.animation.json'
          texture = assets / 'textures/entity/chronophage.png'
          for path in (geo, anim, texture): assert path.is_file(), path
          geo_data = json.loads(geo.read_text(encoding='utf-8'))
          bone_names = {bone['name'] for bone in geo_data['minecraft:geometry'][0]['bones']}
          for bone in ('time_organ_0','time_organ_1','time_organ_2','phase_joint_0','phase_joint_1',
                       'phase_joint_2','phase_joint_3','ring_shell','central_ring','temporal_field','override_ring'):
              assert bone in bone_names, bone
          animations = json.loads(anim.read_text(encoding='utf-8')).get('animations', {})
          for key in ('misc.idle','move.walk','attack.swing'): assert key in animations, key

          overlay = root / 'resources/assets/titanbreak_boss/lang'
          for lang in ('en_us','ko_kr'):
              data = json.loads((overlay / f'{lang}.json').read_text(encoding='utf-8'))
              for key in ('entity.titanbreak.chronophage','message.titanbreak.chronophage_warning',
                          'message.titanbreak.chronophage_arrival','message.titanbreak.chronophage_defeated'):
                  assert key in data, (lang,key)
          assert '| Chronophage model / animation / texture |' in asset_registry
          PY
