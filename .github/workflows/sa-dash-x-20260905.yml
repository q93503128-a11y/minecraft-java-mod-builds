name: Survival Ascension Dash X 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sa-dash-x-20260905.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Switch dash default from V to X
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('projects/survival-ascension')
          def one(path, old, new):
              p=root/path
              s=p.read_text(encoding='utf-8')
              assert s.count(old)==1, (p, old, s.count(old))
              p.write_text(s.replace(old,new,1), encoding='utf-8')
          one(Path('gradle.properties'), 'mod_version=0.61.10-alpha.1', 'mod_version=0.61.11-alpha.1')
          one(Path('src/main/java/kr/moonseungjun/survivalascension/SurvivalAscension.java'), 'public static final String VERSION = "0.61.10-alpha.1";', 'public static final String VERSION = "0.61.11-alpha.1";')
          one(Path('src/main/java/kr/moonseungjun/survivalascension/client/SurvivalAscensionClient.java'), '"key.survivalascension.mobility_action", InputConstants.KEY_V, KeyMapping.Category.MISC);', '"key.survivalascension.mobility_action", InputConstants.KEY_X, KeyMapping.Category.MISC);')
          p=root/'tools/test_current_source.py'
          s=p.read_text(encoding='utf-8')
          s=s.replace('mod_version=0.61.10-alpha.1','mod_version=0.61.11-alpha.1')
          s=s.replace('VERSION = "0.61.10-alpha.1"','VERSION = "0.61.11-alpha.1"')
          marker='warband = text(JAVA / "elite/WarbandDirector.java")\n'
          assert marker in s
          s=s.replace(marker, 'client = text(JAVA / "client/SurvivalAscensionClient.java")\nrequire("InputConstants.KEY_X" in client, "dash default key must be X")\nrequire("mobility_action\\\", InputConstants.KEY_V" not in client, "old V dash default returned")\n\n'+marker, 1)
          s=s.replace('CURRENT SOURCE CHECK PASS: Survival Ascension 0.61.10 pacing + runtime optimization invariants','CURRENT SOURCE CHECK PASS: Survival Ascension 0.61.11 X dash + pacing/runtime invariants')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify current source and resources
        run: |
          cd projects/survival-ascension
          python3 tools/test_current_source.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('src/main/resources').rglob('*.json'))
          for p in files: json.loads(p.read_text(encoding='utf-8'))
          print('JSON PASS', len(files))
          PY
      - name: Java 25 clean build
        run: |
          cd projects/survival-ascension
          chmod +x gradlew
          ./gradlew --no-daemon clean build
      - name: Verify JAR
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          folder=pathlib.Path('projects/survival-ascension/build/libs')
          jars=[p for p in folder.glob('*.jar') if 'sources' not in p.name and 'javadoc' not in p.name]
          assert len(jars)==1, jars
          jar=jars[0]
          assert jar.name=='survivalascension-0.61.11-alpha.1.jar', jar
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              assert len(names)==len(set(names))
              assert any(n.endswith('SurvivalAscensionClient.class') for n in names)
              assert 'META-INF/neoforge.mods.toml' in names
          print('JAR PASS', jar)
          PY
      - name: Commit canonical source
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm -f .github/workflows/sa-dash-x-20260905.yml
          git add projects/survival-ascension
          git commit -m 'Bind Survival Ascension dash to X by default'
      - name: Rebase and reverify main
        run: |
          git fetch origin main
          git rebase origin/main
          cd projects/survival-ascension
          python3 tools/test_current_source.py
          ./gradlew --no-daemon build
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp projects/survival-ascension/build/libs/survivalascension-0.61.11-alpha.1.jar dist/
      - uses: actions/upload-artifact@v4
        with:
          name: survivalascension-0.61.11-alpha.1-dash-x
          path: dist/*.jar
          if-no-files-found: error
      - name: Push main
        run: git push origin HEAD:main
