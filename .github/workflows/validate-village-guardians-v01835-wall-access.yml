name: Validate Village Guardians v0.18.35 Wall Access

on:
  push:
    paths:
      - 'projects/village-guardians/.v01835-wall-access-trigger'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PROJECT_DIR: projects/village-guardians
      BUILD_VERSION: 0.18.35-alpha.1
      EXPECTED_JAR: villageguardians-0.18.35-alpha.1.jar

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Apply wall access climb fix
        run: python3 projects/village-guardians/tools/apply_v01835_wall_access_climb_fix.py

      - name: Diff safety
        run: git diff --check

      - name: Run every regression contract
        shell: bash
        run: |
          set -uo pipefail
          failed=0
          : > /tmp/vg-failed-tests.txt
          cd "$PROJECT_DIR"
          for test in tools/test_*.py; do
            echo "=== $test ==="
            if python3 "$test"; then
              :
            else
              echo "$test" >> /tmp/vg-failed-tests.txt
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "=== FAILED TEST FILES ==="
            cat /tmp/vg-failed-tests.txt
            exit 1
          fi

      - name: Clean Java 25 NeoForge build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain

      - name: Verify runtime JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f "build/libs/${EXPECTED_JAR}"
          python3 tools/verify_jar.py "build/libs/${EXPECTED_JAR}"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, zipfile
          jar = Path('build/libs/villageguardians-0.18.35-alpha.1.jar')
          with zipfile.ZipFile(jar) as zf:
              assert zf.testzip() is None
              names = set(zf.namelist())
              toml = zf.read('META-INF/neoforge.mods.toml').decode('utf-8')
          prefix = 'kr/moonseungjun/villageguardians/'
          for cls in ('VillageFortressTerrain.class', 'VillageWorldSystem.class', 'VillageBuildingEnhancements.class'):
              assert prefix + cls in names, cls
          assert '0.18.35-alpha.1' in toml
          print('sha256=' + hashlib.sha256(jar.read_bytes()).hexdigest())
          print('size=' + str(jar.stat().st_size))
          PY

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.18.35-alpha.1-wall-access
          path: projects/village-guardians/build/libs/villageguardians-0.18.35-alpha.1.jar
          if-no-files-found: error
          retention-days: 30

      - name: Commit validated source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$PROJECT_DIR/.v01835-wall-access-trigger"
          rm -f "$PROJECT_DIR/tools/apply_v01835_wall_access_climb_fix.py"
          rm -f .github/workflows/validate-village-guardians-v01835-wall-access.yml
          git add "$PROJECT_DIR" .github/workflows/validate-village-guardians-v01835-wall-access.yml
          git commit -m "Fix Village Guardians wall access landing overlap"
          git pull --rebase origin main
          git push origin HEAD:main
          SOURCE_SHA=$(git rev-parse HEAD)
          JAR="$PROJECT_DIR/build/libs/$EXPECTED_JAR"
          SHA=$(sha256sum "$JAR" | awk '{print $1}')
          SIZE=$(stat -c%s "$JAR")
          mkdir -p "$PROJECT_DIR/.ci"
          cat > "$PROJECT_DIR/.ci/v01835-final.txt" <<EOF
          version=$BUILD_VERSION
          run_id=$GITHUB_RUN_ID
          source_sha=$SOURCE_SHA
          jar_name=$EXPECTED_JAR
          jar_sha256=$SHA
          jar_size=$SIZE
          audit=wall-access-climb-landing-overlap-and-existing-world-migration
          EOF
          git add "$PROJECT_DIR/.ci/v01835-final.txt"
          git commit -m "Record Village Guardians 0.18.35 acceptance"
          git pull --rebase origin main
          git push origin HEAD:main
