name: Manual Audit Worksite Output Provenance

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/manual-audit-worksite-output-provenance.yml'
      - 'projects/frontier-settlement/tools/patch_worksite_output_provenance.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply worksite provenance fix
        run: python3 projects/frontier-settlement/tools/patch_worksite_output_provenance.py

      - name: Frontier source audit
        working-directory: projects/frontier-settlement
        run: python3 tools/test_alpha91_source.py

      - name: Build Frontier Settlement
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Build Survival Ascension regression
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Commit validated provenance fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerService.java
          if git diff --cached --quiet; then
            echo 'No worksite source changes to commit.'
            exit 0
          fi
          git commit -m 'Restrict worksite export to profession output'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
