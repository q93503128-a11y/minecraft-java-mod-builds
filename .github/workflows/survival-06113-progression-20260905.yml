name: Survival 0.61.13 Progression 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/survival-06113-progression-20260905.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply progression patch
        run: python3 tools/apply_survival_06113_progression_tmp.py
      - name: Verify current source
        run: |
          cd projects/survival-ascension
          python3 tools/test_current_source.py
      - name: Java 25 clean build
        run: |
          cd projects/survival-ascension
          chmod +x gradlew
          ./gradlew --no-daemon clean build
      - name: Verify runtime JAR
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          folder=pathlib.Path('projects/survival-ascension/build/libs')
          jars=[p for p in folder.glob('*.jar') if 'sources' not in p.name and 'javadoc' not in p.name]
          assert len(jars)==1, jars
          jar=jars[0]
          assert '0.61.13-alpha.1' in jar.name, jar
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              assert len(names)==len(set(names))
              assert any(n.endswith('MobilityProgression.class') for n in names)
              assert any(n.endswith('FishingProgression.class') for n in names)
              assert 'META-INF/neoforge.mods.toml' in names
          print('JAR PASS', jar)
          PY
      - name: Commit canonical source and remove temporary files
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm -f .github/workflows/survival-06113-progression-20260905.yml tools/apply_survival_06113_progression_tmp.py
          git add projects/survival-ascension
          git commit -m 'Rebalance Survival mobility and fishing progression'
      - name: Rebase and reverify current main
        run: |
          git fetch origin main
          git rebase origin/main
          cd projects/survival-ascension
          python3 tools/test_current_source.py
          ./gradlew --no-daemon build
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp projects/survival-ascension/build/libs/survivalascension-0.61.13-alpha.1.jar dist/
      - uses: actions/upload-artifact@v4
        with:
          name: survivalascension-0.61.13-alpha.1-tested
          path: dist/*.jar
          if-no-files-found: error
      - name: Push main
        run: git push origin HEAD:main
