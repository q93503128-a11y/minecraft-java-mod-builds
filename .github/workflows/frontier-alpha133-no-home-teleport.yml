name: Frontier Alpha.133 No Home Teleport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha133-no-home-teleport.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Apply Alpha.133 fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/frontier_alpha133_no_teleport_patch.py
          git diff --check
          git diff -- projects/frontier-settlement
      - name: Verify source and docs
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          grep -q 'mod_version=0.1.0-alpha.133' gradle.properties
          ! grep -q 'DEEP_WORK_RETURN_TELEPORT_TICKS' src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerService.java
          ! grep -q 'rescueLongDeepWorkReturn' src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerService.java
      - name: Java 25 clean build
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Commit verified fix to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement
          git commit -m 'fix(frontier): remove resident home teleport fallback alpha.133 [skip ci]'
          git push origin HEAD:main
      - name: Prepare deliverable
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          jar='build/libs/frontier_settlement-0.1.0-alpha.133.jar'
          test -s "$jar"
          sha="$(sha256sum "$jar" | awk '{print $1}')"
          mkdir -p build/deliverables
          cp "$jar" build/deliverables/
          printf 'version=0.1.0-alpha.133\nsha256=%s\nsource_sha=%s\n' "$sha" "$(git rev-parse HEAD)" > build/deliverables/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-0.1.0-alpha.133-no-home-teleport
          path: projects/frontier-settlement/build/deliverables/
          if-no-files-found: error
          retention-days: 30
