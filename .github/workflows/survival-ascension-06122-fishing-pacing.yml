name: Survival Ascension 0.61.22 Fishing Pacing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/survival-ascension-06122-fishing-pacing.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4

      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main

      - name: Apply 0.61.22 fishing pacing patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/survival_ascension_06122_fishing_pacing_patch.py

      - name: Verify source contracts
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_current_source.py
          python3 tools/test_release_source.py
          git diff --check -- .

      - name: Java 25 clean build
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain

      - name: Verify runtime JAR
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          jar='build/libs/survivalascension-0.61.22-alpha.1.jar'
          test -s "$jar"
          python3 tools/verify_release_jar.py "$jar"

      - name: Commit verified balance patch to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/survival-ascension
          git diff --cached --check
          git commit -m 'balance(survival): accelerate fishing mastery in 0.61.22 [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

      - name: Prepare deliverable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          cp projects/survival-ascension/build/libs/survivalascension-0.61.22-alpha.1.jar deliverables/
          cp projects/survival-ascension/build/libs/survivalascension-0.61.22-alpha.1.jar.sha256 deliverables/
          sha="$(cut -d' ' -f1 projects/survival-ascension/build/libs/survivalascension-0.61.22-alpha.1.jar.sha256)"
          printf 'version=0.61.22-alpha.1\nsha256=%s\n' "$sha" > deliverables/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: survivalascension-0.61.22-alpha.1-fishing-pacing
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
