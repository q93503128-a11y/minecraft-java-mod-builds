name: Arcane alpha70 verifier fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-alpha70-verifierfix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair verifier layout
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/arcane-circle/tools/verify_jar.py')
          s = p.read_text(encoding='utf-8')
          old = '''    expected5 = {
              'flame_strike': '4s_locked_vertical_fire_column_with_initial_breach_and_0.5s_pulses',
              'dominate_person': '30s_person_scale_combat_asset_control',
          }
          if index.get('fifth_circle_value_pass_1') != expected5:
              raise SystemExit(f'alpha.70 fifth-circle value metadata mismatch: {index.get("fifth_circle_value_pass_1")}')
          roles5 = index.get('fifth_circle_role_audit', {})
          expected_roles5 = {'cone_of_cold','wall_of_force','cloudkill','telekinesis','flame_strike','hold_monster','mass_cure_wounds','passwall','dominate_person','insect_plague'}
          if set(roles5) != expected_roles5 or len(set(roles5.values())) != 10:
              raise SystemExit('alpha.70 fifth-circle role separation contract missing')

          '''
          # The generated block lost its leading four spaces. Match the actual broken form too.
          broken = '''    expected5 = {
              'flame_strike': '4s_locked_vertical_fire_column_with_initial_breach_and_0.5s_pulses',
              'dominate_person': '30s_person_scale_combat_asset_control',
          }
          if index.get('fifth_circle_value_pass_1') != expected5:
              raise SystemExit(f'alpha.70 fifth-circle value metadata mismatch: {index.get("fifth_circle_value_pass_1")}')
          roles5 = index.get('fifth_circle_role_audit', {})
          expected_roles5 = {'cone_of_cold','wall_of_force','cloudkill','telekinesis','flame_strike','hold_monster','mass_cure_wounds','passwall','dominate_person','insect_plague'}
          if set(roles5) != expected_roles5 or len(set(roles5.values())) != 10:
              raise SystemExit('alpha.70 fifth-circle role separation contract missing')

          '''
          # Normalize based on the boundaries, independent of current indentation.
          start = s.index('    expected5 = {')
          end = s.index('    expected6 = {', start)
          block = s[start:end]
          lines = block.splitlines()
          normalized = []
          for line in lines:
              if line and not line.startswith('    '):
                  normalized.append('    ' + line)
              else:
                  normalized.append(line)
          # A few lines already have four spaces while nested lines have eight; detect actual structure explicitly.
          fixed = '''    expected5 = {
              'flame_strike': '4s_locked_vertical_fire_column_with_initial_breach_and_0.5s_pulses',
              'dominate_person': '30s_person_scale_combat_asset_control',
          }
          if index.get('fifth_circle_value_pass_1') != expected5:
              raise SystemExit(f'alpha.70 fifth-circle value metadata mismatch: {index.get("fifth_circle_value_pass_1")}')
          roles5 = index.get('fifth_circle_role_audit', {})
          expected_roles5 = {'cone_of_cold','wall_of_force','cloudkill','telekinesis','flame_strike','hold_monster','mass_cure_wounds','passwall','dominate_person','insect_plague'}
          if set(roles5) != expected_roles5 or len(set(roles5.values())) != 10:
              raise SystemExit('alpha.70 fifth-circle role separation contract missing')

          '''
          # fixed literal above is indented by YAML/Python source itself; force every top-level alpha70 statement
          # to four spaces in the output program and nested bodies to eight.
          fixed = """    expected5 = {\n        'flame_strike': '4s_locked_vertical_fire_column_with_initial_breach_and_0.5s_pulses',\n        'dominate_person': '30s_person_scale_combat_asset_control',\n    }\n    if index.get('fifth_circle_value_pass_1') != expected5:\n        raise SystemExit(f'alpha.70 fifth-circle value metadata mismatch: {index.get(\"fifth_circle_value_pass_1\")}')\n    roles5 = index.get('fifth_circle_role_audit', {})\n    expected_roles5 = {'cone_of_cold','wall_of_force','cloudkill','telekinesis','flame_strike','hold_monster','mass_cure_wounds','passwall','dominate_person','insect_plague'}\n    if set(roles5) != expected_roles5 or len(set(roles5.values())) != 10:\n        raise SystemExit('alpha.70 fifth-circle role separation contract missing')\n\n"""
          s = s[:start] + fixed + s[end:]
          s = s.replace("raise SystemExit(f'unexpected alpha.69 package version: {version}')",
                        "raise SystemExit(f'unexpected alpha.70 package version: {version}')")
          p.write_text(s, encoding='utf-8')
          compile(s, str(p), 'exec')
          print('alpha70 verifier syntax: PASS')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/arcane-alpha70-verifierfix.yml
          git add projects/arcane-circle
          git diff --check
          git commit -m 'Fix Arcane alpha.70 JAR verifier structure [skip ci]'
          git push origin HEAD:main
