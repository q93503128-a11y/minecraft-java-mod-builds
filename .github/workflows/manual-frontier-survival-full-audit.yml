name: Manual Frontier Survival Full Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-frontier-survival-full-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Static source audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path('projects/frontier-settlement'), Path('projects/survival-ascension')]
          java = []
          for root in roots:
              java += list((root/'src/main/java').rglob('*.java'))
          print(f'JAVA_FILES={len(java)}')
          print(f'JAVA_LINES={sum(len(p.read_text(encoding="utf-8").splitlines()) for p in java)}')

          patterns = {
              'TODO_FIXME': re.compile(r'\b(?:TODO|FIXME|XXX)\b'),
              'BROAD_CATCH': re.compile(r'catch\s*\(\s*(?:Exception|Throwable)\b'),
              'STATIC_ITEMSTACK': re.compile(r'static\s+final\s+ItemStack\b'),
              'CLIENT_IMPORT_OUTSIDE_CLIENT': re.compile(r'^import\s+net\.minecraft\.client\.', re.M),
              'SYSTEM_TIME': re.compile(r'System\.currentTimeMillis\('),
              'CEIL_VALUE_CONSUME': re.compile(r'\(left\s*\+\s*unit\s*-\s*1L\)\s*/\s*unit'),
          }
          for name, pat in patterns.items():
              print(f'\n## {name}')
              found = 0
              for p in java:
                  text = p.read_text(encoding='utf-8')
                  if name == 'CLIENT_IMPORT_OUTSIDE_CLIENT' and '/client/' in p.as_posix():
                      continue
                  for i,line in enumerate(text.splitlines(),1):
                      if pat.search(line):
                          print(f'{p}:{i}:{line.strip()}')
                          found += 1
              print(f'COUNT={found}')

          # Exact duplicate event listener registration is almost always accidental.
          entry = Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/SurvivalAscension.java')
          listeners=[]
          for i,line in enumerate(entry.read_text(encoding='utf-8').splitlines(),1):
              if 'addListener(' in line:
                  target=line.strip()
                  listeners.append((target,i))
          seen={}
          print('\n## DUPLICATE_LISTENERS')
          dup=0
          for target,i in listeners:
              if target in seen:
                  print(f'{entry}:{i}: duplicate of line {seen[target]}: {target}')
                  dup+=1
              else: seen[target]=i
          print(f'COUNT={dup}')

          # Common-side classes must not link client-only Minecraft classes.
          bad=[]
          for p in java:
              if '/client/' in p.as_posix(): continue
              text=p.read_text(encoding='utf-8')
              if 'net.minecraft.client.' in text:
                  bad.append(p)
          print('\n## COMMON_CLIENT_LINKAGE')
          for p in bad: print(p)
          print(f'COUNT={len(bad)}')

          # A few mutation/accounting hotspots for manual inspection.
          print('\n## HOTSPOT_COUNTS')
          keys=['.shrink(', 'setBlock(', 'setBlockAndUpdate(', 'discard()', 'getChunk(', 'forceChunk', 'return null;']
          for key in keys:
              hits=sum(p.read_text(encoding='utf-8').count(key) for p in java)
              print(f'{key}={hits}')
          PY
      - name: Frontier clean build
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build
      - name: Survival clean build
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon clean build
      - name: Repository diff check
        run: git diff --check
