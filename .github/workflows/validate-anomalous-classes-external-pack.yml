name: Validate Anomalous Classes External Modpack

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/anomalous-classes/modpack/**'
      - '.github/workflows/validate-anomalous-classes-external-pack.yml'

permissions:
  contents: read

concurrency:
  group: anomalous-classes-external-pack
  cancel-in-progress: false

jobs:
  resolve-download-and-server-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    defaults:
      run:
        working-directory: projects/anomalous-classes/modpack
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            projects/anomalous-classes/*.gradle*
            projects/anomalous-classes/gradle/**
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify manifests and runtime
        run: |
          java -version
          python --version
          python -m py_compile tools/build_external_pack.py
          python tools/build_external_pack.py --offline-check
      - name: Resolve exact releases and validate upstream JARs
        run: |
          set -euo pipefail
          python tools/build_external_pack.py \
            --download-jars \
            --server-dir "${RUNNER_TEMP}/anomalous-pack-server" \
            --output "${RUNNER_TEMP}/anomalous-pack-out" 2>&1 | tee "${RUNNER_TEMP}/modpack-validation.log"
      - name: Build class JAR for external co-load and registration audit
        working-directory: projects/anomalous-classes
        run: |
          set -euo pipefail
          bash ./gradlew --no-daemon jar
          test -f build/libs/anomalous-classes-0.1.0-alpha.1.jar
          python tools/verify_jar.py build/libs/anomalous-classes-0.1.0-alpha.1.jar
          cp build/libs/anomalous-classes-0.1.0-alpha.1.jar "${RUNNER_TEMP}/anomalous-pack-server/mods/"
          echo "OWN CLASS MOD INSTALLED WITH EXTERNAL PACK"
      - name: Verify NeoForge official installer and install server
        run: |
          set -euo pipefail
          VERSION=21.1.244
          BASE="https://maven.neoforged.net/releases/net/neoforged/neoforge/${VERSION}"
          INSTALLER="neoforge-${VERSION}-installer.jar"
          curl -fL --retry 3 "${BASE}/${INSTALLER}" -o "${RUNNER_TEMP}/${INSTALLER}"
          curl -fL --retry 3 "${BASE}/${INSTALLER}.sha256" -o "${RUNNER_TEMP}/installer.sha256"
          ACTUAL="$(sha256sum "${RUNNER_TEMP}/${INSTALLER}" | awk '{print $1}')"
          EXPECTED="$(head -c 64 "${RUNNER_TEMP}/installer.sha256")"
          test "${ACTUAL}" = "${EXPECTED}"
          cd "${RUNNER_TEMP}/anomalous-pack-server"
          java -jar "${RUNNER_TEMP}/${INSTALLER}" --installServer 2>&1 | tee "${RUNNER_TEMP}/neoforge-install.log"
          test -f run.sh
          # This is an isolated CI world, not an externally hosted server.
          # In Control! requires config/incontrol on first use.
          mkdir -p config/incontrol
          printf 'motd=Anomalous Classes compatibility smoke\n' > server.properties
          printf 'eula=true\n' > eula.txt
      - name: Start and shut down dedicated server
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, time, os, sys
          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "anomalous-pack-server"
          logfile = pathlib.Path(os.environ["RUNNER_TEMP"]) / "neoforge-server-smoke.log"
          success = False
          with logfile.open("w", encoding="utf-8") as f:
              env = dict(os.environ)
              env["JAVA_TOOL_OPTIONS"] = "-Danomalousclasses.auditExternalMobs=true"
              proc = subprocess.Popen(["bash", "run.sh", "nogui"], cwd=work, env=env,
                                      stdin=subprocess.PIPE, stdout=f, stderr=subprocess.STDOUT)
              deadline = time.monotonic() + 250
              while time.monotonic() < deadline:
                  if proc.poll() is not None:
                      break
                  log = logfile.read_text(encoding="utf-8", errors="replace")
                  if (re.search(r"\bDone \([0-9.]+s\)! For help", log)
                          and "ANOMALOUS_HOST_AUDIT_END|" in log):
                      success = True
                      break
                  time.sleep(2)
              if proc.poll() is None:
                  proc.stdin.write(b"stop\n")
                  proc.stdin.flush()
                  try:
                      proc.wait(timeout=45)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait(timeout=20)
          lines = logfile.read_text(encoding="utf-8", errors="replace").splitlines()
          print("\n".join(lines[-140:]))
          for jar in sorted((work / "mods").glob("*.jar")):
              if f'Found mod file "{jar.name}"' not in "\n".join(lines):
                  print(f"FAILED: NeoForge did not discover {jar.name}")
                  success = False
          if "Error writing areas.json!" in "\n".join(lines):
              print("FAILED: In Control! could not write its default rules")
              success = False
          if "Failed to load properties from file: server.properties" in "\n".join(lines):
              print("FAILED: server.properties was not prepared")
              success = False
          areas = work / "config" / "incontrol" / "areas.json"
          if not areas.is_file() or not isinstance(__import__("json").loads(areas.read_text()), list):
              print("FAILED: In Control! default areas.json missing or malformed")
              success = False
          # The audit runs inside the actual 1.21.1 NeoForge registry, not
          # through guesses from jar strings or unrelated online mod wikis.
          import json
          audit = []
          namespaces = {}
          for line in lines:
              if "ANOMALOUS_HOST_AUDIT_ENTITY|" in line:
                  rest = line.split("ANOMALOUS_HOST_AUDIT_ENTITY|", 1)[1]
                  parts = rest.split("|")
                  if len(parts) >= 5:
                      record = {"id": parts[0]}
                      record.update(dict(part.split("=", 1) for part in parts[1:] if "=" in part))
                      audit.append(record)
              if "ANOMALOUS_HOST_AUDIT_NAMESPACE|" in line:
                  rest = line.split("ANOMALOUS_HOST_AUDIT_NAMESPACE|", 1)[1]
                  parts = rest.split("|")
                  namespaces[parts[0]] = dict(part.split("=", 1) for part in parts[1:] if "=" in part)
          report = {
              "source": "live integrated NeoForge 21.1.244 registry after class/external co-load",
              "registered_external_entities": audit,
              "namespaces": namespaces,
              "mod_jar_count": len(list((work / "mods").glob("*.jar"))),
              "server_boot_completed": success,
              "not_verified": ["player-controlled movement", "native boss scripting",
                               "client rendering", "multiplayer behavior"],
          }
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "anomalous-pack-out"
          out.mkdir(parents=True, exist_ok=True)
          (out / "EXTERNAL_ENTITY_REGISTRY_AUDIT.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"REGISTERED EXTERNAL ENTITY TYPES: {len(audit)}")
          for record in audit:
              if record.get("mob") == "true":
                  print(f"AUDIT_MOB|{record['id']}|class={record.get('class')}")
          if not audit or not any(x.get("mob") == "true" for x in audit):
              print("FAILED: integrated external registry audit yielded no Mob entries")
              success = False
          # Every explicit external host must be a real registered Mob AND match
          # its pinned Java class, not just a name-based whitelist.
          declared = [x for x in audit if x.get("declaredHost") == "true"]
          validated = [x for x in declared if x.get("verifiedHost") == "true"]
          print(f"PINNED EXTERNAL HOST AUDIT: {len(validated)}/{len(declared)} verified")
          if len(declared) != 20 or len(validated) != 20:
              print("FAILED: expected exactly 20 audited external host profiles")
              success = False
          boss = next((x for x in audit if x.get("id") == "cataclysm:ignis"), None)
          if boss is None or boss.get("declaredHost") != "false":
              print("FAILED: scripted Cataclysm boss must remain unpossessable")
              success = False
          if len(list((work / "mods").glob("*.jar"))) != 13:
              print("FAILED: expected exact 12 server external jars plus 1 class jar")
              success = False
          print(f"SERVER-REQUIRED MOD DISCOVERY: {len(list((work / 'mods').glob('*.jar')))} checked")
          print(f"IN CONTROL DEFAULT RULES VERIFIED: {areas.is_file()}")
          print(f"DEDICATED SERVER BOOT VERIFIED: {success}")
          if not success:
              sys.exit(1)
          PY
      - name: Export only manifests and logs (no third-party JARs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anomalous-classes-external-pack-validation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/anomalous-pack-out/
            ${{ runner.temp }}/modpack-validation.log
            ${{ runner.temp }}/neoforge-install.log
            ${{ runner.temp }}/neoforge-server-smoke.log
          if-no-files-found: warn
          retention-days: 14
