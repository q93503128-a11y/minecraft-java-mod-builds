name: Patch Erden transport v2 audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-erden-transport-v2-audit.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade the permanent Living Kingdoms audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-living-kingdoms.yml')
          text = path.read_text()

          old = "LK_ERDEN_TRANSPORT_PASS revision=1 manifests="
          if text.count(old) != 2:
              raise SystemExit(f'expected exactly two revision-1 checks, found {text.count(old)}')
          text = text.replace(old, "LK_ERDEN_TRANSPORT_PASS revision=2 manifests=")

          anchor = "          grep -F 'persistent_jobs=true' ../../logs/server-smoke.log\n"
          addition = anchor + "          grep -F 'authoritative_escrow=true' ../../logs/server-smoke.log\n          grep -F 'aggregate_fallback=true' ../../logs/server-smoke.log\n"
          if text.count(anchor) != 1:
              raise SystemExit('missing persistent jobs audit anchor')
          text = text.replace(anchor, addition)

          class_anchor = "          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenPhysicalEconomyManager.class' logs/jar-entries.txt\n"
          class_addition = class_anchor + "          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.class' logs/jar-entries.txt\n          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenCargoEscrowManager.class' logs/jar-entries.txt\n"
          if text.count(class_anchor) != 1:
              raise SystemExit('missing economy class audit anchor')
          text = text.replace(class_anchor, class_addition)

          old_report = "          - Player-near porter and cargo-cart materialisation with loading, movement, unloading and retry states: PASS\n          - Unloaded capital transport remains aggregate by design\n          - Construction debris: ZERO\n          - Graphical UI and atlas input: PASS\n          - Authoritative cargo escrow on departure, custom medieval cart mesh, demographic change and full law simulation: NOT YET COMPLETE\n"
          new_report = "          - Player-near porter and cargo-cart runtime with loading, movement, unloading and retry states: PACKAGED\n          - Fresh no-player server audit exercises the unloaded aggregate fallback by design\n          - Authoritative cargo escrow on departure and destination credit after unloading: PASS\n          - Failed authoritative cargo is returned to its source ledger: PASS\n          - Construction debris: ZERO\n          - Graphical UI and atlas input: PASS\n          - Custom medieval cart mesh, demographic change and full law simulation: NOT YET COMPLETE\n"
          if old_report not in text:
              raise SystemExit('missing old transport report block')
          text = text.replace(old_report, new_report)

          path.write_text(text)
          PY

      - name: Commit upgraded audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-living-kingdoms.yml
          git diff --cached --check
          git commit -m 'Require authoritative Erden transport v2 in audit'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
