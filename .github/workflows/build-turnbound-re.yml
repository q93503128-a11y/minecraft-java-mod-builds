name: Build turnbound-re

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/turnbound-re/**'
      - '.github/workflows/build-turnbound-re.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/turnbound-re

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version
      - name: Clean build and unit tests
        run: ./gradlew --no-daemon clean build --stacktrace
      - name: Verify JAR
        run: |
          JAR=$(ls build/libs/turnbound_re-*.jar | head -n1)
          test -n "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | grep 'META-INF/neoforge.mods.toml'
          unzip -l "$JAR" | grep 'kr/moonseungjun/turnboundre/TurnboundRe.class'
          unzip -l "$JAR" | grep 'assets/turnbound_re/'
          unzip -l "$JAR" | grep 'data/turnbound_re/'
          if unzip -l "$JAR" | grep -q '\.java$'; then exit 1; fi
          sha256sum "$JAR" | tee build/turnbound-re.sha256
      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: turnbound-re-0.1.0-alpha.1-deliverables
          path: |
            projects/turnbound-re/build/libs/turnbound_re-*.jar
            projects/turnbound-re/build/turnbound-re.sha256
          retention-days: 14
