name: Build Arcane Circle alpha.13

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arcane-alpha13.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcane-alpha13-download
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply alpha.13 reduction layering fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          props = Path('projects/arcane-circle/gradle.properties')
          text = props.read_text(encoding='utf-8')
          old = 'mod_version=0.12.1-alpha.12'
          new = 'mod_version=0.12.1-alpha.13'
          if old not in text:
              raise SystemExit('gradle version marker missing')
          props.write_text(text.replace(old, new, 1), encoding='utf-8')

          source = Path('projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/magic/MagicPlayerData.java')
          text = source.read_text(encoding='utf-8')
          old = '''        double circleMana = Math.max(0.10, Math.pow(0.72, masteryGap));
        double circleCooldown = Math.max(0.10, Math.pow(0.62, masteryGap));
        double circleRange = 1.0 + masteryGap * 0.07;
        double circlePower = 1.0 + masteryGap * 0.04;
        double masteryMana = Math.max(0.80, 1.0 - proficiency * 0.02);
        double masteryCooldown = Math.max(0.70, 1.0 - proficiency * 0.03);
        double masteryRange = 1.0 + proficiency * 0.02;
        double masteryPower = 1.0 + proficiency * 0.04;

        // Cost and cooldown reductions may never go below 10% of the spell's base value.
        double totalCostMultiplier = Math.max(0.10, circleMana * masteryMana
                * staff.manaCostMultiplier() * gear.manaCostMultiplier() * facultyMana);
        int manaCost = spell.manaCost() <= 0 ? 0
                : Math.max(1, (int) Math.ceil(spell.manaCost() * totalCostMultiplier));
        double totalCooldownMultiplier = Math.max(0.10, circleCooldown * masteryCooldown
                * staff.cooldownMultiplier() * gear.cooldownMultiplier() * facultyCooldown);
        double rawCooldown = spell.cooldownTicks() * totalCooldownMultiplier;
        // Values below 0.1 seconds are treated as absent; otherwise preserve a 2-tick minimum.
        int cooldown = spell.cooldownTicks() <= 0 || rawCooldown < 2.0
                ? 0 : Math.max(2, (int) Math.round(rawCooldown));'''
          new = '''        // Circle gap and spell mastery are progression layers. They are intentionally
        // applied after the equipment floor so old low-circle spells can eventually become trivial.
        double circleMana = Math.pow(0.72, masteryGap);
        double circleCooldown = Math.pow(0.62, masteryGap);
        double circleRange = 1.0 + masteryGap * 0.07;
        double circlePower = 1.0 + masteryGap * 0.04;
        double masteryMana = Math.max(0.80, 1.0 - proficiency * 0.02);
        double masteryCooldown = Math.max(0.70, 1.0 - proficiency * 0.03);
        double masteryRange = 1.0 + proficiency * 0.02;
        double masteryPower = 1.0 + proficiency * 0.04;

        // Only staff + wearable gear reduction is floored at 10% of the base value.
        // Circle, mastery and tradition reductions are additional progression layers.
        double equipmentCostMultiplier = Math.max(0.10,
                staff.manaCostMultiplier() * gear.manaCostMultiplier());
        double progressionCostMultiplier = circleMana * masteryMana * facultyMana;
        double totalCostMultiplier = equipmentCostMultiplier * progressionCostMultiplier;
        int manaCost = spell.manaCost() <= 0 ? 0
                : Math.max(1, (int) Math.ceil(spell.manaCost() * totalCostMultiplier));

        double equipmentCooldownMultiplier = Math.max(0.10,
                staff.cooldownMultiplier() * gear.cooldownMultiplier());
        double progressionCooldownMultiplier = circleCooldown * masteryCooldown * facultyCooldown;
        double rawCooldown = spell.cooldownTicks()
                * equipmentCooldownMultiplier * progressionCooldownMultiplier;
        // Values below 0.1 seconds are treated as absent; otherwise preserve a 2-tick minimum.
        int cooldown = spell.cooldownTicks() <= 0 || rawCooldown < 2.0
                ? 0 : Math.max(2, (int) Math.round(rawCooldown));'''
          if old not in text:
              raise SystemExit('MagicPlayerData reduction block marker missing')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('projects/arcane-circle/tools/test_v0121_alpha13_reduction_layers.py')
          test.write_text('''from pathlib import Path
import math

root = Path(__file__).resolve().parents[1]
source = (root / "src/main/java/kr/moonseungjun/arcanecircle/magic/MagicPlayerData.java").read_text(encoding="utf-8")
casting = (root / "src/main/java/kr/moonseungjun/arcanecircle/magic/SpellCastingService.java").read_text(encoding="utf-8")

required = [
    "double equipmentCostMultiplier = Math.max(0.10,",
    "double progressionCostMultiplier = circleMana * masteryMana * facultyMana;",
    "double equipmentCooldownMultiplier = Math.max(0.10,",
    "double progressionCooldownMultiplier = circleCooldown * masteryCooldown * facultyCooldown;",
    "rawCooldown < 2.0",
    "return raw < 2.0 ? 0",
]
for marker in required:
    if marker not in source and marker not in casting:
        raise SystemExit(f"missing marker: {marker}")

for forbidden in [
    "Math.max(0.10, circleMana * masteryMana",
    "Math.max(0.10, circleCooldown * masteryCooldown",
    "double circleMana = Math.max(0.10",
    "double circleCooldown = Math.max(0.10",
]:
    if forbidden in source:
        raise SystemExit(f"obsolete total/progression floor remains: {forbidden}")

# A deliberately extreme gear stack is capped at 10%, then progression may reduce below it.
equipment = max(0.10, 0.22 * 0.30)
progression = math.pow(0.62, 7) * 0.70 * 0.90
combined = equipment * progression
assert equipment == 0.10
assert combined < 0.10

# A 1-circle ten-tick base cast at a seven-circle gap must be instant (< 0.1 s).
raw_cast = 10 * math.pow(0.78, 7) * 0.72
assert raw_cast < 2.0

# A low-circle cooldown can pass below the 0.1-second threshold after progression.
raw_cooldown = 40 * combined
assert raw_cooldown < 2.0
print("Arcane Circle alpha.13 reduction layering audit: PASS")
''', encoding='utf-8')
          PY

      - name: Run alpha.13 audits
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/arcane-circle/tools/test_v0121_alpha12_runtime.py
          python3 projects/arcane-circle/tools/test_v0121_alpha13_reduction_layers.py

      - name: Build with Java 25
        shell: bash
        working-directory: projects/arcane-circle
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'arcanecircle-0.12.1-alpha.13.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" >/dev/null
          sha256sum "$jar_file" > "$jar_file.sha256"

      - name: Upload alpha.13 JAR
        uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.12.1-alpha.13
          path: |
            projects/arcane-circle/build/libs/arcanecircle-0.12.1-alpha.13.jar
            projects/arcane-circle/build/libs/arcanecircle-0.12.1-alpha.13.jar.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified alpha.13 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/arcane-circle
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix Arcane equipment and progression reduction layers [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Record run status
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arcane-alpha13-status
          cat > /tmp/arcane-alpha13-status/status.txt <<STATUS
          status=$RESULT
          run_id=$GITHUB_RUN_ID
          source_sha=$GITHUB_SHA
          artifact=arcanecircle-0.12.1-alpha.13
          STATUS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ci-results/arcane-circle-alpha13
            cp /tmp/arcane-alpha13-status/status.txt ci-results/arcane-circle-alpha13/status.txt
            git add ci-results/arcane-circle-alpha13/status.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane Circle alpha.13 run $GITHUB_RUN_ID [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
