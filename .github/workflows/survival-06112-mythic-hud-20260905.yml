name: Survival 0.61.12 Mythic HUD 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/survival-06112-mythic-hud-20260905.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply HUD patch
        run: python3 tools/apply_survival_06112_mythic_hud_tmp.py
      - name: Verify current source
        run: |
          cd projects/survival-ascension
          python3 tools/test_current_source.py
      - name: Java 25 clean build
        run: |
          cd projects/survival-ascension
          chmod +x gradlew
          ./gradlew --no-daemon clean build
      - name: Verify runtime JAR
        run: |
          cd projects/survival-ascension
          python3 tools/verify_jar.py build/libs/survivalascension-0.61.12-alpha.1.jar
      - name: Commit canonical source and remove temporary files
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm -f .github/workflows/survival-06112-mythic-hud-20260905.yml tools/apply_survival_06112_mythic_hud_tmp.py
          git add projects/survival-ascension
          git commit -m 'Fix Survival Mythic tracker boss-bar overlap'
      - name: Rebase and reverify current main
        run: |
          git fetch origin main
          git rebase origin/main
          cd projects/survival-ascension
          python3 tools/test_current_source.py
          ./gradlew --no-daemon build
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp projects/survival-ascension/build/libs/survivalascension-0.61.12-alpha.1.jar dist/
      - uses: actions/upload-artifact@v4
        with:
          name: survivalascension-0.61.12-alpha.1-tested
          path: dist/*.jar
          if-no-files-found: error
      - name: Push main
        run: git push origin HEAD:main
