name: Manual Audit Radial Caption Width

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/manual-audit-radial-caption-width.yml'
      - 'projects/survival-ascension/tools/patch_radial_caption_width.py'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply caption width fix
        run: python3 projects/survival-ascension/tools/patch_radial_caption_width.py

      - name: Build Survival Ascension
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Commit validated caption fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/client/InfrastructureRadialMenuScreen.java
          git add projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/client/ProductionRadialMenuScreen.java
          if git diff --cached --quiet; then
            echo 'No caption source changes to commit.'
            exit 0
          fi
          git commit -m 'Bound radial captions to screen width'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
