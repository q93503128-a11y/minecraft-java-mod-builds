name: Frontier Full Audit Snapshot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-full-audit-snapshot.yml'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inventory Frontier source
        shell: bash
        run: |
          set -euo pipefail
          cd projects/frontier-settlement
          find . -type f -print | sort > "$GITHUB_WORKSPACE/frontier-file-inventory.txt"
          find src/main/java -type f -name '*.java' -print | sort > "$GITHUB_WORKSPACE/frontier-java-inventory.txt"
          echo "files=$(wc -l < "$GITHUB_WORKSPACE/frontier-file-inventory.txt")"
          echo "java=$(wc -l < "$GITHUB_WORKSPACE/frontier-java-inventory.txt")"
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-full-audit-source
          path: |
            projects/frontier-settlement/
            frontier-file-inventory.txt
            frontier-java-inventory.txt
          if-no-files-found: error
          retention-days: 1
      - name: Record snapshot run id
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p ci-results/frontier-full-audit-snapshot
          printf 'run_id=%s\nsource_sha=%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > ci-results/frontier-full-audit-snapshot/run_id.txt
          git add ci-results/frontier-full-audit-snapshot/run_id.txt
          git commit -m "Record Frontier full-audit snapshot run $GITHUB_RUN_ID [skip ci]"
          git push origin HEAD:main
