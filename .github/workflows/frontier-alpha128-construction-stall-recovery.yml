name: Frontier Alpha.128 Construction Stall Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha128-construction-stall-recovery.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha128-stall-recovery
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/patches/frontier-alpha128.py
          rm -f .github/patches/frontier-alpha128.py
          rm -f .github/workflows/frontier-alpha128-construction-stall-recovery.yml
      - name: Audit and compile
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache compileJava --stacktrace --console=plain
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/frontier-settlement .github/patches/frontier-alpha128.py .github/workflows/frontier-alpha128-construction-stall-recovery.yml
          git diff --cached --check
          git commit -m 'frontier: fix zero-percent construction stalls in alpha.128'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git rebase origin/main
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
