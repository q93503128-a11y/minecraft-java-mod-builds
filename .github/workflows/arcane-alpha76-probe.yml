name: Arcane alpha76 probe

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  probe:
    if: github.event.issue.title == 'arcane-alpha76-probe'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Record probe
        shell: bash
        run: |
          set -euo pipefail
          printf 'run_id=%s\n' "$GITHUB_RUN_ID" > .github/arcane-alpha76-probe-result.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/arcane-alpha76-probe-result.txt
          git commit -m 'Record Arcane alpha.76 probe [skip ci]'
          pushed=0
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
