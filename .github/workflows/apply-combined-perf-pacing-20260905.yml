name: Combined Frontier SA Pacing Performance 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-combined-perf-pacing-20260905.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply performance and pacing patch
        run: python3 tools/apply_combined_perf_pacing_tmp.py
      - name: Frontier source and resource checks
        run: |
          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('src/main/resources').rglob('*.json'))
          for p in files: json.loads(p.read_text(encoding='utf-8'))
          print('FRONTIER JSON PASS', len(files))
          PY
      - name: Survival Ascension source and resource checks
        run: |
          cd projects/survival-ascension
          python3 tools/test_current_source.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('src/main/resources').rglob('*.json'))
          for p in files: json.loads(p.read_text(encoding='utf-8'))
          print('SURVIVAL JSON PASS', len(files))
          PY
      - name: Java 25 clean builds
        run: |
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew --no-daemon clean build
          cd ../survival-ascension
          chmod +x gradlew
          ./gradlew --no-daemon clean build
      - name: Verify both JARs
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          specs=[
            ('projects/frontier-settlement/build/libs','0.1.0-alpha.105','SettlementWorkerService.class'),
            ('projects/survival-ascension/build/libs','0.61.10-alpha.1','SkillTuning.class'),
          ]
          for folder, version, required in specs:
            jars=[p for p in pathlib.Path(folder).glob('*.jar') if 'sources' not in p.name and 'javadoc' not in p.name]
            assert len(jars)==1, (folder,jars)
            jar=jars[0]
            assert version in jar.name, jar
            with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              assert len(names)==len(set(names))
              assert any(n.endswith(required) for n in names), (jar, required)
            print('JAR PASS', jar)
          PY
      - name: Commit canonical source and remove temporary files
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm -f .github/workflows/apply-combined-perf-pacing-20260905.yml tools/apply_combined_perf_pacing_tmp.py
          git add projects/frontier-settlement projects/survival-ascension
          git commit -m 'Optimize Frontier runtime and rebalance Survival mastery pacing'
      - name: Rebase and reverify current main
        run: |
          git fetch origin main
          git rebase origin/main
          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          ./gradlew --no-daemon build
          cd ../survival-ascension
          python3 tools/test_current_source.py
          ./gradlew --no-daemon build
      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.105.jar dist/
          cp projects/survival-ascension/build/libs/survivalascension-0.61.10-alpha.1.jar dist/
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-sa-performance-pacing-20260905
          path: dist/*.jar
          if-no-files-found: error
      - name: Push main
        run: git push origin HEAD:main
