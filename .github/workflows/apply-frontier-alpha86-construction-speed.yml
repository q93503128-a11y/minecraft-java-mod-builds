name: Apply Frontier Alpha86 Construction Speed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha86-construction-speed.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha86-construction-speed
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Apply Alpha.86 pacing corrections
        run: python3 .github/scripts/apply_frontier_alpha86.py

      - name: Audit Alpha.86 source and docs
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          python3 tools/test_alpha86_source.py
          python3 tools/test_alpha86_docs.py
          git diff --check

      - name: Java 25 clean build
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.86.jar

      - name: Commit verified Alpha.86 atomically
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-frontier-alpha86-construction-speed.yml
          rm -f .github/scripts/apply_frontier_alpha86.py
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix Frontier alpha.86 construction micro-resupply pacing'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
