name: Survival Ascension 0.54 one-shot apply

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[SA054 APPLY INTERNAL]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply and validate 0.54 mace impact ascension
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import json

          ROOT = Path('projects/survival-ascension')
          def p(rel): return ROOT / rel
          def read(rel): return p(rel).read_text(encoding='utf-8')
          def write(rel, text): p(rel).write_text(text, encoding='utf-8')
          def rep(rel, old, new, count=1):
              text = read(rel)
              if text.count(old) < count:
                  raise SystemExit(f'{rel}: missing replacement marker: {old[:140]!r}')
              write(rel, text.replace(old, new, count))
          def repall(rel, old, new):
              text = read(rel)
              if old not in text:
                  raise SystemExit(f'{rel}: missing global replacement marker: {old[:140]!r}')
              write(rel, text.replace(old, new))
          def before(rel, marker, block):
              text=read(rel)
              if marker not in text: raise SystemExit(f'{rel}: missing before marker: {marker[:140]!r}')
              write(rel, text.replace(marker, block+marker, 1))
          def after(rel, marker, block):
              text=read(rel)
              if marker not in text: raise SystemExit(f'{rel}: missing after marker: {marker[:140]!r}')
              write(rel, text.replace(marker, marker+block, 1))

          # Guard against applying over a different Survival release.
          props = read('gradle.properties')
          if 'mod_version=0.53.0-alpha.1' not in props:
              raise SystemExit('Survival source is no longer 0.53.0-alpha.1; refusing stale 0.54 applicator')
          rep('gradle.properties','mod_version=0.53.0-alpha.1','mod_version=0.54.0-alpha.1')
          lock_rel='modpack/content-lock.json'
          lock=json.loads(read(lock_rel))
          if lock.get('version')!='0.53.0-alpha.1-content-preview.1':
              raise SystemExit(f'content lock drifted: {lock.get("version")!r}')
          lock['version']='0.54.0-alpha.1-content-preview.1'
          write(lock_rel,json.dumps(lock,ensure_ascii=False,indent=2)+'\n')

          # Runtime identity.
          rel='src/main/java/kr/moonseungjun/survivalascension/SurvivalAscension.java'
          rep(rel,'VERSION = "0.53.0-alpha.1"','VERSION = "0.54.0-alpha.1"')
          rep(rel,'// 0.53: successful standard-shield blocks gain bounded Combat guard waves; Shift keeps precision blocking.','// 0.54: real mace-smash hits replace generic cleave with bounded hostile-only outer impact rings.')
          rep(rel,'scaled mastery + shield guard waves + ranged projectile snapshots/impact bursts','scaled mastery + mace outer impact rings + shield guard waves + ranged projectile snapshots/impact bursts')

          # Mace affix category. Deliberately do NOT add Category.MACE to GEAR_CATEGORIES: elite loot must not generate Maces.
          rel='src/main/java/kr/moonseungjun/survivalascension/equipment/AscensionAffixes.java'
          rep(rel,'Content-pack bridge: any single-stack sword/bow/crossbow/pickaxe/axe/shovel/hoe/shield or humanoid armor item that','Content-pack bridge: any single-stack sword/mace/bow/crossbow/pickaxe/axe/shovel/hoe/shield or humanoid armor item that')
          rep(rel,'case HOE -> "괭이";\n            case SHIELD -> "방패";','case HOE -> "괭이";\n            case MACE -> "메이스";\n            case SHIELD -> "방패";')
          rep(rel,'category == Category.WEAPON || category == Category.RANGED || category == Category.SHIELD || category == Category.ARMOR','category == Category.WEAPON || category == Category.RANGED || category == Category.MACE || category == Category.SHIELD || category == Category.ARMOR')
          mace_helpers='''    public static boolean isMace(ItemStack stack) {
        return categoryForItem(stack) == Category.MACE;
    }

    public static double maceImpactRadiusBonus(ItemStack stack) {
        if (category(stack) != Category.MACE || !has(stack, SCALE)) return 0.0D;
        return switch (rarity(stack)) { case 1 -> 0.5D; case 2 -> 1.0D; case 3 -> 1.5D; default -> 0.0D; };
    }

    public static int maceImpactTargetBonus(ItemStack stack) {
        if (category(stack) != Category.MACE || !has(stack, SECONDARY)) return 0;
        return switch (rarity(stack)) { case 1 -> 2; case 2 -> 4; case 3 -> 6; default -> 0; };
    }

    public static double maceImpactKnockbackBonus(ItemStack stack) {
        if (category(stack) != Category.MACE || !has(stack, PRIMARY)) return 0.0D;
        return switch (rarity(stack)) { case 1 -> 0.10D; case 2 -> 0.20D; case 3 -> 0.30D; default -> 0.0D; };
    }

    public static double maceImpactLiftBonus(ItemStack stack) {
        if (category(stack) != Category.MACE || !has(stack, UTILITY)) return 0.0D;
        return switch (rarity(stack)) { case 1 -> 0.04D; case 2 -> 0.08D; case 3 -> 0.12D; default -> 0.0D; };
    }

'''
          before(rel,'    public static boolean isShield(ItemStack stack) {',mace_helpers)
          rep(rel,'if (stack.is(ItemTags.HOES)) return Category.HOE;\n        if (stack.is(Tags.Items.TOOLS_SHIELD)) return Category.SHIELD;','if (stack.is(ItemTags.HOES)) return Category.HOE;\n        if (stack.is(Tags.Items.TOOLS_MACE)) return Category.MACE;\n        if (stack.is(Tags.Items.TOOLS_SHIELD)) return Category.SHIELD;')
          rep(rel,'case HOE -> switch (rarity) { case 1 -> Items.IRON_HOE; case 2 -> Items.DIAMOND_HOE; default -> Items.NETHERITE_HOE; };\n            case SHIELD -> Items.SHIELD;','case HOE -> switch (rarity) { case 1 -> Items.IRON_HOE; case 2 -> Items.DIAMOND_HOE; default -> Items.NETHERITE_HOE; };\n            case MACE -> Items.MACE;\n            case SHIELD -> Items.SHIELD;')
          rep(rel,'category == Category.RANGED ? "강궁" : category == Category.SHIELD ? "압력"','category == Category.RANGED ? "강궁" : category == Category.MACE ? "충각" : category == Category.SHIELD ? "압력"')
          rep(rel,'case HOE -> "광역"; case SHIELD -> "파동";','case HOE -> "광역"; case MACE -> "진동"; case SHIELD -> "파동";')
          rep(rel,'case HOE -> "풍작"; case SHIELD -> "진압";','case HOE -> "풍작"; case MACE -> "분쇄"; case SHIELD -> "진압";')
          rep(rel,'case WEAPON -> "충격"; case RANGED -> "충격"; case PICKAXE, AXE, SHOVEL, HOE -> "정교"; case SHIELD -> "반동";','case WEAPON -> "충격"; case RANGED -> "충격"; case PICKAXE, AXE, SHOVEL, HOE -> "정교"; case MACE -> "격퇴"; case SHIELD -> "반동";')
          rep(rel,'WEAPON("weapon"), RANGED("ranged"), PICKAXE("pickaxe"), AXE("axe"), SHOVEL("shovel"), HOE("hoe"), SHIELD("shield"), ARMOR("armor"), NONE("none");','WEAPON("weapon"), RANGED("ranged"), PICKAXE("pickaxe"), AXE("axe"), SHOVEL("shovel"), HOE("hoe"), MACE("mace"), SHIELD("shield"), ARMOR("armor"), NONE("none");')

          # Mace smash: actual damage-type gate, replace generic cleave/shockwave with hostile-only OUTER ring.
          rel='src/main/java/kr/moonseungjun/survivalascension/combat/CombatProgression.java'
          rep(rel,'import net.minecraft.server.level.ServerPlayer;\nimport net.minecraft.world.entity.Entity;','import net.minecraft.server.level.ServerPlayer;\nimport net.minecraft.tags.DamageTypeTags;\nimport net.minecraft.world.entity.Entity;')
          rep(rel,'import net.minecraft.world.entity.LivingEntity;\nimport net.minecraft.world.entity.player.Player;','import net.minecraft.world.entity.LivingEntity;\nimport net.minecraft.world.entity.ai.attributes.Attributes;\nimport net.minecraft.world.entity.player.Player;')
          rep(rel,'private static final String SHIELD_WAVE_READY_KEY = "survivalascension_shield_wave_ready";','private static final String SHIELD_WAVE_READY_KEY = "survivalascension_shield_wave_ready";\n    private static final double VANILLA_MACE_KNOCKBACK_RADIUS_SQR = 12.25D;')
          rep(rel,'        if (direct != player) return;\n\n        if (tryShockwave(player, serverLevel, primary, event, scaledDamage, level)) return;','        if (direct != player) return;\n\n        if (event.getSource().is(DamageTypeTags.IS_MACE_SMASH) && AscensionAffixes.isMace(weapon)) {\n            tryMaceImpact(player, serverLevel, primary, weapon, level);\n            return;\n        }\n\n        if (tryShockwave(player, serverLevel, primary, event, scaledDamage, level)) return;')
          mace_runtime='''    private static void tryMaceImpact(ServerPlayer player, ServerLevel level, LivingEntity primary,
                                      ItemStack mace, int combatLevel) {
        if (combatLevel < 30 || player.isShiftKeyDown()) return;
        boolean fieldMastery = combatLevel >= 100 && ExpeditionProgression.hasFieldMastery(player);
        double radius = fieldMastery ? 9.0D : combatLevel >= 100 ? 7.5D : combatLevel >= 90 ? 6.5D : combatLevel >= 60 ? 5.5D : 4.5D;
        int targetLimit = fieldMastery ? 20 : combatLevel >= 100 ? 14 : combatLevel >= 90 ? 10 : combatLevel >= 60 ? 6 : 3;
        double knockback = fieldMastery ? 1.00D : combatLevel >= 100 ? 0.85D : combatLevel >= 90 ? 0.70D : combatLevel >= 60 ? 0.55D : 0.45D;
        double lift = fieldMastery ? 0.16D : combatLevel >= 100 ? 0.14D : combatLevel >= 90 ? 0.12D : combatLevel >= 60 ? 0.10D : 0.08D;
        radius = Math.min(10.5D, radius + AscensionAffixes.maceImpactRadiusBonus(mace));
        targetLimit = Math.min(26, targetLimit + AscensionAffixes.maceImpactTargetBonus(mace));
        knockback = Math.min(1.30D, knockback + AscensionAffixes.maceImpactKnockbackBonus(mace));
        lift = Math.min(0.28D, lift + AscensionAffixes.maceImpactLiftBonus(mace));
        final double outerRadius = radius;

        List<LivingEntity> nearby = level.getEntitiesOfClass(
                LivingEntity.class,
                primary.getBoundingBox().inflate(outerRadius),
                candidate -> candidate != primary && candidate != player && candidate.isAlive()
                        && ContentPackCompatibility.isCombatTarget(candidate) && !player.isAlliedTo(candidate)
                        && primary.distanceToSqr(candidate) > VANILLA_MACE_KNOCKBACK_RADIUS_SQR
                        && primary.distanceToSqr(candidate) <= outerRadius * outerRadius);
        nearby.sort(Comparator.comparingDouble(primary::distanceToSqr));

        int pushed = 0;
        for (LivingEntity candidate : nearby) {
            if (pushed >= targetLimit) break;
            Vec3 push = candidate.position().subtract(primary.position()).multiply(1.0D, 0.0D, 1.0D);
            if (push.lengthSqr() <= 1.0E-5D) continue;
            double resistance = Math.max(0.0D, Math.min(1.0D, candidate.getAttributeValue(Attributes.KNOCKBACK_RESISTANCE)));
            double strength = knockback * (1.0D - resistance);
            if (strength <= 0.0D) continue;
            push = push.normalize();
            candidate.setDeltaMovement(candidate.getDeltaMovement().add(push.x * strength, lift * (1.0D - resistance), push.z * strength));
            candidate.hurtMarked = true;
            pushed++;
        }
    }

'''
          before(rel,'    private static void tryRangedBurst(',mace_runtime)

          # Player-facing imprint strings.
          for rel in ['src/main/java/kr/moonseungjun/survivalascension/equipment/EquipmentReforgeService.java','src/main/java/kr/moonseungjun/survivalascension/client/EquipmentRadialMenuScreen.java']:
              repall(rel,'검/활/쇠뇌/곡괭이/도끼/삽/괭이/방어구/방패','검/메이스/활/쇠뇌/곡괭이/도끼/삽/괭이/방어구/방패')

          rel='src/main/java/kr/moonseungjun/survivalascension/client/GuideScreen.java'
          repall(rel,'검/활/쇠뇌/곡괭이/도끼/삽/괭이/방패','검/메이스/활/쇠뇌/곡괭이/도끼/삽/괭이/방패')
          repall(rel,'검/활/쇠뇌/곡괭이/도끼/삽/괭이/방어구/방패','검/메이스/활/쇠뇌/곡괭이/도끼/삽/괭이/방어구/방패')
          mace_guide='                h("메이스 충격권"), p("표준 메이스의 실제 스매시 공격은 전투 Lv30부터 바닐라 3.5블록 충격 바깥으로 승천 충격권이 확장됩니다. Lv30=4.5블록/3체, Lv60=5.5/6, Lv90=6.5/10, Lv100=7.5/14, 현장 숙련=9블록/20체입니다. 추가 충격권은 피해나 숙련 XP 없이 적·보스만 밀어내고 넉백 저항을 존중합니다. Shift 스매시는 추가 승천 충격권만 끄며 바닐라 메이스 스매시는 그대로 유지됩니다."),\n'
          after(rel,'                h("방패 방어 파동"), p("표준 방패로 실제 차단에 성공하면 전투 Lv30부터 주변 적을 피해 없이 밀어내는 방어 파동이 발생합니다. Lv30=2.5블록/2체, Lv60=3.5/4, Lv90=4.5/6, Lv100=5.5/8, 현장 숙련=6.5블록/10체입니다. Shift 차단은 파동 없는 정밀 방어이며, 방패 affix 압력·파동·대응·진압·반동은 밀침·반경·재사용·대상·수직 반동만 제한적으로 확장합니다."),\n',mace_guide)
          mace_control='                h("메이스 스매시"), p("메이스 스매시에서 Shift를 누르면 Survival Ascension의 추가 외곽 충격권만 끕니다. 바닐라 3.5블록 스매시 넉백과 직접 타격은 바뀌지 않습니다."),\n'
          after(rel,'                h("방패 정밀/파동"), p("표준 방패로 실제 차단에 성공하면 전투 Lv30부터 주변 적을 밀어냅니다. Shift를 누른 채 막으면 광역 파동을 끄고 바닐라 차단만 유지합니다. 방패 파동 자체는 피해나 전투 숙련 XP를 주지 않습니다."),\n',mace_control)

          # Release docs.
          rel='README.md'
          readme_section='''## 0.54.0-alpha.1 — Mace Impact Ascension / 메이스 충격권 승천
Standard NeoForge `c:tools/mace` equipment can now enter Ascension Imprint, reforge, Mythic awakening and salvage without a Java dependency on the source mod. Maces are deliberately NOT added to the generated elite base-loot pool, so Survival Ascension does not bypass Trial Chamber or external-mod acquisition.

A real `minecraft:mace_smash` hit replaces the generic Survival melee cleave/shockwave branch with Mace-specific physical scaling. Vanilla owns its normal 3.5-block smash knockback unchanged. Survival Ascension only extends an outer hostile-only ring beyond 3.5 blocks: Combat Lv30 4.5/3, Lv60 5.5/6, Lv90 6.5/10, Lv100 7.5/14, and Lv100 + Field Mastery 9.0 blocks/20 targets. The outer ring deals zero damage and grants zero Combat mastery XP; it respects target knockback resistance and never expands into allies/passive mobs. Shift suppresses only the Ascension outer ring, leaving the vanilla mace smash intact.

Mace affixes are `충각` horizontal push, `진동` radius, `숙련` Combat XP on real kills, `분쇄` outer-ring target count and `격퇴` vertical lift. Runtime caps are radius10.5, targets26, horizontal push1.30 and lift0.28. No new SavedData, packet/protocol, custom mace/entity, force-load or background simulation is introduced.

'''
          before(rel,'## 0.53.0-alpha.1 — Shield Ascension / 방패 승천\n',readme_section)

          rel='PROJECT.md'
          rep(rel,'- Mod version: `0.53.0-alpha.1`','- Mod version: `0.54.0-alpha.1`')
          project_section='''## 0.54 Mace Impact Ascension / 메이스 충격권 승천
- `c:tools/mace` is a standard-tag imprint category. Existing/external maces keep their original ItemStack/components and may use reforge/Mythic awakening/salvage.
- Mace is intentionally absent from `GEAR_CATEGORIES`, so elite random base loot cannot generate a Mace and bypass its normal acquisition path.
- Runtime specialization is gated by the actual `DamageTypeTags.IS_MACE_SMASH` damage type, not guessed fall distance.
- The vanilla Mace's 3.5-block knockback remains untouched. Survival only adds a hostile-only outer ring beyond 3.5 blocks: Lv30 4.5/3, Lv60 5.5/6, Lv90 6.5/10, Lv100 7.5/14, Field Mastery 9.0/20 radius/targets.
- The outer ring deals no damage and awards no Combat XP. It respects knockback resistance, excludes the primary target/player/allies, and replaces generic Survival cleave/shockwave handling for that smash hit.
- Shift suppresses only the Ascension outer ring; vanilla direct smash and vanilla 3.5-block knockback remain authoritative.
- Mace affixes: `충각` push, `진동` radius, `숙련` kill XP, `분쇄` target count, `격퇴` vertical lift. Caps: radius10.5, targets26, horizontal push1.30, lift0.28.
- No new SavedData ID, packet/protocol, custom item/entity, force-load or passive simulation.

'''
          before(rel,'## 0.53 Shield Ascension / 방패 승천\n',project_section)
          rep(rel,'0.53 adds standard shield-tag imprint plus successful-block guard waves','0.54 adds standard mace-tag imprint plus real-smash outer impact rings; 0.53 adds standard shield-tag imprint plus successful-block guard waves')

          rel='CHANGELOG.md'
          changelog='''## 0.54.0-alpha.1
- Added `Mace Impact Ascension / 메이스 충격권 승천` using NeoForge common `c:tools/mace` for imprint/reforge/Mythic-awakening/salvage compatibility.
- Deliberately kept Mace out of generated elite base loot so normal Trial Chamber/external acquisition is not bypassed.
- Real `DamageTypeTags.IS_MACE_SMASH` hits now replace generic Survival cleave/shockwave handling with a hostile-only outer impact ring beyond vanilla's unchanged 3.5-block Mace knockback.
- Outer-ring mastery scale: Lv30 4.5/3, Lv60 5.5/6, Lv90 6.5/10, Lv100 7.5/14, Field Mastery 9.0/20 radius/targets.
- Outer impact deals zero damage/zero Combat XP, respects knockback resistance and excludes allies/passive mobs. Shift disables only the Ascension outer ring.
- Added Mace affixes `충각`/`진동`/`숙련`/`분쇄`/`격퇴`; capped radius10.5, targets26, horizontal push1.30 and lift0.28.
- Kept network protocol8 and added no SavedData, packet, custom mace/entity, force-load or background simulation.
- Bumped content-preview lock to `0.54.0-alpha.1-content-preview.1` without changing the six audited external mod versions.

'''
          after(rel,'# Changelog\n\n',changelog)

          rel='MODPACK_COMPAT_MATRIX.md'
          mace_matrix='- 메이스 장비: NeoForge 공용 `c:tools/mace` 태그를 쓰는 장비는 승천 각인에 합류한다. 실제 `mace_smash` 때만 바닐라 3.5블록 바깥의 적·보스에 추가 외곽 충격권을 만들며 외부 메이스 구현 클래스를 직접 참조하지 않는다. 엘리트 기본드롭에서는 메이스를 생성하지 않는다.\n'
          after(rel,'- 방패 장비: NeoForge 공용 `c:tools/shield` 태그를 쓰는 장비는 승천 각인에 합류한다. 실제 차단 성공 시에만 전투 숙련 기반 방어 파동을 만들며 외부 방패 구현 클래스를 직접 참조하지 않는다. 파동은 피해/숙련 XP 없이 주변 실제 적을 밀어내기만 한다.\n',mace_matrix)
          rep(rel,'표준 방패 성공차단 방어 파동 + BOP 원정 바이옴 브리지','표준 방패 성공차단 방어 파동 + 표준 메이스 실제스매시 외곽 충격권 + BOP 원정 바이옴 브리지')

          # Release source audit: preserve all previous checks and add 0.54.
          rel='tools/test_release_source.py'
          rep(rel,'REQUIRED_VERSION = "0.53.0-alpha.1"','REQUIRED_VERSION = "0.54.0-alpha.1"')
          repall(rel,'VERSION = \\"0.53.0-alpha.1\\"','VERSION = \\"0.54.0-alpha.1\\"')
          rep(rel,'"Mod version: `0.53.0-alpha.1`",','"Mod version: `0.54.0-alpha.1`",')
          repall(rel,'검/활/쇠뇌/곡괭이/도끼/삽/괭이/방어구/방패','검/메이스/활/쇠뇌/곡괭이/도끼/삽/괭이/방어구/방패')
          rep(rel,'baseline = baseline.replace("표준 검/곡괭이/도끼/삽/괭이 태그 장비", "표준 검/메이스/활/쇠뇌/곡괭이/도끼/삽/괭이/방어구/방패 태그 장비")','baseline = baseline.replace("표준 검/곡괭이/도끼/삽/괭이 태그 장비", "표준 검/메이스/활/쇠뇌/곡괭이/도끼/삽/괭이/방어구/방패 태그 장비")') if False else None
          mace_audit='''# 0.54 mace impact ascension: actual mace-smash only; vanilla inner radius preserved, zero-damage outer ring.
need(affix, [
    "Tags.Items.TOOLS_MACE", "Category.MACE", 'MACE("mace")', "Items.MACE", "isMace(ItemStack stack)",
    "maceImpactRadiusBonus", "maceImpactTargetBonus", "maceImpactKnockbackBonus", "maceImpactLiftBonus",
    'case MACE -> "메이스"', 'category == Category.MACE ? "충각"', 'case MACE -> "진동"', 'case MACE -> "분쇄"', 'case MACE -> "격퇴"'
], "0.54 mace affix progression")
