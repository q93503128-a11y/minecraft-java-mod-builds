name: Temporary Arcane Circle alpha38 impact overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-arcane-alpha38.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair migration preconditions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/tmp_arcane_alpha38.py')
          s=p.read_text(encoding='utf-8')
          meteor='    \'meteor_shard\': \'        put("meteor_shard", SigilStyle.SKY_RITUAL, MotionStyle.SKY_DROP, 7.20, 5, 4, 0, 16, 1.72, 8);\',\n'
          if meteor in s:
              s=s.replace(meteor,'',1)
          old="body = read(presentation)\nif 'put(\"arcane_annihilation\"' not in body:\n"
          if old not in s:
              raise SystemExit('presentation insertion marker missing')
          new='''body = read(presentation)\nif 'put("meteor_shard"' not in body:\n    anchor = '        put("world_sunder", SigilStyle.QUAD_ARRAY, MotionStyle.FIELD, 18.00, 6, 12, 0, 0, 2.85, 5);\\n'\n    if anchor not in body:\n        raise SystemExit('meteor_shard profile insertion anchor missing')\n    body = body.replace(anchor,\n        '        put("meteor_shard", SigilStyle.SKY_RITUAL, MotionStyle.SKY_DROP, 7.20, 5, 4, 0, 16, 1.72, 8);\\n' + anchor, 1)\n    write(presentation, body)\n    body = read(presentation)\nif 'put("arcane_annihilation"' not in body:\n'''
          s=s.replace(old,new,1)
          s=s.replace("assert 'DestructiveMagicService.annihilationCorridor(player, start, end, power)' in casting_service",
                      "assert 'DestructiveMagicService.annihilationCorridor(player, start, end, power)' in text(magic/'SpellCastingService.java')")
          p.write_text(s,encoding='utf-8')
          PY
      - name: Apply alpha38 catastrophic impact overhaul
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/tmp_arcane_alpha38.py
          git rm .github/workflows/tmp-arcane-alpha38.yml
          git rm .github/scripts/tmp_arcane_alpha38.py
          git diff --check
      - name: Commit to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(arcane-circle): deepen catastrophic destruction and impact choreography'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
