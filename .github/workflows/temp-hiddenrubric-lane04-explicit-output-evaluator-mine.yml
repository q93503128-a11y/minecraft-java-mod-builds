name: TEMP HiddenRubric Lane04 Explicit Output Evaluator Mine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-explicit-output-evaluator-mine.yml'
permissions:
  contents: write
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Mine explicit output evaluator relations
        shell: bash
        run: |
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          REPO='lmarena-ai/arena-human-preference-140k'
          REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]
          actor=r'(?:my\s+)?(?:manager|supervisor|team lead|lead|teacher|professor|instructor|reviewer|reviewers|judge|judges|panel|committee|board|executive(?:s| board| committee)?|senior management|management|director|client|customer|stakeholder(?:s)?|investor(?:s)?|admissions? officers?|hiring manager|HR manager|human resources manager|employer|engineer|auditor(?:s)?)'
          rel=r'(?:review|approval|approve|approved|feedback|evaluate|evaluation|assess|assessment|grade|grading|judge|judging|score|decision|sign[- ]?off)'
          obj=r'(?:report|presentation|proposal|pitch|application|essay|paper|thesis|document|plan|brief|memo|letter|resume|cv|submission|work|deliverable|deck|slide(?:s)?|outline|case|analysis|project)'
          patterns=[
            ('output_to_actor_for_relation',re.compile(rf'(?P<object>{obj}).{{0,80}}?(?:submit(?:ted|ting)?|send|sent|present(?:ed|ing)?|deliver(?:ed|ing)?|provide(?:d)?).{{0,40}}?to\s+(?P<actor>{actor}).{{0,50}}?(?:for\s+)?(?P<relation>{rel})',re.I|re.S)),
            ('submit_output_to_actor',re.compile(rf'(?:submit(?:ted|ting)?|send|sent|present(?:ed|ing)?|deliver(?:ed|ing)?)\s+(?:this|it|the|my|our)?\s*(?P<object>{obj})?.{{0,35}}?to\s+(?P<actor>{actor})',re.I|re.S)),
            ('output_for_actor_relation',re.compile(rf'(?P<object>{obj}).{{0,80}}?(?:for|to)\s+(?P<actor>{actor})\s+(?:to\s+)?(?P<relation>{rel})',re.I|re.S)),
            ('actor_will_relation_output',re.compile(rf'(?P<actor>{actor}).{{0,35}}?(?:will|would|must|should|can|may|is going to|are going to|to)\s+(?P<relation>{rel}).{{0,70}}?(?P<object>{obj})',re.I|re.S)),
            ('output_relation_by_actor',re.compile(rf'(?P<object>{obj}).{{0,60}}?(?P<relation>reviewed|approved|evaluated|assessed|graded|judged|scored)\s+by\s+(?P<actor>{actor})',re.I|re.S)),
            ('for_actor_relation',re.compile(rf'(?:for|before)\s+(?P<actor>{actor})\s+(?P<relation>{rel})',re.I|re.S)),
          ]
          pref=re.compile(r'\b(?:prefer|preference|tone|style|formal|informal|concise|professional|friendly|sound like|don.?t make it sound|format|word limit)\b',re.I)
          state=re.compile(r'\b(?:remember|forget|from now on|always|never again|update your memory|previous instruction)\b',re.I)
          cross=re.compile(r'\b(?:combine|integrate|across domains?|interdisciplinary|multi[- ]disciplin)\b',re.I)
          privacy=re.compile(r'(?:\b\d{3}-\d{2}-\d{4}\b|\b(?:password|ssn|social security)\b)',re.I)
          def text(msg):
            if not isinstance(msg,dict): return ''
            if isinstance(msg.get('text'),str): return msg['text']
            c=msg.get('content')
            if isinstance(c,str): return c
            if isinstance(c,list): return '\n'.join(x if isinstance(x,str) else x.get('text','') if isinstance(x,dict) else '' for x in c)
            return ''
          def turns(r):
            out=[]
            for e in r.get('full_conversation') or []:
              if not isinstance(e,dict): continue
              u=e.get('user')
              if isinstance(u,dict):
                t=text(u).strip()
                if t: out.append(t)
              elif str(e.get('role') or '')=='user':
                t=text(e).strip()
                if t: out.append(t)
            return out
          candidates=[]; raw=0; seen=set()
          for shard in SHARDS:
            p=hf_hub_download(REPO,filename=shard,repo_type='dataset',revision=REV)
            pf=pq.ParquetFile(p); cols=['id','evaluation_session_id','evaluation_order','language','is_code','full_conversation']; use=[c for c in cols if c in set(pf.schema_arrow.names)]
            for b in pf.iter_batches(batch_size=512,columns=use):
              for r in b.to_pylist():
                raw+=1
                if r.get('language')!='en' or bool(r.get('is_code')): continue
                for ti,s in enumerate(turns(r)):
                  if not 35<=len(s)<=5000 or privacy.search(s): continue
                  norm=' '.join(s.lower().split()); nh=hashlib.sha256(norm.encode()).hexdigest()
                  for rank,(name,pat) in enumerate(patterns):
                    m=pat.search(s)
                    if not m: continue
                    key=(str(r.get('id') or ''),ti)
                    if key in seen: break
                    seen.add(key)
                    st=max(0,m.start()-220); en=min(len(s),m.end()+300)
                    gd={k:(v.strip() if isinstance(v,str) else v) for k,v in m.groupdict().items() if v}
                    candidates.append({
                      'sourceRowId':key[0],'sourceEvaluationSessionId':str(r.get('evaluation_session_id') or ''),'evaluationOrder':int(r.get('evaluation_order') or 0),'turnIndex':ti,
                      'sourceLength':len(s),'pattern':name,'patternRank':rank,'groups':gd,'match':m.group(0),'context':s[st:en],
                      'higherLaneRisk':{'preference':bool(pref.search(s)),'stateOps':bool(state.search(s)),'crossDomain':bool(cross.search(s))},
                      'sourceText':s,'assistantOutputsIncluded':False
                    })
                    break
          assert raw==135634, raw
          candidates.sort(key=lambda x:(x['patternRank'],sum(x['higherLaneRisk'].values()),x['sourceLength'],x['sourceRowId'],x['turnIndex']))
          d=Path('temp-hiddenrubric/lane04/explicit-output-evaluator'); d.mkdir(parents=True,exist_ok=True)
          full=candidates[:500]
          (d/'candidates.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in full),encoding='utf-8')
          compact=[]
          for x in full:
            y={k:x[k] for k in ('sourceRowId','sourceEvaluationSessionId','turnIndex','sourceLength','pattern','patternRank','groups','match','context','higherLaneRisk')}
            compact.append(y)
          (d/'compact.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in compact),encoding='utf-8')
          manifest={'rawRows':raw,'candidateRows':len(candidates),'materializedRows':len(full),'assistantOutputsIncluded':False,'sourceRevision':REV}
          (d/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest))
          PY
      - name: Commit explicit evaluator queue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/explicit-output-evaluator/
          git commit -m 'chore: materialize temporary Lane04 explicit evaluator queue'
          git push origin HEAD:main
