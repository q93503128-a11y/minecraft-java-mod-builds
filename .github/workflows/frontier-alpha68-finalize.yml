name: Finalize Frontier Alpha68

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha68-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Alpha.68 lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/frontier-alpha68-patch.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerService.java')
          s = p.read_text(encoding='utf-8')
          old = '''    private static boolean workerBoundsFullyLoaded(ServerLevel level, SettlementData data, AABB bounds) {
              int minChunkX = Math.floorDiv((int) Math.floor(bounds.minX), 16);
              int maxChunkX = Math.floorDiv((int) Math.floor(Math.nextDown(bounds.maxX)), 16);
              int minChunkZ = Math.floorDiv((int) Math.floor(bounds.minZ), 16);
              int maxChunkZ = Math.floorDiv((int) Math.floor(Math.nextDown(bounds.maxZ)), 16);
          '''
          new = '''    private static boolean workerBoundsFullyLoaded(ServerLevel level, SettlementData data, AABB bounds) {
              int minX = (int) Math.floor(bounds.minX);
              int maxX = (int) Math.floor(Math.nextDown(bounds.maxX));
              int minZ = (int) Math.floor(bounds.minZ);
              int maxZ = (int) Math.floor(Math.nextDown(bounds.maxZ));
              int minChunkX = Math.floorDiv(minX, 16);
              int maxChunkX = Math.floorDiv(maxX, 16);
              int minChunkZ = Math.floorDiv(minZ, 16);
              int maxChunkZ = Math.floorDiv(maxZ, 16);
          '''
          if old not in s:
              raise SystemExit('Alpha.68 workerBoundsFullyLoaded compatibility anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          cd projects/frontier-settlement
          python3 tools/test_alpha68_source.py
          python3 tools/test_alpha68_docs.py
          cd ../..
          rm .github/frontier-alpha68-patch.py
          rm .github/workflows/frontier-alpha68-finalize.yml
          git diff --check

      - name: Commit Frontier Alpha.68 only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement \
                  .github/workflows/build-frontier-settlement.yml \
                  .github/frontier-alpha68-patch.py \
                  .github/workflows/frontier-alpha68-finalize.yml
          git diff --cached --check
          git commit -m 'Harden Frontier civilian rest lifecycle for alpha.68'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
