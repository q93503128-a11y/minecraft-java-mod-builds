name: Frontier Alpha.130 Builder Routing Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha130-builder-routing.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha130-builder-routing
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Alpha.130 builder routing patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/frontier_alpha130_builder_routing_patch.py
          python3 .github/frontier_alpha130_builder_routing_assertion_fix.py
      - name: Targeted source/docs audit and compile
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache compileJava --stacktrace --console=plain
          git diff --check
      - name: Commit Alpha.130
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement
          git commit -m 'frontier: fix construction-worker routing in alpha.130'
          git push origin HEAD:main
