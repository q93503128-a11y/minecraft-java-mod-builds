name: Build Frontier Survival Full New World Pack

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-survival-full-new-world.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontier-survival-full-new-world
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build Frontier Alpha.91 and Survival 0.61 compatibility JARs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/client/SurvivalAscensionClient.java')
          s=p.read_text(encoding='utf-8')
          old='"key.survivalascension.menu", InputConstants.KEY_M, KeyMapping.Category.MISC);'
          new='"key.survivalascension.menu", InputConstants.KEY_K, KeyMapping.Category.MISC);'
          if s.count(old) != 1:
              raise SystemExit('unexpected Survival menu key source')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          (cd projects/survival-ascension && chmod +x gradlew && ./gradlew --no-daemon --no-configuration-cache clean build --console=plain)
          (cd projects/frontier-settlement && chmod +x gradlew && ./gradlew --no-daemon --no-configuration-cache clean build --console=plain)
          python3 projects/survival-ascension/tools/verify_jar.py projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          python3 projects/frontier-settlement/tools/verify_jar.py projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.91.jar

      - name: Build Survival content-pack manifest from canonical lock
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/survival-ascension/tools/build_mrpack.py \
            --survival-jar projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar \
            --output "$GITHUB_WORKSPACE/survival-content.mrpack"

      - name: Build all-features combined MRPack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path

          root=Path.cwd()
          frontier_root=root/'projects/frontier-settlement'
          survival_pack=root/'survival-content.mrpack'
          frontier_jar=frontier_root/'build/libs/frontier_settlement-0.1.0-alpha.91.jar'
          survival_jar=root/'projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar'
          resolved=json.loads((frontier_root/'companion-testpack/resolved-lock.client.json').read_text(encoding='utf-8'))
          with zipfile.ZipFile(survival_pack) as z:
              survival_index=json.loads(z.read('modrinth.index.json'))

          files=[]
          by_name={}
          for f in resolved['files']:
              entry={
                  'path':'mods/'+f['filename'],
                  'hashes':{'sha1':f['sha1'],'sha512':f['sha512']},
                  'env':{
                      'client':'required',
                      'server':'unsupported' if f['id']=='xaeros_minimap' else 'required'
                  },
                  'downloads':[f['url']],
                  'fileSize':0,
              }
              files.append(entry)
              by_name[f['filename']]=entry

          for entry in survival_index['files']:
              name=Path(entry['path']).name
              existing=by_name.get(name)
              if existing:
                  if existing['hashes'].get('sha1') != entry['hashes'].get('sha1') or existing['hashes'].get('sha512') != entry['hashes'].get('sha512'):
                      raise SystemExit(f'duplicate filename hash mismatch: {name}')
                  continue
              files.append(entry)
              by_name[name]=entry

          index={
              'formatVersion':1,
              'game':'minecraft',
              'versionId':'frontier-alpha91-survival-0.61-full-new-world.1',
              'name':'Frontier Settlement + Survival Ascension FULL',
              'summary':'New-world all-features pack: Frontier settlement stack + full Survival Ascension content pack.',
              'files':files,
              'dependencies':{'minecraft':'26.2','neoforge':'26.2.0.38-beta'},
          }
          readme='''Frontier Settlement + Survival Ascension FULL — NEW WORLD\n\nMinecraft 26.2 / NeoForge 26.2.0.38-beta / Java 25\n\nThis pack intentionally combines the complete current Frontier companion client stack with the current Survival Ascension content pack. It includes both Terralith and Biomes O' Plenty/TerraBlender, plus Dungeons & Taverns, Repurposed Structures, The Birth of Steve, Amethyst Resonance, Better Combat, Weapons Expanded, Lootr, Sophisticated Backpacks, Variants & Ventures, Jade, Xaero's Minimap and their pinned libraries.\n\nCREATE A NEW WORLD with this pack. Do not use this FULL profile to reopen the older Frontier-only world.\n\nControls: Frontier settlement menu = M. Survival Ascension menu = K.\n\nThird-party binaries are referenced from their official distribution URLs and are not embedded in this archive. Only the two project-owned mod JARs are embedded.\n'''
          out=root/'Frontier_Settlement_Alpha91_SurvivalAscension_FULL_NEW_WORLD.mrpack'
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              z.writestr('modrinth.index.json',json.dumps(index,ensure_ascii=False,indent=2)+'\n')
              z.write(frontier_jar,'overrides/mods/'+frontier_jar.name)
              z.write(survival_jar,'overrides/mods/'+survival_jar.name)
              z.writestr('overrides/FULL_NEW_WORLD_README.txt',readme)
          with zipfile.ZipFile(out) as z:
              parsed=json.loads(z.read('modrinth.index.json'))
              assert len(parsed['files']) == len({Path(x['path']).name for x in parsed['files']})
              assert any('dungeons-and-taverns' in x['path'] for x in parsed['files'])
              assert any('BiomesOPlenty' in x['path'] for x in parsed['files'])
              assert any('Terralith' in x['path'] for x in parsed['files'])
          for p in (out, frontier_jar, survival_jar):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              print(p.name, h)
          (root/'FULL_NEW_WORLD_SHA256.txt').write_text(
              '\n'.join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}" for p in (out,frontier_jar,survival_jar))+'\n',encoding='utf-8')
          print('combined_external_files=',len(files))
          PY

      - name: Download complete server stack and verify hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, urllib.request, zipfile
          from pathlib import Path

          root=Path.cwd()
          game=root/'projects/frontier-settlement/run/server'
          mods=game/'mods'
          mods.mkdir(parents=True,exist_ok=True)
          for p in mods.glob('*.jar'):
              p.unlink()
          server=json.loads((root/'projects/frontier-settlement/companion-testpack/resolved-lock.server.json').read_text(encoding='utf-8'))

          def get(url, out, sha256=None, sha1=None, sha512=None):
              if out.exists():
                  data=out.read_bytes()
              else:
                  req=urllib.request.Request(url,headers={'User-Agent':'Frontier-Survival-Full-Smoke/1.0'})
                  with urllib.request.urlopen(req,timeout=90) as r:
                      data=r.read()
                  out.write_bytes(data)
              if sha256 and hashlib.sha256(data).hexdigest()!=sha256: raise SystemExit('sha256 mismatch '+out.name)
              if sha1 and hashlib.sha1(data).hexdigest()!=sha1: raise SystemExit('sha1 mismatch '+out.name)
              if sha512 and hashlib.sha512(data).hexdigest()!=sha512: raise SystemExit('sha512 mismatch '+out.name)

          present=set()
          for f in server['files']:
              out=mods/f['filename']
              get(f['url'],out,sha256=f['sha256'])
              present.add(f['filename'])

          with zipfile.ZipFile(root/'survival-content.mrpack') as z:
              idx=json.loads(z.read('modrinth.index.json'))
          for f in idx['files']:
              if f.get('env',{}).get('server')=='unsupported':
                  continue
              name=Path(f['path']).name
              if name in present:
                  continue
              out=mods/name
              get(f['downloads'][0],out,sha1=f['hashes'].get('sha1'),sha512=f['hashes'].get('sha512'))
              present.add(name)

          survival=root/'projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar'
          (mods/survival.name).write_bytes(survival.read_bytes())
          print('server_mod_jars=',len(list(mods.glob('*.jar'))))
          print('\n'.join(sorted(p.name for p in mods.glob('*.jar'))))
          PY

      - name: Fresh-world dedicated server smoke with every server-side feature
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/projects/frontier-settlement"
          GAME="$ROOT/run/server"
          rm -rf "$GAME/world" "$GAME/world_full_new"
          mkdir -p "$GAME"
          printf 'eula=true\n' > "$GAME/eula.txt"
          cat > "$GAME/server.properties" <<'EOF'
          level-name=world_full_new
          online-mode=false
          view-distance=8
          simulation-distance=6
          spawn-protection=0
          max-tick-time=120000
          EOF
          cat > "$GITHUB_WORKSPACE/run_full_server.py" <<'PY'
          import pathlib, subprocess, sys, time
          root=pathlib.Path(sys.argv[1]); log=pathlib.Path(sys.argv[2])
          p=subprocess.Popen(['./gradlew','--no-daemon','--no-configuration-cache','runServer','--console=plain'],cwd=root,stdin=subprocess.PIPE,stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,bufsize=1)
          ready=False; deadline=time.time()+210
          with log.open('w',encoding='utf-8') as fh:
              while time.time()<deadline:
                  line=p.stdout.readline()
                  if line:
                      fh.write(line); fh.flush()
                      if 'Done (' in line and 'For help' in line:
                          ready=True
                          p.stdin.write('stop\n'); p.stdin.flush(); break
                  elif p.poll() is not None:
                      break
              try:
                  tail,_=p.communicate(timeout=45)
              except subprocess.TimeoutExpired:
                  p.terminate()
                  try: tail,_=p.communicate(timeout=10)
                  except subprocess.TimeoutExpired:
                      p.kill(); tail,_=p.communicate()
              if tail: fh.write(tail)
          text=log.read_text(encoding='utf-8',errors='replace')
          fatal=('NoClassDefFoundError','ClassNotFoundException','Exception in server tick loop','Failed to start the minecraft server','Mod loading error has occurred','Errors in currently selected datapacks prevented the world from loading','Registry loading errors')
          if not ready:
              print(text); raise SystemExit('full stack server never reached ready state')
          if any(x.lower() in text.lower() for x in fatal):
              print(text); raise SystemExit('fatal full stack server error detected')
          required_tokens=('Survival Ascension','Biomes O’ Plenty','Biomes O\' Plenty','Terralith','The Birth of Steve','Dungeons and Taverns')
          if 'survivalascension' not in text.lower():
              print(text); raise SystemExit('Survival Ascension was not discovered by full-stack smoke')
          if 'biomesoplenty' not in text.lower():
              print(text); raise SystemExit('Biomes O Plenty was not discovered by full-stack smoke')
          if 'terralith' not in text.lower():
              print(text); raise SystemExit('Terralith was not discovered by full-stack smoke')
          if 'tbos' not in text.lower() and 'birth of steve' not in text.lower():
              print(text); raise SystemExit('The Birth of Steve was not discovered by full-stack smoke')
          print(text)
          PY
          python3 "$GITHUB_WORKSPACE/run_full_server.py" "$ROOT" "$GITHUB_WORKSPACE/frontier-survival-full-new-world-smoke.log"
          test -f "$GAME/world_full_new/level.dat"

      - name: Upload full new-world pack
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-alpha91-survival-061-full-new-world
          path: |
            Frontier_Settlement_Alpha91_SurvivalAscension_FULL_NEW_WORLD.mrpack
            FULL_NEW_WORLD_SHA256.txt
            projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.91.jar
            projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
            frontier-survival-full-new-world-smoke.log
          if-no-files-found: warn
