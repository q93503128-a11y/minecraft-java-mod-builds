name: TEMP HiddenRubric Lane04 Provenance Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-recover.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Recover pinned Lane04 rows
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download

          REPO='lmarena-ai/arena-human-preference-140k'
          REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'
          TARGETS={
            'ac3bba5f-a55e-49ef-a83a-e54892c849bb':0,
            '8c02f215-e1db-48e2-8de8-543ed61bb5b7':0,
            'baacddce-6b47-468a-a812-fa3c77590116':7,
            '8b1cfa16-9c5d-477a-a321-79a214d7aaae':0,
            '9e88b8ad-fa51-4276-9571-53ddde8e86f5':1,
            'e2848d8e-ee40-44b0-b83c-ce0b1f239a88':0,
            '6a1c9bf5-d756-45fe-8a30-db80bac937ed':0,
          }
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]

          def content_text(msg):
              if not isinstance(msg, dict): return ''
              direct=msg.get('text')
              if isinstance(direct,str): return direct
              content=msg.get('content')
              if isinstance(content,str): return content
              if isinstance(content,list):
                  out=[]
                  for item in content:
                      if isinstance(item,str): out.append(item)
                      elif isinstance(item,dict) and isinstance(item.get('text'),str): out.append(item['text'])
                  return '\n'.join(x for x in out if x)
              return ''

          def user_turns(row):
              turns=[]
              for entry in row.get('full_conversation') or []:
                  if not isinstance(entry,dict): continue
                  user=entry.get('user')
                  if isinstance(user,dict):
                      text=content_text(user).strip()
                      if text: turns.append(text)
                  elif str(entry.get('role') or '')=='user':
                      text=content_text(entry).strip()
                      if text: turns.append(text)
              return turns

          found={}
          raw_rows=0
          for shard in SHARDS:
              path=hf_hub_download(REPO,filename=shard,repo_type='dataset',revision=REV)
              pf=pq.ParquetFile(path)
              cols=['id','evaluation_session_id','evaluation_order','language','is_code','timestamp','full_conversation']
              use=[c for c in cols if c in set(pf.schema_arrow.names)]
              for batch in pf.iter_batches(batch_size=512,columns=use):
                  for row in batch.to_pylist():
                      raw_rows+=1
                      rid=str(row.get('id') or '')
                      if rid not in TARGETS: continue
                      turns=user_turns(row)
                      target_turn=TARGETS[rid]
                      found[rid]={
                          'sourceDataset':REPO,
                          'sourceRevision':REV,
                          'sourceRowId':rid,
                          'sourceEvaluationSessionId':str(row.get('evaluation_session_id') or ''),
                          'evaluationOrder':int(row.get('evaluation_order') or 0),
                          'language':row.get('language'),
                          'isCode':bool(row.get('is_code')),
                          'turnCount':len(turns),
                          'targetTurnIndex':target_turn,
                          'targetUserTurn':turns[target_turn] if 0 <= target_turn < len(turns) else None,
                          'userTurns':turns,
                          'assistantOutputsIncluded':False,
                      }
          if raw_rows != 135634:
              raise SystemExit(f'raw row drift {raw_rows}')
          missing=sorted(set(TARGETS)-set(found))
          if missing:
              raise SystemExit(f'missing target rows: {missing}')
          outdir=Path('temp-hiddenrubric/lane04')
          outdir.mkdir(parents=True,exist_ok=True)
          out=outdir/'lane04-known-uuid-recovery.jsonl'
          with out.open('w',encoding='utf-8') as f:
              for rid in TARGETS:
                  f.write(json.dumps(found[rid],ensure_ascii=False)+'\n')
          manifest={'sourceDataset':REPO,'sourceRevision':REV,'rawRows':raw_rows,'targetRows':len(TARGETS),'recoveredRows':len(found),'assistantOutputsIncluded':False}
          (outdir/'lane04-known-uuid-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False))
          PY
      - name: Commit temporary recovery text
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/
          git commit -m 'chore: materialize temporary Lane04 recovery text'
          git push origin HEAD:main
