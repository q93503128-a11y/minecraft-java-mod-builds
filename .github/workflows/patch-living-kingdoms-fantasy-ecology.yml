name: Patch Living Kingdoms fantasy ecology

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/wire_living_kingdoms_fantasy_ecology.py'
      - '.github/scripts/harden_living_kingdoms_fantasy_ecology_ci.py'
      - '.github/workflows/patch-living-kingdoms-fantasy-ecology.yml'

concurrency:
  group: living-kingdoms-fantasy-ecology-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Wire fantasy ecology runtime
        run: python .github/scripts/wire_living_kingdoms_fantasy_ecology.py
      - name: Harden ecology CI ticket lifecycle
        run: python .github/scripts/harden_living_kingdoms_fantasy_ecology_ci.py
      - name: Clean compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Verify ecology invariants
        shell: bash
        run: |
          set -euo pipefail
          registry='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/entity/FantasyEntityTypes.java'
          ecology='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenFantasyEcologyManager.java'
          client='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/client/LivingKingdomsClient.java'
          main='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java'
          grep -Fq 'DeferredRegister.createEntities' "$registry"
          grep -Fq 'silver_hart' "$registry"
          grep -Fq 'ash_hound' "$registry"
          grep -Fq 'river_wisp' "$registry"
          grep -Fq 'EntityAttributeCreationEvent' "$registry"
          grep -Fq 'LK_ERDEN_FANTASY_ECOLOGY_PASS' "$ecology"
          grep -Fq 'CI_TICKET_REFRESH_INTERVAL = 100' "$ecology"
          grep -Fq 'LK_ERDEN_FANTASY_ECOLOGY_TICKET_REFRESH' "$ecology"
          grep -Fq 'timeout_safe_refresh=true' "$ecology"
          grep -Fq 'player_loaded_runtime=true' "$ecology"
          grep -Fq 'forced_citywide=false' "$ecology"
          grep -Fq 'FantasyEntityTypes.register(modEventBus)' "$main"
          grep -Fq 'ErdenFantasyEcologyManager.onServerTick(event)' "$main"
          grep -Fq 'FantasyEntityRenderers::register' "$client"
      - name: Commit compiled wiring directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/client/LivingKingdomsClient.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenFantasyEcologyManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'test(living-kingdoms): refresh fantasy ecology CI tickets'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
