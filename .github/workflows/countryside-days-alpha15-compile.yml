name: Materialize and compile Countryside Days alpha.15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/countryside-days-alpha15-compile.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: projects/countryside-days

jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize verified alpha.15 payload
        id: materialize
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, zipfile
          root=Path('.').resolve(); project=root/'projects/countryside-days'; tools=project/'tools'
          specs=[
            ('alpha15v2_00.part',8000,'05764a738c93db7933e60f6db85fea2d6cf168297536e79146ef28dc1eb96349'),
            ('alpha15v2_01.part',8000,'f62307daf23ace1c04c1c4b09fdf75e3ba2a24018c550a90558753f00fc6f8b6'),
            ('alpha15v2_02.part',8000,'647cf040b1669045f8e57f2a0eb67968e81c1753621095be6d3f4be046e00beb'),
            ('alpha15v2_03_04.part',16000,'141cb7fce3cb22de0518288fd507284a5b5b6f94252a6d9784a69f50032bf44d'),
            ('alpha15v2_05_06.part',16000,'ba4d245f3e29c0710e903a25c7fc2ada8cd306675bf373b8e001c22d88f931e9'),
            ('alpha15v2_07_08.part',16000,'17528aa349b2a47a0192ddf71506d270487439261742b3212e8b3407e6846c3d'),
            ('alpha15v2_09_10.part',16000,'a975b3c098d730d4077d8729118537ebd9c7f96aebd4455c8cb1f8dc1ed270c2'),
            ('alpha15v2_11_12.part',16000,'e341d7db6b6a277721f5aae8d5384a94d68e5778ad0399c302ebaf2a097c3dba'),
            ('alpha15v2_13_14.part',16000,'a1dd5c64d5d0524d691a228af3d07c35195a1ec76046947d647d9f080b256f05'),
            ('alpha15v2_15_16.part',16000,'0b84bdbbb7d5a93b360911a75c608961515cea999960e8027746ef296619418f'),
            ('alpha15v2_17_18.part',9648,'870c0a5b8faed07c9597402175e58b7659ed41ead761cb3a82f45f9bab6477d6')]
          chunks=[]
          for name,size,sha in specs:
            text=''.join((tools/name).read_text('ascii').split())
            assert len(text)==size,(name,len(text),size)
            assert hashlib.sha256(text.encode()).hexdigest()==sha,name
            chunks.append(text)
          encoded=''.join(chunks)
          assert len(encoded)==145648
          assert hashlib.sha256(encoded.encode()).hexdigest()=='2215f32a4fda34d490241a811051e9164eb39a4f31831894e9ce3df3361ec4ca'
          raw=base64.b64decode(encoded,validate=True)
          assert len(raw)==109234
          assert hashlib.sha256(raw).hexdigest()=='5499bb9fe956c9bf11a6f311105e03bcc694bc2adeed74080431cd882d80b835'
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            assert z.testzip() is None
            for name in z.namelist():
              p=Path(name)
              assert name.startswith('projects/countryside-days/') and '..' not in p.parts and not p.is_absolute(),name
            z.extractall(root)
          assert 'mod_version=0.1.0-alpha.15' in (project/'gradle.properties').read_text('utf-8')
          print('verified alpha.15 payload materialized')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Prepare Gradle
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 9.2.1 --distribution-type bin
            chmod +x gradlew
          fi
          ./gradlew --version

      - name: Validate implemented contracts
        id: contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('src/main/java/kr/countrysidedays'); read=lambda p:(root/p).read_text('utf-8')
          layout=read('world/PlayerEstateLayout.java'); estate=read('world/StarterHomesteadGenerator.java')
          village=read('world/PublicVillageExpansionBuilder.java'); npc=read('gameplay/RuralNpcManager.java')
          ranch=read('gameplay/RanchLifeManager.java'); table=read('gameplay/RestaurantTableManager.java')
          seat=read('gameplay/CountrysideSeatManager.java'); prop=read('world/CountrysidePropertyManager.java')
          gameplay=read('gameplay/RuralGameplayHandler.java'); data=read('world/CountrysideWorldData.java')
          checks={
            'expanded estate':all(x in layout for x in ('MIN_X = -38','MAX_X = 38','MIN_Z = -32','MAX_Z = 40')),
            'eight seats':'RESTAURANT_SEAT_COUNT = 8' in layout,
            'barn removed':'storageRoom' in estate and 'clearFormerBarn' in estate and 'barn(level' not in estate,
            'authored map':'MAP_REVISION = 15' in village,
            'random real guests':all(x in npc for x in ('ACTIVE_GUEST_TAG','maybeInviteResident','nextInt(6)')),
            'fixed customers removed':all(x not in npc for x in ('CUSTOMER_NAMES','ensureSharedCustomers','DAILY_CUSTOMER_CAP')),
            'animal self care':all(x in ranch for x in ('breedFedAnimals','MAX_ANIMALS_PER_SPECIES','hasWater')),
            'table food':all(x in table for x in ('TABLE_DISPLAY_TAG','setItemSlot','display.discard')),
            'seat use':all(x in seat for x in ('SEAT_TAG','startRiding','isSeatOccupied')),
            'farmland protected':'FarmlandTrampleEvent' in prop,
            'starter funds':'STARTER_COINS = 20' in gameplay,
            'unlimited service':'withGuestService' in data and 'DAILY_CUSTOMER_CAP' not in data,
            'debris cleanup':'clearConstructionDebris' in estate and 'clearConstructionDebris' in village,
          }
          failed=[k for k,v in checks.items() if not v]
          if failed: raise SystemExit('contract failure: '+', '.join(failed))
          lang=Path('src/main/resources/assets/countrysidedays/lang')
          ko=json.loads((lang/'ko_kr.json').read_text('utf-8')); en=json.loads((lang/'en_us.json').read_text('utf-8'))
          assert set(ko)==set(en) and len(ko)>=100
          print(f'validated {len(checks)} contracts and {len(ko)} localization keys')
          PY

      - name: Clean Java 25 compile
        id: build
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ci-logs/clean-build.log

      - name: Upload compile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-alpha.15-compile-${{ github.run_id }}
          path: projects/countryside-days/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload preliminary JAR
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.15-preliminary
          path: projects/countryside-days/build/libs/countrysidedays-0.1.0-alpha.15.jar
          if-no-files-found: error
          retention-days: 14

      - name: Publish materialized source and compile result
        if: always()
        working-directory: .
        env:
          MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}
          CONTRACT_OUTCOME: ${{ steps.contracts.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [ "$MATERIALIZE_OUTCOME" = success ]; then
            rm -f projects/countryside-days/tools/alpha15v2_*.part
            rm -f projects/countryside-days/tools/alpha15_source_00.part
            rm -f projects/countryside-days/tools/alpha14_*.part projects/countryside-days/tools/alpha14_*.b64
            rm -f .github/workflows/countryside-days-alpha14-recovery.yml
            rm -f .github/workflows/countryside-days-alpha14-recovery2.yml
            rm -f .github/workflows/countryside-days-alpha15.yml
            rm -f .github/workflows/countryside-days-alpha15-compile.yml
          fi
          cat > projects/countryside-days/BUILD_AND_RUNTIME_REPORT.md <<REPORT
          # Countryside Days Build and Runtime Report

          - Workflow run: ${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - Mod version: 0.1.0-alpha.15
          - Payload materialization: ${MATERIALIZE_OUTCOME}
          - Alpha.15 contract validation: ${CONTRACT_OUTCOME}
          - Clean Java 25 build: ${BUILD_OUTCOME}
          - Full runtime audit: pending
          REPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/countryside-days .github/workflows
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize Countryside Days alpha.15 (${BUILD_OUTCOME})"
          git pull --rebase origin main
          git push origin HEAD:main
