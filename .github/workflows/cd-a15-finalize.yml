name: Finalize Countryside Days alpha.15

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-finalize.yml']
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: projects/countryside-days

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Apply compile and runtime fixes
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('projects/countryside-days/src/main/java/kr/countrysidedays/gameplay/VillageLifeManager.java')
          s=p.read_text('utf-8')
          old='''        if (!(event.getEntity() instanceof ServerPlayer player)) return;\n        if (!(event.getLevel() instanceof ServerLevel level)) return;\n'''
          new='''        ServerPlayer player = event.getEntity();\n        if (!(event.getLevel() instanceof ServerLevel level)) return;\n'''
          if old in s: s=s.replace(old,new)
          elif new not in s: raise SystemExit('VillageLifeManager patch target missing')
          p.write_text(s,'utf-8')

          targets=[
            ('projects/countryside-days/src/main/java/kr/countrysidedays/world/StarterHomesteadGenerator.java',
             'origin.offset(PlayerEstateLayout.MIN_X - 4, -2, PlayerEstateLayout.MIN_Z - 4)',
             'origin.offset(PlayerEstateLayout.MAX_X + 5, 12, PlayerEstateLayout.MAX_Z + 5)'),
            ('projects/countryside-days/src/main/java/kr/countrysidedays/world/PublicVillageExpansionBuilder.java',
             'origin.offset(-MAP_HALF_WIDTH - 4, -2, -MAP_HALF_DEPTH - 4)',
             'origin.offset(MAP_HALF_WIDTH + 5, 14, MAP_HALF_DEPTH + 5)')]
          old_loop='''        for (ItemEntity item : new ArrayList<>(level.getEntities().getAll().stream()\n                .filter(ItemEntity.class::isInstance)\n                .map(ItemEntity.class::cast)\n                .toList())) {\n'''
          for name,lo,hi in targets:
            p=Path(name); s=p.read_text('utf-8')
            if 'import net.minecraft.world.phys.AABB;' not in s:
              lines=s.splitlines(True)
              idx=max(i for i,x in enumerate(lines) if x.startswith('import net.minecraft.world.level.block.state'))
              lines.insert(idx+1,'import net.minecraft.world.phys.AABB;\n')
              s=''.join(lines)
            new_loop=f'''        AABB bounds = new AABB(\n                {lo},\n                {hi}\n        );\n        for (ItemEntity item : new ArrayList<>(level.getEntitiesOfClass(ItemEntity.class, bounds))) {{\n'''
            if old_loop in s: s=s.replace(old_loop,new_loop)
            elif new_loop not in s: raise SystemExit('debris loop target missing '+name)
            p.write_text(s,'utf-8')

          p=Path('projects/countryside-days/src/main/resources/data/countrysidedays/worldgen/biome/rural_plains.json')
          s=p.read_text('utf-8').replace('minecraft:trees_birch_and_oak_leaf_litter','minecraft:trees_birch_and_oak')
          if 'minecraft:trees_birch_and_oak_leaf_litter' in s: raise SystemExit('invalid placed feature remains')
          p.write_text(s,'utf-8')
          print('source fixes applied')
          PY

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}

      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Clean Java 25 build
        run: |
          mkdir -p ci-logs
          if [ ! -x ./gradlew ]; then gradle wrapper --gradle-version 9.2.1 --distribution-type bin; chmod +x gradlew; fi
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ci-logs/clean-build.log

      - name: Datagen
        run: |
          set -o pipefail
          ./gradlew --no-daemon runData --stacktrace 2>&1 | tee ci-logs/datagen.log

      - name: Required GameTests
        timeout-minutes: 25
        run: |
          mkdir -p run/gametestserver
          cat > run/gametestserver/server.properties <<'PROPERTIES'
          level-name=gametestworld
          level-type=minecraft:flat
          generator-settings={"biome":"countrysidedays:rural_plains","features":true,"lakes":false,"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":8},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}
          generate-structures=true
          online-mode=false
          spawn-protection=0
          view-distance=10
          simulation-distance=8
          PROPERTIES
          set -o pipefail
          ./gradlew --no-daemon runGameTestServer --stacktrace 2>&1 | tee ci-logs/gametest.log

      - name: Reject runtime data errors
        run: |
          ! grep -n -E "Couldn't parse data file|Failed to parse recipe|Parsing error loading recipe|Failed to parse.*worldgen|biome_modifier|Couldn't load tag|Failed to load registries" ci-logs/gametest.log ci-logs/datagen.log

      - name: Audit flat countryside server
        timeout-minutes: 8
        run: |
          rm -rf run/world run/logs
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          level-name=world
          level-type=minecraft:flat
          generator-settings={"biome":"countrysidedays:rural_plains","features":true,"lakes":false,"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":8},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}
          generate-structures=true
          online-mode=false
          spawn-protection=0
          view-distance=10
          simulation-distance=8
          PROPERTIES
          setsid ./gradlew --no-daemon runServer --stacktrace > ci-logs/server.log 2>&1 &
          PID=$!; READY=0
          for SECOND in $(seq 1 180); do
            if grep -q 'Done (' ci-logs/server.log && grep -q 'Countryside worldgen audit passed' ci-logs/server.log; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM -- -$PID 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          tail -n 300 ci-logs/server.log
          [ "$READY" -eq 1 ]
          ! grep -n -E "Failed to start the minecraft server|Exception in server tick loop|ModLoadingException|Countryside worldgen audit failed|Failed to load registries" ci-logs/server.log

      - name: Audit client boot
        timeout-minutes: 6
        run: |
          rm -rf run/logs
          setsid env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --no-daemon runClient --stacktrace > ci-logs/client.log 2>&1 &
          PID=$!; READY=0
          for SECOND in $(seq 1 150); do
            if grep -q 'Backend library: LWJGL' ci-logs/client.log && grep -Eq 'Sound engine started|Created:.*minecraft:textures/atlas' ci-logs/client.log; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM -- -$PID 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          tail -n 300 ci-logs/client.log
          [ "$READY" -eq 1 ]
          grep -q 'Countryside Days 0.1.0-alpha.15 core content registered' ci-logs/client.log
          grep -q 'Countryside Days compact navigation HUD registered' ci-logs/client.log
          ! grep -n -E "Failed to create window|ModLoadingException|Caught previously unhandled exception|ReportedException|Missing item model for location countrysidedays:|Unable to load model.*countrysidedays:" ci-logs/client.log

      - name: Verify executable JAR
        run: |
          JAR=build/libs/countrysidedays-0.1.0-alpha.15.jar
          python3 tools/verify_jar.py "$JAR" | tee ci-logs/jar-verification.log
          mkdir -p build/deliverables release
          cp "$JAR" build/deliverables/
          cp "$JAR" release/
          sha256sum "$JAR" > release/countrysidedays-0.1.0-alpha.15.jar.sha256

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.15-jar
          path: projects/countryside-days/build/deliverables/countrysidedays-0.1.0-alpha.15.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.15-logs
          path: projects/countryside-days/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit verified source and report
        working-directory: .
        run: |
          rm -f .github/workflows/cd-a15-finalize.yml .github/workflows/cd-a15-patch-p04.yml .github/workflows/cd-a15-patch-p04b.yml
          cat > projects/countryside-days/BUILD_AND_RUNTIME_REPORT.md <<REPORT
          # Countryside Days Build and Runtime Report

          - Workflow run: ${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - Mod version: 0.1.0-alpha.15
          - Clean Java 25 build: success
          - Datagen: success
          - Required GameTests: success
          - Runtime data validation: success
          - Explicit countryside flat server: success
          - Virtual-display client: success
          - Executable JAR inspection: success
          REPORT
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A projects/countryside-days .github/workflows
          git commit -m 'Verify and release Countryside Days alpha.15'
          git pull --rebase origin main
          git push origin HEAD:main
