name: Riftfrontier Hunter Alien Intake

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/riftfrontier-hunter-alien-intake.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/riftfrontier

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Acquire exact creator-published Big Alien glTF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/hunter-alien-intake
          python3 -m pip install --disable-pip-version-check --no-input gdown==5.2.0
          # Ultimate Monsters contains more than one creature named Alien in different
          # families. The Hunter candidate is the Big/glTF Alien discovered in the
          # creator-published folder; download that exact upstream file only instead
          # of recursively mirroring the whole pack.
          gdown 'https://drive.google.com/uc?id=1rWF4Jo_G7-odDa5LfkQ0e2d9_p9pxb3W' \
            -O build/hunter-alien-intake/Alien.source.gltf
      - name: Inspect exact Alien glTF
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          src = Path('build/hunter-alien-intake/Alien.source.gltf')
          data = src.read_bytes()
          doc = json.loads(data.decode('utf-8'))
          receipt = {
              'asset': 'Alien',
              'variant': 'Big/glTF',
              'author': 'Quaternius',
              'family': 'Ultimate Monsters',
              'creator_pack_page': 'https://quaternius.com/packs/ultimatemonsters.html',
              'creator_distribution_folder': 'https://drive.google.com/drive/folders/18m4KpzpEzhC9wl7jzr6dUc0N8Jozr79C',
              'creator_file_id': '1rWF4Jo_G7-odDa5LfkQ0e2d9_p9pxb3W',
              'license': 'CC0 1.0 / public domain dedication',
              'intended_role': 'Region 01 Hunter visual/rig candidate only',
              'source_relative_path': 'Big/glTF/Alien.gltf',
              'source_file': 'Alien.gltf',
              'byte_size': len(data),
              'sha256': hashlib.sha256(data).hexdigest(),
              'gltf_asset_version': doc.get('asset', {}).get('version'),
              'mesh_count': len(doc.get('meshes', [])),
              'skin_count': len(doc.get('skins', [])),
              'material_count': len(doc.get('materials', [])),
              'image_count': len(doc.get('images', [])),
              'animation_clips': [a.get('name') for a in doc.get('animations', [])],
              'animation_count': len(doc.get('animations', [])),
              'node_count': len(doc.get('nodes', [])),
              'buffer_uris': [b.get('uri') for b in doc.get('buffers', [])],
              'image_uris': [i.get('uri') for i in doc.get('images', [])],
              'selected_for_production': False,
              'human_visual_acceptance': False,
          }
          Path('build/hunter-alien-intake/receipt.json').write_text(json.dumps(receipt, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(receipt, indent=2))
          PY
      - name: Upload exact candidate and inspection receipt
        uses: actions/upload-artifact@v4
        with:
          name: riftfrontier-region01-hunter-alien-source-inspection
          path: |
            projects/riftfrontier/build/hunter-alien-intake/Alien.source.gltf
            projects/riftfrontier/build/hunter-alien-intake/receipt.json
          if-no-files-found: error
          retention-days: 7
