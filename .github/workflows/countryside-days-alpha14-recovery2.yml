name: Materialize Countryside Days alpha.14 source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/countryside-days-alpha14-recovery2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: countryside-days-alpha14-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover verified source entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, binascii, hashlib, io, shutil, struct, zlib, zipfile

          root = Path('.').resolve()
          project = root / 'projects/countryside-days'
          tools = project / 'tools'

          expected_prefix = [
              'alpha14_final_00.part', 'alpha14_final_01.part',
              'alpha14_final_02.part', 'alpha14_final_03.part',
              'alpha14_final_05.part', 'alpha14_final_07.part',
              'alpha14_final_09.part', 'alpha14_final_11.part',
          ]
          prefix_files = sorted(tools.glob('alpha14_final_*.part'))
          if [p.name for p in prefix_files] != expected_prefix:
              raise SystemExit(f'bad prefix set: {[p.name for p in prefix_files]}')

          encoded = ''.join(p.read_text('ascii').strip() for p in prefix_files)
          if len(encoded) != 104000:
              raise SystemExit(f'bad prefix length: {len(encoded)}')
          raw = base64.b64decode(encoded, validate=True)
          if len(raw) != 78000:
              raise SystemExit(f'bad prefix bytes: {len(raw)}')

          pos = 0
          extracted = []
          boundary = None
          while pos + 30 <= len(raw) and raw[pos:pos + 4] == b'PK\x03\x04':
              (_, _, flags, method, _, _, crc, csize, usize, nlen, xlen) = struct.unpack_from(
                  '<IHHHHHIIIHH', raw, pos
              )
              if flags & 0x08:
                  raise SystemExit('data-descriptor entries are not accepted')
              name_start = pos + 30
              name_end = name_start + nlen
              data_start = name_end + xlen
              data_end = data_start + csize
              if name_end > len(raw):
                  break
              name = raw[name_start:name_end].decode('utf-8')
              if not name.startswith('projects/countryside-days/') or '..' in Path(name).parts:
                  raise SystemExit(f'unsafe entry: {name}')
              if data_end > len(raw):
                  boundary = name
                  break
              compressed = raw[data_start:data_end]
              try:
                  if method == 0:
                      content = compressed
                  elif method == 8:
                      content = zlib.decompress(compressed, -15)
                  else:
                      raise SystemExit(f'unsupported compression {method}: {name}')
              except zlib.error:
                  boundary = name
                  break
              if len(content) != usize:
                  raise SystemExit(f'size mismatch: {name}')
              if (binascii.crc32(content) & 0xffffffff) != crc:
                  raise SystemExit(f'crc mismatch: {name}')
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
              extracted.append(name)
              pos = data_end

          if len(extracted) < 45:
              raise SystemExit(f'too few verified prefix entries: {len(extracted)}')

          expected_tail = [
              'alpha14_tail_00.part',
              'alpha14_tail_01.part',
              'alpha14_tail_02.part',
          ]
          tail_files = sorted(tools.glob('alpha14_tail_*.part'))
          if [p.name for p in tail_files] != expected_tail:
              raise SystemExit(f'bad tail set: {[p.name for p in tail_files]}')
          tail_text = ''.join(p.read_text('ascii').strip() for p in tail_files)
          if len(tail_text) != 16612:
              raise SystemExit(f'bad tail length: {len(tail_text)}')
          tail = base64.b64decode(tail_text, validate=True)
          expected_sha = '1ff0631d490403221dd2221a93d4d22ea8a87421771f8ac49f842b61af7389de'
          if hashlib.sha256(tail).hexdigest() != expected_sha:
              raise SystemExit('tail sha256 mismatch')
          with zipfile.ZipFile(io.BytesIO(tail)) as archive:
              bad = archive.testzip()
              if bad:
                  raise SystemExit(f'bad tail entry: {bad}')
              names = archive.namelist()
              if any(not n.startswith('projects/countryside-days/') or '..' in Path(n).parts for n in names):
                  raise SystemExit('unsafe tail entry')
              archive.extractall(root)

          shutil.rmtree(project / 'projects', ignore_errors=True)
          for pattern in ('alpha14_*.part', 'alpha14_*.b64'):
              for path in tools.glob(pattern):
                  path.unlink()

          required = [
              project / 'src/main/java/kr/countrysidedays/gameplay/CountrysideSeatManager.java',
              project / 'src/main/java/kr/countrysidedays/gameplay/VillageResidentCatalog.java',
              project / 'src/main/java/kr/countrysidedays/world/PublicVillageExpansionBuilder.java',
              project / 'src/main/resources/assets/countrysidedays/lang/ko_kr.json',
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f'missing recovered files: {missing}')
          props = (project / 'gradle.properties').read_text('utf-8')
          if 'mod_version=0.1.0-alpha.14' not in props:
              raise SystemExit('wrong recovered version')
          npc = (project / 'src/main/java/kr/countrysidedays/gameplay/RuralNpcManager.java').read_text('utf-8')
          if 'ACTIVE_GUEST_TAG' not in npc or 'CUSTOMER_NAMES' in npc:
              raise SystemExit('alpha.14 resident guest source was not recovered')
          layout = (project / 'src/main/java/kr/countrysidedays/world/PlayerEstateLayout.java').read_text('utf-8')
          if 'RESTAURANT_SEAT_COUNT = 8' not in layout:
              raise SystemExit('alpha.14 layout was not recovered')

          print(f'verified prefix entries: {len(extracted)}')
          print(f'partial boundary: {boundary}')
          print(f'verified tail entries: {len(names)}')
          PY

      - name: Commit recovered source
        run: |
          rm -f .github/workflows/countryside-days-alpha14-recovery.yml
          rm -f .github/workflows/countryside-days-alpha14-recovery2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/countryside-days .github/workflows
          git commit -m 'Materialize verified Countryside Days alpha.14 source'
          git pull --rebase origin main
          git push origin HEAD:main
