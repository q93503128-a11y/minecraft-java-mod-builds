name: Retry Countryside Days alpha.14 recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/countryside-days-alpha14-recovery2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: countryside-days-alpha14-recovery2
  cancel-in-progress: false

defaults:
  run:
    working-directory: projects/countryside-days

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover complete staged files and tail archive
        working-directory: .
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, binascii, hashlib, io, shutil, struct, zlib, zipfile
          root=Path('.').resolve(); project=root/'projects/countryside-days'; tools=project/'tools'
          prefixes=sorted(tools.glob('alpha14_final_*.part'))
          expected=['alpha14_final_00.part','alpha14_final_01.part','alpha14_final_02.part','alpha14_final_03.part','alpha14_final_05.part','alpha14_final_07.part','alpha14_final_09.part','alpha14_final_11.part']
          if [p.name for p in prefixes] != expected: raise SystemExit(f'bad prefix set: {[p.name for p in prefixes]}')
          encoded=''.join(p.read_text('ascii').strip() for p in prefixes)
          if len(encoded)!=104000: raise SystemExit(f'bad prefix length {len(encoded)}')
          raw=base64.b64decode(encoded,validate=True)
          if len(raw)!=78000: raise SystemExit(f'bad prefix byte count {len(raw)}')
          pos=0; extracted=[]; boundary=None
          while pos+30<=len(raw) and raw[pos:pos+4]==b'PK\x03\x04':
              _,_,_,method,_,_,crc,csize,usize,nlen,xlen=struct.unpack_from('<IHHHHHIIIHH',raw,pos)
              ns=pos+30; ne=ns+nlen; ds=ne+xlen; de=ds+csize
              if ne>len(raw): break
              name=raw[ns:ne].decode('utf-8')
              if not name.startswith('projects/countryside-days/') or '..' in Path(name).parts: raise SystemExit(f'unsafe entry {name}')
              if de>len(raw): boundary=name; break
              compressed=raw[ds:de]
              try:
                  if method==0: content=compressed
                  elif method==8: content=zlib.decompress(compressed,-15)
                  else: raise SystemExit(f'unsupported compression {method}: {name}')
              except zlib.error:
                  boundary=name; break
              if len(content)!=usize or (binascii.crc32(content)&0xffffffff)!=crc: raise SystemExit(f'CRC/size mismatch {name}')
              target=root/name; target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(content)
              extracted.append(name); pos=de
          if len(extracted)<35: raise SystemExit(f'too few verified prefix files: {len(extracted)}')
          tails=sorted(tools.glob('alpha14_tail_*.part'))
          if [p.name for p in tails] != ['alpha14_tail_00.part','alpha14_tail_01.part','alpha14_tail_02.part']: raise SystemExit('bad tail set')
          tail_text=''.join(p.read_text('ascii').strip() for p in tails)
          if len(tail_text)!=16612: raise SystemExit(f'bad tail length {len(tail_text)}')
          tail=base64.b64decode(tail_text,validate=True)
          if hashlib.sha256(tail).hexdigest()!='1ff0631d490403221dd2221a93d4d22ea8a87421771f8ac49f842b61af7389de': raise SystemExit('bad tail sha256')
          with zipfile.ZipFile(io.BytesIO(tail)) as z:
              bad=z.testzip()
              if bad: raise SystemExit(f'bad tail entry {bad}')
              names=z.namelist()
              if any(not n.startswith('projects/countryside-days/') or '..' in Path(n).parts for n in names): raise SystemExit('unsafe tail entry')
              z.extractall(root)
          shutil.rmtree(project/'projects',ignore_errors=True)
          print(f'prefix verified={len(extracted)}, boundary={boundary}, tail={len(names)}')
          (project/'ci-recovery-boundary.txt').write_text(f'prefix verified={len(extracted)}\nboundary={boundary}\ntail={len(names)}\n','utf-8')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Prepare Gradle
        run: |
          if [ ! -x ./gradlew ]; then gradle wrapper --gradle-version 9.2.1 --distribution-type bin; chmod +x gradlew; fi
          java -version
          ./gradlew --version

      - name: Validate localization and alpha.14 contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          lang=Path('src/main/resources/assets/countrysidedays/lang')
          ko=json.loads((lang/'ko_kr.json').read_bytes().decode('utf-8','strict')); en=json.loads((lang/'en_us.json').read_bytes().decode('utf-8','strict'))
          if set(ko)!=set(en): raise SystemExit(f'lang mismatch ko-only={set(ko)-set(en)} en-only={set(en)-set(ko)}')
          required=('hud.countrysidedays.river_direction','message.countrysidedays.starter_coins','message.countrysidedays.resident_chat','message.countrysidedays.adoption_success','item.countrysidedays.cow_adoption_ticket','item.countrysidedays.sheep_adoption_ticket','item.countrysidedays.chicken_adoption_ticket')
          for k in required:
              if not isinstance(ko.get(k),str) or not ko[k].strip(): raise SystemExit(f'missing Korean key {k}')
          for k,v in ko.items():
              if k.startswith('hud.countrysidedays.') and not re.search(r'[가-힣]',re.sub(r'§.','',v)): raise SystemExit(f'non-Korean HUD {k}')
          root=Path('src/main/java/kr/countrysidedays'); read=lambda p:(root/p).read_text('utf-8')
          mod=read('CountrysideDays.java'); npc=read('gameplay/RuralNpcManager.java'); village=read('gameplay/VillageLifeManager.java')
          worker=read('gameplay/EstateWorkerManager.java'); ranch=read('gameplay/RanchLifeManager.java'); seat=read('gameplay/CountrysideSeatManager.java')
          residents=read('gameplay/VillageResidentCatalog.java'); gameplay=read('gameplay/RuralGameplayHandler.java'); fishing=read('gameplay/CountrysideFishingManager.java')
          access=read('gameplay/SharedRestaurantAccess.java'); data=read('world/CountrysideWorldData.java'); estate=read('world/StarterHomesteadGenerator.java')
          public=read('world/PublicVillageExpansionBuilder.java'); restaurant=read('world/SharedRestaurantBuilder.java'); layout=read('world/PlayerEstateLayout.java'); payload=read('network/EstateHudPayload.java')
          if '0.1.0-alpha.14' not in mod: raise SystemExit('wrong source version')
          if mod.index('VillageLifeManager::onEntityInteract')>mod.index('RuralNpcManager::handleInteraction'): raise SystemExit('bad interaction order')
          if 'if (event.isCanceled()) return;' not in npc: raise SystemExit('double interaction risk')
          for x in ('CUSTOMER_NAMES','ensureSharedCustomers','spawnSpeciesIfMissing','DAILY_CUSTOMER_CAP'):
              if x in npc: raise SystemExit(f'legacy code {x}')
          for x in ('ACTIVE_GUEST_TAG','maybeInviteResident','nextInt(6)','isActiveGuest'):
              if x not in npc: raise SystemExit(f'missing guest code {x}')
          if 'RESTAURANT_SEAT_COUNT = 8' not in layout: raise SystemExit('seat count')
          if not all(x in access+data for x in ('recordGuestService','withGuestService')): raise SystemExit('guest accounting')
          if not all(x in ranch for x in ('COW_ADOPTION_TICKET','SHEEP_ADOPTION_TICKET','CHICKEN_ADOPTION_TICKET','purgeLegacyEstateAnimals','PRIVATE_LIVESTOCK_V14_TAG')): raise SystemExit('ranch adoption/migration')
          if 'ensureEstateWorker(' in village or not all(x in worker for x in ('HIRED_V14_TAG','villager.discard()')): raise SystemExit('automatic workers')
          if not all(x in estate for x in ('clearFormerBarn','estatePaths','clearPathDrops','safeWorldPathDot')): raise SystemExit('estate cleanup/path')
          if residents.count('new Profile(')<20 or not all(x in residents for x in ('PUBLIC_RESIDENT_TAG','household','shopCategory')): raise SystemExit('resident roster')
          if not all(x in public for x in ('cottage(','workshop(','publicRiver(','clearLegacyHallLamp')): raise SystemExit('public village/river')
          if 'resident_progress' in npc: raise SystemExit('Boksun progress report')
          if not all(x in seat for x in ('SEAT_TAG','startRiding','isSeatOccupied','getOpposite()')): raise SystemExit('seating')
          if not all(x in restaurant for x in ('customerSeatFacing(slot).getOpposite()','RESTAURANT_SEAT_COUNT')): raise SystemExit('chair facing')
          if not all(x in fishing+payload for x in ('isPublicRiver','riverX','riverZ')): raise SystemExit('river navigation')
          if 'STARTER_COINS = 20' not in gameplay: raise SystemExit('starter coins')
          if 'StreamCodec.composite(' in payload or 'new StreamCodec<>()' not in payload: raise SystemExit('HUD codec')
          print(f'validated {len(ko)} localization keys and alpha.14 contracts')
          PY

      - name: Clean Java 25 build
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ci-logs/clean-build.log
      - name: Datagen
        run: |
          set -o pipefail
          ./gradlew --no-daemon runData --stacktrace 2>&1 | tee ci-logs/datagen.log
      - name: Required GameTests
        timeout-minutes: 25
        run: |
          set -o pipefail
          ./gradlew --no-daemon runGameTestServer --stacktrace 2>&1 | tee ci-logs/gametest.log
      - name: Reject runtime data errors
        run: |
          ! grep -n -E "Couldn't parse data file|Failed to parse recipe|Parsing error loading recipe|Failed to parse.*worldgen|biome_modifier" ci-logs/gametest.log ci-logs/datagen.log
      - name: Audit flat server
        timeout-minutes: 8
        run: |
          rm -rf run/world run/logs; mkdir -p run ci-logs; printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'PROPERTIES'
          level-name=world
          level-type=minecraft:flat
          generator-settings={"biome":"countrysidedays:rural_plains","features":true,"lakes":false,"layers":[{"block":"minecraft:bedrock","height":1},{"block":"minecraft:dirt","height":8},{"block":"minecraft:grass_block","height":1}],"structure_overrides":[]}
          generate-structures=true
          online-mode=false
          spawn-protection=0
          view-distance=10
          simulation-distance=8
          PROPERTIES
          setsid ./gradlew --no-daemon runServer --stacktrace > ci-logs/server.log 2>&1 &
          PID=$!; READY=0
          for SECOND in $(seq 1 180); do
            if grep -q "Done (" ci-logs/server.log && grep -q "Countryside worldgen audit passed" ci-logs/server.log; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM -- "-$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; tail -n 300 ci-logs/server.log
          [ "$READY" -eq 1 ]
          ! grep -n -E "Failed to start the minecraft server|Exception in server tick loop|ModLoadingException|Countryside worldgen audit failed|No key layers in MapLike" ci-logs/server.log
      - name: Audit client boot
        timeout-minutes: 6
        run: |
          rm -rf run/logs
          setsid env LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x720x24' ./gradlew --no-daemon runClient --stacktrace > ci-logs/client.log 2>&1 &
          PID=$!; READY=0
          for SECOND in $(seq 1 150); do
            if grep -q "Backend library: LWJGL" ci-logs/client.log && grep -Eq "Sound engine started|Created:.*minecraft:textures/atlas" ci-logs/client.log; then READY=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM -- "-$PID" 2>/dev/null || true; wait "$PID" 2>/dev/null || true; tail -n 300 ci-logs/client.log
          [ "$READY" -eq 1 ]
          grep -q "Countryside Days 0.1.0-alpha.14 core content registered" ci-logs/client.log
          grep -q "Countryside Days compact navigation HUD registered" ci-logs/client.log
          ! grep -n -E "Failed to create window|ModLoadingException|Caught previously unhandled exception|ReportedException|Missing item model for location countrysidedays:|Unable to load model.*countrysidedays:" ci-logs/client.log
      - name: Verify executable JAR
        run: |
          JAR='build/libs/countrysidedays-0.1.0-alpha.14.jar'
          python3 tools/verify_jar.py "$JAR" | tee ci-logs/jar-verification.log
          mkdir -p build/deliverables release
          cp "$JAR" build/deliverables/
          cp "$JAR" release/
          sha256sum "$JAR" > release/countrysidedays-0.1.0-alpha.14.jar.sha256
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.14-jar
          path: projects/countryside-days/build/deliverables/countrysidedays-0.1.0-alpha.14.jar
          if-no-files-found: error
          retention-days: 14
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: countryside-days-0.1.0-alpha.14-recovery2-logs
          path: |
            projects/countryside-days/ci-logs/
            projects/countryside-days/ci-recovery-boundary.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Commit verified source and release
        working-directory: .
        run: |
          rm -f projects/countryside-days/tools/alpha14_*.part projects/countryside-days/tools/alpha14_*.b64
          rm -f .github/workflows/countryside-days-alpha14-recovery.yml .github/workflows/countryside-days-alpha14-recovery2.yml
          rm -f projects/countryside-days/ci-recovery-boundary.txt
          cat > projects/countryside-days/BUILD_AND_RUNTIME_REPORT.md <<REPORT
          # Countryside Days Build and Runtime Report

          - Workflow run: ${GITHUB_RUN_ID}
          - Source commit: ${GITHUB_SHA}
          - Mod version: 0.1.0-alpha.14
          - UTF-8 localization and gameplay contracts: success
          - Clean Java 25 build: success
          - Datagen: success
          - Required GameTests: success
          - Runtime data validation: success
          - Explicit countryside flat server: success
          - Virtual-display client: success
          - Executable JAR inspection: success
          REPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/countryside-days .github/workflows
          git commit -m 'Verify and release Countryside Days alpha.14'
          git pull --rebase origin main
          git push origin HEAD:main
