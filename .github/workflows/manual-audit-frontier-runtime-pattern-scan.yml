name: Manual Audit Frontier Runtime Pattern Scan

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/manual-audit-frontier-runtime-pattern-scan.yml'
      - 'projects/frontier-settlement/src/main/java/**'

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan risky runtime patterns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement')
          patterns = {
              'INVULNERABLE_TRUE': 'setInvulnerable(true)',
              'NOAI_TRUE': 'setNoAi(true)',
              'DIRECT_STORAGE_EXTRACT': 'SettlementStorageService.findExtractionTarget(',
              'DIRECT_STORAGE_DEPOSIT': 'SettlementStorageService.findDepositTarget(',
              'DIRECT_MOVE_SOURCE': 'getNavigation().moveTo(source.getX()',
              'DIRECT_MOVE_TARGET': 'getNavigation().moveTo(target.getX()',
              'DIRECT_MOVE_STOCK': 'getNavigation().moveTo(stock.getX()',
              'DISCARD_ENTITY': '.discard();',
          }
          hits = {key: [] for key in patterns}
          for path in sorted(root.rglob('*.java')):
              rel = str(path.relative_to(root))
              for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  for key, token in patterns.items():
                      if token in line:
                          hits[key].append((rel, lineno, line.strip()))
                          print(f'{key}|{rel}:{lineno}|{line.strip()}')
          print('SUMMARY|' + '|'.join(f'{key}={len(value)}' for key, value in hits.items()))

          for key in ('INVULNERABLE_TRUE', 'NOAI_TRUE', 'DIRECT_STORAGE_DEPOSIT', 'DIRECT_MOVE_SOURCE', 'DIRECT_MOVE_STOCK'):
              if hits[key]:
                  raise SystemExit(f'unexpected unsafe runtime pattern remains: {key}={hits[key]}')

          # The only remaining direct findExtractionTarget calls are read-only construction status
          # probes. Actual extraction movement then uses the separate exact reachable-target helper.
          unexpected_extract = [hit for hit in hits['DIRECT_STORAGE_EXTRACT']
                                if hit[0] != 'settlement/SettlementConstructionService.java']
          if unexpected_extract or len(hits['DIRECT_STORAGE_EXTRACT']) != 2:
              raise SystemExit(f'unexpected direct storage extraction sites: {hits["DIRECT_STORAGE_EXTRACT"]}')

          print('FRONTIER RUNTIME PATTERN SCAN PASS')
          PY
