name: Audit Village Guardians Shortcuts

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.audit-shortcuts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: village-guardians-shortcut-audit-main
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build shortcut audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('projects/village-guardians')
          java = root / 'src/main/java/kr/moonseungjun/villageguardians'
          resources = root / 'src/main/resources'
          out = Path('ci-results/village-guardians-shortcuts')
          out.mkdir(parents=True, exist_ok=True)
          keys = (java / 'VillageClientKeys.java').read_text(encoding='utf-8')
          lang = (resources / 'assets/villageguardians/lang/ko_kr.json').read_text(encoding='utf-8')
          mapping = re.findall(r'private static final KeyMapping\s+(\w+)\s*=\s*key\("([^"]+)",\s*GLFW\.GLFW_KEY_(\w+)\);', keys)
          consumes = re.findall(r'consume\((\w+),\s*"([^"]+)"\);', keys)
          lines = ['# Village Guardians 단축키 감사', '', '## 실제 등록 및 전송', '', '| 필드 | 번역 ID | 기본키 | 서버 액션 |', '|---|---|---:|---|']
          action_by_field = dict(consumes)
          for field, ident, key in mapping:
              lines.append(f'| `{field}` | `key.villageguardians.{ident}` | `{key}` | `{action_by_field.get(field, "미전송")}` |')
          lines += ['', '## 언어 파일', '', '```json', lang.strip(), '```', '', '## 코드 내 키/설명 참조', '']
          pattern = re.compile(r'(GLFW_KEY_|key\.villageguardians|단축키|빠른 통신|통신 [A-Z]|[A-Z](?:/[A-Z])? (?:기술|통신|상태|성장|직업|회관|귀환|메뉴)|(?:상태|성장|직업|통신) [A-Z])')
          for path in sorted(list(java.rglob('*.java')) + list(resources.rglob('*.json')) + list(root.glob('*.md'))):
              text = path.read_text(encoding='utf-8', errors='replace')
              hits = []
              for no, line in enumerate(text.splitlines(), 1):
                  if pattern.search(line):
                      hits.append((no, line.strip()))
              if hits:
                  lines += [f'### `{path.relative_to(root)}`', '']
                  lines += [f'- L{no}: `{line.replace("`", "\\`")}`' for no, line in hits]
                  lines.append('')
          (out / 'audit.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Publish audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/village-guardians-shortcuts/audit.md
          if ! git diff --cached --quiet; then
            git commit -m 'Record Village Guardians shortcut audit'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin HEAD:main && break
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep $((attempt * 3))
            done
          fi
