name: Patch Living Kingdoms capital housing APIs

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/prepare_erden_capital_housing_apis.py'
      - '.github/workflows/patch-living-kingdoms-capital-housing-apis.yml'

concurrency:
  group: living-kingdoms-capital-housing-api-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Add housing extension APIs
        run: python .github/scripts/prepare_erden_capital_housing_apis.py
      - name: Clean compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Verify housing API invariants
        shell: bash
        run: |
          set -euo pipefail
          life='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleSavedData.java'
          marriage='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalMarriageSavedData.java'
          economy='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPhysicalEconomySavedData.java'
          grep -Fq 'public boolean addPerson(Person person)' "$life"
          grep -Fq 'moveUnionHousehold' "$marriage"
          grep -Fq 'createUnion(' "$marriage"
          grep -Fq 'replaceWallet(WalletState replacement)' "$economy"
          grep -Fq 'WalletState wallet(String householdId)' "$economy"
      - name: Commit compiled APIs directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleSavedData.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalMarriageSavedData.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPhysicalEconomySavedData.java
          git diff --cached --quiet && exit 0
          git commit -m 'feat(living-kingdoms): prepare capital housing economy APIs'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
