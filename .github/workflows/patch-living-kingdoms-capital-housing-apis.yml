name: Patch Living Kingdoms capital housing APIs

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/prepare_erden_capital_housing_apis.py'
      - '.github/scripts/wire_erden_capital_housing_runtime.py'
      - '.github/workflows/patch-living-kingdoms-capital-housing-apis.yml'

concurrency:
  group: living-kingdoms-capital-housing-api-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Add housing extension APIs
        run: python .github/scripts/prepare_erden_capital_housing_apis.py
      - name: Wire housing into lifecycle market and tick order
        run: python .github/scripts/wire_erden_capital_housing_runtime.py
      - name: Clean compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Verify housing runtime invariants
        shell: bash
        run: |
          set -euo pipefail
          life_saved='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleSavedData.java'
          life='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleManager.java'
          marriage='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalMarriageSavedData.java'
          economy='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPhysicalEconomySavedData.java'
          auth='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java'
          market='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenLivingEconomyManager.java'
          housing='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalHousingManager.java'
          housing_saved='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalHousingSavedData.java'
          mod='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java'
          grep -Fq 'public boolean addPerson(Person person)' "$life_saved"
          grep -Fq 'moveUnionHousehold' "$marriage"
          grep -Fq 'createUnion(' "$marriage"
          grep -Fq 'replaceWallet(WalletState replacement)' "$economy"
          grep -Fq 'WalletState wallet(String householdId)' "$economy"
          grep -Fq 'livingHouseholdIds' "$life"
          grep -Fq 'ErdenCapitalLifecycleManager.livingHouseholdIds(level, population, day)' "$auth"
          grep -Fq '!activeHouseholds.contains(household.id())' "$market"
          grep -Fq 'LK_ERDEN_CAPITAL_HOUSING_PASS' "$housing"
          grep -Fq 'existing_wallet_slot_reused=true' "$housing"
          grep -Fq 'no_synthetic_tenements=true' "$housing"
          grep -Fq 'SCHEMA_VERSION = 1' "$housing_saved"
          grep -Fq 'ErdenCapitalHousingManager.onServerTick(event)' "$mod"
          python - <<'PY'
          from pathlib import Path
          p=Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java').read_text()
          assert p.index('ErdenAuthoritativeEconomyManager.onServerTick(event);') < p.index('ErdenCapitalHousingManager.onServerTick(event);')
          PY
      - name: Commit compiled runtime directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleSavedData.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalMarriageSavedData.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPhysicalEconomySavedData.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenLivingEconomyManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'feat(living-kingdoms): wire capital housing into city economy'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
