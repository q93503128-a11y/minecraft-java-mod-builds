name: Patch Living Kingdoms exterior ticket release

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_living_kingdoms_release_exterior_tickets.py'
      - '.github/workflows/patch-living-kingdoms-release-exterior-tickets.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exterior ticket release
        run: python .github/scripts/patch_living_kingdoms_release_exterior_tickets.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenKingdomExteriorBuilder.java \
            .github/workflows/audit-living-kingdoms-exterior-workforce.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Release transient exterior chunk tickets'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
