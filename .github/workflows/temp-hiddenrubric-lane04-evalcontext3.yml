name: TEMP HiddenRubric Lane04 Evaluative Submission Mine 3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-evalcontext3.yml'

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Mine evaluative submission contexts
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          REPO='lmarena-ai/arena-human-preference-140k'; REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'; EXPECT=135634
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]
          PII=[re.compile(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b',re.I),re.compile(r'(?<!\d)(?:\+?\d[\d .()\-]{7,}\d)(?!\d)')]
          PREF=re.compile(r'\b(?:i prefer|we prefer|my preference|our preference|i hate|i dislike|i love|i like)\b',re.I)
          STATE=re.compile(r'\b(?:actually|instead|rather than|change|replace|revise|update|scratch that|forget that|previous|earlier|above|keep it|preserve|retain|remove|omit|delete|no longer|same as before|again but)\b',re.I)
          REQUEST=re.compile(r'\b(?:write|draft|prepare|create|transform|revise|edit|improve|polish|rewrite|develop|generate|make|help me|compose|format|finalize|refine|outline|build|craft|give me)\b',re.I)
          rules=[
            ('job_application',r'(?:application|cover letter|resume|cv|job application|response)',r'(?:hiring manager|recruiter|hr manager|hr team|human resources|interview panel|interviewer|interviewers)'),
            ('academic_thesis',r'(?:thesis|dissertation|defense|research proposal|proposal)',r'(?:thesis committee|dissertation committee|evaluation committee|evaluating committee|examiner|examiners|professor|professors|supervisor|advisor|adviser|panel|committee)'),
            ('academic_assignment',r'(?:assignment|essay|coursework|paper|report|submission|work)',r'(?:teacher marker|module team|teacher|instructor|professor|grader|examiner|assessment panel|grading committee)'),
            ('publication',r'(?:manuscript|paper|abstract|article|submission)',r'(?:peer reviewer|peer reviewers|reviewer|reviewers|editor|associate editor|journal editor)'),
            ('pitch_funding',r'(?:pitch|pitch deck|proposal|business plan|project|presentation|slides|application)',r'(?:judge|judges|jury|investor|investors|grant committee|funding committee|grant reviewer|grant reviewers|sponsor|sponsors|selection committee|panel|panelists)'),
            ('management_decision',r'(?:report|memo|proposal|plan|presentation|slides|business case|recommendation|request|promotion case)',r'(?:manager|managers|team lead|team leads|senior management|management|senior leadership|executive leadership|executive board|board of directors|executives|director|directors|president|principal)'),
            ('client_approval',r'(?:proposal|design|draft|report|deliverable|plan|prototype|presentation|document|contract|statement of work|sow|quotation|quote|offer)',r'(?:client|clients|customer|customers|client team|customer team)'),
          ]
          verbs=r'(?:submit|submitted|submitting|send|sent|sending|present|presented|presenting|share|shared|sharing|deliver|delivered|forward|forwarded|provide|provided|give|given|show|showing|pitch|pitched|take)'
          patterns=[]
          for name,art,actor in rules:
            patterns += [
              (name+'_verb_art_to_actor',re.compile(rf'\b(?P<verb>{verbs})\b.{{0,100}}?\b(?P<artifact>{art})\b.{{0,120}}?\b(?:to|before|for)\s+(?P<actor>(?:(?:my|our|the|a|an|their|his|her)\s+)?(?:{actor}))\b',re.I|re.S)),
              (name+'_art_to_actor',re.compile(rf'\b(?P<artifact>{art})\b.{{0,80}}?\b(?:to|before|for)\s+(?P<actor>(?:(?:my|our|the|a|an|their|his|her)\s+)?(?:{actor}))\b',re.I|re.S)),
              (name+'_actor_art',re.compile(rf'\b(?P<actor>(?:(?:my|our|the|a|an|their|his|her)\s+)?(?:{actor}))\b.{{0,100}}?\b(?P<artifact>{art})\b',re.I|re.S)),
            ]
          def ctext(m):
            if not isinstance(m,dict): return ''
            if isinstance(m.get('text'),str): return m['text']
            c=m.get('content')
            if isinstance(c,str): return c
            if isinstance(c,list): return '\n'.join(i if isinstance(i,str) else i.get('text','') for i in c if isinstance(i,(str,dict)))
            return ''
          def uts(row):
            o=[]
            for e in row.get('full_conversation') or []:
              if not isinstance(e,dict): continue
              u=e.get('user')
              if isinstance(u,dict):
                t=ctext(u).strip();
                if t:o.append(t)
              elif str(e.get('role') or '')=='user':
                t=ctext(e).strip();
                if t:o.append(t)
            return o
          def rkey(r,ts):
            s=r.get('timestamp')
            try:k=int(s.timestamp()*1e9) if hasattr(s,'timestamp') else int(s or 0)
            except:k=0
            return (int(r.get('evaluation_order') or 0),len(ts),k)
          cols=['id','evaluation_session_id','evaluation_order','language','is_code','timestamp','full_conversation']
          sessions={};raw=0
          for sh in SHARDS:
            p=hf_hub_download(REPO,filename=sh,repo_type='dataset',revision=REV); pf=pq.ParquetFile(p); use=[c for c in cols if c in pf.schema_arrow.names]
            for b in pf.iter_batches(batch_size=512,columns=use):
              for r in b.to_pylist():
                raw+=1
                if r.get('language')!='en' or bool(r.get('is_code')):continue
                ts=uts(r)
                if not ts:continue
                sid=str(r.get('evaluation_session_id') or r.get('id') or ''); k=rkey(r,ts)
                if sid not in sessions or k>sessions[sid][0]: sessions[sid]=(k,r,ts)
          if raw!=EXPECT:raise SystemExit(f'raw row drift {raw}')
          out=[];seen=set()
          for sid,(_,r,ts) in sessions.items():
            if any(PREF.search(t) for t in ts):continue
            if any(i>0 and STATE.search(t) for i,t in enumerate(ts)):continue
            for ti,text in enumerate(ts):
              if not (30<=len(text)<=1800) or any(p.search(text) for p in PII):continue
              if not REQUEST.search(text):continue
              norm=re.sub(r'\s+',' ',text).lower().strip(); h=hashlib.sha256(norm.encode()).hexdigest()
              if h in seen:continue
              hits=[]
              for name,pat in patterns:
                for m in pat.finditer(text):
                  a=m.group('actor').strip(); a0,a1=m.span('actor'); art=m.group('artifact').strip()
                  lo=max(0,m.start()-180);hi=min(len(text),m.end()+220);ev=re.sub(r'\s+',' ',text[lo:hi]).strip()
                  score=6+(1 if ti==0 else 0)+(1 if len(text)<=900 else 0)+(1 if re.search(r'\b(?:review|approve|approval|grade|mark|evaluate|assess|score|judge|select|decision|feedback|sign[- ]?off|convince|impress|win|hire|accept|pass)\b',text,re.I) else 0)
                  hits.append({'category':name,'actor':a,'artifact':art,'sourceActorSpan':{'start':a0,'end':a1,'text':text[a0:a1]},'score':score,'evidence':ev})
              if not hits:continue
              seen.add(h);hits.sort(key=lambda x:(-x['score'],x['sourceActorSpan']['start']))
              best=hits[0]
              out.append({'sourceRowId':str(r.get('id') or ''),'sourceEvaluationSessionId':sid,'turnIndex':ti,'familyTurnCount':len(ts),'sourceLength':len(text),'sourceText':text,**best,'allHits':hits[:5],'assistantOutputsIncluded':False,'trainingEligible':False})
          out.sort(key=lambda x:(-x['score'],x['sourceLength'],x['sourceEvaluationSessionId'],x['turnIndex']))
          d=Path('temp-hiddenrubric/lane04/evalcontext3');d.mkdir(parents=True,exist_ok=True)
          with (d/'full.jsonl').open('w',encoding='utf-8') as f,(d/'compact.jsonl').open('w',encoding='utf-8') as c:
            for x in out:
              f.write(json.dumps(x,ensure_ascii=False)+'\n');c.write(json.dumps({k:x[k] for k in ['sourceRowId','sourceEvaluationSessionId','turnIndex','familyTurnCount','sourceLength','category','actor','artifact','sourceActorSpan','score','evidence']},ensure_ascii=False)+'\n')
          (d/'manifest.json').write_text(json.dumps({'rawRows':raw,'sessionFamilies':len(sessions),'candidates':len(out),'sourceDataset':REPO,'sourceRevision':REV,'assistantOutputsIncluded':False,'candidateSignalsAreGold':False},indent=2)+'\n')
          print('candidates',len(out))
          PY
      - name: Commit queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/evalcontext3/
          git commit -m 'chore: materialize Lane04 evaluative submission queue 3'
          git push origin HEAD:main
