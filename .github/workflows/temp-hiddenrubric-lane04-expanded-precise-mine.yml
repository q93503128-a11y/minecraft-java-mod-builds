name: TEMP HiddenRubric Lane04 Expanded Precise Mine
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-expanded-precise-mine.yml'
permissions:
  contents: write
jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Mine expanded precise evaluator relations
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          REPO='lmarena-ai/arena-human-preference-140k'; REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]
          ACT=r'''(?:senior management|senior leadership|leadership team|management team|executive leadership|executive team|executive board|executive committee|board of directors|board members?|steering committee|selection committee|evaluation committee|evaluating committee|review committee|review panel|selection panel|interview panel|hiring committee|hiring manager|HR manager|human resources manager|admissions committee|admissions officers?|admission officers?|grant committee|grant panel|funding committee|funding panel|ethics committee|IRB|institutional review board|legal team|legal counsel|compliance team|compliance officer|procurement team|procurement committee|audit committee|auditors?|reviewers?|peer reviewers?|journal reviewers?|editor|editors|professor|professors|teacher|teachers|instructor|instructors|lecturer|lecturers|faculty|dean|principal|supervisor|supervisors|manager|managers|team lead|team leader|director|directors|VP|vice president|CEO|CFO|CTO|COO|CISO|client|clients|customer|customers|investor|investors|stakeholder|stakeholders|sponsor|sponsors|judge|judges|jury)'''
          OBJ=r'''(?:report|presentation|proposal|pitch|application|submission|assignment|thesis|dissertation|essay|document|draft|letter|cover letter|resume|résumé|CV|project|plan|analysis|brief|briefing note|memo|business case|case study|portfolio|statement|email|work|deliverable|recommendation|request|paper|manuscript|article|design|prototype|deck|slides|slide deck)'''
          REL=r'(?:review|approval|feedback|evaluation|assessment|grading|marking|scoring|sign[- ]?off|decision|acceptance|selection)'
          VERB=r'(?:review|approve|evaluate|assess|grade|mark|score|judge|reject|accept|select|shortlist|sign[- ]?off|provide feedback|give feedback)'
          pats=[
            ('for_actor_relation',re.compile(rf'(?is)\b(?:for|before)\s+(?:the\s+|my\s+|our\s+|your\s+)?(?P<actor>{ACT})\s+(?P<rel>{REL})\b')),
            ('object_for_actor_relation',re.compile(rf'(?is)\b(?P<object>{OBJ})\b.{{0,140}}?\bfor\s+(?:the\s+|my\s+|our\s+|your\s+)?(?P<actor>{ACT})\s+(?P<rel>{REL})\b')),
            ('passive_by_actor',re.compile(rf'(?is)\b(?P<object>{OBJ})\b.{{0,120}}?\b(?:will\s+be|is\s+to\s+be|is|be|gets?|got)\s+(?P<verb>reviewed|approved|evaluated|assessed|graded|marked|scored|judged|rejected|accepted|selected|shortlisted)\s+by\s+(?:the\s+|my\s+|our\s+|your\s+)?(?P<actor>{ACT})\b')),
            ('actor_will_verb',re.compile(rf'(?is)\b(?:the\s+|my\s+|our\s+|your\s+)?(?P<actor>{ACT})\b.{{0,50}}?\b(?:will|would|must|has\s+to|have\s+to|needs?\s+to|is\s+going\s+to|may)\s+(?P<verb>{VERB})\b.{{0,140}}?(?:\b(?P<object>{OBJ})\b|\bthis\b|\bit\b|\bthe\s+work\b)')),
            ('actor_relation_possessive',re.compile(rf'(?is)\b(?:the\s+|my\s+|our\s+|your\s+)?(?P<actor>{ACT})[’\']s\s+(?P<rel>{REL})\b')),
            ('relation_from_actor',re.compile(rf'(?is)\b(?P<rel>{REL})\s+(?:from|by)\s+(?:the\s+|my\s+|our\s+|your\s+)?(?P<actor>{ACT})\b')),
            ('submit_object_to_actor_for_relation',re.compile(rf'(?is)\b(?:submit|send|present|share|deliver)\s+(?:this\s+|the\s+|my\s+|our\s+|your\s+|a\s+|an\s+)?(?P<object>{OBJ})\b.{{0,120}}?\bto\s+(?:the\s+|my\s+|our\s+|your\s+)?(?P<actor>{ACT})\b.{{0,80}}?\b(?:for\s+)?(?P<rel>{REL})\b')),
            ('actor_verb_object',re.compile(rf'(?is)\b(?:the\s+|my\s+|our\s+|your\s+)?(?P<actor>{ACT})\b.{{0,60}}?\b(?P<verb>{VERB})\b.{{0,100}}?\b(?:this\s+|the\s+|my\s+|our\s+|your\s+|a\s+|an\s+)?(?P<object>{OBJ})\b')),
          ]
          def ctext(m):
            if not isinstance(m,dict): return ''
            if isinstance(m.get('text'),str): return m['text']
            c=m.get('content')
            if isinstance(c,str): return c
            if isinstance(c,list): return '\n'.join(i if isinstance(i,str) else i.get('text','') if isinstance(i,dict) else '' for i in c).strip()
            return ''
          def turns(row):
            out=[]
            for e in row.get('full_conversation') or []:
              if not isinstance(e,dict): continue
              u=e.get('user')
              if isinstance(u,dict):
                t=ctext(u).strip()
                if t: out.append(t)
              elif str(e.get('role') or '')=='user':
                t=ctext(e).strip()
                if t: out.append(t)
            return out
          privacy=re.compile(r'(?i)\b(?:ssn|social security number|credit card number|password|api key|private key)\b')
          higher=re.compile(r'(?is)\b(?:i prefer|my preference|remove|delete|forget|ignore previous|instead of|change my mind)\b')
          found=[]; seen=set(); raw=0
          for sh in SHARDS:
            p=hf_hub_download(REPO,filename=sh,repo_type='dataset',revision=REV)
            pf=pq.ParquetFile(p); cols=['id','evaluation_session_id','evaluation_order','language','is_code','full_conversation']; use=[c for c in cols if c in pf.schema_arrow.names]
            for b in pf.iter_batches(batch_size=512,columns=use):
              for row in b.to_pylist():
                raw+=1
                if row.get('language')!='en' or bool(row.get('is_code')): continue
                for ti,text in enumerate(turns(row)):
                  if not 24<=len(text)<=6000 or privacy.search(text): continue
                  for pi,(name,rx) in enumerate(pats):
                    m=rx.search(text)
                    if not m: continue
                    key=(str(row.get('id') or ''),ti)
                    if key in seen: break
                    seen.add(key); gd=m.groupdict(); s=max(0,m.start()-280); e=min(len(text),m.end()+360)
                    found.append({'sourceRowId':key[0],'sourceEvaluationSessionId':str(row.get('evaluation_session_id') or ''),'evaluationOrder':int(row.get('evaluation_order') or 0),'turnIndex':ti,'sourceLength':len(text),'pattern':name,'patternRank':pi,'actor':(gd.get('actor') or '').strip(),'relation':(gd.get('rel') or gd.get('verb') or '').strip(),'object':(gd.get('object') or '').strip(),'match':m.group(0),'context':text[s:e],'higherLaneRisk':bool(higher.search(text)),'sourceText':text,'assistantOutputsIncluded':False})
                    break
          assert raw==135634,raw
          found.sort(key=lambda x:(x['higherLaneRisk'],x['patternRank'],x['sourceLength'],x['sourceRowId'],x['turnIndex']))
          out=Path('temp-hiddenrubric/lane04/expanded-precise'); out.mkdir(parents=True,exist_ok=True)
          (out/'full.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in found[:500]),encoding='utf-8')
          compact=[{k:x[k] for k in ('sourceRowId','sourceEvaluationSessionId','turnIndex','sourceLength','pattern','actor','relation','object','match','context','higherLaneRisk')} for x in found[:500]]
          (out/'compact.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in compact),encoding='utf-8')
          counts={}
          for x in found: counts[x['pattern']]=counts.get(x['pattern'],0)+1
          (out/'manifest.json').write_text(json.dumps({'rawRows':raw,'matchedUniqueTurns':len(found),'materializedRows':min(500,len(found)),'patternCounts':counts,'sourceRevision':REV,'assistantOutputsIncluded':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('matched',len(found),counts)
          PY
      - name: Commit queue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/expanded-precise/
          git commit -m 'chore: materialize temporary Lane04 expanded precise queue'
          git push origin HEAD:main
