name: Arcane Circle repository purge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-circle-repository-purge.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcane-circle-repository-purge
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/arcane-circle
  TARGET_VERSION: 0.12.1-alpha.27

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Materialize clean current tree
        run: python3 .github/scripts/arcane_circle_purge_current.py

      - name: Remove residual dormant presentation references
        shell: bash
        run: |
          set -euo pipefail
          profile="$PROJECT_DIR/src/main/java/kr/moonseungjun/arcanecircle/magic/SpellPresentationProfile.java"
          if test -f "$profile"; then
            refs="$(grep -R --include='*.java' -l 'SpellPresentationProfile' "$PROJECT_DIR/src/main/java" | grep -v '/SpellPresentationProfile.java$' || true)"
            if test -z "$refs"; then
              echo 'Removing unreferenced SpellPresentationProfile legacy presentation table'
              rm -f "$profile"
              sed -i '/SpellPresentationProfile.class/d' .github/workflows/build-arcane-circle.yml
            else
              sed -i 's/The MidCircleVisualIdentity director owns their geometry/The current cinematic director owns their geometry/' "$profile"
              sed -i '/alpha\.2[0-9] phase/d' "$profile"
            fi
          fi
          sed -i 's/Ground-up presentation director for alpha\.26\./Current ground-up presentation director./' "$PROJECT_DIR/src/main/java/kr/moonseungjun/arcanecircle/client/SpellCinematicDirector.java"

      - name: Audit clean current tree
        working-directory: projects/arcane-circle
        run: |
          python3 tools/test_current_source.py
          git diff --check

      - name: Java 25 clean build
        working-directory: projects/arcane-circle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain
          test -f "build/libs/arcanecircle-$TARGET_VERSION.jar"
          python3 tools/verify_jar.py "build/libs/arcanecircle-$TARGET_VERSION.jar"

      - name: Commit verified purge to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git commit -m 'Clean Arcane Circle legacy presentation and tooling; alpha.27'
          git push origin HEAD:main
