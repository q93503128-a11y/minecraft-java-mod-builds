name: Arcane alpha76 apply

on:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write

jobs:
  apply:
    if: github.event.issue.title == 'arcane-alpha76-apply-now'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply and validate alpha.76
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/arcane-alpha76-patch.py

          rm -f \
            .github/workflows/arcane-alpha76-liveplay-fix.yml \
            .github/workflows/arcane-alpha76-issue-runner.yml \
            .github/workflows/arcane-alpha76-issue-runner-v2.yml \
            .github/workflows/arcane-alpha76-probe.yml \
            .github/workflows/arcane-alpha76-apply.yml \
            .github/arcane-alpha76-trigger.txt \
            .github/arcane-alpha76-probe-result.txt \
            .github/arcane-alpha76-patch.py

          python3 projects/arcane-circle/tools/test_current_source.py
          git diff --check
          test "$(find .github/workflows -maxdepth 1 -type f -iname '*arcane*.yml' | wc -l)" -eq 1
          test "$(find projects/arcane-circle/tools -maxdepth 1 -type f | wc -l)" -eq 2

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github projects/arcane-circle
          git commit -m 'Arcane alpha.76 live-play UI and Earthquake fix [skip ci]'

          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1

      - name: Dispatch canonical Arcane Java 25 build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build-arcane-circle.yml/dispatches" \
            -d '{"ref":"main"}'
