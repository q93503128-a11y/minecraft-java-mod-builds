name: Patch Living Kingdoms workforce hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_living_kingdoms_workforce_hardening.py'
      - '.github/workflows/patch-living-kingdoms-workforce-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply workforce hardening
        run: python .github/scripts/patch_living_kingdoms_workforce_hardening.py
      - name: Commit patch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorWorkforceManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'Harden exterior workforce catch-up and materialisation'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
