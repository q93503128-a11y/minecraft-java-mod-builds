name: Frontier Runtime Construction Scenario QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-runtime-scenario-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  runtime-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Fix temporary patch sequencing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/frontier-settlement/tools/apply_construction_navigation_hardening.py')
          s = p.read_text(encoding='utf-8')
          start = s.index("s = once(s,\n'''            builder.getNavigation().moveTo(source")
          end = s.index('\n\n# Build-material staging', start)
          block = s[start:end]
          block = block.replace('s = once(s,', 's = s.replace(', 1)
          suffix = ", 'terrain source movement')"
          if not block.endswith(suffix):
              raise SystemExit('terrain source movement block shape changed')
          block = block[:-len(suffix)] + ', 1)'
          p.write_text(s[:start] + block + s[end:], encoding='utf-8')
          PY
      - name: Apply construction navigation hardening
        shell: bash
        run: python projects/frontier-settlement/tools/apply_construction_navigation_hardening.py
      - name: Reject stale collision paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java')
          s = p.read_text(encoding='utf-8')
          old = '        return path != null && path.canReach() ? path : null;'
          new = '''        if (path == null || !path.canReach() || path.getEndNode() == null
                          || !path.getEndNode().asBlockPos().equals(target)) return null;
                  if (!(builder.level() instanceof ServerLevel level) || !pathNodesCurrentlyClear(level, path)) return null;
                  return path;'''
          if s.count(old) != 1:
              raise SystemExit(f'createReachablePath return count={s.count(old)}')
          s = s.replace(old, new, 1)
          anchor = '    private static boolean canReachInteraction(ServerLevel level, FrontierWorkerEntity builder, BlockPos target) {'
          helper = '''    private static boolean pathNodesCurrentlyClear(ServerLevel level, Path path) {
              for (int i = 0; i < path.getNodeCount(); i++) {
                  BlockPos feet = path.getNode(i).asBlockPos();
                  BlockPos head = feet.above();
                  if (!level.hasChunkAt(feet) || !level.hasChunkAt(head)) return false;
                  if (level.getBlockEntity(feet) != null || level.getBlockEntity(head) != null) return false;
                  BlockState feetState = level.getBlockState(feet);
                  BlockState headState = level.getBlockState(head);
                  if (!feetState.getFluidState().isEmpty() || !headState.getFluidState().isEmpty()) return false;
                  if (blocksCurrentPathCell(level, feet, feetState) || blocksCurrentPathCell(level, head, headState)) return false;
              }
              return true;
          }

          private static boolean blocksCurrentPathCell(ServerLevel level, BlockPos pos, BlockState state) {
              if (state.isAir() || state.canBeReplaced()) return false;
              return !state.getCollisionShape(level, pos).isEmpty();
          }

          '''
          if s.count(anchor) != 1:
              raise SystemExit(f'helper anchor count={s.count(anchor)}')
          s = s.replace(anchor, helper + anchor, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Static navigation assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java').read_text(encoding='utf-8')
          assert 'path.canReach()' in s
          assert 'path.getEndNode().asBlockPos().equals(target)' in s
          assert 'pathNodesCurrentlyClear' in s
          assert 'blocksCurrentPathCell' in s
          assert 'moveTowardInteraction' in s
          assert 'findReachableExtractionTarget' in s
          assert 'findReachableDepositTarget' in s
          assert 'hasWalkableScaffoldEntry' in s
          assert s.count('getNavigation().moveTo(') == 1
          st = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementStorageService.java').read_text(encoding='utf-8')
          assert 'findDepositTargetExcluding' in st
          PY
      - name: Java 25 clean build
        shell: bash
        run: |
          cd projects/frontier-settlement
          ./gradlew clean build --no-daemon
      - name: Prepare headless server
        shell: bash
        run: |
          mkdir -p projects/frontier-settlement/run/server
          printf 'eula=true\n' > projects/frontier-settlement/run/server/eula.txt
      - name: Run runtime construction scenarios
        shell: bash
        env:
          FRONTIER_RUNTIME_QA: '1'
        run: |
          set -o pipefail
          cd projects/frontier-settlement
          timeout 240 ./gradlew runServer --no-daemon 2>&1 | tee ../../frontier-runtime-scenario-qa.log
          grep -q 'FRONTIER_CONSTRUCTION_RUNTIME_QA_V2' ../../frontier-runtime-scenario-qa.log
          grep -q 'RUNTIME_QA_TOTAL checks=.* failures=0' ../../frontier-runtime-scenario-qa.log
      - name: Commit verified production changes
        shell: bash
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementStorageService.java
          if git diff --cached --quiet; then
            echo 'No production source change to commit'
          else
            git commit -m 'Harden Frontier construction navigation reachability'
            git push origin HEAD:main
          fi
      - name: Upload runtime report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-runtime-construction-qa-v3
          path: frontier-runtime-scenario-qa.log
          if-no-files-found: warn
