name: Validate Living Kingdoms regional governance r1

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/validate-living-kingdoms-regional-governance-r1.yml'

concurrency:
  group: living-kingdoms-regional-governance-r1-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'

jobs:
  validate:
    name: Java 25 / fresh governance server / JAR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build --stacktrace --console=plain

      - name: Fresh dedicated server regional governance audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          rm -rf run/world run/living_realm run/livingkingdoms-regional-governance-ci-world
          printf 'level-name=livingkingdoms-regional-governance-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/regional-governance-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          passed=0
          for attempt in $(seq 1 1400); do
            if grep -Eq 'LK_REALM_DIAGNOSTIC_FAIL|Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError|Invalid Erden regional' ../../logs/regional-governance-server.log; then
              cat ../../logs/regional-governance-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_REGIONAL_GOVERNANCE_PASS revision=1 councils=6 officials=12 guard_posts=12 alive_guards=12' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_GOVERNANCE_PHYSICAL_PASS revision=1 settlement=harvest_crossing guards=2 equipped_guards=2 billet_guards=2' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_ROAD_SECURITY_PASS revision=1 waystations=4 assigned_settlements=6 covered_waystations=4' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_SETTLEMENT_PASS revision=1 settlements=6 buildings=60' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_SOCIETY_PASS revision=1 settlements=6 households=48 residents=144 workers=96 dependents=48' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_ECONOMY_PASS revision=1 settlements=6 households=48 markets=6' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_ROADS_PASS revision=1 corridors=8 waystations=4' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_LOGISTICS_PASS revision=1 corridors=8 waystations=4' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_POPULATION_DIAGNOSTIC_PASS households=77 residents=231 workers=154' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/regional-governance-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_WORKFORCE_PASS revision=1 nodes=18 households=74 residents=216 workers=142 dependents=74' ../../logs/regional-governance-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/regional-governance-server.log
              exit 1
            fi
            sleep 1
          done
          cat ../../logs/regional-governance-server.log
          test "$passed" -eq 1

          grep -F 'LK_ERDEN_REGIONAL_GOVERNANCE_PASS revision=1 councils=6 officials=12 guard_posts=12 alive_guards=12' ../../logs/regional-governance-server.log \
            | grep -F 'production_assessed_tax=true' \
            | grep -F 'village_treasury=true' \
            | grep -F 'public_contracts=true' \
            | grep -F 'guard_payroll=true' \
            | grep -F 'casualty_replacement=true' \
            | grep -F 'watch_house_billet=true' \
            | grep -F 'shift_patrol=true' \
            | grep -F 'road_gateway_coverage=true' \
            | grep -F 'hostile_incident_detection=true' \
            | grep -F 'navigation_only=true' \
            | grep -F 'loaded_route_guard=true' \
            | grep -F 'aggregate_when_unloaded=true' \
            | grep -F 'persistent_forced_chunks=false'

          grep -F 'LK_ERDEN_REGIONAL_GOVERNANCE_PHYSICAL_PASS revision=1 settlement=harvest_crossing guards=2 equipped_guards=2 billet_guards=2' ../../logs/regional-governance-server.log \
            | grep -F 'probe_chunks=9' \
            | grep -F 'physical_watch_house=true' \
            | grep -F 'roster_entity_identity=true' \
            | grep -F 'persistent_equipment=true' \
            | grep -F 'transient_probe_released=true' \
            | grep -F 'navigation_runtime_wired=true' \
            | grep -F 'combat_runtime_wired=true' \
            | grep -F 'persistent_forced_chunks=false'

          grep -F 'LK_ERDEN_REGIONAL_ROAD_SECURITY_PASS revision=1 waystations=4 assigned_settlements=6 covered_waystations=4' ../../logs/regional-governance-server.log \
            | grep -F 'village_guard_roster=true' \
            | grep -F 'aggregate_road_watch=true' \
            | grep -F 'loaded_waystation_incident_detection=true' \
            | grep -F 'council_incident_accounting=true' \
            | grep -F 'no_chunk_loading=true' \
            | grep -F 'persistent_forced_chunks=false'

      - name: JAR verification
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          unzip -t "$jar"
          entries="$(mktemp)"
          unzip -Z1 "$jar" > "$entries"
          test "$(sort "$entries" | uniq -d | wc -l)" -eq 0
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalGovernanceSavedData.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalGovernanceManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalGovernancePhysicalAudit.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalRoadSecurityManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalGuardCombatManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalTransportManager.class' "$entries"
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-alpha.12"'

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-regional-governance-pr-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
