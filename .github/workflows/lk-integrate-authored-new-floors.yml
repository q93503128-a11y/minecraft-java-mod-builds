name: Integrate Living Kingdoms authored new floors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lk-integrate-authored-new-floors.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Merge new-floor eligibility into authored upper-route facade
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          route_path = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredUpperRouteManager.java')
          text = route_path.read_text(encoding='utf-8')

          replacements = [
          ('''    public static int eligibleCount() {
                  bootstrap();
                  return ROUTES.size();
              }
          ''', '''    public static int eligibleCount() {
                  bootstrap();
                  return ROUTES.size() + ErdenUrbanAuthoredNewFloorManager.eligibleCount();
              }
          '''),
          ('''    public static boolean isEligible(ExternalUrbanFabricBuilder.UrbanEntrance entrance) {
                  bootstrap();
                  return ROUTES.containsKey(entranceKey(entrance.x(), entrance.z()));
              }
          ''', '''    public static boolean isEligible(ExternalUrbanFabricBuilder.UrbanEntrance entrance) {
                  bootstrap();
                  long key = entranceKey(entrance.x(), entrance.z());
                  return ROUTES.containsKey(key)
                          || ErdenUrbanAuthoredNewFloorManager.isEligible(entrance);
              }
          '''),
          ('''    public static boolean isPrepared(
                      ServerLevel level, ExternalUrbanFabricBuilder.UrbanEntrance entrance) {
                  bootstrap();
                  long key = entranceKey(entrance.x(), entrance.z());
                  if (!ROUTES.containsKey(key)) return false;
                  return level.getDataStorage().computeIfAbsent(ErdenUrbanAuthoredUpperRouteSavedData.TYPE)
                          .isPrepared(key, ROUTE_REVISION);
              }
          ''', '''    public static boolean isPrepared(
                      ServerLevel level, ExternalUrbanFabricBuilder.UrbanEntrance entrance) {
                  bootstrap();
                  long key = entranceKey(entrance.x(), entrance.z());
                  if (!ROUTES.containsKey(key)) {
                      return ErdenUrbanAuthoredNewFloorManager.isPrepared(level, entrance);
                  }
                  return level.getDataStorage().computeIfAbsent(ErdenUrbanAuthoredUpperRouteSavedData.TYPE)
                          .isPrepared(key, ROUTE_REVISION);
              }
          '''),
          ('''    public static boolean isCompleted(
                      ServerLevel level, ExternalUrbanFabricBuilder.UrbanEntrance entrance) {
                  bootstrap();
                  long key = entranceKey(entrance.x(), entrance.z());
                  if (!ROUTES.containsKey(key)) return false;
                  return level.getDataStorage().computeIfAbsent(ErdenUrbanAuthoredUpperRouteSavedData.TYPE)
                          .isCompleted(key, ROUTE_REVISION);
              }
          ''', '''    public static boolean isCompleted(
                      ServerLevel level, ExternalUrbanFabricBuilder.UrbanEntrance entrance) {
                  bootstrap();
                  long key = entranceKey(entrance.x(), entrance.z());
                  if (!ROUTES.containsKey(key)) {
                      return ErdenUrbanAuthoredNewFloorManager.isCompleted(level, entrance);
                  }
                  return level.getDataStorage().computeIfAbsent(ErdenUrbanAuthoredUpperRouteSavedData.TYPE)
                          .isCompleted(key, ROUTE_REVISION);
              }
          '''),
          ('''        PlacementRoute route = ROUTES.get(key);
                  if (route == null) return null;
                  ErdenUrbanAuthoredUpperRouteSavedData data = level.getDataStorage()
                          .computeIfAbsent(ErdenUrbanAuthoredUpperRouteSavedData.TYPE);
                  if (!data.isCompleted(key, ROUTE_REVISION)) return null;
                  return route.target().pos();
          ''', '''        PlacementRoute route = ROUTES.get(key);
                  if (route == null) {
                      return ErdenUrbanAuthoredNewFloorManager.verifiedUpperTarget(level, entrance);
                  }
                  ErdenUrbanAuthoredUpperRouteSavedData data = level.getDataStorage()
                          .computeIfAbsent(ErdenUrbanAuthoredUpperRouteSavedData.TYPE);
                  if (!data.isCompleted(key, ROUTE_REVISION)) return null;
                  return route.target().pos();
          '''),
          ('''        PlacementRoute route = ROUTES.get(entranceKey(entrance.x(), entrance.z()));
                  if (route == null) {
                      throw new IllegalStateException("Entrance has no authored upper route: "
                              + entrance.x() + "," + entrance.z());
                  }
                  if (!verify(level, route)) {
          ''', '''        PlacementRoute route = ROUTES.get(entranceKey(entrance.x(), entrance.z()));
                  if (route == null) {
                      if (ErdenUrbanAuthoredNewFloorManager.isEligible(entrance)) {
                          ErdenUrbanAuthoredNewFloorManager.verifyOrThrow(level, entrance);
                          return;
                      }
                      throw new IllegalStateException("Entrance has no authored upper route: "
                              + entrance.x() + "," + entrance.z());
                  }
                  if (!verify(level, route)) {
          ''')]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'authored-route patch anchor count={count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
          route_path.write_text(text, encoding='utf-8')

          audit_path = Path('.github/workflows/audit-living-kingdoms-exterior-inventory.yml')
          audit = audit_path.read_text(encoding='utf-8')
          old = 'LK_ERDEN_EXTERIOR_INVENTORY_PASS revision=1 nodes=15 containers=15'
          new = 'LK_ERDEN_EXTERIOR_INVENTORY_PASS revision=2 nodes=15 containers=15'
          if audit.count(old) != 1:
              raise SystemExit(f'exterior inventory revision anchor count={audit.count(old)}')
          audit_path.write_text(audit.replace(old, new, 1), encoding='utf-8')

          Path('.github/workflows/lk-integrate-authored-new-floors.yml').unlink()
          PY

      - name: Java 25 compile integrated source
        working-directory: projects/living-kingdoms
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Commit integrated source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredUpperRouteManager.java \
                  .github/workflows/audit-living-kingdoms-exterior-inventory.yml \
                  .github/workflows/lk-integrate-authored-new-floors.yml
          git commit -m 'feat(living-kingdoms): integrate authored void upper floors'
          git push origin HEAD:main
