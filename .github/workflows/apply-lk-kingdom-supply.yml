name: Apply Living Kingdoms kingdom supply integration

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply-lk-kingdom-supply.py'
      - '.github/workflows/apply-lk-kingdom-supply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source integration
        run: python .github/scripts/apply-lk-kingdom-supply.py

      - name: Commit source integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java
          git commit -m "Connect Erden capital economy to kingdom supply convoys"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            git reset --hard HEAD~1
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/apply-lk-kingdom-supply.py
            git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java
            git commit -m "Connect Erden capital economy to kingdom supply convoys"
            sleep $((attempt * 2))
          done
          exit 1
