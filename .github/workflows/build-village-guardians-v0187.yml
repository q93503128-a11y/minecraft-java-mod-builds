name: Build Village Guardians v0.18.7 Balance UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger-v0187'

permissions:
  contents: read

env:
  PROJECT_DIR: projects/village-guardians
  BUILD_VERSION: 0.18.7-alpha.1
  EXPECTED_JAR: villageguardians-0.18.7-alpha.1.jar

jobs:
  build:
    name: Java 25 / NeoForge 26.2 balance UI build
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Run deterministic contract tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for test in \
            tools/test_rpg_balance.py \
            tools/test_village_zone.py \
            tools/test_progression_loop.py \
            tools/test_progression_depth.py \
            tools/test_fortress_layout.py \
            tools/test_runtime_safety.py \
            tools/test_ui_layout_contract.py \
            tools/test_interaction_contract.py \
            tools/test_v0187_balance_ui.py \
            tools/test_action_layout.py \
            tools/test_enemy_content.py; do
            if test -f "$test"; then python3 "$test"; fi
          done

      - name: Clean NeoForge build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache -Pmod_version="$BUILD_VERSION" clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0187-gradle.log"

      - name: Verify runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables/"
          if test -f "build/libs/$EXPECTED_JAR.sha256"; then
            cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables/"
          else
            sha256sum "build/libs/$EXPECTED_JAR" > "$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR.sha256"
          fi

      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.18.7-alpha.1
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Gradle log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: villageguardians-v0187-build-log
          path: village-guardians-v0187-gradle.log
          if-no-files-found: ignore
          retention-days: 7
