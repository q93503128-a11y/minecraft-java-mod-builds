name: Survival Ascension 0.54 push runner

on:
  push:
    paths:
      - '.sa054-run'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Extract applicator and validate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/sa054-apply.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = src.index(start_marker) + len(start_marker)
          end = src.index(end_marker, start)
          lines = src[start:end].splitlines()
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/sa054_apply.py').write_text(code, encoding='utf-8')
          compile(code, '/tmp/sa054_apply.py', 'exec')
          PY
          python3 /tmp/sa054_apply.py
          rm -f .github/workflows/sa054-apply.yml .github/workflows/sa054-push.yml .sa054-run

          cd projects/survival-ascension
          chmod +x gradlew
          python3 tools/test_release_source.py | tee /tmp/sa054-source.log
          python3 tools/test_release_content_pack.py | tee /tmp/sa054-content.log
          python3 -m py_compile tools/build_mrpack.py tools/test_current_source.py tools/test_content_pack_source.py tools/test_release_source.py tools/test_release_content_pack.py tools/verify_jar.py tools/verify_release_jar.py
          git diff --check
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain | tee /tmp/sa054-gradle.log
          python3 tools/verify_release_jar.py build/libs/survivalascension-0.54.0-alpha.1.jar | tee /tmp/sa054-jar.log
          python3 tools/build_mrpack.py --survival-jar build/libs/survivalascension-0.54.0-alpha.1.jar --output /tmp/Survival-Ascension-0.54.0-alpha.1-content-preview.mrpack | tee /tmp/sa054-pack.log
          jar_sha="$(sha256sum build/libs/survivalascension-0.54.0-alpha.1.jar | awk '{print $1}')"
          pack_sha="$(sha256sum /tmp/Survival-Ascension-0.54.0-alpha.1-content-preview.mrpack | awk '{print $1}')"
          echo "SA054_JAR_SHA=${jar_sha}"
          echo "SA054_MRPACK_SHA=${pack_sha}"
          cd ../..

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/survival-ascension .github/workflows/sa054-apply.yml .github/workflows/sa054-push.yml .sa054-run
          git commit -m 'Survival Ascension 0.54 mace impact ascension'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
