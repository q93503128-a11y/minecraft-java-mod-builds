name: Build Shader Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/shader-lab/**'
      - '.github/workflows/build-shader-lab.yml'

permissions:
  contents: write

concurrency:
  group: shader-lab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: projects/shader-lab

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate Gradle wrapper
        id: wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1 --distribution-type bin
          chmod +x gradlew

      - name: Prepare persistent log directories
        run: mkdir -p ci-logs build/deliverables

      - name: Verify toolchain
        id: toolchain
        run: |
          set -o pipefail
          {
            java -version
            ./gradlew --version
          } 2>&1 | tee ci-logs/toolchain.log

      - name: Clean build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ci-logs/clean-build.log

      - name: Inspect executable JAR
        id: jarcheck
        if: steps.build.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          python3 scripts/verify_jar.py build/libs/shaderlab-0.1.0-alpha.1.jar 2>&1 | tee ci-logs/jar-verification.log

      - name: Assemble report and deliverables
        if: steps.build.outcome == 'success' && steps.jarcheck.outcome == 'success'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          JAR="build/libs/shaderlab-0.1.0-alpha.1.jar"
          SHA_FILE="${JAR}.sha256"
          {
            echo "# Build and Runtime Report"
            echo
            echo "- Commit: ${COMMIT_SHA}"
            echo "- Project: Shader Lab"
            echo "- Version: 0.1.0-alpha.1"
            echo "- Minecraft: 26.2"
            echo "- Java: 25"
            echo "- NeoForge: 26.2.0.38-beta"
            echo "- Gradle: 9.2.1"
            echo "- Clean build: PASS"
            echo "- Shader resource contract: PASS"
            echo "- JAR inspection: PASS"
            echo "- Datagen: NOT APPLICABLE"
            echo "- GameTest: NOT APPLICABLE"
            echo "- Dedicated server smoke test: NOT APPLICABLE (client-only)"
            echo "- Interactive client visual test: NOT RUN"
            echo
            echo "## JAR verification"
            echo
            echo '```text'
            cat build/reports/jar-verification.txt
            echo '```'
          } > build/BUILD_AND_RUNTIME_REPORT.md

          cp "$JAR" build/deliverables/
          cp "$SHA_FILE" build/deliverables/
          cp build/BUILD_AND_RUNTIME_REPORT.md build/deliverables/

      - name: Upload deliverables
        if: steps.build.outcome == 'success' && steps.jarcheck.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: shader-lab-0.1.0-alpha.1-deliverables
          path: projects/shader-lab/build/deliverables/
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-lab-0.1.0-alpha.1-logs
          path: projects/shader-lab/ci-logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Record CI result
        if: always()
        env:
          SOURCE_SHA: ${{ github.sha }}
          WRAPPER_OUTCOME: ${{ steps.wrapper.outcome }}
          TOOLCHAIN_OUTCOME: ${{ steps.toolchain.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          JAR_OUTCOME: ${{ steps.jarcheck.outcome }}
        run: |
          cat > BUILD_AND_RUNTIME_REPORT.md <<REPORT
          # Shader Lab Build and Runtime Report

          - Source commit: ${SOURCE_SHA}
          - Mod version: 0.1.0-alpha.1
          - Minecraft: 26.2
          - Java: 25
          - Gradle: 9.2.1
          - NeoForge: 26.2.0.38-beta
          - Wrapper generation: ${WRAPPER_OUTCOME}
          - Toolchain verification: ${TOOLCHAIN_OUTCOME}
          - Clean build: ${BUILD_OUTCOME}
          - Shader resource and JAR verification: ${JAR_OUTCOME}
          - Datagen: NOT APPLICABLE
          - GameTest: NOT APPLICABLE — GPU post-processing cannot be validated by server GameTest
          - Dedicated server smoke test: NOT APPLICABLE — client-only mod
          - Interactive client visual test: NOT RUN — requires a real game window and GPU

          A successful build proves compilation and JAR structure only. Final visual compatibility is decided by the in-game test.
          REPORT

          if [ -f build/reports/jar-verification.txt ]; then
            {
              echo
              echo '## JAR verification'
              echo '```text'
              cat build/reports/jar-verification.txt
              echo '```'
            } >> BUILD_AND_RUNTIME_REPORT.md
          fi

          if [ -f ci-logs/clean-build.log ]; then
            {
              echo
              echo '## Clean-build log tail'
              echo '```text'
              tail -n 180 ci-logs/clean-build.log
              echo '```'
            } >> BUILD_AND_RUNTIME_REPORT.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_AND_RUNTIME_REPORT.md

          if [ "${BUILD_OUTCOME}" = "success" ] && [ "${JAR_OUTCOME}" = "success" ]; then
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          fi

          if git diff --cached --quiet; then
            echo "No Shader Lab CI records changed."
            exit 0
          fi

          git commit -m "Record Shader Lab CI result for ${SOURCE_SHA:0:7}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Enforce validation result
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          JAR_OUTCOME: ${{ steps.jarcheck.outcome }}
        run: |
          if [ "${BUILD_OUTCOME}" != "success" ] || [ "${JAR_OUTCOME}" != "success" ]; then
            echo "Shader Lab validation failed: build=${BUILD_OUTCOME}, jar=${JAR_OUTCOME}"
            exit 1
          fi
