name: Build Shader Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/shader-lab/**'
      - '.github/workflows/build-shader-lab.yml'

permissions:
  contents: read

concurrency:
  group: shader-lab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: projects/shader-lab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate Gradle wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1 --distribution-type bin
          chmod +x gradlew

      - name: Prepare log directories
        run: mkdir -p build/logs build/reports build/deliverables

      - name: Verify toolchain
        run: |
          set -o pipefail
          {
            java -version
            ./gradlew --version
          } 2>&1 | tee build/logs/toolchain.log

      - name: Clean build
        id: build
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee build/logs/clean-build.log

      - name: Inspect executable JAR
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python3 scripts/verify_jar.py build/libs/shaderlab-0.1.0-alpha.1.jar 2>&1 | tee build/logs/jar-verification.log

      - name: Assemble report and deliverables
        if: steps.build.outcome == 'success'
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          JAR="build/libs/shaderlab-0.1.0-alpha.1.jar"
          SHA_FILE="${JAR}.sha256"
          {
            echo "# Build and Runtime Report"
            echo
            echo "- Commit: ${COMMIT_SHA}"
            echo "- Project: Shader Lab"
            echo "- Version: 0.1.0-alpha.1"
            echo "- Minecraft: 26.2"
            echo "- Java: 25"
            echo "- NeoForge: 26.2.0.38-beta"
            echo "- Gradle: 9.2.1"
            echo "- clean build: PASS"
            echo "- Shader resource contract: PASS"
            echo "- JAR inspection: PASS"
            echo "- Datagen: NOT APPLICABLE"
            echo "- GameTest: NOT APPLICABLE"
            echo "- Dedicated server smoke test: NOT APPLICABLE (client-only)"
            echo "- Interactive client visual test: NOT RUN"
            echo
            echo "## JAR verification"
            echo
            echo '```text'
            cat build/reports/jar-verification.txt
            echo '```'
          } > build/BUILD_AND_RUNTIME_REPORT.md

          cp "$JAR" build/deliverables/
          cp "$SHA_FILE" build/deliverables/
          cp build/BUILD_AND_RUNTIME_REPORT.md build/deliverables/

      - name: Upload deliverables
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: shader-lab-0.1.0-alpha.1-deliverables
          path: projects/shader-lab/build/deliverables/
          if-no-files-found: error
          retention-days: 14

      - name: Upload raw logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-lab-0.1.0-alpha.1-logs
          path: projects/shader-lab/build/logs/
          if-no-files-found: warn
          retention-days: 14
