name: Build Shader Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/shader-lab/**'
      - '.github/workflows/build-shader-lab.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/shader-lab/**'
      - '.github/workflows/build-shader-lab.yml'

permissions:
  contents: read

concurrency:
  group: shader-lab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: projects/shader-lab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Read metadata
        run: |
          echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1 --distribution-type bin
          chmod +x gradlew

      - name: Normalize pinned Noble fog matchers
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/prepare_noble.py")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  r'''        (r"float\s+densityMult\s*=\s*mix\(0\.0?3,\s*0\.7,\s*biome_may_sandstorm\);", "float densityMult     = mix(0.95, 1.0, biome_may_sandstorm);", "fog density multiplier"),''',
                  r'''        (r"^[ \t]*float\s+densityMult\s*=\s*[^;]+;[ \t]*$", "float densityMult     = mix(0.95, 1.0, biome_may_sandstorm);", "fog density multiplier"),''',
              ),
              (
                  r'''            r"(?P<i>^[ \t]*)shapeNoise\s*\*=\s*smoothstep\(\s*0\.0\s*,\s*1\.0\s*,\s*exp\(\s*-abs\(\s*position\.y\s*-\s*fogAltitude\s*\)\s*\*\s*0\.0?3\s*\)\s*\)\s*;\s*$",''',
                  r'''            r"(?P<i>^[ \t]*)shapeNoise\s*\*=\s*[^;]*fogAltitude[^;]*;[ \t]*$",''',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f"Expected pinned Noble matcher was not found: {old[:80]}")
              source = source.replace(old, new, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Clean single-JAR build
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ci-logs/clean-build.log

      - name: Flatten bundled Sodium module
        run: |
          set -o pipefail
          python3 scripts/flatten_sodium_in_final_jar.py "build/libs/shaderlab-${MOD_VERSION}.jar" \
            2>&1 | tee ci-logs/sodium-flatten.log

      - name: Verify final single JAR
        run: |
          set -o pipefail
          python3 scripts/verify_jar.py "build/libs/shaderlab-${MOD_VERSION}.jar" \
            2>&1 | tee ci-logs/jar-verification.log

      - name: Stage only the JAR
        run: |
          JAR="build/libs/shaderlab-${MOD_VERSION}.jar"
          test -f "$JAR"
          mkdir -p build/deliverables
          cp "$JAR" build/deliverables/

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: shaderlab-${{ env.MOD_VERSION }}-jar
          path: projects/shader-lab/build/deliverables/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shaderlab-${{ env.MOD_VERSION }}-logs
          path: projects/shader-lab/ci-logs/
          if-no-files-found: warn
          retention-days: 14
