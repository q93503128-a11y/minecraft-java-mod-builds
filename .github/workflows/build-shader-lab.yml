name: Build Shader Lab

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/shader-lab/**'
      - '.github/workflows/build-shader-lab.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/shader-lab/**'
      - '.github/workflows/build-shader-lab.yml'

permissions:
  contents: read

concurrency:
  group: shader-lab-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: projects/shader-lab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Read metadata
        run: |
          echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_ENV"
          echo "SARP_VERSION_ID=$(grep '^sarp_version_id=' gradle.properties | cut -d= -f2-)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Generate wrapper
        run: |
          gradle wrapper --gradle-version 9.2.1 --distribution-type bin
          chmod +x gradlew

      - name: Clean build and Sarp source audit
        run: |
          mkdir -p ci-logs
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee ci-logs/clean-build.log

      - name: Verify final JAR
        run: |
          set -o pipefail
          python3 scripts/verify_jar.py "build/libs/shaderlab-${MOD_VERSION}.jar" \
            2>&1 | tee ci-logs/jar-verification.log

      - name: Download official Iris and Sodium 26.2 JARs
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import urllib.request
          import zipfile

          targets = [
              ("bXt6zsZT", "iris-1.11.2+26.2-neoforge.jar"),
              ("KHPycol7", "sodium-0.9.1+26.2-neoforge.jar"),
          ]
          output = pathlib.Path("build/test-kit/mods")
          output.mkdir(parents=True, exist_ok=True)
          headers = {"User-Agent": "ShaderLab-private-build/0.5"}

          for version_id, filename in targets:
              request = urllib.request.Request(
                  f"https://api.modrinth.com/v2/version/{version_id}", headers=headers
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  metadata = json.load(response)
              files = metadata.get("files") or []
              if not files:
                  raise RuntimeError(f"No files for Modrinth version {version_id}")
              selected = next((item for item in files if item.get("primary")), files[0])
              request = urllib.request.Request(selected["url"], headers=headers)
              destination = output / filename
              with urllib.request.urlopen(request, timeout=120) as response:
                  destination.write_bytes(response.read())
              with zipfile.ZipFile(destination) as jar:
                  if "META-INF/neoforge.mods.toml" not in set(jar.namelist()):
                      raise RuntimeError(f"Not a NeoForge mod JAR: {destination}")
              print(destination, destination.stat().st_size)
          PY

      - name: Assemble private test kit
        run: |
          mkdir -p build/test-kit/mods build/deliverables
          JAR="build/libs/shaderlab-${MOD_VERSION}.jar"
          cp "$JAR" build/test-kit/mods/
          cp "${JAR}.sha256" build/test-kit/
          cp build/reports/jar-verification.txt build/test-kit/
          cp build/reports/sarp-source-audit.txt build/test-kit/
          cat > build/test-kit/INSTALL.txt <<'TXT'
          Shader Lab Dreamscape 0.5 private test

          1. Delete every older shaderlab JAR from the instance mods folder.
          2. Copy all three JAR files from this kit's mods folder into the instance mods folder.
          3. Start Minecraft. Shader Lab installs and selects ShaderLab-Dreamscape-0.5.zip.
          4. Restart once if Iris read its configuration before Shader Lab on the first launch.
          5. Shader Lab 0.3 and 0.4 must not remain installed.
          TXT
          (cd build/test-kit && zip -qr "../shader-lab-${MOD_VERSION}-test-kit.zip" .)
          cp "$JAR" build/deliverables/
          cp "${JAR}.sha256" build/deliverables/
          cp build/reports/jar-verification.txt build/deliverables/
          cp build/reports/sarp-source-audit.txt build/deliverables/
          cp "build/shader-lab-${MOD_VERSION}-test-kit.zip" build/deliverables/

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: shader-lab-${{ env.MOD_VERSION }}-deliverables
          path: projects/shader-lab/build/deliverables/
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-lab-${{ env.MOD_VERSION }}-logs
          path: projects/shader-lab/ci-logs/
          if-no-files-found: warn
          retention-days: 14
