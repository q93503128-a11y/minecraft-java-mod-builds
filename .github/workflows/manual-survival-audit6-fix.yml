name: Manual Survival Audit 6 Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-audit6-fix.yml'

permissions:
  contents: write

jobs:
  audit-fix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply freight manifest status fix
        run: python3 .github/scripts/survival_audit6_fix.py

      - name: Logistics lifecycle contract audit
        shell: bash
        run: |
          set -euo pipefail
          F=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/production/FreightService.java
          S=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/SurvivalAscension.java
          grep -Fq '" · 연료" + FRONTLINE_FUEL + " · 통나무" + FRONTLINE_LOGS' "$F"
          grep -Fq 'FRONTLINE_FOOD = 60' "$F"
          grep -Fq 'FRONTLINE_IRON = 16' "$F"
          grep -Fq 'FRONTLINE_FUEL = 3' "$F"
          grep -Fq 'FRONTLINE_LOGS = 12' "$F"
          grep -Fq 'FRONTLINE_STONE_BRICKS = 32' "$F"
          ! grep -Fq '식량176 · 철56 · 연료8 · 통나무32 · 석재벽돌128' "$F"
          grep -Fq 'cart.getPersistentData()' "$F"
          grep -Fq 'cart.setChanged()' "$F"
          grep -Fq 'mod_version=0.61.5-alpha.1' projects/survival-ascension/gradle.properties
          grep -Fq 'VERSION = "0.61.5-alpha.1"' "$S"
          git diff --check
          echo LOGISTICS_LIFECYCLE_CONTRACT_OK

      - name: Resource JSON audit
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" >/dev/null
            count=$((count+1))
          done < <(find projects/frontier-settlement/src/main/resources projects/survival-ascension/src/main/resources -type f -name '*.json' -print0)
          echo "JSON_OK $count files"

      - name: Frontier Java 25 regression build
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build

      - name: Survival Java 25 clean build
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon clean build

      - name: JAR audit
        shell: bash
        run: |
          set -euo pipefail
          F=projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.92.jar
          S=projects/survival-ascension/build/libs/survivalascension-0.61.5-alpha.1.jar
          for jarfile in "$F" "$S"; do
            test -s "$jarfile"
            test -z "$(jar tf "$jarfile" | sort | uniq -d | head -n1 || true)"
            echo "JAR_OK $jarfile $(stat -c%s "$jarfile") bytes"
          done
          jar tf "$S" | grep -Fq 'kr/moonseungjun/survivalascension/production/FreightService.class'

      - name: Upload Survival replacement
        uses: actions/upload-artifact@v4
        with:
          name: survival-audit6-replacement
          path: projects/survival-ascension/build/libs/survivalascension-0.61.5-alpha.1.jar
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated fix and cleanup audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-frontier-survival-audit6.yml
          rm -f .github/workflows/manual-survival-audit6-fix.yml
          rm -f .github/scripts/survival_audit6_fix.py
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/survival-ascension .github/workflows/manual-frontier-survival-audit6.yml .github/workflows/manual-survival-audit6-fix.yml .github/scripts/survival_audit6_fix.py
          git commit -m "Fix Survival frontline freight manifest guidance"
          git pull --rebase origin main
          git push origin HEAD:main
