name: Smoke earth-to-stars Fabric client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/earth-to-stars/src/fabric/**'
      - 'projects/earth-to-stars/build.gradle'
      - 'projects/earth-to-stars/gradle.properties'
      - 'projects/earth-to-stars/settings.gradle'
      - '.github/workflows/smoke-earth-to-stars-client-resources.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/earth-to-stars

jobs:
  fabric-client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify Xvfb
        run: command -v xvfb-run

      - name: Prepare Fabric client runtime
        run: |
          chmod +x gradlew
          python3 tools/validate_fabric_standalone.py
          ./gradlew --no-daemon classes

      - name: Run Fabric client smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p build/logs

          set +e
          timeout --kill-after=15s 150s xvfb-run -a ./gradlew --no-daemon runClient --stacktrace 2>&1 | tee build/logs/fabric-client-smoke.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 && $status -ne 137 ]]; then
            echo "runClient exited unexpectedly with status $status"
            exit "$status"
          fi

          grep -q 'Fabric 26.2 standalone kernel loaded' build/logs/fabric-client-smoke.log
          if grep -Eqi 'Could not execute entrypoint|ModResolutionException|NoClassDefFoundError.*earthtostars|ClassNotFoundException.*earthtostars' build/logs/fabric-client-smoke.log; then
            echo 'EARTH TO STARS Fabric client integration error detected.'
            exit 1
          fi

          echo 'EARTH_TO_STARS_FABRIC_CLIENT_SMOKE_PASS'

      - name: Upload client smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-fabric-client-smoke-${{ github.sha }}
          path: projects/earth-to-stars/build/logs/fabric-client-smoke.log
          if-no-files-found: ignore
          retention-days: 7
