name: Smoke earth-to-stars client resources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/earth-to-stars/src/main/resources/assets/earth_to_stars/models/**'
      - 'projects/earth-to-stars/src/main/resources/assets/earth_to_stars/items/**'
      - 'projects/earth-to-stars/src/main/resources/assets/earth_to_stars/textures/**'
      - 'projects/earth-to-stars/gradle.properties'
      - '.github/workflows/smoke-earth-to-stars-client-resources.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/earth-to-stars

jobs:
  client-resource-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Verify Xvfb
        run: command -v xvfb-run
      - name: Run client model/resource smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          rm -rf run
          mkdir -p build/logs

          set +e
          timeout --kill-after=15s 120s xvfb-run -a ./gradlew --no-daemon runClient --stacktrace 2>&1 | tee build/logs/client-resource-smoke.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 && $status -ne 137 ]]; then
            echo "runClient exited unexpectedly with status $status"
            exit "$status"
          fi

          grep -q 'EARTH TO STARS 0.1.0-alpha.14 live-acceptance rescue systems loaded' build/logs/client-resource-smoke.log
          grep -q 'NeoForge mod loading, version 26.2.0.76, for MC 26.2' build/logs/client-resource-smoke.log

          if grep -Eqi 'Failed to load model earth_to_stars|IdentifierException: Non \[a-z0-9/\._-\] character|Cannot invoke "String\.charAt\(int\)" because "texture" is null|ObjGeometry.*(ERROR|Exception)|Unable to load model.*earth_to_stars|Missing texture references in model earth_to_stars|Missing texture.*earth_to_stars' build/logs/client-resource-smoke.log; then
            echo 'EARTH TO STARS client model/resource error detected.'
            exit 1
          fi

          echo 'EARTH_TO_STARS_ALPHA14_CLIENT_RESOURCE_SMOKE_PASS'
      - name: Upload client smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-alpha14-client-resource-smoke-log
          path: projects/earth-to-stars/build/logs/client-resource-smoke.log
          if-no-files-found: ignore
          retention-days: 7
