name: Smoke earth-to-stars reboot client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/earth-to-stars/src/reboot/resources/**'
      - 'projects/earth-to-stars/build.gradle'
      - 'projects/earth-to-stars/gradle.properties'
      - '.github/workflows/smoke-earth-to-stars-client-resources.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/earth-to-stars

jobs:
  reboot-client-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify Xvfb
        run: command -v xvfb-run
      - name: Prepare reboot client runtime
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon classes prepareClientRun
      - name: Run reboot client resource/model smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run
          mkdir -p build/logs

          set +e
          timeout --kill-after=15s 180s xvfb-run -a ./gradlew --no-daemon runClient --stacktrace 2>&1 | tee build/logs/reboot-client-smoke.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 && $status -ne 137 ]]; then
            echo "runClient exited unexpectedly with status $status"
            exit "$status"
          fi

          grep -q 'EARTH TO STARS 0.2.0-alpha.2 physical VS starter-craft bootstrap loaded' build/logs/reboot-client-smoke.log
          grep -q 'Forge mod loading, version 47.4.0, for MC 1.20.1' build/logs/reboot-client-smoke.log
          grep -q 'Reloading ResourceManager' build/logs/reboot-client-smoke.log
          grep -Eq 'minecraft:textures/atlas/blocks\.png-atlas' build/logs/reboot-client-smoke.log

          if grep -Eqi 'NoClassDefFoundError|ClassNotFoundException: .*earthtostars|ModLoadingException|MixinTransformerError|Failed to load model earth_to_stars|Unable to load model.*earth_to_stars|Missing texture references in model earth_to_stars|Missing texture.*earth_to_stars' build/logs/reboot-client-smoke.log; then
            echo 'EARTH TO STARS reboot client/runtime or resource error detected.'
            exit 1
          fi

          echo 'EARTH_TO_STARS_REBOOT_CLIENT_RESOURCE_MODEL_SMOKE_PASS'
      - name: Upload client smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-reboot-client-smoke-${{ github.sha }}
          path: projects/earth-to-stars/build/logs/reboot-client-smoke.log
          if-no-files-found: ignore
          retention-days: 7
