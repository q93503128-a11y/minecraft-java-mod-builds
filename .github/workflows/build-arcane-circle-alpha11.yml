name: Build Arcane Circle v0.12.1 Alpha.11 Visual Combat

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/arcane-circle/tools/alpha11_chunks/**'
      - '.github/workflows/build-arcane-circle-alpha11.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-alpha11-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/arcane-circle
  MOD_VERSION: 0.12.1-alpha.11
  EXPECTED_JAR: arcanecircle-0.12.1-alpha.11.jar
  PUBLISHED_DIR: published/arcane-circle
  CI_RESULT_DIR: ci-results/arcane-circle

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply alpha.11 visual combat migration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f tools/apply_v0121_alpha11_visual_combat_balance.py; then
            cat tools/alpha11_chunks/part* > tools/apply_v0121_alpha11_visual_combat_balance.py
          fi
          printf '%s  %s\n' '67bb700c7314da32d0cd5c3f96de74e0e286258e48cc4ccb9219a36e11e57ea0' 'tools/apply_v0121_alpha11_visual_combat_balance.py' | sha256sum -c -
          python3 tools/apply_v0121_alpha11_visual_combat_balance.py
          rm -rf tools/alpha11_chunks
          python3 tools/test_v0121_alpha11_visual_combat_balance.py
          git diff --check

      - name: Build Java 25 runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/arcane-circle-alpha11-gradle.log"

      - name: Verify JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          jar=Path('build/libs/arcanecircle-0.12.1-alpha.11.jar')
          with zipfile.ZipFile(jar) as z:
              names=set(z.namelist())
              required={
                  'kr/moonseungjun/arcanecircle/magic/MageGearService.class',
                  'kr/moonseungjun/arcanecircle/magic/CombatGrowthService.class',
                  'kr/moonseungjun/arcanecircle/world/ArcaneMageService.class',
                  'kr/moonseungjun/arcanecircle/client/WorldMagicTracker.class',
                  'kr/moonseungjun/arcanecircle/client/ArcaneGearRenderer.class',
                  'kr/moonseungjun/arcanecircle/client/SpellHudOverlay.class',
                  'kr/moonseungjun/arcanecircle/magic/SpellMetrics.class',
              }
              missing=required-names
              if missing: raise SystemExit(f'missing alpha.11 entries: {sorted(missing)}')
              checks={
                  'kr/moonseungjun/arcanecircle/magic/MageGearService.class':[b'maxManaPercent',b'maxHealthBonus',b'0.42'],
                  'kr/moonseungjun/arcanecircle/world/ArcaneMageService.class':[b'RETALIATION_TARGET',b'castResidentSpell'],
                  'kr/moonseungjun/arcanecircle/client/WorldMagicTracker.class':[b'renderRibbonBeam',b'renderVolumeCloud'],
                  'kr/moonseungjun/arcanecircle/client/ArcaneGearRenderer.class':[b'robeMotion'],
              }
              for path,tokens in checks.items():
                  raw=z.read(path)
                  for token in tokens:
                      if token not in raw: raise SystemExit(f'{path} missing {token!r}')
          print('Arcane Circle alpha.11 JAR audit: PASS')
          PY
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.12.1-alpha.11
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish source and JAR
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -rf /tmp/arcane-alpha11-source
          mkdir -p /tmp/arcane-alpha11-source
          rsync -a --delete --exclude '/build/' --exclude '/.gradle/' "$PROJECT_DIR/" /tmp/arcane-alpha11-source/
          published=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"
            rsync -a /tmp/arcane-alpha11-source/ "$PROJECT_DIR/"
            mkdir -p "$PUBLISHED_DIR"
            rm -f "$PUBLISHED_DIR"/arcanecircle-*.jar "$PUBLISHED_DIR"/arcanecircle-*.jar.sha256
            cp "deliverables/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
            cp "deliverables/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
            git add -A "$PROJECT_DIR" "$PUBLISHED_DIR"
            if git diff --cached --quiet; then published=1; break; fi
            git commit -m 'Publish Arcane Circle v0.12.1-alpha.11 visual combat balance [skip ci]'
            if git push origin HEAD:main; then published=1; break; fi
            sleep $((attempt*2))
          done
          test "$published" -eq 1

      - name: Record result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arcane-result
          mkdir -p /tmp/arcane-result
          if test -f "$GITHUB_WORKSPACE/arcane-circle-alpha11-gradle.log"; then cp "$GITHUB_WORKSPACE/arcane-circle-alpha11-gradle.log" /tmp/arcane-result/latest-gradle.log; else printf '%s\n' 'No Gradle log.' > /tmp/arcane-result/latest-gradle.log; fi
          cat > /tmp/arcane-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=$MOD_VERSION
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/arcane-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane Circle v0.12.1-alpha.11 CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
