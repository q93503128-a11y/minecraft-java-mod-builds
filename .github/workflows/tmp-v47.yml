name: Temporary v47 source applicator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-v47.yml'
      - '.github/scripts/tmp_arcane_alpha47_authority.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply reviewed source patch
        run: python3 .github/scripts/tmp_arcane_alpha47_authority.py
      - name: Commit project source only
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/tmp_arcane_alpha47_authority.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/arcane-circle .github/scripts/tmp_arcane_alpha47_authority.py
          git diff --cached --check
          git commit -m 'feat(arcane-circle): implement alpha.47 catastrophe and weather authority'
          git push origin HEAD:main

# trigger: alpha47-authority-pass
