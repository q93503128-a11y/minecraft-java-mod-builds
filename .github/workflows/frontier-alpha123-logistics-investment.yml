name: Frontier Alpha.123 Logistics Investment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha123-logistics-investment.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Alpha.123
        run: |
          set -euo pipefail
          python3 .github/alpha123/patch_runtime.py
          python3 .github/alpha123/patch_ui_docs.py
      - name: Audit and build
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.123.jar
          git diff --check
      - name: Commit Alpha.123
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement
          git commit -m 'frontier: release 0.1.0-alpha.123 central logistics investment'
          git push origin HEAD:main
