name: Fix Living Kingdoms residence storage path collision

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_residence_storage_path_collision.py'
      - '.github/workflows/fix-living-kingdoms-residence-storage-path-collision.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Route residence paths around supply storage
        run: python .github/scripts/fix_living_kingdoms_residence_storage_path_collision.py
      - name: Commit Java repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorResidenceBuilder.java
          git diff --cached --quiet && exit 0
          git commit -m 'Route exterior residence paths around supply storage'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot repair; remove after Java changes land.
