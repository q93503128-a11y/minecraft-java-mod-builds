name: Frontier Alpha72 Patch Validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha72-patch-validation.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha72-patch-validation
  cancel-in-progress: false

jobs:
  validate-and-promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct and apply Alpha72 candidate
        shell: bash
        run: |
          set -euo pipefail
          cat .ci-temp/frontier-alpha72/chunk00 \
              .ci-temp/frontier-alpha72/chunk01 \
              .ci-temp/frontier-alpha72/chunk02 \
              .ci-temp/frontier-alpha72/chunk03 \
              .ci-temp/frontier-alpha72/chunk04 > /tmp/alpha72.patch.gz.b64
          base64 -d /tmp/alpha72.patch.gz.b64 | gzip -d > /tmp/alpha72.patch
          echo '943b7f2c6e035db5af7c111162cb40e4a6d13ffb110c535f6ce974f0e459186d  /tmp/alpha72.patch' | sha256sum -c -
          git apply --check /tmp/alpha72.patch
          git apply /tmp/alpha72.patch
          python3 - <<'PY'
          from pathlib import Path

          road = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementRoadService.java')
          text = road.read_text()
          text = text.replace('findRoadBuilder(level, data.centerPos(), road, plan)', 'findRoadBuilder(level, data, data.centerPos(), road, plan)', 1)
          text = text.replace('private static Villager findRoadBuilder(ServerLevel level, BlockPos settlementCenter,\n                                            RoadConstructionState road, List<Placement> plan)',
                              'private static Villager findRoadBuilder(ServerLevel level, SettlementData data, BlockPos settlementCenter,\n                                            RoadConstructionState road, List<Placement> plan)', 1)
          road.write_text(text)

          outpost = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementOutpostService.java')
          text = outpost.read_text()
          text = text.replace('findOutpostBuilder(level, data.centerPos(), state, plan)', 'findOutpostBuilder(level, data, data.centerPos(), state, plan)', 1)
          text = text.replace('private static Villager findOutpostBuilder(ServerLevel level, BlockPos settlementCenter,\n                                               OutpostConstructionState state,\n                                               List<OutpostBlueprints.Placement> plan)',
                              'private static Villager findOutpostBuilder(ServerLevel level, SettlementData data, BlockPos settlementCenter,\n                                               OutpostConstructionState state,\n                                               List<OutpostBlueprints.Placement> plan)', 1)
          outpost.write_text(text)
          PY
          git diff --check

      - name: Alpha72 cumulative audits
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_alpha72_source.py
          python3 tools/test_alpha72_docs.py

      - name: Java 25 clean build
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain

      - name: Verify Alpha72 runtime JAR
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/frontier_settlement-0.1.0-alpha.72.jar
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.72.jar
          test -f build/libs/frontier_settlement-0.1.0-alpha.72.jar.sha256
          mkdir -p "$GITHUB_WORKSPACE/premerge-deliverables"
          cp build/libs/frontier_settlement-0.1.0-alpha.72.jar "$GITHUB_WORKSPACE/premerge-deliverables/"
          cp build/libs/frontier_settlement-0.1.0-alpha.72.jar.sha256 "$GITHUB_WORKSPACE/premerge-deliverables/"

      - uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha72-premerge-deliverables
          path: premerge-deliverables/
          retention-days: 7

      - name: Promote validated Alpha72 product files to current main
        shell: bash
        run: |
          set -euo pipefail
          git diff --binary -- projects/frontier-settlement > /tmp/frontier-alpha72-product.patch
          test -s /tmp/frontier-alpha72-product.patch
          git fetch origin main
          git reset --hard origin/main
          git apply --index /tmp/frontier-alpha72-product.patch
          git rm -f .ci-temp/frontier-alpha72/chunk00 .ci-temp/frontier-alpha72/chunk01 .ci-temp/frontier-alpha72/chunk02 .ci-temp/frontier-alpha72/chunk03 .ci-temp/frontier-alpha72/chunk04
          if test -f ci-results/frontier-full-audit-snapshot/run_id.txt; then git rm -f ci-results/frontier-full-audit-snapshot/run_id.txt; fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Frontier Settlement 0.1.0-alpha.72 full-project reliability hardening'
          git push origin HEAD:main
