name: Audit Living Kingdoms exterior inventories

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-exterior-inventory.yml'

concurrency:
  group: living-kingdoms-exterior-inventory-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Java 25 inventory and authored-floor compile
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'public static final int EXTERIOR_REVISION = 2;' src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenKingdomExteriorBuilder.java
          grep -F 'public static final int RESIDENCE_REVISION = 2;' src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorResidenceBuilder.java
          grep -F 'public static final int FLOOR_REVISION = 1;' src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredNewFloorManager.java
          grep -F 'public static final int EXPECTED_CANDIDATES = 116;' src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanNewFloorStructuralApprovalCatalog.java
          mkdir -p ../../logs
          gradle --no-daemon clean classes --stacktrace --console=plain \
            2>&1 | tee ../../logs/exterior-inventory-compile.log

      - name: Fresh world authoritative inventory and authored-floor audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-exterior-inventory-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-exterior-inventory-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/exterior-inventory-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 2100); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/exterior-inventory-server.log; then
              cat ../../logs/exterior-inventory-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_KINGDOM_EXTERIOR_PASS revision=2 nodes=18 producers=15 wharves=3' ../../logs/exterior-inventory-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_INVENTORY_PASS revision=2 nodes=15 containers=15' ../../logs/exterior-inventory-server.log \
              && grep -Fq 'LK_ERDEN_AUTHORED_NEW_FLOOR_PASS candidates=116' ../../logs/exterior-inventory-server.log \
              && grep -Fq 'Prepared Erden residence modes buildings=233 ground_only_candidates=77 authored_upper_candidates=156 fresh_synthetic_upper_created=0' ../../logs/exterior-inventory-server.log \
              && grep -Fq 'LK_ERDEN_AUTHORED_UPPER_ROUTE_PASS' ../../logs/exterior-inventory-server.log \
              && grep -Fq 'LK_ERDEN_FULL_INTERIOR_EXPANSION_PASS buildings=40' ../../logs/exterior-inventory-server.log \
              && grep -Fq 'residence_mode=verified_upper_or_ground' ../../logs/exterior-inventory-server.log \
              && grep -Fq 'LK_ERDEN_KINGDOM_SUPPLY_PASS revision=1 nodes=18 producers=15 wharves=3 resources=6 opening_convoys=18' ../../logs/exterior-inventory-server.log \
              && grep -Fq 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/exterior-inventory-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/exterior-inventory-server.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/exterior-inventory-server.log
          test "$passed" -eq 1
          grep -F 'LK_ERDEN_EXTERIOR_TICKETS_PASS revision=1 anchors=178 released=178 explicit_release=true persistent_forced_chunks=false' ../../logs/exterior-inventory-server.log
          grep -F 'LK_ERDEN_AUTHORED_NEW_FLOOR_PASS candidates=116' ../../logs/exterior-inventory-server.log
          grep -F 'source_blocks_cut=0 source_air_floor=true structural_approval=true zero_cut_route=true synthetic_floor_required=false' ../../logs/exterior-inventory-server.log
          grep -F 'Prepared Erden residence modes buildings=233 ground_only_candidates=77 authored_upper_candidates=156 fresh_synthetic_upper_created=0' ../../logs/exterior-inventory-server.log
          grep -F 'LK_ERDEN_AUTHORED_UPPER_ROUTE_PASS' ../../logs/exterior-inventory-server.log
          grep -F 'LK_ERDEN_FULL_INTERIOR_EXPANSION_PASS buildings=40' ../../logs/exterior-inventory-server.log
          grep -F 'residence_mode=verified_upper_or_ground' ../../logs/exterior-inventory-server.log
          grep -F 'player_removal_authoritative=true' ../../logs/exterior-inventory-server.log
          grep -F 'dispatch_reduces_barrels=true' ../../logs/exterior-inventory-server.log
          grep -F 'local_reserves=true' ../../logs/exterior-inventory-server.log
          grep -F 'fixed_daily_imports=false' ../../logs/exterior-inventory-server.log
          grep -F 'shipment_escrow=true' ../../logs/exterior-inventory-server.log
          grep -F 'storage_yards=true' ../../logs/exterior-inventory-server.log
          grep -F 'physical_residences=true' ../../logs/exterior-inventory-server.log
          grep -F 'purchase_outcomes=77' ../../logs/exterior-inventory-server.log
          grep -F 'reserve_bread=42' ../../logs/exterior-inventory-server.log
          inventory_marker="$(grep -F 'LK_ERDEN_EXTERIOR_INVENTORY_PASS' ../../logs/exterior-inventory-server.log | tail -1)"
          captures="$(sed -E 's/.*captures=([0-9]+).*/\1/' <<<"$inventory_marker")"
          writes="$(sed -E 's/.*writes=([0-9]+).*/\1/' <<<"$inventory_marker")"
          visible_resources="$(sed -E 's/.*visible_resources=([0-9]+).*/\1/' <<<"$inventory_marker")"
          captured_nodes="$(sed -E 's/.*captured_nodes=([0-9]+).*/\1/' <<<"$inventory_marker")"
          verified_nodes="$(sed -E 's/.*verified_nodes=([0-9]+).*/\1/' <<<"$inventory_marker")"
          test "$captures" -gt 0
          test "$writes" -gt 0
          test "$visible_resources" -ge 6
          test "$captured_nodes" -eq 15
          test "$verified_nodes" -eq 15

          if grep -Eqi 'Unsupported exterior resource|Unknown Erden supply role|Invalid Erden exterior residence|Exception loading level|watchdog|Item debris remained|authored new-floor verification failed' ../../logs/exterior-inventory-server.log; then
            exit 1
          fi

      - name: Upload exterior inventory logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-exterior-inventory-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Record exterior inventory audit pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            mkdir -p .github/build-pointers
            cat > .github/build-pointers/living-kingdoms-exterior-inventory.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID"
          }
          EOF
            git add .github/build-pointers/living-kingdoms-exterior-inventory.json
            git commit -m "Record Living Kingdoms exterior inventory audit $GITHUB_RUN_NUMBER" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
