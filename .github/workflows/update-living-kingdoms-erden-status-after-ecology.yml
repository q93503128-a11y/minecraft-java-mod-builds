name: Update Living Kingdoms Erden status after ecology

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/update_living_kingdoms_erden_status_after_ecology.py'
      - '.github/workflows/update-living-kingdoms-erden-status-after-ecology.yml'

permissions:
  contents: write

concurrency:
  group: living-kingdoms-erden-status-after-ecology
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply status update
        run: python .github/scripts/update_living_kingdoms_erden_status_after_ecology.py
      - name: Verify status facts
        shell: bash
        run: |
          set -euo pipefail
          doc='projects/living-kingdoms/docs/ERDEN_IMPLEMENTATION_STATUS.md'
          grep -Fq '신규 혼인 64쌍' "$doc"
          grep -Fq '공실 6곳·점유 71곳' "$doc"
          grep -Fq '은각사슴의 플레이어 회피·무리 결집' "$doc"
          grep -Fq '재빛사냥개의 길들이기 차단·야간 무리 사냥' "$doc"
          grep -Fq '강빛정령의 아이템 운반 상호작용 차단·은빛강 중심 복귀' "$doc"
          grep -Fq '멀어지면 제거 가능한 로컬 생태 엔티티' "$doc"
          ! grep -Fq '왕도 차세대 주민의 결혼·재혼, 배우자 가구 이동, 독립 가구 형성·이주와 임대료·주택 공실 시장을 장기 세대교체에 연결하는 작업' "$doc"
          ! grep -Fq '전용 동물, 몬스터, 정령과 지역별 스폰 생태' "$doc"
      - name: Commit status directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/docs/ERDEN_IMPLEMENTATION_STATUS.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(living-kingdoms): record capital housing and fantasy ecology'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
