name: Arcane Circle alpha.25 migration v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-circle-alpha25-migration-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcane-circle-alpha25-migration-v2
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false
      - name: Apply alpha.25 visual language and corrected regression harness
        working-directory: projects/arcane-circle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, zlib
          workflow = Path('../../.github/workflows/arcane-circle-alpha25-migration.yml').read_text(encoding='utf-8')
          match = re.search(r"payload='([^']+)'", workflow)
          if not match:
              raise SystemExit('migration payload not found')
          exec(zlib.decompress(base64.b64decode(match.group(1))).decode('utf-8'))
          test = Path('tools/test_v0121_alpha25_visual_language.py')
          text = test.read_text(encoding='utf-8')
          old = "exec(compile(base,'alpha24-regression-as-alpha25','exec'),{})"
          new = "scope={'__file__': str(ROOT/'tools/test_v0121_alpha24_presentation_complete.py')}\nexec(compile(base,'alpha24-regression-as-alpha25','exec'),scope)"
          if old not in text:
              raise SystemExit('alpha25 audit harness anchor missing')
          test.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 tools/test_v0121_alpha25_visual_language.py
          git diff --check
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean compileJava --stacktrace --console=plain
      - name: Commit compiled alpha.25 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/arcane-circle
          git diff --cached --check
          git commit -m 'Arcane Circle alpha.25 codex sigil and robe visual language'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1