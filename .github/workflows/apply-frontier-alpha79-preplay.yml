name: Apply Frontier Settlement Alpha.79 Pre-Playtest Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha79-preplay.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: frontier-settlement-alpha79-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch and audit Alpha.79 on latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          python3 .github/scripts/frontier-alpha79-fix-apply.py
          python3 .github/scripts/frontier-alpha79-apply.py
          cd projects/frontier-settlement
          python3 tools/test_alpha79_source.py
          python3 tools/test_alpha79_docs.py
          cd ../..
          git add projects/frontier-settlement
          git commit -m 'Harden Frontier Settlement alpha.79 before playtest'
          git pull --rebase origin main
          git push origin HEAD:main
