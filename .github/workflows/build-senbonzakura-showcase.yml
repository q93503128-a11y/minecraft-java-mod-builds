name: Build Senbonzakura Showcase

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'projects/senbonzakura-showcase/**'
      - '.github/workflows/build-senbonzakura-showcase.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/senbonzakura-showcase
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Verify JAR
        run: |
          test -f build/libs/senbonzakura-0.1.0-alpha.8.jar
          jar tf build/libs/senbonzakura-0.1.0-alpha.8.jar | grep -q 'kr/moonseungjun/senbonzakura/SenbonzakuraShowcase.class'
          jar tf build/libs/senbonzakura-0.1.0-alpha.8.jar | grep -q 'kr/moonseungjun/senbonzakura/client/BankaiWorldRenderer.class'
          jar tf build/libs/senbonzakura-0.1.0-alpha.8.jar | grep -q 'kr/moonseungjun/senbonzakura/client/AbilityWorldRenderer.class'
          jar tf build/libs/senbonzakura-0.1.0-alpha.8.jar | grep -q 'kr/moonseungjun/senbonzakura/ability/AbilityService.class'
          jar tf build/libs/senbonzakura-0.1.0-alpha.8.jar | grep -q 'kr/moonseungjun/senbonzakura/client/AbilityKeyHandler.class'
          jar tf build/libs/senbonzakura-0.1.0-alpha.8.jar | grep -q 'assets/senbonzakura/items/zanpakuto_senbonzakura.json'
          jar tf build/libs/senbonzakura-0.1.0-alpha.8.jar | grep -q 'META-INF/neoforge.mods.toml'

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: senbonzakura-0.1.0-alpha.8
          path: projects/senbonzakura-showcase/build/libs/senbonzakura-0.1.0-alpha.8.jar
          if-no-files-found: error
