name: Manual Survival Risk Fix V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-risk-fix-v2.yml'

permissions:
  contents: write

jobs:
  fix-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply and audit
        run: |
          python3 .github/scripts/apply_survival_risk_fixes.py
          python3 projects/survival-ascension/tools/test_gameplay_qol_061.py
          git diff --check
      - name: Java 25 clean build
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain
      - name: Verify JAR
        run: python3 projects/survival-ascension/tools/verify_jar.py projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
      - name: Commit validated fixes and cleanup temp tools
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm .github/workflows/manual-survival-risk-scan.yml .github/workflows/manual-survival-risk-fix-v2.yml .github/scripts/apply_survival_risk_fixes.py
          git add projects/survival-ascension
          git commit -m 'Fix audited Survival gameplay runtime risks'
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        with:
          name: survival-061-audited-risk-fixes
          path: projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          if-no-files-found: error
