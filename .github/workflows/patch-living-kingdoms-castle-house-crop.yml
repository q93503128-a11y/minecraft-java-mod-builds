name: Patch Living Kingdoms castle-house crop selection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-living-kingdoms-castle-house-crop.yml'
  workflow_dispatch:

concurrency:
  group: living-kingdoms-castle-house-crop
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Patch, compile, and classify
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalUrbanFabricBuilder.java')
          s=p.read_text(encoding='utf-8')
          old='''        List<FacadeFragment> fragments = createFragments(\n                blocks, doors, templateWidth, templateHeight, templateLength);\n'''
          new='''        List<FacadeFragment> fragments = createFragments(\n                resource, blocks, doors, templateWidth, templateHeight, templateLength);\n'''
          if s.count(old)!=1: raise SystemExit('decode createFragments call drifted')
          s=s.replace(old,new,1)
          old='''    private static List<FacadeFragment> createFragments(\n            List<BuildingBlock> sourceBlocks,\n            List<BuildingBlock> entrances,\n            int width, int height, int length) {\n        List<BuildingBlock> candidates = entrances.isEmpty()\n'''
          new='''    private static List<FacadeFragment> createFragments(\n            String resource,\n            List<BuildingBlock> sourceBlocks,\n            List<BuildingBlock> entrances,\n            int width, int height, int length) {\n        List<BuildingBlock> candidates = entrances.isEmpty()\n'''
          if s.count(old)!=1: raise SystemExit('createFragments signature drifted')
          s=s.replace(old,new,1)
          anchor='''        List<BuildingBlock> candidates = entrances.isEmpty()\n                ? List.of(new BuildingBlock(width / 2, 1, 0, Blocks.OAK_DOOR.defaultBlockState()))\n                : entrances;\n        LinkedHashSet<FrontSide> usedSides = new LinkedHashSet<>();\n'''
          replacement='''        List<BuildingBlock> candidates = entrances.isEmpty()\n                ? List.of(new BuildingBlock(width / 2, 1, 0, Blocks.OAK_DOOR.defaultBlockState()))\n                : entrances;\n\n        // The fantasy starter castle exposes several real doors. A nearest-edge crop retained a\n        // nearly sealed 11-cell slice even though the same licensed source has an 802-cell interior\n        // within the exact same 34x38 urban footprint. Choose the largest real doorway-connected\n        // component before any world placement; no imported block is edited by this selection.\n        if (CASTLE_HOUSE.equals(resource) && !entrances.isEmpty()) {\n            FacadeFragment best = null;\n            int bestReachable = -1;\n            BuildingBlock bestEntrance = null;\n            FrontSide bestCropSide = null;\n            for (BuildingBlock entrance : candidates) {\n                for (FrontSide cropSide : FrontSide.values()) {\n                    int depth = Math.min(38, cropSide.horizontal ? width : length);\n                    if (edgeDistance(entrance.x, entrance.z, width, length, cropSide) >= depth) continue;\n                    FacadeFragment candidate = cropFragment(\n                            sourceBlocks, entrance, cropSide, width, height, length);\n                    if (candidate.blocks.size() < 500 || !containsRealEntrance(candidate)) continue;\n                    int reachable = fragmentReachableCells(candidate);\n                    if (reachable > bestReachable) {\n                        best = candidate;\n                        bestReachable = reachable;\n                        bestEntrance = entrance;\n                        bestCropSide = cropSide;\n                    }\n                }\n            }\n            if (best == null || bestReachable < 500) {\n                throw new IllegalStateException(\n                        "No usable fixed-footprint castle-house crop; best_reachable=" + bestReachable);\n            }\n            LivingKingdoms.LOGGER.info(\n                    "LK_ERDEN_CASTLE_HOUSE_CROP_SELECTED reachable={} crop_side={} source_door={},{} fragment={}x{} entrance_local={},{} resolved_side={} same_footprint=true source_only=true world_reads=false mutations=0",\n                    bestReachable, bestCropSide, bestEntrance.x, bestEntrance.z,\n                    best.width, best.length, best.entranceX, best.entranceZ, best.exteriorSide);\n            return List.of(best);\n        }\n\n        LinkedHashSet<FrontSide> usedSides = new LinkedHashSet<>();\n'''
          if s.count(anchor)!=1: raise SystemExit('candidate anchor drifted')
          s=s.replace(anchor,replacement,1)
          p.write_text(s,encoding='utf-8')
          PY

          git diff --check
          (cd "$PROJECT_DIR" && gradle --no-daemon clean classes --stacktrace --console=plain) 2>&1 | tee logs/crop-compile.log

          rm -rf "$PROJECT_DIR/run/world" "$PROJECT_DIR/run/living_realm" "$PROJECT_DIR/run/livingkingdoms-crop-ci-world"
          mkdir -p "$PROJECT_DIR/run"
          printf 'level-name=livingkingdoms-crop-ci-world\npause-when-empty-seconds=0\n' > "$PROJECT_DIR/run/server.properties"
          printf 'eula=true\n' > "$PROJECT_DIR/run/eula.txt"
          (cd "$PROJECT_DIR" && gradle --no-daemon runServer --stacktrace --console=plain) > logs/crop-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 150); do
            if grep -Eqi 'IllegalStateException|LK_REALM_DIAGNOSTIC_FAIL|watchdog' logs/crop-server.log; then
              cat logs/crop-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_CASTLE_HOUSE_CROP_SELECTED' logs/crop-server.log \
              && grep -Fq 'Prepared exact Erden placed-fragment topology catalog buildings=233' logs/crop-server.log \
              && grep -Fq 'LK_ERDEN_GROUND_VOID_SURVEY placements=' logs/crop-server.log; then
              ready=1; break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then cat logs/crop-server.log; exit 1; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then cat logs/crop-server.log; exit 1; fi
          grep -F 'LK_ERDEN_CASTLE_HOUSE_CROP_SELECTED reachable=802' logs/crop-server.log
          grep -F 'Prepared exact Erden placed-fragment topology catalog buildings=233' logs/crop-server.log | tail -1
          grep -F 'LK_ERDEN_FRAGMENT_TOPOLOGY fragment=/data/livingkingdoms/structures/external/fantasy_castle_house.schem#0' logs/crop-server.log | tail -1
          grep -F 'LK_ERDEN_GROUND_VOID_SURVEY placements=' logs/crop-server.log | tail -1
          grep -F 'Prepared Erden continuous urban fabric plots=233 entrances=233' logs/crop-server.log | tail -1

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-castle-house-crop-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Commit source fix
        if: steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalUrbanFabricBuilder.java"
          git rm .github/workflows/patch-living-kingdoms-castle-house-crop.yml
          git commit -m 'fix(living-kingdoms): retain walkable castle-house interiors'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Record failed patch run
        if: steps.apply.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/living-kingdoms-castle-house-crop.json <<EOF
          {
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}",
            "commit_sha": "${{ github.sha }}",
            "job_status": "failure"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/living-kingdoms-castle-house-crop.json
          git commit -m "Record failed Living Kingdoms castle-house crop patch ${{ github.run_number }} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then break; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done

      - name: Enforce patch result
        if: always()
        run: test '${{ steps.apply.outcome }}' = 'success'
