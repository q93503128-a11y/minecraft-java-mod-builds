name: Temporary manual VFX migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-manual-vfx-migrate.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply manual-only visual architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('projects/arcane-circle')
          gradle=root/'gradle.properties'
          s=gradle.read_text(encoding='utf-8').replace('mod_version=0.12.1-alpha.39','mod_version=0.12.1-alpha.40')
          s=re.sub(r'# alpha\.39[^\n]*', '# alpha.40 explicit 109-spell hand-authored presentation; no school/form visual fallback', s)
          gradle.write_text(s,encoding='utf-8')
          main=root/'src/main/java/kr/moonseungjun/arcanecircle/ArcaneCircle.java'
          s=main.read_text(encoding='utf-8').replace('VERSION = "0.12.1-alpha.39"','VERSION = "0.12.1-alpha.40"')
          main.write_text(s,encoding='utf-8')
          index=root/'src/main/resources/data/arcanecircle/spell_catalog/index.json'
          s=index.read_text(encoding='utf-8').replace('"version": "0.12.1-alpha.39"','"version": "0.12.1-alpha.40"')
          index.write_text(s,encoding='utf-8')

          manual=root/'src/main/java/kr/moonseungjun/arcanecircle/client/ManualSpellVisuals.java'
          s=manual.read_text(encoding='utf-8')
          a=s.index('    static int color(String id) {')
          b=s.index('    static int prismaticColor',a)
          color='''    static int color(String id) {
              return switch (id) {
                  case "fire_bolt","scorching_ray","fireball","wall_of_fire","flame_strike","delayed_blast_fireball","fire_storm","incendiary_cloud","meteor_swarm","burning_hands","fire_shield","steam_burst","phoenix_requiem" -> 0xFFFF321A;
                  case "ray_of_frost","sleet_storm","ice_storm","cone_of_cold","freezing_sphere","simulacrum","ice_knife","wall_of_ice","frost_step","winter_domain" -> 0xFF31D9FF;
                  case "feather_fall","thunderwave","gust_of_wind","levitate","fly","control_weather","wind_wall" -> 0xFF3DFFC4;
                  case "shield","mage_armor","web","hold_person","protection_from_energy","resilient_sphere","stoneskin","wall_of_force","hold_monster","globe_of_invulnerability","forcecage","antimagic_field","prismatic_wall","thunder_cage","astral_prison" -> 0xFFAA5CFF;
                  case "vampiric_touch","blight","freedom_of_movement","cloudkill","mass_cure_wounds","insect_plague","clone","shapechange","true_polymorph" -> 0xFF4AFF72;
                  case "misty_step","blink","dimension_door","passwall","etherealness","plane_shift","reverse_gravity","teleport","demiplane","maze","gate","teleportation_circle","void_lance" -> 0xFFE052FF;
                  case "magic_missile","light","grease","sleep","mirror_image","invisibility","shatter","blur","haste","dispel_magic","slow","greater_invisibility","confusion","telekinesis","dominate_person","mass_suggestion","dominate_monster","counterspell","arcane_hand" -> 0xFF5B78FF;
                  case "lightning_bolt","chain_lightning" -> 0xFF78B8FF;
                  case "prismatic_spray","chromatic_orb" -> 0xFFFFFFFF;
                  case "disintegrate" -> 0xFF6BFF22;
                  case "sunbeam","sunburst","true_seeing","foresight","solar_guard" -> 0xFFFFE55A;
                  case "circle_of_death","finger_of_death","power_word_kill","eyebite" -> 0xFFFF224E;
                  case "phantasmal_killer","weird","feeblemind" -> 0xFFFF36D7;
                  case "flesh_to_stone" -> 0xFFD4DAE8;
                  case "time_stop" -> 0xFF64EFFF;
                  case "wish" -> 0xFFF4A8FF;
                  case "move_earth","earthquake","world_sunder" -> 0xFFFFA43B;
                  default -> throw new IllegalStateException("Un-authored spell color: "+id);
              };
          }

          '''
          manual.write_text(s[:a]+color+s[b:],encoding='utf-8')

          audit=root/'tools/test_current_source.py'
          s=audit.read_text(encoding='utf-8').replace('0.12.1-alpha.39','0.12.1-alpha.40')
          start=s.index("tracker=text(client/'WorldMagicTracker.java')")
          end=s.index('# 3P artifact regression:',start)
          replacement='''tracker=text(client/'WorldMagicTracker.java')
          for token in ['ManualSpellVisuals.charge','ManualSpellVisuals.release','ManualSpellVisuals.castingFamily',
                        'ManualSpellVisuals.color','MAX_FRAME = 14000','MAX_ENTRY = 4000','world_magic_manual_v4']:
              assert token in tracker, token
          for forbidden in ['SpellCinematicDirector.','ArcaneSigilDirector.','ArcaneSpellVisualOverhaul.']:
              assert forbidden not in tracker, forbidden

          # Manual-only presentation registry: every catalog spell must be explicitly dispatched.
          import re
          manual=text(client/'ManualSpellVisuals.java')
          circle_files=[client/f'ManualCircle{i}Visuals.java' for i in range(1,10)]
          manual_files=circle_files+[client/'ManualFusionVisuals.java']
          for path in manual_files: assert path.exists(), path.name
          catalog_source=text(magic/'SpellCatalog.java')
          catalog_ids=set(re.findall(r'(?:add|addFusion)\\(\"([a-z0-9_]+)\"',catalog_source))
          dispatch=manual[manual.index('private static void draw'):manual.index('static int castingFamily')]
          dispatch_ids=set(re.findall(r'\"([a-z0-9_]+)\"',dispatch))
          assert len(catalog_ids)==109, len(catalog_ids)
          assert dispatch_ids==catalog_ids, sorted(catalog_ids-dispatch_ids)
          combined=manual+'\\n'.join(text(path) for path in manual_files)
          for forbidden in ['spell.school()','switch(s.form())','profile.motion()','profile.sigil()',
                            'highCircleCrown','grandScaleArchitecture','combustionFormula','frostFormula','arcaneFormula']:
              assert forbidden not in combined, forbidden
          for token in ['Un-authored spell visual','Un-authored casting pose','Un-authored spell color']:
              assert token in manual, token
          for old in ['ArcaneSigilDirector.java','SpellCinematicDirector.java','ArcaneSpellVisualOverhaul.java']:
              assert not (client/old).exists(), old

          '''
          s=s[:start]+replacement+s[end:]

          start=s.index('# Alpha.37 presentation contract:')
          end=s.index('# Destruction budgets/classification',start)
          s=s[:start]+'''# Manual presentation still preserves authoritative target/lifetime contracts.
          presentation=text(magic/'SpellPresentationProfile.java')
          assert 'SpellGameplayService.visualDurationTicks(spell.id())' in presentation
          assert 'return visual.target.subtract(visual.center);' in tracker
          assert 'case "prismatic_wall" -> 280;' in gameplay
          assert '14초 지속 7색 장벽' in summary

          '''+s[end:]

          start=s.index('# Alpha.37 non-potion buff identity')
          end=s.index('# Active-tree hygiene:',start)
          s=s[:start]+'''# Non-potion buff mechanics remain authoritative while their visuals are spell-authored manually.
          buff=text(magic/'ArcaneBuffRuntime.java')
          for token in ['durationTicks','onIncomingDamage','castTimeMultiplier','adjustCooldownTicks',
                        'protection_from_energy','greater_invisibility','freedom_of_movement','true_seeing',
                        'solar_guard','shapechange','foresight','rechargeInterval','reveal']:
              assert token in buff, token
          for token in ['ArcaneBuffRuntime.apply','ArcaneBuffRuntime.tick','ArcaneBuffRuntime.onIncomingDamage',
                        'ArcaneBuffRuntime.clear','ArcaneBuffRuntime.clearAll']:
              assert token in gameplay, token
          for token in ['case "feather_fall" -> 120','case "mirror_image" -> 260','case "blur" -> 360',
                        'case "fly" -> 600','case "simulacrum" -> 1200','case "clone" -> 1800',
                        'case "globe_of_invulnerability" -> 520','case "fire_shield" -> 620',
                        'case "sleep" -> 140','case "mass_suggestion" -> 160']:
              assert token in gameplay, token
          for token in ['ArcaneBuffRuntime.castTimeMultiplier(player)','ArcaneBuffRuntime.adjustCooldownTicks(player']:
              assert token in casting_service, token
          assert 'ArcaneBuffRuntime.apply(player, "solar_guard", power, range)' in fusion
          assert 'armor.nextChargeAt = now + rechargeInterval("mage_armor")' in buff
          assert 'solar.nextChargeAt = now + rechargeInterval("solar_guard")' in buff

          '''+s[end:]

          # Retire the three old automatic presentation directors in the hygiene list too.
          s=s.replace("'CastingSilhouetteRenderer.java','RobeRegaliaRenderer.java','SignatureGeometry.java']",
                      "'CastingSilhouetteRenderer.java','RobeRegaliaRenderer.java','SignatureGeometry.java',\n'ArcaneSigilDirector.java','SpellCinematicDirector.java','ArcaneSpellVisualOverhaul.java']")
          audit.write_text(s,encoding='utf-8')
          PY
          git rm -f \
            projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/ArcaneSigilDirector.java \
            projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/SpellCinematicDirector.java \
            projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/ArcaneSpellVisualOverhaul.java
          git rm -f .github/workflows/tmp-manual-vfx-migrate.yml
          git add -A projects/arcane-circle
          git diff --check
          git commit -m 'refactor(arcane): make all 109 spell visuals explicitly hand-authored'
          for attempt in 1 2 3 4; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*2))
          done
          exit 1
