name: Temporary SA046 Diagnostic

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event.issue.title == '[SA046 DIAG INTERNAL]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract patch and run source diagnostics
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/sa046-diag.log"
          exec > >(tee "$LOG") 2>&1
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-sa046-apply.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/sa046_apply.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('extracted_lines=', len(lines))
          PY
          echo '=== PATCH PY_COMPILE ==='
          python3 -m py_compile /tmp/sa046_apply.py
          echo "pycompile_rc=$?"
          echo '=== PATCH APPLY ==='
          python3 /tmp/sa046_apply.py
          APPLY_RC=$?
          echo "apply_rc=$APPLY_RC"
          if test "$APPLY_RC" -eq 0; then
            cd projects/survival-ascension
            echo '=== CURRENT SOURCE AUDIT ==='
            python3 tools/test_current_source.py
            echo "current_audit_rc=$?"
            echo '=== CONTENT PACK AUDIT ==='
            python3 tools/test_content_pack_source.py
            echo "content_audit_rc=$?"
            echo '=== DIFF CHECK ==='
            git diff --check
            echo "diff_check_rc=$?"
          fi
          exit 0

      - name: Post diagnostics
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/sa046-diag.log"
          {
            echo '```text'
            if test -f "$LOG"; then tail -n 220 "$LOG"; else echo 'diagnostic log missing'; fi
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/diag-comment.md"
          gh issue comment "${{ github.event.issue.number }}" --body-file "$RUNNER_TEMP/diag-comment.md"
          gh issue close "${{ github.event.issue.number }}" --reason completed
