name: Apply Living Kingdoms exterior integration

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/apply-lk-exterior-integration.py'
      - '.github/workflows/apply-lk-exterior-integration.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exterior integration
        run: python .github/scripts/apply-lk-exterior-integration.py

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          files=(
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenKingdomSupplyManager.java
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalDistrictBuildingBuilder.java
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java
          )
          git add "${files[@]}"
          git commit -m "Connect streamed Erden exterior production sites"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/apply-lk-exterior-integration.py
            git add "${files[@]}"
            git commit -m "Connect streamed Erden exterior production sites"
            sleep $((attempt * 2))
          done
          exit 1
