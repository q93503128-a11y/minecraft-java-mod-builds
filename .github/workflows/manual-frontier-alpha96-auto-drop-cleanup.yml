name: Manual Frontier Alpha96 Auto Drop Cleanup

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/manual-frontier-alpha96-auto-drop-cleanup.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply automatic drop-pressure cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/frontier-settlement')
          gp = root / 'gradle.properties'
          g = gp.read_text(encoding='utf-8')
          if 'mod_version=0.1.0-alpha.95' not in g:
              raise SystemExit('unexpected Frontier version')
          g = g.replace('mod_version=0.1.0-alpha.95', 'mod_version=0.1.0-alpha.96', 1)
          g += '\n# Alpha.96 automatic drop-pressure cleanup: when nearby dropped-item entities become excessive, only old low-value rock clutter is silently trimmed; ores, gems, gear, food, wood and other valuable drops are never targeted.\n'
          gp.write_text(g, encoding='utf-8')

          service = root / 'src/main/java/kr/moonseungjun/frontiersettlement/settlement/DroppedItemCleanupService.java'
          service.write_text('''package kr.moonseungjun.frontiersettlement.settlement;

import net.minecraft.server.MinecraftServer;
import net.minecraft.server.level.ServerLevel;
import net.minecraft.server.level.ServerPlayer;
import net.minecraft.world.entity.item.ItemEntity;
import net.minecraft.world.item.ItemStack;
import net.minecraft.world.item.Items;
import net.minecraft.world.phys.AABB;
import net.neoforged.neoforge.event.tick.ServerTickEvent;

import java.util.List;

/**
 * Bounded lag-pressure relief for large mining/civil-work drop fields.
 *
 * Normal gameplay is untouched: the scan runs every five seconds, only activates when the local
 * ItemEntity count is already excessive, gives ordinary rock drops a grace period for pickup, and
 * deletes only an explicit low-value vanilla rock whitelist. Ores, coal, gems, equipment, food,
 * wood, relics and modded drops are never selected by this automatic path.
 */
public final class DroppedItemCleanupService {
    private static final int CHECK_INTERVAL_TICKS = 100;
    private static final double HORIZONTAL_RADIUS = 128.0D;
    private static final double VERTICAL_RADIUS = 64.0D;
    private static final int PRESSURE_TRIGGER_ENTITIES = 160;
    private static final int PRESSURE_TARGET_ENTITIES = 96;
    private static final int NORMAL_GRACE_TICKS = 400;
    private static final int EMERGENCY_TRIGGER_ENTITIES = 400;
    private static final int EMERGENCY_GRACE_TICKS = 100;

    private DroppedItemCleanupService() {}

    public static void onServerTick(ServerTickEvent.Post event) {
        MinecraftServer server = event.getServer();
        if (server.getTickCount() % CHECK_INTERVAL_TICKS != 0) return;
        for (ServerLevel level : server.getAllLevels()) {
            for (ServerPlayer player : level.players()) {
                trimAround(level, player);
            }
        }
    }

    private static void trimAround(ServerLevel level, ServerPlayer player) {
        AABB area = player.getBoundingBox().inflate(HORIZONTAL_RADIUS, VERTICAL_RADIUS, HORIZONTAL_RADIUS);
        List<ItemEntity> drops = level.getEntitiesOfClass(ItemEntity.class, area, ItemEntity::isAlive);
        if (drops.size() < PRESSURE_TRIGGER_ENTITIES) return;

        int grace = drops.size() >= EMERGENCY_TRIGGER_ENTITIES ? EMERGENCY_GRACE_TICKS : NORMAL_GRACE_TICKS;
        int needToRemove = drops.size() - PRESSURE_TARGET_ENTITIES;
        if (needToRemove <= 0) return;

        for (ItemEntity drop : drops) {
            if (needToRemove <= 0) break;
            if (!drop.isAlive() || drop.getAge() < grace || !isDisposableRock(drop.getItem())) continue;
            drop.discard();
            needToRemove--;
        }
    }

    public static boolean isDisposableRock(ItemStack stack) {
        return stack.is(Items.STONE)
                || stack.is(Items.COBBLESTONE)
                || stack.is(Items.DEEPSLATE)
                || stack.is(Items.COBBLED_DEEPSLATE)
                || stack.is(Items.ANDESITE)
                || stack.is(Items.DIORITE)
                || stack.is(Items.GRANITE)
                || stack.is(Items.TUFF)
                || stack.is(Items.CALCITE)
                || stack.is(Items.DRIPSTONE_BLOCK)
                || stack.is(Items.BLACKSTONE)
                || stack.is(Items.BASALT)
                || stack.is(Items.NETHERRACK);
    }
}
''', encoding='utf-8')

          main = root / 'src/main/java/kr/moonseungjun/frontiersettlement/FrontierSettlement.java'
          s = main.read_text(encoding='utf-8')
          anchor = 'import kr.moonseungjun.frontiersettlement.settlement.SettlementAdvancedWorkshopService;\n'
          if anchor not in s:
              raise SystemExit('main import anchor missing')
          s = s.replace(anchor, 'import kr.moonseungjun.frontiersettlement.settlement.DroppedItemCleanupService;\n' + anchor, 1)
          anchor2 = '        NeoForge.EVENT_BUS.addListener(SettlementService::onServerTick);\n'
          if anchor2 not in s:
              raise SystemExit('main listener anchor missing')
          s = s.replace(anchor2, anchor2 + '        NeoForge.EVENT_BUS.addListener(DroppedItemCleanupService::onServerTick);\n', 1)
          main.write_text(s, encoding='utf-8')

          # Keep the manual cleanup command, but make its stone filter use the same whitelist as auto-cleanup.
          commands = root / 'src/main/java/kr/moonseungjun/frontiersettlement/command/SettlementCommands.java'
          c = commands.read_text(encoding='utf-8')
          start = c.index('    private static boolean isStoneClutter(ItemEntity entity) {')
          end = c.index('    private static int rescan(', start)
          replacement = '''    private static boolean isStoneClutter(ItemEntity entity) {\n        return DroppedItemCleanupService.isDisposableRock(entity.getItem());\n    }\n\n'''
          c = c[:start] + replacement + c[end:]
          commands.write_text(c, encoding='utf-8')
          print('ALPHA96_AUTO_CLEANUP_PATCHED')
          PY

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'mod_version=0.1.0-alpha.96' projects/frontier-settlement/gradle.properties
          grep -q 'DroppedItemCleanupService::onServerTick' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/FrontierSettlement.java
          grep -q 'PRESSURE_TRIGGER_ENTITIES = 160' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/DroppedItemCleanupService.java
          grep -q 'EMERGENCY_TRIGGER_ENTITIES = 400' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/DroppedItemCleanupService.java
          grep -q 'getAge() < grace' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/DroppedItemCleanupService.java
          grep -q 'DroppedItemCleanupService.isDisposableRock' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/command/SettlementCommands.java

      - name: Build Frontier
        working-directory: projects/frontier-settlement
        run: ./gradlew clean build --no-daemon

      - name: Verify jar
        shell: bash
        run: |
          set -euo pipefail
          JAR='projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.96.jar'
          test -s "$JAR"
          unzip -l "$JAR" | grep -q 'DroppedItemCleanupService.class'
          unzip -l "$JAR" | grep -q 'SettlementCommands.class'
          python3 - <<'PY'
          import zipfile
          p='projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.96.jar'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              if len(names)!=len(set(names)):
                  raise SystemExit('duplicate jar entries')
          print('JAR_OK')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha96-replacement
          path: projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.96.jar
          if-no-files-found: error

      - name: Commit canonical source and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-frontier-alpha96-auto-drop-cleanup.yml
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/frontier-settlement/gradle.properties \
                  projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/FrontierSettlement.java \
                  projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/command/SettlementCommands.java \
                  projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/DroppedItemCleanupService.java \
                  .github/workflows/manual-frontier-alpha96-auto-drop-cleanup.yml
          git commit -m 'Add automatic low-value drop pressure cleanup'
          git push origin HEAD:main
