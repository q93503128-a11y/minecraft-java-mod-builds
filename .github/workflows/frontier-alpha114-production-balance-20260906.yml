name: Frontier Alpha114 Production Balance 20260906

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/apply_frontier_alpha114_production_balance.py'
      - '.github/workflows/frontier-alpha114-production-balance-20260906.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Rebase onto latest main
        run: git pull --rebase origin main

      - name: Normalize outpost trunk patch anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_frontier_alpha114_production_balance.py')
          s = p.read_text(encoding='utf-8')
          old = 'for (int y = 0; y < 16 && count < MAX_LOGS; y++) {'
          new = 'for (int y = 0; y < 10 && count < MAX_LOGS; y++) {'
          if s.count(old) != 1:
              raise SystemExit(f'expected one old anchor, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply production ecology patch
        run: python3 tools/apply_frontier_alpha114_production_balance.py

      - name: Verify current source
        run: python3 projects/frontier-settlement/tools/test_current_source.py

      - name: Java 25 clean build
        run: |
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify runtime JAR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          jar = Path('projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.114.jar')
          assert jar.exists(), jar
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              assert 'META-INF/MANIFEST.MF' in names
              assert any(n.endswith('SettlementWorkerService.class') for n in names)
              assert any(n.endswith('SettlementOutpostProductionService.class') for n in names)
              assert any(n.endswith('SettlementProductionEfficiencyService.class') for n in names)
          print(jar, jar.stat().st_size)
          PY

      - name: Commit canonical source and retire temporary files
        run: |
          rm -f tools/apply_frontier_alpha114_production_balance.py
          rm -f .github/workflows/frontier-alpha114-production-balance-20260906.yml
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add -A
          git commit -m 'Balance physical settlement production'

      - name: Rebase and reverify exact push candidate
        run: |
          git pull --rebase origin main
          python3 projects/frontier-settlement/tools/test_current_source.py
          cd projects/frontier-settlement
          ./gradlew clean build --no-daemon

      - name: Push verified main
        run: git push origin HEAD:main

      - name: Stage artifact
        run: |
          mkdir -p stage
          cp projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.114.jar stage/
          printf '%s\n' \
            'Alpha.114 production test:' \
            '- farm harvest pass bounded to 12/16/20/24 by settlement grade' \
            '- town lumber workers replant supported natural tree species after fully harvesting a trunk column' \
            '- town quarry can open a shallow physical face through <=4 safe natural overburden blocks, one cover block per work pass' \
            '- specialized outpost lumber/quarry batches are 8 and use the same replant/managed-face principles' \
            '- no force-loaded chunks and no synthetic stone/log cargo' \
            > stage/PRODUCTION_ALPHA114_TEST.txt

      - name: Upload tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-0.1.0-alpha.114-tested
          path: stage/
          if-no-files-found: error
