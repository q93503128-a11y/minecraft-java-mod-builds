name: Validate Living Kingdoms citadel anchor stability r1

on:
  pull_request:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/validate-living-kingdoms-citadel-anchor-stability-r1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'

jobs:
  citadel-stability:
    name: Java 25 / three fresh citadel worlds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build --stacktrace --console=plain

      - name: Three independent fresh-world citadel audits
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          for seed in 110731 220822 330913; do
            rm -rf run/world run/living_realm run/livingkingdoms-citadel-${seed}
            printf 'level-name=livingkingdoms-citadel-%s\nlevel-seed=%s\npause-when-empty-seconds=0\n' "$seed" "$seed" > run/server.properties
            printf 'eula=true\n' > run/eula.txt
            log="../../logs/citadel-${seed}.log"
            gradle --no-daemon runServer --stacktrace --console=plain > "$log" 2>&1 &
            pid=$!
            passed=0
            for attempt in $(seq 1 900); do
              if grep -Eq 'LK_REALM_DIAGNOSTIC_FAIL|Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError' "$log"; then
                cat "$log"
                kill "$pid" 2>/dev/null || true
                wait "$pid" 2>/dev/null || true
                exit 1
              fi
              if grep -Fq 'LK_ERDEN_CITADEL_INTERIOR_PASS zones=6' "$log"; then
                passed=1
                break
              fi
              if ! kill -0 "$pid" 2>/dev/null; then
                cat "$log"
                exit 1
              fi
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            cat "$log"
            test "$passed" -eq 1
            grep -F 'Completed Erden citadel zone=royal_archives' "$log" \
              | grep -E 'fixtures=[4-9][0-9]* required=4 connected_cells=([4-9]|[1-9][0-9]+)'
            grep -F 'LK_ERDEN_CITADEL_INTERIOR_PASS zones=6' "$log" \
              | grep -F 'enclosed=true' \
              | grep -F 'furnishing_connected=true' \
              | grep -F 'unique_fixture_cells=true' \
              | grep -F 'facade_replaced=false' \
              | grep -F 'loaded_only=true'
          done

      - name: Upload citadel logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-citadel-anchor-stability-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
