name: Finalize EARTH TO STARS alpha.13 docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-earth-to-stars-alpha13-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync alpha.13 canon docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/earth-to-stars')

          def replace(path, old, new, count=1):
              p = Path(path)
              body = p.read_text(encoding='utf-8')
              actual = body.count(old)
              if actual < count:
                  raise SystemExit(f'{p}: expected at least {count} occurrence(s), found {actual}: {old!r}')
              p.write_text(body.replace(old, new, count), encoding='utf-8')

          # PROJECT: environment and verification truth only.
          p = root / 'PROJECT.md'
          replace(p, '- Mod version: `0.1.0-alpha.12`', '- Mod version: `0.1.0-alpha.13`')
          replace(p, '- Loader version: `26.2.0.38-beta`', '- Loader version: `26.2.0.76`')
          replace(p, '- Final JAR: `earth_to_stars-0.1.0-alpha.12.jar`', '- Final JAR: `earth_to_stars-0.1.0-alpha.13.jar`')
          replace(p, '- Client smoke: `NOT RUN`', '- Client resource/model smoke: `PASS` — Xvfb `runClient` on Minecraft 26.2 / NeoForge 26.2.0.76, run `34328160894`; live visual quality remains `NOT PLAYTESTED`')

          # README / project index status.
          status12 = 'ALPHA.12 LIVE-ACCEPTANCE RESCUE BUILD + DEDICATED RESOURCE LOAD VERIFIED / LIVE CLIENT ACCEPTANCE NEXT / LIVE MULTIPLAYER NOT TESTED'
          status13 = 'ALPHA.13 CLIENT MODEL/RESOURCE RESCUE BUILD + ACTUAL CLIENT RESOURCE LOAD VERIFIED / LIVE VISUAL ACCEPTANCE NEXT / LIVE MULTIPLAYER NOT TESTED'
          replace(root / 'README.md', status12, status13)
          replace('projects/README.md', status12, status13)
          replace('projects/README.md', '- 현재 버전: `0.1.0-alpha.12`', '- 현재 버전: `0.1.0-alpha.13`')

          # M1 current status and explicit alpha.13 acceptance record.
          m1 = root / 'docs/05_M1_EARTH_ORBIT_GAMEPLAY_SLICE.md'
          replace(m1, '현재 버전: `0.1.0-alpha.12`', '현재 버전: `0.1.0-alpha.13`')
          replace(m1, f'`{status12}`', f'`{status13}`')
          marker = '## 1.1 alpha.12 Live-Acceptance Rescue 검증\n'
          body = m1.read_text(encoding='utf-8')
          if '## 1.1 alpha.13 Client Model/Resource Rescue 검증' not in body:
              section = '''## 1.1 alpha.13 Client Model/Resource Rescue 검증\n\nalpha.12는 build/JAR/dedicated resource load까지 통과했지만 실제 26.2.0.76 클라이언트에서 spacecraft model이 black/magenta missing-model cube로 표시되어 live acceptance에 실패했다. alpha.13은 이 실패를 숨기지 않고 client asset pipeline 자체를 수정한 rescue다.\n\n- 실제 플레이 로그의 NeoForge `26.2.0.76`을 build/client 검증 target으로 승격\n- Minecraft resource identifier 규칙을 어긴 `craft_speederA` mixed-case path 제거; 동일 Kenney mesh bytes를 lowercase `craft_speedera.obj`로 패키징\n- Kenney 원본 `Kd` 색상은 유지하면서 NeoForge OBJ baker가 요구하는 diffuse texture slot을 제공하는 neutral material adapter 추가\n- MTL `map_Kd #base` + model JSON `textures.base` 방식으로 NeoForge 26.2 공식 OBJ test contract에 정렬\n- starter craft / launch kit / salvage / interceptor 모두 explicit `mtl_override` 사용\n- alpha.13 validator가 uppercase resource path, missing adapter texture, 잘못된 MTL slot mapping을 거부\n- permanent path-scoped client resource smoke를 추가해 앞으로 model/item/texture 변경 시 실제 `runClient` resource reload를 검사\n\n자동 검증:\n\n- Build run `34328083026`: `PASS` — alpha.13 static gate / tests / clean build / production JAR verify\n- Client resource smoke run `34328160894`: `PASS` — Minecraft 26.2 + NeoForge 26.2.0.76 actual client ResourceManager reload / model bake / item atlas creation\n- alpha.12에서 관측된 mixed-case `IdentifierException`: 재현되지 않음\n- OBJ diffuse texture null NPE: 재현되지 않음\n- intermediate alpha.13 smoke에서 잡힌 `Missing texture references in model earth_to_stars`: 최종 smoke에서 재현되지 않음\n- 실제 화면에서 모델 크기/좌석 위치/조종감/transition feel: `NOT PLAYTESTED`\n- live multiplayer: `NOT TESTED`\n\n'''
              if marker not in body:
                  raise SystemExit('M1 alpha.12 marker missing')
              body = body.replace(marker, section + '## 1.2 alpha.12 Live-Acceptance Rescue 검증\n', 1)
              m1.write_text(body, encoding='utf-8')

          # Changelog: preserve alpha.12 historical record but mark its live failure via new alpha.13 entry.
          changelog = root / 'CHANGELOG.md'
          body = changelog.read_text(encoding='utf-8')
          marker = '## 2026-09-08 — alpha.12 Live-Acceptance Rescue\n'
          if '## 2026-09-09 — alpha.13 Client Model/Resource Rescue' not in body:
              entry = '''## 2026-09-09 — alpha.13 Client Model/Resource Rescue\n\n### Why alpha.13 exists\n\nalpha.12 passed static/build/JAR/dedicated-server resource gates, but the first real client acceptance exposed a black/magenta missing-model cube. The client log showed two production asset failures: illegal mixed-case `craft_speederA.obj` resource identifiers and NeoForge OBJ materials without a resolvable diffuse texture slot. alpha.12 is therefore a live-client acceptance failure, not a production-ready visual build.\n\n### Fixed / Changed\n\n- mod version `0.1.0-alpha.13`\n- validation/runtime target aligned to the observed live environment: Minecraft `26.2`, NeoForge `26.2.0.76`\n- starter mesh resource renamed to legal lowercase `craft_speedera.obj` while preserving the original Kenney OBJ mesh bytes\n- illegal mixed-case starter OBJ/MTL resource paths removed\n- Kenney `Kd` material colours retained; neutral white adapter texture added only to satisfy NeoForge's required diffuse map slot\n- MTLs use `map_Kd #base`; model JSONs resolve `textures.base` to `earth_to_stars:item/kenney_material_base`\n- starter craft / launch kit / salvage / interceptor all use explicit `mtl_override`\n- alpha.13 static validator and production JAR verifier reject mixed-case asset paths and broken material-slot mappings\n- path-scoped actual-client resource smoke added for future model/item/texture changes\n\n### Verification\n\nBuild source commit: `abacc358e4547b56e593a02552eccb9ac77d0d7c`\n\nGitHub Actions `Build earth-to-stars` run `34328083026`: `PASS`\n\n- alpha.13 acceptance validator: `PASS`\n- existing regression tests: `PASS`\n- `clean test build`: `PASS`\n- production JAR verify: `PASS`\n- JAR: `earth_to_stars-0.1.0-alpha.13.jar`\n- SHA-256: `540d4ba1cd0c2c74f06fc38013c7503820cb433ff8b4abd1615c480db1ad6a65`\n\nGitHub Actions `Smoke earth-to-stars client resources` run `34328160894`: `PASS`\n\n- actual `runClient` under Xvfb\n- Minecraft `26.2` / NeoForge `26.2.0.76` confirmed\n- client ResourceManager reload reached texture atlas creation\n- no EARTH TO STARS model load failure\n- no illegal mixed-case resource IdentifierException\n- no OBJ diffuse texture null NPE\n- no `Missing texture references in model earth_to_stars`\n\nHeadless runner narrator/audio-device errors are environment-only and not treated as EARTH TO STARS asset failures.\n\n- client resource/model load: `TESTED`\n- visual quality/scale/seat alignment in a real gameplay viewport: `NOT PLAYTESTED`\n- live Earth→Orbit gameplay cycle: `NOT PLAYTESTED`\n- live multiplayer: `NOT TESTED`\n\n### Status\n\n`ALPHA.13 CLIENT MODEL/RESOURCE RESCUE BUILD + ACTUAL CLIENT RESOURCE LOAD VERIFIED / LIVE VISUAL ACCEPTANCE NEXT / LIVE MULTIPLAYER NOT TESTED`\n\n---\n\n'''
              if marker not in body:
                  raise SystemExit('CHANGELOG alpha.12 marker missing')
              changelog.write_text(body.replace(marker, entry + marker, 1), encoding='utf-8')

          # Third-party ledger: accurately distinguish untouched mesh bytes from adapted Minecraft MTL/material glue.
          third = root / 'THIRD_PARTY_ASSETS.md'
          replace(third, '  - `craft_speederA` — starter launch craft', '  - upstream `craft_speederA` mesh → repository-safe `craft_speedera.obj` — starter launch craft')
          replace(third, '  - vendored OBJ/MTL source bytes are kept intact\n  - Minecraft-facing scale/orientation/presentation is adapted through NeoForge model/item resources and runtime transforms', '  - Kenney OBJ mesh geometry bytes are preserved; the starter filename is normalized to lowercase for Minecraft resource identifiers\n  - MTL files are Minecraft/NeoForge adapters: original Kenney `Kd` colours are preserved and mapped through the project `#base` neutral texture slot required by the 26.2 OBJ baker\n  - Minecraft-facing scale/orientation/presentation is adapted through NeoForge model/item resources and runtime transforms')

          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/earth-to-stars/PROJECT.md projects/earth-to-stars/README.md projects/earth-to-stars/CHANGELOG.md projects/earth-to-stars/docs/05_M1_EARTH_ORBIT_GAMEPLAY_SLICE.md projects/earth-to-stars/THIRD_PARTY_ASSETS.md projects/README.md
          git commit -m 'docs(earth-to-stars): canonize alpha13 client-resource rescue [skip ci]'
          git push origin HEAD:main
