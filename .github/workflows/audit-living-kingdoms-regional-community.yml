name: Audit Living Kingdoms regional community

on:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-regional-community.yml'
  workflow_dispatch:

concurrency:
  group: living-kingdoms-regional-community-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'

jobs:
  audit:
    name: Java 25 / fresh community server / JAR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build --stacktrace --console=plain

      - name: Fresh dedicated server regional community audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          rm -rf run/world run/living_realm run/livingkingdoms-regional-community-audit-world
          printf 'level-name=livingkingdoms-regional-community-audit-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/regional-community-audit-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 1400); do
            if grep -Eq 'LK_REALM_DIAGNOSTIC_FAIL|LK_ERDEN_REGIONAL_COMMUNITY_PHYSICAL_FAIL|Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError|Invalid Erden regional' ../../logs/regional-community-audit-server.log; then
              cat ../../logs/regional-community-audit-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_REGIONAL_COMMUNITY_PASS revision=1 settlements=6 households=48 residents=144 activity_modes=7' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_COMMUNITY_PHYSICAL_PASS revision=1 settlement=harvest_crossing residents=3 destinations=4' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_GOVERNANCE_PASS revision=1 councils=6 officials=12 guard_posts=12 alive_guards=12' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_GOVERNANCE_PHYSICAL_PASS revision=1 settlement=harvest_crossing guards=2 equipped_guards=2 billet_guards=2' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_ROAD_SECURITY_PASS revision=1 waystations=4 assigned_settlements=6 covered_waystations=4' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_SETTLEMENT_PASS revision=1 settlements=6 buildings=60' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_SOCIETY_PASS revision=1 settlements=6 households=48 residents=144 workers=96 dependents=48' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_ECONOMY_PASS revision=1 settlements=6 households=48 markets=6' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_ROADS_PASS revision=1 corridors=8 waystations=4' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_LOGISTICS_PASS revision=1 corridors=8 waystations=4' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_POPULATION_DIAGNOSTIC_PASS households=77 residents=231 workers=154' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/regional-community-audit-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_WORKFORCE_PASS revision=1 nodes=18 households=74 residents=216 workers=142 dependents=74' ../../logs/regional-community-audit-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/regional-community-audit-server.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/regional-community-audit-server.log
          test "$passed" -eq 1

          grep -F 'LK_ERDEN_REGIONAL_COMMUNITY_PASS revision=1 settlements=6 households=48 residents=144 activity_modes=7' ../../logs/regional-community-audit-server.log \
            | grep -F 'work_preserved=true' \
            | grep -F 'off_duty_precedence=true' \
            | grep -F 'breakfast_home=true' \
            | grep -F 'market_errands=true' \
            | grep -F 'children_square=true' \
            | grep -F 'elder_neighboring=true' \
            | grep -F 'family_supper=true' \
            | grep -F 'inn_gathering=true' \
            | grep -F 'rest_day_social=true' \
            | grep -F 'shortage_aware=true' \
            | grep -F 'deterministic_schedule=true' \
            | grep -F 'fluid_safe_targets=true' \
            | grep -F 'navigation_only=true' \
            | grep -F 'loaded_route_guard=true' \
            | grep -F 'no_chunk_loading=true' \
            | grep -F 'persistent_forced_chunks=false'

          grep -F 'LK_ERDEN_REGIONAL_COMMUNITY_PHYSICAL_PASS revision=1 settlement=harvest_crossing residents=3 destinations=4' ../../logs/regional-community-audit-server.log \
            | grep -F 'physical_home=true' \
            | grep -F 'physical_square=true' \
            | grep -F 'physical_inn=true' \
            | grep -F 'physical_market=true' \
            | grep -F 'resident_identity=true' \
            | grep -F 'destinations_walkable=true' \
            | grep -F 'transient_probe_released=true' \
            | grep -F 'staged_probe=true' \
            | grep -F 'refreshed_until_verification=true' \
            | grep -F 'refresh_ticks=40' \
            | grep -F 'navigation_only=true' \
            | grep -F 'loaded_route_guard=true' \
            | grep -F 'persistent_forced_chunks=false'

      - name: JAR verification
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          test "${#jars[@]}" -eq 1
          jar="${jars[0]}"
          unzip -t "$jar"
          entries="$(mktemp)"
          unzip -Z1 "$jar" > "$entries"
          test "$(sort "$entries" | uniq -d | wc -l)" -eq 0
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalCommunityManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalCommunityPhysicalAudit.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalGovernanceManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalSocietyManager.class' "$entries"
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-alpha.12"'

      - name: Upload audit logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-regional-community-audit-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
