name: Apply Frontier Construction Robustness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-construction-robustness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply robustness patch
        shell: bash
        run: python3 projects/frontier-settlement/tools/apply_construction_robustness_patch.py

      - name: Static regression assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement')
          construction=(root/'settlement/SettlementConstructionService.java').read_text(encoding='utf-8')
          btype=(root/'settlement/BuildingType.java').read_text(encoding='utf-8')
          commands=(root/'command/SettlementCommands.java').read_text(encoding='utf-8')
          context=(root/'settlement/SettlementContextService.java').read_text(encoding='utf-8')
          assert 'MINE("mine", "광산", 68, 44, 11, 11, 10, 0' in btype
          assert 'hasFreshScaffoldCoverage(level, type, site.origin(), rotation)' in construction
          assert 'canReplaceConstructionTarget' in construction
          assert 'workPositionsFor' in construction
          assert 'result.add(ground);' in construction
          assert 'current.is(Blocks.BARREL) && level.getBlockEntity(supply) instanceof Container crate' in construction
          assert 'public static String constructionIssue' in construction
          assert 'c.step()*100/total' not in commands
          assert 'totalSteps(t,c.origin(),c.rotation())' in commands
          assert 'SettlementConstructionService.constructionIssue(server, data)' in context
          print('static construction robustness assertions PASS')
          PY

      - name: Java 25 clean build
        shell: bash
        run: |
          set -o pipefail
          cd projects/frontier-settlement
          ./gradlew clean build --no-daemon --stacktrace 2>&1 | tee ../../frontier-construction-robustness-build.log

      - name: Prepare headless NeoForge QA server
        shell: bash
        run: |
          rm -rf projects/frontier-settlement/run/server
          mkdir -p projects/frontier-settlement/run/server
          printf 'eula=true\n' > projects/frontier-settlement/run/server/eula.txt

      - name: Run 72-case construction matrix in NeoForge
        shell: bash
        env:
          FRONTIER_MATRIX_QA: '1'
        run: |
          set -o pipefail
          cd projects/frontier-settlement
          timeout 240 ./gradlew runServer --no-daemon 2>&1 | tee ../../frontier-construction-robustness-matrix.log
          grep -q 'FRONTIER_CONSTRUCTION_MATRIX_QA_V2' ../../frontier-construction-robustness-matrix.log
          grep -q 'TOTAL cases=72 failures=0' ../../frontier-construction-robustness-matrix.log
          grep -q 'zeroReachTargets=0 singleReachTargets=0' ../../frontier-construction-robustness-matrix.log

      - name: Upload verified build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-construction-robustness-verified
          path: |
            frontier-construction-robustness-build.log
            frontier-construction-robustness-matrix.log
            projects/frontier-settlement/build/libs/*.jar
          if-no-files-found: error

      - name: Commit production patch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/BuildingType.java \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementContextService.java \
            projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/command/SettlementCommands.java
          if git diff --cached --quiet; then
            echo 'No production patch changes to commit'
            exit 0
          fi
          git commit -m "Harden Frontier construction edge cases"
          git pull --rebase origin main
          git push origin HEAD:main
