name: Audit Living Kingdoms exterior residence overlap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/audit_living_kingdoms_exterior_residence_overlap.py'
      - '.github/workflows/audit-living-kingdoms-exterior-residence-overlap.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Calculate exact structure overlap
        run: python .github/scripts/audit_living_kingdoms_exterior_residence_overlap.py
      - name: Upload overlap report
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-exterior-residence-overlap-${{ github.run_number }}
          path: logs/exterior-residence-overlap.json
          if-no-files-found: warn
          retention-days: 30
      - name: Record overlap audit pointer
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            mkdir -p .github/build-pointers
            cat > .github/build-pointers/living-kingdoms-exterior-residence-overlap.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID"
          }
          EOF
            git add .github/build-pointers/living-kingdoms-exterior-residence-overlap.json
            git commit -m "Record Living Kingdoms residence overlap audit $GITHUB_RUN_NUMBER" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

# Diagnostic-only workflow. A non-zero overlap is reported, not treated as CI failure,
# so the result can drive a deliberate save-compatible residence layout revision.
