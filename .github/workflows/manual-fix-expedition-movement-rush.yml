name: Manual Fix Expedition Movement Rush
# trigger: registered workflow validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-fix-expedition-movement-rush.yml'
      - 'projects/survival-ascension/tools/patch_expedition_movement_rush.py'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply movement rush fix
        run: python3 projects/survival-ascension/tools/patch_expedition_movement_rush.py

      - name: Targeted source assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root=Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/expedition')
          p=(root/'ExpeditionProgression.java').read_text(encoding='utf-8')
          i=(root/'ExpeditionIncident.java').read_text(encoding='utf-8')
          assert 'player.tickCount % 5 != 0' in p
          assert 'double dy = pos.y - old.y;' in p
          assert 'old.bank' in p and 'recordAction(player, ExpeditionAction.OCEAN_VOYAGE, amount);' in p
          assert 'OCEAN_VOYAGE, 80)' in i and 'OCEAN_VOYAGE, 110)' in i
          assert 'FROZEN_RUSH' in i and 'TRAVEL_DISTANCE, 120)' in i
          assert 'FROZEN_FRONTIER_RUSH' in i and 'TRAVEL_DISTANCE, 150)' in i
          print('targeted expedition movement assertions PASS')
          PY

      - name: Java 25 clean build
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Verify JAR
        run: python3 projects/survival-ascension/tools/verify_jar.py projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/expedition/ExpeditionProgression.java \
                  projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/expedition/ExpeditionIncident.java
          if git diff --cached --quiet; then
            echo 'No source changes to commit'
            exit 0
          fi
          git commit -m 'Make expedition movement rushes reliably clearable'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload fixed Survival JAR
        uses: actions/upload-artifact@v4
        with:
          name: survival-ascension-061-expedition-movement-fix
          path: projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          if-no-files-found: error
