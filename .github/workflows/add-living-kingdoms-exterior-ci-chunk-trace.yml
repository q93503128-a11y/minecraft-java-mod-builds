name: Add Living Kingdoms exterior CI chunk trace

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_living_kingdoms_exterior_ci_chunk_trace.py'
      - '.github/workflows/add-living-kingdoms-exterior-ci-chunk-trace.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Add CI chunk trace
        run: python .github/scripts/add_living_kingdoms_exterior_ci_chunk_trace.py
      - name: Compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Commit trace instrumentation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenKingdomExteriorBuilder.java
          git diff --cached --quiet && exit 0
          git commit -m 'Trace exterior CI chunk construction progress'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# CI-only logging instrumentation; keep source trace until watchdog root cause is closed. Triggered explicitly.
