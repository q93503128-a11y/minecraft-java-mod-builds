name: TEMP HiddenRubric Lane04 Relation First Mine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-relation-first-mine.yml'

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Patch optional relation capture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('temp-hiddenrubric/lane04/relation_first_mine.py')
          s=p.read_text(encoding='utf-8')
          old="rawrel=m.group('rel'); score=base"
          new="rawrel=m.groupdict().get('rel') or ('submit' if ptype.startswith('submit') else 'review'); score=base"
          assert old in s
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
      - name: Mine relation-first candidates
        run: python temp-hiddenrubric/lane04/relation_first_mine.py
      - name: Commit temporary relation-first queue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/relation-evaluator-*.jsonl temp-hiddenrubric/lane04/relation-evaluator-manifest.json
          git commit -m 'chore: materialize temporary Lane04 relation-first queue'
          git push origin HEAD:main
