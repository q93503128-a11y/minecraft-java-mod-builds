name: Build Openworld RPG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/openworld-rpg/src/**'
      - 'projects/openworld-rpg/build.gradle'
      - 'projects/openworld-rpg/gradle.properties'
      - 'projects/openworld-rpg/settings.gradle'
      - 'projects/openworld-rpg/gradle/**'
      - 'projects/openworld-rpg/gradlew'
      - 'projects/openworld-rpg/gradlew.bat'
      - '.github/workflows/build-openworld-rpg.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/openworld-rpg

jobs:
  m0-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify toolchain
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Verify pinned gameplay foundation artifacts
        run: ./gradlew --no-daemon verifyGameplayFoundationDependencies --stacktrace

      - name: Inspect pinned gameplay foundation metadata
        run: ./gradlew --no-daemon inspectGameplayFoundationMetadata --stacktrace

      - name: Verify pinned creature dependency metadata
        run: ./gradlew --no-daemon inspectCreatureFoundationDependencies --stacktrace

      - name: Test and build M0 core
        run: ./gradlew --no-daemon clean test build --stacktrace

      - name: Inspect pinned Earthloong dependency surface
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon inspectEarthloongDependencySurface --stacktrace
          cat build/reports/m0/earthloong-dependency-surface.txt

      - name: Verify bootstrap JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/openworld-rpg-0.1.0-alpha.1.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^fabric.mod.json$'
          jar tf "$JAR" | grep -q '^data/openworld_rpg/integration/dependencies.json$'
          jar tf "$JAR" | grep -q '^dev/moonseungjun/openworldrpg/OpenworldRpgMod.class$'
          jar tf "$JAR" | grep -q '^dev/moonseungjun/openworldrpg/integration/bootstrap/IntegrationBootstrap.class$'
          jar tf "$JAR" | grep -q '^dev/moonseungjun/openworldrpg/integration/ExternalRuntimeContainment.class$'
          jar tf "$JAR" | grep -q '^dev/moonseungjun/openworldrpg/integration/overlay/ActorIntegrationOverlay.class$'
          sha256sum "$JAR" | tee "$JAR.sha256"

      - name: Core-profile dedicated server smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run-core
          mkdir -p run-core build/logs
          printf 'eula=true\n' > run-core/eula.txt

          set +e
          timeout --kill-after=15s 150s ./gradlew --no-daemon runCoreServer --stacktrace 2>&1 | tee build/logs/server-core.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 && $status -ne 137 ]]; then
            echo "runCoreServer exited unexpectedly with status $status"
            exit "$status"
          fi

          grep -q 'Openworld RPG M0 integration bootstrap loaded with profile core' build/logs/server-core.log
          if grep -Eqi 'Could not execute entrypoint|ModResolutionException|NoClassDefFoundError.*openworldrpg|ClassNotFoundException.*openworldrpg' build/logs/server-core.log; then
            echo 'Openworld RPG M0 core integration error detected.'
            exit 1
          fi

      - name: Gameplay-profile dependency server smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run-gameplay
          mkdir -p run-gameplay build/logs
          printf 'eula=true\n' > run-gameplay/eula.txt

          set +e
          timeout --kill-after=10s 80s ./gradlew --no-daemon -PopenworldGameplayRuntime=true -PopenworldM0RuntimeVerification=true runGameplayServer --stacktrace 2>&1 | tee build/logs/server-gameplay.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 && $status -ne 137 ]]; then
            echo "runGameplayServer exited unexpectedly with status $status"
            exit "$status"
          fi

          grep -q 'Openworld RPG M0 integration bootstrap loaded with profile gameplay' build/logs/server-gameplay.log
          grep -q 'Openworld RPG external runtime containment verified before gameplay server start' build/logs/server-gameplay.log
          grep -q 'Openworld RPG external actor binding armed for threateningly_mobs:the_earthloong' build/logs/server-gameplay.log
          grep -q 'Openworld RPG external actor registry target verified at server start: threateningly_mobs:the_earthloong' build/logs/server-gameplay.log
          grep -q 'Openworld RPG Better Combat authority adapter armed for profile gameplay' build/logs/server-gameplay.log
          grep -q 'Openworld RPG Spell Engine authority gate armed for profile gameplay' build/logs/server-gameplay.log
          grep -q 'OPENWORLD_RPG_M0_RUNTIME_IMPACT_PASS target=threateningly_mobs:the_earthloong canonicalHpBefore=4900.0 canonicalHpAfter=4871.0' build/logs/server-gameplay.log
          grep -q 'OPENWORLD_RPG_M0_RUNTIME_MELEE_PASS target=threateningly_mobs:the_earthloong donorProposalIgnored=9999.0 damage=17.0 canonicalHpBefore=4900.0 canonicalHpAfter=4883.0 poiseAfter=180.0 actionCoefficient=0.8' build/logs/server-gameplay.log
          grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' build/logs/server-gameplay.log
          grep -Eq '\[MobFilter\] [1-9][0-9]* rule\(s\) loaded' build/logs/server-gameplay.log

          if grep -Eqi 'RPG Series loot config: failed to resolve itemList|\[MobFilter\] No rules configured|alexsmobs:gameplay/seal_reward' build/logs/server-gameplay.log; then
            echo 'Donor progression/loot/ecology leakage warning detected.'
            exit 1
          fi
          if grep -Eqi 'ModResolutionException|Could not execute entrypoint|NoClassDefFoundError|ClassNotFoundException' build/logs/server-gameplay.log; then
            echo 'Gameplay-profile dependency integration error detected.'
            exit 1
          fi

      - name: Gameplay-profile client startup smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run-client-gameplay
          mkdir -p run-client-gameplay build/logs

          set +e
          xvfb-run -a timeout --kill-after=10s 90s ./gradlew --no-daemon -PopenworldGameplayRuntime=true runGameplayClient --stacktrace 2>&1 | tee build/logs/client-gameplay.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 && $status -ne 137 ]]; then
            echo "runGameplayClient exited unexpectedly with status $status"
            exit "$status"
          fi

          grep -q 'Openworld RPG M0 integration bootstrap loaded with profile gameplay' build/logs/client-gameplay.log
          grep -q 'Openworld RPG Better Combat authority adapter armed for profile gameplay' build/logs/client-gameplay.log
          grep -q 'Openworld RPG Spell Engine authority gate armed for profile gameplay' build/logs/client-gameplay.log
          grep -q 'Backend library: LWJGL' build/logs/client-gameplay.log

          if grep -Eqi 'ModResolutionException|Could not execute entrypoint|NoClassDefFoundError|ClassNotFoundException|MixinApplyError|InvalidInjectionException' build/logs/client-gameplay.log; then
            echo 'Gameplay-profile client integration error detected.'
            exit 1
          fi

      - name: Build JVM-free joined-player Arc Bolt playtest JAR
        shell: bash
        run: |
          set -euo pipefail
          NORMAL_JAR="build/libs/openworld-rpg-0.1.0-alpha.1.jar"
          PLAYTEST_JAR="build/libs/openworld-rpg-0.1.0-alpha.1-m0-playtest.jar"
          MARKER="data/openworld_rpg/integration/m0_player_verification.enabled"
          PLAYTEST_JAR_ABS="$PWD/$PLAYTEST_JAR"
          MARKER_ROOT="$PWD/build/m0-playtest-marker"

          test -s "$NORMAL_JAR"
          if jar tf "$NORMAL_JAR" | grep -q "^$MARKER$"; then
            echo 'Normal Openworld RPG JAR unexpectedly contains the M0 player-verification marker.'
            exit 1
          fi

          rm -rf "$MARKER_ROOT"
          mkdir -p "$MARKER_ROOT/$(dirname "$MARKER")"
          printf 'enabled\n' > "$MARKER_ROOT/$MARKER"

          cp "$NORMAL_JAR" "$PLAYTEST_JAR"
          (
            cd "$MARKER_ROOT"
            jar uf "$PLAYTEST_JAR_ABS" "$MARKER"
          )

          jar tf "$PLAYTEST_JAR" | grep -q "^$MARKER$"
          if jar tf "$NORMAL_JAR" | grep -q "^$MARKER$"; then
            echo 'Normal Openworld RPG JAR was modified while producing the playtest artifact.'
            exit 1
          fi

          sha256sum "$PLAYTEST_JAR" | tee "$PLAYTEST_JAR.sha256"

      - name: Package importable M0 Modrinth playtest pack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os
          import shutil
          import zipfile

          project = os.getcwd()
          cache = os.path.expanduser("~/.gradle/caches/modules-2/files-2.1")
          out_dir = os.path.join(project, "build", "m0-mrpack")
          overrides_mods = os.path.join(out_dir, "overrides", "mods")
          os.makedirs(overrides_mods, exist_ok=True)

          playtest_name = "openworld-rpg-0.1.0-alpha.1-m0-playtest.jar"
          playtest_src = os.path.join(project, "build", "libs", playtest_name)
          if not os.path.isfile(playtest_src):
              raise SystemExit(f"missing playtest jar: {playtest_src}")
          shutil.copy2(playtest_src, os.path.join(overrides_mods, playtest_name))

          deps = [
              ("fabric-api-0.160.0+26.2.jar",
               "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.160.0+26.2/fabric-api-0.160.0+26.2.jar"),
              ("5sy6g3kz-enlZuzkJ.jar",
               "https://api.modrinth.com/maven/maven/modrinth/5sy6g3kz/enlZuzkJ/5sy6g3kz-enlZuzkJ.jar"),
              ("ha1mEyJS-Hq1CwB9w.jar",
               "https://api.modrinth.com/maven/maven/modrinth/ha1mEyJS/Hq1CwB9w/ha1mEyJS-Hq1CwB9w.jar"),
              ("cloth-config-fabric-26.2.155.jar",
               "https://maven.shedaniel.me/me/shedaniel/cloth/cloth-config-fabric/26.2.155/cloth-config-fabric-26.2.155.jar"),
              ("spell-engine-1.10.5+26.2-fabric.jar",
               "https://api.modrinth.com/maven/maven/modrinth/spell-engine/1.10.5+26.2-fabric/spell-engine-1.10.5+26.2-fabric.jar"),
              ("spell-power-1.6.2+26.2-fabric.jar",
               "https://api.modrinth.com/maven/maven/modrinth/spell-power/1.6.2+26.2-fabric/spell-power-1.6.2+26.2-fabric.jar"),
              ("ranged-weapon-api-4.0.0+26.2-fabric.jar",
               "https://api.modrinth.com/maven/maven/modrinth/ranged-weapon-api/4.0.0+26.2-fabric/ranged-weapon-api-4.0.0+26.2-fabric.jar"),
              ("armor-model-api-1.1.0+26.2-fabric.jar",
               "https://api.modrinth.com/maven/maven/modrinth/armor-model-api/1.1.0+26.2-fabric/armor-model-api-1.1.0+26.2-fabric.jar"),
              ("XaT8sLP6-r453A8nE.jar",
               "https://api.modrinth.com/maven/maven/modrinth/XaT8sLP6/r453A8nE/XaT8sLP6-r453A8nE.jar"),
              ("geckolib-388172-8819017.jar",
               "https://cursemaven.com/curse/maven/geckolib-388172/8819017/geckolib-388172-8819017.jar"),
              ("gRn1FzwR-NYpKsGy3.jar",
               "https://api.modrinth.com/maven/maven/modrinth/gRn1FzwR/NYpKsGy3/gRn1FzwR-NYpKsGy3.jar"),
              ("alexs-mobs-continued-1635121-8856579.jar",
               "https://cursemaven.com/curse/maven/alexs-mobs-continued-1635121/8856579/alexs-mobs-continued-1635121-8856579.jar"),
              ("codxlib-1633207-8828221.jar",
               "https://cursemaven.com/curse/maven/codxlib-1633207/8828221/codxlib-1633207-8828221.jar"),
              ("threateninglly-mobs-continued-1637799-8804647.jar",
               "https://cursemaven.com/curse/maven/threateninglly-mobs-continued-1637799/8804647/threateninglly-mobs-continued-1637799-8804647.jar"),
          ]

          files = []
          for filename, url in deps:
              matches = glob.glob(os.path.join(cache, "**", filename), recursive=True)
              matches = [p for p in matches if os.path.isfile(p)]
              if not matches:
                  raise SystemExit(f"resolved dependency missing from Gradle cache: {filename}")
              source = matches[0]
              with open(source, "rb") as f:
                  data = f.read()
              files.append({
                  "path": f"mods/{filename}",
                  "hashes": {
                      "sha1": hashlib.sha1(data).hexdigest(),
                      "sha512": hashlib.sha512(data).hexdigest(),
                  },
                  "env": {"client": "required", "server": "required"},
                  "downloads": [url],
                  "fileSize": len(data),
              })

          index = {
              "formatVersion": 1,
              "game": "minecraft",
              "versionId": "0.1.0-alpha.1-m0-playtest",
              "name": "Openworld RPG M0 Arc Bolt Playtest",
              "summary": "Minecraft 26.2 Fabric M0 integration playtest with pinned Openworld RPG runtime dependencies.",
              "files": files,
              "dependencies": {
                  "minecraft": "26.2",
                  "fabric-loader": "0.19.5",
              },
          }

          with open(os.path.join(out_dir, "modrinth.index.json"), "w", encoding="utf-8") as f:
              json.dump(index, f, ensure_ascii=False, indent=2)

          readme = "\n".join([
              "Openworld RPG — M0 Arc Bolt Playtest",
              "",
              "Import this .mrpack into Modrinth App or another launcher that supports Modrinth packs.",
              "",
              "Pinned runtime:",
              "- Minecraft 26.2",
              "- Fabric Loader 0.19.5",
              "- Java 25",
              "- Fabric API 0.160.0+26.2",
              "- Openworld RPG 0.1.0-alpha.1 M0 playtest build",
              "- all pinned gameplay/creature dependencies from the project manifest",
              "",
              "This is a disposable integration-test pack, not the finished RPG.",
              "",
              "Test:",
              "1. Create a test world with cheats enabled.",
              "2. The M0 playtest build automatically prepares the joining player as Lv8 Mage, INT +7, ItemLv8 Staff project loadout.",
              "3. Give an Arc Bolt host item:",
              "   /give @s minecraft:wooden_sword[spell_engine:spell_container={access:MAGIC, spell_ids: [\\\"openworld_rpg:arc_bolt\\\"] }]",
              "4. Spawn Earthloong:",
              "   /owr_spawn_earthloong",
              "5. Cast Arc Bolt and confirm the projectile lands normally.",
              "",
              "Do not mix this pack with an older Openworld RPG jar.",
              "",
          ])
          with open(os.path.join(out_dir, "overrides", "OPENWORLD_RPG_M0_PLAYTEST.txt"), "w", encoding="utf-8") as f:
              f.write(readme)

          pack_path = os.path.join(project, "build", "libs", "openworld-rpg-0.1.0-alpha.1-m0-playtest.mrpack")
          with zipfile.ZipFile(pack_path, "w", compression=zipfile.ZIP_DEFLATED) as z:
              z.write(os.path.join(out_dir, "modrinth.index.json"), "modrinth.index.json")
              for root, _, names in os.walk(os.path.join(out_dir, "overrides")):
                  for name in names:
                      p = os.path.join(root, name)
                      arc = os.path.relpath(p, out_dir).replace(os.sep, "/")
                      z.write(p, arc)

          with open(pack_path, "rb") as f:
              pack_bytes = f.read()
          sha256 = hashlib.sha256(pack_bytes).hexdigest()
          with open(pack_path + ".sha256", "w", encoding="ascii") as f:
              f.write(f"{sha256}  {os.path.basename(pack_path)}\n")
          print(f"M0_MRPACK_READY path={pack_path} sha256={sha256} dependencies={len(files)}")
          PY

      - name: Write M0 build report
        shell: bash
        run: |
          JAR="build/libs/openworld-rpg-0.1.0-alpha.1.jar"
          SHA=$(cat "$JAR.sha256")
          cat > build/BUILD_AND_RUNTIME_REPORT.md <<EOF
          # Openworld RPG — M0 External Runtime Containment Gate

          - Commit: $GITHUB_SHA
          - Minecraft: 26.2
          - Java: 25
          - Fabric Loader: 0.19.5
          - Fabric API: 0.160.0+26.2
          - Gradle: 9.5.1
          - Loom: 1.17.20
          - gameplay foundation artifact SHA-256 verification: PASS
          - gameplay foundation metadata inspection: PASS
          - creature dependency artifact SHA-256/metadata verification: PASS
          - pinned Earthloong dependency class/resource surface inspection: PASS
          - unit tests: PASS
          - clean build: PASS
          - bootstrap JAR verify: PASS
          - dedicated server core-profile boot: PASS
          - gameplay-profile top-level dependency server boot: PASS
          - donor weapon/loot/progression/ecology containment startup gate: PASS
          - gameplay-profile client startup/render-thread smoke: PASS
          - client world join: NOT RUN
          - R01 Earthloong registry/profile binding: STARTUP VERIFIED
          - Earthloong donor XP/loot suppression: IMPLEMENTED; project reward transaction NOT IMPLEMENTED
          - Earthloong authored spawn utility: IMPLEMENTED + 40-TICK SERVER SURVIVAL VERIFIED; encounter-controller invocation NOT TESTED
          - Better Combat bound-actor canonical melee authority: IMPLEMENTED + UNIT/RUNTIME BRIDGE VERIFIED (donor damage ignored; exact real-player Better Combat network hit NOT TESTED)
          - Spell Engine resource/cooldown continuation transaction: IMPLEMENTED + UNIT/SERVER STARTUP VERIFIED
          - project cooldown client/HUD projection after completed cast: IMPLEMENTED + CLIENT STARTUP VERIFIED
          - project impact transaction core (damage/heal/status/poise + Defense/MR caps): IMPLEMENTED + UNIT TESTED
          - player active-defense authority (dodge/guard/perfect-guard/guard-break + Stamina): IMPLEMENTED + UNIT TESTED; perfect-guard-only committed attacks supported; player-facing input/animation adapter NOT IMPLEMENTED
          - normalized player incoming Defense/MR authority: IMPLEMENTED + UNIT TESTED; explicit project-hit runtime bridge IMPLEMENTED; attack-specific encounter hit-event binding NOT IMPLEMENTED
          - project direct-magic runtime bridge: IMPLEMENTED + UNIT/BUILD/STARTUP VERIFIED
          - player combat build snapshot producer: IMPLEMENTED + UNIT/RUNTIME HARNESS VERIFIED
          - persistent 12-slot equipped-loadout publisher: IMPLEMENTED + UNIT/BUILD VERIFIED (main weapon/off-hand/armor/accessories; project affix aggregation; wand+focus power; family-power cap)
          - persistent defensive equipment publisher: IMPLEMENTED + UNIT TESTED (per-slot-rounded armor DEF/MR; shield-family GuardRating; Defense/MR/Guard Strength affixes; Guard Strength +50% gear cap; no main weapon required; weapon-guard rating intentionally not invented)
          - live combat-build refresh: IMPLEMENTED for join + project progression mutations + project equipment mutations
          - Earthloong canonical HP virtualization: IMPLEMENTED + RUNTIME VERIFIED (4900 -> 4871 from one canon-valid Lv8 Mage/ItemLv8 Staff Arc Bolt hit; vanilla health is proportional proxy)
          - exact Earthloong entity HP delta runtime harness: PASS (Arc Bolt 29 damage / 4.25 poise from produced snapshot; donor power ignored)
          - external actor non-project HP damage: FAIL-CLOSED by one-shot project damage authorization in both directions; bound external actors cannot apply donor-origin HP damage directly to players
          - Earthloong runtime boss poise: IMPLEMENTED + UNIT/RUNTIME HARNESS VERIFIED (4.25 poise Arc Bolt fixture, break +15% damage window, recovery/protection math)
          - persistent combat progression: IMPLEMENTED + UNIT/BUILD VERIFIED
          - JVM-free joined-player Arc Bolt playtest artifact: BUILT + MARKER VERIFIED
          - importable M0 Modrinth playtest pack: BUILT from pinned original-source downloads
          - real joined-player Spell Engine impact: NOT TESTED
          - full backpack/loot-generation/equipment UI: NOT IMPLEMENTED
          - player-facing R01 content: NOT IMPLEMENTED
          - playtest: NOT RUN
          - multiplayer test: NOT RUN
          - SHA-256: $SHA
          EOF

      - name: Upload M0 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openworld-rpg-m0-${{ github.sha }}
          path: |
            projects/openworld-rpg/build/libs/openworld-rpg-*.jar
            projects/openworld-rpg/build/libs/openworld-rpg-*.jar.sha256
            projects/openworld-rpg/build/libs/openworld-rpg-*.mrpack
            projects/openworld-rpg/build/libs/openworld-rpg-*.mrpack.sha256
            projects/openworld-rpg/build/BUILD_AND_RUNTIME_REPORT.md
            projects/openworld-rpg/build/reports/**
            projects/openworld-rpg/build/logs/**
          if-no-files-found: warn
          retention-days: 7
