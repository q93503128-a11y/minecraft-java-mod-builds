name: Build Fishing Game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/fishing-game/**'
      - '.github/workflows/build-fishing-game.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/fishing-game

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify toolchain
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Clean build
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Inspect playable JAR
        run: |
          JAR="build/libs/fishing-game-0.1.0-alpha.4.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^fabric.mod.json$'
          jar tf "$JAR" | grep -q '^dev/moonseungjun/fishinggame/FishingGameMod.class$'
          jar tf "$JAR" | grep -q '^dev/moonseungjun/fishinggame/world/FishingWorldManager.class$'
          jar tf "$JAR" | grep -q '^data/fishinggame/dimension/lakeside.json$'
          jar tf "$JAR" | grep -q '^data/fishinggame/dimension_type/lakeside.json$'
          jar tf "$JAR" | grep -q '^data/fishinggame/world_clock/lakeside.json$'
          jar tf "$JAR" | grep -q '^assets/fishinggame/'
          sha256sum "$JAR" | tee "$JAR.sha256"

      - name: Dedicated server smoke
        run: |
          mkdir -p run build
          printf 'eula=true\n' > run/eula.txt
          ./gradlew --no-daemon runServer > build/server-smoke.log 2>&1 &
          GRADLE_PID=$!

          cleanup() {
            kill "$GRADLE_PID" 2>/dev/null || true
            pkill -P "$GRADLE_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if grep -q 'Done (' build/server-smoke.log 2>/dev/null || grep -q 'Done (' run/logs/latest.log 2>/dev/null; then
              echo "Dedicated server reached ready state."
              exit 0
            fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then
              echo "Dedicated server exited before reaching ready state."
              cat build/server-smoke.log
              exit 1
            fi
            sleep 2
          done

          echo "Dedicated server did not reach ready state within 120 seconds."
          cat build/server-smoke.log
          exit 1

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishing-game-0.1.0-alpha.4-build
          path: |
            projects/fishing-game/build/libs/*.jar
            projects/fishing-game/build/libs/*.sha256
            projects/fishing-game/build/reports/**
            projects/fishing-game/build/server-smoke.log
            projects/fishing-game/run/logs/latest.log
          if-no-files-found: warn
          retention-days: 7
