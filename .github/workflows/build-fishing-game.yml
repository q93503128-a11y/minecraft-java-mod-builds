name: Build Fishing Game

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/fishing-game/**'
      - '.github/workflows/build-fishing-game.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/fishing-game

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify toolchain
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Clean build
        run: ./gradlew --no-daemon clean build --stacktrace

      - name: Inspect playable JAR
        run: |
          JAR="build/libs/fishing-game-0.1.0-alpha.1.jar"
          test -s "$JAR"
          jar tf "$JAR" | grep -q '^fabric.mod.json$'
          jar tf "$JAR" | grep -q '^dev/moonseungjun/fishinggame/FishingGameMod.class$'
          sha256sum "$JAR" | tee "$JAR.sha256"

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fishing-game-0.1.0-alpha.1-build
          path: |
            projects/fishing-game/build/libs/*.jar
            projects/fishing-game/build/libs/*.sha256
            projects/fishing-game/build/reports/**
          if-no-files-found: warn
          retention-days: 7
