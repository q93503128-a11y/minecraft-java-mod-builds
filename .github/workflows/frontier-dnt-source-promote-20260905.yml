name: Frontier DnT Source Promote 20260905

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/frontier-dnt-source-promote-20260905.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Modrinth binary matches pinned CurseForge binary and promote source
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          from pathlib import Path

          url='https://cdn.modrinth.com/data/tpehi7ww/versions/UP9sRfQF/dungeons-and-taverns-5.3.0.jar'
          req=urllib.request.Request(url,headers={'User-Agent':'MoonStudio-FrontierPack/1.0'})
          with urllib.request.urlopen(req,timeout=60) as r:
              blob=r.read()
          sha256=hashlib.sha256(blob).hexdigest()
          expected='2ca47414352ef2fbbbdb61af678e2a0bc3facb6093262f4caac43e35e8022d9b'
          print('Modrinth DnT SHA-256:',sha256)
          if sha256 != expected:
              raise SystemExit(f'Binary mismatch: Modrinth {sha256} != pinned CurseForge {expected}')

          runtime=Path('projects/frontier-settlement/companion-testpack/runtime-sources.json')
          data=json.loads(runtime.read_text(encoding='utf-8'))
          data['sources']['dungeons_and_taverns']={
              'source':'modrinth',
              'project_id':'tpehi7ww',
              'version_id':'UP9sRfQF',
              'version':'5.3.0',
              'loader':'neoforge',
              'minecraft':'26.2',
              'file_name':'dungeons-and-taverns-5.3.0.jar',
              'download_url':url,
              'sha1':'64e6b6e2b3fdb948d49cdc7aea23c1b693fd5156',
              'sha512':'c4b6e6e5be6fa77f9d12d584a10fd541377a75ec926aba12e55d360518425aadf8832e1e9eb5a774a7388bd340879ab79ddd115b9e5263e6f44d23c021f9a111',
              'sha256':sha256,
              'note':'Official Modrinth-hosted 26.2 NeoForge 5.3.0 file. SHA-256 is byte-identical to the previously pinned CurseForge binary, so MRPACK can install it automatically from the Modrinth CDN.'
          }
          runtime.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          lock_path=Path('projects/frontier-settlement/COMPANION_LOCK.json')
          lock=json.loads(lock_path.read_text(encoding='utf-8'))
          old_note='Dungeons and Taverns uses the official 26.2 NeoForge distribution; its Modrinth datapack ID is recorded only as provenance because the NeoForge JAR is distributed separately on CurseForge.'
          new_note='Dungeons and Taverns 5.3.0 NeoForge is pinned to Modrinth version UP9sRfQF; its Modrinth-hosted file is byte-identical to the previously verified CurseForge binary and is the canonical MRPACK auto-install source.'
          lock['notes']=[new_note if n==old_note else n for n in lock.get('notes',[])]

          found=0
          def visit(obj):
              global found
              if isinstance(obj,dict):
                  if obj.get('id')=='dungeons_and_taverns':
                      obj.clear(); obj.update({
                          'id':'dungeons_and_taverns',
                          'name':'Dungeons and Taverns',
                          'side':'server_worldgen',
                          'source':'modrinth',
                          'project_id':'tpehi7ww',
                          'version_id':'UP9sRfQF',
                          'version':'5.3.0',
                          'loader':'neoforge',
                          'required':True,
                          'dependencies':[]
                      })
                      found += 1
                      return
                  for v in obj.values(): visit(v)
              elif isinstance(obj,list):
                  for v in obj: visit(v)
          visit(lock)
          print('D&T lock records promoted:',found)
          if found != 1:
              raise SystemExit(f'Expected exactly one dungeons_and_taverns record in COMPANION_LOCK.json, got {found}')
          lock_path.write_text(json.dumps(lock,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate JSON and stale CurseForge authority removal
        run: |
          python -m json.tool projects/frontier-settlement/COMPANION_LOCK.json >/dev/null
          python -m json.tool projects/frontier-settlement/companion-testpack/runtime-sources.json >/dev/null
          grep -q '"version_id": "UP9sRfQF"' projects/frontier-settlement/COMPANION_LOCK.json
          grep -q '"version_id": "UP9sRfQF"' projects/frontier-settlement/companion-testpack/runtime-sources.json
          ! grep -q '8262693' projects/frontier-settlement/companion-testpack/runtime-sources.json
      - name: Commit canonical source promotion
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/frontier-settlement/COMPANION_LOCK.json projects/frontier-settlement/companion-testpack/runtime-sources.json
          git commit -m 'Use Modrinth DnT source for Frontier MRPACKs'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
      - name: Remove temporary workflow
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm .github/workflows/frontier-dnt-source-promote-20260905.yml
          git commit -m 'Remove temporary DnT source promotion workflow'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
