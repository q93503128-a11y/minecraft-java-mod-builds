name: Arcane alpha73 ray timing fix

on:
  push:
    branches: [main]
    paths:
      - '.github/arcane-alpha73-rayfix-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align full Scorching Ray salvo visual window
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('projects/arcane-circle')
          def once(path, old, new):
              p=Path(path); t=p.read_text(encoding='utf-8')
              if t.count(old)!=1: raise SystemExit(f'{p}: anchor count={t.count(old)}')
              p.write_text(t.replace(old,new,1),encoding='utf-8')
          wm=root/'src/main/java/kr/moonseungjun/arcanecircle/magic/WorldMagicService.java'
          once(wm,
              '        return switch (spellId) {\n            case "web" -> Math.max(baseDuration, SecondCircleSpellService.WEB_TICKS);',
              '        return switch (spellId) {\n            case "scorching_ray" -> Math.max(baseDuration, 20);\n            case "web" -> Math.max(baseDuration, SecondCircleSpellService.WEB_TICKS);')
          idx=root/'src/main/resources/data/arcanecircle/spell_catalog/index.json'
          data=json.loads(idx.read_text(encoding='utf-8'))
          data['second_circle_scorching_ray_visual_ticks']=20
          idx.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          tst=root/'tools/test_current_source.py'
          once(tst,
              "     'duration = secondCircleVisualDuration(spell.id(), duration);',\n     'case \"web\" -> Math.max(baseDuration, SecondCircleSpellService.WEB_TICKS);',",
              "     'duration = secondCircleVisualDuration(spell.id(), duration);',\n     'case \"scorching_ray\" -> Math.max(baseDuration, 20);',\n     'case \"web\" -> Math.max(baseDuration, SecondCircleSpellService.WEB_TICKS);',")
          once(tst,
              "assert index['second_circle_npc_parity'] is True\n\n# Alpha.72 third-circle authority/value pass.",
              "assert index['second_circle_npc_parity'] is True\nassert index['second_circle_scorching_ray_visual_ticks'] == 20\n\n# Alpha.72 third-circle authority/value pass.")
          once(tst,
              "print('alpha73_misty_step_line_of_sight_role_boundary=PASS')",
              "print('alpha73_scorching_ray_full_salvo_visual_window=PASS')\nprint('alpha73_misty_step_line_of_sight_role_boundary=PASS')")
          ver=root/'tools/verify_jar.py'
          once(ver,
              "    if index.get('second_circle_npc_terrain_safety') != 'gust_and_shatter_keep_combat_authority_but_skip_npc_world_edit':\n        raise SystemExit('alpha.73 second-circle NPC terrain safety missing')\n",
              "    if index.get('second_circle_npc_terrain_safety') != 'gust_and_shatter_keep_combat_authority_but_skip_npc_world_edit':\n        raise SystemExit('alpha.73 second-circle NPC terrain safety missing')\n    if index.get('second_circle_scorching_ray_visual_ticks') != 20:\n        raise SystemExit('alpha.73 Scorching Ray full-salvo visual window missing')\n")
          once(ver,
              "print('alpha73_second_circle_value_pass_1=PASS')",
              "print('alpha73_second_circle_value_pass_1=PASS')\nprint('alpha73_scorching_ray_full_salvo_visual_window=PASS')")
          PY
          rm -f .github/arcane-alpha73-rayfix-trigger.txt .github/workflows/arcane-alpha73-rayfix.yml
          git add -A
          git diff --check
          git commit -m 'Fix alpha.73 Scorching Ray full-salvo visual timing [skip ci]'
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git pull --rebase origin main
            sleep $((attempt*2))
          done
          test "$pushed" -eq 1
