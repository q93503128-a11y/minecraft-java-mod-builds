name: Frontier Alpha104 Full Flatten Crew 20260905

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/frontier-alpha104-full-flatten-crew-20260905.yml

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Fix staged patch marker and apply Alpha104
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply_frontier_alpha104_tmp.py')
          s = p.read_text(encoding='utf-8')
          old = "    private static boolean moveBuilder(ServerLevel level, FrontierWorkerEntity builder, BlockPos target, double speed) {"
          new = "    private static boolean moveBuilder(ServerLevel level, FrontierWorkerEntity builder, BlockPos target) {"
          if s.count(old) != 1:
              raise SystemExit(f'civil mover patch marker count={s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 tools/apply_frontier_alpha104_tmp.py
      - name: Source and JSON checks
        run: |
          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('src/main/resources').rglob('*.json'))
          for path in files:
              json.loads(path.read_text(encoding='utf-8'))
          print(f'JSON PASS: {len(files)} files')
          PY
      - name: Java 25 clean build
        run: |
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew --no-daemon clean build
      - name: Verify JAR
        run: |
          cd projects/frontier-settlement
          python3 - <<'PY'
          import pathlib, zipfile
          jars = [p for p in pathlib.Path('build/libs').glob('*.jar') if 'sources' not in p.name and 'javadoc' not in p.name]
          assert len(jars) == 1, jars
          jar = jars[0]
          assert '0.1.0-alpha.104' in jar.name, jar
          with zipfile.ZipFile(jar) as z:
              names = z.namelist()
              assert len(names) == len(set(names))
              assert 'META-INF/neoforge.mods.toml' in names
              assert any(n.endswith('SettlementCivilWorkService.class') for n in names)
              assert any(n.endswith('SettlementConstructionService.class') for n in names)
          print('JAR PASS', jar)
          PY
      - name: Commit source and remove temporary files
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm -f .github/workflows/frontier-alpha104-full-flatten-crew-20260905.yml tools/apply_frontier_alpha104_tmp.py
          git add projects/frontier-settlement
          git commit -m 'Frontier alpha104 full flatten and builder crews'
      - name: Rebase and reverify
        run: |
          git pull --rebase origin main
          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          ./gradlew --no-daemon clean build
      - name: Stage JAR
        run: |
          mkdir -p /tmp/frontier-alpha104
          cp projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.104.jar /tmp/frontier-alpha104/
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-0.1.0-alpha.104
          path: /tmp/frontier-alpha104/frontier_settlement-0.1.0-alpha.104.jar
          if-no-files-found: error
      - name: Push main and clean safety branch
        run: |
          git push origin HEAD:main
          git push origin --delete tmp-frontier-alpha104-safety || true
