name: Diagnose Wildbound source transport
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-wildbound-source.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const path='ci-state/wildbound-diagnostic-run.txt';
            let sha;
            try { sha=(await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'})).data.sha; } catch(e) { if(e.status!==404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'main',sha,message:`Record Wildbound diagnostic ${context.runId}`,content:Buffer.from(`run_id=${context.runId}\nhead_sha=${context.sha}\n`).toString('base64')});
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check every transport part
        shell: bash
        run: |
          set +e
          shopt -s nullglob
          parts=(projects/wildbound/source/compile-min-v2.tar.xz.b64.part*)
          bad=0
          for p in "${parts[@]}"; do
            bytes=$(wc -c < "$p")
            chars=$(LC_ALL=C tr -cd 'A-Za-z0-9+/=' < "$p" | wc -c)
            printf '%s bytes=%s base64chars=%s ' "$p" "$bytes" "$chars"
            if base64 --decode "$p" >/dev/null 2>err.txt; then echo OK; else echo BAD; cat err.txt; bad=1; fi
          done
          cat "${parts[@]}" > combined.b64
          echo "combined_bytes=$(wc -c < combined.b64)"
          if base64 --decode combined.b64 > source.tar.xz; then
            sha256sum source.tar.xz
            xz -t source.tar.xz && echo XZ_OK || echo XZ_BAD
          else
            echo COMBINED_BASE64_BAD
            bad=1
          fi
          exit $bad
