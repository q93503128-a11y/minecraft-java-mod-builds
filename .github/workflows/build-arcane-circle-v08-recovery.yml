name: Recover Arcane Circle v0.8

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-arcane-circle-v08-recovery.yml'
      - 'projects/arcane-circle/tools/apply_v08_magic_world.py'
      - 'projects/arcane-circle/tools/apply_v08_26_2_compat.py'
      - 'projects/arcane-circle/tools/v08_payload/**'
      - 'projects/arcane-circle/tools/v08_retry_20260802.txt'

permissions:
  contents: write

env:
  PROJECT_DIR: projects/arcane-circle
  EXPECTED_JAR: arcanecircle-0.8.0-alpha.1.jar
  PUBLISHED_DIR: published/arcane-circle
  RESULT_DIR: ci-results/arcane-circle-v08-recovery

jobs:
  recover-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record runner allocation
        shell: bash
        run: |
          mkdir -p "$RESULT_DIR"
          cat > "$RESULT_DIR/started.txt" <<STARTED
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          STARTED
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR/started.txt"
          git commit -m "Start Arcane v0.8 recovery ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Recover and apply world migration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/apply_v08_magic_world.py 2>&1 | tee "$GITHUB_WORKSPACE/migration.log"
          git diff --check

      - name: Audit generated magic world
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/test_magic_contract.py

      - name: Build Java 25 NeoForge runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/gradle.log"

      - name: Verify and stage artifact
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          mkdir -p ../../deliverables
          cp "build/libs/$EXPECTED_JAR" ../../deliverables/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables/

      - uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.8.0-alpha.1-recovery
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Publish clean generated source and verified runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          touch "$PROJECT_DIR/.gitignore"
          grep -qxF '.gradle/' "$PROJECT_DIR/.gitignore" || printf '%s\n' '.gradle/' >> "$PROJECT_DIR/.gitignore"
          grep -qxF 'build/' "$PROJECT_DIR/.gitignore" || printf '%s\n' 'build/' >> "$PROJECT_DIR/.gitignore"

          rm -rf /tmp/arcane-v08-source
          mkdir -p /tmp/arcane-v08-source
          rsync -a --delete --exclude '/build/' --exclude '/.gradle/' "$PROJECT_DIR/" /tmp/arcane-v08-source/

          published=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$PROJECT_DIR"
            mkdir -p "$PROJECT_DIR"
            rsync -a /tmp/arcane-v08-source/ "$PROJECT_DIR/"
            rm -rf "$PROJECT_DIR/build" "$PROJECT_DIR/.gradle"

            mkdir -p "$PUBLISHED_DIR"
            rm -f "$PUBLISHED_DIR"/arcanecircle-*.jar "$PUBLISHED_DIR"/arcanecircle-*.jar.sha256
            cp "deliverables/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
            cp "deliverables/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"

            git add -A "$PROJECT_DIR" "$PUBLISHED_DIR"
            if git diff --cached --quiet; then
              published=1
              break
            fi
            git commit -m 'Publish Arcane Circle v0.8 Ninefold Magic World'
            if git push origin HEAD:main; then
              published=1
              break
            fi
            echo "Concurrent main update during publish attempt $attempt; retrying on latest main."
            sleep $((attempt * 2))
          done
          test "$published" -eq 1

      - name: Record recovery diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/arcane-v08-result
          mkdir -p /tmp/arcane-v08-result
          if test -f "$GITHUB_WORKSPACE/gradle.log"; then
            cp "$GITHUB_WORKSPACE/gradle.log" /tmp/arcane-v08-result/latest.log
          elif test -f "$GITHUB_WORKSPACE/migration.log"; then
            cp "$GITHUB_WORKSPACE/migration.log" /tmp/arcane-v08-result/latest.log
          else
            echo 'Build pipeline did not produce a diagnostic log.' > /tmp/arcane-v08-result/latest.log
          fi
          cat > /tmp/arcane-v08-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          STATUS

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$RESULT_DIR"
            mkdir -p "$RESULT_DIR"
            cp -a /tmp/arcane-v08-result/. "$RESULT_DIR/"
            git add -A "$RESULT_DIR"
            if git diff --cached --quiet; then
              recorded=1
              break
            fi
            git commit -m "Record Arcane v0.8 recovery result for ${GITHUB_SHA::7}"
            if git push origin HEAD:main; then
              recorded=1
              break
            fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1
