name: Inspect Gacha Vault Hero

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/test/tools/gacha_vault_preview/inspect_hero_candidate.py'
      - '.github/workflows/inspect-gacha-vault-hero.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install Blender headless runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy libegl1 libgl1 libgl1-mesa-dri libxrender1 libxi6 libxkbcommon0 xvfb unzip curl

      - name: Download CC0 vault door candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gacha-hero
          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 asset-previs' \
            'https://opengameart.org/sites/default/files/vault_door_and_wall_0.zip' \
            -o /tmp/gacha-hero/source.zip
          unzip -q /tmp/gacha-hero/source.zip -d /tmp/gacha-hero/unpacked
          find /tmp/gacha-hero/unpacked -maxdepth 3 -type f -print | sort | tee /tmp/gacha-hero/files.txt
          grep -Eiq '\.(fbx|obj|blend)$' /tmp/gacha-hero/files.txt

      - name: Render candidate turntable
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/projects/test/build/gacha-hero-inspection"
          mkdir -p "$OUT"
          xvfb-run -a blender --background \
            --python "$GITHUB_WORKSPACE/projects/test/tools/gacha_vault_preview/inspect_hero_candidate.py" \
            -- /tmp/gacha-hero/unpacked "$OUT"
          test -s "$OUT/01_front.png"
          test -s "$OUT/02_three_quarter.png"
          test -s "$OUT/03_openability.png"
          test -s "$OUT/hero_candidate.blend"
          cp /tmp/gacha-hero/files.txt "$OUT/SOURCE_FILES.txt"
          cat > "$OUT/PROVENANCE.md" <<'EOF'
          # Gacha Hero Candidate Provenance

          - Asset: `vault door`
          - Author: tbbk
          - Source: https://opengameart.org/content/vault-door
          - License: CC0
          - Purpose: visual inspection for the Dimensional Vault hero object
          - Minecraft runtime use: NOT YET APPROVED
          - Visual approval: NOT YET GRANTED
          EOF

      - name: Upload inspection
        uses: actions/upload-artifact@v4
        with:
          name: gacha-vault-hero-inspection-${{ github.run_number }}
          path: projects/test/build/gacha-hero-inspection/
          if-no-files-found: error
          retention-days: 30
