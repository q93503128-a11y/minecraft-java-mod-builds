name: Relax obsolete Countryside Days alpha.15 patch guard

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-relax-village-patch.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Allow already-compatible VillageLifeManager source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/cd-a15-export-exact.yml')
          s=p.read_text('utf-8')
          old="          elif new not in s:raise SystemExit('VillageLifeManager target missing')"
          new="          elif new not in s:print('VillageLifeManager patch not required for this payload')"
          if old not in s: raise SystemExit('workflow patch target missing')
          p.write_text(s.replace(old,new),'utf-8')
          PY
          rm -f .github/workflows/cd-a15-relax-village-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/cd-a15-export-exact.yml .github/workflows/cd-a15-relax-village-patch.yml
          git commit -m 'Skip obsolete alpha.15 VillageLifeManager patch'
          git pull --rebase origin main
          git push origin HEAD:main
