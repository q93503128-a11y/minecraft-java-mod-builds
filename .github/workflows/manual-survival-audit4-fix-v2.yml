name: Manual Survival Audit 4 Fix V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-audit4-fix-v2.yml'

permissions:
  contents: write

jobs:
  fix-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply audit 4 fix
        run: python3 .github/scripts/survival_audit4_fix.py
      - name: Source contract audit
        shell: bash
        run: |
          set -euo pipefail
          P=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/progress/PlayerLifecycleState.java
          S=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/SurvivalAscension.java
          test -s "$P"
          grep -q 'PlayerLifecycleState::onClone' "$S"
          grep -q 'PlayerEvent.Clone' "$P"
          grep -q 'survivalascension_mining_mode' "$P"
          grep -q 'survivalascension_operation_interdiction_stage' "$P"
          grep -q 'survivalascension_apex_hunt_ready' "$P"
          grep -q 'survivalascension_outpost_siege_ready' "$P"
          grep -q 'survivalascension_combat_shockwave_ready' "$P"
          grep -q 'survivalascension_shield_wave_ready' "$P"
          grep -q 'mod_version=0.61.3-alpha.1' projects/survival-ascension/gradle.properties
          grep -q 'VERSION = "0.61.3-alpha.1"' "$S"
          git diff --check
          echo PLAYER_CLONE_STATE_CONTRACT_OK
      - name: Resource JSON audit
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" >/dev/null
            count=$((count+1))
          done < <(find projects/frontier-settlement/src/main/resources projects/survival-ascension/src/main/resources -type f -name '*.json' -print0)
          echo "JSON_OK $count files"
      - name: Frontier Java 25 regression build
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build
      - name: Survival Java 25 clean build
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon clean build
      - name: JAR audit
        shell: bash
        run: |
          set -euo pipefail
          F=projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.92.jar
          S=projects/survival-ascension/build/libs/survivalascension-0.61.3-alpha.1.jar
          for jarfile in "$F" "$S"; do
            test -s "$jarfile"
            test -z "$(jar tf "$jarfile" | sort | uniq -d | head -n1 || true)"
            echo "JAR_OK $jarfile $(stat -c%s "$jarfile") bytes"
          done
          jar tf "$S" | grep -q 'kr/moonseungjun/survivalascension/progress/PlayerLifecycleState.class'
      - name: Upload Survival replacement
        uses: actions/upload-artifact@v4
        with:
          name: survival-audit4-replacement
          path: projects/survival-ascension/build/libs/survivalascension-0.61.3-alpha.1.jar
          if-no-files-found: error
          retention-days: 7
      - name: Commit validated fix and cleanup audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-survival-audit4-fix-v2.yml
          rm -f .github/workflows/manual-survival-audit4-fix.yml
          rm -f .github/workflows/manual-survival-audit4-scan.yml
          rm -f .github/scripts/survival_audit4_fix.py
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/survival-ascension .github/workflows/manual-survival-audit4-fix-v2.yml .github/workflows/manual-survival-audit4-fix.yml .github/workflows/manual-survival-audit4-scan.yml .github/scripts/survival_audit4_fix.py
          git commit -m "Preserve Survival player state across respawns"
          git pull --rebase origin main
          git push origin HEAD:main
