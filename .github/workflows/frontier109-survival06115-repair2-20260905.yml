name: Frontier 109 + Survival 0.61.15 Repair v2 20260905

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/frontier109-survival06115-repair2-20260905.yml'

permissions:
  contents: write

jobs:
  repair-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply patch and repair settlement-center scope
        run: |
          python3 tools/apply_frontier109_survival06115.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementContextService.java')
          s = p.read_text(encoding='utf-8')
          start_token = 'BlockPos center = data.centerPos();'
          end_token = 'BlockPos stock = data.stockpilePos();'
          start = s.find(start_token)
          end = s.find(end_token, start + 1)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit(f'cannot locate inserted settlement-center segment: start={start} end={end}')
          segment = s[start:end]
          segment = segment.replace(start_token, 'BlockPos settlementCenter = data.centerPos();', 1)
          segment = segment.replace('center.getX()', 'settlementCenter.getX()')
          segment = segment.replace('center.getY()', 'settlementCenter.getY()')
          segment = segment.replace('center.getZ()', 'settlementCenter.getZ()')
          s = s[:start] + segment + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify current sources
        run: |
          python3 projects/frontier-settlement/tools/test_current_source.py
          python3 projects/survival-ascension/tools/test_current_source.py

      - name: Java 25 clean build both mods
        run: |
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew clean build --no-daemon
          cd ../survival-ascension
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify runtime JARs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          jars = [
              Path('projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.109.jar'),
              Path('projects/survival-ascension/build/libs/survivalascension-0.61.15-alpha.1.jar'),
          ]
          for jar in jars:
              assert jar.exists(), jar
              with zipfile.ZipFile(jar) as z:
                  names = set(z.namelist())
                  assert 'META-INF/MANIFEST.MF' in names
                  if jar.name.startswith('frontier_'):
                      assert any(n.endswith('SettlementContextService.class') for n in names)
                      assert any(n.endswith('BuildingPaletteScreen.class') for n in names)
                  else:
                      assert any(n.endswith('FishingProgression.class') for n in names)
                      assert any(n.endswith('InfrastructureProject.class') for n in names)
              print(jar, jar.stat().st_size)
          PY

      - name: Commit canonical source and remove temporary files
        run: |
          rm -f tools/apply_frontier109_survival06115.py
          rm -f .github/workflows/frontier109-survival06115-20260905.yml
          rm -f .github/workflows/frontier109-survival06115-repair-20260905.yml
          rm -f .github/workflows/frontier109-survival06115-repair2-20260905.yml
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add -A
          git commit -m 'Add settlement navigation and deterministic fishing infrastructure'

      - name: Rebase and reverify current main
        run: |
          git pull --rebase origin main
          python3 projects/frontier-settlement/tools/test_current_source.py
          python3 projects/survival-ascension/tools/test_current_source.py
          cd projects/frontier-settlement
          ./gradlew clean build --no-daemon
          cd ../survival-ascension
          ./gradlew clean build --no-daemon

      - name: Stage artifacts
        run: |
          mkdir -p stage-frontier stage-survival
          cp projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.109.jar stage-frontier/
          cp projects/survival-ascension/build/libs/survivalascension-0.61.15-alpha.1.jar stage-survival/

      - name: Upload Frontier artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-0.1.0-alpha.109-tested
          path: stage-frontier/frontier_settlement-0.1.0-alpha.109.jar
          if-no-files-found: error

      - name: Upload Survival artifact
        uses: actions/upload-artifact@v4
        with:
          name: survivalascension-0.61.15-alpha.1-tested
          path: stage-survival/survivalascension-0.61.15-alpha.1.jar
          if-no-files-found: error

      - name: Push main
        run: git push origin HEAD:main
