name: Manual Survival Coop Encounter Overhaul

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-coop-encounter-overhaul.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Repair temporary patcher anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/survival-ascension/tools/patch_coop_encounters.py')
          s = p.read_text(encoding='utf-8')

          def replace_call(label, call_prefix, replacement):
              global s
              needle = f'"{label}")'
              pos = s.find(needle)
              if pos < 0:
                  raise SystemExit(f'{label}: label missing')
              start = s.rfind(call_prefix, 0, pos)
              if start < 0:
                  raise SystemExit(f'{label}: call start missing')
              end = s.find('\n', pos)
              if end < 0:
                  end = len(s)
              else:
                  end += 1
              s = s[:start] + replacement.rstrip() + '\n' + s[end:]

          replace_call('active party snapshot', 't = replace_once(t,', '''
          anchor = "            this.rare = rare;\\n            this.bossBar = new ServerBossEvent"
          pos = t.rfind(anchor)
          if pos < 0:
              raise SystemExit("active party snapshot anchor missing")
          t = t[:pos] + anchor.replace("            this.bossBar", "            this.participantCountSnapshot = Math.max(1, participantCountSnapshot);\\n            this.bossBar") + t[pos + len(anchor):]
          ''')

          replace_call('incident scaled spawn target', 't = replace_section(t,', '''
          t = replace_section(t,
          "        int spawnTarget() {",
          "    }\\n}",
          \'''        int spawnTarget() {
              int base = incident.spawnCount();
              if (rare && base > 0) base = Math.max(base + 2, (base * 3 + 1) / 2);
              double coop = 1.0D + Math.min(4, participantCountSnapshot - 1) * 0.65D;
              return base <= 0 ? base : Math.max(base, (int)Math.ceil(base * coop));
          }\''', "incident scaled spawn target")
          ''')

          replace_call('pending mutable owner', 't = replace_once(t,', '''
          pending_start = t.index("    private static final class PendingIncident {")
          active_start = t.index("    private static final class ActiveIncident {", pending_start)
          segment = t[pending_start:active_start]
          old = "        final UUID owner;\\n        final ServerLevel level;"
          if segment.count(old) != 1:
              raise SystemExit(f"pending mutable owner context count {segment.count(old)}")
          segment = segment.replace(old, "        UUID owner;\\n        final ServerLevel level;", 1)
          t = t[:pending_start] + segment + t[active_start:]
          ''')

          replace_call('pending participants', 't = replace_once(t,', '''
          pending_start = t.index("    private static final class PendingIncident {")
          active_start = t.index("    private static final class ActiveIncident {", pending_start)
          segment = t[pending_start:active_start]
          old = "        final boolean rare;\\n        final ServerBossEvent bossBar;"
          new = "        final boolean rare;\\n        final ServerBossEvent bossBar;\\n        final Set<UUID> participants = new HashSet<>();"
          if segment.count(old) != 1:
              raise SystemExit(f"pending participants context count {segment.count(old)}")
          segment = segment.replace(old, new, 1)
          t = t[:pending_start] + segment + t[active_start:]
          ''')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Apply cooperative encounter patch
        run: |
          python3 projects/survival-ascension/tools/patch_coop_encounters.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/elite/EliteMobSystem.java')
          s = p.read_text(encoding='utf-8')
          if 'import net.minecraft.world.entity.Entity;' not in s:
              s = s.replace('import net.minecraft.world.entity.Mob;\n', 'import net.minecraft.world.entity.Entity;\nimport net.minecraft.world.entity.Mob;\n', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Targeted cooperative source assertions
        working-directory: projects/survival-ascension
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path('src/main/java/kr/moonseungjun/survivalascension')
          elite = (root/'elite/EliteMobSystem.java').read_text()
          incident = (root/'expedition/ExpeditionIncidentSystem.java').read_text()
          apex = (root/'apex/ApexHuntSystem.java').read_text()
          trial = (root/'endgame/AscensionTrialSystem.java').read_text()
          main = (root/'SurvivalAscension.java').read_text()
          checks = {
            'mythic bossbar runtime': 'MYTHIC_BOSSBAR_RADIUS' in elite and 'MythicRuntime' in elite,
            'mythic stronger rank': 'MYTHIC_III(3, 3.50D, 14.0D, 0.22D, 1.10D, 0.65D)' in elite,
            'mythic lower rarity': 'Math.min(0.08D' in elite,
            'mythic server tick registered': 'EliteMobSystem::onServerTick' in main,
            'incident shared participants': 'participantCountSnapshot' in incident and 'findActiveFor' in incident,
            'incident shared rewards': '[공동 사건 해결]' in incident,
            'apex shared progression': '[공동 정점 격파]' in apex and 'participants' in apex,
            'trial shared arena': '[공동 승천 시련 완료]' in trial and 'partySizeSnapshot' in trial,
          }
          bad = [name for name, ok in checks.items() if not ok]
          if bad:
              raise SystemExit('ASSERT FAIL: ' + ', '.join(bad))
          print('COOP SOURCE ASSERTIONS PASS')
          PY

      - name: Java 25 clean build
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Verify JAR
        run: python3 projects/survival-ascension/tools/verify_jar.py projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add \
            projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/SurvivalAscension.java \
            projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/elite/EliteMobSystem.java \
            projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/expedition/ExpeditionIncidentSystem.java \
            projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/apex/ApexHuntSystem.java \
            projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/endgame/AscensionTrialSystem.java
          git commit -m 'Make Survival encounters meaningfully cooperative'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload patched JAR
        uses: actions/upload-artifact@v4
        with:
          name: survival-061-coop-encounter-overhaul
          path: projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          if-no-files-found: error
