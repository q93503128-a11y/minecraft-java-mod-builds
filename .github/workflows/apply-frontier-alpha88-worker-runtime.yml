name: Apply Frontier Alpha88 Worker Runtime Recovery

on:
  push:
    paths:
      - '.github/workflows/apply-frontier-alpha88-worker-runtime.yml'
      - '.github/scripts/apply_frontier_alpha88.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebase on latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
      - name: Apply Alpha.88 runtime recovery
        run: python .github/scripts/apply_frontier_alpha88.py
      - name: Cumulative source audit
        working-directory: projects/frontier-settlement
        run: python tools/test_alpha88_source.py
      - name: Canonical docs audit
        working-directory: projects/frontier-settlement
        run: python tools/test_alpha88_docs.py
      - name: Java 25 clean build and runtime JAR verify
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build
          test -f build/libs/frontier_settlement-0.1.0-alpha.88.jar
          jar tf build/libs/frontier_settlement-0.1.0-alpha.88.jar | grep -q 'kr/moonseungjun/frontiersettlement/content/FrontierWorkerEntity.class'
          jar tf build/libs/frontier_settlement-0.1.0-alpha.88.jar | grep -q 'kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.class'
      - name: Commit verified Alpha.88
        run: |
          git add projects/frontier-settlement
          git rm .github/workflows/apply-frontier-alpha88-worker-runtime.yml .github/scripts/apply_frontier_alpha88.py
          git commit -m 'Fix Frontier alpha.88 worker movement and completion authority'
          git fetch origin main
          git rebase origin/main
          cd projects/frontier-settlement
          python tools/test_alpha88_source.py
          python tools/test_alpha88_docs.py
          ./gradlew --no-daemon clean build
          cd ../..
          git push origin HEAD:main
