name: Frontier Alpha70 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha70-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Alpha.70 lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/frontier_alpha70_patch.py')
          s=p.read_text(encoding='utf-8')
          old="notes='\\n'.join(lock.get('notes',[]));"
          new="notes=chr(10).join(lock.get('notes',[]));"
          if old not in s:
              raise SystemExit('alpha70 docs escaping anchor missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python3 .github/scripts/frontier_alpha70_patch.py
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/frontier-settlement
          git commit -m 'Harden Frontier outpost production lifecycle for alpha.70'
          git push origin HEAD:main
