name: Finalize Living Kingdoms authored interiors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-living-kingdoms-authored-audits.yml'
  workflow_dispatch:

concurrency:
  group: living-kingdoms-authored-interior-finalize
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Remove obsolete runtime preserver
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/remove_living_kingdoms_legacy_preserver.py
          if [ -f projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorPreserver.java ]; then
            git rm projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorPreserver.java
          fi
          ! grep -Fq 'ErdenUrbanAuthoredInteriorPreserver' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java
          ! test -f projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorPreserver.java
          grep -Fq 'authored_ground_candidates=233 authored_upper_candidates=233 ground_only_candidates=0' .github/workflows/audit-living-kingdoms-residence-modes.yml
          grep -Fq 'LK_ERDEN_AUTHORED_GROUND_FUNCTIONAL_PLAN_PASS placements=233' .github/workflows/audit-living-kingdoms-exterior-inventory.yml
          grep -Fq 'loaded_lease=true' .github/workflows/validate-living-kingdoms-physical-economy.yml

      - name: Java 25 clean compile without legacy preserver
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Commit verified source cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms
          git commit -m 'refactor(living-kingdoms): remove obsolete authored interior preserver' || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
