name: Apply Survival Ascension 0.61.21 Bulk Mining Queue

on:
  push:
    paths:
      - 'projects/survival-ascension/.bulk-mining-06121-trigger'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-24.04
    env:
      PROJECT_DIR: projects/survival-ascension

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase onto latest main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Apply 0.61.21 mining scheduler patch
        shell: bash
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/tools/apply_06121_bulk_mining_queue.py"
          python3 "$PROJECT_DIR/tools/apply_06121_historical_audit_bridge.py"
          git diff --check

      - name: Current and historical source audits
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tools/test_current_source.py
          python3 tools/test_release_source.py
          python3 tools/test_release_content_pack.py

      - name: Clean Java 25 build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain

      - name: Verify built JAR
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)"
          test -n "$JAR"
          jar tf "$JAR" | grep -q 'kr/moonseungjun/survivalascension/mining/BulkMiningService.class'
          jar tf "$JAR" | grep -q 'kr/moonseungjun/survivalascension/mining/MiningProgression.class'
          jar tf "$JAR" | grep -q 'kr/moonseungjun/survivalascension/progress/AutomatedToolBreak.class'

      - name: Commit validated 0.61.21 to main and remove temporary helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$PROJECT_DIR/.bulk-mining-06121-trigger"
          rm -f "$PROJECT_DIR/tools/apply_06121_bulk_mining_queue.py"
          rm -f "$PROJECT_DIR/tools/apply_06121_historical_audit_bridge.py"
          rm -f .github/workflows/apply-survival-ascension-06121-bulk-mining.yml
          git add "$PROJECT_DIR" .github/workflows/apply-survival-ascension-06121-bulk-mining.yml
          git commit -m "Bound Survival bulk mining work per tick"
          git pull --rebase origin main
          git push origin HEAD:main
