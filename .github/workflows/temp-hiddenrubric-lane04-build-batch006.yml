name: TEMP HiddenRubric Lane04 Build Batch006

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-build-batch006.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build batch006
        run: python temp-hiddenrubric/lane04/build_batch006.py
      - name: Commit batch006
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/batch006/
          git commit -m 'chore: materialize temporary Lane04 batch006'
          git push origin HEAD:main
