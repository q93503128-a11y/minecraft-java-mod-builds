name: Apply Village Guardians v0.18.10 Ricochet Polish

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.source-polish-trigger-v01810'

permissions:
  contents: write

jobs:
  patch:
    name: Apply final ricochet flight polish directly to main
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply deterministic polish
        working-directory: projects/village-guardians
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_v01810_ranger_polish.py
          python3 tools/test_v01810_ranger_ricochet.py
          python3 tools/test_v0189_siege_phase2.py

      - name: Commit polished runtime source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add \
            projects/village-guardians/src/main/java/kr/moonseungjun/villageguardians/VillageRoleAbilitySystem.java \
            projects/village-guardians/tools/test_v01810_ranger_ricochet.py \
            projects/village-guardians/.build-trigger-v01810
          git diff --cached --check
          git commit -m "fix(village): polish tracking ricochet flight path"

      - name: Fast-forward main without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "Failed to fast-forward main after retries" >&2
          exit 1
