name: Audit Living Kingdoms kingdom exterior

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-kingdom-exterior.yml'

concurrency:
  group: living-kingdoms-kingdom-exterior-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile exterior runtime
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs
          gradle --no-daemon clean classes --stacktrace --console=plain \
            2>&1 | tee ../../logs/kingdom-exterior-compile.log

      - name: Fresh world exterior construction audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-exterior-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-exterior-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/kingdom-exterior-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 1500); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/kingdom-exterior-server.log; then
              cat ../../logs/kingdom-exterior-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_KINGDOM_EXTERIOR_PASS revision=1 nodes=18 producers=15 wharves=3' ../../logs/kingdom-exterior-server.log \
              && grep -Fq 'LK_ERDEN_KINGDOM_SUPPLY_PASS revision=1 nodes=18 producers=15 wharves=3 resources=6 opening_convoys=18' ../../logs/kingdom-exterior-server.log \
              && grep -Fq 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/kingdom-exterior-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/kingdom-exterior-server.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/kingdom-exterior-server.log
          test "$passed" -eq 1
          grep -F 'Requested Erden exterior CI anchors nodes=18' ../../logs/kingdom-exterior-server.log
          grep -F 'metre_scale=true streamed=true' ../../logs/kingdom-exterior-server.log
          grep -F 'external_buildings=true' ../../logs/kingdom-exterior-server.log
          grep -F 'fields=true' ../../logs/kingdom-exterior-server.log
          grep -F 'paddocks=true' ../../logs/kingdom-exterior-server.log
          grep -F 'mines=true' ../../logs/kingdom-exterior-server.log
          grep -F 'mills=true' ../../logs/kingdom-exterior-server.log
          grep -F 'docks=true' ../../logs/kingdom-exterior-server.log
          grep -F 'roads=true' ../../logs/kingdom-exterior-server.log
          grep -F 'storage_yards=true' ../../logs/kingdom-exterior-server.log
          grep -F 'debris_zero=true' ../../logs/kingdom-exterior-server.log
          marker="$(grep -F 'LK_ERDEN_KINGDOM_EXTERIOR_PASS' ../../logs/kingdom-exterior-server.log | tail -1)"
          anchor_chunks="$(sed -E 's/.*anchor_chunks=([0-9]+).*/\1/' <<<"$marker")"
          writes="$(sed -E 's/.*writes=([0-9]+).*/\1/' <<<"$marker")"
          test "$anchor_chunks" -ge 70
          test "$writes" -gt 0
          grep -F 'fixed_daily_imports=false' ../../logs/kingdom-exterior-server.log
          grep -F 'purchase_outcomes=77' ../../logs/kingdom-exterior-server.log
          grep -F 'reserve_bread=42' ../../logs/kingdom-exterior-server.log

          if grep -Eqi 'Unknown Erden supply role|Requested chunk is outside|Exception loading level|watchdog|Item debris remained' ../../logs/kingdom-exterior-server.log; then
            exit 1
          fi

      - name: Upload exterior audit logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-kingdom-exterior-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Record exterior audit pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            mkdir -p .github/build-pointers
            cat > .github/build-pointers/living-kingdoms-kingdom-exterior.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID"
          }
          EOF
            git add .github/build-pointers/living-kingdoms-kingdom-exterior.json
            git commit -m "Record Living Kingdoms kingdom exterior audit $GITHUB_RUN_NUMBER" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
