name: Manual Frontier Alpha94 Builder Site Envelope

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/manual-frontier-alpha94-builder-site-envelope.yml'

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply builder site-envelope recovery
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/frontier_alpha94.py
          python3 /tmp/frontier_alpha94.py
      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'SITE_WORK_MARGIN = 12' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java
          grep -q 'hasReachableGroundWorkPosition' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java
          grep -q '건설 현장 접근 불가' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java
          ! grep -q 'ensureConstructionScaffolds(level, data, type, supply);' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java
      - name: Build Frontier
        working-directory: projects/frontier-settlement
        run: ./gradlew clean build --no-daemon
      - name: Verify jar
        shell: bash
        run: |
          set -euo pipefail
          JAR='projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.94.jar'
          test -s "$JAR"
          unzip -l "$JAR" | grep -q 'SettlementConstructionService.class'
          python3 -c "import zipfile; p='$JAR'; z=zipfile.ZipFile(p); n=z.namelist(); assert len(n)==len(set(n)); print('JAR_OK')"
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha94-replacement
          path: projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.94.jar
          if-no-files-found: error
      - name: Commit canonical source and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-frontier-alpha94-builder-site-envelope.yml
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/frontier-settlement/gradle.properties projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java .github/workflows/manual-frontier-alpha94-builder-site-envelope.yml
          git commit -m 'Make settlement construction site-local and path tolerant'
          git push origin HEAD:main
