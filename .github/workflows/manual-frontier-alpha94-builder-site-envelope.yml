name: Manual Frontier Alpha94 Builder Site Envelope

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/manual-frontier-alpha94-builder-site-envelope.yml'

permissions:
  contents: write

jobs:
  fix-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply builder site-envelope recovery
        run: python3 .github/scripts/frontier_alpha94_builder_site_envelope.py

      - name: Contract checks
        shell: bash
        run: |
          set -euo pipefail
          SRC='projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java'
          grep -q 'SITE_WORK_MARGIN = 12' "$SRC"
          grep -q 'builderWithinSiteWorkEnvelope' "$SRC"
          grep -q 'hasReachableGroundWorkPosition' "$SRC"
          grep -q '건설 현장 접근 불가' "$SRC"
          grep -q 'for (BuildingBlueprints.Placement placement : plan)' "$SRC"
          ! grep -q 'for (BlockPos placement : plan)' "$SRC"
          ! grep -q 'ensureConstructionScaffolds(level, data, type, supply);' "$SRC"

      - name: Build Frontier
        working-directory: projects/frontier-settlement
        run: ./gradlew clean build --no-daemon

      - name: Verify jar
        shell: bash
        run: |
          set -euo pipefail
          JAR='projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.94.jar'
          test -s "$JAR"
          unzip -l "$JAR" | grep -q 'SettlementConstructionService.class'
          python3 - <<'PY'
          import zipfile
          p='projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.94.jar'
          with zipfile.ZipFile(p) as z:
              names=z.namelist()
              if len(names)!=len(set(names)):
                  raise SystemExit('duplicate jar entries')
          print('JAR_OK')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha94-replacement
          path: projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.94.jar
          if-no-files-found: error

      - name: Commit canonical source and self-remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-frontier-alpha94-builder-site-envelope.yml
          rm -f .github/scripts/frontier_alpha94_builder_site_envelope.py
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/frontier-settlement/gradle.properties \
                  projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java \
                  .github/workflows/manual-frontier-alpha94-builder-site-envelope.yml \
                  .github/scripts/frontier_alpha94_builder_site_envelope.py
          git commit -m 'Make settlement construction site-local and path tolerant'
          git push origin HEAD:main
