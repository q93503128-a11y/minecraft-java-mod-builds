name: Probe Campfire Museum Assets

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/scripts/campfire/probe_smithsonian_museum_assets.py'
      - '.github/scripts/campfire/convert_static_museum_glb.py'
      - '.github/workflows/probe-campfire-museum-assets.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Acquire and inspect curated CC0 Smithsonian museum assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/campfire-museum-assets
          python3 .github/scripts/campfire/probe_smithsonian_museum_assets.py build/campfire-museum-assets | tee build/campfire-museum-assets.log
      - name: Losslessly remove Draco from production-review sources
        shell: bash
        run: |
          set -euo pipefail
          for source in build/campfire-museum-assets/*/*_smithsonian_draco_reference.glb; do
            output="${source%_smithsonian_draco_reference.glb}_smithsonian_source_uncompressed.glb"
            npx --yes @gltf-transform/cli@4.5.0 cp "$source" "$output"
          done
          python3 .github/scripts/campfire/probe_smithsonian_museum_assets.py build/campfire-museum-assets --verify-decompressed | tee -a build/campfire-museum-assets.log
      - name: Convert verified sources to Campfire static runtime meshes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/campfire-museum-runtime

          python3 .github/scripts/campfire/convert_static_museum_glb.py \
            build/campfire-museum-assets/triceratops_horridus/triceratops_horridus_smithsonian_source_uncompressed.glb \
            build/campfire-museum-runtime/triceratops_horridus \
            --expected-source-sha256 a76b728da3c2c0369c5d1904b00a394317d285cfdc336c9306307364fea2a19f

          python3 .github/scripts/campfire/convert_static_museum_glb.py \
            build/campfire-museum-assets/mammuthus_primigenius/mammuthus_primigenius_smithsonian_source_uncompressed.glb \
            build/campfire-museum-runtime/mammuthus_primigenius \
            --expected-source-sha256 b785898fc230252d7f5aaf8ecb7a98d3a5eae3829f324ca0607cfe5aab8b8256
          test "$(find build/campfire-museum-runtime -name '*.cfmesh' | wc -l)" -eq 2
          find build/campfire-museum-runtime -maxdepth 3 -type f -print | sort
      - name: Assemble museum asset-review resource pack
        shell: bash
        run: |
          set -euo pipefail
          PACK=build/campfire-museum-review-pack
          mkdir -p "$PACK/assets/campfiresessions/museum"
          cp -R build/campfire-museum-runtime/triceratops_horridus "$PACK/assets/campfiresessions/museum/"
          cp -R build/campfire-museum-runtime/mammuthus_primigenius "$PACK/assets/campfiresessions/museum/"
          cat > "$PACK/pack.mcmeta" <<'JSON'
          {
            "pack": {
              "description": "Campfire Sessions Smithsonian museum asset review",
              "min_format": [88, 0],
              "max_format": [88, 0]
            }
          }
          JSON
          (
            cd "$PACK"
            zip -qr ../campfire-museum-review-pack.zip .
          )
          test -s build/campfire-museum-review-pack.zip
          unzip -l build/campfire-museum-review-pack.zip | sed -n '1,120p'
      - name: Upload museum asset staging package
        uses: actions/upload-artifact@v4
        with:
          name: campfire-museum-assets
          path: |
            build/campfire-museum-assets
            build/campfire-museum-assets.log
            build/campfire-museum-runtime
            build/campfire-museum-review-pack.zip
          if-no-files-found: error
          retention-days: 14
