name: Frontier + Survival Existing World Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-survival-existing-world-smoke.yml'

permissions:
  contents: read

concurrency:
  group: frontier-survival-existing-world-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Build both mods with compatibility key patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/client/SurvivalAscensionClient.java')
          s=p.read_text(encoding='utf-8')
          old='"key.survivalascension.menu", InputConstants.KEY_M, KeyMapping.Category.MISC);'
          new='"key.survivalascension.menu", InputConstants.KEY_K, KeyMapping.Category.MISC);'
          if s.count(old)!=1: raise SystemExit('unexpected Survival menu key source')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          (cd projects/survival-ascension && chmod +x gradlew && ./gradlew --no-daemon --no-configuration-cache clean build --console=plain)
          (cd projects/frontier-settlement && chmod +x gradlew && ./gradlew --no-daemon --no-configuration-cache clean build --console=plain)

      - name: Create Frontier-only world then reopen with Survival added
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE/projects/frontier-settlement"
          RUN="$ROOT/run"
          mkdir -p "$RUN/mods"
          rm -f "$RUN/mods"/*.jar
          printf 'eula=true\n' > "$RUN/eula.txt"
          cat > "$GITHUB_WORKSPACE/run_server_once.py" <<'PY'
          import subprocess, sys, time, pathlib
          root=pathlib.Path(sys.argv[1])
          log_path=pathlib.Path(sys.argv[2])
          p=subprocess.Popen(
              ['./gradlew','--no-daemon','--no-configuration-cache','runServer','--console=plain'],
              cwd=root, stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              text=True, bufsize=1)
          ready=False
          deadline=time.time()+120
          with log_path.open('w', encoding='utf-8') as log:
              while time.time() < deadline:
                  line=p.stdout.readline()
                  if line:
                      log.write(line); log.flush()
                      if 'Done (' in line and 'For help' in line:
                          ready=True
                          try:
                              p.stdin.write('stop\n'); p.stdin.flush()
                          except Exception:
                              pass
                          break
                  elif p.poll() is not None:
                      break
              try:
                  tail,_=p.communicate(timeout=35)
                  if tail: log.write(tail)
              except subprocess.TimeoutExpired:
                  p.terminate()
                  try: tail,_=p.communicate(timeout=10)
                  except subprocess.TimeoutExpired:
                      p.kill(); tail,_=p.communicate()
                  if tail: log.write(tail)
          text=log_path.read_text(encoding='utf-8', errors='replace')
          fatal=('NoClassDefFoundError','ClassNotFoundException','Exception in server tick loop',
                 'Failed to start the minecraft server','Mod loading error has occurred',
                 'Errors in currently selected datapacks prevented the world from loading')
          if not ready:
              print(text)
              raise SystemExit('server never reached ready state')
          if any(x.lower() in text.lower() for x in fatal):
              print(text)
              raise SystemExit('fatal server error detected')
          print(text)
          PY

          python3 "$GITHUB_WORKSPACE/run_server_once.py" "$ROOT" "$GITHUB_WORKSPACE/frontier-only-first-boot.log"
          test -f "$RUN/world/level.dat"
          cp "$GITHUB_WORKSPACE/projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar" "$RUN/mods/"
          python3 "$GITHUB_WORKSPACE/run_server_once.py" "$ROOT" "$GITHUB_WORKSPACE/frontier-plus-survival-reopen.log"
          test -f "$RUN/world/level.dat"
          echo "Frontier-only world reopened successfully after adding Survival Ascension core."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontier-survival-existing-world-smoke-logs
          path: |
            frontier-only-first-boot.log
            frontier-plus-survival-reopen.log
          if-no-files-found: warn
