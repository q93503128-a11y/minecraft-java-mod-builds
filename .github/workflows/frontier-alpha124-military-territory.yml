name: Frontier Alpha.124 Military Territory

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha124-military-territory.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Alpha.124
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/alpha124/patch.py
          python3 - <<'PY'
          from pathlib import Path
          root=Path('projects/frontier-settlement')
          p=root/'src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementBarracksService.java'
          s=p.read_text(encoding='utf-8')
          old_call='Monster threat = nearestThreat(level, data, barracks.workCenter());'
          new_call='Monster threat = nearestThreat(level, data, barracks, barracks.workCenter());'
          old_sig='private static Monster nearestThreat(ServerLevel level, SettlementData data, BlockPos center) {'
          new_sig='private static Monster nearestThreat(ServerLevel level, SettlementData data, BuildingRecord barracks, BlockPos center) {'
          if s.count(old_call) != 1 or s.count(old_sig) != 1:
              raise SystemExit('barracks threat signature patch drifted')
          p.write_text(s.replace(old_call,new_call,1).replace(old_sig,new_sig,1), encoding='utf-8')

          t=root/'tools/test_current_source.py'
          a=t.read_text(encoding='utf-8')
          old1='require("CITADEL_PATROL_RADIUS = 32" in barracks_runtime and "CITADEL_THREAT_RADIUS_BONUS = 12.0D" in barracks_runtime, "citadel response bonus missing")'
          new1='require("SettlementMilitaryUpgradeService.barracksPatrolRadius(data, barracks)" in barracks_runtime and "SettlementMilitaryUpgradeService.barracksThreatRadiusBonus(data, barracks)" in barracks_runtime, "paid barracks/citadel response bonus missing")'
          old2='require("Monster threat = nearestThreat(level, data, barracks.workCenter());" in barracks_runtime and "patrol(level, data, barracks, slot, soldier, threat)" in barracks_runtime, "barracks shared threat scan missing")'
          new2='require("Monster threat = nearestThreat(level, data, barracks, barracks.workCenter());" in barracks_runtime and "patrol(level, data, barracks, slot, soldier, threat)" in barracks_runtime, "barracks shared threat scan missing")'
          if a.count(old1) != 1 or a.count(old2) != 1:
              raise SystemExit('legacy military source audit patch drifted')
          t.write_text(a.replace(old1,new1,1).replace(old2,new2,1), encoding='utf-8')
          PY
      - name: Audit Alpha.124 source and docs
        shell: bash
        run: |
          set -euo pipefail
          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          python3 tools/test_companion_testpack.py
      - name: Java 25 clean build and JAR verify
        shell: bash
        run: |
          set -euo pipefail
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
          test -f build/libs/frontier_settlement-0.1.0-alpha.124.jar
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.124.jar
          git diff --check
      - name: Remove one-time patch staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/alpha124
          rm -f .github/workflows/frontier-alpha124-military-territory.yml
          git diff --check
      - name: Commit Alpha.124
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontier: release 0.1.0-alpha.124 military territory economy'
          git push origin HEAD:main
