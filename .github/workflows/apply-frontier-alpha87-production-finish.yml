name: Apply Frontier Alpha87 Production and Finish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha87-production-finish.yml'
      - 'projects/frontier-settlement/tools/apply_alpha87.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebase on latest main
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
      - name: Apply Alpha.87
        working-directory: projects/frontier-settlement
        run: python3 tools/apply_alpha87.py
      - name: Cumulative source audit
        working-directory: projects/frontier-settlement
        run: python3 tools/test_alpha87_source.py
      - name: Canonical docs audit
        working-directory: projects/frontier-settlement
        run: python3 tools/test_alpha87_docs.py
      - name: Java 25 clean build and runtime JAR verify
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.87.jar
          git diff --check
      - name: Commit verified Alpha.87 and remove one-shot applicator
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-frontier-alpha87-production-finish.yml
          rm -f projects/frontier-settlement/tools/apply_alpha87.py
          git add -A projects/frontier-settlement .github/workflows/apply-frontier-alpha87-production-finish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Improve Frontier alpha.87 production logistics and finalization'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
