name: Frontier Construction Matrix QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-construction-matrix-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Prepare headless server EULA
        shell: bash
        run: |
          mkdir -p projects/frontier-settlement/run/server
          printf 'eula=true\n' > projects/frontier-settlement/run/server/eula.txt
      - name: Enumerate all building rotations in NeoForge runtime
        shell: bash
        env:
          FRONTIER_MATRIX_QA: '1'
        run: |
          set -o pipefail
          cd projects/frontier-settlement
          timeout 240 ./gradlew runServer --no-daemon 2>&1 | tee ../../frontier-construction-matrix-qa.log
          grep -q 'FRONTIER_CONSTRUCTION_MATRIX_QA_V2' ../../frontier-construction-matrix-qa.log
          grep -q 'TOTAL cases=72 failures=0' ../../frontier-construction-matrix-qa.log
      - name: Upload matrix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-construction-matrix-qa
          path: frontier-construction-matrix-qa.log
          if-no-files-found: error
