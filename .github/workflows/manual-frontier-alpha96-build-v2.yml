name: Manual Frontier Alpha96 Build V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-frontier-alpha96-build-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Prepare version
        run: sed -i 's/mod_version=0.1.0-alpha.95/mod_version=0.1.0-alpha.96/' projects/frontier-settlement/gradle.properties
      - name: Check source contract
        run: |
          grep -q 'mod_version=0.1.0-alpha.96' projects/frontier-settlement/gradle.properties
          grep -q 'DroppedItemCleanupService::onServerTick' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/FrontierSettlement.java
          grep -q 'PRESSURE_TRIGGER_ENTITIES = 160' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/DroppedItemCleanupService.java
      - name: Build Frontier
        working-directory: projects/frontier-settlement
        run: ./gradlew clean build --no-daemon
      - name: Verify jar
        run: |
          JAR=projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.96.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'DroppedItemCleanupService.class'
          test -z "$(zipinfo -1 "$JAR" | sort | uniq -d)"
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha96-replacement
          path: projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.96.jar
          if-no-files-found: error
      - name: Commit main
        run: |
          rm -f .github/workflows/manual-frontier-alpha96-auto-drop-cleanup.yml
          rm -f .github/workflows/manual-frontier-alpha96-build-v2.yml
          git config user.name coworkaccount
          git config user.email cyp1jhh2@gmail.com
          git add projects/frontier-settlement/gradle.properties .github/workflows/manual-frontier-alpha96-auto-drop-cleanup.yml .github/workflows/manual-frontier-alpha96-build-v2.yml
          git commit -m 'Finalize automatic low-value drop cleanup'
          git push origin HEAD:main
