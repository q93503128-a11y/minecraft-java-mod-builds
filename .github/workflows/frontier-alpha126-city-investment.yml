name: Frontier Alpha.126 City Investment

on:
  push:
    paths:
      - '.github/alpha126/**'
      - '.github/workflows/frontier-alpha126-city-investment.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha126-city-investment
  cancel-in-progress: false

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4

      - name: Apply Alpha.126
        run: |
          set -euo pipefail
          python3 .github/alpha126/patch.py

      - name: Audit Alpha.126 source docs and companion locks
        run: |
          set -euo pipefail
          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          python3 tools/test_companion_testpack.py
          python3 - <<'PY'
          from pathlib import Path
          root = Path('.')
          city = (root/'src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementCityInvestmentService.java').read_text(encoding='utf-8')
          guidance = (root/'src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementGuidanceService.java').read_text(encoding='utf-8')
          tier = (root/'src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementTier.java').read_text(encoding='utf-8')
          assert 'CIVIC_HALL || type == BuildingType.TRADE_HALL' in city
          assert 'new UpgradeCost(1280L, 896L, 320L)' in city
          assert 'consumeLogisticsUpgrade' in city and 'countCommonUpgradeMetal' in city
          assert '농장 2곳으로 식량 기반 확대' not in guidance
          assert 'FRONTIER_CAPITAL' in tier and 'CIVIC_HALL' in tier and 'TRADE_HALL' in tier and 'CITADEL' in tier
          print('Alpha.126 exact city-investment assertions: PASS')
          PY
          git diff --check

      - name: Java 25 clean build and JAR verify
        run: |
          set -euo pipefail
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
          test -f build/libs/frontier_settlement-0.1.0-alpha.126.jar
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.126.jar
          git diff --check

      - name: Remove one-time staging
        run: |
          set -euo pipefail
          rm -rf .github/alpha126
          rm -f .github/workflows/frontier-alpha126-city-investment.yml
          git diff --check

      - name: Commit Alpha.126
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'frontier: release 0.1.0-alpha.126 city investment'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
