name: Probe Campfire Canonical World Runtime

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/probe-campfire-world.yml'
      - 'projects/campfire-sessions/tools/probe_candidate_world.py'
      - 'projects/campfire-sessions/build.gradle'
      - 'projects/campfire-sessions/gradle.properties'
      - 'projects/campfire-sessions/tools/extract_external_structure_assets.py'
      - 'projects/campfire-sessions/tools/prepare_village_review_world.py'
      - 'projects/campfire-sessions/src/main/java/kr/moonseungjun/campfiresessions/world/**'
      - 'projects/campfire-sessions/src/main/java/kr/moonseungjun/campfiresessions/CampfireSessions.java'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/campfire-sessions

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify village review bootstrap wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'VillageReviewBootstrap::onServerStarted' \
            src/main/java/kr/moonseungjun/campfiresessions/CampfireSessions.java
          grep -Fq "jvmArgument '-Dcampfiresessions.villageReview=true'" build.gradle
          grep -Fq 'villageReviewServer' build.gradle

      - name: Download canonical Geming400 island world
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/world-probe
          OUT=build/world-probe/island.zip
          urls=(
            'https://mediafilez.forgecdn.net/files/6229/422/Island%20-%20No%20WorldBorder.zip'
            'https://www.curseforge.com/api/v1/mods/1206982/files/6229422/download'
            'https://www.curseforge.com/minecraft/worlds/island-map-1-19-1024x1024/download/6229422/file'
          )
          ok=0
          for url in "${urls[@]}"; do
            rm -f "$OUT"
            if curl -fL --retry 2 --connect-timeout 20 --max-time 180 -A 'CampfireSessionsWorldProbe/1.0' "$url" -o "$OUT"; then
              if unzip -tq "$OUT" >/dev/null 2>&1; then
                ok=1
                echo "downloaded candidate world from: $url"
                break
              fi
            fi
          done
          test "$ok" = 1
          sha256sum "$OUT" | tee build/world-probe/world.sha256
          echo '7a3d98ff75feb26913e2d4c32ca7339448d3c660c14f986ce9f5e4ff340d3d3b  build/world-probe/island.zip' | sha256sum -c -
          unzip -q "$OUT" -d build/world-probe/unpacked
          echo 'candidate level.dat roots:'
          find build/world-probe/unpacked -maxdepth 4 -type f -name level.dat -print
          echo 'top archive entries:'
          unzip -l "$OUT" | sed -n '1,80p'

      - name: Analyze canonical world regions
        shell: bash
        run: |
          set -euo pipefail
          WORLD_ROOT="$(python3 -c "import pathlib; base=pathlib.Path('build/world-probe/unpacked'); cs=[(len(list((p.parent/'region').glob('r.*.*.mca'))) if (p.parent/'region').is_dir() else 0, len(p.parent.parts), str(p.parent)) for p in base.rglob('level.dat')]; print(max(cs)[2] if cs else '')")"
          test -n "$WORLD_ROOT"
          python3 tools/probe_candidate_world.py "$WORLD_ROOT" | tee build/world-probe/probe.log
          cp "$(dirname "$WORLD_ROOT")/campfire-world-probe.json" build/world-probe/campfire-world-probe.json

      - name: Verify full runtime stack and canonical world server load
        shell: bash
        run: |
          set -euo pipefail
          WORLD_ROOT="$(python3 -c "import pathlib; base=pathlib.Path('build/world-probe/unpacked'); cs=[(len(list((p.parent/'region').glob('r.*.*.mca'))) if (p.parent/'region').is_dir() else 0, len(p.parent.parts), str(p.parent)) for p in base.rglob('level.dat')]; print(max(cs)[2] if cs else '')")"

          ./gradlew --no-daemon dependencies --configuration runtimeClasspath > build/world-probe/runtime-classpath.txt
          for dep in \
            'croptopia' \
            'epherolib' \
            'vJnhuDde' \
            'MBAkmtvl' \
            'shroomcrafted' \
            'puzzles-lib' \
            'sophisticated-backpacks' \
            'sophisticated-core' \
            'traveler-tool-belt' \
            'player-animation-library' \
            'peterwolfs-boats-ships' \
            'pezpt98N' \
            'geckolib-neoforge-26.2'
          do
            grep -qi "$dep" build/world-probe/runtime-classpath.txt || {
              echo "missing expected runtime dependency: $dep"
              exit 1
            }
          done

          rm -rf run/world
          mkdir -p run/world
          cp -a "$WORLD_ROOT"/. run/world/
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          cat > run/server.properties <<'EOF'
          level-name=world
          online-mode=false
          allow-flight=true
          max-tick-time=120000
          view-distance=4
          simulation-distance=4
          spawn-protection=0
          EOF
          ./gradlew --no-daemon runServer > build/world-probe/server-load.log 2>&1 &
          pid=$!
          success=0
          for i in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.]+s\)!|Done \(' build/world-probe/server-load.log; then
              success=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ "$success" = 1 ]; then
            {
              echo 'WORLD_LOAD_26_2=SUCCESS'
              echo 'FULL_RUNTIME_STACK_SERVER_LOAD=SUCCESS'
              echo 'CANONICAL_WORLD_HASH_VERIFIED=YES'
            } | tee build/world-probe/world-load-status.txt
          else
            {
              echo 'WORLD_LOAD_26_2=FAIL'
              echo 'FULL_RUNTIME_STACK_SERVER_LOAD=FAIL'
            } | tee build/world-probe/world-load-status.txt
            tail -n 200 build/world-probe/server-load.log
            exit 1
          fi

      - name: Verify authored village slice on canonical world
        shell: bash
        run: |
          set -euo pipefail
          WORLD_ROOT="$(python3 -c "import pathlib; base=pathlib.Path('build/world-probe/unpacked'); cs=[(len(list((p.parent/'region').glob('r.*.*.mca'))) if (p.parent/'region').is_dir() else 0, len(p.parent.parts), str(p.parent)) for p in base.rglob('level.dat')]; print(max(cs)[2] if cs else '')")"
          test -n "$WORLD_ROOT"

          REVIEW=run-village-review-server
          rm -rf "$REVIEW"
          mkdir -p "$REVIEW/world"
          cp -a "$WORLD_ROOT"/. "$REVIEW/world/"
          cat > "$REVIEW/world/.campfiresessions-canonical-world-source" <<'EOF'
          {
            "archive_sha256": "7a3d98ff75feb26913e2d4c32ca7339448d3c660c14f986ce9f5e4ff340d3d3b",
            "source": "CI verified canonical Geming400 copy"
          }
          EOF
          printf 'eula=true\n' > "$REVIEW/eula.txt"
          cat > "$REVIEW/server.properties" <<'EOF'
          level-name=world
          online-mode=false
          allow-flight=true
          max-tick-time=120000
          view-distance=6
          simulation-distance=6
          spawn-protection=0
          EOF

          ./gradlew --no-daemon runVillageReviewServer > build/world-probe/village-review-server.log 2>&1 &
          pid=$!
          success=0
          for i in $(seq 1 180); do
            done_ok=0
            layout_ok=0
            grep -Eq 'Done \([0-9.]+s\)!|Done \(' build/world-probe/village-review-server.log && done_ok=1 || true
            grep -Fq 'Campfire village review layout applied: 12 real external structures' build/world-probe/village-review-server.log && layout_ok=1 || true
            if [ "$done_ok" = 1 ] && [ "$layout_ok" = 1 ]; then
              success=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true

          if [ "$success" != 1 ]; then
            tail -n 240 build/world-probe/village-review-server.log
            exit 1
          fi

          test -f "$REVIEW/world/.campfiresessions-village-review-v3"
          grep -Fq 'Campfire village review landscape applied:' build/world-probe/village-review-server.log
          grep -Fq 'Campfire village review placed harbor_dock' build/world-probe/village-review-server.log
          {
            echo 'VILLAGE_REVIEW_CANONICAL_WORLD=SUCCESS'
            echo 'REAL_EXTERNAL_BUILDINGS_PLACED=12'
            echo 'VILLAGE_PATH_PLAZA_APPLIED=YES'
            echo 'HARBOR_DOCK_APPLIED=YES'
          } | tee -a build/world-probe/world-load-status.txt

      - name: Stage one-click village review world
        shell: bash
        run: |
          set -euo pipefail
          test -f run-village-review-server/world/.campfiresessions-village-review-v3
          rm -rf build/village-review-world
          mkdir -p build/village-review-world
          cp -a run-village-review-server/world/. build/village-review-world/
          rm -f build/village-review-world/session.lock
          python3 - <<'PY'
          from pathlib import Path
          root = Path('build/village-review-world')
          print('VILLAGE_REVIEW_WORLD_FILE_COUNT=' + str(sum(1 for p in root.rglob('*') if p.is_file())))
          print('VILLAGE_REVIEW_WORLD_BYTES=' + str(sum(p.stat().st_size for p in root.rglob('*') if p.is_file())))
          PY

      - name: Upload one-click village review world
        uses: actions/upload-artifact@v4
        with:
          name: campfire-village-review-world
          path: projects/campfire-sessions/build/village-review-world
          include-hidden-files: true
          if-no-files-found: error

      - name: Assemble private Modrinth village review pack
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon jar copyAssetReviewProbe

          python3 - <<'PY'
          from __future__ import annotations
          import json
          import shutil
          import tomllib
          import zipfile
          from pathlib import Path

          root = Path('.')
          stage = root / 'build' / 'campfire-review-mrpack'
          overrides = stage / 'overrides'
          mods_out = overrides / 'mods'
          world_out = overrides / 'saves' / 'campfire-village-review'

          if stage.exists():
              shutil.rmtree(stage)
          mods_out.mkdir(parents=True)
          world_out.parent.mkdir(parents=True, exist_ok=True)

          source_world = root / 'build' / 'village-review-world'
          if not (source_world / 'level.dat').is_file():
              raise SystemExit('missing verified village review world')
          shutil.copytree(source_world, world_out)

          accepted_mod_ids = {
              'balm',
              'croptopia',
              'epherolib',
              'geckolib',
              'peterwolfs_boats_and_ships',
              'skniro_furniture',
              'player_animation_library',
              'puzzleslib',
              'shroomcraft',
              'sophisticatedbackpacks',
              'sophisticatedcore',
              'travelertoolbelt',
              'cookingforblockheads',
          }

          probe_dir = root / 'build' / 'assetReviewProbe'
          found = {}
          for jar in sorted(probe_dir.glob('*.jar')):
              try:
                  with zipfile.ZipFile(jar) as zf:
                      try:
                          raw = zf.read('META-INF/neoforge.mods.toml')
                      except KeyError:
                          continue
                  data = tomllib.loads(raw.decode('utf-8'))
                  ids = {entry.get('modId') for entry in data.get('mods', []) if entry.get('modId')}
              except Exception:
                  continue

              match = ids & accepted_mod_ids
              if not match:
                  continue
              for mod_id in match:
                  if mod_id in found:
                      raise SystemExit(f'duplicate runtime mod id {mod_id}: {found[mod_id]} / {jar}')
                  found[mod_id] = jar.name
              shutil.copy2(jar, mods_out / jar.name)

          missing = accepted_mod_ids - found.keys()
          if missing:
              raise SystemExit('missing review-pack runtime mods: ' + ', '.join(sorted(missing)))

          own = root / 'build' / 'libs' / 'campfiresessions-0.6.0-alpha.1.jar'
          if not own.is_file():
              raise SystemExit(f'missing Campfire jar: {own}')
          shutil.copy2(own, mods_out / own.name)

          notice_dir = overrides / 'campfire-review'
          notice_dir.mkdir(parents=True)
          (notice_dir / 'README.txt').write_text(
              'Campfire Sessions private village-layout review pack\n'
              'Minecraft 26.2 / NeoForge 26.2.0.87\n\n'
              'Import this .mrpack into the Modrinth App and launch it.\n'
              'Open the included world: campfire-village-review.\n'
              'No separate map, mod, schematic, or resource-pack installation is required.\n\n'
              'This review save intentionally displays exterior shells for facilities that are not all\n'
              'available on the real first in-game day. It exists to review map composition, paths,\n'
              'building orientation, terrain fit, and harbor placement.\n'
              'Do not publish or redistribute this private review pack.\n',
              encoding='utf-8',
          )
          (notice_dir / 'WORLD_LICENSE.txt').write_text(
              'Canonical world: Geming400 — Island map | 1024x1024 / Island - No WorldBorder.zip\n'
              'License recorded by Campfire Sessions project: MIT\n'
              'Pinned source archive SHA-256:\n'
              '7a3d98ff75feb26913e2d4c32ca7339448d3c660c14f986ce9f5e4ff340d3d3b\n',
              encoding='utf-8',
          )

          index = {
              'formatVersion': 1,
              'game': 'minecraft',
              'versionId': '0.6.0-alpha.1-village-review-25',
              'name': 'Campfire Sessions - Village Review',
              'summary': 'Private one-click canonical island and real-building layout review pack.',
              'files': [],
              'dependencies': {
                  'minecraft': '26.2',
                  'neoforge': '26.2.0.87',
              },
          }
          (stage / 'modrinth.index.json').write_text(
              json.dumps(index, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )

          out = root / 'build' / 'Campfire-Sessions-Village-Review-0.6.0-alpha.1.mrpack'
          out.unlink(missing_ok=True)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              for file in sorted(stage.rglob('*')):
                  if file.is_file():
                      zf.write(file, file.relative_to(stage).as_posix())

          print('MRPACK=' + str(out))
          print('RUNTIME_MODS=' + ','.join(sorted(found)))
          print('MRPACK_BYTES=' + str(out.stat().st_size))
          PY

      - name: Upload private Modrinth village review pack
        uses: actions/upload-artifact@v4
        with:
          name: campfire-village-review-mrpack
          path: projects/campfire-sessions/build/Campfire-Sessions-Village-Review-0.6.0-alpha.1.mrpack
          if-no-files-found: error

      - name: Upload world probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campfire-world-probe
          path: |
            projects/campfire-sessions/build/world-probe/campfire-world-probe.json
            projects/campfire-sessions/build/world-probe/probe.log
            projects/campfire-sessions/build/world-probe/world.sha256
            projects/campfire-sessions/build/world-probe/world-load-status.txt
            projects/campfire-sessions/build/world-probe/server-load.log
            projects/campfire-sessions/build/world-probe/runtime-classpath.txt
            projects/campfire-sessions/build/world-probe/village-review-server.log
          if-no-files-found: warn
