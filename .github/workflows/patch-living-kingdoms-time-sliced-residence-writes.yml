name: Patch Living Kingdoms time-sliced residence writes

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/patch_living_kingdoms_time_sliced_residence_writes.py'
      - '.github/workflows/patch-living-kingdoms-time-sliced-residence-writes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply construction time slice and fixture validation
        run: python .github/scripts/patch_living_kingdoms_time_sliced_residence_writes.py
      - name: Commit Java fixes
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/IncrementalWorldEditPlan.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorResidenceBuilder.java
          git diff --cached --quiet && exit 0
          git commit -m 'Time-slice construction writes and validate complete homes'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot performance and validation repair; remove after Java changes land.
