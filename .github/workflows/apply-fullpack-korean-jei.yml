name: Apply Full Pack Korean and JEI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fullpack-korean-jei.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-fullpack-korean-jei
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install offline translation runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input 'transformers<5' sentencepiece sacremoses
          python3 -m pip install --disable-pip-version-check --no-input torch --index-url https://download.pytorch.org/whl/cpu

      - name: Generate missing Korean translations for the pinned FULL stack
        shell: bash
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re, urllib.request, zipfile
          from collections import defaultdict
          from pathlib import Path
          import torch
          from transformers import AutoTokenizer, AutoModelForSeq2SeqLM

          ROOT=Path.cwd()
          TMP=ROOT/'.tmp-full-ko'
          TMP.mkdir(exist_ok=True)

          frontier=json.loads((ROOT/'projects/frontier-settlement/companion-testpack/resolved-lock.client.json').read_text(encoding='utf-8'))
          sources=[{'name':f['filename'],'url':f['url']} for f in frontier['files']]
          survival=json.loads((ROOT/'projects/survival-ascension/modpack/content-lock.json').read_text(encoding='utf-8'))
          for mod in survival['mods']:
              req=urllib.request.Request(f"https://api.modrinth.com/v2/version/{mod['version_id']}",headers={'User-Agent':'Frontier-Full-Korean/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r: meta=json.load(r)
              pf=next((f for f in meta['files'] if f.get('primary')),meta['files'][0])
              sources.append({'name':pf['filename'],'url':pf['url']})
          sources=list({s['name']:s for s in sources}.values())

          langs=defaultdict(lambda:{'en':{},'ko':{}})
          for i,s in enumerate(sources):
              p=TMP/f'{i}.jar'
              req=urllib.request.Request(s['url'],headers={'User-Agent':'Frontier-Full-Korean/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r: p.write_bytes(r.read())
              with zipfile.ZipFile(p) as z:
                  for n in z.namelist():
                      m=re.fullmatch(r'assets/([^/]+)/lang/(en_us|ko_kr)\.json',n)
                      if not m: continue
                      ns,loc=m.groups()
                      try:
                          data=json.loads(z.read(n).decode('utf-8'))
                      except Exception:
                          # Dungeons & Taverns 5.3.0 ships a malformed Korean JSON.
                          # Do not copy it; our own complete Korean overlay is generated from en_us instead.
                          continue
                      langs[ns]['en'].update(data)
                      if loc=='ko_kr': langs[ns]['ko'].update(data)

          for project in ('frontier-settlement','survival-ascension'):
              base=ROOT/f'projects/{project}/src/main/resources/assets'
              if not base.exists(): continue
              for p in base.glob('*/lang/ko_kr.json'):
                  try: data=json.loads(p.read_text(encoding='utf-8'))
                  except Exception: continue
                  langs[p.parent.parent.name]['ko'].update(data)

          target_namespaces={
              'bettercombat','dnt','jade','sophisticatedbackpacks','sophisticatedcore',
              'tbos','weaponsexpanded','xaerobetterpvp','xaerominimap'
          }

          TOKEN_RE=re.compile(r'(%\d*\$?[sdif]|\{[^{}]*\}|§.|\\n|\n)')
          manual={
              'Mob Catcher Upgrade':'몹 포획 기능',
              'Captures passive mobs into backpack storage slots with sneak right-click':'웅크린 채 우클릭하면 수동적 몹을 배낭 보관 슬롯에 포획합니다.',
              'Advanced Mob Catcher Upgrade':'고급 몹 포획 기능',
              'Captures passive and hostile mobs into backpack storage slots with sneak right-click':'웅크린 채 우클릭하면 수동적 몹과 적대적 몹을 배낭 보관 슬롯에 포획합니다.',
              'Better Combat':'개선된 전투',
              "Xaero's Minimap":'제로의 미니맵',
              'Mob Catcher':'몹 포획',
              'Advanced Mob Catcher':'고급 몹 포획',
          }

          # Prepare all values first so the model can translate unique text fragments in batches.
          todos={}
          for ns in sorted(target_namespaces):
              en=langs[ns]['en']; ko=langs[ns]['ko']
              todos[ns]=dict(en) if ns=='dnt' else {k:v for k,v in en.items() if k not in ko}
              print(f'{ns}: translation overlay keys={len(todos[ns])}')

          fragments=[]
          for todo in todos.values():
              for text in todo.values():
                  if text in manual: continue
                  for part in TOKEN_RE.split(text):
                      if not part or TOKEN_RE.fullmatch(part) or not re.search(r'[A-Za-z]',part): continue
                      fragments.append(part)
          unique=list(dict.fromkeys(fragments))
          print('unique English fragments=',len(unique))

          model_name='Helsinki-NLP/opus-mt-tc-big-en-ko'
          tokenizer=AutoTokenizer.from_pretrained(model_name)
          model=AutoModelForSeq2SeqLM.from_pretrained(model_name)
          model.eval()
          torch.set_num_threads(max(1,min(4,torch.get_num_threads())))
          translated_fragments={}
          batch_size=16
          with torch.inference_mode():
              for start in range(0,len(unique),batch_size):
                  batch=unique[start:start+batch_size]
                  enc=tokenizer(batch,return_tensors='pt',padding=True,truncation=True,max_length=512)
                  out=model.generate(**enc,max_new_tokens=512,num_beams=2)
                  dec=tokenizer.batch_decode(out,skip_special_tokens=True)
                  for src,dst in zip(batch,dec):
                      translated_fragments[src]=dst
                  if start % 160 == 0: print('translated fragments',min(start+batch_size,len(unique)),'/',len(unique))

          def translate_value(text):
              if text in manual: return manual[text]
              parts=TOKEN_RE.split(text)
              return ''.join(part if not part or TOKEN_RE.fullmatch(part) or not re.search(r'[A-Za-z]',part) else translated_fragments.get(part,part) for part in parts)

          generated={}
          for ns,todo in todos.items():
              translated={k:translate_value(v) for k,v in todo.items()}
              if not translated: continue
              if ns=='tbos':
                  dst=ROOT/'projects/survival-ascension/src/main/resources/assets/tbos/lang/ko_kr.json'
              else:
                  dst=ROOT/f'projects/frontier-settlement/src/main/resources/assets/{ns}/lang/ko_kr.json'
              dst.parent.mkdir(parents=True,exist_ok=True)
              base={}
              if dst.exists():
                  try: base=json.loads(dst.read_text(encoding='utf-8'))
                  except Exception: base={}
              base.update(translated)
              # Explicitly lock the screenshot-visible Mob Catcher strings to natural Korean.
              if ns=='sophisticatedbackpacks':
                  base.update({
                      'item.sophisticatedbackpacks.mob_catcher_upgrade':'몹 포획 기능',
                      'item.sophisticatedbackpacks.mob_catcher_upgrade.tooltip':'웅크린 채 우클릭하면 수동적 몹을 배낭 보관 슬롯에 포획합니다.',
                      'item.sophisticatedbackpacks.advanced_mob_catcher_upgrade':'고급 몹 포획 기능',
                      'item.sophisticatedbackpacks.advanced_mob_catcher_upgrade.tooltip':'웅크린 채 우클릭하면 수동적 몹과 적대적 몹을 배낭 보관 슬롯에 포획합니다.',
                  })
              dst.write_text(json.dumps(base,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              generated[ns]=len(translated)

          failures=[]
          english_left=[]
          for ns in sorted(target_namespaces):
              en=langs[ns]['en']
              if ns=='tbos': dst=ROOT/'projects/survival-ascension/src/main/resources/assets/tbos/lang/ko_kr.json'
              else: dst=ROOT/f'projects/frontier-settlement/src/main/resources/assets/{ns}/lang/ko_kr.json'
              ours=json.loads(dst.read_text(encoding='utf-8')) if dst.exists() else {}
              covered=dict(langs[ns]['ko']); covered.update(ours)
              missing=sorted(set(en)-set(covered))
              if missing: failures.append(f'{ns}: {len(missing)} missing: {missing[:10]}')
              for k in todos[ns]:
                  v=ours.get(k,'')
                  # Proper names / formatting tokens may retain Latin text, so only flag a value that stayed byte-identical English.
                  if v == en[k] and en[k] not in manual:
                      english_left.append(f'{ns}:{k}={v}')
          if failures: raise SystemExit('\n'.join(failures))
          if english_left:
              raise SystemExit('untranslated byte-identical English values remain:\n'+'\n'.join(english_left[:40]))
          print('KOREAN COVERAGE PASS',generated)
          PY

      - name: Patch FULL pack builder for JEI and robust smoke classification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/frontier-survival-full-new-world.yml')
          s=p.read_text(encoding='utf-8')

          needle="""          with zipfile.ZipFile(survival_pack) as z:\n              survival_index=json.loads(z.read('modrinth.index.json'))\n\n          files=[]\n"""
          repl="""          with zipfile.ZipFile(survival_pack) as z:\n              survival_index=json.loads(z.read('modrinth.index.json'))\n\n          # JEI recipe viewer, pinned to the tested NeoForge 26.2 build. Client only.\n          import urllib.request\n          req=urllib.request.Request('https://api.modrinth.com/v2/version/k8NezZZW',headers={'User-Agent':'Frontier-Full-Pack/1.0'})\n          with urllib.request.urlopen(req,timeout=60) as r:\n              jei_meta=json.load(r)\n          jei_file=next((f for f in jei_meta['files'] if f.get('primary')),jei_meta['files'][0])\n          if jei_meta.get('version_number') != '30.13.0.77':\n              raise SystemExit('JEI pin drifted from 30.13.0.77')\n\n          files=[]\n"""
          if needle not in s: raise SystemExit('JEI insertion anchor not found')
          s=s.replace(needle,repl,1)

          needle2="""              files.append(entry)\n              by_name[name]=entry\n\n          index={\n"""
          repl2="""              files.append(entry)\n              by_name[name]=entry\n\n          jei_entry={\n              'path':'mods/'+jei_file['filename'],\n              'hashes':{'sha1':jei_file['hashes']['sha1'],'sha512':jei_file['hashes']['sha512']},\n              'env':{'client':'required','server':'unsupported'},\n              'downloads':[jei_file['url']],\n              'fileSize':jei_file['size'],\n          }\n          if jei_file['filename'] not in by_name:\n              files.append(jei_entry)\n              by_name[jei_file['filename']]=jei_entry\n\n          index={\n"""
          if needle2 not in s: raise SystemExit('JEI append anchor not found')
          s=s.replace(needle2,repl2,1)

          s=s.replace(
              "plus Dungeons & Taverns, Repurposed Structures, The Birth of Steve, Amethyst Resonance, Better Combat, Weapons Expanded, Lootr, Sophisticated Backpacks, Variants & Ventures, Jade, Xaero's Minimap and their pinned libraries.",
              "plus Dungeons & Taverns, Repurposed Structures, The Birth of Steve, Amethyst Resonance, Better Combat, Weapons Expanded, Lootr, Sophisticated Backpacks, Variants & Ventures, Jade, Xaero's Minimap, JEI recipe viewing and their pinned libraries.",
              1)
          s=s.replace(
              "              assert any('Terralith' in x['path'] for x in parsed['files'])\n",
              "              assert any('Terralith' in x['path'] for x in parsed['files'])\n              assert any('jei-' in x['path'].lower() for x in parsed['files'])\n              assert all(x.get('env',{}).get('server')=='unsupported' for x in parsed['files'] if 'jei-' in x['path'].lower())\n",
              1)

          old="""          fatal=('NoClassDefFoundError','ClassNotFoundException','Exception in server tick loop','Failed to start the minecraft server','Mod loading error has occurred','Errors in currently selected datapacks prevented the world from loading','Registry loading errors')\n          if not ready:\n              print(text); raise SystemExit('full stack server never reached ready state')\n          if any(x.lower() in text.lower() for x in fatal):\n              print(text); raise SystemExit('fatal full stack server error detected')\n"""
          new="""          # Optional integration class lookups can log ClassNotFoundException and still boot normally.\n          # Treat actual failed startup/tick/datapack/registry states as fatal; readiness plus save is the boundary.\n          fatal=('Exception in server tick loop','Failed to start the minecraft server','Mod loading error has occurred','Errors in currently selected datapacks prevented the world from loading','Registry loading errors')\n          if not ready:\n              print(text); raise SystemExit('full stack server never reached ready state')\n          if any(x.lower() in text.lower() for x in fatal):\n              print(text); raise SystemExit('fatal full stack server error detected')\n"""
          if old not in s: raise SystemExit('smoke classifier anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate generated language JSON and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          for project in ('frontier-settlement','survival-ascension'):
              for p in (Path('projects')/project/'src/main/resources/assets').glob('*/lang/ko_kr.json'):
                  json.loads(p.read_text(encoding='utf-8'))
          print('LANG JSON VALIDATION PASS')
          PY
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/frontier-settlement/src/main/resources/assets projects/survival-ascension/src/main/resources/assets .github/workflows/frontier-survival-full-new-world.yml
          git diff --cached --stat
          git commit -m 'Complete full-pack Korean localization and add JEI' || exit 0
          git push origin HEAD:main
