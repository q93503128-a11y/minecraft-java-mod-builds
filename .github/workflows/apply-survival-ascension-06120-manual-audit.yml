name: Apply Survival Ascension 0.61.20 Manual Audit Fixes

on:
  push:
    paths:
      - 'projects/survival-ascension/.manual-audit-fix-trigger'

permissions:
  contents: write

jobs:
  validate-and-apply:
    runs-on: ubuntu-24.04
    env:
      PROJECT_DIR: projects/survival-ascension

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Apply manual-audit fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/survival-ascension/tools/apply_06120_manual_audit_fixes.py')
          s = p.read_text(encoding='utf-8')
          old = 'replace_once(project, "- Network protocol: `9`", "- Network protocol: `15`")'
          new = '''replace_once(\n    project,\n    "- Java: `25`\\n- Network protocol: `9`\\n- Existing-world compatibility:",\n    "- Java: `25`\\n- Network protocol: `15`\\n- Existing-world compatibility:",\n)'''
          if s.count(old) != 1:
              raise SystemExit(f'patch-runner compatibility target count: {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 "$PROJECT_DIR/tools/apply_06120_manual_audit_fixes.py"

      - name: Diff safety
        run: git diff --check

      - name: Current source regression audit
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 tools/test_current_source.py

      - name: Historical source/content audits (informational)
        shell: bash
        run: |
          set +e
          cd "$PROJECT_DIR"
          python3 tools/test_release_source.py
          SOURCE_STATUS=$?
          python3 tools/test_release_content_pack.py
          CONTENT_STATUS=$?
          echo "historical_source_status=$SOURCE_STATUS"
          echo "historical_content_status=$CONTENT_STATUS"
          echo "Historical literal release identities are informational for 0.61.20; current-source audit is authoritative."
          exit 0

      - name: Clean Java 25 build
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain

      - name: Commit validated fixes to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f "$PROJECT_DIR/.manual-audit-fix-trigger"
          rm -f "$PROJECT_DIR/tools/apply_06120_manual_audit_fixes.py"
          rm -f .github/workflows/apply-survival-ascension-06120-manual-audit.yml
          git add "$PROJECT_DIR" .github/workflows/apply-survival-ascension-06120-manual-audit.yml
          git commit -m "Fix Survival Ascension equipment economy and harvest queue"
          git pull --rebase origin main
          git push origin HEAD:main
