name: Export Arcane Circle source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-arcane-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf arcane-circle-source.tar.gz projects/arcane-circle
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-circle-source
          path: arcane-circle-source.tar.gz
          if-no-files-found: error
          retention-days: 7
      - name: Record export run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/arcane-source-export
          cat > /tmp/arcane-source-export/status.txt <<STATUS
          run_id=$GITHUB_RUN_ID
          source_sha=$GITHUB_SHA
          artifact=arcane-circle-source
          STATUS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ci-results/arcane-source-export
            cp /tmp/arcane-source-export/status.txt ci-results/arcane-source-export/status.txt
            git add ci-results/arcane-source-export/status.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane source export $GITHUB_RUN_ID [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
