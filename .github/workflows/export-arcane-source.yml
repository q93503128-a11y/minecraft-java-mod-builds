name: Export Arcane Circle source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-arcane-source.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive source
        shell: bash
        run: |
          set -euo pipefail
          tar -czf arcane-circle-source.tar.gz projects/arcane-circle
      - uses: actions/upload-artifact@v4
        with:
          name: arcane-circle-source
          path: arcane-circle-source.tar.gz
          if-no-files-found: error
          retention-days: 7
