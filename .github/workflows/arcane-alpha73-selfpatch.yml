name: Arcane alpha73 self patch

on:
  push:
    branches: [main]
    paths:
      - '.github/arcane-alpha73-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply audited second-circle patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/arcane-alpha73-patch.py')
          t = p.read_text(encoding='utf-8')
          old = '''replace_once(world_magic, '        duration = thirdCircleVisualDuration(spell.id(), duration);', '        duration = secondCircleVisualDuration(spell.id(), duration);\\n        duration = thirdCircleVisualDuration(spell.id(), duration);')
          # exactly two release paths must now contain secondCircle; first replacement changes both? replace_once only one, so patch NPC separately.
          text = world_magic.read_text(encoding='utf-8')
          needle = '        duration = thirdCircleVisualDuration(spell.id(), duration);'
          if text.count(needle) != 1:
              raise SystemExit(f'WorldMagicService: expected one remaining third-duration call, found {text.count(needle)}')
          world_magic.write_text(text.replace(needle, '        duration = secondCircleVisualDuration(spell.id(), duration);\\n        duration = thirdCircleVisualDuration(spell.id(), duration);', 1), encoding='utf-8')'''
          new = '''text = world_magic.read_text(encoding='utf-8')
          needle = '        duration = thirdCircleVisualDuration(spell.id(), duration);'
          if text.count(needle) != 2:
              raise SystemExit(f'WorldMagicService: expected two third-duration calls, found {text.count(needle)}')
          world_magic.write_text(text.replace(needle, '        duration = secondCircleVisualDuration(spell.id(), duration);\\n        duration = thirdCircleVisualDuration(spell.id(), duration);'), encoding='utf-8')'''
          if old not in t:
              raise SystemExit('alpha73 patch pre-fix anchor missing')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')
          PY
          python3 .github/arcane-alpha73-patch.py
          rm -f .github/arcane-alpha73-patch.py .github/arcane-alpha73-trigger.txt .github/workflows/arcane-alpha73-selfpatch.yml
          git add -A
          git diff --check
          git commit -m 'Arcane alpha.73 second-circle authority audit [skip ci]'
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1
