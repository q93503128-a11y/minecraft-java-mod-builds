name: Arcane alpha75 fusion compile hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-alpha75-fusion-compile-hotfix.yml'

permissions:
  contents: write
  actions: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply compile hotfix and self-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/magic/MagicPlayerData.java')
          s = p.read_text(encoding='utf-8')
          old = 'if (SpellCatalog.fusion(spellId).isPresent()) {'
          new = 'if (SpellCatalog.isFusionResult(spellId)) {'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one obsolete fusion lookup, got {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          g = Path('projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/magic/CombatGrowthService.java')
          gs = g.read_text(encoding='utf-8')
          gs = gs.replace('during one cast window. Passive\n * Passive livestock cannot feed insight/economy;',
                          'during one cast window.\n * Passive livestock cannot feed insight/economy;')
          g.write_text(gs, encoding='utf-8')

          Path('.github/workflows/arcane-alpha75-fusion-compile-hotfix.yml').unlink()
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Arcane alpha.75 fusion registration compile lookup [skip ci]'
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then pushed=1; break; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1

      - name: Dispatch canonical Arcane build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/workflows/build-arcane-circle.yml/dispatches" \
            -d '{"ref":"main"}'
