name: Patch Living Kingdoms external download reliability
on:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/.ground-void-trigger'
      - '.github/workflows/patch-living-kingdoms-ground-void-survey.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.2.1' }
      - name: Add bounded retries and verify Java 25
        id: apply
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/living-kingdoms/build.gradle')
          s=p.read_text()
          old='''            byte[] archive = source.toURL().openStream().withCloseable { it.readAllBytes() }'''
          new='''            byte[] archive = null
            Exception downloadFailure = null
            for (int attempt = 1; attempt <= 5 && archive == null; attempt++) {
                try {
                    def connection = source.toURL().openConnection()
                    connection.setConnectTimeout(15000)
                    connection.setReadTimeout(60000)
                    archive = connection.getInputStream().withCloseable { it.readAllBytes() }
                    downloadFailure = null
                } catch (Exception failure) {
                    downloadFailure = failure
                    if (attempt < 5) {
                        logger.warn("Schemcraft download attempt {}/5 failed for {}: {}", attempt, asset.slug, failure.toString())
                        Thread.sleep(attempt * 2000L)
                    }
                }
            }
            if (archive == null) {
                throw new GradleException("Failed to download external structure ${asset.slug} after 5 attempts", downloadFailure)
            }'''
          if old in s:
              s=s.replace(old,new,1)
          elif 'Failed to download external structure ${asset.slug} after 5 attempts' not in s:
              raise SystemExit('download line missing and retry block absent')
          p.write_text(s)
          PY
          grep -F 'attempt <= 5 && archive == null' projects/living-kingdoms/build.gradle
          grep -F 'Failed to download external structure ${asset.slug} after 5 attempts' projects/living-kingdoms/build.gradle
          git diff --check
          (cd projects/living-kingdoms && gradle --no-daemon clean classes --stacktrace --console=plain)
      - name: Commit reliability fix and clean transient hook
        if: steps.apply.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/build.gradle
          git rm -f .github/workflows/patch-living-kingdoms-ground-void-survey.yml projects/living-kingdoms/.ground-void-trigger
          git commit -m 'fix(living-kingdoms): retry transient structure downloads'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*2))
          done
          exit 1
      - name: Record reliability result
        if: always()
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p .github/build-pointers
          cat > .github/build-pointers/living-kingdoms-external-download-retry.json <<EOF
          {"run_id":"${{ github.run_id }}","run_number":"${{ github.run_number }}","commit_sha":"${{ github.sha }}","job_status":"${{ steps.apply.outcome }}"}
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/living-kingdoms-external-download-retry.json
          git commit -m "Record Living Kingdoms download retry ${{ github.run_number }} [skip ci]" || exit 0
          for attempt in 1 2 3 4 5; do git fetch origin main; if git rebase origin/main && git push origin HEAD:main; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep $((attempt*2)); done
          exit 1
      - name: Enforce reliability result
        if: always()
        run: test '${{ steps.apply.outcome }}' = 'success'
