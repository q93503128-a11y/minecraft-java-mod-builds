name: Build Village Guardians v0.18.15 Boss Identity

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger-v01815'

permissions:
  contents: write

env:
  PROJECT_DIR: projects/village-guardians
  BUILD_VERSION: 0.18.15-alpha.1
  EXPECTED_JAR: villageguardians-0.18.15-alpha.1.jar

jobs:
  build:
    name: Java 25 / NeoForge 26.2 boss identity acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false
      - name: Run deterministic contract tests
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            for test in \
              tools/test_rpg_balance.py \
              tools/test_village_zone.py \
              tools/test_progression_loop.py \
              tools/test_progression_depth.py \
              tools/test_fortress_layout.py \
              tools/test_runtime_safety.py \
              tools/test_ui_layout_contract.py \
              tools/test_action_layout.py \
              tools/test_enemy_content.py \
              tools/test_v0188_risk_ui_cleanup.py \
              tools/test_v0189_siege_phase2.py \
              tools/test_v01810_ranger_ricochet.py \
              tools/test_v01811_defense_polish.py \
              tools/test_v01812_quality_audit.py \
              tools/test_v01813_siege_integration.py \
              tools/test_v01814_persistent_presentation.py \
              tools/test_v01815_boss_identity.py; do
              if test -f "$test"; then
                echo "=== $test ==="
                python3 "$test"
              fi
            done
          } 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v01815-contracts.log"
      - name: Clean NeoForge build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache -Pmod_version="$BUILD_VERSION" clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v01815-gradle.log"
      - name: Verify runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables/"
          sha256sum "build/libs/$EXPECTED_JAR" > "$GITHUB_WORKSPACE/deliverables/$EXPECTED_JAR.sha256"
      - name: Upload verified JAR
        uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.18.15-alpha.1
          path: deliverables/
          if-no-files-found: error
          retention-days: 30
      - name: Record acceptance metadata
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          JAR_SHA="$(cut -d' ' -f1 "deliverables/$EXPECTED_JAR.sha256")"
          JAR_SIZE="$(stat -c%s "deliverables/$EXPECTED_JAR")"
          mkdir -p projects/village-guardians/.ci
          cat > projects/village-guardians/.ci/v01815-final.txt <<EOF
          version=$BUILD_VERSION
          run_id=$GITHUB_RUN_ID
          head_sha=$GITHUB_SHA
          jar_name=$EXPECTED_JAR
          jar_sha256=$JAR_SHA
          jar_size=$JAR_SIZE
          EOF
          rm -f projects/village-guardians/.ci/v01815-build-report.txt
          git add -A projects/village-guardians/.ci
          git commit -m 'ci(village): record v0.18.15 acceptance [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Record build failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p projects/village-guardians/.ci
          {
            echo "status=FAIL"
            echo "run_id=$GITHUB_RUN_ID"
            echo "head_sha=$GITHUB_SHA"
            echo "version=$BUILD_VERSION"
            echo
            echo "=== contract log tail ==="
            if test -f village-guardians-v01815-contracts.log; then tail -n 300 village-guardians-v01815-contracts.log; else echo "Contract log was not created."; fi
            echo
            echo "=== gradle log tail ==="
            if test -f village-guardians-v01815-gradle.log; then tail -n 360 village-guardians-v01815-gradle.log; else echo "Gradle log was not created; failure occurred before clean build."; fi
          } > projects/village-guardians/.ci/v01815-build-report.txt
          git add projects/village-guardians/.ci/v01815-build-report.txt
          git commit -m 'ci(village): record v0.18.15 build failure [skip ci]'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: villageguardians-v01815-build-logs
          path: |
            village-guardians-v01815-contracts.log
            village-guardians-v01815-gradle.log
          if-no-files-found: ignore
          retention-days: 7
