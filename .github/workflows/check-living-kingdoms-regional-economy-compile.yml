name: Check Living Kingdoms regional economy compile

on:
  push:
    branches: [codex/living-kingdoms-regional-economy-r1]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/check-living-kingdoms-regional-economy-compile.yml'

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - id: java25
        name: Java 25 clean build
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build --stacktrace --console=plain
      - name: Record compile result
        if: always()
        shell: bash
        env:
          OUTCOME: ${{ steps.java25.outcome }}
        run: |
          set -euo pipefail
          printf 'outcome=%s\nrun_id=%s\nhead=%s\n' "$OUTCOME" "$GITHUB_RUN_ID" "$GITHUB_SHA" > projects/living-kingdoms/.regional-economy-compile-result
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/.regional-economy-compile-result
          git commit -m "Record regional economy compile ${OUTCOME} [skip ci]" || true
          git push origin HEAD:codex/living-kingdoms-regional-economy-r1
          test "$OUTCOME" = success
