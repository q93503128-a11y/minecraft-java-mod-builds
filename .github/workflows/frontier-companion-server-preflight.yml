name: Frontier Companion Server Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/frontier-settlement/src/main/**'
      - 'projects/frontier-settlement/gradle.properties'
      - 'projects/frontier-settlement/COMPANION_LOCK.json'
      - 'projects/frontier-settlement/companion-testpack/install.py'
      - 'projects/frontier-settlement/companion-testpack/runtime-sources.json'
      - 'projects/frontier-settlement/companion-testpack/resolved-lock.client.json'
      - 'projects/frontier-settlement/companion-testpack/resolved-lock.server.json'
      - 'projects/frontier-settlement/tools/test_companion_testpack.py'
      - 'projects/frontier-settlement/tools/verify_jar.py'
      - '.github/workflows/frontier-companion-server-preflight.yml'

permissions:
  contents: write

concurrency:
  group: frontier-companion-server-preflight-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/frontier-settlement

jobs:
  preflight:
    name: NeoForge dedicated-server mod-loading preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Resolve Frontier runtime versions
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' "$PROJECT_DIR/gradle.properties")"
          neoforge="$(sed -n 's/^neo_version=//p' "$PROJECT_DIR/gradle.properties")"
          test -n "$version"
          test -n "$neoforge"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPECTED_JAR=frontier_settlement-$version.jar" >> "$GITHUB_ENV"
          echo "NEOFORGE_VERSION=$neoforge" >> "$GITHUB_ENV"

      - name: Verify Companion manifests
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          python3 tools/test_companion_testpack.py

      - name: Build and verify current Frontier
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          source_audit="$(find tools -maxdepth 1 -type f -name 'test_alpha*_source.py' -printf '%f\n' | sort -V | tail -1)"
          docs_audit="$(find tools -maxdepth 1 -type f -name 'test_alpha*_docs.py' -printf '%f\n' | sort -V | tail -1)"
          test -n "$source_audit"
          test -n "$docs_audit"
          python3 "tools/$source_audit"
          python3 "tools/$docs_audit"
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          unzip -p "build/libs/$EXPECTED_JAR" META-INF/neoforge.mods.toml | tee "$GITHUB_WORKSPACE/frontier-neoforge-metadata.txt"
          grep -F 'modId="frontier_settlement"' "$GITHUB_WORKSPACE/frontier-neoforge-metadata.txt"
          grep -F "version=\"$MOD_VERSION\"" "$GITHUB_WORKSPACE/frontier-neoforge-metadata.txt"

      - name: Assemble locked server mod payload
        run: |
          set -euo pipefail
          python3 "$PROJECT_DIR/companion-testpack/install.py" \
            --profile server \
            --output /tmp/frontier-companion-payload \
            --frontier-jar "$PROJECT_DIR/build/libs/$EXPECTED_JAR"
          test "$(find /tmp/frontier-companion-payload/mods -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 16

      - name: Install exact NeoForge dedicated server
        run: |
          set -euo pipefail
          installer="neoforge-${NEOFORGE_VERSION}-installer.jar"
          base="https://maven.neoforged.net/releases/net/neoforged/neoforge/${NEOFORGE_VERSION}"
          curl -fsSLo "$installer" "$base/$installer"
          curl -fsSLo "$installer.sha256" "$base/$installer.sha256"
          expected="$(tr -d '\r\n ' < "$installer.sha256")"
          actual="$(sha256sum "$installer" | awk '{print $1}')"
          test "$actual" = "$expected"
          mkdir -p /tmp/frontier-neoforge-server
          cp "$installer" /tmp/frontier-neoforge-server/
          cd /tmp/frontier-neoforge-server
          java -jar "$installer" --installServer
          test -f run.sh
          chmod +x run.sh
          mkdir -p mods
          cp /tmp/frontier-companion-payload/mods/*.jar mods/
          test "$(find mods -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 16

      - name: Run pre-EULA mod-loading smoke
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/frontier-neoforge-server
          set +e
          timeout 180s ./run.sh nogui > "$GITHUB_WORKSPACE/frontier-companion-server-preflight.log" 2>&1
          code=$?
          set -e
          cat "$GITHUB_WORKSPACE/frontier-companion-server-preflight.log"

          export PREFLIGHT_LOG="$GITHUB_WORKSPACE/frontier-companion-server-preflight.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['PREFLIGHT_LOG']).read_text(encoding='utf-8', errors='replace')
          markers = ('You need to agree to the EULA', 'agree to the EULA', 'eula.txt')
          positions = [log.lower().find(m.lower()) for m in markers]
          positions = [p for p in positions if p >= 0]
          if not positions:
              raise SystemExit('server did not reach the expected EULA gate')
          eula_at = min(positions)
          prefix = log[:eula_at]
          version = os.environ['MOD_VERSION']
          expected_frontier = f'Frontier Settlement {version} (frontier_settlement)'
          if expected_frontier not in prefix:
              raise SystemExit(f'Frontier was not discovered with the canonical {version} version')
          forbidden = (
              'ModLoadingException', 'NoClassDefFoundError', 'Mixin apply failed',
              'Encountered an unexpected exception', 'Exception in thread "main"',
              'is not a valid mod file', 'Loading errors encountered',
              'requires neoforge', 'requires sophisticatedcore', '[main/ERROR]',
              'FatalStartupException',
          )
          hits = [token for token in forbidden if token.lower() in prefix.lower()]
          if hits:
              raise SystemExit('pre-EULA mod-loading failure markers: ' + ', '.join(hits))
          print('Frontier companion dedicated-server pre-EULA mod-loading smoke: PASS')
          PY
          if test "$code" -eq 124; then
            echo 'Server did not exit at the expected first-run EULA gate before timeout.' >&2
            exit 1
          fi

      - name: Record successful expanded preflight
        shell: bash
        env:
          PREFLIGHT_RUN_ID: ${{ github.run_id }}
          PREFLIGHT_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          pack = Path('projects/frontier-settlement/companion-testpack')
          status_path = pack / 'runtime-status.json'
          client = json.loads((pack / 'resolved-lock.client.json').read_text(encoding='utf-8'))
          server = json.loads((pack / 'resolved-lock.server.json').read_text(encoding='utf-8'))
          status = json.loads(status_path.read_text(encoding='utf-8'))

          if not client.get('resolution', {}).get('verified') or len(client.get('files', [])) != 16:
              raise SystemExit('expanded client binary resolution is not verified at 16 entries')
          if not server.get('resolution', {}).get('verified') or len(server.get('files', [])) != 15:
              raise SystemExit('expanded server binary resolution is not verified at 15 entries')
          if client['resolution'].get('source_sha') != server['resolution'].get('source_sha'):
              raise SystemExit('client/server resolution source SHA mismatch')

          expanded = status.setdefault('expanded_candidate', {})
          expanded['variants_and_ventures_promoted'] = True
          expanded['required_client_entries_expected'] = 16
          expanded['required_server_entries_expected'] = 15
          expanded['server_payload_jars_including_frontier_expected'] = 16
          expanded['binary_resolution_verified'] = True
          expanded['binary_resolution_source_sha'] = client['resolution']['source_sha']
          expanded['dedicated_server_preflight_verified'] = True
          expanded['preflight_frontier_version'] = os.environ['MOD_VERSION']
          expanded['preflight_run_id'] = int(os.environ['PREFLIGHT_RUN_ID'])
          expanded['preflight_source_sha'] = os.environ['PREFLIGHT_SOURCE_SHA']
          expanded['server_payload_jars_including_frontier'] = 16
          expanded['conclusion'] = 'success'
          status['status'] = 'expanded_dedicated_server_pre_eula_pass'
          status_path.write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PROJECT_DIR/companion-testpack/runtime-status.json"
          git commit -m "Record Frontier expanded companion preflight ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-companion-server-preflight-log
          path: |
            frontier-companion-server-preflight.log
            frontier-neoforge-metadata.txt
          if-no-files-found: warn
          retention-days: 14
