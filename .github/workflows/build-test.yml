name: Build Test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/test/**'
      - '.github/workflows/build-test.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/test

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify toolchain
        run: |
          java -version
          gradle --version

      - name: Clean build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean build --stacktrace 2>&1 | tee build.log

      - name: Package raw logs
        if: always()
        run: |
          mkdir -p build
          zip -j build/raw-logs.zip build.log || true

      - name: Verify executable JAR
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          JAR="build/libs/test-0.2.0.jar"
          test -s "$JAR"
          python - <<'PY'
          import zipfile
          jar = 'build/libs/test-0.2.0.jar'
          with zipfile.ZipFile(jar) as z:
              names = z.namelist()
              assert 'fabric.mod.json' in names, 'fabric.mod.json missing'
              assert any(n.startswith('dev/moonseungjun/testmod/') and n.endswith('.class') for n in names), 'compiled classes missing'
              assert any(n.startswith('assets/moon_test/') for n in names), 'assets namespace missing'
              assert any(n.startswith('data/moon_test/') for n in names), 'data namespace missing'
              assert 'assets/moon_test/items/starfall_focus.json' in names, '26.3 client item definition missing'
              assert not any(n.endswith('.java') for n in names), 'source .java leaked into runtime JAR'
              assert len(names) == len(set(names)), 'duplicate ZIP entries found'
          PY
          sha256sum "$JAR" > "$JAR.sha256"
          SHA=$(cut -d' ' -f1 "$JAR.sha256")
          cat > BUILD_AND_RUNTIME_REPORT.md <<EOF
          # Test Build and Runtime Report

          - Commit: ${GITHUB_SHA}
          - Project: test 0.2.0
          - Minecraft: 26.3
          - Java: 25
          - Fabric Loader: 0.19.5
          - Fabric API: 0.162.0+26.3
          - Gradle: 9.6.0
          - Fabric Loom: 1.17.20
          - Clean build: PASS
          - JAR structure check: PASS
          - SHA-256: ${SHA}
          - Datagen: NOT RUN (not provided)
          - GameTest: NOT RUN (not provided)
          - Dedicated server smoke test: NOT RUN
          - Client smoke test: NOT RUN
          - PLAYTESTED: NO
          - MULTIPLAYER TESTED: NO
          EOF

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-0.2.0-logs
          path: projects/test/build/raw-logs.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Upload deliverables
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: test-0.2.0-deliverables
          path: |
            projects/test/build/libs/test-0.2.0.jar
            projects/test/build/libs/test-0.2.0.jar.sha256
            projects/test/BUILD_AND_RUNTIME_REPORT.md
          if-no-files-found: error
          retention-days: 30

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
