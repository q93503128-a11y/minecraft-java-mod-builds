name: Frontier Pack Export 20260905

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/frontier-pack-export-20260905.yml'

permissions:
  contents: write

jobs:
  build-export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build Frontier Settlement
        run: |
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew clean build --no-daemon
          test -f build/libs/frontier_settlement-0.1.0-alpha.102.jar
      - name: Build Survival Ascension
        run: |
          cd projects/survival-ascension
          chmod +x gradlew
          ./gradlew clean build --no-daemon
          test -f build/libs/survivalascension-0.61.9-alpha.1.jar
      - name: Verify and stage JARs
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, zipfile, shutil
          out=Path('export'); out.mkdir()
          jars=[Path('projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.102.jar'),Path('projects/survival-ascension/build/libs/survivalascension-0.61.9-alpha.1.jar')]
          for jar in jars:
              with zipfile.ZipFile(jar) as z:
                  names=z.namelist(); assert 'META-INF/neoforge.mods.toml' in names; assert len(names)==len(set(names))
              shutil.copy2(jar,out/jar.name)
              print(jar.name,hashlib.sha256(jar.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-two-mod-jars-20260905
          path: export/*.jar
          if-no-files-found: error
      - name: Remove temporary workflow
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm .github/workflows/frontier-pack-export-20260905.yml
          git commit -m 'Remove temporary mod JAR export workflow'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
