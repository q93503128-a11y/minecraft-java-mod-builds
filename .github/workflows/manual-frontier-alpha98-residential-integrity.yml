name: Manual Frontier Alpha98 Residential Integrity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-frontier-alpha98-residential-integrity.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply fix
        run: python3 .github/scripts/frontier_alpha98_fix.py
      - name: Validate source and JSON
        run: |
          git diff --check
          grep -q 'mod_version=0.1.0-alpha.98' projects/frontier-settlement/gradle.properties
          grep -q 'RUIN_INTACT_PERCENT = 45' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementBuildingIntegrityService.java
          grep -q 'removeCompletedBuilding' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementData.java
          grep -q 'SettlementBuildingIntegrityService::onServerTick' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/FrontierSettlement.java
          python3 - <<'PY'
          import json, pathlib
          fs=list(pathlib.Path('projects/frontier-settlement/src/main/resources').rglob('*.json'))
          for p in fs: json.loads(p.read_text(encoding='utf-8'))
          print('JSON_OK', len(fs))
          PY
      - name: Build
        working-directory: projects/frontier-settlement
        run: ./gradlew clean build --no-daemon
      - name: Verify jar
        run: |
          JAR=projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.98.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'SettlementBuildingIntegrityService.class'
          jar tf "$JAR" | grep -q 'SettlementConstructionService.class'
          test -z "$(zipinfo -1 "$JAR" | sort | uniq -d)"
          sha256sum "$JAR"
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha98-replacement
          path: projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.98.jar
          if-no-files-found: error
      - name: Commit main
        run: |
          rm -f .github/workflows/manual-frontier-alpha98-residential-integrity.yml
          rm -f .github/scripts/frontier_alpha98_fix.py
          git config user.name coworkaccount
          git config user.email cyp1jhh2@gmail.com
          git add projects/frontier-settlement/gradle.properties projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/FrontierSettlement.java projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementData.java projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementBuildingIntegrityService.java .github/workflows/manual-frontier-alpha98-residential-integrity.yml .github/scripts/frontier_alpha98_fix.py
          git commit -m 'Retire severely destroyed Frontier houses automatically'
          git push origin HEAD:main
