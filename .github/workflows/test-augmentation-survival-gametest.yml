name: Test Augmentation Survival GameTests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'augmentation-survival/gametest-runtime-gate-2026-10-27'
    paths:
      - 'projects/augmentation-survival/src/main/**'
      - 'projects/augmentation-survival/src/gametest/**'
      - 'projects/augmentation-survival/build.gradle'
      - 'projects/augmentation-survival/gradle.properties'
      - 'projects/augmentation-survival/gradle/**'
      - 'projects/augmentation-survival/gradlew'
      - 'projects/augmentation-survival/gradlew.bat'
      - '.github/workflows/test-augmentation-survival-gametest.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/augmentation-survival

jobs:
  gametest-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Verify toolchain
        run: |
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Run required Minecraft GameTests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports/gametest
          console='build/reports/gametest/gametest-console.log'
          set +e
          ./gradlew --no-daemon runGameTestServer --stacktrace 2>&1 | tee "$console"
          status=${PIPESTATUS[0]}
          set -e

          latest='build/reports/gametest/gametest-latest-combined.log'
          : > "$latest"
          while IFS= read -r log; do
            printf '\n===== %s =====\n' "$log" >> "$latest"
            cat "$log" >> "$latest"
          done < <(find . -path '*/logs/latest.log' -type f -print | sort)

          cat "$console" "$latest" > build/reports/gametest/gametest-verification.log

          if [[ $status -ne 0 ]]; then
            echo "runGameTestServer failed with exit code $status"
            exit "$status"
          fi

          if grep -Eqi 'Game test.*failed|Failed game tests|Crash report|Encountered an unexpected exception|Exception in server tick loop' \
              build/reports/gametest/gametest-verification.log; then
            echo 'GameTest failure marker found'
            exit 1
          fi

          if ! grep -Eq '[1-9][0-9]* tests are now running' build/reports/gametest/gametest-verification.log; then
            echo 'No positive marker proving that at least one GameTest actually ran'
            exit 1
          fi

          if ! grep -Eq 'All [1-9][0-9]* required tests passed' build/reports/gametest/gametest-verification.log; then
            echo 'No positive marker proving that all required GameTests passed'
            exit 1
          fi

          echo 'AUGMENTATION_SURVIVAL_GAMETEST_PASS'

      - name: Upload GameTest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: augmentation-survival-gametest-${{ github.run_number }}
          path: projects/augmentation-survival/build/reports/gametest/
          if-no-files-found: warn
