name: Temporary manual audit fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tmp-manual-audit-fix.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 - <<'PY'
          from pathlib import Path
          p=Path('projects/arcane-circle/tools/test_current_source.py')
          s=p.read_text(encoding='utf-8')
          old='''for token in ['"feather_fall"','"fly"','"simulacrum"','"clone"','persistentBuff']:\n    assert token in overhaul, token\n'''
          new='''for token in ['"feather_fall"','"fly"','"simulacrum"','"clone"']:\n    assert token in combined, token\n'''
          if old not in s: raise SystemExit('stale overhaul audit block not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          PY
          git rm -f .github/workflows/tmp-manual-audit-fix.yml
          git add projects/arcane-circle/tools/test_current_source.py
          git diff --check
          git commit -m 'test(arcane): audit maintained visuals through manual registry'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
