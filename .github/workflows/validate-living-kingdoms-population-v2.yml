name: Validate Living Kingdoms population v2
# execution revision 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-living-kingdoms-population-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      PROJECT_DIR: projects/living-kingdoms
      LIVING_KINGDOMS_CI_REALM_TEST: '1'
      LOG_FILE: ${{ github.workspace }}/urban-population-validation-v2/server.log
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build --stacktrace --console=plain
      - name: Fresh Erden household runtime test
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-population-v2-ci
          mkdir -p run "$(dirname "$LOG_FILE")"
          printf 'level-name=livingkingdoms-population-v2-ci\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > "$LOG_FILE" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          passed=0
          for attempt in $(seq 1 360); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' "$LOG_FILE"; then
              cat "$LOG_FILE"
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_POPULATION_DIAGNOSTIC_PASS households=77 residents=231 workers=154' "$LOG_FILE" \
              && grep -Fq 'LK_REALM_DIAGNOSTIC_PASS regions=1 residences=1' "$LOG_FILE"; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$LOG_FILE"
              exit 1
            fi
            sleep 1
          done
          cat "$LOG_FILE"
          test "$passed" -eq 1
          grep -F 'Prepared Erden household population households=77 residents=231 workers=154 dependents=77 owned_homes=77 assigned_workplaces=154 vacancies=2 shifts=early,late,night' "$LOG_FILE"
          grep -F 'Processed Erden household economy day=' "$LOG_FILE"
          grep -F 'LK_URBAN_LIFE_DIAGNOSTIC_PASS upper_floor=true stairs=true' "$LOG_FILE"
          grep -F 'LK_ERDEN_POPULATION_DIAGNOSTIC_PASS households=77 residents=231 workers=154 dependents=77 spawned_sample=3 ledger=true shortages=0 shifts=true ownership=true' "$LOG_FILE"
          grep -F 'LK_REALM_DIAGNOSTIC_PASS regions=1 residences=1' "$LOG_FILE"
          if grep -Eqi 'Invalid Erden population plan|No Erden workplace remains|Failed to spawn Erden resident|Initial Erden household economy has shortages|Exception loading level|watchdog' "$LOG_FILE"; then
            exit 1
          fi
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-population-v2-${{ github.run_number }}
          path: urban-population-validation-v2/server.log
          retention-days: 30
      - name: Publish validation pointer
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p .github/build-pointers
          printf '{\n  "run_id": "%s",\n  "run_number": "%s",\n  "commit_sha": "%s",\n  "job_status": "%s"\n}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$JOB_STATUS" \
            > .github/build-pointers/living-kingdoms-population-v2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/build-pointers/living-kingdoms-population-v2.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Erden population v2 validation $GITHUB_RUN_NUMBER"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
