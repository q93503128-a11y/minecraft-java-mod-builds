name: Cleanup Village Guardians v0.18.10 One-Shot Tooling

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.cleanup-trigger-v01810'

permissions:
  contents: write

jobs:
  cleanup:
    name: Remove one-shot v0.18.10 patch tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove temporary patch machinery
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/workflows/apply-village-guardians-v01810-source.yml \
            .github/workflows/apply-village-guardians-v01810-polish.yml \
            .github/workflows/finalize-village-guardians-v01810-docs.yml \
            .github/workflows/cleanup-village-guardians-v01810.yml \
            projects/village-guardians/tools/apply_v01810_ranger_patch.py \
            projects/village-guardians/tools/apply_v01810_ranger_damage_guard.py \
            projects/village-guardians/tools/apply_v01810_ranger_polish.py \
            projects/village-guardians/tools/finalize_v01810_docs.py \
            projects/village-guardians/.source-patch-trigger-v01810 \
            projects/village-guardians/.source-polish-trigger-v01810 \
            projects/village-guardians/.docs-finalize-trigger-v01810 \
            projects/village-guardians/.cleanup-trigger-v01810
          git diff --cached --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git commit -m "chore(village): remove v0.18.10 one-shot patch tooling"

      - name: Fast-forward main without overwriting concurrent work
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 2
          done
          echo "Failed to fast-forward main after retries" >&2
          exit 1
