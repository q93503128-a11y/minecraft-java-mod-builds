name: Manual Survival Bulk Durability Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-bulk-durability-fix.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply bulk durability fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension')

          helper = root / 'progress/AutomatedToolBreak.java'
          helper.write_text(
              "package kr.moonseungjun.survivalascension.progress;\n\n"
              "import net.minecraft.core.BlockPos;\n"
              "import net.minecraft.server.level.ServerPlayer;\n"
              "import net.minecraft.world.item.ItemStack;\n\n"
              "/**\n"
              " * Keeps normal block-break hooks/drops for skill-expanded work while preventing\n"
              " * every automatically expanded block from charging another durability point.\n"
              " * The original player break remains vanilla-authoritative and pays normal wear.\n"
              " */\n"
              "public final class AutomatedToolBreak {\n"
              "    private AutomatedToolBreak() {}\n\n"
              "    public static boolean destroyWithoutAdditionalWear(ServerPlayer player, BlockPos target) {\n"
              "        ItemStack tool = player.getMainHandItem();\n"
              "        if (player.isCreative() || tool.isEmpty() || !tool.isDamageableItem()) {\n"
              "            return player.gameMode.destroyBlock(target);\n"
              "        }\n"
              "        int damageBefore = tool.getDamageValue();\n"
              "        tool.setDamageValue(0);\n"
              "        try {\n"
              "            return player.gameMode.destroyBlock(target);\n"
              "        } finally {\n"
              "            ItemStack held = player.getMainHandItem();\n"
              "            if (!held.isEmpty() && held.getItem() == tool.getItem() && held.isDamageableItem()) {\n"
              "                held.setDamageValue(damageBefore);\n"
              "            }\n"
              "        }\n"
              "    }\n"
              "}\n",
              encoding='utf-8'
          )

          mining = root / 'mining/MiningProgression.java'
          s = mining.read_text(encoding='utf-8')
          if s.count('player.gameMode.destroyBlock(') != 4:
              raise SystemExit('MiningProgression destroyBlock anchor drift')
          s = s.replace('player.gameMode.destroyBlock(', 'AutomatedToolBreak.destroyWithoutAdditionalWear(player, ')
          mining.write_text(s, encoding='utf-8')

          bore = root / 'mining/BoreMiningService.java'
          s = bore.read_text(encoding='utf-8')
          import_anchor = 'import kr.moonseungjun.survivalascension.progress.SkillProgressData;'
          if import_anchor not in s:
              raise SystemExit('Bore import anchor missing')
          s = s.replace(import_anchor, 'import kr.moonseungjun.survivalascension.progress.AutomatedToolBreak;\n' + import_anchor, 1)
          if s.count('player.gameMode.destroyBlock(target)') != 1:
              raise SystemExit('Bore destroyBlock anchor drift')
          s = s.replace('player.gameMode.destroyBlock(target)', 'AutomatedToolBreak.destroyWithoutAdditionalWear(player, target)', 1)
          bore.write_text(s, encoding='utf-8')

          wood = root / 'woodcutting/WoodcuttingProgression.java'
          s = wood.read_text(encoding='utf-8')
          if s.count('player.gameMode.destroyBlock(target)') != 1:
              raise SystemExit('Woodcutting destroyBlock anchor drift')
          s = s.replace('player.gameMode.destroyBlock(target)', 'AutomatedToolBreak.destroyWithoutAdditionalWear(player, target)', 1)
          wood.write_text(s, encoding='utf-8')

          mining_s = mining.read_text(encoding='utf-8')
          bore_s = bore.read_text(encoding='utf-8')
          wood_s = wood.read_text(encoding='utf-8')
          helper_s = helper.read_text(encoding='utf-8')
          assert mining_s.count('AutomatedToolBreak.destroyWithoutAdditionalWear') == 4
          assert bore_s.count('AutomatedToolBreak.destroyWithoutAdditionalWear') == 1
          assert wood_s.count('AutomatedToolBreak.destroyWithoutAdditionalWear') == 1
          assert 'setDamageValue(0)' in helper_s and 'setDamageValue(damageBefore)' in helper_s
          assert 'player.gameMode.destroyBlock(' not in mining_s + bore_s + wood_s
          print('BULK DURABILITY SOURCE ASSERTIONS PASS')
          PY
          git diff --check

      - name: Java 25 clean build
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/survival-ascension/tools/verify_jar.py projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar

      - name: Commit validated fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add \
            projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/progress/AutomatedToolBreak.java \
            projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/mining/MiningProgression.java \
            projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/mining/BoreMiningService.java \
            projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/woodcutting/WoodcuttingProgression.java
          git commit -m 'Stop bulk skills from shredding tool durability'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload fixed JAR
        uses: actions/upload-artifact@v4
        with:
          name: survival-061-bulk-durability-fix
          path: projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          if-no-files-found: error
