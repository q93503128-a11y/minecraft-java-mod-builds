name: TITANBREAK B04 Regnant CI

on:
  push:
    branches: [ main ]
    paths:
      - 'projects/titanbreak/**'
      - '.github/workflows/titanbreak-b04-regnant-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regnant-b04:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical B04 implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          project = Path('projects/titanbreak')
          root = project / 'src/main'
          java = root / 'java/kr/moonseungjun/titanbreak'
          assets = root / 'resources/assets/titanbreak'
          entity = (java / 'entity/RegnantFleshEntity.java').read_text(encoding='utf-8')
          registry = (java / 'registry/ModBossEntities.java').read_text(encoding='utf-8')
          reward = (java / 'combat/RegnantRewardService.java').read_text(encoding='utf-8')
          encounter = (java / 'world/RegnantEncounterService.java').read_text(encoding='utf-8')
          bastion_encounter = (java / 'world/BastionEncounterService.java').read_text(encoding='utf-8')
          renderers = (java / 'client/TitanEntityRenderers.java').read_text(encoding='utf-8')
          renderer = (java / 'client/RegnantFleshRenderer.java').read_text(encoding='utf-8')
          asset_registry = (project / 'ASSET_REGISTRY.md').read_text(encoding='utf-8')
          gradle = (project / 'gradle.properties').read_text(encoding='utf-8')

          version = re.search(r'mod_version=0\.1\.0-alpha\.(\d+)', gradle)
          assert version and int(version.group(1)) >= 45, 'B04 requires alpha.45 or newer'
          assert 'CANONICAL_VISIBLE_MAX_HEALTH = 13_000.0D' in entity
          assert re.search(r'int temporalRating\(\)\s*\{\s*return 25;', entity), 'TR25 missing'
          for token in (
              'PART_REGEN_0','PART_REGEN_1','PART_REGEN_2','PART_REGEN_3',
              'PART_CIRC_0','PART_CIRC_1','PART_BRAIN',
              'PART_LIMB_LEFT_ARM','PART_LIMB_RIGHT_ARM','PART_LIMB_LEFT_LEG','PART_LIMB_RIGHT_LEG',
              'P2_LOCKS_REQUIRED = 4','P3_BURST_TICKS = 240','CORE_SHIFT_INTERVAL = 90',
              'startBurstWindow()','failBurstWindow()','weakpoint_analysis_eye',
              'scheduleFleshSpear(','raiseTissueWall(','cultureMinions(','shedBody('
          ):
              assert token in entity, token

          assert 'REGNANT_FLESH' in registry
          assert 'CombatScale.toInternal(RegnantFleshEntity.CANONICAL_VISIBLE_MAX_HEALTH)' in registry
          assert 'REGNANT_REGENERATION_CORE.get(), 1' in reward
          assert 'REGENERATIVE_TISSUE.get(), 5 + victim.getRandom().nextInt(4)' in reward
          assert 'CIRCULATION_CORE.get(), 2 + victim.getRandom().nextInt(2)' in reward
          assert 'NANO_MEDIUM.get(), 1' in reward
          assert 'recordBossFirstKill(player, "regnant_flesh", FIRST_KILL_RD, 3)' in reward
          assert 'hasBossFirstKill("bastion_walker")' in encounter
          assert 'hasBossFirstKill("regnant_flesh")' in encounter
          assert 'ModBossEntities.REGNANT_FLESH.get()' in encounter
          assert 'RegnantEncounterService.tick(player, progression)' in bastion_encounter
          assert 'ModBossEntities.REGNANT_FLESH.get(), RegnantFleshRenderer::new' in renderers
          assert 'withScale(30.0F)' in renderer

          geo = assets / 'geckolib/models/entity/regnant_flesh.geo.json'
          anim = assets / 'geckolib/animations/entity/regnant_flesh.animation.json'
          texture = assets / 'textures/entity/regnant_flesh.png'
          for path in (geo, anim, texture): assert path.is_file(), path
          geo_data = json.loads(geo.read_text(encoding='utf-8'))
          bones = geo_data['minecraft:geometry'][0]['bones']
          bone_names = {bone['name'] for bone in bones}
          for bone in ('brain','brain_shell','circ_0','circ_1','regen_core_0','regen_core_1','regen_core_2','regen_core_3','tissue_wall'):
              assert bone in bone_names, bone
          animations = json.loads(anim.read_text(encoding='utf-8')).get('animations', {})
          for key in ('misc.idle','move.walk','attack.swing'): assert key in animations, key

          overlay = root / 'resources/assets/titanbreak_boss/lang'
          for lang in ('en_us','ko_kr'):
              data = json.loads((overlay / f'{lang}.json').read_text(encoding='utf-8'))
              for key in ('entity.titanbreak.regnant_flesh','message.titanbreak.regnant_warning',
                          'message.titanbreak.regnant_arrival','message.titanbreak.regnant_defeated',
                          'message.titanbreak.regnant_active_core','message.titanbreak.regnant_burst_window'):
                  assert key in data, (lang,key)
          assert '| The Regnant Flesh model / animation / texture |' in asset_registry
          PY
