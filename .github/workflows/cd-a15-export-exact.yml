name: Build exact Countryside Days alpha.15 JAR

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-export-exact.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}

      - name: Restore exact alpha.15 source
        id: restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,io,zipfile
          r=Path('.').resolve(); p=r/'projects/countryside-days'; t=p/'tools'
          specs=[
          ('alpha15v2_00.part',8000,'05764a738c93db7933e60f6db85fea2d6cf168297536e79146ef28dc1eb96349'),
          ('alpha15v2_01.part',8000,'f62307daf23ace1c04c1c4b09fdf75e3ba2a24018c550a90558753f00fc6f8b6'),
          ('alpha15v2_02.part',8000,'647cf040b1669045f8e57f2a0eb67968e81c1753621095be6d3f4be046e00beb'),
          ('alpha15exact_03.part',8000,'785f1b3d3b25d4482cbac7a7e11eb98436b76882d22935ce0071cfcb369dbcaf'),
          ('alpha15exact_04.part',8000,'aa843460fb86c04dfff90515fae28237f213dce4dc43fcf6ceb7a5c7480e5a44'),
          ('alpha15v2_05_06.part',16000,'ba4d245f3e29c0710e903a25c7fc2ada8cd306675bf373b8e001c22d88f931e9'),
          ('alpha15v2_07_08.part',16000,'17528aa349b2a47a0192ddf71506d270487439261742b3212e8b3407e6846c3d'),
          ('alpha15v2_09_10.part',16000,'a975b3c098d730d4077d8729118537ebd9c7f96aebd4455c8cb1f8dc1ed270c2'),
          ('alpha15exact_11.part',8000,'8991340273b26d6601fc54df80adfb83e54b88d58a93bc02b017a3f0d104d5a1'),
          ('alpha15exact_12.part',8000,'bf10be8d174e92ff42def406331ae70837c1a6f85901bdd4a1a6386f0d386bc1'),
          ('alpha15v2_13_14.part',16000,'a1dd5c64d5d0524d691a228af3d07c35195a1ec76046947d647d9f080b256f05'),
          ('alpha15v2_15_16.part',16000,'0b84bdbbb7d5a93b360911a75c608961515cea999960e8027746ef296619418f'),
          ('alpha15v2_17_18.part',9648,'870c0a5b8faed07c9597402175e58b7659ed41ead761cb3a82f45f9bab6477d6')]
          a=[]
          for n,l,h in specs:
            s=''.join((t/n).read_text('ascii').split()); actual=hashlib.sha256(s.encode()).hexdigest()
            if len(s)!=l or actual!=h: raise SystemExit(f'bad {n} {len(s)} {actual}')
            a.append(s)
          s=''.join(a)
          if len(s)!=145648 or hashlib.sha256(s.encode()).hexdigest()!='2215f32a4fda34d490241a811051e9164eb39a4f31831894e9ce3df3361ec4ca': raise SystemExit('bad combined payload')
          b=base64.b64decode(s,validate=True)
          if len(b)!=109234 or hashlib.sha256(b).hexdigest()!='5499bb9fe956c9bf11a6f311105e03bcc694bc2adeed74080431cd882d80b835': raise SystemExit('bad archive')
          with zipfile.ZipFile(io.BytesIO(b)) as z:
            if z.testzip(): raise SystemExit('bad zip member')
            z.extractall(r)
          if 'mod_version=0.1.0-alpha.15' not in (p/'gradle.properties').read_text(): raise SystemExit('wrong version')
          print('exact alpha.15 source restored')
          PY

      - name: Apply compile fixes
        id: patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip,struct
          root=Path('projects/countryside-days')
          p=root/'src/main/java/kr/countrysidedays/gameplay/VillageLifeManager.java'; s=p.read_text()
          old='        if (!(event.getEntity() instanceof ServerPlayer player)) return;\n        if (!(event.getLevel() instanceof ServerLevel level)) return;\n'
          new='        ServerPlayer player = event.getEntity();\n        if (!(event.getLevel() instanceof ServerLevel level)) return;\n'
          if old in s:s=s.replace(old,new)
          elif new not in s:raise SystemExit('VillageLifeManager target missing')
          p.write_text(s)
          oldloop='        for (ItemEntity item : new ArrayList<>(level.getEntities().getAll().stream()\n                .filter(ItemEntity.class::isInstance)\n                .map(ItemEntity.class::cast)\n                .toList())) {\n'
          targets=[('src/main/java/kr/countrysidedays/world/StarterHomesteadGenerator.java','origin.offset(PlayerEstateLayout.MIN_X - 4, -2, PlayerEstateLayout.MIN_Z - 4)','origin.offset(PlayerEstateLayout.MAX_X + 5, 12, PlayerEstateLayout.MAX_Z + 5)'),('src/main/java/kr/countrysidedays/world/PublicVillageExpansionBuilder.java','origin.offset(-MAP_HALF_WIDTH - 4, -2, -MAP_HALF_DEPTH - 4)','origin.offset(MAP_HALF_WIDTH + 5, 14, MAP_HALF_DEPTH + 5)')]
          for rel,lo,hi in targets:
            p=root/rel;s=p.read_text()
            if 'import net.minecraft.world.phys.AABB;' not in s:
              lines=s.splitlines(True);i=max(i for i,x in enumerate(lines) if x.startswith('import net.minecraft.world.level.block.state'));lines.insert(i+1,'import net.minecraft.world.phys.AABB;\n');s=''.join(lines)
            newloop=f'        AABB bounds = new AABB(\n                {lo},\n                {hi}\n        );\n        for (ItemEntity item : new ArrayList<>(level.getEntitiesOfClass(ItemEntity.class, bounds))) {{\n'
            if oldloop in s:s=s.replace(oldloop,newloop)
            elif newloop not in s:raise SystemExit('debris target missing '+rel)
            p.write_text(s)
          p=root/'src/main/resources/data/countrysidedays/worldgen/biome/rural_plains.json';p.write_text(p.read_text().replace('minecraft:trees_birch_and_oak_leaf_litter','minecraft:trees_birch_and_oak'))
          def u(v):b=v.encode();return struct.pack('>H',len(b))+b
          def tag(t,n,x):return bytes([t])+u(n)+x
          def lst(t,x):return bytes([t])+struct.pack('>i',len(x))+b''.join(x)
          def comp(x):return b''.join(x)+b'\0'
          pal=comp([tag(8,'Name',u('minecraft:air'))]);body=comp([tag(3,'DataVersion',struct.pack('>i',0)),tag(9,'size',lst(3,[struct.pack('>i',1)]*3)),tag(9,'palette',lst(10,[pal])),tag(9,'blocks',lst(10,[])),tag(9,'entities',lst(10,[]))]);raw=bytes([10])+u('')+body
          out=root/'src/main/resources/data/countrysidedays/structure';out.mkdir(parents=True,exist_ok=True)
          for n in ('homestead_layout.nbt','world_data_round_trip.nbt'):
            with (out/n).open('wb') as f:
              with gzip.GzipFile(filename='',mode='wb',fileobj=f,mtime=0) as g:g.write(raw)
          PY

      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '25'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.2.1'}

      - name: Build and verify
        id: compile
        working-directory: projects/countryside-days
        run: |
          if [ ! -x ./gradlew ];then gradle wrapper --gradle-version 9.2.1 --distribution-type bin;chmod +x gradlew;fi
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee /tmp/cd-build.log
          J=build/libs/countrysidedays-0.1.0-alpha.15.jar
          test -s "$J";python3 tools/verify_jar.py "$J";unzip -t "$J"

      - name: Publish encoded JAR
        id: publish
        run: |
          J=projects/countryside-days/build/libs/countrysidedays-0.1.0-alpha.15.jar
          D=release-transfer/countryside-days-alpha15;rm -rf "$D";mkdir -p "$D"
          base64 -w0 "$J" >/tmp/cd.jar.b64;split -b 50000 -d -a 2 /tmp/cd.jar.b64 "$D/part-"
          printf 'filename=countrysidedays-0.1.0-alpha.15.jar\nsize=%s\nsha256=%s\nbase64_size=%s\nparts=%s\nrun=%s\n' "$(stat -c%s "$J")" "$(sha256sum "$J"|cut -d' ' -f1)" "$(stat -c%s /tmp/cd.jar.b64)" "$(find "$D" -name 'part-*'|wc -l)" "$GITHUB_RUN_ID" >"$D/MANIFEST.txt"
          git restore --source=HEAD --staged --worktree projects/countryside-days
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$D";git commit -m 'Publish verified Countryside Days alpha.15 JAR transfer';git pull --rebase origin main;git push origin HEAD:main

      - name: Record result
        if: always()
        env:
          R: ${{ steps.restore.outcome }}
          P: ${{ steps.patch.outcome }}
          C: ${{ steps.compile.outcome }}
          X: ${{ steps.publish.outcome }}
        run: |
          git restore --source=HEAD --staged --worktree projects/countryside-days || true
          D=release-transfer/countryside-days-alpha15-status;mkdir -p "$D";F="$D/exact-${GITHUB_RUN_ID}.txt"
          printf 'run=%s\nrestore=%s\npatch=%s\ncompile=%s\npublish=%s\n' "$GITHUB_RUN_ID" "$R" "$P" "$C" "$X" >"$F"
          [ ! -f /tmp/cd-build.log ] || { echo '--- build tail ---' >>"$F";tail -n 100 /tmp/cd-build.log >>"$F"; }
          git config user.name github-actions[bot];git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$F";git commit -m "Record exact Countryside Days alpha.15 build ${GITHUB_RUN_ID}";git pull --rebase origin main;git push origin HEAD:main
