name: Fix Starter Depot Migration Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-starter-depot-migration-gate.yml'
      - 'tools/fix_starter_depot_migration_gate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gate one-way legacy public-barrel migration
        run: python3 tools/fix_starter_depot_migration_gate.py

      - name: Frontier Alpha.91 canonical audits
        working-directory: projects/frontier-settlement
        run: |
          python3 tools/test_alpha91_docs.py
          python3 tools/test_alpha91_source.py

      - name: Build and verify Frontier
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.91.jar

      - name: Build Survival regression
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Commit validated migration gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementStorageService.java \
                  tools/apply_starter_shared_supply_depot.py \
                  tools/fix_starter_depot_migration_gate.py
          if git diff --cached --quiet; then
            echo 'No migration-gate source changes to commit.'
            exit 0
          fi
          git commit -m 'Prevent repeated legacy barrel depot conversion'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
