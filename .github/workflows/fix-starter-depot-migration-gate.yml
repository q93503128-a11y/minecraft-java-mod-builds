name: Fix Starter Depot Migration Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-starter-depot-migration-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Gate one-way legacy public-barrel migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementStorageService.java')
          s = source.read_text(encoding='utf-8')
          old = '''    public static void ensureManagedStorage(ServerLevel level, SettlementData data) {
        upgradeLegacyPublicBarrels(level, data);
        ensureStarterSupplyDepot(level, data.stockpilePos());
'''
          new = '''    public static void ensureManagedStorage(ServerLevel level, SettlementData data) {
        // One-way compatibility gate: only a world whose authoritative saved stockpile is still a
        // vanilla barrel can be an Alpha.91 public-barrel save. New settlements start with the
        // dedicated depot, so placing a cheap barrel near it can never mint a free shared depot.
        BlockPos stockpile = data.stockpilePos();
        boolean legacyPublicStorage = level.hasChunkAt(stockpile) && level.getBlockState(stockpile).is(Blocks.BARREL);
        if (legacyPublicStorage) upgradeLegacyPublicBarrels(level, data);
        ensureStarterSupplyDepot(level, stockpile);
'''
          if s.count(old) != 1:
              raise SystemExit(f'runtime migration anchor count={s.count(old)}')
          source.write_text(s.replace(old, new, 1), encoding='utf-8')

          tool = Path('tools/apply_starter_shared_supply_depot.py')
          t = tool.read_text(encoding='utf-8')
          old_tool = '''    public static void ensureManagedStorage(ServerLevel level, SettlementData data) {
        upgradeLegacyPublicBarrels(level, data);
        ensureStarterSupplyDepot(level, data.stockpilePos());
'''
          new_tool = '''    public static void ensureManagedStorage(ServerLevel level, SettlementData data) {
        // One-way compatibility gate: only a world whose authoritative saved stockpile is still a
        // vanilla barrel can be an Alpha.91 public-barrel save. New settlements start with the
        // dedicated depot, so placing a cheap barrel near it can never mint a free shared depot.
        BlockPos stockpile = data.stockpilePos();
        boolean legacyPublicStorage = level.hasChunkAt(stockpile) && level.getBlockState(stockpile).is(Blocks.BARREL);
        if (legacyPublicStorage) upgradeLegacyPublicBarrels(level, data);
        ensureStarterSupplyDepot(level, stockpile);
'''
          if t.count(old_tool) != 1:
              raise SystemExit(f'generator migration anchor count={t.count(old_tool)}')
          tool.write_text(t.replace(old_tool, new_tool, 1), encoding='utf-8')

          out = source.read_text(encoding='utf-8')
          assert 'boolean legacyPublicStorage' in out
          assert 'if (legacyPublicStorage) upgradeLegacyPublicBarrels(level, data);' in out
          print('ONE-WAY STARTER DEPOT MIGRATION GATE PASS')
          PY

      - name: Frontier Alpha.91 canonical audits
        working-directory: projects/frontier-settlement
        run: |
          python3 tools/test_alpha91_docs.py
          python3 tools/test_alpha91_source.py

      - name: Build and verify Frontier
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.91.jar

      - name: Build Survival regression
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Commit validated migration gate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementStorageService.java tools/apply_starter_shared_supply_depot.py
          git commit -m 'Prevent repeated legacy barrel depot conversion'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
