name: Apply Frontier Alpha84 Runtime Audit Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha84-runtime-audit-fixes.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha84-runtime-audit-fixes
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Apply runtime audit fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/frontier-settlement')
          settlement = root / 'src/main/java/kr/moonseungjun/frontiersettlement/settlement'
          construction = settlement / 'SettlementConstructionService.java'
          context = settlement / 'SettlementContextService.java'
          audit = root / 'tools/test_alpha84_source.py'
          note = root / 'WORKER_RUNTIME_ALPHA84.md'

          s = construction.read_text(encoding='utf-8')

          old_start = '''        FrontierWorkerEntity builder = ensureBuilder(level, data);\n        if (builder != null) builder.setInvulnerable(true);\n        SettlementService.broadcast(server, data);\n'''
          new_start = '''        FrontierWorkerEntity builder = ensureBuilder(level, data);\n        if (builder == null) {\n            data.clearConstruction();\n            SettlementService.broadcast(server, data);\n            return new StartResult(false, "건설 작업자를 안전하게 확보할 수 없어 착공하지 않았습니다. 주변 마을·공동 창고 청크를 로드한 뒤 다시 시도해 주세요. 자원은 차감되지 않았습니다.");\n        }\n        builder.setInvulnerable(true);\n        SettlementService.broadcast(server, data);\n'''
          if s.count(old_start) != 1:
              raise SystemExit('builder start rollback anchor mismatch')
          s = s.replace(old_start, new_start, 1)

          old_history = '''        for (BuildingRecord building : data.buildings()) {\n            minX = Math.min(minX, building.originX()); minY = Math.min(minY, building.originY()); minZ = Math.min(minZ, building.originZ());\n            maxX = Math.max(maxX, building.originX() + building.rotatedWidth());\n            maxY = Math.max(maxY, building.originY() + building.buildingType().clearHeight() + 1);\n            maxZ = Math.max(maxZ, building.originZ() + building.rotatedDepth());\n        }\n        for (RoadSegment road : data.roads()) for (BlockPos pos : road.centers()) {\n            minX = Math.min(minX, pos.getX()); minY = Math.min(minY, pos.getY()); minZ = Math.min(minZ, pos.getZ());\n            maxX = Math.max(maxX, pos.getX() + 1); maxY = Math.max(maxY, pos.getY() + 1); maxZ = Math.max(maxZ, pos.getZ() + 1);\n        }\n        for (OutpostRecord outpost : data.outposts()) {\n            BlockPos pos = outpost.center();\n            minX = Math.min(minX, pos.getX() - 6); minY = Math.min(minY, pos.getY() - 8); minZ = Math.min(minZ, pos.getZ() - 6);\n            maxX = Math.max(maxX, pos.getX() + 7); maxY = Math.max(maxY, pos.getY() + 17); maxZ = Math.max(maxZ, pos.getZ() + 7);\n        }\n'''
          replacement = '''        // Completed historical infrastructure is not a legal builder location. Including every old\n        // building/road/outpost here made an unrelated distant unloaded chunk block builder recovery.\n        // The builder is authoritative only at the town/storage envelope or the currently active project.\n'''
          if s.count(old_history) != 1:
              raise SystemExit('historical builder envelope anchor mismatch')
          s = s.replace(old_history, replacement, 1)

          total_anchor = '''    public static int totalSteps(BuildingType type, BlockPos origin) {\n'''
          grading_method = '''    public static int gradingSteps(ServerLevel level, ConstructionState construction, BuildingType type) {\n        if (construction == null || !construction.active() || type == null) return 0;\n        return createGradePlan(level, construction, type).size();\n    }\n\n'''
          if s.count(total_anchor) != 1:
              raise SystemExit('grading steps API anchor mismatch')
          s = s.replace(total_anchor, grading_method + total_anchor, 1)
          construction.write_text(s, encoding='utf-8')

          s = context.read_text(encoding='utf-8')
          old_progress = '''                int total = SettlementConstructionService.totalSteps(type, construction.origin());\n                int worked = construction.grading() ? 0 : Math.max(0, construction.buildStep());\n                projectProgress = percent(worked, total);\n'''
          new_progress = '''                int buildTotal = SettlementConstructionService.totalSteps(type, construction.origin(), construction.rotation());\n                int gradeTotal = SettlementConstructionService.gradingSteps(level, construction, type);\n                int worked = construction.grading()\n                        ? Math.min(gradeTotal, Math.max(0, construction.gradeStep()))\n                        : gradeTotal + Math.max(0, construction.buildStep());\n                projectProgress = percent(worked, gradeTotal + buildTotal);\n'''
          if s.count(old_progress) != 1:
              raise SystemExit('construction progress anchor mismatch')
          context.write_text(s.replace(old_progress, new_progress, 1), encoding='utf-8')

          s = audit.read_text(encoding='utf-8')
          marker = 'print("Frontier Settlement alpha.23-84 cumulative source audit: PASS")'
          checks = '''\n# Alpha.84 graphical-playtest follow-up: no silent start, no historical loaded-chunk dependency,\n# and grading must report real progress instead of a hard-coded zero.\nconstruction_now = text(JAVA / "settlement/SettlementConstructionService.java")\ncontext_now = text(JAVA / "settlement/SettlementContextService.java")\nmust(construction_now, (\n    "if (builder == null)",\n    "data.clearConstruction();",\n    "자원은 차감되지 않았습니다.",\n    "Completed historical infrastructure is not a legal builder location",\n    "public static int gradingSteps",\n), "alpha.84 construction recovery")\nroute_body = construction_now.split("private static AABB builderRouteBounds", 1)[1].split("private static boolean builderAssignmentEvidenceLoaded", 1)[0]\nforbid(route_body, ("for (BuildingRecord building : data.buildings())", "for (RoadSegment road : data.roads())", "for (OutpostRecord outpost : data.outposts())"), "alpha.84 historical builder envelope")\nmust(context_now, ("gradeTotal", "construction.gradeStep()", "gradeTotal + buildTotal"), "alpha.84 real grading progress")\nforbid(context_now, ("construction.grading() ? 0",), "alpha.84 hard-coded grading zero")\n\n'''
          if s.count(marker) != 1:
              raise SystemExit('alpha.84 audit terminal marker mismatch')
          s = s.replace(marker, checks + marker, 1)
          audit.write_text(s, encoding='utf-8')

          n = note.read_text(encoding='utf-8')
          extra = '''\n## Graphical playtest follow-up audit\n\nThe same pass also fixes three adjacent failure modes: a project now rolls back instead of silently\nstarting when no authoritative builder can be secured; builder absence proof ignores completed remote\ninfrastructure and covers only town/storage plus the active project; and HUD/Jade progress includes\ngrading cells instead of reporting a hard-coded 0% until grading ends.\n'''
          if '## Graphical playtest follow-up audit' not in n:
              note.write_text(n.rstrip() + '\n' + extra, encoding='utf-8')
          PY
      - name: Audit Alpha.84
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          python3 tools/test_alpha84_source.py
          python3 tools/test_alpha84_docs.py
          git diff --check
      - name: Java 25 clean build
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
      - name: Commit verified audit fixes atomically
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-frontier-alpha84-runtime-audit-fixes.yml
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden Frontier alpha.84 construction recovery and progress'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
