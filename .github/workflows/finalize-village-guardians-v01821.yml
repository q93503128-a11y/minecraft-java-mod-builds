name: Finalize Village Guardians v0.18.21 Docs

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'Village Guardians v0.18.21 docs finalize'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical documentation update
        run: python3 projects/village-guardians/tools/finalize_v01821_docs.py
      - name: Verify accepted runtime metadata is unchanged
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'version=0.18.21-alpha.1' projects/village-guardians/.ci/v01821-final.txt
          grep -Fx 'run_id=32332392760' projects/village-guardians/.ci/v01821-final.txt
          grep -Fx 'head_sha=cb5268807406a982bc39e038cdbf5b59526e0f8c' projects/village-guardians/.ci/v01821-final.txt
          grep -Fx 'jar_sha256=f39d02ef247387a669991cc6cc4dfb2c67a6f6949134fd4c1db0f720cfa5ab7e' projects/village-guardians/.ci/v01821-final.txt
          grep -Fx 'jar_size=971022' projects/village-guardians/.ci/v01821-final.txt
          git diff --check
      - name: Remove temporary integration/finalizer files and commit docs
        shell: bash
        run: |
          set -euo pipefail
          rm -f projects/village-guardians/tools/finalize_v01821_docs.py
          rm -f projects/village-guardians/.build-trigger-v01821
          rm -f projects/village-guardians/.ci/v01821-integration-running.txt projects/village-guardians/.ci/v01821-integration-failure.txt
          rm -f .github/workflows/apply-village-guardians-v01821.yml
          rm -f .github/workflows/finalize-village-guardians-v01821.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/village-guardians .github/workflows
          git diff --cached --check
          git commit -m 'docs(village): finalize v0.18.21 raid lifecycle'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
