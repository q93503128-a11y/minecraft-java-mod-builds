# integration trigger 2
name: Fix Living Kingdoms authored road heights

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix-lk-authored-road-heights.py'
      - '.github/workflows/fix-lk-authored-road-heights.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python .github/scripts/fix-lk-authored-road-heights.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalStreamingBuilder.java
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanInfrastructureBuilder.java
          git add .github/workflows projects/living-kingdoms/docs
          git commit -m "Anchor Erden roads and culverts to authored terrain"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/fix-lk-authored-road-heights.py
            git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalStreamingBuilder.java
            git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanInfrastructureBuilder.java
            git add .github/workflows projects/living-kingdoms/docs
            git commit -m "Anchor Erden roads and culverts to authored terrain"
            sleep $((attempt * 2))
          done
          exit 1
