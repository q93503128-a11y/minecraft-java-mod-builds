name: Fix Living Kingdoms castle-house crop semantics
# Second push intentionally triggers this workflow after it already exists on default branch.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-living-kingdoms-castle-house-crop-semantics.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Align retained doorway semantics with retained source edge
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalUrbanFabricBuilder.java')
          s = p.read_text(encoding='utf-8')

          old = '''        SourceTemplate source = template(CASTLE_HOUSE);\n        List<BuildingBlock> doors = findEntranceBlocks(source.blocks, source.width, source.length);\n        int bestReachable = 0;\n'''
          new = '''        SourceTemplate source = template(CASTLE_HOUSE);\n        List<BuildingBlock> doors = findEntranceBlocks(source.blocks, source.width, source.length);\n        int currentReachable = source.fragments.isEmpty()\n                ? 0 : fragmentReachableCells(source.fragments.getFirst());\n        int bestReachable = 0;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'audit header count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''                FacadeFragment fragment = cropFragment(\n                        source.blocks, door, side, source.width, source.height, source.length);\n                if (!containsRealEntrance(fragment)) continue;\n                int reachable = fragmentReachableCells(fragment);\n'''
          new = '''                FacadeFragment fragment = withExteriorSide(\n                        cropFragment(source.blocks, door, side,\n                                source.width, source.height, source.length),\n                        side);\n                if (!containsRealEntrance(fragment)) continue;\n                int reachable = fragmentReachableCells(fragment);\n'''
          if s.count(old) != 1:
              raise SystemExit(f'audit candidate count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''                "LK_ERDEN_CROP_WINDOW_AUDIT resource={} candidates={} current_reachable=11 best_reachable={} best_side={} best_door={},{} same_footprint=true source_only=true world_reads=false mutations=0",\n                CASTLE_HOUSE, candidates, bestReachable, bestSide, bestDoorX, bestDoorZ);\n'''
          new = '''                "LK_ERDEN_CROP_WINDOW_AUDIT resource={} candidates={} current_reachable={} best_reachable={} best_side={} best_door={},{} same_footprint=true source_only=true world_reads=false mutations=0",\n                CASTLE_HOUSE, candidates, currentReachable, bestReachable, bestSide, bestDoorX, bestDoorZ);\n'''
          if s.count(old) != 1:
              raise SystemExit(f'audit log count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''                    FacadeFragment candidate = cropFragment(\n                            sourceBlocks, entrance, cropSide, width, height, length);\n                    if (candidate.blocks.size() < 500 || !containsRealEntrance(candidate)) continue;\n                    int reachable = fragmentReachableCells(candidate);\n'''
          new = '''                    // The crop edge is the preserved source exterior. Using the longer\n                    // supported run from the door as an "exterior" signal inverted this castle's\n                    // semantics because the long run is the authored interior. Preserve the real\n                    // source edge and evaluate only the inward half of the retained footprint.\n                    FacadeFragment candidate = withExteriorSide(\n                            cropFragment(sourceBlocks, entrance, cropSide, width, height, length),\n                            cropSide);\n                    if (candidate.blocks.size() < 500 || !containsRealEntrance(candidate)) continue;\n                    int reachable = fragmentReachableCells(candidate);\n'''
          if s.count(old) != 1:
              raise SystemExit(f'selection candidate count={s.count(old)}')
          s = s.replace(old, new, 1)

          old = '''                int nx=current.x()+d[0], nz=current.z()+d[1];\n                if (nx<0 || nx>=fragment.width || nz<0 || nz>=fragment.length) continue;\n                int ny=sourceWalkableFeetY(blocks,nx,nz,current.y());\n'''
          new = '''                int nx=current.x()+d[0], nz=current.z()+d[1];\n                if (nx<0 || nx>=fragment.width || nz<0 || nz>=fragment.length) continue;\n                if (!fragmentInteriorSide(fragment, nx, nz)) continue;\n                int ny=sourceWalkableFeetY(blocks,nx,nz,current.y());\n'''
          if s.count(old) != 1:
              raise SystemExit(f'BFS neighbor count={s.count(old)}')
          s = s.replace(old, new, 1)

          anchor = '''    private static long walkKey(int x, int y, int z) {\n        return ((long)(x & 0xffff) << 48) ^ ((long)(y & 0xffff) << 32) ^ (z & 0xffffffffL);\n    }\n'''
          insert = '''    private static boolean fragmentInteriorSide(FacadeFragment fragment, int x, int z) {\n        return switch (fragment.exteriorSide) {\n            case NORTH -> z >= fragment.entranceZ;\n            case SOUTH -> z <= fragment.entranceZ;\n            case WEST -> x >= fragment.entranceX;\n            case EAST -> x <= fragment.entranceX;\n        };\n    }\n\n    private static FacadeFragment withExteriorSide(\n            FacadeFragment fragment, FrontSide exteriorSide) {\n        if (fragment.exteriorSide == exteriorSide) return fragment;\n        return new FacadeFragment(\n                fragment.width, fragment.height, fragment.length,\n                fragment.blocks, fragment.entranceX, fragment.entranceZ, exteriorSide);\n    }\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'walkKey anchor count={s.count(anchor)}')
          s = s.replace(anchor, insert + anchor, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F 'withExteriorSide(' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalUrbanFabricBuilder.java
          grep -F 'fragmentInteriorSide(fragment, nx, nz)' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalUrbanFabricBuilder.java

      - name: Java 25 clean compile
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Verify corrected source topology on fresh server startup
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-crop-semantics-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-crop-semantics-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/castle-house-crop-semantics.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          passed=0
          for attempt in $(seq 1 180); do
            if grep -Fq 'LK_ERDEN_FRAGMENT_TOPOLOGY' ../../logs/castle-house-crop-semantics.log \
              && grep -F 'fantasy_castle_house.schem#0' ../../logs/castle-house-crop-semantics.log | grep -Fq 'classification=AUTHORED_GROUND_ONLY' \
              && grep -Fq 'LK_ERDEN_GROUND_VOID_SURVEY placements=77' ../../logs/castle-house-crop-semantics.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/castle-house-crop-semantics.log
              exit 1
            fi
            sleep 1
          done
          cat ../../logs/castle-house-crop-semantics.log
          test "$passed" -eq 1
          grep -F 'LK_ERDEN_CASTLE_HOUSE_CROP_SELECTED' ../../logs/castle-house-crop-semantics.log | grep -F 'crop_side=NORTH' | grep -F 'resolved_side=NORTH'
          grep -F 'LK_ERDEN_FRAGMENT_TOPOLOGY' ../../logs/castle-house-crop-semantics.log | grep -F 'fantasy_castle_house.schem#0' | grep -F 'classification=AUTHORED_GROUND_ONLY'
          grep -F 'LK_ERDEN_GROUND_VOID_SURVEY placements=77' ../../logs/castle-house-crop-semantics.log | grep -F 'usable_placements=77'
          grep -F 'LK_ERDEN_CROP_WINDOW_AUDIT' ../../logs/castle-house-crop-semantics.log | grep -F 'current_reachable=' | grep -v 'current_reachable=11'

      - name: Commit verified crop semantics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ExternalUrbanFabricBuilder.java
          git rm .github/workflows/fix-living-kingdoms-castle-house-crop-semantics.yml
          git commit -m 'fix(living-kingdoms): restore castle-house authored interiors'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
