name: Publish Riftfrontier Hunter Alien Review Asset

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-riftfrontier-hunter-alien-review.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch exact creator source
        run: |
          python -m pip install --disable-pip-version-check gdown==5.2.0
          mkdir -p /tmp/riftfrontier-alien
          gdown 'https://drive.google.com/uc?id=1rWF4Jo_G7-odDa5LfkQ0e2d9_p9pxb3W' -O /tmp/riftfrontier-alien/Alien.gltf
          echo 'e6fec42f9d4db3c3177da9027c5cdb2c4abd71cb934ea4f4788aea155f267124  /tmp/riftfrontier-alien/Alien.gltf' | sha256sum -c -
      - name: Extract exact embedded source texture
        run: |
          python - <<'PY'
          import base64, hashlib, json, pathlib
          source = pathlib.Path('/tmp/riftfrontier-alien/Alien.gltf')
          doc = json.loads(source.read_text(encoding='utf-8'))
          uri = doc['buffers'][0]['uri']
          raw = base64.b64decode(uri.split(',', 1)[1])
          view = doc['bufferViews'][doc['images'][0]['bufferView']]
          start = view.get('byteOffset', 0)
          image = raw[start:start + view['byteLength']]
          expected = 'd43b07f5473c0a05459241d3b843f5de1d3a6351b9791399d8ee0f1a3b88ff0f'
          actual = hashlib.sha256(image).hexdigest()
          if actual != expected: raise SystemExit(f'embedded texture SHA mismatch: {actual}')
          if not image.startswith(b'\x89PNG\r\n\x1a\n'): raise SystemExit('embedded image is not PNG')
          out = pathlib.Path('projects/riftfrontier/src/main/resources/assets/riftfrontier/textures/entity/region_01/alien_source_v1.png')
          out.parent.mkdir(parents=True, exist_ok=True); out.write_bytes(image)
          target = pathlib.Path('projects/riftfrontier/src/main/resources/assets/riftfrontier/hunter_presentation/region_01/alien.source.gltf')
          target.parent.mkdir(parents=True, exist_ok=True); target.write_bytes(source.read_bytes())
          PY
      - name: Publish review-only runtime resources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/riftfrontier/src/main/resources/assets/riftfrontier/hunter_presentation/region_01/alien.source.gltf
          git add projects/riftfrontier/src/main/resources/assets/riftfrontier/textures/entity/region_01/alien_source_v1.png
          if git diff --cached --quiet; then echo 'Exact review resources already published.'; exit 0; fi
          git commit -m 'riftfrontier: publish Hunter Alien field-review assets'
          git push origin HEAD:main
