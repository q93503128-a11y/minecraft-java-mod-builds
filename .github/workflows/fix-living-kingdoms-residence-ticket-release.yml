name: Fix Living Kingdoms residence ticket release

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_residence_ticket_release.py'
      - '.github/workflows/fix-living-kingdoms-residence-ticket-release.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add residence completion ticket gate
        run: python .github/scripts/fix_living_kingdoms_residence_ticket_release.py
      - name: Commit Java fix
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorResidenceSavedData.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorTicketReaper.java
          git diff --cached --quiet && exit 0
          git commit -m 'Retain exterior chunks until residences finish building'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot repair; remove after Java changes land. Triggered explicitly.
