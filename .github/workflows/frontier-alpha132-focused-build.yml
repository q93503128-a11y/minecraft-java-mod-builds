name: Frontier Alpha.132 Focused Clean Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha132-focused-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Sync latest main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
      - name: Verify Alpha.132 source and docs
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^mod_version=//p' gradle.properties)" = "0.1.0-alpha.132"
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          git diff --check -- .
      - name: Java 25 clean build
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean build --stacktrace --console=plain
      - name: Verify runtime JAR
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          jar='build/libs/frontier_settlement-0.1.0-alpha.132.jar'
          test -s "$jar"
          actual="$(sha256sum "$jar" | awk '{print $1}')"
          mkdir -p build/deliverables
          cp "$jar" build/deliverables/
          printf '%s  %s\n' "$actual" "$(basename "$jar")" > build/deliverables/frontier_settlement-0.1.0-alpha.132.jar.sha256
          printf 'version=0.1.0-alpha.132\nsha256=%s\nsource_sha=%s\n' "$actual" "$(git rev-parse HEAD)" > build/deliverables/BUILD_INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-0.1.0-alpha.132-focused-deliverables
          path: projects/frontier-settlement/build/deliverables/
          if-no-files-found: error
          retention-days: 30
