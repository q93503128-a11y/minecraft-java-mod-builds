name: Frontier Alpha110 Parallel Crews 20260905

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/apply_frontier_alpha110_parallel_crews_tmp.py'
      - '.github/workflows/frontier-alpha110-parallel-crews-20260905.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply Alpha110 patch
        run: python3 tools/apply_frontier_alpha110_parallel_crews_tmp.py

      - name: Verify current source and lock
        run: |
          python3 projects/frontier-settlement/tools/test_current_source.py
          python3 -m json.tool projects/frontier-settlement/COMPANION_LOCK.json >/dev/null

      - name: Java 25 clean build
        run: |
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew clean build --no-daemon

      - name: Verify runtime JAR
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          jar = Path('projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.110.jar')
          assert jar.exists(), jar
          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              assert 'META-INF/MANIFEST.MF' in names
              for suffix in (
                  'SettlementProjectAuthority.class',
                  'SettlementConstructionService.class',
                  'SettlementRoadService.class',
                  'SettlementOutpostService.class',
              ):
                  assert any(n.endswith(suffix) for n in names), suffix
          print(jar, jar.stat().st_size)
          PY

      - name: Commit canonical source and remove temporary files
        run: |
          rm -f tools/apply_frontier_alpha110_parallel_crews_tmp.py
          rm -f .github/workflows/frontier-alpha110-parallel-crews-20260905.yml
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add -A
          git commit -m 'Scale Frontier construction crews and parallel lanes'

      - name: Rebase and reverify current main
        run: |
          git pull --rebase origin main
          python3 projects/frontier-settlement/tools/test_current_source.py
          python3 -m json.tool projects/frontier-settlement/COMPANION_LOCK.json >/dev/null
          cd projects/frontier-settlement
          ./gradlew clean build --no-daemon

      - name: Stage artifact
        run: |
          mkdir -p stage
          cp projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.110.jar stage/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-0.1.0-alpha.110-tested
          path: stage/frontier_settlement-0.1.0-alpha.110.jar
          if-no-files-found: error

      - name: Push main
        run: git push origin HEAD:main
