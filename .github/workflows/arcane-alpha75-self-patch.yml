name: Arcane alpha.75 self patch

on:
  push:
    paths:
      - '.github/arcane-alpha75-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply integrated progression audit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          applied=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python3 .github/arcane-alpha75-patch.py
            rm -f .github/arcane-alpha75-patch.py .github/arcane-alpha75-trigger.txt .github/workflows/arcane-alpha75-self-patch.yml
            git add -A
            git diff --check
            git commit -m 'Arcane alpha.75 integrated progression audit [skip ci]'
            if git push origin HEAD:main; then applied=1; break; fi
            sleep $((attempt * 2))
          done
          test "$applied" -eq 1
