name: Audit Living Kingdoms exterior lifecycle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-exterior-lifecycle.yml'

concurrency:
  group: living-kingdoms-exterior-lifecycle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Prove lifecycle authority and save compatibility
        shell: bash
        run: |
          set -euo pipefail
          manager="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleManager.java"
          saved="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorLifecycleSavedData.java"
          marriage="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorMarriageManager.java"
          marriage_saved="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorMarriageSavedData.java"
          workforce="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorWorkforceManager.java"
          main="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java"
          edits="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/IncrementalWorldEditPlan.java"
          exterior="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenKingdomExteriorBuilder.java"
          residence="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorResidenceBuilder.java"
          catalog="$PROJECT_DIR/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorResidenceCatalog.java"

          grep -F 'ErdenExteriorLifecycleManager.onServerTick(event);' "$main"
          grep -F 'ErdenExteriorLifecycleManager.markDeadIfLifecycleResident(level, villager);' "$main"
          grep -F 'ErdenExteriorLifecycleManager.handleInteraction(event);' "$main"
          grep -F 'erden_exterior_lifecycle' "$saved"
          grep -F 'public static final int DAYS_PER_YEAR = 112;' "$manager"
          grep -F 'public static final int ADULT_AGE = 18;' "$manager"
          grep -F 'public static final int RETIREMENT_AGE = 58;' "$manager"
          grep -F 'line.lastBirthYear() != Integer.MIN_VALUE' "$manager"
          grep -F 'productionPercent() < 65' "$manager"
          grep -F 'processSuccession' "$manager"
          grep -F 'fillVacancies' "$manager"
          grep -F 'projectFutureLifecycle' "$manager"
          grep -F 'ci_projection_non_persistent=true' "$manager"
          grep -F 'public static boolean controlsRoutine(' "$manager"
          grep -F 'movePersonHousehold(String personId, String newHouseholdId)' "$saved"
          grep -F 'ErdenExteriorMarriageManager.parentPair(' "$manager"
          grep -F 'public static final int MARRIAGE_REVISION = 1' "$marriage"
          grep -F 'REMARRIAGE_WAIT_YEARS = 1' "$marriage"
          grep -F 'founder_workplaces_preserved=true' "$marriage"
          grep -F 'spouse_based_births=true' "$marriage"
          grep -F 'erden_exterior_marriages' "$marriage_saved"
          grep -F 'event.isCanceled()' "$workforce"
          grep -F 'ErdenExteriorLifecycleManager.controlsRoutine(' "$workforce"
          grep -F 'ErdenExteriorLifecycleManager.foundingWorkerAvailable(' "$workforce"
          test "$(grep -c 'additionalLabor(level, node.id, node.role, day)' "$workforce")" -eq 1
          grep -F 'EXTERIOR_REVISION = 2' "$exterior"
          grep -F 'EXPECTED_CI_ANCHORS = 178' "$exterior"
          grep -F 'RESIDENCE_REVISION = 2' "$residence"
          grep -F 'HAMLET_DISTANCE = 96' "$catalog"
          grep -F 'removeBlockEntity(pos)' "$edits"
          ! grep -R 'importWarehouseStock' "$PROJECT_DIR/src/main/java"

      - name: Java 25 compile
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p ../../logs
          gradle --no-daemon clean classes --stacktrace --console=plain \
            2>&1 | tee ../../logs/exterior-lifecycle-compile.log

      - name: Fresh world lifecycle, workforce and supply audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-exterior-lifecycle-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-exterior-lifecycle-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/exterior-lifecycle-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 2700); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/exterior-lifecycle-server.log; then
              cat ../../logs/exterior-lifecycle-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_EXTERIOR_LIFECYCLE_PASS revision=1 founders=216 households=74' ../../logs/exterior-lifecycle-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_MARRIAGE_PASS revision=1 founding_unions=68 expected_founders=68' ../../logs/exterior-lifecycle-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_WORKFORCE_PASS revision=1 nodes=18 households=74 residents=216 workers=142' ../../logs/exterior-lifecycle-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_TICKETS_PASS revision=1 anchors=178 released=178 explicit_release=true persistent_forced_chunks=false' ../../logs/exterior-lifecycle-server.log \
              && grep -Fq 'LK_ERDEN_KINGDOM_EXTERIOR_PASS revision=2 nodes=18 producers=15 wharves=3' ../../logs/exterior-lifecycle-server.log \
              && grep -Fq 'LK_ERDEN_KINGDOM_SUPPLY_PASS revision=1 nodes=18 producers=15 wharves=3 resources=6 opening_convoys=18' ../../logs/exterior-lifecycle-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/exterior-lifecycle-server.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/exterior-lifecycle-server.log
          test "$passed" -eq 1
          grep -F 'Prepared Erden exterior lifecycle revision=1 founders=216 households=74 year_days=112 adult_age=18 retirement_age=58 births_economy_gated=true succession=true save_overlay=true' ../../logs/exterior-lifecycle-server.log
          grep -F 'Prepared Erden exterior marriages revision=1 founding_unions=68 active=68 persistent=true remarriage=true spouse_household_relocation=true founder_workplaces_preserved=true spouse_based_births=true' ../../logs/exterior-lifecycle-server.log
          grep -F 'LK_ERDEN_EXTERIOR_MARRIAGE_PASS revision=1 founding_unions=68 expected_founders=68 persistent_unions=true death_closes_union=true remarriage_wait_years=1 nonfounder_household_moves=true founder_workplaces_preserved=true household_capacity=5 spouse_based_births=true' ../../logs/exterior-lifecycle-server.log
          grep -E 'LK_ERDEN_EXTERIOR_LIFECYCLE_PASS .*future_adults=[1-9][0-9]* .*scheduled_retirements=[1-9][0-9]* .*succession_households=[1-9][0-9]* .*parent_ready_households=[1-9][0-9]*' ../../logs/exterior-lifecycle-server.log
          grep -F 'year_days=112 adulthood=18 retirement=58 births=true inheritance=true replacement_labor=true permanent_deaths=true save_overlay=true' ../../logs/exterior-lifecycle-server.log
          grep -E 'projected_births=[1-9][0-9]* projected_successions=[1-9][0-9]* projected_replacement_workers=[1-9][0-9]* projected_years=20 ci_projection_non_persistent=true' ../../logs/exterior-lifecycle-server.log
          grep -F 'storage_yards_observed=18 resident_sample_observed=true validation_revision=4' ../../logs/exterior-lifecycle-server.log
          grep -F 'request_queue=178' ../../logs/exterior-lifecycle-server.log
          grep -F 'workforce_linked=true staffed_production=true wharf_labor=true' ../../logs/exterior-lifecycle-server.log
          grep -F 'fixed_daily_imports=false' ../../logs/exterior-lifecycle-server.log
          grep -F 'shipment_escrow=true' ../../logs/exterior-lifecycle-server.log

          if grep -Eqi 'watchdog|A single server tick took|Invalid block entity|Failed to create block entity|Invalid Erden exterior residence|Invalid Erden exterior lifecycle|Duplicate Erden lifecycle|Missing Erden lifecycle projection person|Invalid Erden exterior CI anchor count|Invalid Erden exterior ticket anchor count|Exception loading level|EventBusSubscriber.*failed' ../../logs/exterior-lifecycle-server.log; then
            exit 1
          fi

      - name: Upload lifecycle audit logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-exterior-lifecycle-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Record lifecycle audit pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            mkdir -p .github/build-pointers
            cat > .github/build-pointers/living-kingdoms-exterior-lifecycle.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID"
          }
          EOF
            git add .github/build-pointers/living-kingdoms-exterior-lifecycle.json
            git commit -m "Record Living Kingdoms exterior lifecycle audit $GITHUB_RUN_NUMBER" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
