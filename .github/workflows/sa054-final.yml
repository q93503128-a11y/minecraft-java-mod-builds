name: Survival Ascension 0.54 final runner

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.issue.title == '[SA054 FINAL INTERNAL]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply source
        run: python3 .github/sa054_runner.py
      - name: Cleanup temporary files
        run: rm -f .github/sa054_runner.py .github/workflows/sa054-apply.yml .github/workflows/sa054-push.yml .github/workflows/sa054-push2.yml .github/workflows/sa054-push3.yml .github/workflows/sa054-final.yml .sa054-run .sa054-run2 .sa054-run5
      - name: Audit source
        working-directory: projects/survival-ascension
        run: python3 tools/test_release_source.py && python3 tools/test_release_content_pack.py && python3 -m py_compile tools/build_mrpack.py tools/test_current_source.py tools/test_content_pack_source.py tools/test_release_source.py tools/test_release_content_pack.py tools/verify_jar.py tools/verify_release_jar.py
      - name: Build
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain
      - name: Verify package
        working-directory: projects/survival-ascension
        run: python3 tools/verify_release_jar.py build/libs/survivalascension-0.54.0-alpha.1.jar && python3 tools/build_mrpack.py --survival-jar build/libs/survivalascension-0.54.0-alpha.1.jar --output /tmp/Survival-Ascension-0.54.0-alpha.1-content-preview.mrpack && sha256sum build/libs/survivalascension-0.54.0-alpha.1.jar && sha256sum /tmp/Survival-Ascension-0.54.0-alpha.1-content-preview.mrpack
      - name: Commit
        run: git config user.name github-actions[bot] && git config user.email 41898282+github-actions[bot]@users.noreply.github.com && git add -A projects/survival-ascension .github/sa054_runner.py .github/workflows/sa054-apply.yml .github/workflows/sa054-push.yml .github/workflows/sa054-push2.yml .github/workflows/sa054-push3.yml .github/workflows/sa054-final.yml .sa054-run .sa054-run2 .sa054-run5 && git commit -m 'Survival Ascension 0.54 mace impact ascension' && git fetch origin main && git rebase origin/main && git push origin HEAD:main
