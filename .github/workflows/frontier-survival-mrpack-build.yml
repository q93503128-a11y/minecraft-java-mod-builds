name: Frontier Survival MRPACK Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-survival-mrpack-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build Frontier Settlement
        shell: bash
        run: |
          cd projects/frontier-settlement
          ./gradlew clean build --no-daemon
      - name: Build Survival Ascension
        shell: bash
        run: |
          cd projects/survival-ascension
          ./gradlew clean build --no-daemon
      - name: Stage mrpack jars
        shell: bash
        run: |
          mkdir -p mrpack-jars
          cp projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.91.jar mrpack-jars/
          cp projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar mrpack-jars/
          sha256sum mrpack-jars/*.jar > mrpack-jars/SHA256SUMS.txt
      - name: Upload mrpack jars
        uses: actions/upload-artifact@v4
        with:
          name: frontier-survival-mrpack-jars
          path: mrpack-jars/
          if-no-files-found: error
