name: Finalize Frontier Survival 20260907

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-frontier-survival-20260907.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Synchronize release metadata and validators
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          frontier = root / 'projects/frontier-settlement'
          survival = root / 'projects/survival-ascension'

          def props(path):
              out = {}
              for raw in path.read_text(encoding='utf-8').splitlines():
                  line = raw.strip()
                  if line and not line.startswith('#') and '=' in line:
                      k, v = line.split('=', 1)
                      out[k.strip()] = v.strip()
              return out

          frontier_version = props(frontier / 'gradle.properties')['mod_version']

          lock_path = frontier / 'COMPANION_LOCK.json'
          lock = json.loads(lock_path.read_text(encoding='utf-8'))
          lock['generated_at'] = '2026-09-07'
          lock['target']['frontier_settlement'] = frontier_version
          lock_path.write_text(json.dumps(lock, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          for name in ('resolved-lock.client.json', 'resolved-lock.server.json'):
              path = frontier / 'companion-testpack' / name
              data = json.loads(path.read_text(encoding='utf-8'))
              data['target']['frontier_settlement'] = frontier_version
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          verifier = survival / 'tools/verify_release_jar_pre_korean.py'
          text = verifier.read_text(encoding='utf-8')
          start = text.index('    expected_prefix_counts = {')
          end = text.index('    expected_tbos = {', start)
          replacement = '''    canonical_tbos_path = ROOT / "src/main/resources/assets/tbos/lang/ko_kr.json"\n    canonical_tbos = json.loads(canonical_tbos_path.read_text(encoding="utf-8"))\n    if tbos != canonical_tbos:\n        raise SystemExit("0.59.1 packaged TBS Korean localization drifted from committed canonical source")\n    minimum_prefix_counts = {\n        "itemGroup.": 1,\n        "block.": 118,\n        "item.": 21,\n        "entity.": 27,\n        "pickup.": 6,\n        "boss.": 7,\n    }\n    for prefix, minimum in minimum_prefix_counts.items():\n        actual = sum(1 for key in tbos if key.startswith(prefix))\n        if actual < minimum:\n            raise SystemExit(f"0.59.1 TBS Korean {prefix} key coverage regressed: {actual} < {minimum}")\n'''
          verifier.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          print(f'Frontier companion metadata synchronized to {frontier_version}')
          print('Survival TBS release verification now follows committed canonical localization exactly')
          PY

          rm -f .github/workflows/patch-frontier-companion-lock-20260907.yml
          rm -f .github/workflows/finalize-frontier-survival-20260907.yml

          (cd projects/frontier-settlement && python3 tools/test_companion_testpack.py)
          python3 -m py_compile projects/survival-ascension/tools/verify_release_jar_pre_korean.py
          git diff --check

      - name: Commit finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/frontier-settlement projects/survival-ascension .github/workflows
          git commit -m 'Finalize Frontier and Survival release metadata'
          git pull --rebase origin main
          (cd projects/frontier-settlement && python3 tools/test_companion_testpack.py)
          python3 -m py_compile projects/survival-ascension/tools/verify_release_jar_pre_korean.py
          git diff --check
          git push origin HEAD:main
