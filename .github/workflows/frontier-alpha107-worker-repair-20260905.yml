name: Frontier Alpha107 Worker Repair 20260905

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha107-worker-repair-20260905.yml'

permissions:
  contents: write

jobs:
  patch-build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply Alpha107 patch
        run: python3 tools/apply_frontier_alpha107_worker_repair_tmp.py
      - name: Verify current source and JSON
        run: |
          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          files=list(Path('src/main/resources').rglob('*.json'))
          for p in files: json.loads(p.read_text(encoding='utf-8'))
          print('FRONTIER JSON PASS', len(files))
          PY
      - name: Java 25 clean build
        run: |
          cd projects/frontier-settlement
          chmod +x gradlew
          ./gradlew --no-daemon clean build
      - name: Verify runtime JAR
        run: |
          python3 - <<'PY'
          import pathlib, zipfile
          folder=pathlib.Path('projects/frontier-settlement/build/libs')
          jars=[p for p in folder.glob('*.jar') if 'sources' not in p.name and 'javadoc' not in p.name]
          assert len(jars)==1, jars
          jar=jars[0]
          assert '0.1.0-alpha.107' in jar.name, jar
          with zipfile.ZipFile(jar) as z:
              names=z.namelist()
              assert len(names)==len(set(names))
              assert any(n.endswith('SettlementWorkerService.class') for n in names)
              assert any(n.endswith('SettlementBuildingIntegrityService.class') for n in names)
              assert 'META-INF/neoforge.mods.toml' in names
          print('JAR PASS', jar)
          PY
      - name: Commit canonical source and remove temporary files
        run: |
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm -f .github/workflows/frontier-alpha107-worker-repair-20260905.yml tools/apply_frontier_alpha107_worker_repair_tmp.py
          git add projects/frontier-settlement
          git commit -m 'Fix Frontier production handoff and auto-repair houses'
      - name: Rebase and reverify current main
        run: |
          git fetch origin main
          git rebase origin/main
          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          ./gradlew --no-daemon build
      - name: Stage artifact
        run: |
          mkdir -p dist
          cp projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.107.jar dist/
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-0.1.0-alpha.107-tested
          path: dist/*.jar
          if-no-files-found: error
      - name: Push main
        run: git push origin HEAD:main
