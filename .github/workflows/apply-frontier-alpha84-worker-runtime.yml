name: Apply Frontier Alpha84 Worker Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha84-worker-runtime.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha84-worker-runtime
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Apply Alpha.84 worker runtime patch
        run: python3 .github/scripts/frontier-alpha84-worker-runtime-apply.py
      - name: Audit transformed worker authority
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          python3 tools/test_alpha84_source.py
          python3 tools/test_alpha84_docs.py
          echo 'Remaining vanilla Villager references:'
          grep -RIn --include='*.java' 'world.entity.npc.villager.Villager\|EntityTypes.VILLAGER' src/main/java || true
          git diff --check
      - name: Java 25 clean build
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
      - name: Commit verified Alpha.84 runtime atomically
        run: |
          set -euo pipefail
          rm -f .github/scripts/frontier-alpha84-worker-runtime-apply.py
          rm -f .github/workflows/apply-frontier-alpha84-worker-runtime.yml
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Replace Frontier villager worker runtime in alpha.84'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
