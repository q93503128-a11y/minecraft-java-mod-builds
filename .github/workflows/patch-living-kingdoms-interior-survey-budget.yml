name: Patch Living Kingdoms interior survey budget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-living-kingdoms-interior-survey-budget.yml'
      - '.github/scripts/patch_living_kingdoms_interior_survey_budget.py'

concurrency:
  group: patch-living-kingdoms-interior-survey-budget
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  patch-compile-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Bound per-tick world reads
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_living_kingdoms_interior_survey_budget.py
          git diff --check
          survey=projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorSurvey.java
          grep -F 'SURVEY_REVISION = 3' "$survey"
          grep -F 'sourceAuthoredBlockCount(placement.fragmentKey())' "$survey"
          ! grep -Fq 'for (int y = minimumY; y <= maximumY; y++)' "$survey"

      - name: Java 25 clean compile
        working-directory: projects/living-kingdoms
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Commit verified survey patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanAuthoredInteriorSurvey.java
          git commit -m 'perf(living-kingdoms): bound authored interior survey reads'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
