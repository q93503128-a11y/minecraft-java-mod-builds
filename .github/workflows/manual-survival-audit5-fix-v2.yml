name: Manual Survival Audit 5 Fix V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-audit5-fix-v2.yml'

permissions:
  contents: write

jobs:
  audit-fix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply shutdown interruption compensation fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/survival_audit5_fix.py
          python3 - <<'PY'
          from pathlib import Path

          p = Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/production/EncounterInterruptionData.java')
          s = p.read_text(encoding='utf-8')
          marker = 'import net.minecraft.server.MinecraftServer;\n'
          assert marker in s
          s = s.replace(marker, marker + 'import net.minecraft.server.level.ServerLevel;\n', 1)
          old = '        if (event.getEntity() instanceof ServerPlayer player) get(player.getServer()).claim(player);\n'
          new = '        if (event.getEntity() instanceof ServerPlayer player) get(((ServerLevel) player.level()).getServer()).claim(player);\n'
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Keep a defense alive for the existing owner-grace window on ordinary disconnect.
          # This makes integrated Save & Quit deterministic: the subsequent ServerStoppingEvent
          # still sees the paid defense and can queue compensation, while a dedicated-server
          # disconnect simply times out as a normal failed defense with no refund.
          p = Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/production/OutpostSiegeSystem.java')
          s = p.read_text(encoding='utf-8')
          old = '''    public static void onPlayerLoggedOut(PlayerEvent.PlayerLoggedOutEvent event) {
        Siege siege = ACTIVE.remove(event.getEntity().getUUID());
        if (siege != null) {
            // Normal disconnects remain a failed defense. During an actual server shutdown the
            // stopping event normally queues this first; this fallback covers alternate shutdown order.
            if (!siege.level.getServer().isRunning()) {
                EncounterInterruptionData.get(siege.level.getServer()).queueSiege(
                        siege.owner, siege.mode == SiegeMode.BASTION);
            }
            cleanupMobs(siege);
            closeBossBar(siege);
        }
    }
'''
          new = '''    public static void onPlayerLoggedOut(PlayerEvent.PlayerLoggedOutEvent event) {
        Siege siege = ACTIVE.get(event.getEntity().getUUID());
        if (siege != null && event.getEntity() instanceof ServerPlayer player) {
            siege.bossBar.removePlayer(player);
        }
    }
'''
          assert old in s
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('SURVIVAL_AUDIT5_MAPPING_AND_LOGOUT_FIX_APPLIED')
          PY

      - name: Encounter interruption contract audit
        shell: bash
        run: |
          set -euo pipefail
          P=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/production/EncounterInterruptionData.java
          S=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/SurvivalAscension.java
          A=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/apex/ApexHuntSystem.java
          T=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/endgame/AscensionTrialSystem.java
          O=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/production/OutpostSiegeSystem.java
          D=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/production/ProductionData.java
          test -s "$P"
          grep -q 'encounter_interruption_v1' "$P"
          grep -q '((ServerLevel) player.level()).getServer()' "$P"
          grep -q 'queueApex' "$A"
          grep -q 'queueTrial' "$T"
          grep -q 'queueSiege' "$O"
          grep -q 'Siege siege = ACTIVE.get(event.getEntity().getUUID())' "$O"
          ! grep -q 'Siege siege = ACTIVE.remove(event.getEntity().getUUID())' "$O"
          grep -q 'restoreSupplyCharges' "$D"
          grep -q 'retrySupplyRefund' "$D"
          grep -q 'EncounterInterruptionData::onPlayerLoggedIn' "$S"
          grep -q 'mod_version=0.61.4-alpha.1' projects/survival-ascension/gradle.properties
          grep -q 'VERSION = "0.61.4-alpha.1"' "$S"
          grep -q 'state.echoShards = add(state.echoShards, 8)' "$P"
          grep -q 'state.amethystShards = add(state.amethystShards, 64)' "$P"
          grep -q 'state.supplyCharges = add(state.supplyCharges, 2)' "$P"
          grep -q 'state.stoneBricks = add(state.stoneBricks, 32)' "$P"
          git diff --check
          echo ENCOUNTER_INTERRUPTION_CONTRACT_OK

      - name: Resource JSON audit
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" >/dev/null
            count=$((count+1))
          done < <(find projects/frontier-settlement/src/main/resources projects/survival-ascension/src/main/resources -type f -name '*.json' -print0)
          echo "JSON_OK $count files"

      - name: Frontier Java 25 regression build
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build

      - name: Survival Java 25 clean build
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon clean build

      - name: JAR audit
        shell: bash
        run: |
          set -euo pipefail
          F=projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.92.jar
          S=projects/survival-ascension/build/libs/survivalascension-0.61.4-alpha.1.jar
          for jarfile in "$F" "$S"; do
            test -s "$jarfile"
            test -z "$(jar tf "$jarfile" | sort | uniq -d | head -n1 || true)"
            echo "JAR_OK $jarfile $(stat -c%s "$jarfile") bytes"
          done
          jar tf "$S" | grep -q 'kr/moonseungjun/survivalascension/production/EncounterInterruptionData.class'

      - name: Upload Survival replacement
        uses: actions/upload-artifact@v4
        with:
          name: survival-audit5-replacement
          path: projects/survival-ascension/build/libs/survivalascension-0.61.4-alpha.1.jar
          if-no-files-found: error
          retention-days: 7

      - name: Commit validated fix and cleanup audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-survival-audit5-fix-v2.yml
          rm -f .github/workflows/manual-survival-audit5-fix.yml
          rm -f .github/scripts/survival_audit5_fix.py
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/survival-ascension .github/workflows/manual-survival-audit5-fix-v2.yml .github/workflows/manual-survival-audit5-fix.yml .github/scripts/survival_audit5_fix.py
          git commit -m "Compensate paid encounters interrupted by server shutdown"
          git pull --rebase origin main
          git push origin HEAD:main
