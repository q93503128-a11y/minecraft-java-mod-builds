name: Apply Frontier Alpha83 Content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha83-content.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha83-content-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Alpha.83 content patch
        run: python3 .github/scripts/frontier-alpha83-content-apply.py
      - name: Preserve Alpha.82 guidance view for historical audits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/frontier-settlement/tools/test_alpha83_source.py')
          s = p.read_text(encoding='utf-8')
          old = '    elif self.name == "SettlementGuidanceService.java":\n        s = s.replace("M 메뉴", "B 팔레트")\n'
          new = old + '        s += "\\n// Alpha.82 historical guidance: 영지 운영 · 고급 제작 의뢰·건설소 보급·도로망·전문 전초기지·시장 교역·감시망·주둔 병력을 계속 확장\\n"\n'
          if s.count(old) != 1:
              raise SystemExit('historical guidance shim anchor mismatch')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate source/docs audits before commit
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          python3 tools/test_alpha83_source.py
          python3 tools/test_alpha83_docs.py
          git diff --check
      - name: Commit Alpha.83 content atomically
        run: |
          set -euo pipefail
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add -A
          git commit -m "Expand Frontier Settlement late-game content to alpha.83"
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
