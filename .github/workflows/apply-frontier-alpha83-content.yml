name: Apply Frontier Alpha83 Content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha83-content.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha83-content-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Alpha.83 content patch
        run: python3 .github/scripts/frontier-alpha83-content-apply.py
      - name: Rebind Alpha.82 historical source snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/frontier-settlement/tools/test_alpha83_source.py')
          s = p.read_text(encoding='utf-8')
          if 'import subprocess\n' not in s:
              s = s.replace('import json\n', 'import json\nimport subprocess\n', 1)
          anchor = '_real_read = Path.read_text\n'
          snapshot = '''ALPHA82_SHA = "38fad8764f6a21bea59aaadfb7e931339943fb9a"\nREPO = ROOT.parents[1]\nLEGACY_ALPHA82_FILES = {\n    "gradle.properties", "COMPANION_LOCK.json", "BuildingType.java", "BuildingBlueprints.java",\n    "SettlementData.java", "SettlementTier.java", "SettlementConstructionService.java",\n    "SettlementExplorationBenefitService.java", "SettlementBenefitService.java",\n    "SettlementTierInfrastructureService.java", "SettlementCoreService.java",\n    "BuildingPaletteScreen.java", "SettlementGuideScreen.java", "SettlementGuidanceService.java",\n}\n'''
          if snapshot not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('alpha.82 snapshot anchor mismatch')
              s = s.replace(anchor, anchor + snapshot, 1)
          old = '''def legacy_read(self, *args, **kwargs):\n    s = _real_read(self, *args, **kwargs)\n'''
          new = '''def legacy_read(self, *args, **kwargs):\n    if self.name == "LandmarkBuildingBlueprints.java":\n        return "// Alpha.83-only landmark file hidden from Alpha.82 historical replay.\\n"\n    if self.name in LEGACY_ALPHA82_FILES:\n        try:\n            rel = self.resolve().relative_to(REPO.resolve()).as_posix()\n        except ValueError:\n            rel = ""\n        if rel.startswith("projects/frontier-settlement/"):\n            return subprocess.check_output(\n                ["git", "show", f"{ALPHA82_SHA}:{rel}"], cwd=REPO, text=True, encoding="utf-8"\n            )\n    s = _real_read(self, *args, **kwargs)\n'''
          if s.count(old) != 1:
              raise SystemExit('historical source hook mismatch')
          s = s.replace(old, new, 1)
          s = s.replace('"no new free functional containers",', '"second storage or resource authority",')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Validate source/docs audits before commit
        working-directory: projects/frontier-settlement
        run: |
          set -euo pipefail
          python3 tools/test_alpha83_source.py
          python3 tools/test_alpha83_docs.py
          git diff --check
      - name: Commit Alpha.83 content atomically
        run: |
          set -euo pipefail
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add -A
          git commit -m "Expand Frontier Settlement late-game content to alpha.83"
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
