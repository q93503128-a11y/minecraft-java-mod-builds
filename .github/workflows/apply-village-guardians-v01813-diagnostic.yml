name: Finalize Village Guardians v0.18.13 Canonical State

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.apply-diagnostic-v01813'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Rebase
        run: git pull --rebase origin main
      - name: Update canonical docs and verify final contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/village-guardians/tools/finalize_v01813_docs.py
          python3 projects/village-guardians/tools/test_v01813_siege_integration.py
          test -f projects/village-guardians/.ci/v01813-final.txt
          grep -q '^version=0.18.13-alpha.1$' projects/village-guardians/.ci/v01813-final.txt
          grep -q '^run_id=32087562708$' projects/village-guardians/.ci/v01813-final.txt
      - name: Remove temporary v0.18.13 apply tooling
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-village-guardians-v01813-siege.yml \
            .github/workflows/apply-village-guardians-v01813-diagnostic.yml \
            projects/village-guardians/.apply-trigger-v01813 \
            projects/village-guardians/.apply-diagnostic-v01813 \
            projects/village-guardians/.build-trigger-v01813 \
            projects/village-guardians/tools/apply_v01813_siege_integration.py \
            projects/village-guardians/tools/prepare_v01813_contracts.py \
            projects/village-guardians/tools/apply_v01813_tower_hunter_followup.py \
            projects/village-guardians/tools/apply_v01813_mesh_color_fix.py \
            projects/village-guardians/tools/apply_v01813_core_contract_migration.py \
            projects/village-guardians/tools/finalize_v01813_docs.py \
            projects/village-guardians/.ci/v01813-apply-report.txt \
            projects/village-guardians/.ci/v01813-followup-report.txt \
            projects/village-guardians/.ci/v01813-color-report.txt \
            projects/village-guardians/.ci/v01813-core-contract-report.txt \
            projects/village-guardians/.ci/v01813-build-report.txt
      - name: Commit canonical state
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m 'docs(village): finalize v0.18.13 siege integration'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1
