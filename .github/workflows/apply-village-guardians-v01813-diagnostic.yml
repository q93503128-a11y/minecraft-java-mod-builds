name: Apply Village Guardians v0.18.13 Follow-up Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.apply-diagnostic-v01813'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Rebase
        run: git pull --rebase origin main
      - name: Apply, verify and record follow-up
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/v01813-followup.log"
          : > "$LOG"
          {
            echo "head_before=$(git rev-parse HEAD)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "=== APPLY FOLLOW-UP ==="
            python3 projects/village-guardians/tools/apply_v01813_tower_hunter_followup.py
            APPLY=$?
            echo "apply_exit=$APPLY"
            TESTS=99
            if [ "$APPLY" -eq 0 ]; then
              echo "=== REGRESSION ==="
              python3 projects/village-guardians/tools/test_v01813_siege_integration.py && \
              python3 projects/village-guardians/tools/test_v01812_quality_audit.py && \
              python3 projects/village-guardians/tools/test_v01811_defense_polish.py && \
              python3 projects/village-guardians/tools/test_v01810_ranger_ricochet.py && \
              python3 projects/village-guardians/tools/test_v0189_siege_phase2.py && \
              python3 projects/village-guardians/tools/test_v0188_risk_ui_cleanup.py
              TESTS=$?
            fi
            echo "tests_exit=$TESTS"
          } >> "$LOG" 2>&1

          APPLY=$(grep '^apply_exit=' "$LOG" | tail -1 | cut -d= -f2)
          TESTS=$(grep '^tests_exit=' "$LOG" | tail -1 | cut -d= -f2)
          STATUS=PASS
          if [ "$APPLY" -ne 0 ] || [ "$TESTS" -ne 0 ]; then STATUS=FAIL; fi
          if [ "$STATUS" = PASS ] && grep -R "disableRandomActiveTurret\|VillageTowerResearchBonusSystem" projects/village-guardians/src/main/java; then
            echo "retired turret integration reference remains" >> "$LOG"
            STATUS=FAIL
          fi

          if [ "$STATUS" = FAIL ]; then git reset --hard HEAD; fi
          mkdir -p projects/village-guardians/.ci
          {
            echo "status=$STATUS"
            echo "run_id=$GITHUB_RUN_ID"
            echo "trigger_head=$(git rev-parse HEAD)"
            echo
            cat "$LOG"
          } > projects/village-guardians/.ci/v01813-followup-report.txt

          if [ "$STATUS" = PASS ]; then
            git add -A projects/village-guardians
            git commit -m 'fix(village): unify tower hunter and indirect fire behavior'
          else
            git add projects/village-guardians/.ci/v01813-followup-report.txt
            git commit -m 'ci(village): record v0.18.13 follow-up failure [skip ci]'
          fi

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main
          done
          test "$STATUS" = PASS
