name: Apply Village Guardians v0.18.13 Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.apply-diagnostic-v01813'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Rebase
        run: git pull --rebase origin main
      - name: Apply, verify and always record result
        shell: bash
        run: |
          set +e
          LOG="$RUNNER_TEMP/v01813-apply.log"
          : > "$LOG"
          {
            echo "head_before=$(git rev-parse HEAD)"
            echo "run_id=$GITHUB_RUN_ID"
            echo "=== APPLY ==="
            python3 projects/village-guardians/tools/apply_v01813_siege_integration.py
            APPLY=$?
            echo "apply_exit=$APPLY"
            if [ "$APPLY" -eq 0 ]; then
              echo "=== CONTRACT MIGRATION ==="
              python3 projects/village-guardians/tools/prepare_v01813_contracts.py
              MIGRATE=$?
            else
              MIGRATE=99
            fi
            echo "migrate_exit=$MIGRATE"
            TESTS=99
            if [ "$APPLY" -eq 0 ] && [ "$MIGRATE" -eq 0 ]; then
              echo "=== REGRESSION ==="
              python3 projects/village-guardians/tools/test_v01813_siege_integration.py && \
              python3 projects/village-guardians/tools/test_v01812_quality_audit.py && \
              python3 projects/village-guardians/tools/test_v01811_defense_polish.py && \
              python3 projects/village-guardians/tools/test_v01810_ranger_ricochet.py && \
              python3 projects/village-guardians/tools/test_v0189_siege_phase2.py && \
              python3 projects/village-guardians/tools/test_v0188_risk_ui_cleanup.py
              TESTS=$?
            fi
            echo "tests_exit=$TESTS"
          } >> "$LOG" 2>&1

          APPLY=$(grep '^apply_exit=' "$LOG" | tail -1 | cut -d= -f2)
          MIGRATE=$(grep '^migrate_exit=' "$LOG" | tail -1 | cut -d= -f2)
          TESTS=$(grep '^tests_exit=' "$LOG" | tail -1 | cut -d= -f2)
          if [ "$APPLY" -ne 0 ] || [ "$MIGRATE" -ne 0 ] || [ "$TESTS" -ne 0 ]; then
            git reset --hard HEAD
            STATUS=FAIL
          else
            if grep -R "VillageTowerResearchBonusSystem" projects/village-guardians/src/main/java; then
              echo "legacy research bonus reference remains" >> "$LOG"
              git reset --hard HEAD
              STATUS=FAIL
            else
              STATUS=PASS
            fi
          fi

          mkdir -p projects/village-guardians/.ci
          {
            echo "status=$STATUS"
            echo "run_id=$GITHUB_RUN_ID"
            echo "trigger_head=$(git rev-parse HEAD)"
            echo
            cat "$LOG"
          } > projects/village-guardians/.ci/v01813-apply-report.txt

          if [ "$STATUS" = PASS ]; then
            git add -A projects/village-guardians
            git commit -m 'feat(village): integrate siege defense presentation and pressure'
          else
            git add projects/village-guardians/.ci/v01813-apply-report.txt
            git commit -m 'ci(village): record v0.18.13 apply failure [skip ci]'
          fi

          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then break; fi
            git pull --rebase origin main
          done
          test "$STATUS" = PASS
