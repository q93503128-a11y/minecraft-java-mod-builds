name: Arcane alpha75 wide credit one-shot

on:
  push:
    branches: [main]
    paths:
      - '.github/arcane-alpha75-wide-credit-trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact wide-area combat credit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 .github/arcane-alpha75-wide-credit.py
          git diff --check
          git add -A
          git commit -m 'Fix Arcane alpha.75 wide-area combat credit [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
