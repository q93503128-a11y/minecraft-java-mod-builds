name: Manual Survival Audit 3 V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-audit3-v2.yml'

permissions:
  contents: write

jobs:
  audit-fix-build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply audit fixes and inventory runtime state
        run: python3 .github/scripts/survival_audit3_fix.py
      - name: Source contract audit
        shell: bash
        run: |
          set -euo pipefail
          M=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/mobility/MobilityProgression.java
          S=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/SurvivalAscension.java
          T=projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension/compat/TbsJournalRestorationService.java
          grep -q 'MobilityProgression::onServerStopping' "$S"
          grep -q 'TbsJournalRestorationService::onServerStopping' "$S"
          grep -q 'DASH_READY_TICK.clear()' "$M"
          grep -q 'AIR_DASH_COUNT.clear()' "$M"
          grep -q 'DASH_READY_TICK.containsKey(player.getUUID())' "$M"
          grep -q 'READY_AT.clear()' "$T"
          grep -q 'mod_version=0.61.2-alpha.1' projects/survival-ascension/gradle.properties
          grep -q 'VERSION = "0.61.2-alpha.1"' "$S"
          if sed -n '/onPlayerLoggedOut/,/onServerStopping/p' "$M" | grep -q 'DASH_READY_TICK.remove\|AIR_DASH_COUNT.remove'; then exit 1; fi
          git diff --check
      - name: Resource JSON audit
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' f; do
            python3 -m json.tool "$f" >/dev/null
            count=$((count+1))
          done < <(find projects/frontier-settlement/src/main/resources projects/survival-ascension/src/main/resources -type f -name '*.json' -print0)
          echo "JSON_OK $count files"
      - name: Frontier Java 25 regression build
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon clean build
      - name: Survival Java 25 clean build
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon clean build
      - name: JAR audit
        shell: bash
        run: |
          set -euo pipefail
          F=projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.92.jar
          S=projects/survival-ascension/build/libs/survivalascension-0.61.2-alpha.1.jar
          for jarfile in "$F" "$S"; do
            test -s "$jarfile"
            test -z "$(jar tf "$jarfile" | sort | uniq -d | head -n1 || true)"
            echo "JAR_OK $jarfile $(stat -c%s "$jarfile") bytes"
          done
      - name: Upload Survival replacement
        uses: actions/upload-artifact@v4
        with:
          name: survival-audit3-replacement
          path: projects/survival-ascension/build/libs/survivalascension-0.61.2-alpha.1.jar
          if-no-files-found: error
          retention-days: 7
      - name: Commit validated fixes and cleanup audit files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/manual-survival-audit3-v2.yml
          rm -f .github/scripts/survival_audit3_fix.py
          git config user.name "coworkaccount"
          git config user.email "cyp1jhh2@gmail.com"
          git add projects/survival-ascension .github/workflows/manual-survival-audit3-v2.yml .github/scripts/survival_audit3_fix.py
          git commit -m "Preserve mobility cooldown across relogs"
          git pull --rebase origin main
          git push origin HEAD:main
