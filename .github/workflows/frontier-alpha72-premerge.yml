name: Frontier Alpha72 Premerge

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha72-premerge.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply Alpha72 candidate
        shell: bash
        run: |
          set -euo pipefail
          echo 'dac526ac4f7fbea82af1e41e4841784662b9ce7eff7feb0a71230eaaf3b39e3f  .github/frontier-alpha72-patch.part00' | sha256sum -c -
          echo '029320df241b5c5adfdd7b345c8abe2fbee8f77b5546e3774613963f151b2640  .github/frontier-alpha72-patch.part01' | sha256sum -c -
          echo '84371ed0d30c64204887de822af0cd640b0baa5314c645234daecedc824ebcc9  .github/frontier-alpha72-patch.part02' | sha256sum -c -
          echo 'ddaefbbefc8c6732c9d6923b6019fad2aef4c01ce2a54f1cf60e8cd87a0e7651  .github/frontier-alpha72-patch.part03a' | sha256sum -c -
          echo 'ac46b1e22985b7b05d9b85c8c490a98fa49bc931ed93195d90f4fae004e1178d  .github/frontier-alpha72-patch.part03b0' | sha256sum -c -
          echo 'e031b248aa57a4b98ef43e2f61a618319ec76b1757866d60889c30c268d72cbe  .github/frontier-alpha72-patch.part03b1' | sha256sum -c -
          echo '9cc0027cd33d9eb3ca73055cea5e18a975201774ddf44ee98b21b31fc23a6815  .github/frontier-alpha72-patch.part03b2' | sha256sum -c -
          echo '1ed75854b9e3cca4e315bcd15f92faf1da31a1a3178f9ceb29fa3aafcf8bca44  .github/frontier-alpha72-patch.part03b3' | sha256sum -c -
          cat .github/frontier-alpha72-patch.part00 \
              .github/frontier-alpha72-patch.part01 \
              .github/frontier-alpha72-patch.part02 \
              .github/frontier-alpha72-patch.part03a \
              .github/frontier-alpha72-patch.part03b0 \
              .github/frontier-alpha72-patch.part03b1 \
              .github/frontier-alpha72-patch.part03b2 \
              .github/frontier-alpha72-patch.part03b3 > /tmp/alpha72.patch.xz.b64
          echo 'b2bd573a5d8f4d356cf9d7ce6a17d2cb8949624915265155fe5301acabd65737  /tmp/alpha72.patch.xz.b64' | sha256sum -c -
          base64 -d /tmp/alpha72.patch.xz.b64 | xz -d > /tmp/alpha72.patch
          git apply --check /tmp/alpha72.patch
          git apply /tmp/alpha72.patch
          git diff --check
      - name: Alpha72 cumulative audits
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_alpha72_source.py
          python3 tools/test_alpha72_docs.py
      - name: Java 25 clean build
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
      - name: Verify JAR
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          test -f build/libs/frontier_settlement-0.1.0-alpha.72.jar
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.72.jar
          test -f build/libs/frontier_settlement-0.1.0-alpha.72.jar.sha256
          mkdir -p /tmp/deliverables
          cp build/libs/frontier_settlement-0.1.0-alpha.72.jar /tmp/deliverables/
          cp build/libs/frontier_settlement-0.1.0-alpha.72.jar.sha256 /tmp/deliverables/
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha72-premerge-deliverables
          path: /tmp/deliverables/
          if-no-files-found: error
          retention-days: 7
      - name: Record premerge result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/frontier-alpha72-premerge-result
          mkdir -p /tmp/frontier-alpha72-premerge-result
          cat > /tmp/frontier-alpha72-premerge-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          version=0.1.0-alpha.72
          java=25
          STATUS
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf ci-results/frontier-alpha72-premerge
            mkdir -p ci-results/frontier-alpha72-premerge
            cp -a /tmp/frontier-alpha72-premerge-result/. ci-results/frontier-alpha72-premerge/
            git add -A ci-results/frontier-alpha72-premerge
            if git diff --cached --quiet; then recorded=1; break; fi
            git commit -m "Record Frontier Alpha72 premerge result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then recorded=1; break; fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1
