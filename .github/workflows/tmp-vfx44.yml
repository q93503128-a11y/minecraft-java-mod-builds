        Iterator<Map.Entry<BuffKey, State>> iterator = STATES.entrySet().iterator();
        while (iterator.hasNext()) {
            Map.Entry<BuffKey, State> entry = iterator.next();
            if (!entry.getKey().playerId().equals(playerId)) continue;
