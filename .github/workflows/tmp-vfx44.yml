                    m.line(c.add(lane * .18, .18, 0), c.add(lane * .52, .55, 2.0 + q * 1.5),
                            lane == 0 ? 1.18F : .52F, lane == 0 ? .96F : .58F, lane == 0 ? major : detail);
            }
            case "greater_invisibility", "invisibility" -> {
                for (int i = 0; i < 4; i++) {
