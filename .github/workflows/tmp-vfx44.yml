    int size(int lod){
        int kept=0;
        for(int i=0;i<segments.size();i++)if(keepSegment(segments.get(i),i,lod))kept++;
        for(int i=0;i<faces.size();i++)if(keepFace(faces.get(i),i,lod))kept+=2;
        return kept;
    }

    void submit(PoseStack poseStack,SubmitNodeCollector collector,int argb,float windowScale){
        submit(poseStack,collector,argb,windowScale,0,1.0F);
    }
    void submit(PoseStack poseStack,SubmitNodeCollector collector,int argb,float windowScale,int lod,float opacity){
        if(faces.isEmpty()&&segments.isEmpty())return;
        float alpha=Math.max(0.0F,Math.min(1.0F,opacity));
        if(alpha<=.01F)return;
        if(!faces.isEmpty())collector.submitCustomGeometry(poseStack,RenderTypes.debugFilledBox(),(pose,out)->{
            for(int i=0;i<faces.size();i++){
                Face face=faces.get(i);if(!keepFace(face,i,lod))continue;
                int color=tone(argb,face.brightness,face.alpha*alpha);
                vertex(out,pose,face.a,color);vertex(out,pose,face.b,color);vertex(out,pose,face.c,color);vertex(out,pose,face.d,color);
            }
        });
        if(!segments.isEmpty()){
            submitLines(poseStack,collector,argb,windowScale*4.60F,.58,.34,lod,alpha);
            submitLines(poseStack,collector,argb,windowScale*2.20F,.82,.76,lod,alpha);
            submitLines(poseStack,collector,argb,windowScale*.78F,.98,1.0,lod,alpha);
        }
    }
    private void submitLines(PoseStack stack,SubmitNodeCollector collector,int argb,float scale,double passBrightness,double passAlpha,int lod,float opacity){collector.submitCustomGeometry(stack,RenderTypes.lines(),(pose,out)->{for(int i=0;i<segments.size();i++){Segment s=segments.get(i);if(!keepSegment(s,i,lod))continue;Vec3 d=s.end.subtract(s.start);if(d.lengthSqr()<1e-8)continue;Vec3 n=d.normalize();float w=Math.max(lineFloor,s.width*scale*lineScale);int color=tone(argb,passBrightness*s.brightness,passAlpha*s.alpha*opacity);out.addVertex(pose,(float)s.start.x,(float)s.start.y,(float)s.start.z).setColor(color).setNormal(pose,(float)n.x,(float)n.y,(float)n.z).setLineWidth(w);out.addVertex(pose,(float)s.end.x,(float)s.end.y,(float)s.end.z).setColor(color).setNormal(pose,(float)n.x,(float)n.y,(float)n.z).setLineWidth(w);}});}
    private static boolean keepSegment(Segment s,int index,int lod){
        if(lod<=0)return true;
        if(lod==1)return s.width>=.60F||s.alpha>=.52F||(index&1)==0;
        return s.width>=.95F||(s.width>=.60F&&(index&1)==0)||(s.alpha>=.72F&&index%3==0);
    }
    private static boolean keepFace(Face f,int index,int lod){
        if(lod<=0)return true;
        if(lod==1)return f.brightness>=.92F||(index&1)==0;
        return f.brightness>=1.05F&&index%3==0;
    }
    private static void vertex(VertexConsumer out,PoseStack.Pose pose,Vec3 v,int color){out.addVertex(pose,(float)v.x,(float)v.y,(float)v.z).setColor(color);}
