                    double a = Math.PI / 4.0 + i * Math.PI / 2.0;
                    m.line(c.add(g.point(a, r * .62)).add(0, .30, 0),
                            c.add(g.point(a, r)).add(0, .78, 0), i == 0 ? 1.18F : .58F,
                            i == 0 ? .98F : .66F, i == 0 ? major : detail);
                }
