        ArcaneWorldMesh.Basis g = ArcaneWorldMesh.Basis.ground();
        ArcaneWorldMesh.Basis front = ArcaneWorldMesh.Basis.facing(new Vec3(0, 0, 1));
        Vec3 c = targetOffset;
        float major = (float) (.92 * fade);
        float detail = (float) (.46 * fade);
        switch (spell.id()) {
            case "shield", "mage_armor", "protection_from_energy", "solar_guard" -> {
                double r = (.78 + q * .72) * force;
                m.polygon(g, c.add(0, .06, 0), r, spell.id().equals("solar_guard") ? 8 : 6,
                        q * .42, 1.18F);
