name: Temporary VFX44 patch
on:
  push:
    paths:
      - '.github/workflows/tmp-vfx44.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alpha.44 lifecycle and authored-timeline pass
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path('projects/arcane-circle')
          client=root/'src/main/java/kr/moonseungjun/arcanecircle/client'
          magic=root/'src/main/java/kr/moonseungjun/arcanecircle/magic'

          def read(p): return p.read_text(encoding='utf-8')
          def write(p,s): p.write_text(s,encoding='utf-8')
          def replace_once(s,old,new,label):
              if old not in s: raise SystemExit(f'missing replacement anchor: {label}')
              if s.count(old)!=1: raise SystemExit(f'non-unique replacement anchor {label}: {s.count(old)}')
              return s.replace(old,new,1)
          def replace_method(s, signature, new_body):
              start=s.find(signature)
              if start<0: raise SystemExit(f'missing method: {signature}')
              nxt=s.find('\n    private static void ', start+len(signature))
              if nxt<0: raise SystemExit(f'no next method after: {signature}')
              return s[:start]+new_body.rstrip()+"\n"+s[nxt:]

          # Version contract.
          p=root/'gradle.properties'; s=read(p); s=s.replace('mod_version=0.12.1-alpha.43','mod_version=0.12.1-alpha.44'); write(p,s)
          p=root/'src/main/java/kr/moonseungjun/arcanecircle/ArcaneCircle.java'; s=read(p); s=s.replace('VERSION = "0.12.1-alpha.43"','VERSION = "0.12.1-alpha.44"'); write(p,s)
          p=root/'src/main/resources/data/arcanecircle/spell_catalog/index.json'; s=read(p); s=s.replace('"version": "0.12.1-alpha.43"','"version": "0.12.1-alpha.44"'); write(p,s)

          # WorldMagicService: attach long-lived self magic to the caster and expose lifecycle pulses.
          p=magic/'WorldMagicService.java'; s=read(p)
          old='''    private static void send(LivingEntity caster, String state) {
        if (!(caster.level() instanceof ServerLevel level)) return;
        PacketDistributor.sendToPlayersNear(level, null, caster.getX(), caster.getY(), caster.getZ(),
                160.0, new WorldMagicPayload(state));
    }

    private static String encode(String kind, LivingEntity caster, SpellDefinition spell, boolean fusion,
                                 int ingredientCount, Vec3 center, Vec3 target, Vec3 direction, double range,
                                 double power, double progress, int duration, int impactTicks, long seed) {
        return String.format(Locale.ROOT,
                "kind=%s;caster=%s;spell=%s;fusion=%d;ingredients=%d;x=%.5f;y=%.5f;z=%.5f;tx=%.5f;ty=%.5f;tz=%.5f;dx=%.5f;dy=%.5f;dz=%.5f;range=%.4f;power=%.4f;progress=%.4f;duration=%d;impact=%d;seed=%d",
                kind, caster.getUUID(), spell.id(), fusion ? 1 : 0, ingredientCount,
                center.x, center.y, center.z, target.x, target.y, target.z,
                direction.x, direction.y, direction.z, range, power, progress, duration, impactTicks, seed);
    }
'''
          new='''    public static void endPersistent(LivingEntity caster, String spellId) {
        if (caster == null || spellId == null || spellId.isBlank()) return;
        send(caster, "kind=end;caster=" + caster.getUUID() + ";spell=" + spellId);
    }

    public static void pulsePersistent(LivingEntity caster, String spellId, int strength) {
        if (caster == null || spellId == null || spellId.isBlank()) return;
        send(caster, "kind=pulse;caster=" + caster.getUUID() + ";spell=" + spellId
                + ";strength=" + Math.max(1, Math.min(4, strength)));
    }

    private static void send(LivingEntity caster, String state) {
        if (!(caster.level() instanceof ServerLevel level)) return;
        PacketDistributor.sendToPlayersNear(level, null, caster.getX(), caster.getY(), caster.getZ(),
                160.0, new WorldMagicPayload(state));
    }

    private static boolean followsCasterVisual(String kind, SpellDefinition spell) {
        if (!"release".equals(kind)) return false;
        if ("time_stop".equals(spell.id())) return false;
        if ("antimagic_field".equals(spell.id())) return true;
        if (SpellGameplayService.visualDurationTicks(spell.id()) <= 30) return false;
        SpellPresentationProfile.SigilStyle sigil = SpellPresentationProfile.profile(spell).sigil();
        return sigil == SpellPresentationProfile.SigilStyle.BODY_HALO
                || sigil == SpellPresentationProfile.SigilStyle.FEET_RUNE;
    }

    private static String encode(String kind, LivingEntity caster, SpellDefinition spell, boolean fusion,
                                 int ingredientCount, Vec3 center, Vec3 target, Vec3 direction, double range,
                                 double power, double progress, int duration, int impactTicks, long seed) {
        boolean attached = followsCasterVisual(kind, spell);
        int attach = attached ? caster.getId() : -1;
        Vec3 attachOffset = attached ? center.subtract(caster.position()) : Vec3.ZERO;
        return String.format(Locale.ROOT,
                "kind=%s;caster=%s;spell=%s;fusion=%d;ingredients=%d;x=%.5f;y=%.5f;z=%.5f;tx=%.5f;ty=%.5f;tz=%.5f;dx=%.5f;dy=%.5f;dz=%.5f;range=%.4f;power=%.4f;progress=%.4f;duration=%d;impact=%d;seed=%d;attach=%d;ox=%.5f;oy=%.5f;oz=%.5f",
                kind, caster.getUUID(), spell.id(), fusion ? 1 : 0, ingredientCount,
                center.x, center.y, center.z, target.x, target.y, target.z,
                direction.x, direction.y, direction.z, range, power, progress, duration, impactTicks, seed,
                attach, attachOffset.x, attachOffset.y, attachOffset.z);
    }
