name: Repair EARTH TO STARS alpha15 verification runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ets-alpha15-runner-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch runner commit hygiene and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ets-alpha15-boarding-rescue.yml')
          body = path.read_text(encoding='utf-8')

          old_commit = '''      - name: Commit verified alpha.15 rescue
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/earth-to-stars .github/workflows/build-earth-to-stars.yml
          git commit -m 'earth-to-stars: fix impossible ship boarding alpha15'
          git pull --rebase origin main
          git push origin HEAD:main
          git rev-parse HEAD | tee projects/earth-to-stars/build/alpha15-source-sha.txt
'''
          new_commit = '''      - name: Commit verified alpha.15 rescue
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          mkdir -p /tmp/ets-alpha15
          cp projects/earth-to-stars/build/libs/earth_to_stars-0.1.0-alpha.15.jar /tmp/ets-alpha15/
          cp projects/earth-to-stars/build/libs/earth_to_stars-0.1.0-alpha.15.jar.sha256 /tmp/ets-alpha15/
          cp projects/earth-to-stars/build/logs/alpha15-boarding-server.log /tmp/ets-alpha15/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \\
            .github/workflows/build-earth-to-stars.yml \\
            projects/earth-to-stars/gradle.properties \\
            projects/earth-to-stars/tools/validate_alpha15_acceptance.py \\
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/EarthToStars.java \\
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/content/EarthToStarsEntities.java \\
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/ship/runtime/minecraft/ShipExteriorEntity.java \\
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/ship/runtime/minecraft/ShipRuntimeManager.java \\
            projects/earth-to-stars/src/main/java/kr/moonseungjun/earthtostars/ship/runtime/minecraft/ShipLifecycleProbe.java
          git commit -m 'earth-to-stars: fix impossible ship boarding alpha15'

          # Build/server tasks create large local trees and can also touch tracked file modes.
          # Preserve only the verified deliverables copied above, then return to the exact source commit.
          git reset --hard HEAD
          git clean -fdx \\
            projects/earth-to-stars/.gradle \\
            projects/earth-to-stars/build \\
            projects/earth-to-stars/run \\
            projects/earth-to-stars/tools/__pycache__

          git pull --rebase origin main
          git push origin HEAD:main
          git rev-parse HEAD > /tmp/ets-alpha15/source-sha.txt
'''
          if body.count(old_commit) != 1:
              raise SystemExit(f'commit block match count: {body.count(old_commit)}')
          body = body.replace(old_commit, new_commit, 1)

          old_report = '''      - name: Write verification report
        shell: bash
        run: |
          JAR=$(ls build/libs/earth_to_stars-0.1.0-alpha.15.jar | head -n1)
          SHA=$(cat "$JAR.sha256")
          SOURCE_SHA=$(cat build/alpha15-source-sha.txt)
          cat > build/ALPHA15_BOARDING_RESCUE_REPORT.md <<EOF
          # EARTH TO STARS alpha.15 Boarding Root-Cause Rescue

          - Source commit: $SOURCE_SHA
          - Minecraft: 26.2
          - NeoForge: 26.2.0.76
          - Java: 25
          - alpha.15 static acceptance: PASS
          - clean test build: PASS
          - production JAR verify: PASS
          - dedicated boarding EntityType contract: PASS (serializable=true, runtime instance saved=false)
          - root cause: alpha.14 used EntityType.noSave(), while Minecraft 26.2 Entity.startRiding rejects non-serializable vehicle types before force/canRide checks
          - live client boarding: NOT PLAYTESTED
          - multiplayer: NOT TESTED
          - JAR SHA-256: $SHA
          EOF
      - name: Upload alpha.15 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-0.1.0-alpha.15-boarding-rescue
          path: |
            projects/earth-to-stars/build/libs/earth_to_stars-0.1.0-alpha.15.jar
            projects/earth-to-stars/build/libs/earth_to_stars-0.1.0-alpha.15.jar.sha256
            projects/earth-to-stars/build/ALPHA15_BOARDING_RESCUE_REPORT.md
            projects/earth-to-stars/build/logs/alpha15-boarding-server.log
          retention-days: 7
'''
          new_report = '''      - name: Write verification report
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          SHA=$(cat /tmp/ets-alpha15/earth_to_stars-0.1.0-alpha.15.jar.sha256)
          SOURCE_SHA=$(cat /tmp/ets-alpha15/source-sha.txt)
          cat > /tmp/ets-alpha15/ALPHA15_BOARDING_RESCUE_REPORT.md <<EOF
          # EARTH TO STARS alpha.15 Boarding Root-Cause Rescue

          - Source commit: $SOURCE_SHA
          - Minecraft: 26.2
          - NeoForge: 26.2.0.76
          - Java: 25
          - alpha.15 static acceptance: PASS
          - clean test build: PASS
          - production JAR verify: PASS
          - dedicated boarding EntityType contract: PASS (serializable=true, runtime instance saved=false)
          - root cause: alpha.14 used EntityType.noSave(), while Minecraft 26.2 Entity.startRiding rejects non-serializable vehicle types before force/canRide checks
          - live client boarding: NOT PLAYTESTED
          - multiplayer: NOT TESTED
          - JAR SHA-256: $SHA
          EOF
      - name: Upload alpha.15 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-0.1.0-alpha.15-boarding-rescue
          path: /tmp/ets-alpha15/
          retention-days: 7
'''
          if body.count(old_report) != 1:
              raise SystemExit(f'report block match count: {body.count(old_report)}')
          path.write_text(body.replace(old_report, new_report, 1), encoding='utf-8')
          PY

          git rm .github/workflows/ets-alpha15-runner-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ets-alpha15-boarding-rescue.yml
          git commit -m 'earth-to-stars: harden alpha15 verification runner'
          git pull --rebase origin main
          git push origin HEAD:main
