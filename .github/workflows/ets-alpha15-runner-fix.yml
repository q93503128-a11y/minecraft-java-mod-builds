name: Repair EARTH TO STARS alpha15 verification runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ets-alpha15-runner-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch alpha.15 runner and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ets_alpha15_runner_hygiene.py
          git rm .github/workflows/ets-alpha15-runner-fix.yml .github/scripts/ets_alpha15_runner_hygiene.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ets-alpha15-boarding-rescue.yml
          git commit -m 'earth-to-stars: harden alpha15 verification runner'
          git pull --rebase origin main
          git push origin HEAD:main
