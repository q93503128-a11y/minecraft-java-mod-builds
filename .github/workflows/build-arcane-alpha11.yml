name: Build Arcane Circle alpha.11

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/arcane-alpha11.patch.b64.part00'
      - '.github/scripts/arcane-alpha11.patch.b64.part01'
      - '.github/scripts/arcane-alpha11.patch.b64.part02'
      - '.github/workflows/build-arcane-alpha11.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arcane-alpha11-download
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Reconstruct and verify alpha.11 patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p projects/arcane-circle/tools
          cat .github/scripts/arcane-alpha11.patch.b64.part00 \
              .github/scripts/arcane-alpha11.patch.b64.part01 \
              .github/scripts/arcane-alpha11.patch.b64.part02 \
            | base64 --decode | gzip --decompress \
            > projects/arcane-circle/tools/apply_v0121_alpha11_visual_combat.py
          echo '3c329b04e624f85838ca217e6b120fae719affff6272d8bce7be2f2203323d30  projects/arcane-circle/tools/apply_v0121_alpha11_visual_combat.py' | sha256sum --check

      - name: Apply alpha.11 source changes
        run: python3 projects/arcane-circle/tools/apply_v0121_alpha11_visual_combat.py

      - name: Repair generated source syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          mage = Path('projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/world/ArcaneMageService.java')
          text = mage.read_text(encoding='utf-8')
          broken = '\x01String s=e.getName().getString();int i=s.indexOf("] ");return i>=0?s.substring(i+2):s;}'
          fixed = '    private static String visibleName(Entity e){String s=e.getName().getString();int i=s.indexOf("] ");return i>=0?s.substring(i+2):s;}'
          if broken not in text:
              raise SystemExit('ArcaneMageService control-character marker was not found')
          mage.write_text(text.replace(broken, fixed), encoding='utf-8')

          gear = Path('projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/ArcaneGearRenderer.java')
          text = gear.read_text(encoding='utf-8')
          replacements = {
              'quad(out,pose,x0,.69F,-.23F,x1,.69F,-.23F,x1,.69F,.23F,x0,.69F,.23F,lining);}});}':
              'quad(out,pose,x0,.69F,-.23F,x1,.69F,-.23F,x1,.69F,.23F,x0,.69F,.23F,lining);});}',
              'quad(out,pose,.03F,.27F,-.195F,.29F,.27F,-.195F,.29F,.31F,-.195F,.03F,.31F,-.195F,trim);}});}':
              'quad(out,pose,.03F,.27F,-.195F,.29F,.27F,-.195F,.29F,.31F,-.195F,.03F,.31F,-.195F,trim);});}',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'ArcaneGearRenderer repair marker missing: {old[:72]}')
              text = text.replace(old, new, 1)
          gear.write_text(text, encoding='utf-8')

          mesh = Path('projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/ArcaneWorldMesh.java')
          text = mesh.read_text(encoding='utf-8')
          replacements = {
              'brightness*(i%2==0?1:.72)': 'brightness*(i%2==0?1F:.72F)',
              'brightness*1.15,alpha': 'brightness*1.15F,alpha',
              'brightness*(.78+.22*Math.sin(Math.PI*t)),alpha': '(float)(brightness*(.78+.22*Math.sin(Math.PI*t))),alpha',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'ArcaneWorldMesh repair marker missing: {old}')
              text = text.replace(old, new, 1)
          mesh.write_text(text, encoding='utf-8')

          for path in (mage, gear, mesh):
              data = path.read_bytes()
              bad = [b for b in data if b < 9 or (13 < b < 32)]
              if bad:
                  raise SystemExit(f'Unexpected control bytes remain in {path}: {sorted(set(bad))}')
          PY

      - name: Build with Java 25
        shell: bash
        working-directory: projects/arcane-circle
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'arcanecircle-0.12.1-alpha.11.jar' -print -quit)"
          test -n "$jar_file"
          jar tf "$jar_file" >/dev/null
          sha256sum "$jar_file" > "$jar_file.sha256"

      - name: Upload alpha.11 JAR
        uses: actions/upload-artifact@v4
        with:
          name: arcanecircle-0.12.1-alpha.11
          path: |
            projects/arcane-circle/build/libs/arcanecircle-0.12.1-alpha.11.jar
            projects/arcane-circle/build/libs/arcanecircle-0.12.1-alpha.11.jar.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified alpha.11 sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f projects/arcane-circle/tools/apply_v0121_alpha11_visual_combat.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/arcane-circle
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Publish Arcane Circle v0.12.1-alpha.11 verified sources [skip ci]'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          exit 1

      - name: Record run status
        if: always()
        shell: bash
        env:
          RESULT: ${{ job.status }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/arcane-alpha11-status
          cat > /tmp/arcane-alpha11-status/status.txt <<STATUS
          status=$RESULT
          run_id=$GITHUB_RUN_ID
          source_sha=$GITHUB_SHA
          artifact=arcanecircle-0.12.1-alpha.11
          STATUS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p ci-results/arcane-circle-alpha11-download
            cp /tmp/arcane-alpha11-status/status.txt ci-results/arcane-circle-alpha11-download/status.txt
            git add ci-results/arcane-circle-alpha11-download/status.txt
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Record Arcane Circle alpha.11 download run $GITHUB_RUN_ID [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
