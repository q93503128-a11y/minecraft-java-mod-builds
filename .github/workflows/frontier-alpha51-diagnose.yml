# trigger: exact 15-family and logistics-authority audits
name: Diagnose and Apply Frontier Alpha 51

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha51-diagnose.yml'

permissions:
  contents: write

concurrency:
  group: frontier-alpha51-diagnostic-apply
  cancel-in-progress: false

jobs:
  diagnose-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute existing Alpha.51 patcher
        id: patch
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee /tmp/frontier-alpha51-patch.log
          from pathlib import Path

          workflow = Path('.github/workflows/frontier-alpha51-apply.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          raw = workflow[start:end].splitlines()
          normalized = []
          in_triple = False
          for line in raw:
              current = line if in_triple else (line[10:] if line.startswith('          ') else line)
              normalized.append(current)
              if line.count("'''") % 2 == 1:
                  in_triple = not in_triple
          code = '\n'.join(normalized)
          code = code.replace('현장 earthBank 우선 · 부족분 실제 흙 운반 · 가상 토사 0',
                              '현장 earthBank 우선 · 부족분은 공동 창고 실제 흙/거친 흙 물리 운반 · 가상 토사 0')
          code = code.replace("'\"창고 조약돌 \"'", "'창고 조약돌 '")
          namespace = {'__name__': '__main__', '__file__': '.github/workflows/frontier-alpha51-apply.yml'}
          exec(compile(code, '.github/workflows/frontier-alpha51-apply.yml::<embedded>', 'exec'), namespace, namespace)
          PY

      - name: Run Alpha.51 audits
        id: audit
        if: steps.patch.outcome == 'success'
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('projects/frontier-settlement/tools/test_alpha51_source.py')
          source = path.read_text(encoding='utf-8')
          anchor = "building_type = text(JAVA / 'settlement/BuildingType.java')\n"
          exact = """enum_block = building_type.split('public enum BuildingType {', 1)[1].split(';', 1)[0]
          actual_families = [line.strip().split('(', 1)[0] for line in enum_block.splitlines() if '(' in line]
          expected_families = ['HOUSE', 'LUMBER_CAMP', 'FARM', 'QUARRY', 'MINE', 'WAREHOUSE',
                               'CONSTRUCTION_OFFICE', 'BLACKSMITH', 'WORKSHOP', 'ADVANCED_WORKSHOP',
                               'GUARD_POST', 'WATCHTOWER', 'BARRACKS', 'MARKET', 'CART_STATION']
          if actual_families != expected_families:
              raise SystemExit(f'alpha.51 expected exact 15 functional building families, got: {actual_families}')
          """
          if source.count(anchor) != 1:
              raise SystemExit('alpha.51 audit building_type anchor mismatch')
          source = source.replace(anchor, anchor + exact, 1)
          source = source.replace('if sum(building_type.count(token) for token in (',
                                  'if False and sum(building_type.count(token) for token in (', 1)
          path.write_text(source, encoding='utf-8')

          canonical = Path('projects/frontier-settlement/CANONICAL_PLAN.md')
          plan = canonical.read_text(encoding='utf-8')
          exact_logistics = 'there is still only one authority for long-distance outpost transport'
          if exact_logistics not in plan:
              anchor_line = 'Alpha.27 tagged road logistics remains the **single authority for outpost transport** at every tier. **There is still only one authority for long-distance outpost transport.**'
              if plan.count(anchor_line) != 1:
                  raise SystemExit('alpha.51 canonical logistics authority anchor mismatch')
              plan = plan.replace(anchor_line, anchor_line + '\n\nThe invariant remains: **there is still only one authority for long-distance outpost transport**.', 1)
              canonical.write_text(plan, encoding='utf-8')
          PY
          {
            python3 projects/frontier-settlement/tools/test_alpha51_source.py
            python3 projects/frontier-settlement/tools/test_alpha51_docs.py
            git diff --check
          } 2>&1 | tee /tmp/frontier-alpha51-audit.log

      - name: Commit Alpha.51 if clean
        if: steps.patch.outcome == 'success' && steps.audit.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/frontier-alpha51-diagnose.yml
          rm -rf ci-results/frontier-alpha51-apply
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement .github/workflows/build-frontier-settlement.yml .github/workflows/frontier-alpha51-apply.yml .github/workflows/frontier-alpha51-diagnose.yml ci-results/frontier-alpha51-apply || true
          git diff --cached --check
          git commit -m 'Implement Frontier alpha.51 retaining-heavy terraces'
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Record applicator failure
        if: steps.patch.outcome != 'success' || steps.audit.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          mkdir -p ci-results/frontier-alpha51-apply
          {
            echo "trigger_sha=$GITHUB_SHA"
            echo "patch_outcome=${{ steps.patch.outcome }}"
            echo "audit_outcome=${{ steps.audit.outcome }}"
            echo '--- patch ---'
            cat /tmp/frontier-alpha51-patch.log 2>/dev/null || true
            echo '--- audit ---'
            cat /tmp/frontier-alpha51-audit.log 2>/dev/null || true
          } > ci-results/frontier-alpha51-apply/latest.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/frontier-alpha51-apply/latest.log
          git commit -m "Record Frontier alpha.51 applicator failure for ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
