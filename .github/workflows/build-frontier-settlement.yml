name: Build Frontier Settlement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/frontier-settlement/**'
      - '.github/workflows/build-frontier-settlement.yml'

permissions:
  contents: write

concurrency:
  group: frontier-settlement-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/frontier-settlement
  CI_RESULT_DIR: ci-results/frontier-settlement

jobs:
  build:
    name: Java 25 - Frontier Settlement
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Alpha.66 civilian lifecycle authority
        id: bootstrap66
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          if ! test -f "$PROJECT_DIR/tools/apply_alpha66.py"; then
            echo "ALPHA66_BOOTSTRAP=0" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "ALPHA66_BOOTSTRAP=1" >> "$GITHUB_ENV"
          python3 "$PROJECT_DIR/tools/apply_alpha66.py"
          rm -f "$PROJECT_DIR/tools/apply_alpha66.py"
          (cd "$PROJECT_DIR" && python3 tools/test_alpha66_source.py)
          (cd "$PROJECT_DIR" && python3 tools/test_alpha66_docs.py)
          git diff --check
          git status --short "$PROJECT_DIR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$PROJECT_DIR"
          test -n "$(git diff --cached --name-only)"
          git commit -m "Implement Frontier alpha.66 civilian lifecycle authority"
          pushed=0
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
            sleep $((attempt * 2))
          done
          test "$pushed" -eq 1

      - name: Stop bootstrap source run
        if: env.ALPHA66_BOOTSTRAP == '1' && steps.bootstrap66.outcome == 'success'
        shell: bash
        run: |
          echo "Alpha.66 product commit pushed; canonical validation will be triggered separately."
          exit 1

      - name: Bootstrap failure diagnostic
        if: env.ALPHA66_BOOTSTRAP == '1' && steps.bootstrap66.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results/frontier-alpha66-bootstrap
          printf 'Alpha.66 bootstrap failed before product commit. Inspect the workflow step output.\n' > ci-results/frontier-alpha66-bootstrap/latest.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/frontier-alpha66-bootstrap/latest.log
          git commit -m 'Record Frontier alpha.66 bootstrap failure [skip ci]' || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true
          exit 1

      - uses: actions/setup-java@v5
        if: env.ALPHA66_BOOTSTRAP != '1'
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        if: env.ALPHA66_BOOTSTRAP != '1'
        with:
          cache-read-only: false

      - name: Resolve version
        if: env.ALPHA66_BOOTSTRAP != '1'
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' "$PROJECT_DIR/gradle.properties")"
          test -n "$version"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPECTED_JAR=frontier_settlement-$version.jar" >> "$GITHUB_ENV"

      - name: Alpha.66 cumulative source audit
        if: env.ALPHA66_BOOTSTRAP != '1'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_alpha66_source.py 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-source-audit.log"

      - name: Alpha.66 canonical docs audit
        if: env.ALPHA66_BOOTSTRAP != '1'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_alpha66_docs.py 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-docs-audit.log"

      - name: Verify toolchain and committed tree
        if: env.ALPHA66_BOOTSTRAP != '1'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version
          git diff --check
          git diff --exit-code

      - name: Java 25 clean build
        if: env.ALPHA66_BOOTSTRAP != '1'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-gradle.log"

      - name: Verify runtime JAR
        if: env.ALPHA66_BOOTSTRAP != '1'
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR" | tee "$GITHUB_WORKSPACE/frontier-settlement-jar-verify.log"
          test -f "build/libs/$EXPECTED_JAR.sha256"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables/"
          cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables/"

      - uses: actions/upload-artifact@v4
        if: env.ALPHA66_BOOTSTRAP != '1'
        with:
          name: frontier-settlement-${{ env.MOD_VERSION }}-deliverables
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always() && env.ALPHA66_BOOTSTRAP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-${{ env.MOD_VERSION }}-logs
          path: |
            frontier-settlement-source-audit.log
            frontier-settlement-docs-audit.log
            frontier-settlement-gradle.log
            frontier-settlement-jar-verify.log
          if-no-files-found: warn
          retention-days: 14

      - name: Record canonical CI result
        if: always() && env.ALPHA66_BOOTSTRAP != '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/frontier-settlement-result
          mkdir -p /tmp/frontier-settlement-result
          jar_sha256=unknown
          if test -n "${EXPECTED_JAR:-}" && test -f "$PROJECT_DIR/build/libs/$EXPECTED_JAR.sha256"; then
            jar_sha256="$(awk '{print $1}' "$PROJECT_DIR/build/libs/$EXPECTED_JAR.sha256")"
          fi
          cat > /tmp/frontier-settlement-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          docs_sha=$GITHUB_SHA
          source_docs_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          version=${MOD_VERSION:-unknown}
          jar_sha256=$jar_sha256
          minecraft=26.2
          neoforge=26.2.0.38-beta
          java=25
          gradle=9.2.1
          STATUS
          for file in frontier-settlement-source-audit.log frontier-settlement-docs-audit.log frontier-settlement-gradle.log frontier-settlement-jar-verify.log; do
            if test -f "$GITHUB_WORKSPACE/$file"; then cp "$GITHUB_WORKSPACE/$file" "/tmp/frontier-settlement-result/latest-${file#frontier-settlement-}"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/frontier-settlement-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then recorded=1; break; fi
            git commit -m "Record Frontier Settlement ${MOD_VERSION:-unknown} CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then recorded=1; break; fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1
