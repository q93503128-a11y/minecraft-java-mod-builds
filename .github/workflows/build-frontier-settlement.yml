name: Build Frontier Settlement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/frontier-settlement/**'
      - '.github/workflows/build-frontier-settlement.yml'

permissions:
  contents: write

concurrency:
  group: frontier-settlement-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/frontier-settlement

jobs:
  build:
    name: Finalize Frontier Alpha.62
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Finalize Alpha.62 idle local armament
        id: finalize62
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            grep -q '^mod_version=0.1.0-alpha.62$' "$PROJECT_DIR/gradle.properties"
            test -f "$PROJECT_DIR/tools/fix_alpha62_idle_patrol_armament.py"
            echo 'ALPHA62_FINALIZER=1' >> "$GITHUB_ENV"
            python3 "$PROJECT_DIR/tools/fix_alpha62_idle_patrol_armament.py"
            python3 "$PROJECT_DIR/tools/test_alpha62_source.py"
            python3 "$PROJECT_DIR/tools/test_alpha62_docs.py"
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            rm -f "$PROJECT_DIR/tools/fix_alpha62_idle_patrol_armament.py"
            git add -A "$PROJECT_DIR"
            git diff --cached --check
            git commit -m 'Finalize Frontier alpha.62 idle sentry armament priority'
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            test "$pushed" -eq 1
          ) 2>&1 | tee /tmp/frontier-alpha62-finalizer.log

      - name: Record Alpha.62 finalizer failure
        if: steps.finalize62.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          mkdir -p ci-results/frontier-alpha62-finalizer
          cp /tmp/frontier-alpha62-finalizer.log ci-results/frontier-alpha62-finalizer/latest.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/frontier-alpha62-finalizer/latest.log
          git commit -m "Record Frontier alpha.62 finalizer failure for ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 1; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Stop source run after finalizer push
        if: env.ALPHA62_FINALIZER == '1' && steps.finalize62.outcome == 'success'
        shell: bash
        run: exit 1
