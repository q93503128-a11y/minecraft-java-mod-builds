name: Build Frontier Settlement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/frontier-settlement/**'
      - '.github/workflows/build-frontier-settlement.yml'

permissions:
  contents: write

concurrency:
  group: frontier-settlement-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/frontier-settlement

jobs:
  build:
    name: Bootstrap Frontier Alpha.61 Canonical Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix Alpha.61 military armament status consistency
        id: consistency61
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            if ! test -f "$PROJECT_DIR/tools/fix_alpha61_canonical_consistency.py"; then exit 0; fi
            echo 'ALPHA61_CONSISTENCY=1' >> "$GITHUB_ENV"
            python3 "$PROJECT_DIR/tools/fix_alpha61_canonical_consistency.py"
            python3 "$PROJECT_DIR/tools/test_alpha61_source.py"
            python3 "$PROJECT_DIR/tools/test_alpha61_docs.py"
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            rm -f "$PROJECT_DIR/tools/fix_alpha61_canonical_consistency.py"
            git add -A "$PROJECT_DIR"
            git diff --cached --check
            git commit -m 'Fix Frontier alpha.61 canonical armament status'
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              if git pull --rebase origin main && git push origin HEAD:main; then pushed=1; break; fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            test "$pushed" -eq 1
          ) 2>&1 | tee /tmp/frontier-alpha61-consistency.log

      - name: Record Alpha.61 consistency failure
        if: steps.consistency61.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          mkdir -p ci-results/frontier-alpha61-consistency
          cp /tmp/frontier-alpha61-consistency.log ci-results/frontier-alpha61-consistency/latest.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/frontier-alpha61-consistency/latest.log
          git commit -m "Record Frontier alpha.61 consistency failure for ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 1; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Stop source run after consistency push
        if: env.ALPHA61_CONSISTENCY == '1' && steps.consistency61.outcome == 'success'
        shell: bash
        run: exit 1
