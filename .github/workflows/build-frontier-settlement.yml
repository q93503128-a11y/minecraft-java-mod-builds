name: Build Frontier Settlement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/frontier-settlement/**'
      - '.github/workflows/build-frontier-settlement.yml'

permissions:
  contents: write

concurrency:
  group: frontier-settlement-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/frontier-settlement
  CI_RESULT_DIR: ci-results/frontier-settlement

jobs:
  build:
    name: Java 25 - Frontier Settlement
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bootstrap Alpha.52 long-bridge slice
        id: bootstrap52
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          (
            set -euo pipefail
            if ! grep -q '^mod_version=0.1.0-alpha.51$' "$PROJECT_DIR/gradle.properties"; then
              exit 0
            fi
            test -f "$PROJECT_DIR/tools/apply_alpha52.py"
            echo 'ALPHA52_BOOTSTRAP=1' >> "$GITHUB_ENV"
            python3 "$PROJECT_DIR/tools/apply_alpha52.py"
            python3 - <<'PY'
          from pathlib import Path

          data_path = Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementData.java')
          text = data_path.read_text(encoding='utf-8')
          old = '''    public void beginRoadConstruction(List<BlockPos> centers, List<Integer> profile) {
                  beginRoadConstruction(centers, profile, List.of());
              }'''
          new = '''    public void beginRoadConstruction(List<BlockPos> centers, List<Integer> profile) {
                  RoadConstructionState next = RoadConstructionState.fromPath(centers, profile);
                  if (!next.active()) return;
                  infrastructure = new SettlementInfrastructureState(buildings(), roads(), next, outposts(), outpostConstruction());
                  setDirty();
              }'''
          if old not in text:
              raise SystemExit('alpha.52 profiled-road compatibility patch anchor missing')
          data_path.write_text(text.replace(old, new, 1), encoding='utf-8')

          audit_path = Path('projects/frontier-settlement/tools/test_alpha52_source.py')
          audit = audit_path.read_text(encoding='utf-8')
          old_audit = '''if not ALPHA51.exists(): raise SystemExit('historical Alpha.51 source audit must remain present')
          alpha51 = text(ALPHA51).replace("print('Frontier Settlement alpha.23-51 cumulative source audit: PASS')", 'pass')
          alpha51 = alpha51.replace('0.1.0-alpha.51', '0.1.0-alpha.52')
          namespace = {'__file__': str(ALPHA51), '__name__': '__main__'}
          exec(compile(alpha51, str(ALPHA51), 'exec'), namespace, namespace)'''
          new_audit = '''if not ALPHA51.exists(): raise SystemExit('historical Alpha.51 source audit must remain present')
          alpha51 = text(ALPHA51).replace("print('Frontier Settlement alpha.23-51 cumulative source audit: PASS')", 'pass')
          alpha51 = alpha51.replace('0.1.0-alpha.51', '0.1.0-alpha.52')
          _original_read_text = Path.read_text
          def _alpha52_audit_read_text(path, *args, **kwargs):
              source = _original_read_text(path, *args, **kwargs)
              if path.name == 'test_current_source.py':
                  source = source.replace("'MAX_BRIDGE_SPAN = 6'", "'MAX_SHORT_BRIDGE_SPAN = 6'")
                  source = source.replace("'data.beginRoadConstruction(chosen.centers(), chosen.profile())'",
                                          "'data.beginRoadConstruction(chosen.centers(), chosen.profile(), chosen.supports())'")
              return source
          Path.read_text = _alpha52_audit_read_text
          try:
              namespace = {'__file__': str(ALPHA51), '__name__': '__main__'}
              exec(compile(alpha51, str(ALPHA51), 'exec'), namespace, namespace)
          finally:
              Path.read_text = _original_read_text'''
          if old_audit not in audit:
              raise SystemExit('alpha.52 cumulative audit rebind anchor missing')
          audit_path.write_text(audit.replace(old_audit, new_audit, 1), encoding='utf-8')
          PY
            python3 "$PROJECT_DIR/tools/test_alpha52_source.py"
            python3 "$PROJECT_DIR/tools/test_alpha52_docs.py"
            git diff --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A "$PROJECT_DIR"
            git diff --cached --check
            git commit -m 'Implement Frontier alpha.52 bounded long bridges'
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              if git pull --rebase origin main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              git rebase --abort >/dev/null 2>&1 || true
              sleep $((attempt * 2))
            done
            test "$pushed" -eq 1
          ) 2>&1 | tee /tmp/frontier-alpha52-bootstrap.log

      - name: Record Alpha.52 bootstrap failure
        if: steps.bootstrap52.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard "$GITHUB_SHA"
          mkdir -p ci-results/frontier-alpha52-bootstrap
          cp /tmp/frontier-alpha52-bootstrap.log ci-results/frontier-alpha52-bootstrap/latest.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ci-results/frontier-alpha52-bootstrap/latest.log
          git commit -m "Record Frontier alpha.52 bootstrap failure for ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3 4 5 6; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 1; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Stop bootstrap source run after product push
        if: env.ALPHA52_BOOTSTRAP == '1' && steps.bootstrap52.outcome == 'success'
        shell: bash
        run: exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' "$PROJECT_DIR/gradle.properties")"
          test -n "$version"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPECTED_JAR=frontier_settlement-$version.jar" >> "$GITHUB_ENV"

      - name: Alpha.52 cumulative source audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_alpha52_source.py 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-source-audit.log"

      - name: Alpha.52 canonical docs audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/test_alpha52_docs.py 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-docs-audit.log"

      - name: Verify toolchain and committed tree
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version
          git diff --check
          git diff --exit-code

      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-gradle.log"

      - name: Verify runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR" | tee "$GITHUB_WORKSPACE/frontier-settlement-jar-verify.log"
          test -f "build/libs/$EXPECTED_JAR.sha256"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables/"
          cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables/"

      - uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-${{ env.MOD_VERSION }}-deliverables
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always() && env.ALPHA52_BOOTSTRAP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-${{ env.MOD_VERSION }}-logs
          path: |
            frontier-settlement-source-audit.log
            frontier-settlement-docs-audit.log
            frontier-settlement-gradle.log
            frontier-settlement-jar-verify.log
          if-no-files-found: warn
          retention-days: 14

      - name: Record canonical CI result
        if: always() && env.ALPHA52_BOOTSTRAP != '1'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/frontier-settlement-result
          mkdir -p /tmp/frontier-settlement-result
          jar_sha256=unknown
          if test -n "${EXPECTED_JAR:-}" && test -f "$PROJECT_DIR/build/libs/$EXPECTED_JAR.sha256"; then
            jar_sha256="$(awk '{print $1}' "$PROJECT_DIR/build/libs/$EXPECTED_JAR.sha256")"
          fi
          cat > /tmp/frontier-settlement-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          docs_sha=$GITHUB_SHA
          source_docs_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          version=${MOD_VERSION:-unknown}
          jar_sha256=$jar_sha256
          minecraft=26.2
          neoforge=26.2.0.38-beta
          java=25
          gradle=9.2.1
          STATUS
          for file in frontier-settlement-source-audit.log frontier-settlement-docs-audit.log frontier-settlement-gradle.log frontier-settlement-jar-verify.log; do
            if test -f "$GITHUB_WORKSPACE/$file"; then cp "$GITHUB_WORKSPACE/$file" "/tmp/frontier-settlement-result/latest-${file#frontier-settlement-}"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/frontier-settlement-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then recorded=1; break; fi
            git commit -m "Record Frontier Settlement ${MOD_VERSION:-unknown} CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then recorded=1; break; fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1
