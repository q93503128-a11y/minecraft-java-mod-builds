name: Build Frontier Settlement

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/frontier-settlement/**'
      - '.github/workflows/build-frontier-settlement.yml'

permissions:
  contents: write

concurrency:
  group: frontier-settlement-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/frontier-settlement
  CI_RESULT_DIR: ci-results/frontier-settlement

jobs:
  build:
    name: Java 25 - Frontier Settlement
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' "$PROJECT_DIR/gradle.properties")"
          test -n "$version"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPECTED_JAR=frontier_settlement-$version.jar" >> "$GITHUB_ENV"

      - name: Verify toolchain and committed source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version
          python3 tools/test_current_source.py 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-audit.log"
          git diff --check
          git diff --exit-code

      - name: Clean build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-gradle.log"

      - name: Verify runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR" | tee "$GITHUB_WORKSPACE/frontier-settlement-jar-verify.log"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables/"
          cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables/"

      - uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-${{ env.MOD_VERSION }}-deliverables
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-settlement-${{ env.MOD_VERSION }}-logs
          path: |
            frontier-settlement-audit.log
            frontier-settlement-gradle.log
            frontier-settlement-jar-verify.log
          if-no-files-found: warn
          retention-days: 14

      - name: Record canonical CI result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/frontier-settlement-result
          mkdir -p /tmp/frontier-settlement-result
          cat > /tmp/frontier-settlement-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          version=${MOD_VERSION:-unknown}
          minecraft=26.2
          neoforge=26.2.0.38-beta
          java=25
          gradle=9.2.1
          STATUS
          for file in frontier-settlement-audit.log frontier-settlement-gradle.log frontier-settlement-jar-verify.log; do
            if test -f "$GITHUB_WORKSPACE/$file"; then cp "$GITHUB_WORKSPACE/$file" "/tmp/frontier-settlement-result/latest-${file#frontier-settlement-}"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/frontier-settlement-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then recorded=1; break; fi
            git commit -m "Record Frontier Settlement ${MOD_VERSION:-unknown} CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then recorded=1; break; fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1
