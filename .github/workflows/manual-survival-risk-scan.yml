name: Manual Survival Risk Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-risk-scan.yml'

permissions:
  contents: write

jobs:
  fix-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply audited risk fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/survival-ascension')
          java = root / 'src/main/java/kr/moonseungjun/survivalascension'

          # The combined pack's actual Survival bindings are K (menu), J (expedition), V (mobility).
          # Remove stale M/R instructions without touching Frontier Settlement's own controls.
          for p in java.rglob('*.java'):
              s = p.read_text(encoding='utf-8')
              s2 = s.replace('M →', 'K →').replace('M→', 'K→').replace('M 메뉴', 'K 메뉴').replace('M · 통합 메뉴', 'K · 통합 메뉴')
              if s2 != s:
                  p.write_text(s2, encoding='utf-8')

          replacements = {
              java / 'client/GuideScreen.java': [('/ R %s', '/ V %s')],
              java / 'client/SkillsScreen.java': [('R 기동 액션', 'V 기동 액션'), (' · R ', ' · V ')],
              java / 'command/AscensionCommands.java': [(' | R ', ' | V ')],
              java / 'mobility/MobilityProgression.java': [('R · 지상 돌진', 'V · 지상 돌진'), ('공중에서 R을', '공중에서 V를')],
          }
          for p, pairs in replacements.items():
              s = p.read_text(encoding='utf-8')
              for old, new in pairs:
                  s = s.replace(old, new)
              p.write_text(s, encoding='utf-8')

          # High-level area harvesting should use the same reduced-wear contract as mining/bore/woodcutting.
          harvest = java / 'harvesting/HarvestingProgression.java'
          s = harvest.read_text(encoding='utf-8')
          anchor = 'import kr.moonseungjun.survivalascension.progress.SkillClientBridge;'
          if 'import kr.moonseungjun.survivalascension.progress.AutomatedToolBreak;' not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('HarvestingProgression import anchor drift')
              s = s.replace(anchor, 'import kr.moonseungjun.survivalascension.progress.AutomatedToolBreak;\n' + anchor, 1)
          old = '                    player.gameMode.destroyBlock(target);'
          if s.count(old) != 1:
              raise SystemExit(f'HarvestingProgression direct auto-break count drift: {s.count(old)}')
          s = s.replace(old, '                    AutomatedToolBreak.destroyWithReducedWear(player, target);', 1)
          harvest.write_text(s, encoding='utf-8')

          # Fractional durability debt belongs to the current tool type, not the player globally.
          helper = java / 'progress/AutomatedToolBreak.java'
          s = helper.read_text(encoding='utf-8')
          if 'import net.minecraft.core.registries.BuiltInRegistries;' not in s:
              s = s.replace('import net.minecraft.core.BlockPos;\n', 'import net.minecraft.core.BlockPos;\nimport net.minecraft.core.registries.BuiltInRegistries;\n', 1)
          s = s.replace('    private static final String WEAR_BANK_KEY = "survivalascension_bulk_tool_wear_bank";\n',
                        '    private static final String WEAR_BANK_KEY = "survivalascension_bulk_tool_wear_bank";\n    private static final String WEAR_TOOL_KEY = "survivalascension_bulk_tool_wear_tool";\n', 1)
          old = '''        int bank = Math.max(0, player.getPersistentData().getIntOr(WEAR_BANK_KEY, 0));
'''
          new = '''        String toolId = BuiltInRegistries.ITEM.getKey(tool.getItem()).toString();
        String bankToolId = player.getPersistentData().getStringOr(WEAR_TOOL_KEY, "");
        if (!toolId.equals(bankToolId)) {
            player.getPersistentData().putString(WEAR_TOOL_KEY, toolId);
            player.getPersistentData().putInt(WEAR_BANK_KEY, 0);
        }
        int bank = Math.max(0, player.getPersistentData().getIntOr(WEAR_BANK_KEY, 0));
'''
          if old not in s:
              raise SystemExit('AutomatedToolBreak bank anchor drift')
          s = s.replace(old, new, 1)
          helper.write_text(s, encoding='utf-8')

          # Keep the J expedition screen live while it is open instead of freezing the opening snapshot.
          screen = java / 'client/ExpeditionScreen.java'
          s = screen.read_text(encoding='utf-8')
          if 'import kr.moonseungjun.survivalascension.network.ExpeditionSnapshotRequestPayload;' not in s:
              s = s.replace('import kr.moonseungjun.survivalascension.expedition.ExpeditionRegion;\n',
                            'import kr.moonseungjun.survivalascension.expedition.ExpeditionRegion;\nimport kr.moonseungjun.survivalascension.network.ExpeditionSnapshotRequestPayload;\n', 1)
          if 'import net.neoforged.neoforge.client.network.ClientPacketDistributor;' not in s:
              s = s.replace('import net.minecraft.network.chat.Component;\n',
                            'import net.minecraft.network.chat.Component;\nimport net.neoforged.neoforge.client.network.ClientPacketDistributor;\n', 1)
          s = s.replace('    private double scrollOffset;\n    private int maxScroll;\n',
                        '    private double scrollOffset;\n    private int maxScroll;\n    private int refreshTicker;\n', 1)
          tick_anchor = '''    @Override
    public boolean mouseScrolled(double mouseX, double mouseY, double scrollX, double scrollY) {
'''
          tick_method = '''    @Override
    public void tick() {
        super.tick();
        if (++refreshTicker < 20) return;
        refreshTicker = 0;
        if (this.minecraft != null && this.minecraft.player != null && this.minecraft.level != null) {
            ClientPacketDistributor.sendToServer(new ExpeditionSnapshotRequestPayload());
        }
    }

'''
          if tick_method not in s:
              if s.count(tick_anchor) != 1:
                  raise SystemExit('ExpeditionScreen tick anchor drift')
              s = s.replace(tick_anchor, tick_method + tick_anchor, 1)
          screen.write_text(s, encoding='utf-8')

          # Mythic runtime state must not retain an old integrated/dedicated server after shutdown/restart.
          elite = java / 'elite/EliteMobSystem.java'
          s = elite.read_text(encoding='utf-8')
          if 'import net.neoforged.neoforge.event.server.ServerStoppingEvent;' not in s:
              s = s.replace('import net.neoforged.neoforge.event.entity.living.LivingDeathEvent;\n',
                            'import net.neoforged.neoforge.event.entity.living.LivingDeathEvent;\nimport net.neoforged.neoforge.event.server.ServerStoppingEvent;\n', 1)
          old = '            if (runtime.level.getServer() != event.getServer()) continue;'
          new = '''            if (runtime.level.getServer() != event.getServer()) {
                closeMythicBar(runtime);
                remove.add(entry.getKey());
                continue;
            }'''
          if s.count(old) != 1:
              raise SystemExit('EliteMobSystem stale-server anchor drift')
          s = s.replace(old, new, 1)
          stop_anchor = '''    public static void onDamagePre(LivingDamageEvent.Pre event) {
'''
          stop_method = '''    public static void onServerStopping(ServerStoppingEvent event) {
        for (MythicRuntime runtime : new ArrayList<>(MYTHICS.values())) {
            if (runtime.level.getServer() == event.getServer()) closeMythicBar(runtime);
        }
        MYTHICS.entrySet().removeIf(entry -> entry.getValue().level.getServer() == event.getServer());
        mythicTicker = 0;
    }

'''
          if stop_method not in s:
              if s.count(stop_anchor) != 1:
                  raise SystemExit('EliteMobSystem stop anchor drift')
              s = s.replace(stop_anchor, stop_method + stop_anchor, 1)
          elite.write_text(s, encoding='utf-8')

          main = java / 'SurvivalAscension.java'
          s = main.read_text(encoding='utf-8')
          anchor = '        NeoForge.EVENT_BUS.addListener(EliteMobSystem::onServerTick);\n'
          if 'EliteMobSystem::onServerStopping' not in s:
              if s.count(anchor) != 1:
                  raise SystemExit('SurvivalAscension elite stop registration anchor drift')
              s = s.replace(anchor, anchor + '        NeoForge.EVENT_BUS.addListener(EliteMobSystem::onServerStopping);\n', 1)
          main.write_text(s, encoding='utf-8')

          # Extend the persistent focused audit so these regressions stay caught.
          audit = root / 'tools/test_gameplay_qol_061.py'
          s = audit.read_text(encoding='utf-8')
          read_anchor = 'commands = read("src/main/java/kr/moonseungjun/survivalascension/command/AscensionCommands.java")\n'
          extra_reads = '''commands = read("src/main/java/kr/moonseungjun/survivalascension/command/AscensionCommands.java")
harvesting = read("src/main/java/kr/moonseungjun/survivalascension/harvesting/HarvestingProgression.java")
expedition_screen = read("src/main/java/kr/moonseungjun/survivalascension/client/ExpeditionScreen.java")
elite = read("src/main/java/kr/moonseungjun/survivalascension/elite/EliteMobSystem.java")
client = read("src/main/java/kr/moonseungjun/survivalascension/client/SurvivalAscensionClient.java")
'''
          if 'expedition_screen = read(' not in s:
              if s.count(read_anchor) != 1:
                  raise SystemExit('QoL audit read anchor drift')
              s = s.replace(read_anchor, extra_reads, 1)
          check_anchor = 'need(commands, ["case FISHING", "낚싯대 마모 방지"], "fishing command status")\n'
          extra_checks = '''need(commands, ["case FISHING", "낚싯대 마모 방지"], "fishing command status")
need(harvesting, ["AutomatedToolBreak.destroyWithReducedWear(player, target)"], "reduced-wear area harvesting")
need(helper, ["WEAR_TOOL_KEY", "BuiltInRegistries.ITEM.getKey(tool.getItem())", "if (!toolId.equals(bankToolId))"], "per-tool-type bulk wear bank")
need(expedition_screen, ["public void tick()", "refreshTicker < 20", "new ExpeditionSnapshotRequestPayload()"], "live expedition screen refresh")
need(elite, ["onServerStopping(ServerStoppingEvent event)", "remove.add(entry.getKey())"], "mythic runtime server lifecycle")
need(main, ["EliteMobSystem::onServerStopping"], "mythic stop listener wiring")
need(client, ["InputConstants.KEY_K", "InputConstants.KEY_J", "InputConstants.KEY_V"], "canonical client keys")
stale_menu = ["M →", "M→", "M 메뉴", "M · 통합 메뉴"]
stale_mobility = ["R · 지상 돌진", "공중에서 R을", " · R ", " | R ", "/ R %s"]
for label, text in [("guide", guide), ("skills", ui), ("commands", commands), ("mining", mining), ("main", main)]:
    for token in stale_menu:
        if token in text: errors.append(f"{label} stale Survival menu key: {token}")
for label, text in [("guide", guide), ("skills", ui), ("commands", commands)]:
    for token in stale_mobility:
        if token in text: errors.append(f"{label} stale mobility key: {token}")
'''
          if 'reduced-wear area harvesting' not in s:
              if s.count(check_anchor) != 1:
                  raise SystemExit('QoL audit check anchor drift')
              s = s.replace(check_anchor, extra_checks, 1)
          audit.write_text(s, encoding='utf-8')

          # Fail on the known stale guidance patterns across the full Survival Java tree.
          all_java = '\n'.join(p.read_text(encoding='utf-8') for p in java.rglob('*.java'))
          for token in ('M →', 'M→', 'M 메뉴', 'M · 통합 메뉴', 'R · 지상 돌진', '공중에서 R을'):
              if token in all_java:
                  raise SystemExit(f'stale key guidance remains: {token}')

          print('SURVIVAL AUDITED RISK FIXES APPLIED')
          PY
          python3 projects/survival-ascension/tools/test_gameplay_qol_061.py
          git diff --check

      - name: Java 25 clean build
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/survival-ascension/tools/verify_jar.py projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar

      - name: Commit validated fixes and remove temporary scan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git rm .github/workflows/manual-survival-risk-scan.yml
          git add projects/survival-ascension
          git commit -m 'Fix audited Survival gameplay runtime risks'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload fixed Survival JAR
        uses: actions/upload-artifact@v4
        with:
          name: survival-061-audited-risk-fixes
          path: projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          if-no-files-found: error
