name: Manual Survival Risk Scan
# trigger v3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-risk-scan.yml'

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan gameplay-risk patterns
        shell: bash
        run: |
          set -euo pipefail
          ROOT='projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension'
          echo '=== STALE KEY LABELS ==='
          grep -RInE 'M ?→|M 메뉴|M · 통합|R ·| R |R을|R =|/ R ' "$ROOT" || true
          echo '=== DIRECT AUTOMATIC DESTROY CALLS ==='
          grep -RIn 'gameMode.destroyBlock' "$ROOT" || true
          echo '=== STATIC RUNTIME STATE LIFECYCLE ==='
          python3 - <<'PY'
          from pathlib import Path
          root=Path('projects/survival-ascension/src/main/java/kr/moonseungjun/survivalascension')
          for p in sorted(root.rglob('*.java')):
              s=p.read_text(encoding='utf-8')
              if not any(x in s for x in ('static final Map<UUID','static final Set<UUID','static final Deque<')):
                  continue
              marks=[]
              for k in ('onPlayerLoggedOut','onServerStopping','removeStale','getServer() == server','getServer() != server','JOBS.clear()','ACTIVE.clear()','PENDING.clear()'):
                  if k in s: marks.append(k)
              print(f'{p.relative_to(root)} :: '+(', '.join(marks) if marks else 'NO_EXPLICIT_CLEANUP_MARKER'))
          PY
          echo '=== EXPEDITION SNAPSHOT REQUESTS ==='
          grep -RIn 'ExpeditionSnapshotRequestPayload' "$ROOT" || true
          echo '=== HARVEST WEAR PATH ==='
          grep -RInE 'HarvestingProgression|destroyWithReducedWear' "$ROOT/harvesting" "$ROOT/progress/AutomatedToolBreak.java" || true
