name: Fix Living Kingdoms exterior completion gate

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_exterior_completion_gate.py'
      - '.github/workflows/fix-living-kingdoms-exterior-completion-gate.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair storage validation and release ordering
        run: python .github/scripts/fix_living_kingdoms_exterior_completion_gate.py
      - name: Commit Java repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenExteriorTicketReaper.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenKingdomExteriorBuilder.java
          git diff --cached --quiet && exit 0
          git commit -m 'Gate exterior ticket release on physical storage validation'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot repair; remove after Java changes land.
