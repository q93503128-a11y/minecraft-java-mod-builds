name: Manual Audit Alternate Production Depot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-audit-alternate-production-depot.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Apply alternate-depot fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          storage=Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementStorageService.java')
          s=storage.read_text(encoding='utf-8')
          old='''    public static BlockPos findProductionDepositTarget(ServerLevel level, SettlementData data, ItemStack stack) {\n        Set<BlockPos> positions = new LinkedHashSet<>();\n        positions.addAll(SupplyDepotRegistryService.loadedPositions(level, data));\n        positions.addAll(generalStoragePositions(data));\n        for (BlockPos pos : positions) {\n            if (!level.hasChunkAt(pos)) continue;\n            if (!(level.getBlockEntity(pos) instanceof Container container)) continue;\n            if (hasRoom(container, stack)) return pos;\n        }\n        return null;\n    }\n'''
          new='''    public static BlockPos findProductionDepositTarget(ServerLevel level, SettlementData data, ItemStack stack) {\n        return findProductionDepositTargetExcluding(level, data, stack, Set.of());\n    }\n\n    /**\n     * Production hauling must be able to skip a depot that this worker has already proved unreachable.\n     * Otherwise the deterministic shared-depot-first ordering can make a worker retry the same blocked\n     * container forever even while another loaded shared/general container has free space.\n     */\n    public static BlockPos findProductionDepositTargetExcluding(ServerLevel level, SettlementData data,\n                                                                ItemStack stack, Set<BlockPos> excluded) {\n        Set<BlockPos> positions = new LinkedHashSet<>();\n        positions.addAll(SupplyDepotRegistryService.loadedPositions(level, data));\n        positions.addAll(generalStoragePositions(data));\n        for (BlockPos pos : positions) {\n            if (excluded.contains(pos) || !level.hasChunkAt(pos)) continue;\n            if (!(level.getBlockEntity(pos) instanceof Container container)) continue;\n            if (hasRoom(container, stack)) return pos;\n        }\n        return null;\n    }\n'''
          if old not in s:
              if 'findProductionDepositTargetExcluding' not in s:
                  raise SystemExit('storage patch anchor missing')
          else:
              storage.write_text(s.replace(old,new,1),encoding='utf-8')

          worker=Path('projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerService.java')
          s=worker.read_text(encoding='utf-8')
          old='''    private static void deliverToTownStorage(ServerLevel level, SettlementData data,\n                                             FrontierWorkerEntity worker, ItemStack carried) {\n        BlockPos target = SettlementStorageService.findProductionDepositTarget(level, data, carried);\n'''
          new='''    private static void deliverToTownStorage(ServerLevel level, SettlementData data,\n                                             FrontierWorkerEntity worker, ItemStack carried) {\n        Set<BlockPos> excluded = new HashSet<>();\n        Map<BlockPos, Long> blocked = BLOCKED_TARGETS.get(worker.getUUID());\n        if (blocked != null) {\n            long now = level.getGameTime();\n            for (Map.Entry<BlockPos, Long> entry : blocked.entrySet()) {\n                if (entry.getValue() > now) excluded.add(entry.getKey());\n            }\n        }\n        BlockPos target = SettlementStorageService.findProductionDepositTargetExcluding(level, data, carried, excluded);\n'''
          if old not in s:
              if 'findProductionDepositTargetExcluding(level, data, carried, excluded)' not in s:
                  raise SystemExit('worker patch anchor missing')
          else:
              worker.write_text(s.replace(old,new,1),encoding='utf-8')
          print('ALTERNATE PRODUCTION DEPOT PATCH APPLIED')
          PY
      - name: Frontier source audit
        working-directory: projects/frontier-settlement
        run: python3 tools/test_alpha91_source.py
      - name: Build Frontier Settlement
        working-directory: projects/frontier-settlement
        run: ./gradlew --no-daemon --no-configuration-cache clean build --console=plain
      - name: Build Survival Ascension regression
        working-directory: projects/survival-ascension
        run: ./gradlew --no-daemon --no-configuration-cache clean build --console=plain
      - name: Commit validated fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementStorageService.java \
                  projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementWorkerService.java
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git commit -m 'Skip unreachable production depots while hauling'
          git pull --rebase origin main
          git push origin HEAD:main
