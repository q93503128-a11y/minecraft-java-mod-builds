name: TEMP HiddenRubric Lane04 Inherent Evaluator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-inherent-evaluator.yml'

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Mine inherent evaluator submissions
        shell: bash
        run: |
          python - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download

          REPO='lmarena-ai/arena-human-preference-140k'; REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]
          USED={'8c02f215-e1db-48e2-8de8-543ed61bb5b7','0ca2c701-71cf-4afd-9cb0-feb2ec032743','a9970066-e698-49b7-acbd-fa532f4a4c6a','7a07fe1a-620d-478e-8c69-e826d9a91eea','f0622255-dc66-4488-886a-bd57f2321a9c','6022586c-f9d3-4c5a-bb65-c557e616e24f'}
          ACT=r'(?:judges?|jury|competition panel|judging panel|selection committee|review committee|review board|evaluation committee|evaluating committee|grading committee|assessment panel|admissions committee|admissions officers?|admissions team|grant committee|funding committee|grant reviewers?|peer reviewers?|reviewers?|examiners?|teacher marker|module team|hiring managers?|recruiters?)'
          OUT=r'(?:application|cover letter|personal statement|statement of purpose|sop|admissions essay|college essay|essay|assignment|thesis|dissertation|proposal|submission|presentation|slides?|deck|pitch|project|portfolio|paper|manuscript|report|case study|work)'
          req=re.compile(r'\b(?:write|draft|prepare|create|revise|edit|improve|polish|rewrite|develop|generate|make|compose|format|finalize|refine|help me|craft|produce)\b',re.I)
          persona=re.compile(r'\b(?:act as|you are|assume yourself as|pretend (?:you are|to be)|imagine you are|role\s*[:=])\b',re.I)
          patterns=[
            ('submit_to',re.compile(rf'\b(?:submit|present|pitch|send|share)(?:ted|ting|s)?\b.{{0,160}}?\b(?P<object>{OUT})\b.{{0,140}}?\b(?:to|before)\s+(?P<actor>(?:(?:my|our|the|their|a|an)\s+)?{ACT})\b',re.I|re.S)),
            ('output_to_actor',re.compile(rf'\b(?P<object>{OUT})\b.{{0,120}}?\b(?:to|for|before)\s+(?P<actor>(?:(?:my|our|the|their|a|an)\s+)?{ACT})\b',re.I|re.S)),
            ('actor_wants_output',re.compile(rf'\b(?P<actor>(?:(?:my|our|the|their|a|an)\s+)?{ACT})\b.{{0,100}}?\b(?:want|wants|require|requires|ask|asks|asked for|expect|expects)\b.{{0,120}}?\b(?P<object>{OUT})\b',re.I|re.S)),
            ('judges_impress',re.compile(rf'\b(?P<object>{OUT})\b.{{0,180}}?\b(?:impress|convince|win over|appeal to)\s+(?P<actor>(?:(?:my|our|the|their|a|an)\s+)?(?:judges?|jury|selection committee|admissions committee|grant committee|funding committee|hiring managers?))\b',re.I|re.S)),
          ]
          PII=[re.compile(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b',re.I),re.compile(r'\b(?:sk-[A-Za-z0-9_-]{16,}|api[_-]?key\s*[:=])',re.I)]
          def tmsg(m):
            if not isinstance(m,dict):return ''
            if isinstance(m.get('text'),str):return m['text']
            c=m.get('content')
            if isinstance(c,str):return c
            if isinstance(c,list):return '\n'.join(x if isinstance(x,str) else x.get('text','') for x in c if isinstance(x,(str,dict)))
            return ''
          def turns(row):
            out=[]
            for e in row.get('full_conversation') or []:
              if not isinstance(e,dict):continue
              u=e.get('user')
              if isinstance(u,dict):
                t=tmsg(u).strip()
                if t:out.append(t)
              elif str(e.get('role') or '')=='user':
                t=tmsg(e).strip()
                if t:out.append(t)
            return out
          def rkey(row,ts):
            st=row.get('timestamp')
            try:x=int(st.timestamp()*1e9) if hasattr(st,'timestamp') else int(st or 0)
            except:x=0
            return(int(row.get('evaluation_order') or 0),len(ts),x)
          cols=['id','evaluation_session_id','evaluation_order','language','is_code','timestamp','full_conversation'];sessions={};raw=0
          for sh in SHARDS:
            p=hf_hub_download(REPO,filename=sh,repo_type='dataset',revision=REV);pf=pq.ParquetFile(p);use=[c for c in cols if c in pf.schema_arrow.names]
            for b in pf.iter_batches(batch_size=512,columns=use):
              for row in b.to_pylist():
                raw+=1
                if row.get('language')!='en' or bool(row.get('is_code')):continue
                ts=turns(row)
                if not ts:continue
                sid=str(row.get('evaluation_session_id') or row.get('id') or '');k=rkey(row,ts)
                if sid not in sessions or k>sessions[sid][0]:sessions[sid]=(k,row,ts)
          assert raw==135634
          found=[];seen=set()
          for sid,(_,row,ts) in sessions.items():
            for ti,text in enumerate(ts):
              rid=str(row.get('id') or '')
              if rid in USED or not(24<=len(text)<=7000) or any(p.search(text) for p in PII) or not req.search(text):continue
              norm=re.sub(r'\s+',' ',text).strip().lower()
              if norm in seen:continue
              ms=[]
              for name,pat in patterns:
                for m in pat.finditer(text):
                  gd=m.groupdict();s,e=m.span();near=text[max(0,s-180):min(len(text),e+180)]
                  pnear=bool(persona.search(near));score=10+(2 if ti==0 else 0)+(1 if len(text)<1600 else 0)-(5 if pnear else 0)
                  ms.append({'pattern':name,'score':score,'actor':gd['actor'],'object':gd['object'],'match':re.sub(r'\s+',' ',m.group(0)).strip(),'near':re.sub(r'\s+',' ',near).strip(),'personaNear':pnear})
              if not ms:continue
              seen.add(norm);ms.sort(key=lambda x:(-x['score'],len(x['match'])))
              found.append({'sourceRowId':rid,'sourceEvaluationSessionId':sid,'evaluationOrder':int(row.get('evaluation_order') or 0),'turnIndex':ti,'familyTurnCount':len(ts),'sourceLength':len(text),'sourceText':text,'assistantOutputsIncluded':False,**ms[0]})
          found.sort(key=lambda x:(-x['score'],x['sourceLength'],x['sourceRowId']));found=found[:250]
          out=Path('temp-hiddenrubric/lane04/inherent-evaluator');out.mkdir(parents=True,exist_ok=True)
          (out/'full.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in found),encoding='utf-8')
          (out/'compact.jsonl').write_text(''.join(json.dumps({k:x[k] for k in ['sourceRowId','sourceEvaluationSessionId','turnIndex','familyTurnCount','sourceLength','score','pattern','actor','object','match','near','personaNear']},ensure_ascii=False)+'\n' for x in found),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps({'rawRows':raw,'candidateRows':len(found),'assistantOutputsIncluded':False},indent=2)+'\n',encoding='utf-8')
          print('candidates',len(found))
          PY
      - name: Commit inherent evaluator queue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/inherent-evaluator/
          git commit -m 'chore: materialize Lane04 inherent evaluator queue' || exit 0
          git push origin HEAD:main
