name: Manual Survival Gameplay QoL Pass
# registered gameplay-qol validation trigger

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-survival-gameplay-qol-pass.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Apply gameplay pass
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply_survival_gameplay_qol.py
          python3 projects/survival-ascension/tools/test_gameplay_qol_061.py
          git diff --check

      - name: Java 25 clean build
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Verify JAR
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/survival-ascension/tools/verify_jar.py projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar

      - name: Commit validated gameplay pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'coworkaccount'
          git config user.email 'cyp1jhh2@gmail.com'
          git add projects/survival-ascension
          git commit -m 'Retune Survival progression mining wear and fishing skill'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload patched Survival JAR
        uses: actions/upload-artifact@v4
        with:
          name: survival-061-gameplay-qol-pass
          path: projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          if-no-files-found: error
