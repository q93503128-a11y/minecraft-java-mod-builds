name: Build Village Guardians v0.18.2 Final Validation

on:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger-v0182-final'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: projects/village-guardians
  EXPECTED_JAR: villageguardians-0.18.2-alpha.1.jar
  PUBLISHED_DIR: published/village-guardians
  RESULT_DIR: ci-results/village-guardians-v0182

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply v0.18.2 runtime patch and migrate legacy contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/v0182/apply.py tools/v0182/compat_tests.py
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent
          import runpy
          path = Path('tools/v0182/apply.py')
          runpy.run_path(str(path), init_globals={'dedent': dedent}, run_name='__main__')
          PY
          python3 tools/v0182/compat_tests.py
          git diff -- . ':!tools/v0182' > "$GITHUB_WORKSPACE/village-guardians-v0182-patch.diff"

      - name: Run complete contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          {
            status=0
            while IFS= read -r test; do
              echo "=== $test ==="
              python3 "$test" || status=1
            done < <(find tools -maxdepth 1 -type f -name 'test_*.py' | sort)
            exit "$status"
          } 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0182-contracts.log"

      - name: Build Java 25 JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0182-gradle.log"

      - name: Verify artifact, ZIP integrity and bytecode
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          test -f "build/libs/$EXPECTED_JAR.sha256"
          unzip -t "build/libs/$EXPECTED_JAR" > "$GITHUB_WORKSPACE/village-guardians-v0182-unzip.log"
          unzip -l "build/libs/$EXPECTED_JAR" | grep -q 'VillageEquipmentIdentity.class'
          unzip -l "build/libs/$EXPECTED_JAR" | grep -q 'VillageMercenarySnapshotData.class'
          python3 - <<'PY'
          import struct, zipfile
          jar = 'build/libs/villageguardians-0.18.2-alpha.1.jar'
          majors = set()
          with zipfile.ZipFile(jar) as zf:
              for name in zf.namelist():
                  if name.endswith('.class') and name.startswith('kr/moonseungjun/villageguardians/'):
                      data = zf.read(name)[:8]
                      if data[:4] != b'\xca\xfe\xba\xbe':
                          raise SystemExit(f'Invalid class header: {name}')
                      majors.add(struct.unpack('>H', data[6:8])[0])
          if majors != {69}:
              raise SystemExit(f'Expected Java 25 class major 69, got {sorted(majors)}')
          print('Java 25 bytecode major=69 verified for Village Guardians classes.')
          PY
          javap -classpath "build/libs/$EXPECTED_JAR" -c -p \
            kr.moonseungjun.villageguardians.VillageEquipmentShop \
            kr.moonseungjun.villageguardians.VillageTradingSystem \
            kr.moonseungjun.villageguardians.VillageRelicSystem \
            kr.moonseungjun.villageguardians.VillageRaidSystem \
            kr.moonseungjun.villageguardians.VillageRespawnSystem \
            kr.moonseungjun.villageguardians.VillageRoleSkillSystem \
            kr.moonseungjun.villageguardians.VillageEquipmentIdentity \
            kr.moonseungjun.villageguardians.VillageMercenarySnapshotData \
            > "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'saleValue' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'hasPendingChoice' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'shouldDiscardStaleRaidEnemy' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'handleFinalDamage' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"
          grep -q 'stampRarity' "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log"

      - name: Upload diagnostic or release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.18.2-alpha.1-final
          path: |
            village-guardians-v0182-patch.diff
            village-guardians-v0182-contracts.log
            village-guardians-v0182-gradle.log
            village-guardians-v0182-bytecode.log
            village-guardians-v0182-unzip.log
            projects/village-guardians/build/libs/villageguardians-0.18.2-alpha.1.jar
            projects/village-guardians/build/libs/villageguardians-0.18.2-alpha.1.jar.sha256
          if-no-files-found: warn
          retention-days: 30

      - name: Publish verified source and JAR directly to main
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$PROJECT_DIR/tools/v0182"
          rm -f .github/workflows/build-village-guardians-v0182.yml \
                .github/workflows/build-village-guardians-v0182-retry.yml \
                .github/workflows/build-village-guardians-v0182-debug.yml \
                .github/workflows/build-village-guardians-v0182-final.yml \
                .github/workflows/apply-village-guardians-v0173-source.yml
          rm -f "$PROJECT_DIR/.build-trigger-v0182" \
                "$PROJECT_DIR/.build-trigger-v0182-retry" \
                "$PROJECT_DIR/.build-trigger-v0182-debug" \
                "$PROJECT_DIR/.build-trigger-v0182-final" \
                "$PROJECT_DIR/.apply-trigger-v0173" \
                "$PROJECT_DIR/.inspect-trigger-v0173" \
                "$PROJECT_DIR/.active-slot-trigger-v0173"
          find "$PROJECT_DIR" -maxdepth 1 -type f \( \
                -name '.build-trigger-v017*' -o \
                -name '.build-trigger-v0180*' -o \
                -name '.build-trigger-v0181*' \) -delete
          rm -f "$PROJECT_DIR/tools/apply_v0172_compat_prepatch.py" \
                "$PROJECT_DIR/tools/apply_v0172_progression_audit.py" \
                "$PROJECT_DIR/tools/apply_v0173_ui_cleanup.py" \
                "$PROJECT_DIR/tools/apply_v0174_ui_safety.py"
          find "$PROJECT_DIR/tools" -type d -name '__pycache__' -prune -exec rm -rf {} +

          mkdir -p "$PUBLISHED_DIR" "$RESULT_DIR"
          rm -f "$PUBLISHED_DIR/villageguardians-0.18.1-alpha.1.jar" \
                "$PUBLISHED_DIR/villageguardians-0.18.1-alpha.1.jar.sha256"
          cp "$PROJECT_DIR/build/libs/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
          cp "$PROJECT_DIR/build/libs/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-contracts.log" "$RESULT_DIR/latest-contracts.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-gradle.log" "$RESULT_DIR/latest-gradle.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-bytecode.log" "$RESULT_DIR/bytecode.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-unzip.log" "$RESULT_DIR/unzip.log"
          cp "$GITHUB_WORKSPACE/village-guardians-v0182-patch.diff" "$RESULT_DIR/applied.patch"
          cat > "$RESULT_DIR/status.txt" <<EOF
          status=success
          trigger_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          java=25
          gradle=9.2.1
          version=0.18.2-alpha.1
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A "$PROJECT_DIR" "$PUBLISHED_DIR" "$RESULT_DIR" .github/workflows
          git commit -m 'Apply Village Guardians v0.18.2 runtime stability overhaul'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
