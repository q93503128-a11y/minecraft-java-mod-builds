name: Render Authored Gacha Door Storyboard

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-gacha-itch-door.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - name: Acquire public CC0 spaceship hallway source
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/projects/test/build/gacha-door-storyboard"
          mkdir -p "$OUT"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          cat > "$GITHUB_WORKSPACE/fetch-source.mjs" <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto('https://marin1234.itch.io/asset-jam-space-hallways/purchase', {waitUntil:'domcontentloaded', timeout:120000});
          await page.getByText('No thanks, just take me to the downloads', {exact:false}).click({timeout:30000});
          await page.waitForLoadState('domcontentloaded');
          let target = page.locator('a').filter({hasText:'assets spaceship.zip'}).first();
          if (await target.count() === 0) target = page.locator('a.download_btn').first();
          const p = page.waitForEvent('download', {timeout:60000});
          await target.click();
          const d = await p;
          await d.saveAs(`${out}/source.zip`);
          fs.writeFileSync(`${out}/provenance.json`, JSON.stringify({title:'asset jam spaceship hallways',author:'marin1234',source:'https://marin1234.itch.io/asset-jam-space-hallways',license:'CC0 1.0 Universal',ai:'No generative AI used'},null,2));
          await browser.close();
          JS
          OUT="$OUT" node "$GITHUB_WORKSPACE/fetch-source.mjs"
          unzip -q "$OUT/source.zip" -d "$OUT/src"
          BLEND=$(find "$OUT/src" -type f -iname '*.blend' ! -iname '*.blend1' | head -n 1)
          cp "$BLEND" "$OUT/source.blend"

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy xvfb >/dev/null

      - name: Render real authored door animation frames
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/projects/test/build/gacha-door-storyboard"
          cat > /tmp/render_storyboard.py <<'PY'
          import bpy, json, sys
          from pathlib import Path
          from mathutils import Vector

          src=Path(sys.argv[sys.argv.index('--')+1]); out=Path(sys.argv[sys.argv.index('--')+2])
          bpy.ops.wm.open_mainfile(filepath=str(src))
          scene=bpy.context.scene
          arm=bpy.data.objects.get('Armature')
          act=bpy.data.actions.get('door')
          if not arm or not act: raise RuntimeError('authored door rig/action missing')
          if arm.animation_data is None: arm.animation_data_create()
          arm.animation_data.action=act

          # Hide author asset-layout collection; keep actual corridor scene only.
          assets=bpy.data.collections.get('assets')
          if assets: assets.hide_render=True
          for o in list(bpy.data.objects):
              if o.type in {'CAMERA','LIGHT'}: bpy.data.objects.remove(o,do_unlink=True)

          try: scene.render.engine='BLENDER_EEVEE_NEXT'
          except: scene.render.engine='BLENDER_EEVEE'
          scene.render.resolution_x=960; scene.render.resolution_y=540; scene.render.resolution_percentage=100
          scene.render.image_settings.file_format='PNG'; scene.render.film_transparent=False
          scene.view_settings.exposure=.6
          scene.world.use_nodes=True
          bg=scene.world.node_tree.nodes.get('Background'); bg.inputs['Color'].default_value=(.002,.003,.008,1); bg.inputs['Strength'].default_value=.08

          def point(o,t): o.rotation_euler=(Vector(t)-o.location).to_track_quat('-Z','Y').to_euler()
          # Long-lens corridor composition aimed at the authored door at y=6.5.
          cd=bpy.data.cameras.new('GachaCamera'); cam=bpy.data.objects.new('GachaCamera',cd); bpy.context.scene.collection.objects.link(cam); scene.camera=cam
          cam.location=(0.0,-0.4,1.65); cam.data.lens=31; point(cam,(0.0,6.5,1.55))

          # Physical lighting only; no screen-space shapes.
          for name,loc,energy,color,size in [
              ('CoolKey',(-2.0,2.2,3.4),760,(.36,.50,1.0),2.4),
              ('DoorRim',(2.2,5.2,2.4),1050,(.14,.28,1.0),1.7),
              ('FloorFill',(0.0,1.8,.35),430,(.18,.24,.50),2.2),
          ]:
              d=bpy.data.lights.new(name,'AREA'); d.energy=energy; d.color=color; d.shape='DISK'; d.size=size
              o=bpy.data.objects.new(name,d); bpy.context.scene.collection.objects.link(o); o.location=loc; point(o,(0,6.0,1.4))

          frames=[(200,'01_closed.png'),(260,'02_unlocking.png'),(310,'03_opening.png'),(346,'04_open.png')]
          for frame,name in frames:
              scene.frame_set(frame)
              scene.render.filepath=str(out/name)
              bpy.ops.render.render(write_still=True)
          meta={'action':'door','frame_range':[float(act.frame_range[0]),float(act.frame_range[1])],'frames':[x[0] for x in frames],'camera_location':list(cam.location)}
          (out/'storyboard.json').write_text(json.dumps(meta,indent=2),encoding='utf-8')
          bpy.ops.wm.save_as_mainfile(filepath=str(out/'authored-door-storyboard.blend'))
          PY
          xvfb-run -a blender --background --python /tmp/render_storyboard.py -- "$OUT/source.blend" "$OUT"
          test -s "$OUT/01_closed.png"
          test -s "$OUT/04_open.png"

      - name: Upload storyboard
        uses: actions/upload-artifact@v4
        with:
          name: gacha-authored-door-storyboard-${{ github.run_number }}
          path: |
            projects/test/build/gacha-door-storyboard/provenance.json
            projects/test/build/gacha-door-storyboard/storyboard.json
            projects/test/build/gacha-door-storyboard/01_closed.png
            projects/test/build/gacha-door-storyboard/02_unlocking.png
            projects/test/build/gacha-door-storyboard/03_opening.png
            projects/test/build/gacha-door-storyboard/04_open.png
            projects/test/build/gacha-door-storyboard/authored-door-storyboard.blend
          if-no-files-found: error
          retention-days: 14
