name: Inspect Authored Gacha Door Scene

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-gacha-itch-door.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Acquire public CC0 spaceship hallway source
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/projects/test/build/gacha-door-scene"
          mkdir -p "$OUT"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          cat > "$GITHUB_WORKSPACE/fetch-source.mjs" <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto('https://marin1234.itch.io/asset-jam-space-hallways/purchase', {waitUntil:'domcontentloaded', timeout:120000});
          await page.getByText('No thanks, just take me to the downloads', {exact:false}).click({timeout:30000});
          await page.waitForLoadState('domcontentloaded');
          await page.waitForTimeout(800);
          let target = page.locator('a').filter({hasText:'assets spaceship.zip'}).first();
          if (await target.count() === 0) target = page.locator('a.download_btn').first();
          if (await target.count() === 0) throw new Error('public download button not found');
          const p = page.waitForEvent('download', {timeout:60000});
          await target.click();
          const d = await p;
          await d.saveAs(`${out}/source.zip`);
          fs.writeFileSync(`${out}/provenance.json`, JSON.stringify({
            title:'asset jam spaceship hallways', author:'marin1234',
            source:'https://marin1234.itch.io/asset-jam-space-hallways',
            license:'CC0 1.0 Universal', ai:'No generative AI used',
            method:'normal public itch.io free-download UI'
          }, null, 2));
          await browser.close();
          JS
          OUT="$OUT" node "$GITHUB_WORKSPACE/fetch-source.mjs"
          unzip -q "$OUT/source.zip" -d "$OUT/src"
          BLEND=$(find "$OUT/src" -type f -iname '*.blend' ! -iname '*.blend1' | head -n 1)
          test -n "$BLEND"
          cp "$BLEND" "$OUT/source.blend"

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy xvfb >/dev/null

      - name: Inspect real Blender scene
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/projects/test/build/gacha-door-scene"
          cat > /tmp/inspect_scene.py <<'PY'
          import bpy, json, sys
          from pathlib import Path
          src=Path(sys.argv[sys.argv.index('--')+1]); out=Path(sys.argv[sys.argv.index('--')+2])
          bpy.ops.wm.open_mainfile(filepath=str(src))
          objects=[]
          for o in bpy.data.objects:
              objects.append({
                  'name':o.name,'type':o.type,'parent':o.parent.name if o.parent else None,
                  'collection':[c.name for c in o.users_collection],
                  'location':[round(v,4) for v in o.location],
                  'rotation':[round(v,4) for v in o.rotation_euler],
                  'scale':[round(v,4) for v in o.scale],
                  'materials':[m.name if m else None for m in getattr(o.data,'materials',[])] if hasattr(o.data,'materials') else []
              })
          data={
              'scene':bpy.context.scene.name,
              'frame_start':bpy.context.scene.frame_start,
              'frame_end':bpy.context.scene.frame_end,
              'camera':bpy.context.scene.camera.name if bpy.context.scene.camera else None,
              'collections':[c.name for c in bpy.data.collections],
              'actions':[{'name':a.name,'frame_range':[float(a.frame_range[0]),float(a.frame_range[1])]} for a in bpy.data.actions],
              'objects':objects,
              'door_candidates':[x for x in objects if any(k in x['name'].lower() for k in ['door','gate','lock','panel'])],
              'light_candidates':[x for x in objects if x['type']=='LIGHT' or 'light' in x['name'].lower()],
          }
          (out/'scene-structure.json').write_text(json.dumps(data,indent=2),encoding='utf-8')
          with (out/'object-names.txt').open('w') as f:
              for x in objects: f.write(f"{x['type']}\t{x['name']}\tparent={x['parent']}\tcollections={','.join(x['collection'])}\n")
          PY
          xvfb-run -a blender --background --python /tmp/inspect_scene.py -- "$OUT/source.blend" "$OUT"
          test -s "$OUT/scene-structure.json"

      - name: Upload scene structure
        uses: actions/upload-artifact@v4
        with:
          name: gacha-authored-door-structure-${{ github.run_number }}
          path: |
            projects/test/build/gacha-door-scene/provenance.json
            projects/test/build/gacha-door-scene/scene-structure.json
            projects/test/build/gacha-door-scene/object-names.txt
          if-no-files-found: error
          retention-days: 14
