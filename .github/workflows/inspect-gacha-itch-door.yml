name: Inspect Gacha CC0 Door

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-gacha-itch-door.yml'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download public CC0 asset through normal itch.io UI
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/projects/test/build/gacha-itch-source"
          mkdir -p "$OUT"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          cat > "$GITHUB_WORKSPACE/fetch-itch.mjs" <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto('https://marin1234.itch.io/asset-jam-space-hallways/purchase', {waitUntil:'domcontentloaded', timeout:120000});
          await page.getByText('No thanks, just take me to the downloads', {exact:false}).click({timeout:30000});
          await page.waitForLoadState('domcontentloaded');
          await page.waitForTimeout(1000);
          const links = await page.locator('a').evaluateAll(xs => xs.map(a => ({text:(a.textContent||'').trim(), href:a.href})).filter(x => x.text || x.href));
          fs.writeFileSync(`${out}/download-page-links.json`, JSON.stringify(links, null, 2));
          let target = page.locator('a').filter({hasText:'assets spaceship.zip'}).first();
          if (await target.count() === 0) target = page.locator('a.download_btn').first();
          if (await target.count() === 0) throw new Error('No downloadable asset link found after public free-download step');
          const downloadPromise = page.waitForEvent('download', {timeout:60000});
          await target.click();
          const download = await downloadPromise;
          await download.saveAs(`${out}/assets-spaceship.zip`);
          fs.writeFileSync(`${out}/source.json`, JSON.stringify({
            title:'asset jam spaceship hallways',
            author:'marin1234',
            source:'https://marin1234.itch.io/asset-jam-space-hallways',
            license:'CC0',
            license_evidence:'Asset Pack Jam requires CC0 or similar; project page states free under CC0',
            download_method:'normal public itch.io free-download UI; no authentication or bypass',
            filename:download.suggestedFilename()
          }, null, 2));
          await browser.close();
          JS
          OUT="$OUT" node "$GITHUB_WORKSPACE/fetch-itch.mjs"
          test -s "$OUT/assets-spaceship.zip"
          unzip -t "$OUT/assets-spaceship.zip" >/dev/null
          unzip -l "$OUT/assets-spaceship.zip" > "$OUT/file-list.txt"
          sha256sum "$OUT/assets-spaceship.zip" > "$OUT/assets-spaceship.zip.sha256"

      - name: Upload source inventory
        uses: actions/upload-artifact@v4
        with:
          name: gacha-cc0-source-${{ github.run_number }}
          path: |
            projects/test/build/gacha-itch-source/assets-spaceship.zip
            projects/test/build/gacha-itch-source/assets-spaceship.zip.sha256
            projects/test/build/gacha-itch-source/file-list.txt
            projects/test/build/gacha-itch-source/source.json
            projects/test/build/gacha-itch-source/download-page-links.json
          if-no-files-found: error
          retention-days: 14
