name: Render Authored Gacha Runtime Layers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-gacha-itch-door.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4

      - name: Acquire public CC0 spaceship hallway source
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/projects/test/build/gacha-runtime-layers"
          mkdir -p "$OUT"
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          cat > "$GITHUB_WORKSPACE/fetch-source.mjs" <<'JS'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out = process.env.OUT;
          const browser = await chromium.launch({headless:true});
          const page = await browser.newPage({acceptDownloads:true});
          await page.goto('https://marin1234.itch.io/asset-jam-space-hallways/purchase', {waitUntil:'domcontentloaded', timeout:120000});
          await page.getByText('No thanks, just take me to the downloads', {exact:false}).click({timeout:30000});
          await page.waitForLoadState('domcontentloaded');
          let target = page.locator('a').filter({hasText:'assets spaceship.zip'}).first();
          if (await target.count() === 0) target = page.locator('a.download_btn').first();
          if (await target.count() === 0) throw new Error('public source download not found');
          const p = page.waitForEvent('download', {timeout:60000});
          await target.click();
          const d = await p;
          await d.saveAs(`${out}/source.zip`);
          fs.writeFileSync(`${out}/provenance.json`, JSON.stringify({
            title:'asset jam spaceship hallways',
            author:'marin1234',
            source:'https://marin1234.itch.io/asset-jam-space-hallways',
            license:'CC0 1.0 Universal',
            ai:'No generative AI used',
            acquisition:'normal public itch.io free-download UI; no authentication or bypass'
          }, null, 2));
          await browser.close();
          JS
          OUT="$OUT" node "$GITHUB_WORKSPACE/fetch-source.mjs"
          unzip -q "$OUT/source.zip" -d "$OUT/src"
          BLEND=$(find "$OUT/src" -type f -iname '*.blend' ! -iname '*.blend1' | head -n 1)
          test -n "$BLEND"
          cp "$BLEND" "$OUT/source.blend"

      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y blender python3-numpy xvfb >/dev/null

      - name: Render physical backgrounds and authored door layers
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/projects/test/build/gacha-runtime-layers"
          cat > /tmp/render_layers.py <<'PY'
          import bpy, json, sys
          from pathlib import Path
          from mathutils import Vector

          src = Path(sys.argv[sys.argv.index('--') + 1])
          out = Path(sys.argv[sys.argv.index('--') + 2])
          bpy.ops.wm.open_mainfile(filepath=str(src))
          scene = bpy.context.scene
          arm = bpy.data.objects.get('Armature')
          action = bpy.data.actions.get('door')
          door = bpy.data.objects.get('door.001')
          if not arm or not action or not door:
              raise RuntimeError('authored door rig/action/door.001 missing')
          if arm.animation_data is None:
              arm.animation_data_create()
          arm.animation_data.action = action

          assets = bpy.data.collections.get('assets')
          if assets:
              assets.hide_render = True
          for obj in list(bpy.data.objects):
              if obj.type in {'CAMERA', 'LIGHT'}:
                  bpy.data.objects.remove(obj, do_unlink=True)

          try:
              scene.render.engine = 'BLENDER_EEVEE_NEXT'
          except Exception:
              scene.render.engine = 'BLENDER_EEVEE'
          scene.render.resolution_x = 960
          scene.render.resolution_y = 540
          scene.render.resolution_percentage = 100
          scene.render.image_settings.file_format = 'PNG'
          scene.render.image_settings.color_mode = 'RGBA'
          scene.render.image_settings.compression = 35
          scene.world.use_nodes = True
          world_bg = scene.world.node_tree.nodes.get('Background')
          world_bg.inputs['Color'].default_value = (.002, .003, .008, 1)
          world_bg.inputs['Strength'].default_value = .06

          def point_at(obj, target):
              obj.rotation_euler = (Vector(target) - obj.location).to_track_quat('-Z', 'Y').to_euler()

          camera_data = bpy.data.cameras.new('GachaCamera')
          camera = bpy.data.objects.new('GachaCamera', camera_data)
          bpy.context.scene.collection.objects.link(camera)
          scene.camera = camera
          camera.location = (0.0, -0.4, 1.65)
          camera.data.lens = 31
          point_at(camera, (0.0, 6.5, 1.55))

          lights = {}
          def add_area(name, location, energy, color, size, target=(0, 6.0, 1.4)):
              data = bpy.data.lights.new(name, 'AREA')
              data.energy = energy
              data.color = color
              data.shape = 'DISK'
              data.size = size
              obj = bpy.data.objects.new(name, data)
              bpy.context.scene.collection.objects.link(obj)
              obj.location = location
              point_at(obj, target)
              lights[name] = obj
              return obj

          add_area('CoolKey', (-2.0, 2.2, 3.4), 760, (.36, .50, 1.0), 2.4)
          add_area('DoorRim', (2.2, 5.2, 2.4), 1050, (.14, .28, 1.0), 1.7)
          add_area('FloorFill', (0.0, 1.8, .35), 430, (.18, .24, .50), 2.2)
          breach_data = bpy.data.lights.new('BreachLight', 'POINT')
          breach_data.energy = 0
          breach_data.color = (1.0, .62, .15)
          breach_data.shadow_soft_size = 1.15
          breach = bpy.data.objects.new('BreachLight', breach_data)
          bpy.context.scene.collection.objects.link(breach)
          breach.location = (0.0, 7.1, 1.65)

          base_energy = {name: obj.data.energy for name, obj in lights.items()}
          base_color = {name: tuple(obj.data.color) for name, obj in lights.items()}
          scene.frame_set(200)
          door.hide_render = True
          scene.render.film_transparent = False

          def restore_base():
              scene.view_settings.exposure = .58
              world_bg.inputs['Strength'].default_value = .06
              breach.data.energy = 0
              for name, obj in lights.items():
                  obj.data.energy = base_energy[name]
                  obj.data.color = base_color[name]

          def render_background(filename, mode):
              restore_base()
              if mode == 'rare':
                  lights['CoolKey'].data.color = (.48, .20, 1.0)
                  lights['DoorRim'].data.color = (.72, .16, 1.0)
                  lights['FloorFill'].data.color = (.30, .12, .65)
              elif mode == 'dark':
                  scene.view_settings.exposure = -1.05
                  world_bg.inputs['Strength'].default_value = .015
                  for obj in lights.values():
                      obj.data.energy *= .07
              elif mode == 'legendary':
                  scene.view_settings.exposure = .78
                  lights['CoolKey'].data.energy *= .38
                  lights['DoorRim'].data.energy *= .32
                  lights['FloorFill'].data.energy *= .25
                  breach.data.energy = 1850
                  breach.data.color = (1.0, .64, .18)
              scene.render.filepath = str(out / filename)
              bpy.ops.render.render(write_still=True)

          render_background('background_normal.png', 'normal')
          render_background('background_rare.png', 'rare')
          render_background('background_dark.png', 'dark')
          render_background('background_legendary.png', 'legendary')

          # Door-only transparent authored animation frames. All identity comes from the original model/action.
          restore_base()
          scene.view_settings.exposure = .58
          scene.render.film_transparent = True
          door.hide_render = False
          original_mesh_visibility = {}
          for obj in bpy.context.scene.objects:
              if obj.type == 'MESH':
                  original_mesh_visibility[obj.name] = obj.hide_render
                  obj.hide_render = (obj != door)

          sample_frames = [200, 205, 211, 216, 222, 227, 233, 238, 244, 249, 255, 260]
          for index, frame in enumerate(sample_frames):
              scene.frame_set(frame)
              scene.render.filepath = str(out / f'door_{index:02d}.png')
              bpy.ops.render.render(write_still=True)

          for name, hidden in original_mesh_visibility.items():
              obj = bpy.data.objects.get(name)
              if obj:
                  obj.hide_render = hidden

          metadata = {
              'source_action': 'door',
              'source_action_range': [float(action.frame_range[0]), float(action.frame_range[1])],
              'runtime_open_segment': [200, 260],
              'sample_frames': sample_frames,
              'door_object': door.name,
              'resolution': [960, 540],
              'backgrounds': ['background_normal.png', 'background_rare.png', 'background_dark.png', 'background_legendary.png'],
              'method': 'Blender-rendered authored model and animation; runtime code only sequences textures'
          }
          (out / 'runtime-layers.json').write_text(json.dumps(metadata, indent=2), encoding='utf-8')
          bpy.ops.wm.save_as_mainfile(filepath=str(out / 'gacha-runtime-source.blend'))
          PY
          xvfb-run -a blender --background --python /tmp/render_layers.py -- "$OUT/source.blend" "$OUT"
          test -s "$OUT/background_normal.png"
          test -s "$OUT/background_legendary.png"
          test -s "$OUT/door_00.png"
          test -s "$OUT/door_11.png"

      - name: Upload runtime layers
        uses: actions/upload-artifact@v4
        with:
          name: gacha-authored-runtime-layers-${{ github.run_number }}
          path: |
            projects/test/build/gacha-runtime-layers/provenance.json
            projects/test/build/gacha-runtime-layers/runtime-layers.json
            projects/test/build/gacha-runtime-layers/background_*.png
            projects/test/build/gacha-runtime-layers/door_*.png
            projects/test/build/gacha-runtime-layers/gacha-runtime-source.blend
          if-no-files-found: error
          retention-days: 14
