name: TEMP HiddenRubric Lane04 Open Relation Mine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-open-relation-mine.yml'

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Mine open relation candidates
        run: python temp-hiddenrubric/lane04/open_relation_mine.py
      - name: Commit temporary open relation queue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/open-relation-*.jsonl temp-hiddenrubric/lane04/open-relation-manifest.json
          git commit -m 'chore: materialize temporary Lane04 open-relation queue'
          git push origin HEAD:main
