name: Validate Living Kingdoms regional society r1

on:
  push:
    branches: [codex/living-kingdoms-regional-society-r1]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/validate-living-kingdoms-regional-society-r1.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/validate-living-kingdoms-regional-society-r1.yml'

concurrency:
  group: living-kingdoms-regional-society-r1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '1'

jobs:
  validate:
    name: Java 25 regional society pre-main audit
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build --stacktrace --console=plain

      - name: Fresh dedicated server regional society audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          rm -rf run/world run/living_realm run/livingkingdoms-regional-society-ci-world
          printf 'level-name=livingkingdoms-regional-society-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/regional-society-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          passed=0
          for attempt in $(seq 1 1200); do
            if grep -Eq 'LK_REALM_DIAGNOSTIC_FAIL|Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError|Invalid Erden regional society' ../../logs/regional-society-server.log; then
              cat ../../logs/regional-society-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_REGIONAL_SETTLEMENT_PASS revision=1 settlements=6 buildings=60' ../../logs/regional-society-server.log \
              && grep -Fq 'LK_ERDEN_REGIONAL_SOCIETY_PASS revision=1 settlements=6 households=48 residents=144 workers=96 dependents=48' ../../logs/regional-society-server.log \
              && grep -Fq 'LK_ERDEN_POPULATION_DIAGNOSTIC_PASS households=77 residents=231 workers=154' ../../logs/regional-society-server.log \
              && grep -Fq 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/regional-society-server.log \
              && grep -Fq 'LK_ERDEN_LIVING_ECONOMY_PASS revision=1 households=77 shops=50' ../../logs/regional-society-server.log \
              && grep -Fq 'LK_ERDEN_TRANSPORT_PASS revision=2 manifests=' ../../logs/regional-society-server.log \
              && grep -Fq 'LK_ERDEN_EXTERIOR_WORKFORCE_PASS revision=1 nodes=18 households=74 residents=216 workers=142 dependents=74' ../../logs/regional-society-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/regional-society-server.log
              exit 1
            fi
            sleep 1
          done
          cat ../../logs/regional-society-server.log
          test "$passed" -eq 1
          grep -F 'LK_ERDEN_REGIONAL_SETTLEMENT_PASS revision=1 settlements=6 buildings=60' ../../logs/regional-society-server.log | grep -F 'physical_square=true' | grep -F 'physical_road=true' | grep -F 'physical_field=true' | grep -F 'physical_building=true' | grep -F 'persistent_forced_chunks=false'
          grep -F 'Prepared Erden regional society settlements=6 households=48 residents=144 workers=96 dependents=48 homes_per_settlement=8 professions=13 aggregate_when_unloaded=true' ../../logs/regional-society-server.log
          grep -F 'LK_ERDEN_REGIONAL_SOCIETY_PASS revision=1 settlements=6 households=48 residents=144 workers=96 dependents=48' ../../logs/regional-society-server.log | grep -F 'physical_home=true' | grep -F 'physical_workplace=true' | grep -F 'distinct_workplace=true' | grep -F 'commute_schedule=true' | grep -F 'navigation_only=true' | grep -F 'loaded_route_guard=true' | grep -F 'permanent_death_ledger=true' | grep -F 'aggregate_when_unloaded=true' | grep -F 'persistent_forced_chunks=false'

      - name: Graphical client audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          log=../../logs/regional-society-client.log
          : > "$log"
          need_graphics=0
          command -v xvfb-run >/dev/null 2>&1 || need_graphics=1
          ldconfig -p 2>/dev/null | grep -Fq 'libGL.so.1' || need_graphics=1
          if [ "$need_graphics" -eq 1 ]; then
            sudo timeout --signal=TERM --kill-after=10s 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq
            sudo timeout --signal=TERM --kill-after=10s 120s apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y --no-install-recommends xvfb libgl1-mesa-dri >/dev/null
          fi
          setsid bash -c "exec xvfb-run -a -s '-screen 0 1280x720x24' gradle --no-daemon runClient --stacktrace --console=plain" > "$log" 2>&1 &
          launcher=$!
          sleep 1
          pgid="$(ps -o pgid= -p "$launcher" 2>/dev/null | tr -d ' ' || true)"
          [ -n "$pgid" ] || pgid="$launcher"
          outcome=timeout
          for attempt in $(seq 1 240); do
            if grep -Fq 'LK_CLIENT_DIAGNOSTIC_PASS screen=origin_selection fixed_erden_origin=true' "$log" \
              && grep -Fq 'LK_CLIENT_LOADING_DIAGNOSTIC_PASS screen=realm_loading non_pausing=true' "$log" \
              && grep -Fq 'LK_CLIENT_CODEX_DIAGNOSTIC_PASS screens=overview,equipment,map,skills' "$log"; then
              outcome=pass
              break
            fi
            if grep -Eqi 'Caught exception from Living Kingdoms|Error during client initialization|Exception in client tick loop|Rendering screen|Missing textures in model livingkingdoms|Could not initialize GLFW|Failed to create window' "$log"; then
              outcome=fatal
              break
            fi
            if ! kill -0 "$launcher" 2>/dev/null; then outcome=client_exit; break; fi
            sleep 1
          done
          kill -TERM -- "-$pgid" 2>/dev/null || true
          sleep 3
          kill -KILL -- "-$pgid" 2>/dev/null || true
          wait "$launcher" 2>/dev/null || true
          if grep -Fq 'LK_CLIENT_DIAGNOSTIC_PASS screen=origin_selection fixed_erden_origin=true' "$log" \
            && grep -Fq 'LK_CLIENT_LOADING_DIAGNOSTIC_PASS screen=realm_loading non_pausing=true' "$log" \
            && grep -Fq 'LK_CLIENT_CODEX_DIAGNOSTIC_PASS screens=overview,equipment,map,skills' "$log"; then outcome=pass; fi
          cat "$log"
          test "$outcome" = pass

      - name: JAR verification
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          test "${#jars[@]}" -eq 1
          unzip -t "${jars[0]}"
          entries="$(mktemp)"
          unzip -Z1 "${jars[0]}" > "$entries"
          test "$(sort "$entries" | uniq -d | wc -l)" -eq 0
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalSocietyManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalSocietySavedData.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenRegionalSettlementManager.class' "$entries"
          unzip -p "${jars[0]}" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-alpha.12"'

      - name: Upload pre-main logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-regional-society-r1-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 14
