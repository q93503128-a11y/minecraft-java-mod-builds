name: Smoke EARTH TO STARS alpha.12 dedicated resources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-earth-to-stars-alpha12-server.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/earth-to-stars

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Dedicated server resource-load smoke
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          rm -rf run
          mkdir -p run build/logs
          printf 'eula=true\n' > run/eula.txt

          set +e
          timeout --kill-after=15s 180s ./gradlew --no-daemon runServer --stacktrace 2>&1 | tee build/logs/alpha12-server-smoke.log
          status=${PIPESTATUS[0]}
          set -e

          if [[ $status -ne 0 && $status -ne 124 && $status -ne 137 ]]; then
            echo "runServer exited unexpectedly with status $status"
            exit "$status"
          fi

          grep -q 'Done (' build/logs/alpha12-server-smoke.log
          if grep -Eqi 'Parsing error loading recipe|Failed to parse recipe|Could not parse recipe|Recipe.*parse.*error' build/logs/alpha12-server-smoke.log; then
            echo 'Recipe/resource parsing error detected during dedicated-server startup.'
            exit 1
          fi
          echo 'EARTH_TO_STARS_ALPHA12_SERVER_RESOURCE_SMOKE_PASS'
      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: earth-to-stars-alpha12-server-smoke-log
          path: projects/earth-to-stars/build/logs/alpha12-server-smoke.log
          if-no-files-found: ignore
          retention-days: 7
