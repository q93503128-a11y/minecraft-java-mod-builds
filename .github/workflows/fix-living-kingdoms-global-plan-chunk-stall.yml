name: Fix Living Kingdoms global plan chunk stall

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/fix_living_kingdoms_global_plan_chunk_stall.py'
      - '.github/workflows/fix-living-kingdoms-global-plan-chunk-stall.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair nonblocking global construction chunk retention
        run: python .github/scripts/fix_living_kingdoms_global_plan_chunk_stall.py
      - name: Commit Java repair
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/IncrementalWorldEditPlan.java
          git diff --cached --quiet && exit 0
          git commit -m 'Retain async chunks for global realm construction plans'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

# One-shot repair; remove after the Java commit lands.
