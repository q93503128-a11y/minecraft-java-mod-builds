name: Manual Frontier Alpha97 Build V3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-frontier-alpha97-build-v3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Apply fix
        run: python3 .github/scripts/frontier_alpha97_fix.py
      - name: Validate source
        run: |
          git diff --check
          grep -q 'mod_version=0.1.0-alpha.97' projects/frontier-settlement/gradle.properties
          grep -q 'Fresh vanilla navigation already accounts' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java
          grep -q 'hasReachableGradeWorkPosition' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java
          grep -q 'constructionIssue.isBlank()' projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementContextService.java
      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json, pathlib
          fs=list(pathlib.Path('projects/frontier-settlement/src/main/resources').rglob('*.json'))
          for p in fs: json.loads(p.read_text(encoding='utf-8'))
          print('JSON_OK', len(fs))
          PY
      - name: Build
        working-directory: projects/frontier-settlement
        run: ./gradlew clean build --no-daemon
      - name: Verify jar
        run: |
          JAR=projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.97.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'SettlementConstructionService.class'
          jar tf "$JAR" | grep -q 'SettlementContextService.class'
          test -z "$(zipinfo -1 "$JAR" | sort | uniq -d)"
          sha256sum "$JAR"
      - uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha97-replacement
          path: projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.97.jar
          if-no-files-found: error
      - name: Commit main
        run: |
          rm -f .github/workflows/manual-frontier-alpha97-construction-recovery.yml
          rm -f .github/workflows/manual-frontier-alpha97-construction-recovery-v2.yml
          rm -f .github/workflows/manual-frontier-alpha97-build-v3.yml
          rm -f .github/scripts/frontier_alpha97_fix.py
          git config user.name coworkaccount
          git config user.email cyp1jhh2@gmail.com
          git add projects/frontier-settlement/gradle.properties projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementConstructionService.java projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementContextService.java .github/workflows/manual-frontier-alpha97-construction-recovery.yml .github/workflows/manual-frontier-alpha97-construction-recovery-v2.yml .github/workflows/manual-frontier-alpha97-build-v3.yml .github/scripts/frontier_alpha97_fix.py
          git commit -m 'Recover Frontier construction navigation and stall reporting'
          git push origin HEAD:main
