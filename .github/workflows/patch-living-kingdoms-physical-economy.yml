name: Patch Living Kingdoms physical economy reserve

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-living-kingdoms-physical-economy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep bakery stock reserve
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPhysicalEconomyManager.java')
          text = path.read_text(encoding='utf-8')
          old = '''        for (String bakeryId : bakeryIds) {
            while (sites.get(bakeryId).stock("bread") > 0L) {
                ErdenPhysicalEconomySavedData.SiteState bakery = sites.get(bakeryId);'''
          new = '''        for (String bakeryId : bakeryIds) {
            while (sites.get(bakeryId).stock("bread") > 2L) {
                ErdenPhysicalEconomySavedData.SiteState bakery = sites.get(bakeryId);'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one bakery loop, found {text.count(old)}')
          text = text.replace(old, new)
          old = '''                long amount = Math.min(
                        bakery.stock("bread"),
                        Math.max(0L, targetStock - target.stock("bread")));'''
          new = '''                long amount = Math.min(
                        Math.max(0L, bakery.stock("bread") - 2L),
                        Math.max(0L, targetStock - target.stock("bread")));'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one bakery transfer amount, found {text.count(old)}')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPhysicalEconomyManager.java
          git commit -m 'Retain bakery stock for physical inventory'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
