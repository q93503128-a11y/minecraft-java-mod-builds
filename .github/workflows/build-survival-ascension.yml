name: Build Survival Ascension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/survival-ascension/**'
      - '.github/workflows/build-survival-ascension.yml'

permissions:
  contents: write

concurrency:
  group: survival-ascension-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/survival-ascension
  CI_RESULT_DIR: ci-results/survival-ascension

jobs:
  build:
    name: Java 25 - Survival Ascension
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Synchronize 0.51 current-state docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('projects/survival-ascension')

          def read(name):
              return (root / name).read_text(encoding='utf-8')

          def write(name, text):
              (root / name).write_text(text, encoding='utf-8')

          project = read('PROJECT.md')
          project = project.replace('- Mod version: `0.50.0-alpha.1`', '- Mod version: `0.51.0-alpha.1`', 1)
          old_compat = '- Existing-world compatibility: no new SavedData ID or migration. Existing skill XP totals, `infrastructure_v1`, `field_depots_v1`, `outpost_v1`, `production_v1` and older data stay unchanged. 0.50 raises only the persisted safety capacity of the existing depot/outpost lists to nine and derives the live 3/6/9 admission limit from already-existing Industrial Works / Civil Works / Ascension Nexus progression. Existing 0.49 cart-local frontline manifest NBT, 0.48 exact-outpost local supply, 0.47 optional EntityType-tag integration, physical freight railheads and item CustomData boundaries remain unchanged.'
          new_compat = '- Existing-world compatibility: no new SavedData ID or migration. Existing skill XP totals, `infrastructure_v1`, `field_depots_v1`, `outpost_v1`, `production_v1`, existing affix CustomData and older data stay unchanged. 0.51 adds the existing affix category `armor` to standard humanoid armor and reads effects only from currently equipped pieces; 0.50 regional 3/6/9 admission, 0.49 cart-local frontline manifest NBT, 0.48 exact-outpost local supply, optional integrations, physical freight railheads and item-data boundaries remain unchanged.'
          project = project.replace(old_compat, new_compat, 1)
          if '## 0.51 Armor Ascension / 방어구 승천 성장' not in project:
              marker = '## 0.50 Regional Logistics Scale / 지역 물류망 확장\n'
              section = '''## 0.51 Armor Ascension / 방어구 승천 성장
          - Standard humanoid armor tags (`HEAD_ARMOR`, `CHEST_ARMOR`, `LEG_ARMOR`, `FOOT_ARMOR`) now join the existing Ascension Imprint / reforge / Mythic-awakening path without optional-mod Java dependencies.
          - Elite affix loot can now roll helmet, chestplate, leggings or boots on the same iron -> diamond -> netherite rarity ladder as existing weapon/tool drops.
          - Armor reuses the existing five affix slots with worn-only roles: `수호` always reduces incoming damage, `불굴` adds reduction at <=50% health, `숙련` increases Combat mastery XP, `완강` adds reduction against hits of 8+ damage, and `보호` adds reduction when the damage source has no attacking entity.
          - All armor-affix damage reduction is summed across equipped pieces and hard-capped at 35%. Armor `숙련` is summed separately and hard-capped at +32% Combat XP. Holding armor in the hand gives neither effect.
          - Imprint keeps the source armor ItemStack and unrelated DataComponents; Survival Ascension still writes only its nested affix CustomData and display name.
          - Existing imprint/reforge/awakening/salvage material costs and physical-logistics-first consumption are unchanged.
          - No armor attribute rewriting, max-health inflation, new potion effect, SavedData, packet/protocol change, custom armor item, force-load or background simulation.

          '''
              if marker not in project:
                  raise SystemExit('PROJECT 0.50 marker missing')
              project = project.replace(marker, section + marker, 1)
          write('PROJECT.md', project)

          readme = read('README.md')
          if '## 0.51.0-alpha.1 — Armor Ascension / 방어구 승천 성장' not in readme:
              marker = '## 0.50.0-alpha.1 — Regional Logistics Scale / 지역 물류망 확장\n'
              section = '''## 0.51.0-alpha.1 — Armor Ascension / 방어구 승천 성장
          Armor is now part of the same ascension equipment loop as weapons and tools. Standard helmet/chestplate/leggings/boots tags can be used with `M -> 장비 -> 승천 각인`, then use the existing reforge, Mythic awakening and salvage path without replacing the original item or clearing unrelated components. Elite affix drops can also roll iron/diamond/netherite armor pieces.

          Armor affixes only work while the piece is equipped: `수호` is general incoming-damage reduction, `불굴` strengthens defense below half health, `숙련` increases Combat mastery XP, `완강` helps against 8+ damage hits, and `보호` helps against damage with no attacking entity. The combined armor-affix damage reduction is capped at 35%, and armor mastery XP is capped at +32%, so four high-tier pieces cannot create an uncapped defensive multiplier.

          This reuses the existing affix CustomData, material sinks and equipment action payload. No new SavedData, protocol bump, custom armor, attribute-rewrite system, force-load or optional-mod Java dependency is introduced.

          '''
              if marker not in readme:
                  raise SystemExit('README 0.50 marker missing')
              readme = readme.replace(marker, section + marker, 1)
          write('README.md', readme)

          changelog = read('CHANGELOG.md')
          if '## 0.51.0-alpha.1' not in changelog:
              marker = '## 0.50.0-alpha.1\n'
              section = '''## 0.51.0-alpha.1
          - Added `Armor Ascension / 방어구 승천 성장`: standard head/chest/leg/foot armor tags now join the existing affix imprint, reforge, Mythic-awakening and salvage flow.
          - Elite affix loot can now roll iron/diamond/netherite armor across all four equipment slots.
          - Added worn-only armor affix roles: 수호 general reduction, 불굴 low-health reduction, 숙련 Combat XP, 완강 heavy-hit reduction, 보호 no-attacker/environmental reduction.
          - Hard-capped total armor-affix incoming-damage reduction at 35% and armor mastery XP at +32% across all equipped pieces.
          - Preserved original armor ItemStack identity and unrelated components; Survival Ascension still writes only its nested affix CustomData/display name.
          - Kept existing physical-logistics-first imprint/reforge/awakening costs, network protocol 8, and all 0.49/0.50 freight/regional-logistics contracts.
          - Added no new SavedData, custom armor item, attribute rewrite, potion-effect layer, force-load or optional-mod Java dependency.

          '''
              if marker not in changelog:
                  raise SystemExit('CHANGELOG 0.50 marker missing')
              changelog = changelog.replace(marker, section + marker, 1)
          write('CHANGELOG.md', changelog)

          guide_path = root / 'src/main/java/kr/moonseungjun/survivalascension/client/GuideScreen.java'
          guide = guide_path.read_text(encoding='utf-8')
          old = 'h("외부 장비와 승천 각인"), p("콘텐츠 팩이나 다른 모드의 장비가 표준 검/곡괭이/도끼/삽/괭이 아이템 태그를 사용하면 장비 메뉴의 승천 각인으로 Survival Ascension affix 체계에 편입할 수 있습니다. 각성 단계는 정예, 전설 단계는 승천, 종말 단계는 신화 등급으로 각인합니다."),'
          if 'h("방어구 affix")' not in guide:
              new = 'h("외부 장비와 승천 각인"), p("콘텐츠 팩이나 다른 모드의 장비가 표준 검/곡괭이/도끼/삽/괭이 또는 머리/가슴/다리/발 방어구 태그를 사용하면 장비 메뉴의 승천 각인으로 Survival Ascension affix 체계에 편입할 수 있습니다. 각성 단계는 정예, 전설 단계는 승천, 종말 단계는 신화 등급으로 각인합니다."),\n                h("방어구 affix"), p("각인 방어구는 착용 중에만 작동합니다. 수호=상시 피해 감소, 불굴=체력 절반 이하 추가 감소, 숙련=전투 숙련 XP 증가, 완강=8 이상 큰 피해 추가 감소, 보호=공격 주체가 없는 피해 추가 감소입니다. 네 부위 합산 affix 피해 감소는 최대35%, 방어구 숙련 XP는 최대32% 추가입니다."),'
              if old not in guide:
                  raise SystemExit('Guide armor insertion contract missing')
              guide = guide.replace(old, new, 1)
          guide_path.write_text(guide, encoding='utf-8')
          PY

          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/survival-ascension
          git commit -m 'Synchronize Survival Ascension 0.51 docs [skip ci]'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' "$PROJECT_DIR/gradle.properties")"
          test -n "$version"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPECTED_JAR=survivalascension-$version.jar" >> "$GITHUB_ENV"

      - name: Verify toolchain and committed source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version
          python3 tools/test_release_source.py 2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-audit.log"
          python3 tools/test_release_content_pack.py 2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-content-pack-audit.log"
          python3 -m py_compile tools/build_mrpack.py tools/test_current_source.py tools/test_content_pack_source.py tools/test_release_source.py tools/test_release_content_pack.py tools/verify_jar.py tools/verify_release_jar.py
          git diff --check
          git diff --exit-code

      - name: Clean build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-gradle.log"

      - name: Verify runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_release_jar.py "build/libs/$EXPECTED_JAR" | tee "$GITHUB_WORKSPACE/survival-ascension-jar-verify.log"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables/"
          cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables/"

      - name: Build one-import Modrinth content pack
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/build_mrpack.py \
            --survival-jar "build/libs/$EXPECTED_JAR" \
            --output "$GITHUB_WORKSPACE/deliverables/Survival-Ascension-$MOD_VERSION-content-preview.mrpack" \
            2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-modpack.log"

      - name: Create build and runtime report
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(cut -d' ' -f1 "build/libs/$EXPECTED_JAR.sha256")"
          pack="$GITHUB_WORKSPACE/deliverables/Survival-Ascension-$MOD_VERSION-content-preview.mrpack"
          test -f "$pack"
          pack_sha="$(sha256sum "$pack" | cut -d' ' -f1)"
          cat > "$GITHUB_WORKSPACE/deliverables/BUILD_AND_RUNTIME_REPORT.md" <<REPORT
          # Survival Ascension Build and Runtime Report

          - Source SHA: $GITHUB_SHA
          - Version: $MOD_VERSION
          - Minecraft: 26.2
          - NeoForge: 26.2.0.38-beta
          - Java: 25
          - Gradle: 9.2.1 wrapper
          - clean build: PASS
          - source audit: PASS
          - content-pack source audit: PASS
          - JAR verification: PASS
          - JAR SHA-256: $sha
          - Modrinth content-pack metadata/dependency/package validation: PASS
          - content-preview .mrpack SHA-256: $pack_sha
          - external content mods: referenced from their original Modrinth CDN; not embedded in the Survival Ascension JAR
          - datagen: NOT RUN (not implemented in alpha.1)
          - GameTest: NOT RUN (not implemented in alpha.1)
          - dedicated server smoke test: NOT RUN
          - graphical client / external-mod worldgen smoke test: NOT RUN
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: survivalascension-${{ env.MOD_VERSION }}-deliverables
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivalascension-${{ env.MOD_VERSION }}-logs
          path: |
            survival-ascension-audit.log
            survival-ascension-content-pack-audit.log
            survival-ascension-gradle.log
            survival-ascension-jar-verify.log
            survival-ascension-modpack.log
          if-no-files-found: warn
          retention-days: 14

      - name: Record canonical CI result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/survival-ascension-result
          mkdir -p /tmp/survival-ascension-result
          cat > /tmp/survival-ascension-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          version=${MOD_VERSION:-unknown}
          minecraft=26.2
          neoforge=26.2.0.38-beta
          java=25
          gradle=9.2.1
          STATUS
          if test -f "$GITHUB_WORKSPACE/survival-ascension-audit.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-audit.log" /tmp/survival-ascension-result/latest-audit.log
          fi
          if test -f "$GITHUB_WORKSPACE/survival-ascension-content-pack-audit.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-content-pack-audit.log" /tmp/survival-ascension-result/latest-content-pack-audit.log
          fi
          if test -f "$GITHUB_WORKSPACE/survival-ascension-gradle.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-gradle.log" /tmp/survival-ascension-result/latest-gradle.log
          fi
          if test -f "$GITHUB_WORKSPACE/survival-ascension-jar-verify.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-jar-verify.log" /tmp/survival-ascension-result/latest-jar-verify.log
          fi
          if test -f "$GITHUB_WORKSPACE/survival-ascension-modpack.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-modpack.log" /tmp/survival-ascension-result/latest-modpack.log
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/survival-ascension-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then recorded=1; break; fi
            git commit -m "Record Survival Ascension ${MOD_VERSION:-unknown} CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then recorded=1; break; fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1
