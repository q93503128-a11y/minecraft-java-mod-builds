name: Build Survival Ascension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/survival-ascension/**'
      - '.github/workflows/build-survival-ascension.yml'

permissions:
  contents: write

concurrency:
  group: survival-ascension-main
  cancel-in-progress: true

env:
  PROJECT_DIR: projects/survival-ascension
  CI_RESULT_DIR: ci-results/survival-ascension

jobs:
  build:
    name: Java 25 - Survival Ascension
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^mod_version=//p' "$PROJECT_DIR/gradle.properties")"
          test -n "$version"
          echo "MOD_VERSION=$version" >> "$GITHUB_ENV"
          echo "EXPECTED_JAR=survivalascension-$version.jar" >> "$GITHUB_ENV"

      - name: Verify toolchain and committed source
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          java -version
          ./gradlew --version
          python3 tools/test_release_source.py 2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-audit.log"
          python3 tools/test_release_content_pack.py 2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-content-pack-audit.log"
          python3 -m py_compile tools/build_mrpack.py tools/test_current_source.py tools/test_content_pack_source.py tools/test_release_source.py tools/test_release_content_pack.py tools/verify_jar.py tools/verify_release_jar.py
          git diff --check
          git diff --exit-code

      - name: Clean build
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-gradle.log"

      - name: Dedicated server boot smoke
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          printf 'eula=true\n' > run/eula.txt
          rm -f "$GITHUB_WORKSPACE/survival-ascension-server.log"
          set +e
          timeout --signal=INT --kill-after=20s 120s ./gradlew --no-daemon --no-configuration-cache runServer --console=plain \
            > "$GITHUB_WORKSPACE/survival-ascension-server.log" 2>&1
          code=$?
          set -e
          cat "$GITHUB_WORKSPACE/survival-ascension-server.log"
          if ! grep -Eq 'Done \([0-9.]+s\)! For help, type "help"' "$GITHUB_WORKSPACE/survival-ascension-server.log"; then
            echo "Dedicated server never reached the ready state (exit=$code)." >&2
            exit 1
          fi
          if grep -Eiq '(NoClassDefFoundError|ClassNotFoundException|Exception in server tick loop|Failed to start the minecraft server|Mod loading error has occurred)' "$GITHUB_WORKSPACE/survival-ascension-server.log"; then
            echo "Dedicated server log contains a fatal classloading/server-start signature." >&2
            exit 1
          fi
          echo "Dedicated server reached ready state; timeout/INT exit=$code is expected for the bounded smoke run."

      - name: Verify runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_release_jar.py "build/libs/$EXPECTED_JAR" | tee "$GITHUB_WORKSPACE/survival-ascension-jar-verify.log"
          mkdir -p "$GITHUB_WORKSPACE/deliverables"
          cp "build/libs/$EXPECTED_JAR" "$GITHUB_WORKSPACE/deliverables/"
          cp "build/libs/$EXPECTED_JAR.sha256" "$GITHUB_WORKSPACE/deliverables/"

      - name: Build one-import Modrinth content pack
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          python3 tools/build_mrpack.py \
            --survival-jar "build/libs/$EXPECTED_JAR" \
            --output "$GITHUB_WORKSPACE/deliverables/Survival-Ascension-$MOD_VERSION-content-preview.mrpack" \
            2>&1 | tee "$GITHUB_WORKSPACE/survival-ascension-modpack.log"

      - name: Create build and runtime report
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(cut -d' ' -f1 "build/libs/$EXPECTED_JAR.sha256")"
          pack="$GITHUB_WORKSPACE/deliverables/Survival-Ascension-$MOD_VERSION-content-preview.mrpack"
          test -f "$pack"
          pack_sha="$(sha256sum "$pack" | cut -d' ' -f1)"
          cat > "$GITHUB_WORKSPACE/deliverables/BUILD_AND_RUNTIME_REPORT.md" <<REPORT
          # Survival Ascension Build and Runtime Report

          - Source SHA: $GITHUB_SHA
          - Version: $MOD_VERSION
          - Minecraft: 26.2
          - NeoForge: 26.2.0.38-beta
          - Java: 25
          - Gradle: 9.2.1 wrapper
          - clean build: PASS
          - source audit: PASS
          - content-pack source audit: PASS
          - dedicated server boot smoke: PASS (reached Minecraft ready state under bounded runServer smoke)
          - JAR verification: PASS
          - JAR SHA-256: $sha
          - Modrinth content-pack metadata/dependency/package validation: PASS
          - content-preview .mrpack SHA-256: $pack_sha
          - external content mods: referenced from their original Modrinth CDN; not embedded in the Survival Ascension JAR
          - datagen: NOT RUN (not implemented in alpha.1)
          - GameTest: NOT RUN (not implemented in alpha.1)
          - graphical client / external-mod worldgen smoke test: NOT RUN
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: survivalascension-${{ env.MOD_VERSION }}-deliverables
          path: deliverables/
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survivalascension-${{ env.MOD_VERSION }}-logs
          path: |
            survival-ascension-audit.log
            survival-ascension-content-pack-audit.log
            survival-ascension-gradle.log
            survival-ascension-server.log
            survival-ascension-jar-verify.log
            survival-ascension-modpack.log
          if-no-files-found: warn
          retention-days: 14

      - name: Record canonical CI result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/survival-ascension-result
          mkdir -p /tmp/survival-ascension-result
          cat > /tmp/survival-ascension-result/status.txt <<STATUS
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          version=${MOD_VERSION:-unknown}
          minecraft=26.2
          neoforge=26.2.0.38-beta
          java=25
          gradle=9.2.1
          dedicated_server_smoke=enabled
          STATUS
          if test -f "$GITHUB_WORKSPACE/survival-ascension-audit.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-audit.log" /tmp/survival-ascension-result/latest-audit.log
          fi
          if test -f "$GITHUB_WORKSPACE/survival-ascension-content-pack-audit.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-content-pack-audit.log" /tmp/survival-ascension-result/latest-content-pack-audit.log
          fi
          if test -f "$GITHUB_WORKSPACE/survival-ascension-gradle.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-gradle.log" /tmp/survival-ascension-result/latest-gradle.log
          fi
          if test -f "$GITHUB_WORKSPACE/survival-ascension-server.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-server.log" /tmp/survival-ascension-result/latest-server.log
          fi
          if test -f "$GITHUB_WORKSPACE/survival-ascension-jar-verify.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-jar-verify.log" /tmp/survival-ascension-result/latest-jar-verify.log
          fi
          if test -f "$GITHUB_WORKSPACE/survival-ascension-modpack.log"; then
            cp "$GITHUB_WORKSPACE/survival-ascension-modpack.log" /tmp/survival-ascension-result/latest-modpack.log
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          recorded=0
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf "$CI_RESULT_DIR"
            mkdir -p "$CI_RESULT_DIR"
            cp -a /tmp/survival-ascension-result/. "$CI_RESULT_DIR/"
            git add -A "$CI_RESULT_DIR"
            if git diff --cached --quiet; then recorded=1; break; fi
            git commit -m "Record Survival Ascension ${MOD_VERSION:-unknown} CI result for ${GITHUB_SHA::7} [skip ci]"
            if git push origin HEAD:main; then recorded=1; break; fi
            sleep $((attempt * 2))
          done
          test "$recorded" -eq 1
