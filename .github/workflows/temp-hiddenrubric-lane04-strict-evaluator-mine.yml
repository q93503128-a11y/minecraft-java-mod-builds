name: TEMP HiddenRubric Lane04 Strict Evaluator Mine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-strict-evaluator-mine.yml'

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Mine strict human-user evaluator candidates
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download

          REPO='lmarena-ai/arena-human-preference-140k'
          REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]
          RAW_EXPECT=135634

          PII=[
            re.compile(r'\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b',re.I),
            re.compile(r'(?<!\d)(?:\+?\d[\d .()\-]{7,}\d)(?!\d)'),
            re.compile(r'\b(?:sk-[A-Za-z0-9_-]{16,}|api[_-]?key\s*[:=])',re.I),
          ]
          PREF=re.compile(r'\b(?:i prefer|i would prefer|we prefer|my preference|our preference|my favorite|my favourite|i hate|i dislike|i love|i like|we like|we love|prefer(?:red)? to)\b',re.I)
          STATE=re.compile(r'\b(?:actually|instead|rather than|change|replace|revise|update|scratch that|forget (?:that|the)|previous|earlier|above|keep (?:the|it)|preserve|retain|don.t change|do not change|remove|omit|delete|no longer|make it|rewrite|same as before|again but)\b',re.I)
          DOMAINS={
            'legal':re.compile(r'\b(?:legal|law|lawyer|attorney|contract|compliance|court|regulation|lawsuit|patent)\b',re.I),
            'finance':re.compile(r'\b(?:finance|financial|accounting|tax|investment|portfolio|budget|loan|mortgage|stock)\b',re.I),
            'health':re.compile(r'\b(?:medical|health|clinical|doctor|nurse|patient|hospital|surgery|therapy|disease|medicine)\b',re.I),
            'software':re.compile(r'\b(?:software|developer|programming|code|api|database|cloud|devops|javascript|python|network|cyber|security)\b',re.I),
            'business':re.compile(r'\b(?:business|marketing|sales|customer|client|startup|revenue|brand|seo|company|entrepreneur|product)\b',re.I),
            'education':re.compile(r'\b(?:education|teacher|student|classroom|lesson|school|curriculum|university|assignment|exam|thesis)\b',re.I),
            'science':re.compile(r'\b(?:physics|chemistry|biology|astronomy|scientific|research|experiment|journal|mathematics|math)\b',re.I),
            'creative':re.compile(r'\b(?:design|graphic|photo|video|music|art|story|novel|film|logo|content creator)\b',re.I),
          }
          ACTORS=[
            'hiring manager','peer reviewer','peer reviewers','reviewer','reviewers','thesis committee','dissertation committee','selection committee','review committee','review board','grading committee','assessment panel','evaluation committee','evaluating committee','admissions committee','admissions officer','admissions team','interview panel','panelists','panel','module team','teacher marker','professor','professors','teacher','instructor','supervisor','manager','boss','advisor','adviser','mentor','recruiter','editor','associate editor','journal editor','examiner','examiners','judge','judges','jury','client team','client','customer team','customer','stakeholders','stakeholder','board of directors','executive board','senior management','management','team lead','senior leadership','executive leadership','leadership','principal','president','director','executives','executive','investors','investor','grant committee','funding committee','grant reviewers','grant reviewer','hr manager','hr team','human resources','project sponsor','sponsors','sponsor','approvers','approver','auditors','auditor','assessors','assessor','evaluators','evaluator','graders','grader','colleagues','colleague','coworkers','coworker'
          ]
          ACT='|'.join(re.escape(x) for x in sorted(set(ACTORS),key=len,reverse=True))
          art=re.compile(r'\b(?:report|paper|manuscript|essay|assignment|thesis|dissertation|proposal|application|resume|cv|portfolio|presentation|slides?|project|document|draft|submission|work|answer|response|deliverable|email|letter|plan|design|prototype|case study|abstract|statement|pitch|spiel)\b',re.I)
          request=re.compile(r'\b(?:write|draft|prepare|create|transform|revise|edit|improve|polish|rewrite|develop|generate|make|help me|compose|format|finalize|refine)\b',re.I)
          jobish=re.compile(r'\b(?:resume|curriculum vitae|job description|responsibilities|work experience|employment history)\b',re.I)

          patterns=[
            ('for_actor_review',6,re.compile(rf'\b(?:for|to)\s+(?P<actor>(?:(?:my|our|the|a|an|their|his|her)\s+)?(?:{ACT}))\s+(?P<rel>review|approval|feedback|evaluation|assessment|grading|marking)\b',re.I)),
            ('seeking_approval',6,re.compile(rf'\b(?:seeking|seek|get|obtain|need(?:ing)?)\s+(?:the\s+)?approval\s+(?:from|of)\s+(?P<actor>(?:(?:my|our|the|a|an|their|his|her)\s+)?(?:{ACT}))\b',re.I)),
            ('actor_action',5,re.compile(rf'\b(?P<actor>(?:(?:my|our|the|a|an|their|his|her)\s+)?(?:{ACT}))\b.{{0,80}}?\b(?P<rel>review(?:s|ed|ing)?|grade(?:s|d|ing)?|mark(?:s|ed|ing)?|evaluat(?:e|es|ed|ing)|assess(?:es|ed|ing)?|approv(?:e|es|ed|ing)|reject(?:s|ed|ing)?|score(?:s|d|ing)?|judg(?:e|es|ed|ing)|provide(?:s|d)? feedback|give(?:s|n)? feedback)\b',re.I|re.S)),
            ('action_by_actor',5,re.compile(rf'\b(?P<rel>review(?:s|ed|ing)?|grade(?:s|d|ing)?|mark(?:s|ed|ing)?|evaluat(?:e|es|ed|ing)|assess(?:es|ed|ing)?|approv(?:e|es|ed|ing)|reject(?:s|ed|ing)?|score(?:s|d|ing)?|judg(?:e|es|ed|ing))\b.{{0,80}}?\b(?:by|from)\s+(?P<actor>(?:(?:my|our|the|a|an|their|his|her)\s+)?(?:{ACT}))\b',re.I|re.S)),
            ('feedback_from_actor',5,re.compile(rf'\b(?P<rel>feedback|comments?|critique|approval)\s+(?:from|by|of)\s+(?P<actor>(?:(?:my|our|the|a|an|their|his|her)\s+)?(?:{ACT}))\b',re.I)),
            ('submit_to_actor',3,re.compile(rf'\b(?P<rel>submit(?:ted|ting)?|submission|present(?:ed|ing)?|send(?:ing|sent)?|share(?:d|ing)?)\b.{{0,100}}?\bto\s+(?P<actor>(?:(?:my|our|the|a|an|their|his|her)\s+)?(?:{ACT}))\b',re.I|re.S)),
          ]

          def ctext(msg):
            if not isinstance(msg,dict): return ''
            if isinstance(msg.get('text'),str): return msg['text']
            c=msg.get('content')
            if isinstance(c,str): return c
            if isinstance(c,list):
              return '\n'.join(i if isinstance(i,str) else i.get('text','') for i in c if isinstance(i,str) or isinstance(i,dict))
            return ''
          def turns(row):
            out=[]
            for e in row.get('full_conversation') or []:
              if not isinstance(e,dict): continue
              u=e.get('user')
              if isinstance(u,dict):
                t=ctext(u).strip()
                if t: out.append(t)
              elif str(e.get('role') or '')=='user':
                t=ctext(e).strip()
                if t: out.append(t)
            return out
          def rowkey(row,ts):
            stamp=row.get('timestamp')
            try: sk=int(stamp.timestamp()*1e9) if hasattr(stamp,'timestamp') else int(stamp or 0)
            except: sk=0
            return (int(row.get('evaluation_order') or 0),len(ts),sk)
          def doms(text): return [k for k,p in DOMAINS.items() if p.search(text)]
          def cross(text):
            ds=set(doms(text))
            if len(ds)>=4: return True
            return any(a in ds and b in ds for a,b in [('legal','software'),('legal','health'),('finance','health'),('finance','software'),('legal','finance')])
          def family_flags(ts):
            return {'preference':any(PREF.search(t) for t in ts),'stateOps':any(i>0 and STATE.search(t) for i,t in enumerate(ts)),'crossDomain':any(cross(t) for t in ts)}
          def relmap(raw,ptype):
            x=raw.lower()
            if 'approv' in x: return 'approval_from_actor'
            if 'feedback' in x or 'comment' in x or 'critique' in x: return 'feedback_from_actor'
            if ptype=='submit_to_actor': return 'submit_to_actor'
            if 'reject' in x: return 'reject_by_actor'
            if 'grade' in x or 'mark' in x: return 'grade_by_actor'
            if 'evaluat' in x or 'assess' in x or 'score' in x or 'judg' in x: return 'evaluate_by_actor'
            return 'review_by_actor'
          def evidence(text,s,e):
            left=max(text.rfind('\n',0,s),text.rfind('.',0,s),text.rfind('?',0,s),text.rfind('!',0,s))
            left=0 if left<0 else left+1
            rights=[x for x in [text.find('\n',e),text.find('.',e),text.find('?',e),text.find('!',e)] if x>=0]
            right=min(rights)+1 if rights else min(len(text),e+350)
            return re.sub(r'\s+',' ',text[left:right]).strip()[:700]

          cols=['id','evaluation_session_id','evaluation_order','language','is_code','timestamp','full_conversation']
          sessions={}; raw=0
          for shard in SHARDS:
            p=hf_hub_download(REPO,filename=shard,repo_type='dataset',revision=REV)
            pf=pq.ParquetFile(p); use=[c for c in cols if c in set(pf.schema_arrow.names)]
            for batch in pf.iter_batches(batch_size=512,columns=use):
              for row in batch.to_pylist():
                raw+=1
                if row.get('language')!='en' or bool(row.get('is_code')): continue
                ts=turns(row)
                if not ts: continue
                sid=str(row.get('evaluation_session_id') or row.get('id') or '')
                k=rowkey(row,ts)
                if sid not in sessions or k>sessions[sid][0]: sessions[sid]=(k,row,ts)
          if raw!=RAW_EXPECT: raise SystemExit(f'raw row drift {raw}')

          cand=[]; seen=set(); rejects={'higherLaneFamily':0,'privacy':0,'length':0,'duplicateText':0}
          for sid,(_,row,ts) in sessions.items():
            ff=family_flags(ts)
            if any(ff.values()): rejects['higherLaneFamily']+=1; continue
            for ti,text in enumerate(ts):
              if not (24<=len(text)<=6000): rejects['length']+=1; continue
              if any(p.search(text) for p in PII): rejects['privacy']+=1; continue
              norm=re.sub(r'\s+',' ',text).strip().lower(); nh=hashlib.sha256(norm.encode()).hexdigest()
              if nh in seen: rejects['duplicateText']+=1; continue
              matches=[]
              for ptype,base,pat in patterns:
                for m in pat.finditer(text):
                  actor=m.group('actor').strip(); rs,re_=m.span('actor'); rawrel=m.group('rel')
                  ev=evidence(text,m.start(),m.end())
                  score=base
                  lo=max(0,m.start()-240); hi=min(len(text),m.end()+240); near=text[lo:hi]
                  if art.search(near): score+=2
                  if request.search(text): score+=2
                  if ti==0: score+=1
                  if len(text)<=1500: score+=1
                  if jobish.search(text): score-=3
                  matches.append({'pattern':ptype,'score':score,'actor':actor,'sourceStart':rs,'sourceEnd':re_,'relationEvidence':relmap(rawrel,ptype),'evidence':ev})
              if not matches: continue
              seen.add(nh)
              matches.sort(key=lambda x:(-x['score'],x['sourceStart'],x['actor'].lower()))
              best=matches[0]
              cand.append({
                'sourceDataset':REPO,'sourceRevision':REV,
                'sourceRowId':str(row.get('id') or ''),'sourceEvaluationSessionId':sid,
                'evaluationOrder':int(row.get('evaluation_order') or 0),'turnIndex':ti,'familyTurnCount':len(ts),
                'sourceLength':len(text),'sourceText':text,'actor':best['actor'],'sourceActorSpan':{'start':best['sourceStart'],'end':best['sourceEnd'],'text':text[best['sourceStart']:best['sourceEnd']]},
                'relationEvidence':best['relationEvidence'],'pattern':best['pattern'],'score':best['score'],'evidence':best['evidence'],
                'allMatches':matches[:6],'assistantOutputsIncluded':False,'trainingEligible':False
              })
          cand.sort(key=lambda x:(-x['score'],x['sourceLength'],x['sourceEvaluationSessionId'],x['turnIndex']))
          cand=cand[:320]
          outdir=Path('temp-hiddenrubric/lane04'); outdir.mkdir(parents=True,exist_ok=True)
          full=outdir/'strict-evaluator-full.jsonl'; compact=outdir/'strict-evaluator-compact.jsonl'
          with full.open('w',encoding='utf-8') as f, compact.open('w',encoding='utf-8') as c:
            for idx,x in enumerate(cand,1):
              f.write(json.dumps(x,ensure_ascii=False)+'\n')
              c.write(json.dumps({k:x[k] for k in ['sourceRowId','sourceEvaluationSessionId','turnIndex','familyTurnCount','sourceLength','actor','sourceActorSpan','relationEvidence','pattern','score','evidence']},ensure_ascii=False)+'\n')
          manifest={'sourceDataset':REPO,'sourceRevision':REV,'rawRows':raw,'sessionFamilies':len(sessions),'strictEvaluatorCandidates':len(cand),'assistantOutputsIncluded':False,'candidateSignalsAreGold':False,'rejections':rejects}
          (outdir/'strict-evaluator-manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,ensure_ascii=False))
          PY
      - name: Commit temporary strict evaluator queue
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/strict-evaluator-*.json*
          git commit -m 'chore: materialize temporary strict Lane04 evaluator queue'
          git push origin HEAD:main
