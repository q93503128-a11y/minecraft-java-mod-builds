name: Build Riftfrontier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/riftfrontier/**'
      - '.github/workflows/build-riftfrontier.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/riftfrontier

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
      - name: Tests and clean build
        run: gradle --no-daemon clean test build --stacktrace
      - name: Dedicated server smoke
        run: |
          mkdir -p build/smoke run runs/server
          printf 'eula=true\n' > run/eula.txt
          printf 'eula=true\n' > runs/server/eula.txt
          set +e
          timeout 150s gradle --no-daemon runServer --stacktrace > build/smoke/server-console.log 2>&1
          STATUS=$?
          set -e
          cat build/smoke/server-console.log
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "runServer exited unexpectedly with status $STATUS"
            exit "$STATUS"
          fi
          LOGS=$(find . -type f -path '*/logs/latest.log' -print)
          if [ -z "$LOGS" ]; then
            echo 'No server latest.log was produced'
            exit 1
          fi
          cat $LOGS > build/smoke/server-latest-combined.log
          grep -q 'Riftfrontier core loaded' build/smoke/server-latest-combined.log
          grep -q 'Riftfrontier content snapshot published' build/smoke/server-latest-combined.log
          grep -q 'Done (' build/smoke/server-latest-combined.log
          if grep -Eq 'Crash report|Encountered an unexpected exception|Failed to start the minecraft server' build/smoke/server-latest-combined.log; then
            echo 'Fatal server startup marker found'
            exit 1
          fi
          echo 'PASS — dedicated server reached ready state and loaded Riftfrontier content' > build/smoke/server.status
      - name: Client smoke under virtual display
        run: |
          mkdir -p build/smoke
          set +e
          xvfb-run -a timeout 150s gradle --no-daemon runClient --stacktrace > build/smoke/client-console.log 2>&1
          STATUS=$?
          set -e
          cat build/smoke/client-console.log
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 124 ]; then
            echo "runClient exited unexpectedly with status $STATUS"
            exit "$STATUS"
          fi
          LOGS=$(find . -type f -path '*/logs/latest.log' -print)
          if [ -z "$LOGS" ]; then
            echo 'No client latest.log was produced'
            exit 1
          fi
          cat $LOGS > build/smoke/client-latest-combined.log
          grep -q 'Riftfrontier core loaded' build/smoke/client-latest-combined.log
          if grep -Eq 'Crash report|Minecraft crashed|Encountered an unexpected exception' build/smoke/client-latest-combined.log; then
            echo 'Fatal client startup marker found'
            exit 1
          fi
          echo 'PASS — client initialized Riftfrontier under Xvfb without a fatal crash marker' > build/smoke/client.status
      - name: Inspect executable JAR
        run: |
          JAR="build/libs/riftfrontier-0.1.0-alpha.1.jar"
          test -s "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | tee build/jar-contents.txt
          grep -q 'kr/moonseungjun/riftfrontier/Riftfrontier.class' build/jar-contents.txt
          grep -q 'META-INF/neoforge.mods.toml' build/jar-contents.txt
          grep -q 'assets/riftfrontier/' build/jar-contents.txt
          grep -q 'data/riftfrontier/' build/jar-contents.txt
          if grep -q '\.java$' build/jar-contents.txt; then echo 'Java source leaked into JAR'; exit 1; fi
          sha256sum "$JAR" | tee "$JAR.sha256"
      - name: Build report
        if: always()
        run: |
          mkdir -p build/reports/riftfrontier
          SERVER_STATUS=$(cat build/smoke/server.status 2>/dev/null || echo 'FAILED OR NOT COMPLETED — see smoke logs')
          CLIENT_STATUS=$(cat build/smoke/client.status 2>/dev/null || echo 'FAILED OR NOT COMPLETED — see smoke logs')
          {
            echo '# Riftfrontier CI Build Report'
            echo
            echo "- Commit: $GITHUB_SHA"
            echo '- Java: 25'
            echo '- Gradle: 9.2.1'
            echo '- Minecraft: 26.2'
            echo '- NeoForge: 26.2.0.38-beta'
            echo '- clean/test/build: see workflow logs'
            echo "- server smoke: $SERVER_STATUS"
            echo "- client smoke: $CLIENT_STATUS"
            echo '- GameTest: NOT RUN until first registered GameTest fixture'
          } > build/reports/riftfrontier/BUILD_AND_RUNTIME_REPORT.md
      - name: Upload deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riftfrontier-0.1.0-alpha.1-deliverables
          path: |
            projects/riftfrontier/build/libs/riftfrontier-0.1.0-alpha.1.jar
            projects/riftfrontier/build/libs/riftfrontier-0.1.0-alpha.1.jar.sha256
            projects/riftfrontier/build/reports/riftfrontier/BUILD_AND_RUNTIME_REPORT.md
          retention-days: 14
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftfrontier-0.1.0-alpha.1-logs
          path: |
            projects/riftfrontier/build/reports/**
            projects/riftfrontier/build/test-results/**
            projects/riftfrontier/build/smoke/**
            projects/riftfrontier/build/jar-contents.txt
            projects/riftfrontier/run/logs/**
            projects/riftfrontier/runs/**/logs/**
          if-no-files-found: ignore
          retention-days: 7
