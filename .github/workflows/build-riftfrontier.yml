name: Build Riftfrontier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/riftfrontier/**'
      - '.github/workflows/build-riftfrontier.yml'

permissions:
  contents: read

defaults:
  run:
    working-directory: projects/riftfrontier

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
      - name: Tests and clean build
        run: gradle --no-daemon clean test build --stacktrace
      - name: Inspect executable JAR
        run: |
          JAR="build/libs/riftfrontier-0.1.0-alpha.1.jar"
          test -s "$JAR"
          unzip -t "$JAR"
          unzip -l "$JAR" | tee build/jar-contents.txt
          grep -q 'kr/moonseungjun/riftfrontier/Riftfrontier.class' build/jar-contents.txt
          grep -q 'META-INF/neoforge.mods.toml' build/jar-contents.txt
          grep -q 'assets/riftfrontier/' build/jar-contents.txt
          grep -q 'data/riftfrontier/' build/jar-contents.txt
          if grep -q '\.java$' build/jar-contents.txt; then echo 'Java source leaked into JAR'; exit 1; fi
          sha256sum "$JAR" | tee "$JAR.sha256"
      - name: Build report
        if: always()
        run: |
          mkdir -p build/reports/riftfrontier
          {
            echo '# Riftfrontier CI Build Report'
            echo
            echo "- Commit: $GITHUB_SHA"
            echo '- Java: 25'
            echo '- Gradle: 9.2.1'
            echo '- Minecraft: 26.2'
            echo '- NeoForge: 26.2.0.38-beta'
            echo '- clean/test/build: see workflow logs'
            echo '- server smoke: NOT RUN in M0 workflow'
            echo '- client smoke: NOT RUN in M0 workflow'
            echo '- GameTest: NOT RUN until first registered GameTest fixture'
          } > build/reports/riftfrontier/BUILD_AND_RUNTIME_REPORT.md
      - name: Upload deliverables
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: riftfrontier-0.1.0-alpha.1-deliverables
          path: |
            projects/riftfrontier/build/libs/riftfrontier-0.1.0-alpha.1.jar
            projects/riftfrontier/build/libs/riftfrontier-0.1.0-alpha.1.jar.sha256
            projects/riftfrontier/build/reports/riftfrontier/BUILD_AND_RUNTIME_REPORT.md
          retention-days: 14
      - name: Upload logs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riftfrontier-0.1.0-alpha.1-logs
          path: |
            projects/riftfrontier/build/reports/**
            projects/riftfrontier/build/test-results/**
            projects/riftfrontier/build/jar-contents.txt
          if-no-files-found: ignore
          retention-days: 7
