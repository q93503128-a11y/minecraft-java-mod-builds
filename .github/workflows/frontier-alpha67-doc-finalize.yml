name: Finalize Frontier Alpha67 Docs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha67-doc-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch existing canonical docs without rewriting them
        shell: bash
        run: |
          set -euo pipefail
          python3 projects/frontier-settlement/tools/finalize_alpha67_docs.py
          rm projects/frontier-settlement/tools/finalize_alpha67_docs.py
          rm .github/workflows/frontier-alpha67-doc-finalize.yml
          git diff --check

      - name: Commit only Frontier alpha.67 doc finalization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement/CANONICAL_PLAN.md \
                  projects/frontier-settlement/COMPLETION_GAP_AUDIT.md \
                  projects/frontier-settlement/README.md \
                  projects/frontier-settlement/tools/finalize_alpha67_docs.py \
                  .github/workflows/frontier-alpha67-doc-finalize.yml
          git diff --cached --check
          git commit -m 'Finalize Frontier Settlement alpha.67 canonical docs'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
