name: TEMP HiddenRubric Lane04 Recover009 Candidates
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-recover009-candidates.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Recover selected full rows directly from pinned parquet
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          REPO='lmarena-ai/arena-human-preference-140k'
          REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'
          IDS={'48c2e262-1e5a-4231-bd17-0ff9e8abbe36','475c5a93-94e6-40b3-b17d-e8d352a555ed','38465fb5-5948-48ad-ace2-d9ebf26c68ca','e2848d8e-ee40-44b0-b83c-ce0b1f239a88'}
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]
          def text(msg):
              if not isinstance(msg,dict): return ''
              if isinstance(msg.get('text'),str): return msg['text']
              c=msg.get('content')
              if isinstance(c,str): return c
              if isinstance(c,list):
                  out=[]
                  for x in c:
                      if isinstance(x,str): out.append(x)
                      elif isinstance(x,dict) and isinstance(x.get('text'),str): out.append(x['text'])
                  return '\n'.join(out)
              return ''
          def user_turns(row):
              out=[]
              for e in row.get('full_conversation') or []:
                  if not isinstance(e,dict): continue
                  u=e.get('user')
                  if isinstance(u,dict):
                      t=text(u).strip()
                      if t: out.append(t)
                  elif str(e.get('role') or '')=='user':
                      t=text(e).strip()
                      if t: out.append(t)
              return out
          found={}; raw=0
          for shard in SHARDS:
              p=hf_hub_download(REPO,filename=shard,repo_type='dataset',revision=REV)
              pf=pq.ParquetFile(p)
              cols=['id','evaluation_session_id','evaluation_order','language','is_code','full_conversation']
              use=[c for c in cols if c in set(pf.schema_arrow.names)]
              for b in pf.iter_batches(batch_size=512,columns=use):
                  for r in b.to_pylist():
                      raw+=1
                      rid=str(r.get('id') or '')
                      if rid not in IDS: continue
                      found[rid]={
                          'sourceDataset':REPO,'sourceRevision':REV,'sourceRowId':rid,
                          'sourceEvaluationSessionId':str(r.get('evaluation_session_id') or ''),
                          'evaluationOrder':int(r.get('evaluation_order') or 0),
                          'language':r.get('language'),'isCode':bool(r.get('is_code')),
                          'userTurns':user_turns(r),'assistantOutputsIncluded':False,
                      }
          assert raw==135634, raw
          assert set(found)==IDS, (sorted(IDS-set(found)),sorted(found))
          d=Path('temp-hiddenrubric/lane04/batch009-candidates'); d.mkdir(parents=True,exist_ok=True)
          (d/'selected.jsonl').write_text(''.join(json.dumps(found[r],ensure_ascii=False)+'\n' for r in sorted(found)),encoding='utf-8')
          (d/'manifest.json').write_text(json.dumps({'rawRows':raw,'requestedIds':sorted(IDS),'recoveredIds':sorted(found),'rows':len(found),'assistantOutputsIncluded':False},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('recovered',len(found))
          PY
      - name: Commit selected sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/batch009-candidates/
          git commit -m 'chore: materialize temporary Lane04 batch009 candidates'
          git push origin HEAD:main
