name: Audit Living Kingdoms Erden gameplay rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-gameplay-rules.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-gameplay-rules.yml'

concurrency:
  group: living-kingdoms-gameplay-rules-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_FANTASY_ECOLOGY_TEST: '1'
  LIVING_KINGDOMS_CI_RESIDENCE_PLACEMENT_TEST: '1'

jobs:
  gameplay-rules:
    name: Java 25 / Erden gameplay rules / residence / ecology / JAR
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Java 25 clean build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean build --stacktrace --console=plain

      - name: First real-play source contracts
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'silvana_forest|kardum_league|TEST_SPECIES|TEST_HOMELANDS' \
            src/main/java/kr/moonseungjun/livingkingdoms/client/OriginSelectionScreen.java
          ! grep -Eq 'silvana_forest|kardum_league' \
            src/main/java/kr/moonseungjun/livingkingdoms/network/RealmCodexSnapshotBuilder.java
          ! grep -Eq 'silvana_forest|kardum_league' \
            src/main/java/kr/moonseungjun/livingkingdoms/world/RealmJurisdiction.java
          grep -F 'addTicketAndLoadWithRadius(TicketType.PORTAL, chunk, 1)' \
            src/main/java/kr/moonseungjun/livingkingdoms/world/LivingRealmWorldManager.java
          grep -F 'finishPlacementWhenReady(player, profile, moved ->' \
            src/main/java/kr/moonseungjun/livingkingdoms/world/RealmBuildCoordinator.java
          grep -F 'if (moved)' \
            src/main/java/kr/moonseungjun/livingkingdoms/world/RealmBuildCoordinator.java
          grep -F 'STARTING_RESIDENTIAL_ROLE = "residential_middle_south_04"' \
            src/main/java/kr/moonseungjun/livingkingdoms/world/SafeResidenceLocator.java
          ! grep -F 'SPRUCE_PLANKS' \
            src/main/java/kr/moonseungjun/livingkingdoms/world/SafeResidenceLocator.java
          ! grep -Eq '카르둠|실바나' \
            src/main/java/kr/moonseungjun/livingkingdoms/client/RealmCodexScreen.java

      - name: Fresh Erden gameplay rules audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          rm -rf run/world run/living_realm run/livingkingdoms-gameplay-rules-ci
          printf 'level-name=livingkingdoms-gameplay-rules-ci\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          log=../../logs/gameplay-rules-server.log
          gradle --no-daemon runServer --stacktrace --console=plain > "$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          passed=0
          for attempt in $(seq 1 900); do
            if grep -Eq 'LK_REALM_DIAGNOSTIC_FAIL|Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError|Erden gameplay rules lock was violated|Erden settlement safety catalog drifted|Erden ecology entered civic settlement|Erden residence physical audit failed' "$log"; then
              cat "$log"
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_GAMEPLAY_RULES_LOCK revision=1 erden_only=true' "$log" \
              && grep -Fq 'LK_ERDEN_RESIDENCE_PHYSICAL_PASS ' "$log" \
              && grep -Fq 'LK_ERDEN_FANTASY_ECOLOGY_PASS revision=1 registered_species=3' "$log" \
              && grep -Fq 'LK_ERDEN_REGIONAL_SETTLEMENT_PASS revision=1 settlements=6 buildings=60' "$log" \
              && grep -Fq 'LK_ERDEN_CITADEL_INTERIOR_PASS zones=6' "$log"; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done
          cat "$log"
          test "$passed" -eq 1
          grep -F 'LK_ERDEN_GAMEPLAY_RULES_LOCK revision=1 erden_only=true' "$log" \
            | grep -F 'playable_species=1' \
            | grep -F 'playable_homelands=1' \
            | grep -F 'playable_backgrounds=1' \
            | grep -F 'playable_residences=1' \
            | grep -F 'sleep_skip=false' \
            | grep -F 'bed_respawn=false' \
            | grep -F 'shared_clock=true' \
            | grep -F 'institutional_defeat=true' \
            | grep -F 'recovery_fee=8' \
            | grep -F 'item_loss=false' \
            | grep -F 'personal_crafting=false' \
            | grep -F 'vanilla_workstations=false' \
            | grep -F 'capital_safe=true' \
            | grep -F 'settlement_safe=true' \
            | grep -F 'settlements=6' \
            | grep -F 'road_danger=true' \
            | grep -F 'wild_danger=true' \
            | grep -F 'scripted_spawns_preserved=true' \
            | grep -F 'initial_placement_teleport_only=true' \
            | grep -F 'multiplayer_world_shared=true'
          grep -F 'LK_ERDEN_RESIDENCE_PHYSICAL_PASS ' "$log" \
            | grep -F 'authored_role=residential_middle_south_04' \
            | grep -F 'loaded_probe_chunks=9' \
            | grep -F 'walkable=true' \
            | grep -F 'existing_authored_walkable=true' \
            | grep -F 'no_residence_block_carving=true' \
            | grep -F 'bounded_fallback=true' \
            | grep -F 'transient_ticket_released=true' \
            | grep -F 'ticket_radius=1' \
            | grep -F 'persistent_forced_chunks=false'
          grep -F 'LK_ERDEN_FANTASY_ECOLOGY_PASS revision=1 registered_species=3' "$log" \
            | grep -F 'capital_spawn=false' \
            | grep -F 'settlement_spawn=false' \
            | grep -F 'player_loaded_runtime=true' \
            | grep -F 'ci_tickets_released=true'

      - name: JAR gameplay rules verification
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          test "${#jars[@]}" -eq 1
          unzip -t "${jars[0]}"
          entries="$(mktemp)"
          unzip -Z1 "${jars[0]}" > "$entries"
          test "$(sort "$entries" | uniq -d | wc -l)" -eq 0
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/FantasyWorldRules.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/foundation/PlayableOriginCatalog.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/profile/StarterLoadoutManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/StarterNpcManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenFantasyEcologyManager.class' "$entries"
          grep -Fx 'kr/moonseungjun/livingkingdoms/world/ErdenResidencePlacementPhysicalAudit.class' "$entries"
          unzip -p "${jars[0]}" META-INF/neoforge.mods.toml | grep -F 'version="0.1.0-alpha.12"'

      - name: Upload gameplay rules logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-gameplay-rules-${{ github.run_number }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30
