name: Build Village Guardians v0.17.3 Compact Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/village-guardians/.build-trigger-v0172'

permissions:
  contents: write

env:
  PROJECT_DIR: projects/village-guardians
  EXPECTED_JAR: villageguardians-0.17.3-alpha.1.jar
  PUBLISHED_DIR: published/village-guardians
  RESULT_DIR: ci-results/village-guardians-v0173

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
          cache-read-only: false

      - name: Apply compact UI and routing cleanup
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/apply_v0173_ui_cleanup.py

      - name: Run complete contracts
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 tools/test_rpg_balance.py
          python3 tools/test_village_zone.py
          python3 tools/test_progression_loop.py
          python3 tools/test_progression_depth.py
          python3 tools/test_fortress_layout.py
          python3 tools/test_runtime_safety.py
          python3 tools/test_action_layout.py
          python3 tools/test_enemy_content.py

      - name: Build Java 25 runtime JAR
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --no-configuration-cache clean build --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/village-guardians-v0173-gradle.log"

      - name: Verify and stage artifact
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f "build/libs/$EXPECTED_JAR"
          python3 tools/verify_jar.py "build/libs/$EXPECTED_JAR"
          mkdir -p ../../deliverables-v0173
          cp "build/libs/$EXPECTED_JAR" ../../deliverables-v0173/
          cp "build/libs/$EXPECTED_JAR.sha256" ../../deliverables-v0173/

      - uses: actions/upload-artifact@v4
        with:
          name: villageguardians-0.17.3-alpha.1
          path: deliverables-v0173/
          if-no-files-found: error
          retention-days: 30

      - name: Commit compact source and verified artifact
        run: |
          mkdir -p "$PUBLISHED_DIR"
          cp "deliverables-v0173/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR"
          cp "deliverables-v0173/$EXPECTED_JAR.sha256" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$PROJECT_DIR/src" "$PROJECT_DIR/tools" "$PROJECT_DIR/gradle.properties" \
                  "$PUBLISHED_DIR/$EXPECTED_JAR" "$PUBLISHED_DIR/$EXPECTED_JAR.sha256"
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Village Guardians v0.17.3 compact growth UI and JAR'
            git pull --rebase origin main
            git push
          fi

      - name: Record dedicated result
        if: always()
        shell: bash
        run: |
          mkdir -p "$RESULT_DIR"
          cp "$GITHUB_WORKSPACE/village-guardians-v0173-gradle.log" "$RESULT_DIR/latest-gradle.log" 2>/dev/null || \
            printf '%s\n' 'Gradle build did not start.' > "$RESULT_DIR/latest-gradle.log"
          cat > "$RESULT_DIR/status.txt" <<EOF
          status=${{ job.status }}
          source_sha=$GITHUB_SHA
          run_id=$GITHUB_RUN_ID
          run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898266+github-actions[bot]@users.noreply.github.com'
          git add "$RESULT_DIR"
          if ! git diff --cached --quiet; then
            git commit -m "Record Village Guardians v0.17.3 audit result for ${GITHUB_SHA::7}"
            git pull --rebase origin main
            git push
          fi
