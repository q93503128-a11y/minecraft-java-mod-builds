name: Repair Living Kingdoms CI residency

on:
  push:
    branches: [main]
    paths:
      - '.github/living-kingdoms-ci-residency-trigger'
  workflow_dispatch:

concurrency:
  group: living-kingdoms-ci-residency
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Apply bounded CI residency repair
        run: python .github/scripts/patch_living_kingdoms_ci_residency.py

      - name: Java 25 clean compile
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Fresh world economy and citadel regression
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-ci-residency-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-ci-residency-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/living-kingdoms-ci-residency-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          passed=0
          for attempt in $(seq 1 1500); do
            log=../../logs/living-kingdoms-ci-residency-server.log
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' "$log"; then
              cat "$log"
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' "$log" \
              && grep -Fq 'LK_ERDEN_CITADEL_INTERIOR_PASS zones=6' "$log" \
              && grep -Fq 'LK_ERDEN_AUTHORED_GROUND_FUNCTIONAL_PLAN_PASS placements=233' "$log" \
              && grep -Fq 'Prepared Erden residence modes buildings=233 authored_ground_candidates=233 authored_upper_candidates=233 ground_only_candidates=0 synthetic_upper_created=0' "$log"; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$log"
              exit 1
            fi
            sleep 1
          done
          tail -n 500 ../../logs/living-kingdoms-ci-residency-server.log
          test "$passed" -eq 1
          grep -F 'Requested Erden physical-economy authored interior CI samples sites=3' ../../logs/living-kingdoms-ci-residency-server.log
          grep -F 'refreshed_until_verification=true' ../../logs/living-kingdoms-ci-residency-server.log
          grep -F 'LK_ERDEN_PHYSICAL_ECONOMY_PASS sites=156 warehouses=15 wallets=77' ../../logs/living-kingdoms-ci-residency-server.log
          grep -F 'LK_ERDEN_CITADEL_INTERIOR_PASS zones=6' ../../logs/living-kingdoms-ci-residency-server.log
          ! grep -Fq 'ground_only_candidates=77' ../../logs/living-kingdoms-ci-residency-server.log

      - name: Commit verified source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenUrbanInteriorBuilder.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCitadelInteriorManager.java
          git commit -m 'fix(living-kingdoms): retain authored CI interiors through verification'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload repair log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-ci-residency-${{ github.run_number }}
          path: logs/
          retention-days: 14
