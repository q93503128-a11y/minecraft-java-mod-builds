name: Run Erden live escrow regression patch

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: erden-live-escrow-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Skip after the patch exists
        id: guard
        shell: bash
        run: |
          if grep -Fq 'escrow_departure_test=true' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCargoEscrowManager.java; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Add one real authoritative escrow regression job
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cargo = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCargoEscrowManager.java')
          text = cargo.read_text()

          old = '''        long currentDay = Math.floorDiv(context.level.getGameTime(), 24_000L);
        if (context.day != currentDay
                || context.transport.activeJobCount() >= MAX_PHYSICAL_JOBS
                || !nearAnyPlayer(context.level, source, target, PHYSICAL_RADIUS)) {
            context.aggregate++;
            return DispatchResult.IMMEDIATE;
        }
'''
          new = '''        long currentDay = Math.floorDiv(context.level.getGameTime(), 24_000L);
        boolean ciForcedDeferred = shouldForceCiDeferred(
                context, source, target, resource, currentDay);
        if (context.day != currentDay
                || context.transport.activeJobCount() >= MAX_PHYSICAL_JOBS
                || (!ciForcedDeferred
                && !nearAnyPlayer(context.level, source, target, PHYSICAL_RADIUS))) {
            context.aggregate++;
            return DispatchResult.IMMEDIATE;
        }
'''
          if old not in text:
              raise SystemExit('dispatch gate anchor not found')
          text = text.replace(old, new)

          old = '''        context.transport.addJob(job);
        context.physicalized++;
        return DispatchResult.DEFERRED;
'''
          new = '''        context.transport.addJob(job);
        context.physicalized++;
        if (ciForcedDeferred) context.ciDeferredIssued = true;
        return DispatchResult.DEFERRED;
'''
          if old not in text:
              raise SystemExit('job creation anchor not found')
          text = text.replace(old, new)

          old = '''                "Prepared Erden road manifests day={} manifests={} modeled_travel_ticks={} physicalized={} blocked={} aggregate={} active_jobs={} authoritative_escrow=true unloaded_routes=aggregate",
                context.day, context.manifests, context.modeledTravelTicks,
                context.physicalized, context.blocked, context.aggregate,
                context.transport.activeJobCount());
'''
          new = '''                "Prepared Erden road manifests day={} manifests={} modeled_travel_ticks={} physicalized={} blocked={} aggregate={} active_jobs={} authoritative_escrow=true ci_deferred={} unloaded_routes=aggregate",
                context.day, context.manifests, context.modeledTravelTicks,
                context.physicalized, context.blocked, context.aggregate,
                context.transport.activeJobCount(), context.ciDeferredIssued);
'''
          if old not in text:
              raise SystemExit('manifest log anchor not found')
          text = text.replace(old, new)

          marker = '''    private static void verifyCi(
            ServerLevel level,
            ErdenPhysicalEconomySavedData economy,
            ErdenTransportSavedData transport) {
'''
          helper = '''    private static boolean shouldForceCiDeferred(
            DispatchContext context,
            ErdenPhysicalEconomySavedData.SiteState source,
            ErdenPhysicalEconomySavedData.SiteState target,
            String resource,
            long currentDay) {
        return "1".equals(System.getenv("LIVING_KINGDOMS_CI_REALM_TEST"))
                && !context.ciDeferredIssued
                && context.day == currentDay
                && resource.equals("bread")
                && source.role().equals("shop")
                && target.role().equals("bakery");
    }

'''
          if marker not in text:
              raise SystemExit('verify method anchor not found')
          text = text.replace(marker, helper + marker)

          old = '''        List<ExternalUrbanFabricBuilder.UrbanEntrance> samples =
                ErdenPhysicalEconomyManager.ciEntrances();
        if (samples.size() < 2) return;
        ErdenPhysicalEconomySavedData.SiteState source =
                findSite(economy.sites(), samples.get(0).x(), samples.get(0).z());
        ErdenPhysicalEconomySavedData.SiteState target =
                findSite(economy.sites(), samples.get(1).x(), samples.get(1).z());
        if (source == null || target == null || findRoute(level, source, target).isEmpty()) return;
        ciPassed = true;
        LivingKingdoms.LOGGER.info(
                "LK_ERDEN_TRANSPORT_PASS revision={} manifests={} modeled_travel_ticks={} route_planning=true loaded_obstacle_checks=true persistent_jobs=true authoritative_escrow=true aggregate_fallback=true physical_radius={} max_jobs={}",
                TRANSPORT_REVISION, transport.totalManifests(),
                transport.modeledTravelTicks(), PHYSICAL_RADIUS, MAX_PHYSICAL_JOBS);
'''
          new = '''        List<ExternalUrbanFabricBuilder.UrbanEntrance> samples =
                ErdenPhysicalEconomyManager.ciEntrances();
        if (samples.size() < 2) return;
        ErdenPhysicalEconomySavedData.SiteState routeSource =
                findSite(economy.sites(), samples.get(0).x(), samples.get(0).z());
        ErdenPhysicalEconomySavedData.SiteState routeTarget =
                findSite(economy.sites(), samples.get(1).x(), samples.get(1).z());
        if (routeSource == null || routeTarget == null
                || findRoute(level, routeSource, routeTarget).isEmpty()) return;
        ErdenTransportSavedData.DeliveryJob settled = transport.jobs().stream()
                .filter(job -> job.authoritative() && job.status().equals("settled"))
                .findFirst().orElse(null);
        if (settled == null) return;
        ErdenPhysicalEconomySavedData.SiteState source =
                findSite(economy.sites(), settled.sourceId());
        ErdenPhysicalEconomySavedData.SiteState target =
                findSite(economy.sites(), settled.targetId());
        if (source == null || target == null
                || source.metric(inTransitMetric(settled.resource())) != 0L
                || target.metric(pendingMetric(settled.resource())) != 0L
                || target.metric("transport_received") < settled.amount()) return;
        ciPassed = true;
        LivingKingdoms.LOGGER.info(
                "LK_ERDEN_TRANSPORT_PASS revision={} manifests={} modeled_travel_ticks={} route_planning=true loaded_obstacle_checks=true persistent_jobs=true authoritative_escrow=true aggregate_fallback=true escrow_departure_test=true unload_settlement_test=true cargo_conserved=true settled_resource={} settled_amount={} physical_radius={} max_jobs={}",
                TRANSPORT_REVISION, transport.totalManifests(),
                transport.modeledTravelTicks(), settled.resource(), settled.amount(),
                PHYSICAL_RADIUS, MAX_PHYSICAL_JOBS);
'''
          if old not in text:
              raise SystemExit('old CI verification body not found')
          text = text.replace(old, new)

          old = '''        int aggregate;

        DispatchContext(ServerLevel level, long day) {
'''
          new = '''        int aggregate;
        boolean ciDeferredIssued;

        DispatchContext(ServerLevel level, long day) {
'''
          if old not in text:
              raise SystemExit('dispatch context anchor not found')
          text = text.replace(old, new)
          cargo.write_text(text)

          porter = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenTransportManager.java')
          text = porter.read_text()
          old = '''        transport.markFailed(failed);
        if (source != null) economy.replaceSite(source.addMetric("blocked_shipments", 1L));
        if (target != null) economy.replaceSite(target.addMetric("delivery_failures", 1L));
'''
          new = '''        transport.markFailed(failed);
        if (!job.authoritative()) {
            if (source != null) economy.replaceSite(source.addMetric("blocked_shipments", 1L));
            if (target != null) economy.replaceSite(target.addMetric("delivery_failures", 1L));
        }
'''
          if old not in text:
              raise SystemExit('failed delivery metric anchor not found')
          text = text.replace(old, new)

          old = '''        ErdenPhysicalEconomySavedData.SiteState source = findSite(economy.sites(), job.sourceId());
        ErdenPhysicalEconomySavedData.SiteState target = findSite(economy.sites(), job.targetId());
        if (source != null) economy.replaceSite(source.addMetric("transport_completed", 1L));
        if (target != null) {
            economy.replaceSite(target
                    .addMetric("transport_received", job.amount())
                    .addMetric("transport_ticks", Math.max(0L, level.getGameTime() - job.createdTick())));
        }
'''
          new = '''        if (!job.authoritative()) {
            ErdenPhysicalEconomySavedData.SiteState source = findSite(economy.sites(), job.sourceId());
            ErdenPhysicalEconomySavedData.SiteState target = findSite(economy.sites(), job.targetId());
            if (source != null) economy.replaceSite(source.addMetric("transport_completed", 1L));
            if (target != null) {
                economy.replaceSite(target
                        .addMetric("transport_received", job.amount())
                        .addMetric("transport_ticks", Math.max(0L, level.getGameTime() - job.createdTick())));
            }
        }
'''
          if old not in text:
              raise SystemExit('completed delivery metric anchor not found')
          text = text.replace(old, new)
          porter.write_text(text)

          workflow = Path('.github/workflows/build-living-kingdoms.yml')
          text = workflow.read_text()
          anchor = "          grep -F 'aggregate_fallback=true' ../../logs/server-smoke.log\n"
          addition = anchor + "          grep -F 'escrow_departure_test=true' ../../logs/server-smoke.log\n          grep -F 'unload_settlement_test=true' ../../logs/server-smoke.log\n          grep -F 'cargo_conserved=true' ../../logs/server-smoke.log\n"
          if text.count(anchor) != 1:
              raise SystemExit('workflow escrow marker anchor not found')
          text = text.replace(anchor, addition)
          old = '          - Fresh no-player server audit exercises the unloaded aggregate fallback by design\n'
          new = '          - Fresh no-player server audit exercises aggregate fallback plus one forced shop-to-bakery authoritative escrow delivery\n'
          if old not in text:
              raise SystemExit('workflow report aggregate line not found')
          text = text.replace(old, new)
          workflow.write_text(text)
          PY

      - name: Commit regression audit
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCargoEscrowManager.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenTransportManager.java \
                  .github/workflows/build-living-kingdoms.yml
          git diff --cached --check
          git commit -m 'Test authoritative Erden cargo through unloading'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
