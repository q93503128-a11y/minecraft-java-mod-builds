          insert_before(p,'### Alpha.68 rest-anchor-aware civilian lifecycle evidence','''### Alpha.69 historical duplicate-assignment containment

Alpha.69 hardens saves that may already contain more than one physical resident with the same specialist/outpost assignment tag. Alpha.67/68 prevent the known new false-missing paths, but they did not make a historical duplicate disappear and the previous population counters only observed one worker per assignment.

- workshop, advanced-workshop and outpost assignment queries now expose the complete loaded matching-worker set;
- shared population reconciliation counts every unique physical assigned resident when the existing full loaded-evidence gates are satisfied, so a historical duplicate cannot hide outside housing capacity and create another apparent vacancy;
- replacement remains authorized only by **zero** matching workers; two-or-more matching workers are never treated as missing and never consume another food4;
- actual specialist/transport work still uses exactly one worker, chosen deterministically by UUID order, preventing unstable entity-query order from swapping the active authority between ticks;
- ordinary production residents already used pooled UUID-deduplicated worker lists and counted excess physical residents, so that path is intentionally unchanged;
- Alpha.63/65 exact MAINHAND death recovery remains unchanged; Alpha.69 does not delete, discard, retag or refund an existing duplicate resident and therefore cannot silently destroy hidden villager inventory/cargo;
- no duplicate-resident ledger, UUID reservation authority, virtual population/cargo, force-load, teleport, new worker family, key, UI or second logistics authority is added.

This is non-destructive containment of historical multiplicity, not proof that old duplicate saves have been physically cleaned up. Repeated death/replacement/night-rest/save-reload/reconnect acceptance remains unfinished.''')

