workshop=text(JAVA/'settlement/SettlementWorkshopService.java'); advanced=text(JAVA/'settlement/SettlementAdvancedWorkshopService.java'); outpost=text(JAVA/'settlement/SettlementOutpostLogisticsService.java'); props=text(ROOT/'gradle.properties')
for label,s,role in (('workshop',workshop,'WORKSHOP_WORKER_TAG'),('advanced',advanced,'ADVANCED_WORKER_TAG')):
    must(s,('private static List<Villager> findAssignedWorkers(ServerLevel level, SettlementData data, BuildingRecord workshop)','assigned.sort(Comparator.comparing(villager -> villager.getUUID().toString()))','for (Villager worker : findAssignedWorkers(level, data, workshop)) ids.add(worker.getUUID());','if (findAssignedWorkers(level, data, workshop).isEmpty()) return workshop;','|| !findAssignedWorkers(level, data, workshop).isEmpty()) return null;',role),f'alpha.69 {label} multiplicity containment')
must(outpost,('private static List<Villager> findAssignedWorkers(ServerLevel level, SettlementData data, OutpostRecord outpost)','for (Villager worker : findAssignedWorkers(level, data, outpost)) ids.add(worker.getUUID());','if (findAssignedWorkers(level, data, outpost).isEmpty()) return outpost;','|| !findAssignedWorkers(level, data, outpost).isEmpty()) return null;','found.sort(Comparator.comparing(villager -> villager.getUUID().toString()))'),'alpha.69 outpost multiplicity containment')
for label,s in (('workshop',workshop),('advanced',advanced),('outpost',outpost)):
