name: Frontier Alpha69 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha69-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Alpha.69 containment patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/frontier_alpha69_patch.py
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/frontier-settlement .github/workflows/build-frontier-settlement.yml .github/workflows/frontier-alpha69-runner.yml .github/workflows/frontier-alpha69-one-shot.yml .github/scripts/frontier_alpha69_patch.py || true
          git commit -m 'Contain historical Frontier duplicate assignments for alpha.69'
          git push origin HEAD:main
