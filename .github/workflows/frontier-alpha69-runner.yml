name: Frontier Alpha69 Runner

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/frontier-alpha69-runner.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply Alpha.69 containment patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/frontier_alpha69_patch.py
          # The Actions token cannot modify workflow files. Keep the already-verified
          # product/docs/audits diff, but restore .github and let the connected user
          # credential perform canonical-workflow cleanup separately.
          git restore -- .github
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/frontier-settlement
          git commit -m 'Contain historical Frontier duplicate assignments for alpha.69'
          git push origin HEAD:main
