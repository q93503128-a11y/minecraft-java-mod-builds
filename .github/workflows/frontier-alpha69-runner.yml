- `firstMissingLoadedAssignment`와 spawn 재검사는 오직 matching worker가 0명일 때만 replacement를 허용하며, 2명 이상은 절대 missing으로 취급하지 않음;
- 실제 작업/운송 authority는 UUID 정렬의 첫 주민 하나만 사용하여 entity query 순서에 따른 authority 흔들림을 제거;
- 기존 중복 주민을 강제 `discard`/삭제/무료 환불하지 않아 MAINHAND 외 숨은 villager inventory까지 손실시키는 공격적 migration을 피함;
- 따라서 기존 중복을 더 증폭시키는 정적 경로는 닫지만, 오래된 duplicate entity 자체의 물리 정리 여부는 실제 save acceptance 후 별도 판단;
- 실제 2인 repeated death/replacement/night-rest/save-reload/reconnect no-loss/no-dup acceptance는 계속 남는다.''')

