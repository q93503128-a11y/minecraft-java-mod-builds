name: Apply Starter Shared Supply Depot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-starter-shared-supply-depot.yml'
      - 'tools/apply_starter_shared_supply_depot.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Patch and validate starter shared supply depot
        run: python3 tools/apply_starter_shared_supply_depot.py

      - name: Frontier canonical audits
        working-directory: projects/frontier-settlement
        run: |
          python3 tools/test_alpha91_docs.py
          python3 tools/test_latest_cumulative.py

      - name: Build and verify Frontier
        working-directory: projects/frontier-settlement
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.91.jar

      - name: Build Survival regression
        working-directory: projects/survival-ascension
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build --console=plain

      - name: Commit validated implementation to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementService.java \
                  projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementStorageService.java \
                  projects/frontier-settlement/src/main/java/kr/moonseungjun/frontiersettlement/settlement/SettlementCoreService.java
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'Use shared supply depot for starter settlement storage'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
