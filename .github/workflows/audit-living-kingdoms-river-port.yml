name: Audit Living Kingdoms river port

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-river-port.yml'

concurrency:
  group: living-kingdoms-river-port-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_RIVER_PORT_TEST: '1'

jobs:
  audit:
    name: Fresh-world Silver River port audit
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile river-port implementation
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: gradle --no-daemon classes --stacktrace --console=plain

      - name: Exercise actual Silver River port in a fresh world
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs
          rm -rf run/world run/living_realm run/livingkingdoms-river-port-ci-world
          mkdir -p run
          printf 'level-name=livingkingdoms-river-port-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt

          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/river-port.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 1200); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/river-port.log; then
              cat ../../logs/river-port.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_RIVER_PORT_STALL' ../../logs/river-port.log; then
              echo 'Physical river-port vessel stalled before reaching its active waypoint.' >&2
              cat ../../logs/river-port.log
              exit 1
            fi
            if grep -Eq 'Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError' ../../logs/river-port.log; then
              cat ../../logs/river-port.log
              exit 1
            fi
            if grep -Fq 'Prepared Erden fire-response CI' ../../logs/river-port.log; then
              echo 'Fire-response fixture contaminated the river-port audit.' >&2
              cat ../../logs/river-port.log
              exit 1
            fi
            if grep -Fq 'Requested Erden exterior CI anchors' ../../logs/river-port.log; then
              echo 'Exterior regression sweep contaminated the focused river-port audit.' >&2
              cat ../../logs/river-port.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_RIVER_PORT_PASS revision=1' ../../logs/river-port.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/river-port.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/river-port.log
          test "$passed" -eq 1

          grep -F 'Prepared Erden river-port CI chunks=' ../../logs/river-port.log
          ! grep -Fq 'Prepared Erden fire-response CI' ../../logs/river-port.log
          ! grep -Fq 'Requested Erden exterior CI anchors' ../../logs/river-port.log
          ! grep -Fq 'LK_ERDEN_RIVER_PORT_STALL' ../../logs/river-port.log
          grep -F 'west_wharf_preserved=true' ../../logs/river-port.log
          grep -F 'silver_river_centered=true' ../../logs/river-port.log
          grep -F 'LK_ERDEN_RIVER_PORT_TICKET_REFRESH' ../../logs/river-port.log
          grep -F 'timeout_safe_refresh=true' ../../logs/river-port.log
          grep -F 'Materialized Erden supply barge shipment=' ../../logs/river-port.log
          grep -F 'real_entity=true' ../../logs/river-port.log
          grep -F 'escrow_linked=true' ../../logs/river-port.log
          grep -F 'Erden supply barge docked shipment=' ../../logs/river-port.log
          grep -F 'actual_water_route=true' ../../logs/river-port.log
          grep -Eq 'LK_ERDEN_RIVER_PORT_PASS revision=1 silver_river_navigable=true west_wharf_physical=true customs_house=true shipyard=true supply_barge_escrow_linked=true real_boat_entity=true actual_water_movement=true travelled_metres=([4-9][8-9]|[5-9][0-9]|[1-9][0-9]{2,})' ../../logs/river-port.log
          grep -Eq 'ci_ticket_refreshes=[1-9][0-9]* timeout_safe_refresh=true' ../../logs/river-port.log
          grep -F 'loaded_only_runtime=true forced_citywide=false ci_corridor_only=true ci_corridor_retained_until_pass=true ci_tickets_released_at_pass=true' ../../logs/river-port.log

      - name: Upload river-port audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-river-port-${{ github.run_number }}
          path: logs/river-port.log
          if-no-files-found: warn
          retention-days: 30