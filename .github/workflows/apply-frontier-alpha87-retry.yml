name: Apply Frontier Alpha87 Retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frontier-alpha87-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Rebase on latest main
        run: git pull --ff-only origin main
      - name: Apply Alpha.87 and fix canonical version line
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apply_alpha87.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('PRODUCTION_AND_FINISH_ALPHA87.md')
          s = p.read_text(encoding='utf-8')
          if '0.1.0-alpha.87' not in s:
              s = s.replace('# Frontier Settlement Alpha.87 — production logistics and finalization\n', '# Frontier Settlement Alpha.87 — production logistics and finalization\n\nVersion: `0.1.0-alpha.87`\n', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Cumulative source audit
        working-directory: projects/frontier-settlement
        run: python3 tools/test_alpha87_source.py
      - name: Canonical docs audit
        working-directory: projects/frontier-settlement
        run: python3 tools/test_alpha87_docs.py
      - name: Java 25 clean build and runtime JAR verify
        working-directory: projects/frontier-settlement
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache --no-build-cache clean build --stacktrace --console=plain
          python3 tools/verify_jar.py build/libs/frontier_settlement-0.1.0-alpha.87.jar
          git diff --check
      - name: Commit verified Alpha.87
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-frontier-alpha87-production-finish.yml
          rm -f .github/workflows/apply-frontier-alpha87-retry.yml
          rm -f projects/frontier-settlement/tools/apply_alpha87.py
          git add -A projects/frontier-settlement .github/workflows/apply-frontier-alpha87-production-finish.yml .github/workflows/apply-frontier-alpha87-retry.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Improve Frontier alpha.87 production logistics and finalization'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
