name: Patch Living Kingdoms full interior plan

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-living-kingdoms-full-interior-plan.yml'

concurrency:
  group: patch-living-kingdoms-full-interior-plan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  wire-compile-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Wire catalog into source bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java')
          s = p.read_text(encoding='utf-8')
          imp = 'import kr.moonseungjun.livingkingdoms.world.ErdenUrbanFullInteriorPlanCatalog;\n'
          anchor = 'import kr.moonseungjun.livingkingdoms.world.ErdenUrbanAuthoredUpperRouteManager;\n'
          if imp not in s:
              if anchor not in s: raise SystemExit('import anchor missing')
              s = s.replace(anchor, anchor + imp, 1)
          call = '        ErdenUrbanFullInteriorPlanCatalog.bootstrap();\n'
          call_anchor = '        ErdenUrbanUpperRoomOpportunityCatalog.bootstrap();\n'
          if call not in s:
              if call_anchor not in s: raise SystemExit('bootstrap anchor missing')
              s = s.replace(call_anchor, call_anchor + call, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F 'ErdenUrbanFullInteriorPlanCatalog.bootstrap();' projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java

      - name: Java 25 clean compile
        working-directory: projects/living-kingdoms
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Commit verified wiring to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java
          git commit -m 'feat(living-kingdoms): bootstrap complete interior plans'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 2))
          done
          exit 1
