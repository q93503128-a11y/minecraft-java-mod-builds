name: Manual Export Frontier Survival Graphics Pack
# trigger: registered workflow export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/manual-export-frontier-survival-graphics-pack.yml'

permissions:
  contents: read
  actions: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download validated base FULL artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/q93503128-a11y/minecraft-java-mod-builds/actions/artifacts/9931690848/zip" \
            -o base-artifact.zip
          mkdir base
          unzip -q base-artifact.zip -d base
          test -f base/Frontier_Settlement_Alpha91_SurvivalAscension_FULL_KO_JEI_NEW_WORLD.mrpack
          test -f base/projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.91.jar
          test -f base/projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar

      - name: Add dynamic lights, Sodium, Iris and Complementary Reimagined
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import urllib.parse
          import urllib.request
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          base = root / 'base' / 'Frontier_Settlement_Alpha91_SurvivalAscension_FULL_KO_JEI_NEW_WORLD.mrpack'
          out = root / 'Frontier_Settlement_Alpha91_SurvivalAscension_FULL_KO_JEI_GRAPHICS_NEW_WORLD.mrpack'
          ua = {'User-Agent': 'Frontier-Survival-Graphics-Pack/1.0'}

          def fetch_json(url):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def exact_version(project, loader, version_number):
              params = urllib.parse.urlencode({
                  'loaders': json.dumps([loader]),
                  'game_versions': json.dumps(['26.2']),
                  'include_changelog': 'false',
              })
              versions = fetch_json(f'https://api.modrinth.com/v2/project/{project}/version?{params}')
              matches = [v for v in versions if v.get('version_number') == version_number and v.get('version_type') == 'release']
              if len(matches) != 1:
                  available = [(v.get('version_number'), v.get('version_type')) for v in versions[:20]]
                  raise SystemExit(f'pin not found for {project} {version_number}; available={available}')
              meta = matches[0]
              file = next((f for f in meta['files'] if f.get('primary')), meta['files'][0])
              for key in ('sha1', 'sha512'):
                  if key not in file.get('hashes', {}):
                      raise SystemExit(f'{project} missing {key}')
              return meta, file

          pins = [
              ('lambdynamiclights', 'neoforge', '4.12.2+26.2', 'mods'),
              ('sodium', 'neoforge', 'mc26.2-0.9.1-neoforge', 'mods'),
              ('iris', 'neoforge', '1.11.2+26.2-neoforge', 'mods'),
              ('complementary-reimagined', 'iris', 'r5.9', 'shaderpacks'),
          ]

          resolved = []
          for project, loader, version, folder in pins:
              meta, file = exact_version(project, loader, version)
              resolved.append((project, version, folder, file))
              print(project, version, file['filename'])

          verify_dir = root / 'graphics-verify'
          verify_dir.mkdir(exist_ok=True)
          for project, version, folder, file in resolved:
              req = urllib.request.Request(file['url'], headers=ua)
              with urllib.request.urlopen(req, timeout=90) as r:
                  data = r.read()
              if hashlib.sha1(data).hexdigest() != file['hashes']['sha1']:
                  raise SystemExit(f'sha1 mismatch: {project}')
              if hashlib.sha512(data).hexdigest() != file['hashes']['sha512']:
                  raise SystemExit(f'sha512 mismatch: {project}')
              (verify_dir / file['filename']).write_bytes(data)

          with zipfile.ZipFile(base, 'r') as zin:
              index = json.loads(zin.read('modrinth.index.json'))
              names = {Path(entry['path']).name for entry in index['files']}
              for project, version, folder, file in resolved:
                  if file['filename'] in names:
                      raise SystemExit(f'graphics file already present unexpectedly: {file["filename"]}')
                  index['files'].append({
                      'path': f'{folder}/{file["filename"]}',
                      'hashes': {
                          'sha1': file['hashes']['sha1'],
                          'sha512': file['hashes']['sha512'],
                      },
                      'env': {'client': 'required', 'server': 'unsupported'},
                      'downloads': [file['url']],
                      'fileSize': file['size'],
                  })
                  names.add(file['filename'])

              shader_file = next(file for project, version, folder, file in resolved if project == 'complementary-reimagined')
              index['versionId'] = 'frontier-alpha91-survival-0.61-full-ko-jei-graphics-new-world.1'
              index['name'] = 'Frontier Settlement + Survival Ascension FULL KO + JEI + Graphics'
              index['summary'] = 'FULL Korean new-world pack with JEI, handheld dynamic lights, Sodium, Iris and Complementary Reimagined.'

              iris_properties = (
                  '# Frontier Survival graphics preset\n'
                  f'shaderPack={shader_file["filename"]}\n'
                  'enableShaders=true\n'
                  'allowUnknownShaders=false\n'
                  'enableDebugOptions=false\n'
                  'disableUpdateMessage=true\n'
                  'maxShadowRenderDistance=24\n'
                  'colorSpace=SRGB\n'
              )
              graphics_readme = (
                  'GRAPHICS ADD-ON\n\n'
                  'Client-only additions:\n'
                  '- LambDynamicLights 4.12.2+26.2: held/offhand torches and other light-emitting items illuminate while carried.\n'
                  '- Sodium mc26.2-0.9.1-neoforge: stable rendering optimization.\n'
                  '- Iris 1.11.2+26.2-neoforge: shader loader.\n'
                  '- Complementary Reimagined r5.9: selected and enabled by default.\n\n'
                  'If performance is too low, open Video Settings -> Shader Packs and disable shaders; dynamic held-item lighting remains available independently.\n'
              )

              with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zout:
                  for info in zin.infolist():
                      if info.filename == 'modrinth.index.json':
                          continue
                      if info.filename in ('overrides/config/iris.properties', 'overrides/GRAPHICS_README.txt'):
                          continue
                      zout.writestr(info, zin.read(info.filename))
                  zout.writestr('modrinth.index.json', json.dumps(index, ensure_ascii=False, indent=2) + '\n')
                  zout.writestr('overrides/config/iris.properties', iris_properties)
                  zout.writestr('overrides/GRAPHICS_README.txt', graphics_readme)

          with zipfile.ZipFile(out, 'r') as z:
              parsed = json.loads(z.read('modrinth.index.json'))
              paths = [x['path'] for x in parsed['files']]
              assert len(paths) == len(set(paths))
              assert any('lambdynamiclights' in p.lower() for p in paths)
              assert any('/sodium-' in ('/' + p.lower()) for p in paths)
              assert any('/iris-' in ('/' + p.lower()) for p in paths)
              shader = [p for p in paths if p.startswith('shaderpacks/')]
              assert len(shader) == 1 and 'Complementary' in shader[0]
              assert all(x.get('env', {}).get('server') == 'unsupported' for x in parsed['files'] if x['path'] in shader or any(k in x['path'].lower() for k in ('lambdynamiclights', 'sodium-', 'iris-')))
              cfg = z.read('overrides/config/iris.properties').decode('utf-8')
              assert 'enableShaders=true' in cfg and shader_file['filename'] in cfg

          sha = hashlib.sha256(out.read_bytes()).hexdigest()
          (root / 'FULL_KO_JEI_GRAPHICS_SHA256.txt').write_text(f'{sha}  {out.name}\n', encoding='utf-8')
          print('graphics_pack_sha256=', sha)
          PY

      - name: Upload graphics-enhanced pack
        uses: actions/upload-artifact@v4
        with:
          name: frontier-alpha91-survival-061-full-ko-jei-graphics-new-world
          path: |
            Frontier_Settlement_Alpha91_SurvivalAscension_FULL_KO_JEI_GRAPHICS_NEW_WORLD.mrpack
            FULL_KO_JEI_GRAPHICS_SHA256.txt
            base/projects/frontier-settlement/build/libs/frontier_settlement-0.1.0-alpha.91.jar
            base/projects/survival-ascension/build/libs/survivalascension-0.61.0-alpha.1.jar
          if-no-files-found: error
