name: Diagnose Countryside Days alpha.15 payload

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-diagnose-payload.yml']

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Inspect every payload part
        run: |
          mkdir -p release-transfer/countryside-days-alpha15-status
          REPORT=release-transfer/countryside-days-alpha15-status/payload-${GITHUB_RUN_ID}.txt
          python3 - <<'PY' > "$REPORT" 2>&1
          from pathlib import Path
          import hashlib
          t=Path('projects/countryside-days/tools')
          specs=[
            ('alpha15v2_00.part',8000,'05764a738c93db7933e60f6db85fea2d6cf168297536e79146ef28dc1eb96349'),
            ('alpha15v2_01.part',8000,'f62307daf23ace1c04c1c4b09fdf75e3ba2a24018c550a90558753f00fc6f8b6'),
            ('alpha15v2_02.part',8000,'647cf040b1669045f8e57f2a0eb67968e81c1753621095be6d3f4be046e00beb'),
            ('alpha15fix_03.part',8000,'c216a7b1eb12b7586dea47bfcdb8ed33c7c14ccad5f09e1654c8293ad01cb614'),
            ('alpha15fix_04.part',8000,'8058ef8da669949be9d9aa344130c3a17a0d75b3069438cbf433db60aba4eaad'),
            ('alpha15v2_05_06.part',16000,'ba4d245f3e29c0710e903a25c7fc2ada8cd306675bf373b8e001c22d88f931e9'),
            ('alpha15v2_07_08.part',16000,'17528aa349b2a47a0192ddf71506d270487439261742b3212e8b3407e6846c3d'),
            ('alpha15v2_09_10.part',16000,'a975b3c098d730d4077d8729118537ebd9c7f96aebd4455c8cb1f8dc1ed270c2'),
            ('alpha15v2_11_12.part',16000,'e341d7db6b6a277721f5aae8d5384a94d68e5778ad0399c302ebaf2a097c3dba'),
            ('alpha15v2_13_14.part',16000,'a1dd5c64d5d0524d691a228af3d07c35195a1ec76046947d647d9f080b256f05'),
            ('alpha15v2_15_16.part',16000,'0b84bdbbb7d5a93b360911a75c608961515cea999960e8027746ef296619418f'),
            ('alpha15v2_17_18.part',9648,'870c0a5b8faed07c9597402175e58b7659ed41ead761cb3a82f45f9bab6477d6')]
          print('run='+__import__('os').environ['GITHUB_RUN_ID'])
          for n,l,h in specs:
              p=t/n
              if not p.is_file():
                  print(f'{n}|MISSING|expected_len={l}|expected_sha={h}')
                  continue
              s=''.join(p.read_text('ascii').split())
              a=hashlib.sha256(s.encode()).hexdigest()
              print(f'{n}|len={len(s)}|sha={a}|ok={len(s)==l and a==h}')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$REPORT"
          git commit -m "Diagnose Countryside Days alpha.15 payload ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
