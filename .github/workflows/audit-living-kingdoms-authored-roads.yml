name: Audit Living Kingdoms authored roads

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-authored-roads.yml'

concurrency:
  group: living-kingdoms-authored-roads-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Compile authored road normalizer
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs
          gradle --no-daemon clean classes --stacktrace --console=plain \
            2>&1 | tee ../../logs/authored-roads-compile.log

      - name: Fresh world authored road and culvert audit
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-authored-roads-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-authored-roads-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain \
            > ../../logs/authored-roads-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 1200); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/authored-roads-server.log; then
              cat ../../logs/authored-roads-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_AUTHORED_ROADS_PASS revision=1' ../../logs/authored-roads-server.log \
              && grep -Fq 'Verified Erden urban infrastructure well=true fire_cistern=true royal_culvert=true' ../../logs/authored-roads-server.log \
              && grep -Fq 'LK_REALM_DIAGNOSTIC_PASS regions=1 residences=1' ../../logs/authored-roads-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/authored-roads-server.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/authored-roads-server.log
          test "$passed" -eq 1
          grep -F 'canopy_independent=true' ../../logs/authored-roads-server.log
          grep -F 'existing_saves_repaired=true' ../../logs/authored-roads-server.log
          grep -F 'culvert_reasserted=true' ../../logs/authored-roads-server.log
          grep -E 'road_columns=[1-9][0-9]*' ../../logs/authored-roads-server.log
          grep -E 'culvert_cells=[1-9][0-9]*' ../../logs/authored-roads-server.log
          grep -E 'diagnostic_y=[0-9]+' ../../logs/authored-roads-server.log
          grep -F 'Royal avenue culvert is incomplete' ../../logs/authored-roads-server.log && exit 1 || true

          if grep -Eqi 'watchdog|A single server tick took|Exception loading level|EventBusSubscriber.*failed' ../../logs/authored-roads-server.log; then
            exit 1
          fi

      - name: Upload authored road audit logs
        id: upload_logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-authored-roads-${{ github.run_number }}
          path: logs/
          retention-days: 30

      - name: Record authored road audit pointer
        if: always()
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOG_ARTIFACT_ID: ${{ steps.upload_logs.outputs.artifact-id }}
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout --detach origin/main
            mkdir -p .github/build-pointers
            cat > .github/build-pointers/living-kingdoms-authored-roads.json <<EOF
          {
            "run_id": "$GITHUB_RUN_ID",
            "run_number": "$GITHUB_RUN_NUMBER",
            "commit_sha": "$GITHUB_SHA",
            "job_status": "$JOB_STATUS",
            "log_artifact_id": "$LOG_ARTIFACT_ID"
          }
          EOF
            git add .github/build-pointers/living-kingdoms-authored-roads.json
            git commit -m "Record Living Kingdoms authored road audit $GITHUB_RUN_NUMBER" || exit 0
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
