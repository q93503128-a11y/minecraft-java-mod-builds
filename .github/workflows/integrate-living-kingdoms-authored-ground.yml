name: Integrate Living Kingdoms authored ground interiors

on:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/.authored-ground-trigger'
  workflow_dispatch:

permissions:
  contents: write

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CLIENT_TEST: '0'

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Patch economy and startup integration
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_living_kingdoms_authored_ground_economy.py
          git diff --check
          grep -F 'ErdenUrbanAuthoredGroundPlanCatalog.primaryContainer(entrance)' \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java
          grep -F 'ErdenUrbanAuthoredGroundPlanCatalog.bootstrap();' \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java
          ! grep -Fq 'AuthoredContinentDensity' \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java

      - name: Java 25 clean compile
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean classes --stacktrace --console=plain

      - name: Fresh-world authored interior smoke test
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf run/world run/living_realm run/livingkingdoms-authored-ground-ci-world
          mkdir -p run ../../logs
          printf 'level-name=livingkingdoms-authored-ground-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/authored-ground-server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          passed=0
          for attempt in $(seq 1 1200); do
            if grep -Eqi 'Authored-ground materializer refused source cut|Unable to activate authored Erden urban interior|LK_REALM_DIAGNOSTIC_FAIL|BUILD FAILED' ../../logs/authored-ground-server.log; then
              cat ../../logs/authored-ground-server.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_AUTHORED_GROUND_FUNCTIONAL_PLAN_PASS placements=233' ../../logs/authored-ground-server.log \
              && grep -Fq 'LK_ERDEN_AUTHORED_GROUND_MATERIALIZER_PASS' ../../logs/authored-ground-server.log \
              && grep -Fq 'LK_URBAN_INTERIOR_DIAGNOSTIC_PASS' ../../logs/authored-ground-server.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/authored-ground-server.log
              exit 1
            fi
            sleep 1
          done
          cat ../../logs/authored-ground-server.log
          test "$passed" -eq 1
          grep -F 'LK_ERDEN_AUTHORED_GROUND_FUNCTIONAL_PLAN_PASS placements=233' ../../logs/authored-ground-server.log \
            | grep -F 'synthetic_rooms=0' | grep -F 'source_blocks_cut=0'
          grep -F 'LK_ERDEN_AUTHORED_GROUND_MATERIALIZER_PASS' ../../logs/authored-ground-server.log \
            | grep -F 'synthetic_room=false' | grep -F 'source_blocks_cut=0'
          grep -F 'LK_URBAN_INTERIOR_DIAGNOSTIC_PASS' ../../logs/authored-ground-server.log \
            | grep -F 'authored_ground=true' | grep -F 'synthetic_room=false'

      - name: Commit verified integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java \
                  projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java
          git commit -m 'refactor(living-kingdoms): bind economy to authored urban interiors'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
