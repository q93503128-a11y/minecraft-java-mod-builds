name: Package Frontier Survival Release 20260907

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/package-frontier-survival-release-20260907.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Build and verify both project JARs
        shell: bash
        run: |
          set -euo pipefail
          FRONTIER=projects/frontier-settlement
          SURVIVAL=projects/survival-ascension
          FV="$(sed -n 's/^mod_version=//p' "$FRONTIER/gradle.properties")"
          SV="$(sed -n 's/^mod_version=//p' "$SURVIVAL/gradle.properties")"
          echo "FV=$FV" >> "$GITHUB_ENV"
          echo "SV=$SV" >> "$GITHUB_ENV"
          chmod +x "$FRONTIER/gradlew" "$SURVIVAL/gradlew"
          (cd "$FRONTIER" && python3 tools/test_current_source.py && python3 tools/test_current_docs.py && ./gradlew --no-daemon --no-configuration-cache clean build --console=plain && python3 tools/verify_jar.py "build/libs/frontier_settlement-$FV.jar")
          (cd "$SURVIVAL" && python3 tools/test_current_source.py && ./gradlew --no-daemon --no-configuration-cache clean build --console=plain && python3 tools/verify_jar.py "build/libs/survivalascension-$SV.jar" && python3 tools/verify_release_jar.py "build/libs/survivalascension-$SV.jar")

      - name: Build combined one-import MRPACK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, urllib.request, zipfile
          from pathlib import Path

          root = Path('.')
          frontier = root / 'projects/frontier-settlement'
          survival = root / 'projects/survival-ascension'
          fv = os.environ['FV']
          sv = os.environ['SV']
          fj = frontier / 'build/libs' / f'frontier_settlement-{fv}.jar'
          sj = survival / 'build/libs' / f'survivalascension-{sv}.jar'
          out = root / 'release' / f'frontier-settlement-{fv}-survival-ascension-{sv}-dnt-auto.mrpack'
          user_agent = 'FrontierSurvivalCombinedPack/2026.09.07'

          def get_json(url: str) -> dict:
              req = urllib.request.Request(url, headers={'User-Agent': user_agent, 'Accept': 'application/json'})
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.loads(r.read().decode('utf-8'))

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          files: list[dict] = []
          by_sha512: dict[str, dict] = {}
          by_path: dict[str, dict] = {}

          def add_entry(entry: dict):
              path = entry['path']
              s512 = entry['hashes']['sha512'].lower()
              if s512 in by_sha512:
                  old = by_sha512[s512]
                  if old['hashes']['sha1'].lower() != entry['hashes']['sha1'].lower():
                      raise SystemExit(f'dedup hash mismatch for {path}')
                  return
              if path in by_path:
                  raise SystemExit(f'conflicting duplicate pack path: {path}')
              if not all(url.startswith('https://cdn.modrinth.com/') for url in entry['downloads']):
                  raise SystemExit(f'non-Modrinth external download: {path}')
              if not isinstance(entry.get('fileSize'), int) or entry['fileSize'] <= 0:
                  raise SystemExit(f'missing fileSize: {path}')
              files.append(entry)
              by_sha512[s512] = entry
              by_path[path] = entry

          # Survival canonical content lock: resolve the exact locked Modrinth versions live.
          slock = json.loads((survival / 'modpack/content-lock.json').read_text(encoding='utf-8'))
          for locked in slock['mods']:
              meta = get_json('https://api.modrinth.com/v2/version/' + locked['version_id'])
              if meta.get('id') != locked['version_id'] or meta.get('project_id') != locked['project_id']:
                  raise SystemExit(f"Survival lock identity mismatch: {locked['name']}")
              if '26.2' not in meta.get('game_versions', []) or 'neoforge' not in meta.get('loaders', []):
                  raise SystemExit(f"Survival lock target mismatch: {locked['name']}")
              candidates = [f for f in meta.get('files', []) if 'neoforge' in str(f.get('filename','')).lower()]
              if not candidates:
                  candidates = meta.get('files', [])
              selected = next((f for f in candidates if f.get('primary')), candidates[0])
              hashes = selected.get('hashes', {})
              add_entry({
                  'path': 'mods/' + selected['filename'],
                  'hashes': {'sha1': hashes['sha1'], 'sha512': hashes['sha512']},
                  'env': {'client': 'required', 'server': 'required'},
                  'downloads': [selected['url']],
                  'fileSize': int(selected['size']),
              })

          # Frontier client lock is already CI hash-verified. Query the same Modrinth
          # version only for authoritative file size and require URL/name/hash equality.
          flock = json.loads((frontier / 'companion-testpack/resolved-lock.client.json').read_text(encoding='utf-8'))
          if flock.get('target', {}).get('frontier_settlement') != fv or not flock.get('resolution', {}).get('verified'):
              raise SystemExit('Frontier resolved client lock is not current/verified')
          for pin in flock['files']:
              url = pin['url']
              marker = '/versions/'
              if marker not in url or not url.startswith('https://cdn.modrinth.com/'):
                  raise SystemExit(f"Frontier pin is not auto-installable from Modrinth: {pin['id']}")
              version_id = url.split(marker, 1)[1].split('/', 1)[0]
              meta = get_json('https://api.modrinth.com/v2/version/' + version_id)
              selected = next((f for f in meta.get('files', []) if f.get('url') == url), None)
              if selected is None:
                  selected = next((f for f in meta.get('files', []) if f.get('filename') == pin['filename']), None)
              if selected is None:
                  raise SystemExit(f"Frontier pinned file missing upstream: {pin['id']}")
              hashes = selected.get('hashes', {})
              if selected['filename'] != pin['filename'] or hashes.get('sha1','').lower() != pin['sha1'].lower() or hashes.get('sha512','').lower() != pin['sha512'].lower():
                  raise SystemExit(f"Frontier upstream pin drift: {pin['id']}")
              env = {'client': 'required', 'server': 'unsupported'} if pin['side'] == 'client_preferred' else {'client': 'required', 'server': 'required'}
              add_entry({
                  'path': 'mods/' + pin['filename'],
                  'hashes': {'sha1': pin['sha1'], 'sha512': pin['sha512']},
                  'env': env,
                  'downloads': [url],
                  'fileSize': int(selected['size']),
              })

          index = {
              'formatVersion': 1,
              'game': 'minecraft',
              'versionId': f'frontier-{fv}-survival-{sv}',
              'name': 'Frontier Settlement + Survival Ascension',
              'summary': 'One-import Minecraft 26.2 test pack for Frontier Settlement and Survival Ascension.',
              'files': files,
              'dependencies': {'minecraft': '26.2', 'neoforge': '26.2.0.38-beta'},
          }
          readme = (
              'Frontier Settlement + Survival Ascension one-import test pack\n'
              f'Frontier Settlement: {fv}\nSurvival Ascension: {sv}\n'
              'Minecraft 26.2 / NeoForge 26.2.0.38-beta / Java 25\n\n'
              'Third-party mods are not embedded. They are downloaded from their pinned Modrinth CDN URLs.\n'
              'The two project-owned JARs are embedded under overrides/mods.\n'
              f'Frontier SHA-256: {sha256(fj)}\nSurvival SHA-256: {sha256(sj)}\n'
          )
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              z.writestr('modrinth.index.json', json.dumps(index, ensure_ascii=False, indent=2) + '\n')
              z.write(fj, 'overrides/mods/' + fj.name)
              z.write(sj, 'overrides/mods/' + sj.name)
              z.writestr('overrides/FRONTIER_SURVIVAL_PACK_README.txt', readme)

          # Structural self-audit against the published MRPACK contract.
          with zipfile.ZipFile(out) as z:
              names = z.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate ZIP entry in combined MRPACK')
              parsed = json.loads(z.read('modrinth.index.json').decode('utf-8'))
              if parsed['formatVersion'] != 1 or parsed['game'] != 'minecraft':
                  raise SystemExit('invalid MRPACK root metadata')
              if parsed['dependencies'] != {'minecraft': '26.2', 'neoforge': '26.2.0.38-beta'}:
                  raise SystemExit('MRPACK runtime target drift')
              if len(parsed['files']) != 22:
                  raise SystemExit(f"expected 22 deduplicated external files, got {len(parsed['files'])}")
              for e in parsed['files']:
                  if len(e['hashes']['sha1']) != 40 or len(e['hashes']['sha512']) != 128:
                      raise SystemExit('invalid MRPACK external hash length')
                  if not e['path'].startswith('mods/') or '..' in e['path']:
                      raise SystemExit('unsafe MRPACK external path')
              own = [n for n in names if n.startswith('overrides/mods/') and n.endswith('.jar')]
              if sorted(own) != sorted(['overrides/mods/' + fj.name, 'overrides/mods/' + sj.name]):
                  raise SystemExit('combined MRPACK must embed exactly the two project-owned JARs')
          print(f'COMBINED MRPACK PASS: {out} external_files={len(files)} sha256={sha256(out)}')
          PY
          cp "projects/frontier-settlement/build/libs/frontier_settlement-$FV.jar" release/
          cp "projects/survival-ascension/build/libs/survivalascension-$SV.jar" release/
          (cd release && sha256sum *.jar *.mrpack > SHA256SUMS.txt)
          cat release/SHA256SUMS.txt

      - name: Upload final test deliverables
        uses: actions/upload-artifact@v4
        with:
          name: frontier-survival-final-test-deliverables
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary packaging workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            git rm -f .github/workflows/package-frontier-survival-release-20260907.yml
            git commit -m 'Remove temporary release packaging workflow [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
