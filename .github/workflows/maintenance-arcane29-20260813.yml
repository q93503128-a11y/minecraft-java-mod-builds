name: Arcane Circle alpha.29 corrective patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/maintenance-arcane29-20260813.yml'

permissions:
  contents: write

concurrency:
  group: maintenance-arcane29-20260813
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply alpha.29 corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 .github/scripts/arcane_alpha29_20260813.py
          python3 projects/arcane-circle/tools/test_current_source.py
          git diff --check
          git status --short
          git add -A
          git commit -m 'Arcane Circle alpha.29: responsive grimoire, range sigils, light, stability'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
