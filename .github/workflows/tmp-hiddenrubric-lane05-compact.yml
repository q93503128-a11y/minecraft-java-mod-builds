name: Temporary Hidden Rubric Lane05 compact review
on:
  push:
    branches: [tmp-hiddenrubric-lane05-extract]
    paths:
      - '.github/workflows/tmp-hiddenrubric-lane05-compact.yml'
      - 'tools/tmp_hiddenrubric_lane05_compact.py'
permissions:
  contents: write
jobs:
  compact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-hiddenrubric-lane05-extract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/tmp_hiddenrubric_lane05_compact.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp/hiddenrubric-lane05-compact
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'temp: materialize Lane05 compact review [skip ci]'
          git push origin HEAD:tmp-hiddenrubric-lane05-extract
