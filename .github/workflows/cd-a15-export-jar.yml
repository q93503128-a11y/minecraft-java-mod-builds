name: Export Countryside Days alpha.15 JAR

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cd-a15-export-jar.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore verified alpha.15 source payload
        id: restore
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, zipfile
          root=Path('.').resolve(); project=root/'projects/countryside-days'; tools=project/'tools'
          specs=[
            ('alpha15v2_00.part',8000,'05764a738c93db7933e60f6db85fea2d6cf168297536e79146ef28dc1eb96349'),
            ('alpha15v2_01.part',8000,'f62307daf23ace1c04c1c4b09fdf75e3ba2a24018c550a90558753f00fc6f8b6'),
            ('alpha15v2_02.part',8000,'647cf040b1669045f8e57f2a0eb67968e81c1753621095be6d3f4be046e00beb'),
            ('alpha15fix_03.part',8000,'c216a7b1eb12b7586dea47bfcdb8ed33c7c14ccad5f09e1654c8293ad01cb614'),
            ('alpha15fix_04.part',8000,'8058ef8da669949be9d9aa344130c3a17a0d75b3069438cbf433db60aba4eaad'),
            ('alpha15v2_05_06.part',16000,'ba4d245f3e29c0710e903a25c7fc2ada8cd306675bf373b8e001c22d88f931e9'),
            ('alpha15v2_07_08.part',16000,'17528aa349b2a47a0192ddf71506d270487439261742b3212e8b3407e6846c3d'),
            ('alpha15v2_09_10.part',16000,'a975b3c098d730d4077d8729118537ebd9c7f96aebd4455c8cb1f8dc1ed270c2'),
            ('alpha15v2_11_12.part',16000,'e341d7db6b6a277721f5aae8d5384a94d68e5778ad0399c302ebaf2a097c3dba'),
            ('alpha15v2_13_14.part',16000,'a1dd5c64d5d0524d691a228af3d07c35195a1ec76046947d647d9f080b256f05'),
            ('alpha15v2_15_16.part',16000,'0b84bdbbb7d5a93b360911a75c608961515cea999960e8027746ef296619418f'),
            ('alpha15v2_17_18.part',9648,'870c0a5b8faed07c9597402175e58b7659ed41ead761cb3a82f45f9bab6477d6')]
          chunks=[]
          for name,size,expected in specs:
              path=tools/name
              if not path.is_file(): raise SystemExit('missing '+name)
              text=''.join(path.read_text('ascii').split())
              actual=hashlib.sha256(text.encode('ascii')).hexdigest()
              if len(text)!=size or actual!=expected: raise SystemExit(f'bad {name}: {len(text)} {actual}')
              chunks.append(text)
          encoded=''.join(chunks)
          if len(encoded)!=145648 or hashlib.sha256(encoded.encode('ascii')).hexdigest()!='2215f32a4fda34d490241a811051e9164eb39a4f31831894e9ce3df3361ec4ca':
              raise SystemExit('bad combined payload text')
          archive=base64.b64decode(encoded,validate=True)
          if len(archive)!=109234 or hashlib.sha256(archive).hexdigest()!='5499bb9fe956c9bf11a6f311105e03bcc694bc2adeed74080431cd882d80b835':
              raise SystemExit('bad payload archive')
          with zipfile.ZipFile(io.BytesIO(archive)) as zf:
              if zf.testzip(): raise SystemExit('bad zip member')
              for name in zf.namelist():
                  p=Path(name)
                  if not name.startswith('projects/countryside-days/') or '..' in p.parts or p.is_absolute():
                      raise SystemExit('unsafe '+name)
              zf.extractall(root)
          if 'mod_version=0.1.0-alpha.15' not in (project/'gradle.properties').read_text('utf-8'):
              raise SystemExit('wrong restored version')
          print('verified alpha.15 source restored')
          PY

      - name: Apply verified compile and GameTest fixes
        id: patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import gzip, struct
          root=Path('projects/countryside-days')

          p=root/'src/main/java/kr/countrysidedays/gameplay/VillageLifeManager.java'
          s=p.read_text('utf-8')
          old='''        if (!(event.getEntity() instanceof ServerPlayer player)) return;\n        if (!(event.getLevel() instanceof ServerLevel level)) return;\n'''
          new='''        ServerPlayer player = event.getEntity();\n        if (!(event.getLevel() instanceof ServerLevel level)) return;\n'''
          if old in s: s=s.replace(old,new)
          elif new not in s: raise SystemExit('VillageLifeManager patch target missing')
          p.write_text(s,'utf-8')

          targets=[
            ('src/main/java/kr/countrysidedays/world/StarterHomesteadGenerator.java',
             'origin.offset(PlayerEstateLayout.MIN_X - 4, -2, PlayerEstateLayout.MIN_Z - 4)',
             'origin.offset(PlayerEstateLayout.MAX_X + 5, 12, PlayerEstateLayout.MAX_Z + 5)'),
            ('src/main/java/kr/countrysidedays/world/PublicVillageExpansionBuilder.java',
             'origin.offset(-MAP_HALF_WIDTH - 4, -2, -MAP_HALF_DEPTH - 4)',
             'origin.offset(MAP_HALF_WIDTH + 5, 14, MAP_HALF_DEPTH + 5)')]
          old_loop='''        for (ItemEntity item : new ArrayList<>(level.getEntities().getAll().stream()\n                .filter(ItemEntity.class::isInstance)\n                .map(ItemEntity.class::cast)\n                .toList())) {\n'''
          for rel,lo,hi in targets:
              p=root/rel; s=p.read_text('utf-8')
              if 'import net.minecraft.world.phys.AABB;' not in s:
                  lines=s.splitlines(True)
                  idx=max(i for i,x in enumerate(lines) if x.startswith('import net.minecraft.world.level.block.state'))
                  lines.insert(idx+1,'import net.minecraft.world.phys.AABB;\n')
                  s=''.join(lines)
              new_loop=f'''        AABB bounds = new AABB(\n                {lo},\n                {hi}\n        );\n        for (ItemEntity item : new ArrayList<>(level.getEntitiesOfClass(ItemEntity.class, bounds))) {{\n'''
              if old_loop in s: s=s.replace(old_loop,new_loop)
              elif new_loop not in s: raise SystemExit('debris patch target missing '+rel)
              p.write_text(s,'utf-8')

          p=root/'src/main/resources/data/countrysidedays/worldgen/biome/rural_plains.json'
          s=p.read_text('utf-8').replace('minecraft:trees_birch_and_oak_leaf_litter','minecraft:trees_birch_and_oak')
          p.write_text(s,'utf-8')

          def u16(v):
              b=v.encode('utf-8'); return struct.pack('>H',len(b))+b
          def tag(t,n,payload): return bytes([t])+u16(n)+payload
          def lst(t,items): return bytes([t])+struct.pack('>i',len(items))+b''.join(items)
          def compound(items): return b''.join(items)+b'\x00'
          palette=compound([tag(8,'Name',u16('minecraft:air'))])
          body=compound([
              tag(3,'DataVersion',struct.pack('>i',0)),
              tag(9,'size',lst(3,[struct.pack('>i',1)]*3)),
              tag(9,'palette',lst(10,[palette])),
              tag(9,'blocks',lst(10,[])),
              tag(9,'entities',lst(10,[]))])
          raw=bytes([10])+u16('')+body
          out=root/'src/main/resources/data/countrysidedays/structure'; out.mkdir(parents=True,exist_ok=True)
          for name in ('homestead_layout.nbt','world_data_round_trip.nbt'):
              with (out/name).open('wb') as target:
                  with gzip.GzipFile(filename='',mode='wb',fileobj=target,mtime=0) as gz: gz.write(raw)
          print('verified source fixes applied')
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build and verify JAR
        id: build
        working-directory: projects/countryside-days
        run: |
          if [ ! -x ./gradlew ]; then
            gradle wrapper --gradle-version 9.2.1 --distribution-type bin
            chmod +x gradlew
          fi
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee /tmp/cd-a15-build.log
          JAR=build/libs/countrysidedays-0.1.0-alpha.15.jar
          test -s "$JAR"
          python3 tools/verify_jar.py "$JAR"
          unzip -t "$JAR"

      - name: Encode verified JAR for transfer
        id: encode
        run: |
          rm -rf release-transfer/countryside-days-alpha15
          mkdir -p release-transfer/countryside-days-alpha15
          JAR=projects/countryside-days/build/libs/countrysidedays-0.1.0-alpha.15.jar
          base64 -w0 "$JAR" > /tmp/cd-a15.b64
          split -b 60000 -d -a 2 /tmp/cd-a15.b64 release-transfer/countryside-days-alpha15/part-
          {
            echo "filename=countrysidedays-0.1.0-alpha.15.jar"
            echo "size=$(stat -c%s "$JAR")"
            echo "sha256=$(sha256sum "$JAR" | cut -d' ' -f1)"
            echo "base64_size=$(stat -c%s /tmp/cd-a15.b64)"
            echo "parts=$(find release-transfer/countryside-days-alpha15 -name 'part-*' | wc -l)"
            echo "payload_sha256=5499bb9fe956c9bf11a6f311105e03bcc694bc2adeed74080431cd882d80b835"
            echo "run=${GITHUB_RUN_ID}"
          } > release-transfer/countryside-days-alpha15/MANIFEST.txt

      - name: Publish transfer files
        id: publish
        run: |
          git restore --source=HEAD --staged --worktree projects/countryside-days
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add release-transfer/countryside-days-alpha15
          git commit -m 'Publish verified Countryside Days alpha.15 JAR transfer'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish diagnostic status
        if: always()
        env:
          RESTORE_OUTCOME: ${{ steps.restore.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          ENCODE_OUTCOME: ${{ steps.encode.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
        run: |
          git restore --source=HEAD --staged --worktree projects/countryside-days || true
          mkdir -p release-transfer/countryside-days-alpha15-status
          STATUS=release-transfer/countryside-days-alpha15-status/${GITHUB_RUN_ID}.txt
          {
            echo "run=${GITHUB_RUN_ID}"
            echo "source=${GITHUB_SHA}"
            echo "restore=${RESTORE_OUTCOME}"
            echo "patch=${PATCH_OUTCOME}"
            echo "build=${BUILD_OUTCOME}"
            echo "encode=${ENCODE_OUTCOME}"
            echo "publish=${PUBLISH_OUTCOME}"
            if [ -f /tmp/cd-a15-build.log ]; then
              echo '--- build tail ---'
              tail -n 120 /tmp/cd-a15-build.log
            fi
          } > "$STATUS"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$STATUS"
          git commit -m "Record Countryside Days alpha.15 export ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
