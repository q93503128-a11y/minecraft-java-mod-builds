name: TEMP HiddenRubric Lane04 Seed Phrase Recover
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-hiddenrubric-lane04-seed-phrase-recover.yml'
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install --upgrade pip pyarrow huggingface_hub
      - name: Recover seed phrases
        shell: bash
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          import pyarrow.parquet as pq
          from huggingface_hub import hf_hub_download
          REPO='lmarena-ai/arena-human-preference-140k'; REV='a9cb587ee0906192dc1fc5e51778282f36c6bf35'
          SHARDS=[f'data/train-{i:05d}-of-00007.parquet' for i in range(7)]
          SEEDS=[
            ('the sponsor',r'approval|approve|review|sign.?off'),
            ('my manager',r'feedback|review|approve|approval|evaluate|assessment'),
            ('the auditors',r'review|audit|feedback|approve|approval'),
            ('the Hiring Manager',r'evaluat|interview|review|assess|select|hire'),
            ('my supervisor',r'feedback|report|review|approve|approval|comment'),
            ('admin',r'review|reject|approve|approval'),
            ('judges',r'presentation|present|submit|impress|judge|evaluat|score|award|competition|hackathon'),
            ('potential investors and stakeholders',r'evaluat|review|assess|viability|approval'),
            ('reader',r'beta|sensitivity|review|feedback'),
            ('Senior Leadership',r'approval|approve|review|feedback|sign.?off'),
            ('my team lead',r'case|submit|review|feedback|approve|approval'),
            ('the President of the ISPOR Ghana Chapter',r'report|submit|review|feedback|approve'),
            ('my colleague',r'comment|documentation|review|feedback'),
          ]
          def ctext(m):
            if not isinstance(m,dict): return ''
            if isinstance(m.get('text'),str): return m['text']
            c=m.get('content')
            if isinstance(c,str): return c
            if isinstance(c,list): return '\n'.join(i if isinstance(i,str) else i.get('text','') if isinstance(i,dict) else '' for i in c).strip()
            return ''
          def turns(row):
            out=[]
            for e in row.get('full_conversation') or []:
              if not isinstance(e,dict): continue
              u=e.get('user')
              if isinstance(u,dict):
                t=ctext(u).strip()
                if t: out.append(t)
              elif str(e.get('role') or '')=='user':
                t=ctext(e).strip()
                if t: out.append(t)
            return out
          raw=0; hits=[]; seen=set()
          for sh in SHARDS:
            p=hf_hub_download(REPO,filename=sh,repo_type='dataset',revision=REV)
            pf=pq.ParquetFile(p); cols=['id','evaluation_session_id','evaluation_order','language','is_code','full_conversation']; use=[c for c in cols if c in pf.schema_arrow.names]
            for b in pf.iter_batches(batch_size=512,columns=use):
              for row in b.to_pylist():
                raw+=1
                if row.get('language')!='en' or bool(row.get('is_code')): continue
                for ti,text in enumerate(turns(row)):
                  lo=text.casefold()
                  for actor,rel in SEEDS:
                    pos=lo.find(actor.casefold())
                    if pos<0: continue
                    rx=re.compile(rel,re.I); relhits=list(rx.finditer(text))
                    if not relhits: continue
                    # choose closest relation hit to actor phrase
                    rm=min(relhits,key=lambda m:abs(m.start()-pos))
                    distance=abs(rm.start()-pos)
                    key=(str(row.get('id') or ''),ti,actor.casefold())
                    if key in seen: continue
                    seen.add(key)
                    s=max(0,min(pos,rm.start())-300); e=min(len(text),max(pos+len(actor),rm.end())+450)
                    hits.append({'sourceRowId':str(row.get('id') or ''),'sourceEvaluationSessionId':str(row.get('evaluation_session_id') or ''),'evaluationOrder':int(row.get('evaluation_order') or 0),'turnIndex':ti,'actor':actor,'relationMatch':rm.group(0),'distance':distance,'sourceLength':len(text),'context':text[s:e],'sourceText':text,'assistantOutputsIncluded':False})
          assert raw==135634,raw
          hits.sort(key=lambda x:(x['distance'],x['sourceLength'],x['actor'],x['sourceRowId'],x['turnIndex']))
          out=Path('temp-hiddenrubric/lane04/seed-phrase-recovery'); out.mkdir(parents=True,exist_ok=True)
          (out/'hits.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in hits),encoding='utf-8')
          compact=[{k:x[k] for k in ('sourceRowId','sourceEvaluationSessionId','turnIndex','actor','relationMatch','distance','sourceLength','context')} for x in hits]
          (out/'compact.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False)+'\n' for x in compact),encoding='utf-8')
          (out/'manifest.json').write_text(json.dumps({'rawRows':raw,'hits':len(hits),'sourceRevision':REV,'assistantOutputsIncluded':False},indent=2)+'\n',encoding='utf-8')
          print('hits',len(hits))
          PY
      - name: Commit recovery
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temp-hiddenrubric/lane04/seed-phrase-recovery/
          git commit -m 'chore: materialize temporary Lane04 evaluator seed recovery'
          git push origin HEAD:main
