name: Patch Living Kingdoms population CI retention

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-living-kingdoms-population-ci-retention.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain only CI sample chunks
        run: |
          set -euo pipefail
          path='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPopulationManager.java'
          python - <<'PY'
          from pathlib import Path
          path = Path('projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPopulationManager.java')
          text = path.read_text(encoding='utf-8')
          old = '''    private static void requestCiChunks(
            ServerLevel level,
            ErdenPopulationSavedData population) {
        if (ciChunksRequested
                || !"1".equals(System.getenv("LIVING_KINGDOMS_CI_REALM_TEST"))
                || population.households().isEmpty()) return;
        ErdenPopulationSavedData.Household sample = population.households().getFirst();
        requestBuildingChunks(level, sample.homeX(), sample.homeZ());
        for (ErdenPopulationSavedData.Resident resident : sample.residents()) {
            if (resident.worker()) requestBuildingChunks(level, resident.workX(), resident.workZ());
        }
        ciChunksRequested = true;
    }

    private static void requestBuildingChunks(ServerLevel level, int x, int z) {
'''
          new = '''    private static void requestCiChunks(
            ServerLevel level,
            ErdenPopulationSavedData population) {
        if (!"1".equals(System.getenv("LIVING_KINGDOMS_CI_REALM_TEST"))
                || ciPassed
                || population.households().isEmpty()) return;
        ErdenPopulationSavedData.Household sample = population.households().getFirst();
        if (!ciChunksRequested) {
            requestBuildingChunks(level, sample.homeX(), sample.homeZ());
            for (ErdenPopulationSavedData.Resident resident : sample.residents()) {
                if (resident.worker()) {
                    requestBuildingChunks(level, resident.workX(), resident.workZ());
                }
            }
            ciChunksRequested = true;
        }
        forceCiBuildingChunks(level, sample.homeX(), sample.homeZ());
        for (ErdenPopulationSavedData.Resident resident : sample.residents()) {
            if (resident.worker()) {
                forceCiBuildingChunks(level, resident.workX(), resident.workZ());
            }
        }
    }

    private static void forceCiBuildingChunks(ServerLevel level, int x, int z) {
        ExternalUrbanFabricBuilder.UrbanEntrance entrance = findEntrance(x, z);
        if (entrance == null) return;
        Bounds bounds = room(entrance, 0).bounds();
        for (int chunkX = Math.floorDiv(bounds.minX, 16);
             chunkX <= Math.floorDiv(bounds.maxX, 16); chunkX++) {
            for (int chunkZ = Math.floorDiv(bounds.minZ, 16);
                 chunkZ <= Math.floorDiv(bounds.maxZ, 16); chunkZ++) {
                level.setChunkForced(chunkX, chunkZ, true);
                level.getChunk(chunkX, chunkZ);
            }
        }
    }

    private static void requestBuildingChunks(ServerLevel level, int x, int z) {
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one CI request method, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$path"
          git commit -m 'Retain Erden population CI sample chunks'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 2))
          done
          exit 1
