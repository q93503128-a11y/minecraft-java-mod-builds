name: Patch Living Kingdoms capital lifecycle

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/wire_erden_capital_lifecycle.py'
      - '.github/workflows/patch-living-kingdoms-capital-lifecycle.yml'

concurrency:
  group: living-kingdoms-capital-lifecycle-patch
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Wire capital lifecycle into population and economy
        run: python .github/scripts/wire_erden_capital_lifecycle.py
      - name: Clean compile Living Kingdoms
        working-directory: projects/living-kingdoms
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Verify capital lifecycle invariants
        shell: bash
        run: |
          set -euo pipefail
          life='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleManager.java'
          saved='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleSavedData.java'
          pop='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPopulationManager.java'
          eco='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java'
          mod='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java'
          grep -Fq 'LK_ERDEN_CAPITAL_LIFECYCLE_PASS' "$life"
          grep -Fq 'source_blocks_cut=0' "$life"
          grep -Fq 'save_overlay=true' "$life"
          grep -Fq 'ErdenCapitalLifecycleManager.prepare(level, population)' "$pop"
          grep -Fq 'ErdenCapitalLifecycleManager.activeWorkers(level, population, day)' "$eco"
          grep -Fq 'payWages(workers, sites, wallets, counters)' "$eco"
          grep -Fq 'ErdenCapitalLifecycleManager.onServerTick(event)' "$mod"
          grep -Fq 'SCHEMA_VERSION = 1' "$saved"
      - name: Commit compiled integration directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenPopulationManager.java \
            projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenAuthoritativeEconomyManager.java
          git diff --cached --quiet && exit 0
          git commit -m 'feat(living-kingdoms): wire capital generations into city life'
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1
