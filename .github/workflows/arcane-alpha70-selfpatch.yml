name: Arcane alpha70 self patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/arcane-alpha70-selfpatch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply robust alpha70 patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          fifth = root/'projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/magic/FifthCircleSpellService.java'
          world = root/'projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/magic/WorldMagicService.java'
          tracker = root/'projects/arcane-circle/src/main/java/kr/moonseungjun/arcanecircle/client/WorldMagicTracker.java'

          def rep(path, old, new, expected=1):
              body = path.read_text(encoding='utf-8')
              n = body.count(old)
              if n != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, got {n}: {old[:90]!r}')
              path.write_text(body.replace(old, new), encoding='utf-8')

          def sub(path, pattern, repl, expected=1):
              body = path.read_text(encoding='utf-8')
              body2, n = re.subn(pattern, repl, body, flags=re.S)
              if n != expected:
                  raise SystemExit(f'{path}: regex expected {expected}, got {n}: {pattern[:90]!r}')
              path.write_text(body2, encoding='utf-8')

          rep(fifth, '    public static final int TELEKINESIS_TICKS = 100;\n',
              '    public static final int TELEKINESIS_TICKS = 100;\n'
              '    public static final int FLAME_STRIKE_TICKS = 80;\n'
              '    public static final int FLAME_STRIKE_PULSE_TICKS = 10;\n')
          rep(fifth, '    public static final int DOMINATE_PERSON_TICKS = 260;',
              '    public static final int DOMINATE_PERSON_TICKS = 600;')
          rep(fifth, '    private static final List<CloudkillZone> CLOUDS = new ArrayList<>();\n',
              '    private static final List<CloudkillZone> CLOUDS = new ArrayList<>();\n'
              '    private static final List<FlameStrikeField> FLAME_STRIKES = new ArrayList<>();\n')
          rep(fifth, '        tickClouds(level, now);\n        tickInsects(level, now);',
              '        tickClouds(level, now);\n        tickFlameStrikes(level, now);\n        tickInsects(level, now);')
          rep(fifth, '        CLOUDS.removeIf(state -> state.ownerId.equals(id));\n        INSECTS.removeIf(state -> state.ownerId.equals(id));',
              '        CLOUDS.removeIf(state -> state.ownerId.equals(id));\n        FLAME_STRIKES.removeIf(state -> state.ownerId.equals(id));\n        INSECTS.removeIf(state -> state.ownerId.equals(id));')
          rep(fifth, '        CLOUDS.clear();\n        INSECTS.clear();',
              '        CLOUDS.clear();\n        FLAME_STRIKES.clear();\n        INSECTS.clear();')

          flame = '''    public static double flameStrikeRadius(double range) {
              return Math.max(5.5, Math.min(8.0, SpellMetrics.effectRadius("flame_strike", range, 5)));
          }

          private static boolean flameStrike(ServerLevel level, LivingEntity caster, double range, double power, Vec3 center) {
              double radius = flameStrikeRadius(range);
              boolean hit = pulseFlameStrike(level, caster, center, radius, power * .92, true);
              FLAME_STRIKES.removeIf(state -> state.ownerId.equals(caster.getUUID()));
              long now = level.getGameTime();
              FLAME_STRIKES.add(new FlameStrikeField(level, caster.getUUID(), center, radius, power,
                      now + FLAME_STRIKE_TICKS, now + FLAME_STRIKE_PULSE_TICKS));
              if (caster instanceof ServerPlayer player) {
                  DestructiveMagicService.impact(player, "flame_strike", center, radius, power);
                  ArcaneNoticeService.push(player, Component.literal(
                          "§6[화염 기둥] §f초기 천공 타격 후 4초 동안 같은 지점을 불태웁니다. §70.5초마다 내부 적을 다시 태웁니다."), 82);
              }
              level.playSound(null, BlockPos.containing(center), SoundEvents.GENERIC_EXPLODE.value(),
                      caster instanceof ServerPlayer ? SoundSource.PLAYERS : SoundSource.HOSTILE, 1.15F, .76F);
              return hit || center != null;
          }

          private static void tickFlameStrikes(ServerLevel level, long now) {
              Iterator<FlameStrikeField> iterator = FLAME_STRIKES.iterator();
              while (iterator.hasNext()) {
                  FlameStrikeField state = iterator.next();
                  if (state.level != level) continue;
                  Entity rawOwner = level.getEntity(state.ownerId);
                  if (!(rawOwner instanceof LivingEntity owner) || !owner.isAlive() || now >= state.expiresAt) {
                      iterator.remove();
                      continue;
                  }
                  while (state.nextPulse < state.expiresAt && now >= state.nextPulse) {
                      pulseFlameStrike(level, owner, state.center, state.radius, state.power * .09, false);
                      state.nextPulse += FLAME_STRIKE_PULSE_TICKS;
                  }
              }
          }

          private static boolean pulseFlameStrike(ServerLevel level, LivingEntity caster, Vec3 center,
                                                  double radius, double pulsePower, boolean initial) {
              AABB box = new AABB(center, center).inflate(radius, 13.5, radius);
              boolean hit = false;
              for (LivingEntity target : level.getEntitiesOfClass(LivingEntity.class, box, value -> enemy(caster, value))) {
                  double horizontal = new Vec3(target.getX() - center.x, 0.0, target.getZ() - center.z).length();
                  if (horizontal > radius + target.getBbWidth()) continue;
                  double falloff = Math.max(.62, 1.0 - horizontal / Math.max(1.0, radius) * .38);
                  if (ArcaneDamage.hurt(level, caster, target, (float) (pulsePower * falloff))) hit = true;
                  target.setRemainingFireTicks(Math.max(target.getRemainingFireTicks(), initial ? 220 : 90));
                  if (initial) target.push(0.0, .26 * falloff, 0.0);
              }
              return hit;
          }

          private static boolean holdMonster'''
          sub(fifth,
              r'    private static boolean flameStrike\(ServerLevel level, LivingEntity caster, double range, double power, Vec3 center\) \{.*?\n    \}\n\n    private static boolean holdMonster',
              lambda m: flame,
              1)

          rep(fifth, '                    + "의 의지를 13초간 장악했습니다. §7시전자를 공격하지 않고 주변 위협과 싸우며 비전투 시 따라옵니다."), 88);',
              '                    + "의 의지를 30초간 장악했습니다. §7인간형 체급에만 적용되며 시전자를 공격하지 않고 주변 위협과 싸우며 비전투 시 따라옵니다."), 92);')

          field_class = '''    private static final class FlameStrikeField {
              final ServerLevel level; final UUID ownerId; final Vec3 center; final double radius; final double power;
              final long expiresAt; long nextPulse;
              FlameStrikeField(ServerLevel level, UUID ownerId, Vec3 center, double radius, double power,
                               long expiresAt, long nextPulse) {
                  this.level = level; this.ownerId = ownerId; this.center = center; this.radius = radius;
                  this.power = power; this.expiresAt = expiresAt; this.nextPulse = nextPulse;
              }
          }

          '''
          rep(fifth, '    private static final class CloudkillZone {\n', field_class + '    private static final class CloudkillZone {\n')

          # Keep Flame Strike visible for its exact 4-second server lifetime for player and NPC releases.
          body = world.read_text(encoding='utf-8')
          old = '        duration = sixthCircleVisualDuration(spell.id(), duration);'
          if body.count(old) != 2:
              raise SystemExit(f'WorldMagicService: expected 2 sixth-duration calls, got {body.count(old)}')
          body = body.replace(old,
              '        duration = fifthCircleVisualDuration(spell.id(), duration);\n'
              '        duration = sixthCircleVisualDuration(spell.id(), duration);')
          anchor = '    private static int sixthCircleVisualDuration(String spellId, int baseDuration) {'
          if body.count(anchor) != 1:
              raise SystemExit('WorldMagicService: sixth duration method anchor mismatch')
          method = '''    private static int fifthCircleVisualDuration(String spellId, int baseDuration) {
              return switch (spellId) {
                  case "flame_strike" -> Math.max(baseDuration, FifthCircleSpellService.FLAME_STRIKE_TICKS);
                  default -> baseDuration;
              };
          }

          '''
          body = body.replace(anchor, method + anchor, 1)
          world.write_text(body, encoding='utf-8')

          rep(tracker,
              '                if(scaleEnvelope.size()>0)entries.add(new RenderEntry(center,scaleEnvelope,color,86,opacity));\n\n                if(v.spell.circle()==6){',
              '                if(scaleEnvelope.size()>0)entries.add(new RenderEntry(center,scaleEnvelope,color,86,opacity));\n\n'
              '                if(v.spell.circle()==5){\n'
              '                    ArcaneWorldMesh fifthAuthority=FifthCircleAuthorityOverlay.release(v.spell,v.direction,targetOffset(v),\n'
              '                            v.range,elapsedSeconds,durationSeconds);\n'
              '                    if(fifthAuthority.size()>0)entries.add(new RenderEntry(center,fifthAuthority,color,92,opacity));\n'
              '                }\n\n'
              '                if(v.spell.circle()==6){')

          print('alpha70 robust runtime patch: PASS')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/arcane-alpha70-selfpatch.yml
          git add projects/arcane-circle
          git diff --check
          git commit -m 'Implement Arcane Circle alpha.70 fifth-circle value pass [skip ci]'
          git push origin HEAD:main
