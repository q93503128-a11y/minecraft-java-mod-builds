name: Arcane Circle alpha.32 destructive magic and meteor barrage
on:
  push:
    paths:
      - '.github/workflows/maintenance-arcane32-destruction-barrage-20260813.yml'
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply, audit and build alpha.32 before commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 .github/scripts/arcane_alpha32_destruction_barrage_20260813.py
          cd projects/arcane-circle
          python3 tools/test_current_source.py
          chmod +x gradlew
          ./gradlew --no-daemon --no-configuration-cache clean build
          VERSION="$(sed -n 's/^mod_version=//p' gradle.properties)"
          python3 tools/verify_jar.py "build/libs/arcanecircle-${VERSION}.jar"
          cd ../..
          git diff --check
          git status --short
          git add -A
          git commit -m 'Arcane Circle alpha.32: destructive terrain and meteor barrage'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
