name: Arcane Circle alpha.30 compile fix

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/arcane_alpha30_compilefix_20260813.py'
      - '.github/workflows/maintenance-arcane30-compilefix-20260813.yml'

permissions:
  contents: write

concurrency:
  group: arcane-circle-alpha30-maintenance
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix alpha.30 compile declaration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          python3 .github/scripts/arcane_alpha30_compilefix_20260813.py
          python3 projects/arcane-circle/tools/test_current_source.py
          git diff --check
          git add -A
          git commit -m 'fix(arcane-circle): repair alpha.30 grimoire declaration guard'
          for attempt in 1 2 3 4 5 6 7 8; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
            sleep $((attempt * 2))
          done
          exit 1
