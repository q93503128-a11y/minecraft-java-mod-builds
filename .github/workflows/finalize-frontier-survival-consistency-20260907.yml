name: Finalize Frontier Survival Consistency 20260907

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-frontier-survival-consistency-20260907.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Rebase onto current main
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main

      - name: Apply final documentation and package consistency fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path('.')
          FRONTIER = ROOT / 'projects/frontier-settlement'
          SURVIVAL = ROOT / 'projects/survival-ascension'

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          survival_readme = SURVIVAL / 'README.md'
          survival_section_anchor = '''Survival Ascension makes progression increase the physical scale of player actions, then makes infrastructure, logistics, expeditions and combat consume that larger output again.\n\n## 0.61.20-alpha.1 — Equipment Economy & Harvest Queue Hardening / 장비 경제·수확 큐 안정화\n'''
          survival_section = '''Survival Ascension makes progression increase the physical scale of player actions, then makes infrastructure, logistics, expeditions and combat consume that larger output again.\n\n## 0.61.21-alpha.1 — Bounded Bulk Mining / 대량 채굴 틱 분산\n채굴 2D 면적 작업, 삽 토공, 연결 광맥, Extract의 자동 추가 블록은 최초 파괴 이벤트 안에서 한꺼번에 처리하지 않고 큐에 넣어 틱마다 분산한다. 수동으로 부순 중심 블록은 계속 바닐라 권한이며, 모든 추가 블록도 `ServerPlayerGameMode.destroyBlock` 경로를 사용한다.\n\n플레이어당 틱 최대12, 서버 전체 최대48과 로컬3 ms / 전체5 ms 소프트 시간 예산을 함께 적용한다. 대기 큐는 최대512개로 현재 최상위 면적·광맥 범위보다 크며, 로드되지 않은 청크를 강제 로드하지 않고 블록 엔티티는 처리하지 않는다.\n\nMining·Woodcutting·Harvesting 대기 작업은 시작 도구의 내구도 수치만 정규화한 컴포넌트 프로필을 보관한다. 일반적인 내구도 감소는 작업을 유지하지만 다른 도구·승천 옵션·인챈트로 바꾸면 남은 큐를 취소한다. 새 SavedData/packet 변경은 없고 네트워크 프로토콜은 `15` 그대로다.\n\n## 0.61.20-alpha.1 — Equipment Economy & Harvest Queue Hardening / 장비 경제·수확 큐 안정화\n'''
          text = survival_readme.read_text(encoding='utf-8')
          if '## 0.61.21-alpha.1 — Bounded Bulk Mining / 대량 채굴 틱 분산' not in text:
              replace_once(survival_readme, survival_section_anchor, survival_section, 'Survival README 0.61.21 section')

          replace_once(
              SURVIVAL / 'modpack/content-lock.json',
              '"version": "0.61.0-alpha.1-content-preview.1"',
              '"version": "0.61.21-alpha.1-content-preview.1"',
              'Survival mrpack internal version',
          )
          replace_once(
              SURVIVAL / 'tools/test_release_content_pack.py',
              'CURRENT_LOCK_VERSION = "0.61.0-alpha.1-content-preview.1"',
              'CURRENT_LOCK_VERSION = "0.61.21-alpha.1-content-preview.1"',
              'Survival release pack verifier version',
          )

          replace_once(
              FRONTIER / 'README.md',
              '## Current version: 0.1.0-alpha.79',
              '## Current version: 0.1.0-alpha.116',
              'Frontier README current version',
          )
          replace_once(
              FRONTIER / 'README.md',
              'No new Alpha.72 key was added.\n\n- `B` — settlement/infrastructure palette;',
              'Current default construction controls:\n\n- `M` — settlement/infrastructure palette;',
              'Frontier README current palette key',
          )

          current_docs = r'''#!/usr/bin/env python3
          from pathlib import Path
          import re

          ROOT = Path(__file__).resolve().parents[1]

          def read(rel: str) -> str:
              return (ROOT / rel).read_text(encoding="utf-8")

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise AssertionError(message)

          props = read("gradle.properties")
          readme = read("README.md")
          client = read("src/main/java/kr/moonseungjun/frontiersettlement/client/BuildingPlacementClient.java")

          match = re.search(r"^mod_version=(.+)$", props, re.MULTILINE)
          require(match is not None, "Frontier mod_version missing")
          version = match.group(1).strip()
          require(version.startswith("0.1.0-alpha."), "unexpected Frontier version family")
          require(f"## Current version: {version}" in readme, "README current version does not match gradle.properties")
          require("## Current version: 0.1.0-alpha.79" not in readme, "stale Alpha.79 README current-version label returned")
          require("minecraft_version=26.2" in props, "Minecraft version drift")
          require("neo_version=26.2.0.38-beta" in props, "NeoForge version drift")

          for doc in ("ORIGINAL_DESIGN_v0.2.md", "CANONICAL_PLAN.md", "COMPLETION_GAP_AUDIT.md"):
              require((ROOT / doc).is_file(), f"canonical direction document missing: {doc}")

          require("GLFW.GLFW_KEY_M" in client, "actual settlement palette key is no longer M")
          require("GLFW.GLFW_KEY_R" in client, "actual rotation key is no longer R")
          require("GLFW.GLFW_KEY_ENTER" in client, "actual confirmation key is no longer Enter")
          require("GLFW.GLFW_KEY_BACKSPACE" in client, "actual reset key is no longer Backspace")
          require("- `M` — settlement/infrastructure palette;" in readme, "README palette key does not match runtime M mapping")
          require("- `R` — rotate an ordinary building placement;" in readme, "README rotation key missing")
          require("- `Enter` — confirm the current building/road/outpost/civil-work selection step;" in readme, "README confirmation key missing")
          require("- `B` — settlement/infrastructure palette;" not in readme, "stale B palette guidance returned")

          print(f"Frontier Settlement current docs audit: PASS ({version})")
          '''
          current_docs = '\n'.join(line[10:] if line.startswith('          ') else line for line in current_docs.splitlines()) + '\n'
          (FRONTIER / 'tools/test_current_docs.py').write_text(current_docs, encoding='utf-8')

          workflow = ROOT / '.github/workflows/build-frontier-settlement.yml'
          workflow_text = workflow.read_text(encoding='utf-8')
          old_source = '''      - name: Latest cumulative source audit\n        working-directory: ${{ env.PROJECT_DIR }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          audit="$(find tools -maxdepth 1 -type f -name 'test_alpha*_source.py' -printf '%f\\n' | sort -V | tail -1)"\n          test -n "$audit"\n          echo "Running source audit: $audit"\n          python3 "tools/$audit" 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-source-audit.log"\n'''
          new_source = '''      - name: Latest cumulative source audit\n        working-directory: ${{ env.PROJECT_DIR }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 tools/test_current_source.py 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-source-audit.log"\n'''
          if workflow_text.count(old_source) != 1:
              raise SystemExit('Frontier canonical source-audit workflow anchor drifted')
          workflow_text = workflow_text.replace(old_source, new_source, 1)

          old_docs = '''      - name: Latest canonical docs audit\n        working-directory: ${{ env.PROJECT_DIR }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          audit="$(find tools -maxdepth 1 -type f -name 'test_alpha*_docs.py' -printf '%f\\n' | sort -V | tail -1)"\n          test -n "$audit"\n          echo "Running docs audit: $audit"\n          python3 "tools/$audit" 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-docs-audit.log"\n'''
          new_docs = '''      - name: Latest canonical docs audit\n        working-directory: ${{ env.PROJECT_DIR }}\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 tools/test_current_docs.py 2>&1 | tee "$GITHUB_WORKSPACE/frontier-settlement-docs-audit.log"\n'''
          if workflow_text.count(old_docs) != 1:
              raise SystemExit('Frontier canonical docs-audit workflow anchor drifted')
          workflow.write_text(workflow_text.replace(old_docs, new_docs, 1), encoding='utf-8')
          PY
          python3 -m json.tool projects/survival-ascension/modpack/content-lock.json >/dev/null
          git diff --check

      - name: Run targeted regression audits
        shell: bash
        run: |
          set -euo pipefail
          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          cd ../survival-ascension
          python3 tools/test_current_source.py
          python3 tools/test_release_source.py
          python3 tools/test_release_content_pack.py

      - name: Commit clean consistency fix to latest main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/finalize-frontier-survival-consistency-20260907.yml
          git add projects/frontier-settlement projects/survival-ascension .github/workflows/build-frontier-settlement.yml .github/workflows/finalize-frontier-survival-consistency-20260907.yml
          git diff --cached --check
          git commit -m "Synchronize Frontier and Survival release consistency"
          git pull --rebase origin main

          cd projects/frontier-settlement
          python3 tools/test_current_source.py
          python3 tools/test_current_docs.py
          cd ../survival-ascension
          python3 tools/test_current_source.py
          python3 tools/test_release_source.py
          python3 tools/test_release_content_pack.py
          cd ../..

          git push origin HEAD:main
