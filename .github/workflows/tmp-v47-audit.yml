name: Temporary v47 audit applicator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-v47-audit.yml'
      - '.github/scripts/tmp_arcane_alpha47_audit.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python3 .github/scripts/tmp_arcane_alpha47_audit.py
      - shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/tmp_arcane_alpha47_audit.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/arcane-circle/tools/test_current_source.py .github/scripts/tmp_arcane_alpha47_audit.py
          git diff --cached --check
          git commit -m 'test(arcane-circle): audit alpha.47 catastrophe authority'
          git push origin HEAD:main

# trigger alpha47-audit
