name: Audit Living Kingdoms capital marriage

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/living-kingdoms/**'
      - '.github/workflows/audit-living-kingdoms-capital-marriage.yml'

concurrency:
  group: living-kingdoms-capital-marriage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROJECT_DIR: projects/living-kingdoms
  LIVING_KINGDOMS_CI_REALM_TEST: '1'
  LIVING_KINGDOMS_CI_CAPITAL_MARRIAGE_TEST: '1'

jobs:
  audit:
    name: Fresh-world Erden capital marriage audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Clean compile marriage integration
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon clean classes --stacktrace --console=plain
      - name: Verify marriage regression guards
        shell: bash
        run: |
          set -euo pipefail
          life='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleManager.java'
          saved='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalLifecycleSavedData.java'
          marriage='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/world/ErdenCapitalMarriageManager.java'
          mod='projects/living-kingdoms/src/main/java/kr/moonseungjun/livingkingdoms/LivingKingdoms.java'
          grep -Fq 'ErdenCapitalMarriageManager.parentPair' "$life"
          grep -Fq 'projectForAudit' "$life"
          grep -Fq 'movePersonHousehold' "$saved"
          grep -Fq 'widowhood_ends_union=true' "$marriage"
          grep -Fq 'wallet_follows_household=true' "$marriage"
          grep -Fq 'work_assignment_preserved=true' "$marriage"
          grep -Fq 'ErdenCapitalMarriageManager.onServerTick(event)' "$mod"
      - name: Exercise capital marriages in a fresh world
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../logs run
          rm -rf run/world run/living_realm run/livingkingdoms-capital-marriage-ci-world
          printf 'level-name=livingkingdoms-capital-marriage-ci-world\npause-when-empty-seconds=0\n' > run/server.properties
          printf 'eula=true\n' > run/eula.txt
          gradle --no-daemon runServer --stacktrace --console=plain > ../../logs/capital-marriage.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT

          passed=0
          for attempt in $(seq 1 900); do
            if grep -Fq 'LK_REALM_DIAGNOSTIC_FAIL' ../../logs/capital-marriage.log; then
              cat ../../logs/capital-marriage.log
              exit 1
            fi
            if grep -Eq 'Exception in server tick loop|watchdog|OutOfMemoryError|NoSuchMethodError|NoClassDefFoundError' ../../logs/capital-marriage.log; then
              cat ../../logs/capital-marriage.log
              exit 1
            fi
            if grep -Fq 'LK_ERDEN_CAPITAL_MARRIAGE_PASS revision=1' ../../logs/capital-marriage.log; then
              passed=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              cat ../../logs/capital-marriage.log
              exit 1
            fi
            sleep 1
          done

          cat ../../logs/capital-marriage.log
          test "$passed" -eq 1
          grep -F 'Prepared Erden capital marriages revision=1 founding_unions=77' ../../logs/capital-marriage.log
          grep -Eq 'LK_ERDEN_CAPITAL_MARRIAGE_PASS revision=1 founding_unions=77 projection_years=28 projected_new_unions=[1-9][0-9]* projected_household_moves=[1-9][0-9]* projected_remarriages=[1-9][0-9]*' ../../logs/capital-marriage.log
          grep -F 'widowhood_ends_union=true remarriage_wait_years=1 active_union_parentage=true spouse_residence=true work_assignment_preserved=true wallet_follows_household=true fixed_homes=77 fixed_worksites=156 base_population_unchanged=true save_overlay=true source_blocks_cut=0' ../../logs/capital-marriage.log
      - name: Upload capital marriage audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: living-kingdoms-capital-marriage-${{ github.run_number }}
          path: logs/capital-marriage.log
          if-no-files-found: warn
          retention-days: 30
