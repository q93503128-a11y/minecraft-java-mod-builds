name: Temporary SA046 Runner

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  apply:
    if: github.event.issue.title == '[SA046 APPLY RETRY2 INTERNAL]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Reset to latest main and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/temporary-sa046-apply.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/sa046_apply.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 -m py_compile /tmp/sa046_apply.py
          python3 /tmp/sa046_apply.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/survival-ascension/THIRD_PARTY_NOTICES.md')
          text = p.read_text(encoding='utf-8')
          for value in (
              'Content-pack project: Amethyst Resonance by Ghozix  \n',
              'Locked Modrinth project/version: `8RyryQ7j` / `no0B3Ssy`  \n',
              'Locked 26.2 NeoForge JAR SHA-1: `a3ac49a6202b7918d2ed22030df0b6e2906cdec8`  \n',
          ):
              text = text.replace(value, value[:-3] + '\n', 1)
          p.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/temporary-sa046-runner.yml .github/workflows/temporary-sa046-diagnostic.yml

      - name: Source audit and Java 25 clean build
        working-directory: projects/survival-ascension
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 -m py_compile tools/test_current_source.py tools/test_content_pack_source.py tools/verify_jar.py tools/build_mrpack.py
          python3 tools/test_current_source.py
          python3 tools/test_content_pack_source.py
          git diff --check
          ./gradlew --no-daemon --no-configuration-cache clean build --stacktrace --console=plain
          test -f build/libs/survivalascension-0.46.0-alpha.1.jar
          python3 tools/verify_jar.py build/libs/survivalascension-0.46.0-alpha.1.jar
          python3 tools/build_mrpack.py --survival-jar build/libs/survivalascension-0.46.0-alpha.1.jar --output build/Survival-Ascension-0.46.0-alpha.1-content-preview.mrpack
          test -s build/Survival-Ascension-0.46.0-alpha.1-content-preview.mrpack

      - name: Commit verified source to current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/survival-ascension .github/workflows
          git diff --cached --check
          git commit -m 'Survival Ascension 0.46 resonant shovel integration'
          for attempt in 1 2 3 4 5 6; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 2))
          done
          exit 1

      - name: Close retry trigger
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh issue close "${{ github.event.issue.number }}" --reason completed || true
