name: Build Campfire Sessions

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'projects/campfire-sessions/**'
      - '.github/workflows/build-campfire-sessions.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: projects/campfire-sessions

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Clean build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee build.log
      - name: Verify alpha5 packaged assets
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"

          for ENTRY in             'kr/moonseungjun/campfiresessions/client/MusicPlayerScreen.class'             'kr/moonseungjun/campfiresessions/client/MusicMetadata.class'             'kr/moonseungjun/campfiresessions/client/GuitarClientEvents.class'             'assets/campfiresessions/music/track_metadata.json'             'assets/campfiresessions/sounds/music/etirwer.ogg'             'assets/campfiresessions/sounds/music/cozy_puzzle.ogg'             'assets/campfiresessions/sounds/music/neon_circuit.ogg'             'assets/campfiresessions/sounds/music/underwater_pad.ogg'             'assets/campfiresessions/sounds/music/cozy_puzzle_1.ogg'             'assets/campfiresessions/sounds/music/cozy_title.ogg'             'assets/campfiresessions/sounds/music/beach_stage.ogg'             'assets/campfiresessions/sounds/music/space_battle.ogg'             'assets/campfiresessions/sounds/music/jazzy_battle.ogg'             'assets/campfiresessions/sounds/music/desert_pink.ogg'             'assets/campfiresessions/textures/gui/sprites/music/theme/clean_panel.png'             'assets/campfiresessions/textures/gui/sprites/music/theme/neon_panel.png'             'assets/campfiresessions/textures/gui/sprites/music/theme/ocean_panel.png'             'assets/campfiresessions/textures/gui/sprites/music/theme/desert_panel.png'             'assets/campfiresessions/textures/gui/sprites/music/theme/rough_panel.png'
          do
            jar tf "$JAR" | grep -F "$ENTRY"
          done

          python3 - <<'PY'
          import json, zipfile, glob
          jar = [p for p in glob.glob('build/libs/*.jar') if not p.endswith('-sources.jar')][0]
          with zipfile.ZipFile(jar) as z:
              meta = json.loads(z.read('assets/campfiresessions/music/track_metadata.json'))
          assert len(meta) == 10, meta.keys()
          for key, value in meta.items():
              assert value['duration_seconds'] > 0, (key, value)
              assert value['bpm'] > 0, (key, value)
          print('track metadata:', {k: v['duration_seconds'] for k, v in meta.items()})
          PY

          sha256sum "$JAR" | tee "$JAR.sha256"
          {
            echo '# BUILD AND RUNTIME REPORT'
            echo
            echo "- Commit: `${GITHUB_SHA}`"
            echo '- Version: 0.5.0-alpha.1'
            echo '- Minecraft: 26.2'
            echo '- Java: 25'
            echo '- NeoForge: 26.2.0.87'
            echo '- clean build: SUCCESS'
            echo '- 10 CC0 streamed tracks: PACKAGED'
            echo '- generated real OGG duration metadata: VERIFIED'
            echo '- BPM-driven note feedback: COMPILED'
            echo '- outside-UI PREV/NEXT/REPEAT key mappings: COMPILED'
            echo '- third-person two-handed playing pose hook: COMPILED'
            echo '- repeat-one + auto-next logic: COMPILED'
            echo '- external themed UI + inertial carousel: PACKAGED'
            echo '- in-game visual/audio acceptance: USER TEST REQUIRED'
          } > BUILD_AND_RUNTIME_REPORT.md
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campfire-sessions-alpha5-logs
          path: projects/campfire-sessions/build.log
          if-no-files-found: warn
      - name: Upload alpha5
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: campfire-sessions-alpha5
          path: |
            projects/campfire-sessions/build/libs/*.jar
            projects/campfire-sessions/build/libs/*.sha256
            projects/campfire-sessions/BUILD_AND_RUNTIME_REPORT.md
            projects/campfire-sessions/build/generated/licensedAssets/campfiresessions_asset_manifest.json
          if-no-files-found: error
