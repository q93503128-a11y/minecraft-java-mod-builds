name: Build Campfire Sessions

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'projects/campfire-sessions/**'
      - '.github/workflows/build-campfire-sessions.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: projects/campfire-sessions

    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Clean build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon clean build --stacktrace 2>&1 | tee build.log
      - name: Probe external building structure bounds
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon copyExternalStructureProbe
          python3 tools/inspect_structure_jars.py build/externalStructureProbe | tee build/external-structure-footprints.txt
      - name: Verify alpha6 packaged assets and contracts
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"

          python3 - "$JAR" <<'PY'
          import json
          import pathlib
          import sys
          import zipfile

          jar = pathlib.Path(sys.argv[1])
          expected = [
              'etirwer', 'cozy_puzzle', 'neon_circuit', 'underwater_pad', 'cozy_puzzle_1',
              'cozy_title', 'beach_stage', 'space_battle', 'jazzy_battle', 'desert_pink',
              'nighttime_solitude', 'fairy_adventure', 'other_center', 'magic_puzzle_1',
              'urban_boss_battle'
          ]
          required_classes = [
              'kr/moonseungjun/campfiresessions/client/MusicPlayerScreen.class',
              'kr/moonseungjun/campfiresessions/client/MusicMetadata.class',
              'kr/moonseungjun/campfiresessions/client/GuitarClientEvents.class',
              'kr/moonseungjun/campfiresessions/client/CampfireClientSetup.class',
              'kr/moonseungjun/campfiresessions/client/LocalMusicLibrary.class',
              'kr/moonseungjun/campfiresessions/client/GuitarArmPoseParams.class',
              'META-INF/enumextensions.json',
              'assets/campfiresessions/music/track_metadata.json',
              'assets/campfiresessions/sounds.json',
          ]
          ui_keys = [
              'clean_panel', 'clean_card', 'clean_button',
              'neon_panel', 'neon_card', 'neon_button',
              'ocean_panel', 'ocean_card', 'ocean_button',
              'desert_panel', 'desert_card', 'desert_button',
              'rough_panel', 'rough_card', 'rough_button',
          ]
          external_structures = [
              'data/campfiresessions/structure/external/villageria/town_hall.nbt',
              'data/campfiresessions/structure/external/villageria/shop.nbt',
              'data/campfiresessions/structure/external/villageria/hospital.nbt',
              'data/campfiresessions/structure/external/kogtyv_greece/center/ratush_1.nbt',
          ]
          external_structures += [
              f'data/campfiresessions/structure/external/kogtyv_greece/house/small_{i}.nbt'
              for i in range(1, 9)
          ]
          external_structures += [
              f'data/campfiresessions/structure/external/kogtyv_greece/house/medium_{i}.nbt'
              for i in range(1, 7)
          ]
          external_structures += [
              f'data/campfiresessions/structure/external/kogtyv_greece/house/big_{i}.nbt'
              for i in range(1, 5)
          ]
          external_structures += [
              f'data/campfiresessions/structure/external/kogtyv_greece/house/shop_small_{i}.nbt'
              for i in range(1, 6)
          ]
          external_structures += [
              f'data/campfiresessions/structure/external/kogtyv_greece/house/shop_medium_{i}.nbt'
              for i in range(1, 4)
          ]
          external_structures += [
              'data/campfiresessions/structure/external/kogtyv_greece/house/shop_triple_1.nbt',
              'data/campfiresessions/structure/external/kogtyv_greece/house/triple_1.nbt',
          ]

          with zipfile.ZipFile(jar) as z:
              names = set(z.namelist())
              for entry in required_classes:
                  assert entry in names, entry
              for track in expected:
                  assert f'assets/campfiresessions/sounds/music/{track}.ogg' in names, track
              for key in ui_keys:
                  assert f'assets/campfiresessions/textures/gui/sprites/music/theme/{key}.png' in names, key
              assert not any(name.startswith('assets/campfiresessions/sounds/local/') for name in names), 'local user audio leaked into JAR'

              for entry in external_structures:
                  assert entry in names, entry
              packaged_external = {
                  name for name in names
                  if name.startswith('data/campfiresessions/structure/external/') and name.endswith('.nbt')
              }
              assert packaged_external == set(external_structures), (
                  len(packaged_external), len(external_structures),
                  sorted(packaged_external - set(external_structures)),
                  sorted(set(external_structures) - packaged_external),
              )
              assert 'META-INF/campfiresessions/licenses/villageria_LICENSE.txt' in names
              assert 'META-INF/campfiresessions/licenses/kogtyv_tav_LICENSE.txt' in names
              assert 'META-INF/campfiresessions/external_structure_manifest.json' in names
              external_manifest = json.loads(z.read('META-INF/campfiresessions/external_structure_manifest.json'))
              assert set(external_manifest['sources']) == {'villageria', 'kogtyv_tav'}
              assert len(external_manifest['assets']) == 32, len(external_manifest['assets'])
              assert all(asset['source'] in {'villageria', 'kogtyv_tav'} for asset in external_manifest['assets'])
              assert not any('kaisyn' in asset['source_entry'].lower() for asset in external_manifest['assets'])
              assert b'MIT License' in z.read('META-INF/campfiresessions/licenses/villageria_LICENSE.txt')
              assert b'MIT License' in z.read('META-INF/campfiresessions/licenses/kogtyv_tav_LICENSE.txt')

              meta = json.loads(z.read('assets/campfiresessions/music/track_metadata.json'))
              assert list(meta.keys()) == expected, (list(meta.keys()), expected)
              for key, value in meta.items():
                  assert value['duration_seconds'] > 0, (key, value)
                  assert value['bpm'] > 0, (key, value)

              sounds = json.loads(z.read('assets/campfiresessions/sounds.json'))
              assert list(sounds.keys()) == expected, sounds.keys()
              for key in expected:
                  entries = sounds[key]['sounds']
                  assert entries and entries[0]['stream'] is True, (key, entries)

              enum_ext = json.loads(z.read('META-INF/enumextensions.json'))
              arm_entries = [e for e in enum_ext['entries'] if e['name'] == 'CAMPFIRESESSIONS_GUITAR']
              assert len(arm_entries) == 1, enum_ext
              assert arm_entries[0]['constructor'] == '(ZZLnet/neoforged/neoforge/client/IArmPoseTransformer;)V'

          source = pathlib.Path('src/main/java/kr/moonseungjun/campfiresessions')
          mod_sounds = (source / 'registry/ModSounds.java').read_text(encoding='utf-8')
          catalog = (source / 'client/MusicCatalog.java').read_text(encoding='utf-8')
          local_music = (source / 'client/LocalMusicLibrary.java').read_text(encoding='utf-8')
          controls = (source / 'client/GuitarClientEvents.java').read_text(encoding='utf-8')
          music_client = (source / 'client/CampfireMusicClient.java').read_text(encoding='utf-8')
          for track in expected:
              assert f'"{track}"' in mod_sounds, track
              assert f'"{track}"' in catalog, track
          assert 'registerLocalSlots(32)' in mod_sounds
          assert 'AddPackFindersEvent' in local_music and 'PathPackResources' in local_music
          assert 'min_format' in local_music and 'max_format' in local_music
          assert 'GLFW_KEY_B' in controls and 'GLFW_KEY_N' in controls and 'GLFW_KEY_R' in controls
          assert 'repeatOne' in music_client and 'playIndex(playingIndex + 1)' in music_client
          assert 'CROSSBOW_HOLD' not in controls
          print('track durations:', {k: v['duration_seconds'] for k, v in meta.items()})
          print('bundled tracks:', len(expected), 'local slots: 32', 'ui assets:', len(ui_keys))
          print('approved external structures:', len(external_structures), 'sources:', sorted(external_manifest['sources']))
          PY

          sha256sum "$JAR" | tee "$JAR.sha256"
          {
            echo '# BUILD AND RUNTIME REPORT'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo '- Version: 0.6.0-alpha.1'
            echo '- Minecraft: 26.2'
            echo '- Java: 25'
            echo '- NeoForge: 26.2.0.87'
            echo '- clean build: SUCCESS'
            echo '- 15 CC0 streamed tracks: PACKAGED'
            echo '- generated real OGG duration metadata: VERIFIED'
            echo '- up to 32 local custom OGG slots: COMPILED'
            echo '- local generated resource-pack bridge: COMPILED'
            echo '- BPM-driven note feedback: COMPILED'
            echo '- outside-UI PREV/NEXT/REPEAT key mappings: COMPILED'
            echo '- dedicated third-person guitar arm pose + strum: COMPILED'
            echo '- repeat-one + auto-next logic: COMPILED'
            echo '- external themed UI + inertial carousel: PACKAGED'
            echo '- in-game visual/audio acceptance: USER TEST REQUIRED'
          } > BUILD_AND_RUNTIME_REPORT.md
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campfire-sessions-alpha6-logs
          path: |
            projects/campfire-sessions/build.log
            projects/campfire-sessions/build/external-structure-footprints.txt
          if-no-files-found: warn
      - name: Upload alpha6
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: campfire-sessions-alpha6
          path: |
            projects/campfire-sessions/build/libs/*.jar
            projects/campfire-sessions/build/libs/*.sha256
            projects/campfire-sessions/BUILD_AND_RUNTIME_REPORT.md
            projects/campfire-sessions/build/generated/licensedAssets/campfiresessions_asset_manifest.json
          if-no-files-found: error
