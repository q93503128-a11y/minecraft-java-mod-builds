name: Temporary Arcane alpha.42 presentation rollback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-arcane-alpha42-presentation-rollback.yml'

permissions:
  contents: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore alpha.39 presentation baseline only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          BASE=761b2a657f28b345b2da2b8574de28b37fada71f
          ROOT=projects/arcane-circle
          CLIENT="$ROOT/src/main/java/kr/moonseungjun/arcanecircle/client"

          # Restore the last user-accepted layered presentation stack. Gameplay/runtime files stay current.
          for f in ArcaneSigilDirector.java SpellCinematicDirector.java ArcaneSpellVisualOverhaul.java WorldMagicTracker.java; do
            git checkout "$BASE" -- "$CLIENT/$f"
          done

          # Remove the alpha.40/41 manual-only replacement that caused the visual regression.
          rm -f "$CLIENT/ManualSpellVisuals.java" "$CLIENT/ManualFusionVisuals.java"
          for i in $(seq 1 9); do rm -f "$CLIENT/ManualCircle${i}Visuals.java"; done

          # Restore the matching audits, then advance only the release version and add regression gates.
          git checkout "$BASE" -- "$ROOT/tools/test_current_source.py" "$ROOT/tools/verify_jar.py"

          python3 - <<'PY'
          from pathlib import Path
          root=Path('projects/arcane-circle')
          client=root/'src/main/java/kr/moonseungjun/arcanecircle/client'

          # Version bump without touching gameplay.
          gp=root/'gradle.properties'
          s=gp.read_text(encoding='utf-8').replace('mod_version=0.12.1-alpha.41','mod_version=0.12.1-alpha.42').replace('mod_version=0.12.1-alpha.39','mod_version=0.12.1-alpha.42')
          lines=[ln for ln in s.splitlines() if not ln.startswith('# alpha.4')]
          lines.append('# alpha.42 presentation quality rollback: restore alpha.39 layered sigils/cinematics; remove manual-only regression')
          gp.write_text('\n'.join(lines)+'\n',encoding='utf-8')

          main=root/'src/main/java/kr/moonseungjun/arcanecircle/ArcaneCircle.java'
          s=main.read_text(encoding='utf-8').replace('VERSION = "0.12.1-alpha.41"','VERSION = "0.12.1-alpha.42"').replace('VERSION = "0.12.1-alpha.39"','VERSION = "0.12.1-alpha.42"')
          main.write_text(s,encoding='utf-8')

          idx=root/'src/main/resources/data/arcanecircle/spell_catalog/index.json'
          s=idx.read_text(encoding='utf-8').replace('"version": "0.12.1-alpha.41"','"version": "0.12.1-alpha.42"').replace('"version": "0.12.1-alpha.39"','"version": "0.12.1-alpha.42"')
          idx.write_text(s,encoding='utf-8')

          # Alpha.39 audits are the correct structural baseline; advance their expected version.
          audit=root/'tools/test_current_source.py'
          s=audit.read_text(encoding='utf-8').replace('0.12.1-alpha.39','0.12.1-alpha.42')
          s += '''\n\n# Alpha.42 presentation regression recovery.\nfor name in ['ArcaneSigilDirector.java','SpellCinematicDirector.java','ArcaneSpellVisualOverhaul.java']:\n    assert (client/name).exists(), name\nfor name in ['ManualSpellVisuals.java','ManualFusionVisuals.java']+[f'ManualCircle{i}Visuals.java' for i in range(1,10)]:\n    assert not (client/name).exists(), name\nsigil=text(client/'ArcaneSigilDirector.java')\nfor token in ['formulaFrame','m.circle(basis,Vec3.ZERO,outer','inscriptionRing','schoolFormula','geometricDepth','anchorFormula']:\n    assert token in sigil, token\ntracker=text(client/'WorldMagicTracker.java')\nfor token in ['ArcaneSigilDirector.charge','SpellCinematicDirector.charge','ArcaneSpellVisualOverhaul.chargeSigil']:\n    assert token in tracker, token\n'''
          audit.write_text(s,encoding='utf-8')

          verify=root/'tools/verify_jar.py'
          s=verify.read_text(encoding='utf-8').replace('0.12.1-alpha.39','0.12.1-alpha.42')
          verify.write_text(s,encoding='utf-8')

          project=root/'PROJECT.md'
          s=project.read_text(encoding='utf-8')
          old='현재 presentation 정본은 `ManualSpellVisuals`, `ManualCircle1Visuals`~`ManualCircle9Visuals`, `ManualFusionVisuals`, `WorldMagicTracker`, `ArcaneRegaliaRenderer`다.'
          new='현재 presentation 정본은 `ArcaneSigilDirector`, `SpellCinematicDirector`, `ArcaneSpellVisualOverhaul`, `WorldMagicTracker`, `ArcaneRegaliaRenderer`다.'
          s=s.replace(old,new)
          old2='alpha.40부터 모든 109개 주문은 주문 ID별 수동 authored presentation만 사용한다. 학교·폼·써클을 보고 최종 마법진/연출을 자동 조합하는 fallback은 금지하며, 공통 코드는 선·원·다각형·룬·빔 같은 drawing primitive에만 사용한다.'
          new2='alpha.42는 alpha.40~41의 manual-only replacement를 품질 회귀로 폐기한다. alpha.39의 검증된 layered sigil + cinematic + spell-overhaul presentation을 기준선으로 복구하고, 이후 수동 개선은 이 기준선을 제거하지 않은 채 주문별로 진행한다.'
          s=s.replace(old2,new2)
          if '## Alpha.42 presentation quality rollback' not in s:
              s += '''\n\n## Alpha.42 presentation quality rollback\n- Alpha.40/41 manual-only visuals are retired because they removed the readable base sigil and degraded the full presentation into sparse wireframe geometry.\n- Alpha.39 layered presentation is the visual baseline again: `ArcaneSigilDirector` supplies the readable formula frame, `SpellCinematicDirector` supplies the physical event, and `ArcaneSpellVisualOverhaul` supplies spell-specific/high-circle/status refinements.\n- Circle 1 must retain a visible compact magic-circle frame; manual refinement must never delete a working lower-circle sigil merely to satisfy a hand-authored architecture rule.\n- Future hand refinement is additive/replacement per spell only after visual comparison; it may not globally replace the proven presentation stack.\n'''
          project.write_text(s,encoding='utf-8')
          PY

          # No temporary migration artifacts in the final tree.
          git rm -f .github/workflows/tmp-arcane-alpha42-presentation-rollback.yml
          git add "$ROOT"
          git commit -m 'fix(arcane): restore alpha.39 presentation quality baseline'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt*2))
          done
          exit 1
