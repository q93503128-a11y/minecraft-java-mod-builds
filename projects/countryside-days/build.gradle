plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def generatedGameTestResources = layout.buildDirectory.dir('generated/gametest-resources')

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir generatedGameTestResources
    exclude '**/*.bbmodel'
    exclude 'src/generated/**/.cache'
}

def generateGameTestStructure = tasks.register('generateGameTestStructure') {
    def structureFile = generatedGameTestResources.map {
        it.file('data/countrysidedays/structure/empty.nbt')
    }
    outputs.file structureFile

    doLast {
        def outputFile = structureFile.get().asFile
        outputFile.parentFile.mkdirs()

        def stream = new java.io.DataOutputStream(
                new java.util.zip.GZIPOutputStream(new java.io.FileOutputStream(outputFile))
        )
        try {
            // Root TAG_Compound
            stream.writeByte(10)
            stream.writeUTF('')

            // DataVersion
            stream.writeByte(3)
            stream.writeUTF('DataVersion')
            stream.writeInt(4671)

            // size: [40, 16, 40] — enough room for the complete starter homestead test.
            stream.writeByte(9)
            stream.writeUTF('size')
            stream.writeByte(3)
            stream.writeInt(3)
            stream.writeInt(40)
            stream.writeInt(16)
            stream.writeInt(40)

            // palette: [{Name: "minecraft:stone"}]
            stream.writeByte(9)
            stream.writeUTF('palette')
            stream.writeByte(10)
            stream.writeInt(1)
            stream.writeByte(8)
            stream.writeUTF('Name')
            stream.writeUTF('minecraft:stone')
            stream.writeByte(0)

            // blocks: [{pos: [0, 0, 0], state: 0}]
            stream.writeByte(9)
            stream.writeUTF('blocks')
            stream.writeByte(10)
            stream.writeInt(1)
            stream.writeByte(9)
            stream.writeUTF('pos')
            stream.writeByte(3)
            stream.writeInt(3)
            stream.writeInt(0)
            stream.writeInt(0)
            stream.writeInt(0)
            stream.writeByte(3)
            stream.writeUTF('state')
            stream.writeInt(0)
            stream.writeByte(0)

            // entities: []
            stream.writeByte(9)
            stream.writeUTF('entities')
            stream.writeByte(10)
            stream.writeInt(0)

            // End root compound
            stream.writeByte(0)
        } finally {
            stream.close()
        }
    }
}

tasks.named('processResources').configure {
    dependsOn generateGameTestStructure
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Automatic-Module-Name': mod_group_id
        )
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
