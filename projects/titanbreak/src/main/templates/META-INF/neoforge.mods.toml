[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/q93503128-a11y/minecraft-java-mod-builds"
authors="문승준"
description='''
거대 개체 사냥과 신체 개조, 반응가속 전투를 중심으로 한 Minecraft Java 액션 모드.
'''

[[mixins]]
config="titanbreak.mixins.json"

[[dependencies.${mod_id}]]
