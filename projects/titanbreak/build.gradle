plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'GeckoLib'
                url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
            }
        }
        filter { includeGroupAndSubgroups('com.geckolib') }
    }
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

dependencies {
    jarJar(implementation("com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")) {
        version {
            strictly "[${geckolib_version},5.6)"
            prefer geckolib_version
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version: neo_version,
            geckolib_version: geckolib_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

var verifyLanguageParity = tasks.register('verifyLanguageParity') {
    var korean = file('src/main/resources/assets/titanbreak/lang/ko_kr.json')
    var english = file('src/main/resources/assets/titanbreak/lang/en_us.json')
    inputs.files(korean, english)
    doLast {
        var parser = new groovy.json.JsonSlurper()
        Map ko = (Map) parser.parse(korean)
        Map en = (Map) parser.parse(english)
        var missingEnglish = new TreeSet(ko.keySet())
        missingEnglish.removeAll(en.keySet())
        var missingKorean = new TreeSet(en.keySet())
        missingKorean.removeAll(ko.keySet())
        if (!missingEnglish.isEmpty() || !missingKorean.isEmpty()) {
            throw new GradleException("TITANBREAK language key mismatch. Missing en_us=${missingEnglish}; missing ko_kr=${missingKorean}")
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('jarJar')
    dependsOn verifyLanguageParity
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Automatic-Module-Name': mod_group_id
        )
    }
}

idea { module { downloadSources = true; downloadJavadoc = true } }
