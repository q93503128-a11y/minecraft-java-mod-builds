구중 마법학 세계관을 기반으로 두 주문을 전투 직전에 선택해 즉석 융합하고, 실전 숙련으로 합성 주문을 단독 시전 회로에 영구 각인하는 Minecraft Java 마법 시스템. 현재 1~3써클 주문과 성좌 마도서 UI를 구현한다.
