import java.security.MessageDigest

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def openworldM0RuntimeVerification =
        (findProperty('openworldM0RuntimeVerification') ?: 'false').toString()
def openworldM0PlayerVerification =
        (findProperty('openworldM0PlayerVerification') ?: 'false').toString()

loom {
    mods {
        "openworld_rpg" {
            sourceSet sourceSets.main
        }
    }

    runs {
        coreServer {
            server()
            displayName = 'Openworld RPG Core Isolation Server'
            systemProperties.put('openworld_rpg.profile', 'core')
            runDirectory = file('run-core')
        }

        gameplayServer {
            server()
            displayName = 'Openworld RPG Gameplay Server'
            systemProperties.put('openworld_rpg.profile', 'gameplay')
            systemProperties.put('openworld_rpg.m0RuntimeVerification', openworldM0RuntimeVerification)
            runDirectory = file('run-gameplay')
        }

        gameplayClient {
            client()
            displayName = 'Openworld RPG Gameplay Client'
            systemProperties.put('openworld_rpg.profile', 'gameplay')
            systemProperties.put('openworld_rpg.m0PlayerVerification', openworldM0PlayerVerification)
            runDirectory = file('run-client-gameplay')
        }
    }
}

