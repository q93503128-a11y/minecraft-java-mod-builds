tasks.register('verifyGameplayFoundationDependencies') {
    group = 'verification'
    description = 'Resolves, hashes and verifies the pinned M0 gameplay foundation JAR bytes.'

    doLast {
        def resolved = configurations.gameplayFoundation.resolve().toList().sort { a, b -> a.name <=> b.name }
        if (resolved.size() != 10) {
            throw new GradleException("Expected 10 pinned gameplay foundation artifacts, resolved ${resolved.size()}: ${resolved*.name}")
        }

        def output = layout.buildDirectory.file('reports/m0/gameplay-foundation-artifacts.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = ''

        resolved.each { file ->
            if (!file.isFile() || file.length() <= 0L) {
                throw new GradleException("Resolved gameplay foundation artifact is missing or empty: ${file}")
            }

            def actual = sha256Of(file)
            def expected = expectedGameplayFoundationSha256[file.name]
            if (expected == null) {
                throw new GradleException("No admitted SHA-256 exists for gameplay foundation artifact ${file.name}; observed ${actual}")
            }
            if (!actual.equalsIgnoreCase(expected)) {
                throw new GradleException("SHA-256 mismatch for ${file.name}: expected ${expected}, got ${actual}")
            }

            def line = "${file.name}\t${file.length()}\t${actual}"
            println "M0_FOUNDATION_ARTIFACT ${line}"
            output << line << System.lineSeparator()
        }

        println "M0_GAMEPLAY_FOUNDATION_DIGEST_PASS count=${resolved.size()} report=${output}"
    }
}

tasks.register('inspectGameplayFoundationMetadata') {
    group = 'verification'
    description = 'Records actual Fabric metadata for the ten pinned gameplay-foundation JARs.'

    doLast {
        def resolved = configurations.gameplayFoundation.resolve().toList().sort { a, b -> a.name <=> b.name }
        if (resolved.size() != 10) {
            throw new GradleException("Expected 10 gameplay foundation artifacts, resolved ${resolved.size()}: ${resolved*.name}")
        }

        def output = layout.buildDirectory.file('reports/m0/gameplay-foundation-metadata.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = ''

        resolved.each { file ->
            def zip = new java.util.zip.ZipFile(file)
            try {
                def entry = zip.getEntry('fabric.mod.json')
                if (entry == null) {
                    throw new GradleException("Gameplay foundation artifact has no fabric.mod.json: ${file.name}")
                }
                def meta = new groovy.json.JsonSlurper().parseText(zip.getInputStream(entry).getText('UTF-8'))
                def id = meta.id?.toString()
                def versionValue = meta.version?.toString()
                def depends = meta.depends instanceof Map
                        ? meta.depends.collect { key, value -> "${key}=${value}" }.sort().join(", ")
                        : String.valueOf(meta.depends)
                def recommends = meta.recommends instanceof Map
                        ? meta.recommends.collect { key, value -> "${key}=${value}" }.sort().join(", ")
                        : String.valueOf(meta.recommends)
                def suggests = meta.suggests instanceof Map
                        ? meta.suggests.collect { key, value -> "${key}=${value}" }.sort().join(", ")
                        : String.valueOf(meta.suggests)
                def nested = meta.jars instanceof List
                        ? meta.jars.collect { it instanceof Map ? it.file : it.toString() }.findAll { it }.sort().join(', ')
                        : ''
                def line = [
                        "file=${file.name}",
                        "id=${id}",
                        "version=${versionValue}",
                        "environment=${meta.environment}",
                        "depends=${depends}",
                        "recommends=${recommends}",
                        "suggests=${suggests}",
                        "nested=${nested}"
                ].join('\t')
                println "M0_GAMEPLAY_METADATA ${line}"
                output << line << System.lineSeparator()
            } finally {
                zip.close()
            }
        }

        println "M0_GAMEPLAY_FOUNDATION_METADATA_PASS count=${resolved.size()} report=${output}"
    }
}

tasks.register('inspectCreatureFoundationDependencies') {
    group = 'verification'
    description = 'Resolves the pinned creature JARs and verifies their admitted bytes and Fabric metadata.'

    doLast {
        def resolved = configurations.creatureFoundation.resolve().toList().sort { a, b -> a.name <=> b.name }
        if (resolved.size() != 3) {
            throw new GradleException("Expected 3 pinned creature artifacts, resolved ${resolved.size()}: ${resolved*.name}")
        }

        def output = layout.buildDirectory.file('reports/m0/creature-foundation-metadata.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = ''

        resolved.each { file ->
            if (!file.isFile() || file.length() <= 0L) {
                throw new GradleException("Resolved creature artifact is missing or empty: ${file}")
            }

            def expected = expectedCreatureFoundationSha256[file.name]
            if (expected == null) {
                throw new GradleException("No admitted SHA-256 exists for creature foundation artifact: ${file.name}")
            }
            def actual = sha256Of(file)
            if (!actual.equalsIgnoreCase(expected)) {
                throw new GradleException("SHA-256 mismatch for ${file.name}: expected ${expected}, got ${actual}")
            }

            def zip = new java.util.zip.ZipFile(file)
            try {
                def entry = zip.getEntry('fabric.mod.json')
                if (entry == null) {
                    throw new GradleException("Creature artifact has no fabric.mod.json: ${file.name}")
                }

                def jsonText = zip.getInputStream(entry).getText('UTF-8')
                def meta = new groovy.json.JsonSlurper().parseText(jsonText)
                def id = meta.id?.toString()
                def versionValue = meta.version?.toString()
                if (!id || !versionValue) {
                    throw new GradleException("Creature artifact is missing id/version in fabric.mod.json: ${file.name}")
                }

                def depends = meta.depends instanceof Map
                        ? meta.depends.collect { key, value -> "${key}=${value}" }.sort().join(", ")
                        : String.valueOf(meta.depends)
                def breaks = meta.breaks instanceof Map
                        ? meta.breaks.collect { key, value -> "${key}=${value}" }.sort().join(", ")
                        : String.valueOf(meta.breaks)
                def nested = meta.jars instanceof List
                        ? meta.jars.collect { it instanceof Map ? it.file : it.toString() }.findAll { it }.sort().join(', ')
                        : ''

                def line = [
                        "file=${file.name}",
                        "bytes=${file.length()}",
                        "sha256=${actual}",
                        "id=${id}",
                        "version=${versionValue}",
                        "environment=${meta.environment}",
                        "depends=${depends}",
                        "breaks=${breaks}",
                        "nested=${nested}"
                ].join('\t')

                println "M0_CREATURE_METADATA ${line}"
                output << line << System.lineSeparator()
            } finally {
                zip.close()
            }
        }

        println "M0_CREATURE_FOUNDATION_DIGEST_PASS count=${resolved.size()} report=${output}"
    }
}


tasks.register('inspectEarthloongDependencySurface') {
    group = 'verification'
    description = 'Records the exact Earthloong class/resource surface and summarizes pinned donor animation motion without copying raw asset data.'

    doLast {
        def file = configurations.creatureFoundation.resolve().find {
            it.name == 'threateninglly-mobs-continued-1637799-8804647.jar'
        }
        if (file == null || !file.isFile()) {
            throw new GradleException('Pinned Threateningly Mobs artifact was not resolved.')
        }

        def expected = expectedCreatureFoundationSha256[file.name]
        def actual = sha256Of(file)
        if (expected == null || !actual.equalsIgnoreCase(expected)) {
            throw new GradleException(
                    "Earthloong dependency byte mismatch for ${file.name}: expected ${expected}, got ${actual}"
            )
        }

        def output = layout.buildDirectory.file('reports/m0/earthloong-dependency-surface.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = "file=${file.name}\nsha256=${actual}\n"

        def earthloongEntries = []
        def woodlizardNamedEntries = []
        def classEntries = []

        def collectNumericVec3
        collectNumericVec3 = { Object node, List<List<Double>> sink ->
            if (node instanceof List) {
                if (node.size() >= 3
                        && node[0] instanceof Number
                        && node[1] instanceof Number
                        && node[2] instanceof Number) {
                    sink << [
                            ((Number) node[0]).doubleValue(),
                            ((Number) node[1]).doubleValue(),
                            ((Number) node[2]).doubleValue()
                    ]
                } else {
                    node.each { collectNumericVec3(it, sink) }
                }
            } else if (node instanceof Map) {
                node.values().each { collectNumericVec3(it, sink) }
            }
        }

        def zip = new java.util.zip.ZipFile(file)
        try {
            def allEntries = java.util.Collections.list(zip.entries())
                    .collect { it.name }
                    .sort()
            earthloongEntries = allEntries.findAll {
                it.toLowerCase(java.util.Locale.ROOT).contains('earthloong')
            }
            woodlizardNamedEntries = allEntries.findAll {
                it.toLowerCase(java.util.Locale.ROOT).contains('woodlizard')
            }

            if (earthloongEntries.isEmpty()) {
                throw new GradleException('Pinned Threateningly Mobs JAR exposes no Earthloong-named entries.')
            }

            output << "\n[earthloong-entries]\n"
            earthloongEntries.each {
                println "EARTHLOONG_DEPENDENCY_ENTRY ${it}"
                output << it << System.lineSeparator()
            }

            output << "\n[woodlizard-named-entries]\n"
            if (woodlizardNamedEntries.isEmpty()) {
                output << "(none)" << System.lineSeparator()
            } else {
                woodlizardNamedEntries.each {
                    println "WOODLIZARD_DEPENDENCY_ENTRY ${it}"
                    output << it << System.lineSeparator()
                }
            }

            output << "\n[woodlizard-animation-summary]\n"
            int matchedAnimations = 0
            def animationJsonEntries = allEntries.findAll {
                def lower = it.toLowerCase(java.util.Locale.ROOT)
                lower.endsWith('.json') && lower.contains('animation')
            }
            animationJsonEntries.each { entryName ->
                def entry = zip.getEntry(entryName)
                if (entry == null || entry.isDirectory()) return
                try {
                    def parsed
                    zip.getInputStream(entry).withCloseable { input ->
                        parsed = new groovy.json.JsonSlurper().parse(input)
                    }
                    def animations = parsed instanceof Map ? parsed.animations : null
                    if (!(animations instanceof Map)) return

                    animations.each { animationName, animationBody ->
                        if (!(animationName instanceof String)
                                || !animationName.toLowerCase(java.util.Locale.ROOT).contains('woodlizard_')) {
                            return
                        }
                        matchedAnimations++
                        def length = animationBody instanceof Map ? animationBody.animation_length : null
                        def loop = animationBody instanceof Map ? animationBody.loop : null
                        def bones = animationBody instanceof Map ? animationBody.bones : null
                        def boneNames = bones instanceof Map ? bones.keySet().collect { it.toString() }.sort() : []
                        output << [
                                'WOODLIZARD_ANIMATION',
                                "source=${entryName}",
                                "name=${animationName}",
                                "length=${length}",
                                "loop=${loop}",
                                "bones=${boneNames.join(',')}"
                        ].join('\t') << System.lineSeparator()

                        if (!(bones instanceof Map)) return
                        bones.each { boneName, boneBody ->
                            if (!(boneBody instanceof Map)) return
                            ['rotation', 'position', 'scale'].each { channelName ->
                                if (!boneBody.containsKey(channelName)) return
                                def samples = []
                                collectNumericVec3(boneBody[channelName], samples)
                                if (samples.isEmpty()) {
                                    output << [
                                            'WOODLIZARD_CHANNEL',
                                            "animation=${animationName}",
                                            "bone=${boneName}",
                                            "channel=${channelName}",
                                            'numericVec3Samples=0'
                                    ].join('\t') << System.lineSeparator()
                                    return
                                }
                                def mins = [0, 1, 2].collect { axis -> samples.collect { it[axis] }.min() }
                                def maxs = [0, 1, 2].collect { axis -> samples.collect { it[axis] }.max() }
                                def fmt = { double value -> String.format(java.util.Locale.ROOT, '%.3f', value) }
                                output << [
                                        'WOODLIZARD_CHANNEL',
                                        "animation=${animationName}",
                                        "bone=${boneName}",
                                        "channel=${channelName}",
                                        "numericVec3Samples=${samples.size()}",
                                        "x=${fmt(mins[0])}..${fmt(maxs[0])}",
                                        "y=${fmt(mins[1])}..${fmt(maxs[1])}",
                                        "z=${fmt(mins[2])}..${fmt(maxs[2])}"
                                ].join('\t') << System.lineSeparator()
                            }
                        }
                    }
                } catch (Exception ignored) {
                    // Non-Gecko/foreign JSON is irrelevant to this narrow dependency audit.
                }
            }
            output << "WOODLIZARD_ANIMATION_MATCH_COUNT=${matchedAnimations}" << System.lineSeparator()

            classEntries = earthloongEntries.findAll { it.endsWith('.class') }
        } finally {
            zip.close()
        }

        if (classEntries.isEmpty()) {
            throw new GradleException('Pinned Threateningly Mobs JAR exposes no Earthloong class entries.')
        }

        def javap = new File(System.getProperty('java.home'), 'bin/javap')
        if (!javap.isFile()) {
            throw new GradleException("javap not found in active Java toolchain: ${javap}")
        }

        output << "\n[javap]\n"
        classEntries.each { entry ->
            def className = entry.substring(0, entry.length() - '.class'.length()).replace('/', '.')
            def process = new ProcessBuilder(
                    javap.absolutePath,
                    '-classpath',
                    file.absolutePath,
                    '-p',
                    '-c',
                    className
            ).redirectErrorStream(true).start()
            def disassembly = process.inputStream.getText('UTF-8')
            def exitCode = process.waitFor()
            if (exitCode != 0) {
                throw new GradleException(
                        "javap failed for ${className} with exit ${exitCode}: ${disassembly}"
                )
            }

            println "EARTHLOONG_DEPENDENCY_CLASS ${className}"
            output << "\n===== ${className} =====\n"
            output << disassembly
            if (!disassembly.endsWith(System.lineSeparator())) {
                output << System.lineSeparator()
            }
        }

        println "EARTHLOONG_DEPENDENCY_SURFACE_PASS classes=${classEntries.size()} report=${output}"
    }
}

