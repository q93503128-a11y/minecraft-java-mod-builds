import java.security.MessageDigest

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        "openworld_rpg" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = 'RedlanceMinecraft'
        url = 'https://repo.redlance.org/public'
        content {
            includeGroup 'com.zigythebird.playeranim'
        }
    }

    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel.cloth'
        }
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    gameplayFoundation {
        canBeConsumed = false
        canBeResolved = true
        visible = false
        description = 'Pinned M0 gameplay foundation artifacts; resolution-only, not part of core runtime.'
    }

    creatureFoundation {
        canBeConsumed = false
        canBeResolved = true
        visible = false
        description = 'Pinned curated creature dependency artifacts; inspected without admitting them to gameplay runtime.'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    gameplayFoundation("maven.modrinth:5sy6g3kz:${project.better_combat_version_id}") {
        transitive = false
    }
    gameplayFoundation("com.zigythebird.playeranim:PlayerAnimationLibFabric:${project.player_anim_version}") {
        transitive = false
    }
    gameplayFoundation("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        transitive = false
    }
    gameplayFoundation("maven.modrinth:spell-engine:${project.spell_engine_version}") {
        transitive = false
    }
    gameplayFoundation("maven.modrinth:spell-power:${project.spell_power_version}-fabric") {
        transitive = false
    }
    gameplayFoundation("maven.modrinth:ranged-weapon-api:${project.ranged_weapon_api_version}-fabric") {
        transitive = false
    }
    gameplayFoundation("maven.modrinth:armor-model-api:${project.armor_model_api_version}-fabric") {
        transitive = false
    }
    gameplayFoundation("maven.modrinth:XaT8sLP6:${project.trinkets_version_id}") {
        transitive = false
    }
    gameplayFoundation("curse.maven:geckolib-388172:8819017") {
        transitive = false
    }

    creatureFoundation("curse.maven:alexs-mobs-continued-1635121:${project.alexs_mobs_curse_file}") {
        transitive = false
    }
    creatureFoundation("curse.maven:codxlib-1633207:${project.codxlib_curse_file}") {
        transitive = false
    }
    creatureFoundation("maven.modrinth:${project.threateningly_mobs_project_id}:${project.threateningly_mobs_version_id}") {
        transitive = false
    }

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

tasks.register('verifyGameplayFoundationDependencies') {
    group = 'verification'
    description = 'Resolves and hashes the pinned M0 gameplay foundation JARs without adding them to the core runtime.'

    doLast {
        def resolved = configurations.gameplayFoundation.resolve().toList().sort { a, b -> a.name <=> b.name }
        if (resolved.size() != 9) {
            throw new GradleException("Expected 9 pinned gameplay foundation artifacts, resolved ${resolved.size()}: ${resolved*.name}")
        }

        def output = layout.buildDirectory.file('reports/m0/gameplay-foundation-artifacts.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = ''

        resolved.each { file ->
            if (!file.isFile() || file.length() <= 0L) {
                throw new GradleException("Resolved gameplay foundation artifact is missing or empty: ${file}")
            }

            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            def sha256 = digest.digest().encodeHex().toString()
            def line = "${file.name}\t${file.length()}\t${sha256}"
            println "M0_FOUNDATION_ARTIFACT ${line}"
            output << line << System.lineSeparator()
        }

        println "M0_GAMEPLAY_FOUNDATION_RESOLUTION_PASS count=${resolved.size()} report=${output}"
    }
}

tasks.register('inspectCreatureFoundationDependencies') {
    group = 'verification'
    description = 'Resolves the pinned creature JARs and records their actual Fabric metadata without loading them into the core runtime.'

    doLast {
        def resolved = configurations.creatureFoundation.resolve().toList().sort { a, b -> a.name <=> b.name }
        if (resolved.size() != 3) {
            throw new GradleException("Expected 3 pinned creature artifacts, resolved ${resolved.size()}: ${resolved*.name}")
        }

        def output = layout.buildDirectory.file('reports/m0/creature-foundation-metadata.txt').get().asFile
        output.parentFile.mkdirs()
        output.text = ''

        resolved.each { file ->
            if (!file.isFile() || file.length() <= 0L) {
                throw new GradleException("Resolved creature artifact is missing or empty: ${file}")
            }

            MessageDigest digest = MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = input.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            def sha256 = digest.digest().encodeHex().toString()

            def zip = new java.util.zip.ZipFile(file)
            try {
                def entry = zip.getEntry('fabric.mod.json')
                if (entry == null) {
                    throw new GradleException("Creature artifact has no fabric.mod.json: ${file.name}")
                }

                def jsonText = zip.getInputStream(entry).getText('UTF-8')
                def meta = new groovy.json.JsonSlurper().parseText(jsonText)
                def id = meta.id?.toString()
                def versionValue = meta.version?.toString()
                if (!id || !versionValue) {
                    throw new GradleException("Creature artifact is missing id/version in fabric.mod.json: ${file.name}")
                }

                def depends = meta.depends instanceof Map
                        ? meta.depends.collect { key, value -> "${key}=${value}" }.sort().join(", ")
                        : String.valueOf(meta.depends)
                def breaks = meta.breaks instanceof Map
                        ? meta.breaks.collect { key, value -> "${key}=${value}" }.sort().join(", ")
                        : String.valueOf(meta.breaks)
                def nested = meta.jars instanceof List
                        ? meta.jars.collect { it instanceof Map ? it.file : it.toString() }.findAll { it }.sort().join(', ')
                        : ''

                def line = [
                        "file=${file.name}",
                        "bytes=${file.length()}",
                        "sha256=${sha256}",
                        "id=${id}",
                        "version=${versionValue}",
                        "environment=${meta.environment}",
                        "depends=${depends}",
                        "breaks=${breaks}",
                        "nested=${nested}"
                ].join('\t')

                println "M0_CREATURE_METADATA ${line}"
                output << line << System.lineSeparator()
            } finally {
                zip.close()
            }
        }

        println "M0_CREATURE_FOUNDATION_INSPECTION_PASS count=${resolved.size()} report=${output}"
    }
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
