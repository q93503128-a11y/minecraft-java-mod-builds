import java.security.MessageDigest

plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

def openworldM0RuntimeVerification =
        (findProperty('openworldM0RuntimeVerification') ?: 'false').toString()
def openworldM0PlayerVerification =
        (findProperty('openworldM0PlayerVerification') ?: 'false').toString()

loom {
    mods {
        "openworld_rpg" {
            sourceSet sourceSets.main
        }
    }

    runs {
        coreServer {
            server()
            displayName = 'Openworld RPG Core Isolation Server'
            systemProperties.put('openworld_rpg.profile', 'core')
            runDirectory = file('run-core')
        }

        gameplayServer {
            server()
            displayName = 'Openworld RPG Gameplay Server'
            systemProperties.put('openworld_rpg.profile', 'gameplay')
            systemProperties.put('openworld_rpg.m0RuntimeVerification', openworldM0RuntimeVerification)
            runDirectory = file('run-gameplay')
        }

        gameplayClient {
            client()
            displayName = 'Openworld RPG Gameplay Client'
            systemProperties.put('openworld_rpg.profile', 'gameplay')
            systemProperties.put('openworld_rpg.m0PlayerVerification', openworldM0PlayerVerification)
            runDirectory = file('run-client-gameplay')
        }
    }
}

repositories {
    mavenCentral()

    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
        content {
            includeGroup 'io.github.llamalad7'
        }
    }

    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }

    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel.cloth'
        }
    }

    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
}

configurations {
    gameplayFoundation {
        canBeConsumed = false
        canBeResolved = true
        visible = false
        description = 'Pinned M0 gameplay foundation artifacts; resolution-only, not part of core runtime.'
    }

    creatureFoundation {
        canBeConsumed = false
        canBeResolved = true
        visible = false
        description = 'Pinned curated creature dependency artifacts; inspected without admitting them to core runtime.'
    }
}

