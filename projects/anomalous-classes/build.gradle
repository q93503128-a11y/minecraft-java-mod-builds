plugins {
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'anomalous-classes'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        anomalousclasses {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.processResources {
    def replaceProperties = [
            mod_id: mod_id,
            mod_version: mod_version,
            mod_license: mod_license,
            loader_version_range: loader_version_range,
            neo_version_range: neo_version_range,
            minecraft_version_range: minecraft_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
    from('balance/SKILL_POINT_COST_MODEL_V2.json') {
        into 'data/anomalousclasses'
        rename { 'skill_point_cost_model_v2.json' }
    }
}

tasks.jar {
    manifest {
        attributes(
                'Implementation-Title': 'Anomalous Classes',
                'Implementation-Version': project.version.toString(),
                'Minecraft-Version': minecraft_version,
                'NeoForge-Version': neo_version
        )
    }
}

tasks.register('verifyProfileSkillTree', Exec) {
    group = 'verification'
    description = 'Checks the approved skill point cost source, localized node catalog, and responsive menu bounds.'
    commandLine 'python', 'tools/verify_profile_skilltree.py'
}

tasks.named('check') {
    dependsOn tasks.named('verifyProfileSkillTree')
}
