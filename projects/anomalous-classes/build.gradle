plugins {
    id 'net.neoforged.moddev' version '2.0.107'
}

group = mod_group_id
version = mod_version

base {
    archivesName = 'anomalous-classes'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

def generatedFocusResources = layout.buildDirectory.dir('generated/focus-resources')
sourceSets.main.resources.srcDir(generatedFocusResources)

neoForge {
    version = neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
        }

        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        anomalousclasses {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.processResources {
    def replaceProperties = [
            mod_id: mod_id,
            mod_version: mod_version,
            mod_license: mod_license,
            loader_version_range: loader_version_range,
            neo_version_range: neo_version_range,
            minecraft_version_range: minecraft_version_range
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
    from('balance/SKILL_POINT_COST_MODEL_V2.json') {
        into 'data/anomalousclasses'
        rename { 'skill_point_cost_model_v2.json' }
    }
    from('balance/SKILL_TREE_BRANCH_REDESIGN_V1.json') {
        into 'data/anomalousclasses'
        rename { 'skill_tree_branch_redesign_v1.json' }
    }
    from('ui/SKILL_TREE_GRAPH_LAYOUT_V1.json') {
        into 'data/anomalousclasses'
        rename { 'skill_tree_graph_layout_v1.json' }
    }
}

tasks.register('generateFocusRecipes', Exec) {
    group = 'generation'
    description = 'Generates shaped focus crafting recipes from the shared recipe catalog.'
    inputs.file('data/focus_recipes.json')
    outputs.dir(generatedFocusResources)
    commandLine 'python', 'tools/generate_focus_recipes.py', 'data/focus_recipes.json',
            generatedFocusResources.get().asFile.absolutePath
}

tasks.named('processResources') {
    dependsOn tasks.named('generateFocusRecipes')
}

tasks.jar {
    manifest {
        attributes(
                'Implementation-Title': 'Anomalous Classes',
                'Implementation-Version': project.version.toString(),
                'Minecraft-Version': minecraft_version,
                'NeoForge-Version': neo_version
        )
    }
}

tasks.register('verifyProfileSkillTree', Exec) {
    group = 'verification'
    description = 'Checks six graph trees, legacy migration conservation, skill-tree assets, translations, and responsive bounds.'
    commandLine 'python', 'tools/verify_graph_skilltree.py'
}

tasks.register('verifyGraphSkillTreeRuntime', Exec) {
    group = 'verification'
    description = 'Runs runtime catalog, migration, atomicity, and SavedData round-trip fixtures without packaging test code.'
    dependsOn tasks.named('classes')
    doFirst {
        commandLine 'java', '-cp', sourceSets.main.runtimeClasspath.asPath,
                file('tools/GraphSkillTreeRuntimeVerifier.java').absolutePath
    }
}

tasks.register('verifyMentalDominatorRules', Exec) {
    group = 'verification'
    description = 'Checks Mental Dominator candidate resource math, focus effects, and skill-rank wiring.'
    dependsOn tasks.named('classes')
    doFirst {
        commandLine 'java', '-cp', sourceSets.main.runtimeClasspath.asPath,
                file('tools/MentalDominatorRulesVerifier.java').absolutePath
    }
}

tasks.register('verifyPuppeteerFoundation', Exec) {
    group = 'verification'
    description = 'Checks puppeteer 27 combinations, scaling, material accounting, and saved identity transitions.'
    dependsOn tasks.named('classes')
    doFirst {
        commandLine 'java', '-cp', sourceSets.main.runtimeClasspath.asPath,
                file('tools/PuppeteerFoundationVerifier.java').absolutePath
    }
}

tasks.register('verifyParasiteFoundation', Exec) {
    group = 'verification'
    description = 'Checks parasite host eligibility, owner exclusivity, permanent BD, death lockout and save data.'
    dependsOn tasks.named('classes')
    doFirst {
        commandLine 'java', '-cp', sourceSets.main.runtimeClasspath.asPath,
                file('tools/ParasiteFoundationVerifier.java').absolutePath
    }
}

tasks.register('verifyPuppetAssets', Exec) {
    group = 'verification'
    description = 'Checks marionette icon/model assets, workshop crafting/loot data and translations.'
    commandLine 'python', 'tools/verify_puppet_assets.py'
}

tasks.register('verifyClassManagementLayout', JavaExec) {
    group = 'verification'
    description = 'Checks class-management content and widget bounds at supported GUI scales and aspect ratios.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.moonseungjun.anomalousclasses.client.ClassManagementLayoutVerifier'
}

tasks.register('verifyMentalDominatorLayout', JavaExec) {
    group = 'verification'
    description = 'Checks Mental Dominator management widget bounds at supported GUI scales and aspect ratios.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.moonseungjun.anomalousclasses.client.MentalDominatorScreenLayoutVerifier'
}

tasks.register('verifyClassFocus', Exec) {
    group = 'verification'
    description = 'Checks focus registrations, recipe layout/output parity, textures, models, and translations.'
    dependsOn tasks.named('generateFocusRecipes')
    commandLine 'python', 'tools/verify_focus_recipes.py',
            'data/focus_recipes.json', 'src/main/resources', generatedFocusResources.get().asFile.absolutePath
}

tasks.register('verifyClassFocusLayout', JavaExec) {
    group = 'verification'
    description = 'Checks the focus recipe screen at supported aspect ratios and GUI scales.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'kr.moonseungjun.anomalousclasses.client.ClassFocusScreenLayoutVerifier'
}

tasks.register('verifyFocusInventoryUi', Exec) {
    group = 'verification'
    description = 'Checks the UI-only focus slot geometry, empty marker, effect text parity, and read-only recipe controls.'
    commandLine 'python', 'tools/verify_focus_inventory_ui.py'
}

tasks.register('verifyRpgXpCurve', Exec) {
    group = 'verification'
    description = 'Verifies provisional P30 thresholds, multi-level XP, and 3SP per level.'
    dependsOn tasks.named('classes')
    doFirst {
        commandLine 'java', '-cp', sourceSets.main.runtimeClasspath.asPath,
                file('tools/RpgXpCurveVerifier.java').absolutePath
    }
}

tasks.register('verifyBarrierRules', Exec) {
    group = 'verification'
    description = 'Validates barrier radius, 3D intersection, damage stages, capacity and focus scaling.'
    dependsOn tasks.named('classes')
    doFirst {
        commandLine 'java', '-cp', sourceSets.main.runtimeClasspath.asPath,
                file('tools/BarrierRulesVerifier.java').absolutePath
    }
}

tasks.register('verifyLevelHealthGrowth', Exec) {
    group = 'verification'
    description = 'Verifies class-specific automatic maximum health progression.'
    dependsOn tasks.named('classes')
    doFirst {
        commandLine 'java', '-cp', sourceSets.main.runtimeClasspath.asPath,
                file('tools/LevelHealthGrowthVerifier.java').absolutePath
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyBarrierRules')
    dependsOn tasks.named('verifyLevelHealthGrowth')
    dependsOn tasks.named('verifyRpgXpCurve')
    dependsOn tasks.named('verifyProfileSkillTree')
    dependsOn tasks.named('verifyGraphSkillTreeRuntime')
    dependsOn tasks.named('verifyMentalDominatorRules')
    dependsOn tasks.named('verifyPuppeteerFoundation')
    dependsOn tasks.named('verifyParasiteFoundation')
    dependsOn tasks.named('verifyPuppetAssets')
    dependsOn tasks.named('verifyClassManagementLayout')
    dependsOn tasks.named('verifyMentalDominatorLayout')
    dependsOn tasks.named('verifyClassFocus')
    dependsOn tasks.named('verifyClassFocusLayout')
    dependsOn tasks.named('verifyFocusInventoryUi')
}
