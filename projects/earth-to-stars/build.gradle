plugins {
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.137'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

configurations {
    clientOnlyMods {
        attributes {
            attribute(
                    Attribute.of("net.neoforged.moddevgradle.legacy.minecraft_mappings.v2", Named),
                    objects.named(Named, "named")
            )
        }
    }
}

sourceSets {
    main {
        java.setSrcDirs(['src/reboot/java'])
        resources.setSrcDirs(['src/reboot/resources'])
    }
    test {
        java.setSrcDirs(['src/rebootTest/java'])
        resources.setSrcDirs(['src/rebootTest/resources'])
    }
}

legacyForge {
    version = forge_version

    runs {
        client { client() }
        server { server() }
    }

    mods {
        earth_to_stars {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    // KotlinForForge publishes its Forge runtime (including the -all artifact requested
    // by Forge metadata transforms) on its own Maven. Make that group exclusive so a
    // partial copy of the POM on another repository cannot win artifact resolution.
    exclusiveContent {
        forRepository {
            maven {
                name = 'Kotlin for Forge'
                url = 'https://thedarkcolour.github.io/KotlinForForge/'
            }
        }
        filter { includeGroup 'thedarkcolour' }
    }
    maven {
        name = 'Valkyrien Skies Internal'
        url = 'https://maven.valkyrienskies.org'
    }
}

dependencies {
    // Reboot runtime foundation. Do not replace these with custom vehicle physics.
    modImplementation('maven.modrinth:valkyrien-skies:1.20.1-forge-2.4.10')
    modImplementation('thedarkcolour:kotlinforforge:4.11.0')
    modImplementation('maven.modrinth:vlib:1.20.1-0.1.0+forge')
    modRuntimeOnly('maven.modrinth:architectury-api:9.2.14+forge')

    modImplementation('maven.modrinth:zps:1.20.1-2.4.0')
    modImplementation('maven.modrinth:zpl:1.20.1-1.5.0')
    modImplementation('maven.modrinth:curios:5.14.1+1.20.1')
    modImplementation('maven.modrinth:lodestonelib:1.20.1-1.6.4.1')
    modImplementation('maven.modrinth:vs-genesis:1.20.1-0.7.3')

    // ZPS uses Fusion for client models; keep it off dedicated-server classpaths.
    clientOnlyMods('maven.modrinth:fusion-connected-textures:1.2.12-forge-mc1.20.1')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

afterEvaluate {
    tasks.named('runClient') {
        classpath += configurations.clientOnlyMods.incoming.files
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
