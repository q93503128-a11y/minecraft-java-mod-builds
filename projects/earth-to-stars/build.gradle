plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Fabric 26.2 migration boundary:
// - src/fabric contains the new loader/runtime bridge.
// - loader-neutral ship kernel code is reused in-place from src/main.
// - retired NeoForge Minecraft glue stays in Git for reference but is not silently
//   compiled into the Fabric artifact. It is ported feature-by-feature instead of
//   being deleted or patched with fake APIs.
sourceSets {
    main {
        java {
            setSrcDirs(['src/fabric/java', 'src/main/java'])
            include 'kr/moonseungjun/earthtostars/fabric/**'
            include 'kr/moonseungjun/earthtostars/ship/**'
            exclude 'kr/moonseungjun/earthtostars/ship/client/**'
            exclude 'kr/moonseungjun/earthtostars/ship/networking/**'
            exclude 'kr/moonseungjun/earthtostars/ship/persistence/minecraft/**'
            exclude 'kr/moonseungjun/earthtostars/ship/runtime/minecraft/**'
        }
        resources.setSrcDirs(['src/fabric/resources'])
    }
    test {
        java.setSrcDirs(['src/test/java'])
        resources.setSrcDirs(['src/test/resources'])
    }
}

loom {
    mods {
        "earth_to_stars" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
