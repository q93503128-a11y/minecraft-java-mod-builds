                source: "${kenneyAssetRoot}/ui-pack-adventure/PNG/Default/minimap_arrow_a.png",
                blob  : 'd3999611a2608d9953db7ebdd1cda9c293c47b09'
        ]
]
def externalResourcesDir = layout.buildDirectory.dir('generated/externalResources')

def prepareKenneyUiAssets = tasks.register('prepareKenneyUiAssets') {
    inputs.property('sourceCommit', kenneyAssetCommit)
    kenneyUiAssets.eachWithIndex { asset, index ->
        inputs.property("asset${index}Source", asset.source)
        inputs.property("asset${index}GitBlobSha1", asset.blob)
    }
    outputs.files(kenneyUiAssets.collect { asset ->
        externalResourcesDir.map {
            it.file("assets/livingkingdoms/textures/gui/kenney/${asset.output}")
        }
    })

    doLast {
        kenneyUiAssets.each { asset ->
            File target = externalResourcesDir.get()
                    .file("assets/livingkingdoms/textures/gui/kenney/${asset.output}").asFile
            target.parentFile.mkdirs()
            byte[] bytes = new URI(asset.source).toURL().openStream().withCloseable { stream ->
                stream.readAllBytes()
            }
            def digest = java.security.MessageDigest.getInstance('SHA-1')
            digest.update(("blob ${bytes.length}\u0000").getBytes(java.nio.charset.StandardCharsets.UTF_8))
            digest.update(bytes)
            String actual = java.util.HexFormat.of().formatHex(digest.digest())
            if (actual != asset.blob) {
                throw new GradleException(
                        "Kenney UI asset integrity mismatch for ${asset.output}: expected ${asset.blob}, got ${actual}"
                )
            }
            target.bytes = bytes
            logger.lifecycle(
                    "Verified Kenney CC0 UI asset ${asset.output}: git-blob-sha1=${actual}, bytes=${bytes.length}"
            )
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir externalResourcesDir
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources').configure {
    dependsOn prepareKenneyUiAssets
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Automatic-Module-Name': mod_group_id
        )
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
