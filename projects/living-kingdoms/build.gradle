plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def kenneyUiSource = 'https://raw.githubusercontent.com/iwenzhou/kenney/b7729283e47d38f203d85560cfda5b2c1fd6fc7e/Art%20%285190%20files%29/UI%20pack%20%28220%20assets%29/Adventure%20pack%20%2880%20assets%29/Spritesheet/uipack_rpg_sheet.png'
def kenneyUiGitBlobSha = '740afe1d74615ccf06ac44fdd5df5a6d1d017f63'
def externalResourcesDir = layout.buildDirectory.dir('generated/externalResources')

def prepareKenneyUiAssets = tasks.register('prepareKenneyUiAssets') {
    def outputFile = externalResourcesDir.map {
        it.file('assets/livingkingdoms/textures/gui/kenney/uipack_rpg_sheet.png')
    }
    inputs.property('sourceUrl', kenneyUiSource)
    inputs.property('gitBlobSha1', kenneyUiGitBlobSha)
    outputs.file(outputFile)

    doLast {
        File target = outputFile.get().asFile
        target.parentFile.mkdirs()
        byte[] bytes = new URI(kenneyUiSource).toURL().openStream().withCloseable { stream ->
            stream.readAllBytes()
        }
        def digest = java.security.MessageDigest.getInstance('SHA-1')
        digest.update(("blob ${bytes.length}\u0000").getBytes(java.nio.charset.StandardCharsets.UTF_8))
        digest.update(bytes)
        String actual = java.util.HexFormat.of().formatHex(digest.digest())
        if (actual != kenneyUiGitBlobSha) {
            throw new GradleException("Kenney UI asset integrity mismatch: expected ${kenneyUiGitBlobSha}, got ${actual}")
        }
        target.bytes = bytes
        logger.lifecycle("Verified Kenney CC0 RPG UI sheet: git-blob-sha1=${actual}, bytes=${bytes.length}")
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir externalResourcesDir
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('processResources').configure {
    dependsOn prepareKenneyUiAssets
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Automatic-Module-Name': mod_group_id
        )
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
