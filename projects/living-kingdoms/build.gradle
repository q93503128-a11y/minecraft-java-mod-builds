def kenneyUiAssets = [
        [
                output: 'fantasy_panel.png',
                source: "${kenneyAssetRoot}/fantasy-ui-borders/PNG/panel_ornate.png",
                blob  : '82c2a379b877249029a817e3a0ef36b55cf9a798'
        ],
        [
                output: 'panel_background.png',
                source: "${kenneyAssetRoot}/ui-pack/PNG/panel_background.png",
                blob  : '258d992070f873046c5623fbc694e45a526c4b8a'
        ],
        [
                output: 'button_normal.png',
                source: "${kenneyAssetRoot}/ui-pack/PNG/button_rectangleFlat.png",
                blob  : 'a9390478c61d3ced14d16a5e2e396c806966989a'
        ],
        [
                output: 'button_pressed.png',
                source: "${kenneyAssetRoot}/ui-pack/PNG/button_rectangleDepressed.png",
                blob  : 'd9492b4e48b28823c81b3bc08a1b31156f68c79c'
        ],
        [
                output: 'hud_panel_brown.png',
                source: "${kenneyAssetRoot}/ui-pack-adventure/PNG/Default/panel_brown.png",
                blob  : '3e967c361edf770c1a54e0558ff68102ad5e6976'
        ],
        [
