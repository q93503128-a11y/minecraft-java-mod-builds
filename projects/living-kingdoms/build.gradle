        ],
        [
                output: 'hud_progress_red.png',
                source: "${kenneyAssetRoot}/ui-pack-adventure/PNG/Default/progress_red.png",
                blob  : '570310fff678b3720e8fe4b23f570894d242a492'
        ],
        [
                output: 'hud_progress_green.png',
                source: "${kenneyAssetRoot}/ui-pack-adventure/PNG/Default/progress_green.png",
