plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
    id 'idea'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'com.geckolib' }
    }
}

configurations {
    externalStructureProbe
}

dependencies {
    // First controlled external runtime trial: Skniro's Furniture 1.5.2 for Minecraft 26.2 / NeoForge.
    // Modrinth project pezpt98N, version jXQfWgcX.
    implementation 'maven.modrinth:pezpt98N:jXQfWgcX'

    // Second controlled runtime trial: Peterwolf's Boats & Ships 1.0.19 for Minecraft 26.2 / NeoForge.
    implementation 'curse.maven:peterwolfs-boats-ships-1649679:8752063'

    // Third controlled runtime trial: lifestyle radial tool access + full-body player animation foundation.
    implementation 'curse.maven:traveler-tool-belt-1457447:8920360'
    implementation 'curse.maven:player-animation-library-1283899:8674798'

    // Fourth controlled runtime trial: portable storage foundation and required core library.
    implementation 'curse.maven:sophisticated-core-618298:8985852'
    implementation 'curse.maven:sophisticated-backpacks-422301:8992917'

    // Fifth controlled runtime trial: resident entity animation/rendering foundation.
    // Official GeckoLib 26.2 NeoForge artifact; resident source models are NOT bundled here.
    implementation "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Sixth controlled runtime trial: life-sim food/crop/kitchen/mushroom content.
    // Keep these as external runtime dependencies; do not extract ARR mod assets/code into Campfire.
    implementation 'curse.maven:epherolib-885449:8544497'
    implementation 'curse.maven:croptopia-415438:8908615'
    implementation 'maven.modrinth:MBAkmtvl:MKVIBhNe' // Balm 26.2.0.6
    implementation 'maven.modrinth:vJnhuDde:AmK19dxZ' // Cooking for Blockheads 26.2.0.3
    implementation 'curse.maven:puzzles-lib-495476:8878150'
    implementation 'curse.maven:shroomcrafted-1371092:8779687'

    // Analysis-only candidates. These are resolved for structure-footprint inspection and are NOT runtime dependencies.
    externalStructureProbe 'curse.maven:villageria-1646907:8620392'
    externalStructureProbe 'curse.maven:syvillage-1696659:8946351'
    externalStructureProbe 'curse.maven:towns-and-towers-626761:7886369'
    externalStructureProbe 'curse.maven:kogtyv-tav-963118:8762244'
}

tasks.register('copyExternalStructureProbe', Copy) {
    from configurations.externalStructureProbe
    into layout.buildDirectory.dir('externalStructureProbe')
}

tasks.register('copyAssetReviewProbe', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('assetReviewProbe')
}

def licensedAssetsOutput = layout.buildDirectory.dir('generated/licensedAssets')
def externalStructureAssetsOutput = layout.buildDirectory.dir('generated/externalStructureAssets')
def pythonCommand = System.getProperty('os.name').startsWith('Windows') ? 'python' : 'python3'
def villageReviewWorldDir = project.file('run-village-review/saves/campfire-village-review')

def prepareLicensedAssets = tasks.register('prepareLicensedAssets', Exec) {
    inputs.file 'tools/prepare_licensed_assets.py'
    outputs.dir licensedAssetsOutput
    commandLine pythonCommand, file('tools/prepare_licensed_assets.py').absolutePath, licensedAssetsOutput.get().asFile.absolutePath
}

def prepareExternalStructureAssets = tasks.register('prepareExternalStructureAssets', Exec) {
    dependsOn tasks.named('copyExternalStructureProbe')
    inputs.file 'tools/extract_external_structure_assets.py'
    inputs.files configurations.externalStructureProbe
    outputs.dir externalStructureAssetsOutput
    commandLine pythonCommand,
        file('tools/extract_external_structure_assets.py').absolutePath,
        layout.buildDirectory.dir('externalStructureProbe').get().asFile.absolutePath,
        externalStructureAssetsOutput.get().asFile.absolutePath
}

def prepareVillageReviewWorld = tasks.register('prepareVillageReviewWorld', Exec) {
    inputs.file 'tools/prepare_village_review_world.py'
    outputs.dir villageReviewWorldDir
    commandLine pythonCommand,
        file('tools/prepare_village_review_world.py').absolutePath,
        villageReviewWorldDir.absolutePath
}

sourceSets.main.resources {
    srcDir licensedAssetsOutput
    srcDir externalStructureAssetsOutput
}
tasks.named('processResources').configure {
    dependsOn prepareLicensedAssets, prepareExternalStructureAssets
}

neoForge {
    version = project.neo_version
    runs {
        client { client() }
        assetReviewClient {
            client()
            gameDirectory = project.file('run-asset-review')
            systemProperty 'campfiresessions.assetReview', 'true'
        }
        villageReviewClient {
            client()
            gameDirectory = project.file('run-village-review')
            jvmArgument '-Dcampfiresessions.villageReview=true'
            programArgument '--quickPlaySingleplayer'
            programArgument 'campfire-village-review'
        }
        villageReviewServer {
            server()
            gameDirectory = project.file('run-village-review-server')
            jvmArgument '-Dcampfiresessions.villageReview=true'
            programArgument '--nogui'
        }
        server { server(); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

tasks.matching { it.name == 'runVillageReviewClient' }.configureEach {
    dependsOn prepareVillageReviewWorld
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version:minecraft_version,
        minecraft_version_range:minecraft_version_range,
        neo_version:neo_version,
        mod_id:mod_id,
        mod_name:mod_name,
        mod_license:mod_license,
        mod_version:mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
jar {
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Version': mod_version,
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Automatic-Module-Name': mod_group_id
        )
    }
}
idea { module { downloadSources = true; downloadJavadoc = true } }
