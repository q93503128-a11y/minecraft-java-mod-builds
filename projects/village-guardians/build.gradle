plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

configurations {
    licensedStructureAssets
}

dependencies {
    licensedStructureAssets 'maven.modrinth:DjLobEOy:E39wx2BN'
}

var licensedAssetsOutput = layout.buildDirectory.dir('generated/licensedAssets')
var defaultDarkModeCommit = 'c804cb546dc260a5ae98b0754d599e1337faf43a'

var prepareLicensedAssets = tasks.register('prepareLicensedAssets') {
    inputs.property 'defaultDarkModeCommit', defaultDarkModeCommit
    inputs.files configurations.licensedStructureAssets
    outputs.dir licensedAssetsOutput

    doLast {
        File outputRoot = licensedAssetsOutput.get().asFile
        delete outputRoot
        outputRoot.mkdirs()

        Map<String, String> guiAssets = [
                'assets/minecraft/textures/gui/container/inventory.png':
                        "https://raw.githubusercontent.com/nebuIr/Default-Dark-Mode/${defaultDarkModeCommit}/assets/minecraft/textures/gui/container/inventory.png",
                'assets/minecraft/textures/gui/sprites/widget/button.png':
                        "https://raw.githubusercontent.com/nebuIr/Default-Dark-Mode/${defaultDarkModeCommit}/assets/minecraft/textures/gui/sprites/widget/button.png",
                'assets/minecraft/textures/gui/sprites/widget/button_highlighted.png':
                        "https://raw.githubusercontent.com/nebuIr/Default-Dark-Mode/${defaultDarkModeCommit}/assets/minecraft/textures/gui/sprites/widget/button_highlighted.png"
        ]
        guiAssets.each { relativePath, sourceUrl ->
            File destination = new File(outputRoot, relativePath)
            destination.parentFile.mkdirs()
            new java.net.URI(sourceUrl).toURL().withInputStream { input ->
                destination.withOutputStream { output -> output << input }
            }
        }

        File archive = configurations.licensedStructureAssets.singleFile
        List<Map<String, Object>> candidates = []
        zipTree(archive).visit { details ->
            if (!details.directory) {
                String path = details.relativePath.pathString.replace('\\', '/')
                String lower = path.toLowerCase(Locale.ROOT)
                boolean structure = (lower.startsWith('data/towns_and_towers/structure/')
                        || lower.startsWith('data/towns_and_towers/structures/'))
                        && lower.endsWith('.nbt')
                boolean usableVillageHouse = structure
                        && lower.contains('village')
                        && !lower.contains('zombie')
                        && !lower.contains('outpost')
                        && !lower.contains('ship')
                        && !lower.contains('ruin')
                if (usableVillageHouse) {
                    candidates.add([path: path, lower: lower, bytes: details.file.bytes])
                }
            }
        }
        if (candidates.isEmpty()) {
            throw new GradleException('No Towns and Towers village structure NBT files were found.')
        }

        Map<String, List<String>> roles = [
                town_hall : ['meeting', 'town_center', 'town_centre', 'manor', 'hall', 'big_house'],
                barracks  : ['barracks', 'guard', 'armorer', 'weaponsmith'],
                smithy    : ['weaponsmith', 'toolsmith', 'blacksmith', 'smith', 'armorer'],
                skill_hall: ['library', 'librarian', 'cartographer', 'cleric'],
                storehouse: ['market', 'shop', 'butcher', 'fisher', 'warehouse', 'farm'],
                infirmary : ['hospital', 'infirmary', 'temple', 'church', 'chapel', 'cleric']
        ]
        List<String> stylePreferences = [
                'tudor', 'rustic', 'classic', 'swedish', 'medieval',
                'plains', 'taiga', 'mediterranean', 'savanna'
        ]

        String selectedStyle = stylePreferences.max { style ->
            roles.values().count { keywords ->
                candidates.any { candidate ->
                    String lower = candidate.lower as String
                    lower.contains(style)
                            && keywords.any { keyword -> lower.contains(keyword) }
                }
            }
        }
        Set<String> usedPaths = new LinkedHashSet<>()
        List<String> manifest = [
                'Towns and Towers source artifact: maven.modrinth:DjLobEOy:E39wx2BN',
                "Selected architecture style: ${selectedStyle}",
                ''
        ]

        roles.each { role, keywords ->
            List<Map<String, Object>> ranked = candidates.collect { candidate ->
                String lower = candidate.lower as String
                int score = 0
                if (lower.contains(selectedStyle)) score += 90
                if (lower.contains('/houses/')) score += 30
                if (lower.contains('/house')) score += 15
                keywords.eachWithIndex { keyword, index ->
                    if (lower.contains(keyword)) score += 120 - index * 8
                }
                if (usedPaths.contains(candidate.path as String)) score -= 500
                [candidate: candidate, score: score]
            }.findAll { rankedCandidate -> (rankedCandidate.score as int) > 0 }
             .sort { first, second ->
                 int scoreCompare = (second.score as int) <=> (first.score as int)
                 scoreCompare != 0
                         ? scoreCompare
                         : ((first.candidate.path as String) <=> (second.candidate.path as String))
             }
            if (ranked.isEmpty()) {
                throw new GradleException("No licensed structure candidate found for ${role}.")
            }
            Map<String, Object> selected = ranked.first().candidate as Map<String, Object>
            usedPaths.add(selected.path as String)
            File destination = new File(
                    outputRoot,
                    "data/villageguardians/structure/external/${role}.nbt")
            destination.parentFile.mkdirs()
            destination.bytes = selected.bytes as byte[]
            manifest.add("${role} <- ${selected.path}")
        }

        File manifestFile = new File(
                outputRoot,
                'META-INF/villageguardians/towns-and-towers-selection.txt')
        manifestFile.parentFile.mkdirs()
        manifestFile.text = manifest.join(System.lineSeparator()) + System.lineSeparator()
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    srcDir licensedAssetsOutput
}

tasks.named('processResources').configure {
    dependsOn prepareLicensedAssets
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Automatic-Module-Name': mod_group_id
        )
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
