plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // UI Lib is client-only. Server/common classes must never import it.
    compileOnly "maven.modrinth:AOEDs9Al:${uilib_version_id}"
    implementation "maven.modrinth:8BmcQJ2H:${geckolib_version_id}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    // CanonicalData exposes Gson JSON nodes; tests that audit canonical resource IDs need the type on their compile classpath.
    testImplementation 'com.google.code.gson:gson:2.14.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

neoForge {
    version = project.neo_version
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        configureEach { logLevel = org.slf4j.event.Level.INFO }
    }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// GitHub's text-only connector cannot reliably preserve arbitrary PNG bytes. Keep the repaired
// Elysia texture as canonical Base64 text and deterministically restore the exact PNG for every
// build/run. This also prevents malformed ancillary/trailing chunks from reappearing.
var generateElysiaTexture = tasks.register('generateElysiaTexture') {
    def inputFile = file('src/main/resources/assets/turnbound/textures/entity/hero/elysia.png.b64')
    def outputDir = layout.buildDirectory.dir('generated/resources/elysia')
    inputs.file inputFile
    outputs.dir outputDir
    doLast {
        def outputFile = outputDir.get().file('assets/turnbound/textures/entity/hero/elysia.png').asFile
        outputFile.parentFile.mkdirs()
        outputFile.bytes = java.util.Base64.getDecoder().decode(inputFile.getText('UTF-8').trim())
    }
}
sourceSets.main.resources.srcDir generateElysiaTexture
neoForge.ideSyncTask generateElysiaTexture

tasks.withType(ProcessResources).configureEach {
    exclude 'assets/turnbound/textures/entity/hero/elysia.png.b64'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

test {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showExceptions true
        showCauses true
        showStackTraces true
    }
}

jar {
    manifest {
        attributes(
            'Specification-Title': mod_name,
            'Specification-Version': mod_version,
            'Implementation-Title': mod_name,
            'Implementation-Version': mod_version,
            'Automatic-Module-Name': mod_group_id
        )
    }
}

idea { module { downloadSources = true; downloadJavadoc = true } }
