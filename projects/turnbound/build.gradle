plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}

group = project.mod_group_id
version = project.mod_version
base { archivesName = project.mod_id }

// Preserve old 26.2 NeoForge sources and resources in Git, but never package them as a
// Fabric JAR. Only explicitly migrated sources are accepted into the new runtime.
sourceSets {
    main {
        java { srcDirs = ['src/fabric/java'] }
        resources { srcDirs = ['src/fabric/resources'] }
    }
    test {
        java { srcDirs = ['src/fabricTest/java'] }
        resources { srcDirs = ['src/fabricTest/resources'] }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(17) }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

test {
    useJUnitPlatform()
}
