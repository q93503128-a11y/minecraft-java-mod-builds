license="${mod_license}"
issueTrackerURL="https://github.com/q93503128-a11y/minecraft-java-mod-builds/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayURL="https://github.com/q93503128-a11y/minecraft-java-mod-builds"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="iris"
type="required"
versionRange="${iris_version_range}"
ordering="BEFORE"
side="CLIENT"
reason="Shader Lab includes the required Iris NeoForge build inside its single JAR."

[[dependencies.${mod_id}]]
modId="sodium"
type="required"
versionRange="${sodium_version_range}"
ordering="BEFORE"
side="CLIENT"
reason="Shader Lab includes the required Sodium NeoForge build inside its single JAR."
