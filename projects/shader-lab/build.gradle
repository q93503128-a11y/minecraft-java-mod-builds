import groovy.json.JsonSlurper
import java.util.zip.ZipFile

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            iris_version_range      : iris_version_range,
            sodium_version_range    : sodium_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

final String sarpProject = project.sarp_project
final String sarpVersionId = project.sarp_version_id
final String dreamscapePackName = project.shader_pack_name
final File generatedResources = layout.buildDirectory.dir('generated/shaderlabResources').get().asFile
final File generatedShaderpack = new File(generatedResources, "shaderpacks/${dreamscapePackName}")
final File sarpAuditReport = layout.buildDirectory.file('reports/sarp-source-audit.txt').get().asFile
final File sarpWorkDirectory = layout.buildDirectory.dir('sarp').get().asFile

tasks.register('prepareDreamscapeShaderpack', Exec) {
    group = 'shaderlab'
    description = 'Downloads, verifies and stages the official pinned Sarp shader release.'

    inputs.file file('scripts/prepare_sarp.py')
    inputs.property 'sarpProject', sarpProject
    inputs.property 'sarpVersionId', sarpVersionId
    outputs.files generatedShaderpack, sarpAuditReport

    workingDir projectDir
    commandLine(
            'python3',
            'scripts/prepare_sarp.py',
            '--project', sarpProject,
            '--version', sarpVersionId,
            '--work-dir', sarpWorkDirectory.absolutePath,
            '--output', generatedShaderpack.absolutePath,
            '--report', sarpAuditReport.absolutePath
    )
}

sourceSets.main.resources.srcDir generatedResources

tasks.named('processResources') {
    dependsOn tasks.named('prepareDreamscapeShaderpack')
}

tasks.register('verifyShaderpackResources') {
    group = 'verification'
    description = 'Validates the embedded Iris shaderpack and confirms the rejected overlay is absent.'
    dependsOn tasks.named('prepareDreamscapeShaderpack')

    doLast {
        if (!generatedShaderpack.isFile() || generatedShaderpack.length() < 70_000L) {
            throw new GradleException("Generated shaderpack is missing or unexpectedly small: ${generatedShaderpack}")
        }

        new ZipFile(generatedShaderpack).withCloseable { pack ->
            Set<String> entries = pack.entries().collect { it.name } as Set

            [
                    'SHADERLAB_ATTRIBUTION.md',
                    'MODRINTH_LICENSE_EVIDENCE.json'
            ].each { required ->
                if (!entries.contains(required)) {
                    throw new GradleException("Dreamscape shaderpack is missing ${required}")
                }
            }

            if (!entries.any { it.toLowerCase().contains('license') || it.toLowerCase().contains('mit') }) {
                throw new GradleException('Dreamscape shaderpack is missing an MIT license notice')
            }
            if (!entries.any { it.toLowerCase().contains('water') }) {
                throw new GradleException('Dreamscape shaderpack is missing a water-specific program')
            }
            if (!entries.any { it.toLowerCase().contains('terrain') }) {
                throw new GradleException('Dreamscape shaderpack is missing a terrain-specific program')
            }

            def evidenceEntry = pack.getEntry('MODRINTH_LICENSE_EVIDENCE.json')
            def evidence = new JsonSlurper().parse(pack.getInputStream(evidenceEntry))
            if (evidence?.project_license?.id != 'MIT'
                    || evidence?.version_id != sarpVersionId
                    || evidence?.project_slug != sarpProject) {
                throw new GradleException('Embedded Modrinth license evidence does not match the pinned Sarp release')
            }

            if (pack.testzip() != null) {
                throw new GradleException('Generated Dreamscape shaderpack contains a corrupt ZIP member')
            }
        }

        def packMeta = new JsonSlurper().parse(file('src/main/resources/pack.mcmeta'))
        if (packMeta?.pack?.min_format != [88, 0] || packMeta?.pack?.max_format != [107, 1]) {
            throw new GradleException('Minecraft 26.2 mod resources must cover resource format 88.0 and data format 107.1')
        }

        String bootstrap = file('src/main/java/kr/moonseungjun/shaderlab/ShaderLab.java').getText('UTF-8')
        if (bootstrap.contains('setPostEffect') || bootstrap.contains('lush_grade')) {
            throw new GradleException('The rejected screen-space post-effect path is still referenced by Java code')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyShaderpackResources')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Automatic-Module-Name': mod_group_id,
                'ShaderLab-Sarp-Version': sarpVersionId,
                'ShaderLab-Shaderpack': dreamscapePackName
        )
    }
}

tasks.register('writeJarChecksum') {
    dependsOn tasks.named('jar')

    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def hash = digest.digest().collect { String.format('%02x', it) }.join()
        file("${jarFile.absolutePath}.sha256").text = "${hash}  ${jarFile.name}\n"
    }
}

tasks.named('build') {
    finalizedBy tasks.named('writeJarChecksum')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
