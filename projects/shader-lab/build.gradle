import groovy.json.JsonSlurper
import java.util.zip.ZipFile

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            iris_version_range      : iris_version_range,
            sodium_version_range    : sodium_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

final String nobleProject = project.noble_project
final String nobleVersionId = project.noble_version_id
final String reveriePackName = project.shader_pack_name
final File generatedResources = layout.buildDirectory.dir('generated/shaderlabResources').get().asFile
final File generatedShaderpack = new File(generatedResources, "shaderpacks/${reveriePackName}")
final File nobleAuditReport = layout.buildDirectory.file('reports/noble-source-audit.txt').get().asFile
final File nobleWorkDirectory = layout.buildDirectory.dir('noble').get().asFile

final File bundledModsDirectory = layout.buildDirectory.dir('bundled-renderer-mods').get().asFile
final File bundledIrisJar = new File(bundledModsDirectory, 'iris-1.11.2+26.2-neoforge.jar')
final File bundledSodiumJar = new File(bundledModsDirectory, 'sodium-0.9.1+26.2-neoforge.jar')
final File bundledRendererReport = layout.buildDirectory.file('reports/bundled-renderer-mods.json').get().asFile

tasks.register('prepareReverieShaderpack', Exec) {
    group = 'shaderlab'
    description = 'Downloads, verifies and stages the official Noble shader release.'

    inputs.file file('scripts/prepare_noble.py')
    inputs.property 'nobleProject', nobleProject
    inputs.property 'nobleVersionId', nobleVersionId
    outputs.files generatedShaderpack, nobleAuditReport

    workingDir projectDir
    commandLine(
            'python3',
            'scripts/prepare_noble.py',
            '--project', nobleProject,
            '--version', nobleVersionId,
            '--work-dir', nobleWorkDirectory.absolutePath,
            '--output', generatedShaderpack.absolutePath,
            '--report', nobleAuditReport.absolutePath
    )
}

tasks.register('downloadBundledRendererMods', Exec) {
    group = 'shaderlab'
    description = 'Downloads and verifies pinned NeoForge Iris and Sodium builds for Jar-in-Jar.'

    inputs.file file('scripts/download_renderer_mods.py')
    inputs.property 'irisVersion', project.iris_modrinth_version_id
    inputs.property 'sodiumVersion', project.sodium_modrinth_version_id
    outputs.files bundledIrisJar, bundledSodiumJar, bundledRendererReport

    workingDir projectDir
    commandLine(
            'python3',
            'scripts/download_renderer_mods.py',
            '--iris-version', project.iris_modrinth_version_id,
            '--sodium-version', project.sodium_modrinth_version_id,
            '--output-dir', bundledModsDirectory.absolutePath,
            '--report', bundledRendererReport.absolutePath
    )
}

sourceSets.main.resources.srcDir generatedResources

tasks.named('processResources') {
    dependsOn tasks.named('prepareReverieShaderpack')
}

dependencies {
    jarJar files(bundledIrisJar, bundledSodiumJar)
}

tasks.named('jar') {
    archiveClassifier = 'thin'
}

tasks.named('jarJar') {
    dependsOn tasks.named('downloadBundledRendererMods')
    archiveClassifier = ''
}

tasks.named('assemble') {
    dependsOn tasks.named('jarJar')
}

tasks.register('verifyShaderpackResources') {
    group = 'verification'
    description = 'Validates the embedded Noble shaderpack and confirms the rejected overlay is absent.'
    dependsOn tasks.named('prepareReverieShaderpack')

    doLast {
        if (!generatedShaderpack.isFile() || generatedShaderpack.length() < 100_000L) {
            throw new GradleException("Generated Reverie shaderpack is missing or unexpectedly small: ${generatedShaderpack}")
        }

        new ZipFile(generatedShaderpack).withCloseable { pack ->
            Set<String> entries = pack.entries().collect { it.name } as Set
            ['SHADERLAB_ATTRIBUTION.md', 'MODRINTH_LICENSE_EVIDENCE.json'].each { required ->
                if (!entries.contains(required)) {
                    throw new GradleException("Reverie shaderpack is missing ${required}")
                }
            }
            if (!entries.any { it.toLowerCase().contains('license') || it.toLowerCase().contains('copying') }) {
                throw new GradleException('Reverie shaderpack is missing the Noble GPLv3 license')
            }
            if (!entries.any { it.toLowerCase().contains('water') }) {
                throw new GradleException('Reverie shaderpack is missing water programs')
            }
            if (!entries.any { it.toLowerCase().contains('terrain') || it.toLowerCase().contains('gbuffers') }) {
                throw new GradleException('Reverie shaderpack is missing world material programs')
            }

            def evidence = new JsonSlurper().parse(pack.getInputStream(pack.getEntry('MODRINTH_LICENSE_EVIDENCE.json')))
            if (!(evidence?.project_license?.id in ['GPL-3.0-only', 'GPL-3.0-or-later'])
                    || evidence?.project_slug != nobleProject) {
                throw new GradleException('Embedded Noble license evidence is invalid')
            }
        }

        def packMeta = new JsonSlurper().parse(file('src/main/resources/pack.mcmeta'))
        if (packMeta?.pack?.min_format != [88, 0] || packMeta?.pack?.max_format != [107, 1]) {
            throw new GradleException('Minecraft 26.2 mod resources must cover resource format 88.0 and data format 107.1')
        }

        String bootstrap = file('src/main/java/kr/moonseungjun/shaderlab/ShaderLab.java').getText('UTF-8')
        if (bootstrap.contains('setPostEffect') || bootstrap.contains('lush_grade')) {
            throw new GradleException('The rejected screen-space post-effect path is still referenced by Java code')
        }
    }
}

tasks.register('verifySingleJar') {
    group = 'verification'
    description = 'Verifies that the deliverable contains Shader Lab, Noble, Iris and Sodium in one JAR.'
    dependsOn tasks.named('jarJar')

    doLast {
        def output = tasks.named('jarJar').get().archiveFile.get().asFile
        if (!output.isFile() || output.length() < 3_000_000L) {
            throw new GradleException("Single JAR output is missing or too small: ${output}")
        }
        new ZipFile(output).withCloseable { jarFile ->
            Set<String> entries = jarFile.entries().collect { it.name } as Set
            if (!entries.contains('META-INF/jarjar/metadata.json')) {
                throw new GradleException('Single JAR is missing NeoForge Jar-in-Jar metadata')
            }
            if (!entries.any { it.startsWith('META-INF/jarjar/') && it.contains('iris') && it.endsWith('.jar') }) {
                throw new GradleException('Single JAR is missing bundled Iris')
            }
            if (!entries.any { it.startsWith('META-INF/jarjar/') && it.contains('sodium') && it.endsWith('.jar') }) {
                throw new GradleException('Single JAR is missing bundled Sodium')
            }
            if (!entries.contains("shaderpacks/${reveriePackName}")) {
                throw new GradleException('Single JAR is missing the Reverie shaderpack')
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyShaderpackResources')
}

tasks.named('build') {
    dependsOn tasks.named('verifySingleJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

tasks.named('jarJar') {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Automatic-Module-Name': mod_group_id,
                'ShaderLab-Upstream': 'Noble Shaders',
                'ShaderLab-Shaderpack': reveriePackName,
                'ShaderLab-Single-Jar': 'true'
        )
    }
}

tasks.register('writeJarChecksum') {
    dependsOn tasks.named('jarJar')

    doLast {
        def jarFile = tasks.named('jarJar').get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def hash = digest.digest().collect { String.format('%02x', it) }.join()
        file("${jarFile.absolutePath}.sha256").text = "${hash}  ${jarFile.name}\n"
    }
}

tasks.named('build') {
    finalizedBy tasks.named('writeJarChecksum')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
