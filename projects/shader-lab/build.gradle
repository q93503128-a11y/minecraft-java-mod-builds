import groovy.json.JsonSlurper
import java.net.URI
import java.nio.file.Files
import java.nio.file.StandardCopyOption
import java.util.zip.ZipFile

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            iris_version_range      : iris_version_range,
            sodium_version_range    : sodium_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

final String sarpProject = project.sarp_project
final String sarpVersionId = project.sarp_version_id
final String dreamscapePackName = project.shader_pack_name
final File sarpArchive = layout.buildDirectory.file("sarp/sarp-${sarpVersionId}.zip").get().asFile
final File sarpUnpack = layout.buildDirectory.dir('sarp/unpack').get().asFile
final File sarpStage = layout.buildDirectory.dir('sarp/stage').get().asFile
final File generatedResources = layout.buildDirectory.dir('generated/shaderlabResources').get().asFile
final File generatedShaderpack = new File(generatedResources, "shaderpacks/${dreamscapePackName}")
final File sarpAuditReport = layout.buildDirectory.file('reports/sarp-source-audit.txt').get().asFile

static Object fetchJson(String url) {
    URI.create(url).toURL().withInputStream { input ->
        return new JsonSlurper().parse(input)
    }
}

static void downloadTo(String url, File destination) {
    destination.parentFile.mkdirs()
    URI.create(url).toURL().withInputStream { input ->
        Files.copy(input, destination.toPath(), StandardCopyOption.REPLACE_EXISTING)
    }
}

tasks.register('prepareDreamscapeShaderpack') {
    group = 'shaderlab'
    description = 'Downloads and audits the official pinned MIT Sarp Shaders release, then embeds it unchanged.'
    outputs.files generatedShaderpack, sarpAuditReport

    doLast {
        def projectMetadata = fetchJson("https://api.modrinth.com/v2/project/${sarpProject}")
        def versionMetadata = fetchJson("https://api.modrinth.com/v2/version/${sarpVersionId}")

        if (projectMetadata?.project_type != 'shader') {
            throw new GradleException('Pinned Sarp project is not a Modrinth shader project')
        }
        if (projectMetadata?.license?.id != 'MIT') {
            throw new GradleException("Pinned Sarp project is not MIT: ${projectMetadata?.license}")
        }
        if (versionMetadata?.project_id != projectMetadata?.id) {
            throw new GradleException('Pinned Sarp version does not belong to the configured project')
        }
        if (!(versionMetadata?.game_versions instanceof List) || !versionMetadata.game_versions.contains('26.2')) {
            throw new GradleException('Pinned Sarp version does not declare Minecraft 26.2 support')
        }
        if (!(versionMetadata?.loaders instanceof List) || !versionMetadata.loaders.contains('iris')) {
            throw new GradleException('Pinned Sarp version does not declare Iris support')
        }

        def files = versionMetadata.files
        if (!(files instanceof List) || files.isEmpty()) {
            throw new GradleException('Pinned Sarp version has no downloadable files')
        }
        def selectedFile = files.find { it.primary } ?: files[0]
        if (!selectedFile?.url || !selectedFile?.filename?.toString()?.toLowerCase()?.endsWith('.zip')) {
            throw new GradleException("Pinned Sarp primary file is not a ZIP: ${selectedFile}")
        }

        if (!sarpArchive.isFile() || sarpArchive.length() == 0L) {
            downloadTo(selectedFile.url.toString(), sarpArchive)
        }

        String expectedSha512 = selectedFile?.hashes?.sha512?.toString()
        if (expectedSha512) {
            def digest = java.security.MessageDigest.getInstance('SHA-512')
            sarpArchive.withInputStream { stream ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = stream.read(buffer)) != -1) {
                    digest.update(buffer, 0, read)
                }
            }
            String actualSha512 = digest.digest().collect { String.format('%02x', it) }.join()
            if (!actualSha512.equalsIgnoreCase(expectedSha512)) {
                throw new GradleException('Pinned Sarp archive SHA-512 does not match Modrinth metadata')
            }
        }

        delete sarpUnpack, sarpStage
        sarpUnpack.mkdirs()
        sarpStage.mkdirs()
        copy {
            from zipTree(sarpArchive)
            into sarpUnpack
        }

        File sourceRoot
        if (new File(sarpUnpack, 'shaders').isDirectory()) {
            sourceRoot = sarpUnpack
        } else {
            sourceRoot = sarpUnpack.listFiles()?.find { candidate ->
                candidate.isDirectory() && new File(candidate, 'shaders').isDirectory()
            }
        }
        if (sourceRoot == null) {
            throw new GradleException('Sarp archive does not contain a shaderpack root with shaders/')
        }

        copy {
            from sourceRoot
            into sarpStage
        }

        List<File> allFiles = []
        sarpStage.eachFileRecurse { file ->
            if (file.isFile()) allFiles.add(file)
        }
        List<String> relativeNames = allFiles.collect {
            sarpStage.toPath().relativize(it.toPath()).toString().replace('\\', '/')
        }.sort()

        List<File> licenseFiles = allFiles.findAll { file ->
            String name = file.name.toLowerCase()
            name == 'license' || name.startsWith('license.') || name.contains('mit')
        }
        if (licenseFiles.isEmpty()) {
            throw new GradleException('Sarp archive is labelled MIT but does not preserve a license file; redistribution stopped')
        }
        String licenseText = licenseFiles.collect { it.getText('UTF-8') }.join('\n')
        if (!licenseText.contains('MIT License') && !licenseText.contains('Permission is hereby granted')) {
            throw new GradleException('Sarp archive license file does not contain the MIT grant')
        }

        List<String> waterPrograms = relativeNames.findAll {
            String lower = it.toLowerCase()
            lower.contains('gbuffers_water') || lower.contains('/water.') || lower.contains('water_')
        }
        List<String> terrainPrograms = relativeNames.findAll {
            String lower = it.toLowerCase()
            lower.contains('gbuffers_terrain') || lower.contains('/terrain.')
        }
        if (waterPrograms.isEmpty() || terrainPrograms.isEmpty()) {
            throw new GradleException('Sarp archive does not expose separate water and terrain shader programs')
        }

        String searchableSource = allFiles.findAll {
            it.name.endsWith('.glsl') || it.name.endsWith('.fsh') || it.name.endsWith('.vsh') || it.name.endsWith('.properties')
        }.collect { file ->
            try {
                return file.getText('UTF-8')
            } catch (Exception ignored) {
                return ''
            }
        }.join('\n').toLowerCase()

        ['aurora', 'caustic', 'refract', 'fog'].each { token ->
            if (!searchableSource.contains(token)) {
                throw new GradleException("Sarp source audit did not find required feature token: ${token}")
            }
        }

        new File(sarpStage, 'SHADERLAB_ATTRIBUTION.md').setText(
                """# Shader Lab Dreamscape attribution\n\n""" +
                "This private test bundle contains an unmodified official Sarp Shaders release.\n\n" +
                "- Creator: xsoras / Sarp\n" +
                "- Project: https://modrinth.com/shader/sarp\n" +
                "- Modrinth version ID: ${sarpVersionId}\n" +
                "- Original filename: ${selectedFile.filename}\n" +
                "- License: MIT; original license file preserved inside this archive\n" +
                "- Shader Lab code does not claim authorship of the Sarp renderer\n",
                'UTF-8'
        )

        sarpAuditReport.parentFile.mkdirs()
        sarpAuditReport.setText(
                """Sarp source audit: PASS\n""" +
                "Project ID: ${projectMetadata.id}\n" +
                "Project slug: ${projectMetadata.slug}\n" +
                "Version ID: ${sarpVersionId}\n" +
                "Version number: ${versionMetadata.version_number}\n" +
                "Original filename: ${selectedFile.filename}\n" +
                "Original bytes: ${sarpArchive.length()}\n" +
                "License: ${projectMetadata.license.id}\n" +
                "License files: ${licenseFiles.collect { sarpStage.toPath().relativize(it.toPath()).toString() }}\n" +
                "Water programs: ${waterPrograms}\n" +
                "Terrain programs: ${terrainPrograms}\n" +
                "Total files: ${relativeNames.size()}\n\n" +
                "File list:\n" + relativeNames.join('\n') + "\n",
                'UTF-8'
        )

        generatedShaderpack.parentFile.mkdirs()
        delete generatedShaderpack
        ant.zip(destfile: generatedShaderpack, basedir: sarpStage, level: 9)
    }
}

sourceSets.main.resources.srcDir generatedResources

tasks.named('processResources') {
    dependsOn tasks.named('prepareDreamscapeShaderpack')
}

tasks.register('verifyShaderpackResources') {
    group = 'verification'
    description = 'Validates the embedded official Sarp Iris shaderpack and removal of the rejected post effect.'
    dependsOn tasks.named('prepareDreamscapeShaderpack')

    doLast {
        if (!generatedShaderpack.isFile() || generatedShaderpack.length() < 70_000L) {
            throw new GradleException("Generated shaderpack is missing or unexpectedly small: ${generatedShaderpack}")
        }

        new ZipFile(generatedShaderpack).withCloseable { pack ->
            Set<String> entries = pack.entries().collect { it.name } as Set
            if (!entries.contains('SHADERLAB_ATTRIBUTION.md')) {
                throw new GradleException('Dreamscape shaderpack is missing Shader Lab attribution')
            }
            if (!entries.any { it.toLowerCase().contains('gbuffers_water') || it.toLowerCase().contains('/water.') }) {
                throw new GradleException('Dreamscape shaderpack is missing a water-specific render program')
            }
            if (!entries.any { it.toLowerCase().contains('gbuffers_terrain') || it.toLowerCase().contains('/terrain.') }) {
                throw new GradleException('Dreamscape shaderpack is missing a terrain-specific render program')
            }
            if (!entries.any { it.toLowerCase().contains('license') || it.toLowerCase().contains('mit') }) {
                throw new GradleException('Dreamscape shaderpack is missing the original MIT license')
            }
        }

        File packFile = file('src/main/resources/pack.mcmeta')
        def packMeta = new JsonSlurper().parse(packFile)
        if (packMeta?.pack?.min_format != [88, 0] || packMeta?.pack?.max_format != [107, 1]) {
            throw new GradleException('Minecraft 26.2 mod resources must cover resource format 88.0 and data format 107.1')
        }

        String bootstrap = file('src/main/java/kr/moonseungjun/shaderlab/ShaderLab.java').getText('UTF-8')
        if (bootstrap.contains('setPostEffect') || bootstrap.contains('lush_grade')) {
            throw new GradleException('The rejected screen-space post-effect path is still referenced by Java code')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyShaderpackResources')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Automatic-Module-Name': mod_group_id,
                'ShaderLab-Sarp-Version': sarpVersionId,
                'ShaderLab-Shaderpack': dreamscapePackName
        )
    }
}

tasks.register('writeJarChecksum') {
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def hash = digest.digest().collect { String.format('%02x', it) }.join()
        file("${jarFile.absolutePath}.sha256").text = "${hash}  ${jarFile.name}\n"
    }
}

tasks.named('build') {
    finalizedBy tasks.named('writeJarChecksum')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
