import groovy.json.JsonSlurper

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('verifyShaderResources') {
    group = 'verification'
    description = 'Validates the Shader Lab 26.2 seven-pass bloom pipeline and GLSL sources.'

    doLast {
        def effectFile = file('src/main/resources/assets/shaderlab/post_effect/lush_grade.json')
        def extractFile = file('src/main/resources/assets/shaderlab/shaders/post/bloom_extract.fsh')
        def blurFile = file('src/main/resources/assets/shaderlab/shaders/post/bloom_blur.fsh')
        def compositeFile = file('src/main/resources/assets/shaderlab/shaders/post/lush_grade.fsh')
        def packFile = file('src/main/resources/pack.mcmeta')

        [effectFile, extractFile, blurFile, compositeFile, packFile].each { required ->
            if (!required.isFile() || required.length() == 0L) {
                throw new GradleException("Missing or empty required shader resource: ${required}")
            }
        }

        def effect = new JsonSlurper().parse(effectFile)
        if (!(effect.targets instanceof Map)
                || !effect.targets.keySet().containsAll(['bloom_a', 'bloom_b', 'final'])
                || !(effect.passes instanceof List)
                || effect.passes.size() != 7) {
            throw new GradleException('lush_grade.json must declare bloom_a, bloom_b and final targets with exactly seven passes')
        }

        def firstPass = effect.passes[0]
        def compositePass = effect.passes[5]
        def finalPass = effect.passes[6]

        if (firstPass.vertex_shader != 'minecraft:core/screenquad'
                || firstPass.fragment_shader != 'shaderlab:post/bloom_extract'
                || firstPass.output != 'bloom_a') {
            throw new GradleException('The bright-pass extraction stage does not match the Minecraft 26.2 post-effect contract')
        }

        if (compositePass.fragment_shader != 'shaderlab:post/lush_grade'
                || compositePass.output != 'final'
                || !(compositePass.inputs instanceof List)
                || compositePass.inputs.size() != 3) {
            throw new GradleException('The cinematic composite stage must consume scene, bloom and depth inputs')
        }

        if (finalPass.fragment_shader != 'minecraft:post/blit'
                || finalPass.output != 'minecraft:main') {
            throw new GradleException('The final pass must blit the composited target back to minecraft:main')
        }

        def blurPasses = effect.passes.subList(1, 5)
        if (!blurPasses.every { pass ->
            pass.fragment_shader == 'shaderlab:post/bloom_blur'
                    && pass.uniforms?.BloomBlurConfig instanceof List
        }) {
            throw new GradleException('All four glow-spread passes must use bloom_blur and BloomBlurConfig')
        }

        def pack = new JsonSlurper().parse(packFile)
        if (pack?.pack?.min_format != [88, 0] || pack?.pack?.max_format != [107, 1]) {
            throw new GradleException('Minecraft 26.2 mod resources must cover resource format 88.0 and data format 107.1')
        }

        [extractFile, blurFile, compositeFile].each { shaderFile ->
            def shaderText = shaderFile.getText('UTF-8')
            ['#version 330', 'out vec4 fragColor'].each { token ->
                if (!shaderText.contains(token)) {
                    throw new GradleException("${shaderFile.name} is missing required token: ${token}")
                }
            }
        }

        def compositeText = compositeFile.getText('UTF-8')
        ['SceneSampler', 'BloomSampler', 'SceneDepthSampler', 'acesTonemap', 'pearlescentBloom'].each { token ->
            if (!compositeText.contains(token)) {
                throw new GradleException("Cinematic composite shader is missing required token: ${token}")
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyShaderResources')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

jar {
    manifest {
        attributes(
                'Specification-Title': mod_name,
                'Specification-Version': mod_version,
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Automatic-Module-Name': mod_group_id
        )
    }
}

tasks.register('writeJarChecksum') {
    dependsOn tasks.named('jar')
    doLast {
        def jarFile = tasks.named('jar').get().archiveFile.get().asFile
        def digest = java.security.MessageDigest.getInstance('SHA-256')
        jarFile.withInputStream { stream ->
            byte[] buffer = new byte[8192]
            int read
            while ((read = stream.read(buffer)) != -1) {
                digest.update(buffer, 0, read)
            }
        }
        def hash = digest.digest().collect { String.format('%02x', it) }.join()
        file("${jarFile.absolutePath}.sha256").text = "${hash}  ${jarFile.name}\n"
    }
}

tasks.named('build') {
    finalizedBy tasks.named('writeJarChecksum')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
