mod_description=Shared survival settlement growth with physical construction/logistics, bounded medium-terrain work using real retaining stone, exploration/conquest milestones, real-wood fishing-outpost piers with opt-in physical fish trade, domain relic reforging for compatible external weapons, supplied humanoid military presentation without server-side weapon minting, bounded selected-area civil works with physical imported fill hauling, retaining-heavy 17x17 terraces with exact cobblestone hauling, and bounded long-bridge/ravine crossings with persisted physical stone piers, plus physical save-compatible straight tunnel excavation, plus bounded one-bend tunnel public works with physically hauled stone-brick portals, and capped non-farmable exploration knowledge that improves existing outpost surveying and physical construction efficiency, plus soft common-biome-tag evidence that improves outpost specialization without hard worldgen dependencies, and automated physical barracks armament from real external-weapon ItemStacks without per-soldier micromanagement, plus multiplayer snapshot/session pre-acceptance hardening and one centralized service-level shared-project authority gate, plus rollback-safe ordinary building and terrain material transactions, and rollback-safe outpost grading cells, plus road-bound physical remote-sentry external-weapon reverse supply through the existing transporter, with in-flight stale-demand return and exact transporter-cargo death recovery, plus atomic food-funded worker arrival commits that never charge population/resources for a failed entity spawn, and exact death recovery for real MAINHAND cargo carried by local production/workshop civilians, plus loaded-evidence-safe civilian population/replacement authority with food-funded advanced artisans, and fail-closed outpost transporter assignment evidence that prevents unloaded route-bound residents from being mistaken for dead/missing replacements, plus rest-anchor-aware civilian lifecycle evidence that uses the same work/storage/housing bounds for lookup and absence authority, plus multiplicity-safe assigned-worker accounting that counts every loaded physical duplicate while only zero workers can trigger replacement and UUID order selects the sole active worker, plus fail-closed specialized-outpost production-worker absence evidence, deterministic UUID authority, exact MAINHAND cargo death recovery, and world-success-before-ItemStack production transactions, plus route-evidence-safe barracks recruitment and non-destructive construction-office runner duplicate containment with exact cargo preservation, plus full-audit authority hardening for the shared builder, rollback-safe road grading and waterfront placement, transactional founding, loaded-evidence civic guards/traders/fishing workers, exact builder/fishing cargo recovery, and no-drop renewable civic guards, plus exploration-feedback progression where unique surveys/conquests improve physical relic market payouts, metal-based weapon repair efficiency, and advanced weapon forging power without adding a currency, menu, or virtual resource authority, plus bounded first-kill external-hostile field knowledge that reduces real barracks recruitment food cost from 8 to a minimum of 5 and expands loaded garrison threat detection from 28 to at most 40 blocks without companion class dependencies or item minting, plus soft external-structure archetype knowledge that makes discovered forts, trade settlements, industrial sites, and ruins improve different existing settlement systems without hard companion dependencies or new NPC micromanagement, plus bounded trade/industrial structure knowledge that biases agriculture/quarry outpost specialization while metadata and biome evidence alone remain below specialization thresholds, plus domain-only diversified productive-outpost network feedback that strengthens existing physical market, repair and forging services without a new currency, menu, worker or logistics authority, plus capped domain/cart-station territory-network freight efficiency that raises only real productive outpost-to-town pickup batches while preserving reverse-supply caps and the single physical transporter authority, plus pre-playtest manual-audit hardening that charges matching pre-placed outpost blueprint steps and rejects ambiguous/relic/weapon resource tags from settlement cost accounting, plus Alpha.80 client-boot hardening that defers the presentation-only service-sword ItemStack until real render-state extraction after registry component binding and audits client code against registry-backed static ItemStack initialization, plus Alpha.81 first-run UI, category-first construction palette, in-game guide, pre-founding HUD guidance, and Korean companion language overlays, plus Alpha.82 collision-safe pack key profile with M as the Frontier settlement menu and default-only Xaero quick-waypoint B normalization that preserves user-customized controls, plus Alpha.83 late-game landmark progression with a civic hall, trade hall and citadel, a derived Frontier Capital end-state, physical landmark construction, stronger domain public works, trade-hall market value, citadel watch coverage, and a clear endgame guidance line without a new currency or save ledger.

# Alpha.84 independent worker runtime: villager visuals only, Frontier-owned worker AI and construction recovery.

# Alpha.85 construction pacing: per-tick building service, faster visible grading/building, larger physical haul batches.
# Alpha.85 canonical verification trigger.

# Alpha.86 construction pacing: hysteretic 64-item site restock, wide local work envelope, 1/2-tick grade/build cadence.
# Alpha.86 companion verification trigger.

# Alpha.87 production logistics: one-stack batching, wider loaded-only search, automatic farm replanting, and non-blocking 100% construction finalization.
# Alpha.87 canonical and companion verification trigger.

# Alpha.88 worker runtime recovery: walkable interaction approaches, attackable workers, completion-first finalization.
# Alpha.88 canonical and companion verification trigger.

# Alpha.89 duplicate-worker recovery: loaded-evidence-safe physical cleanup for production workers and the shared builder.
# Alpha.89 canonical and companion verification trigger.

# Alpha.91 navigation/storage hardening: expanded bounded resource search, complete-path water-safe routing, jobsite barrels, and four-barrel public stockpile.

# Alpha.90 maintenance recovery: explicit /frontier normalize, 100% farm finalization repair, reachable trunk-base lumber targeting, dominant-species stack hauling, and loaded duplicate cleanup.
# Alpha.90 canonical and companion verification trigger.

# Alpha.93 builder recovery: all building heights are constructed from safe ground-perimeter work cells; legacy stair scaffolds retire safely and builder spawn/home positions are surface-safe.

# Alpha.94 builder site-envelope recovery: once the physical builder reaches the local construction zone it may place every blueprint height from ground level; /frontier status now reports an unreachable site instead of silently stalling.

# Alpha.95 dropped-item cleanup: /frontier cleanup drops removes nearby terrain-stone clutter; explicit /frontier cleanup drops all removes every nearby dropped item and reports entity/item counts.

# Alpha.97 construction recovery: trust fresh vanilla navigation instead of re-rejecting legal partial-block paths, require the builder to be on plausible ground before site-envelope authority, and expose grading material/path stalls in the HUD context.

# Alpha.98 residential integrity: severely destroyed completed houses automatically retire their stale settlement record and clear only matching non-container Frontier blueprint remnants so the lot can be rebuilt without a command.

# Alpha.101 economy convenience: vanilla diamonds count as high-value settlement metal while lower-value metal remains the first consumption priority.

# Alpha.102 production integrity: ruined production jobs retire, remote military metal uses canonical value units, and companion ore cargo can return to town.

# Alpha.103 production reach: lumber/quarry workers may perform bounded close-range remote work when the final path cell is obstructed; distant resources still require normal navigation.

# Alpha.104 civil leveling: explicit selected-area bulldoze flattening, scheduler-aligned work cadence, and serialized multi-builder crews scaled by completed construction offices.
