plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = 'kr.moonseungjun'
version = project.mod_version

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    // Compile against the exact candidate-lock Jade API without making Jade a Frontier runtime dependency.
    compileOnly "maven.modrinth:nvQzSEkH:${project.jade_version_id}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Match the NeoForge MDK packaging contract: one canonical gradle.properties source is expanded
// into META-INF/neoforge.mods.toml at build time. This prevents a production JAR from silently
// advertising the development fallback version (0.0NONE).
tasks.withType(ProcessResources).configureEach {
    def replaceProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
        mod_authors            : mod_authors,
        mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
