plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
}

group = 'kr.moonseungjun'
version = project.mod_version

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'XaeroOfficial'
                url = 'https://chocolateminecraft.com/maven'
            }
        }
        filter {
            includeGroup 'xaero.minimap'
            includeGroup 'xaero.lib'
        }
    }
}

dependencies {
    // Compile against exact candidate-lock companion APIs without making either mod a Frontier runtime dependency.
    compileOnly "maven.modrinth:nvQzSEkH:${project.jade_version_id}"
    compileOnly "xaero.minimap:xaerominimap-neoforge-${project.minecraft_version}:${project.xaero_minimap_version}"
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = file('run/client')
        }
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
